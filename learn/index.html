<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Learn • CigarOS 2</title>

  <style>
    :root {
      --bg: #e6edf5;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --shadow-soft: 0 10px 25px rgba(15, 26, 44, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .learn-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }

    /* Top bar to match Loyalty ("‹ Back" + big Learn) */
    .learn-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 4px;
    }

    .learn-back {
      text-decoration: none;
      color: #007aff; /* iOS blue */
      font-size: 16px;
      font-weight: 400;
    }

    .learn-back span {
      margin-right: 2px;
    }

    .learn-title-main {
      margin: 4px 0 16px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* Circle grid – mimic home layout */
    .learn-grid {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px 32px; /* row gap / column gap */
    }

    .learn-circle-link {
      text-decoration: none;
      color: var(--ink);
    }

    .learn-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out, background 0.12s ease-out;
    }

    .learn-circle:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 6px 16px rgba(15, 26, 44, 0.18);
      background: #f9fbff;
    }

    .learn-circle-label {
      font-size: 14px;
      font-weight: 700;  /* bold */
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #000000;    /* black as requested */
      line-height: 1.2;
    }

    @media (min-width: 520px) {
      .learn-shell {
        padding-top: 26px;
      }
      .learn-title-main {
        font-size: 34px;
      }
      .learn-circle {
        width: 130px;
        height: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="learn-shell">
    <!-- Header matching Loyalty -->
    <header class="learn-topbar">
      <a href="/" class="learn-back">
        <span>‹</span>Back
      </a>
    </header>
    <h1 class="learn-title-main">Learn</h1>

    <!-- Circle-only layout like Home screen -->
    <main>
      <div class="learn-grid">
        <!-- Ring -->
        <a href="/learn/ring/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Ring</div>
          </div>
        </a>

        <!-- Vitolas -->
        <a href="/learn/vitolas/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Vitolas</div>
          </div>
        </a>

        <!-- Wrapper Shade -->
        <a href="/learn/wrapper-shade/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Wrapper<br/>Shade</div>
          </div>
        </a>

        <!-- Shapes -->
        <a href="/learn/shapes/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Shapes</div>
          </div>
        </a>

        <!-- Glossary -->
        <a href="/learn/glossary/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Glossary</div>
          </div>
        </a>

        <!-- Brands -->
        <a href="/learn/brands/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Brands</div>
          </div>
        </a>

        <!-- Lists -->
        <a href="/learn/lists/" class="learn-circle-link">
          <div class="learn-circle">
            <div class="learn-circle-label">Lists</div>
          </div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
