<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • CigarOS2</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/learn/learn.css?v=1" />
</head>

<body class="learn-page">
  <!-- background layers -->
  <div class="learn-bg" aria-hidden="true"></div>
  <div class="learn-bg-overlay" aria-hidden="true"></div>

  <header class="learn-topbar">
    <button type="button" class="icon-btn" aria-label="Back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="learn-spacer"></div>

    <button type="button" class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M10.5 18.5a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M16.7 16.7 21 21" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main class="learn-main">
    <h1 class="learn-title">Learn</h1>

    <section class="learn-grid" aria-label="Learn sections">
      <a class="glass-tile" href="/learn/vitolas/">
        <div class="tile-icon">
          <img src="/img/learn/vitolas.png" alt="" loading="lazy">
        </div>
        <div class="tile-label">Vitolas</div>
      </a>

      <a class="glass-tile" href="/learn/shapes/">
        <div class="tile-icon">
          <img src="/img/learn/shapes.png" alt="" loading="lazy">
        </div>
        <div class="tile-label">Shapes</div>
      </a>

      <a class="glass-tile" href="/learn/colors/">
        <div class="tile-icon">
          <img src="/img/learn/colors.png" alt="" loading="lazy">
        </div>
        <div class="tile-label">Colors</div>
      </a>

      <a class="glass-tile" href="/learn/anatomy/">
        <div class="tile-icon">
          <img src="/img/learn/anatomy.png" alt="" loading="lazy">
        </div>
        <div class="tile-label">Anatomy</div>
      </a>

      <a class="glass-tile" href="/learn/ring/">
        <div class="tile-icon">
          <img src="/img/learn/ring.png" alt="" loading="lazy">
        </div>
        <div class="tile-label">Ring</div>
      </a>

      <a class="glass-tile" href="/learn/glossary/">
        <div class="tile-icon">
          <img src="/img/learn/glossary.png" alt="" loading="lazy">
        </div>
        <div class="tile-label">Glossary</div>
      </a>
    </section>
  </main>
</body>
</html>
