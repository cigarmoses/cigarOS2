<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Learn • CigarOS 2</title>

  <!-- Global POS + type system -->
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #e6edf5;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --shadow-soft: 0 10px 25px rgba(15, 26, 44, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      font-family: var(--font-text); /* SF Pro Text */
      -webkit-font-smoothing: antialiased;
    }

    .learn-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }

    /* Topbar (same as Loyalty / News / Hub) */
    .learn-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 2px 0 0;
    }

    .learn-back {
      color: #007aff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .learn-title-main {
      font-family: var(--font-display); /* SF Pro Display Heavy */
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 10px 0 18px;
    }

    /* Icon circle grid */
    .learn-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px 32px;
      margin-top: 4px;
    }

    .learn-circle-link {
      text-decoration: none;
      color: var(--ink);
    }

    .learn-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out, background 0.12s ease-out;
    }

    .learn-circle:active {
      transform: translateY(1px) scale(0.97);
      background: #f9fbff;
      box-shadow: 0 6px 16px rgba(15, 26, 44, 0.18);
    }

    .learn-circle-label {
      font-family: var(--font-display); /* Use Display for icon labels */
      font-size: 14px;
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.2;
    }

    @media (min-width: 520px) {
      .learn-shell { padding-top: 26px; }
      .learn-title-main { font-size: 34px; }
      .learn-circle { width: 130px; height: 130px; }
    }

    /* Tony floating button */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border: none;
      background: transparent;
      padding: 0;
      z-index: 9999;
    }
    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <div class="learn-shell">

    <header class="learn-topbar">
      <a href="/" class="learn-back"><span>‹</span>Back</a>
    </header>

    <h1 class="learn-title-main">Learn</h1>

    <main>
      <div class="learn-grid">

        <a href="/learn/ring/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Ring</div></div>
        </a>

        <a href="/learn/vitolas/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Vitolas</div></div>
        </a>

        <a href="/learn/wrapper-shade/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Wrapper<br>Shade</div></div>
        </a>

        <a href="/learn/shapes/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Shapes</div></div>
        </a>

        <a href="/learn/glossary/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Glossary</div></div>
        </a>

        <a href="/learn/brands/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Brands</div></div>
        </a>

        <a href="/learn/lists/" class="learn-circle-link">
          <div class="learn-circle"><div class="learn-circle-label">Lists</div></div>
        </a>

      </div>
    </main>
  </div>

  <!-- Tony icon -->
  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script src="/js/tony.js" defer></script>
</body>
</html>
