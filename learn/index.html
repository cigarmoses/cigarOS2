<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/learn/learn.css" />
</head>

<body class="learn-page">

  <!-- TOP BAR (POS MATCH) -->
  <header class="learn-topbar">
    <div class="learn-topbar-left">
      <button type="button" class="learn-back" onclick="history.back()">
        <span class="learn-back-icon">←</span>
      </button>
      <h1 class="learn-title">Learn</h1>
    </div>

    <!-- Search icon (SVG so it matches iOS blue perfectly) -->
    <button type="button" class="learn-search" aria-label="Search">
      <svg class="learn-search-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
        <line x1="16.65" y1="16.65" x2="21" y2="21" stroke-width="2" stroke-linecap="round"></line>
      </svg>
    </button>
  </header>

  <!-- GRID -->
  <main class="learn-grid">

    <div class="learn-tile" onclick="location.href='/learn/types/'">
      <img src="/img/icons/learn/types.svg" alt="Cigar vitolas">
      <div class="learn-label">Vitolas</div>
    </div>

    <div class="learn-tile" onclick="location.href='/learn/shapes/'">
      <img src="/img/icons/learn/shapes.svg" alt="Cigar shapes">
      <div class="learn-label">Shapes</div>
    </div>

    <div class="learn-tile" onclick="location.href='/learn/color/'">
      <img src="/img/icons/learn/color.svg" alt="Cigar colors">
      <div class="learn-label">Color</div>
    </div>

    <div class="learn-tile" onclick="location.href='/learn/anatomy/'">
      <img src="/img/icons/learn/anatomy.svg" alt="Cigar anatomy">
      <div class="learn-label">Anatomy</div>
    </div>

    <div class="learn-tile" onclick="location.href='/learn/ring/'">
      <img src="/img/icons/learn/ring.svg" alt="Cigar ring gauge">
      <div class="learn-label">Ring</div>
    </div>

    <div class="learn-tile" onclick="location.href='/learn/glossary/'">
      <img src="/img/icons/learn/glossary.svg" alt="Glossary">
      <div class="learn-label">Glossary</div>
    </div>

  </main>

</body>
</html>
