<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Learn</title>
<style>
  :root{--bg:#f5f6fa;--tile:#fff;--radius:20px;--sh:0 4px 10px rgba(0,0,0,.08);--sh2:0 6px 16px rgba(0,0,0,.10)}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 0 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px} header img{width:32px;height:32px;border-radius:6px}
  .grid{display:grid;grid-template-columns:repeat(2,130px);gap:28px;justify-content:center}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:130px;height:130px;background:var(--tile);border-radius:20px;box-shadow:var(--sh);text-decoration:none;color:#111;transition:.15s transform,.2s box-shadow}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--sh2)} .tile svg{width:40px;height:40px;margin-bottom:10px}
  .label{font-weight:800;font-size:14px}
</style></head>
<body>
  <header><a href="/"><img src="/img/logo-smoke.png" alt="Back"/></a><span>Learn</span></header>
  <main class="grid">
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-4 9 4-9 4-9-4z" fill="#3ea3ff"/><path d="M7 12v3c1.8 1.2 4.2 1.2 6 0v-3" stroke="#3ea3ff" stroke-width="1.5"/></svg><div class="label">Library</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="#2f8cff" stroke-width="1.5"/><path d="M7 9h10M7 13h8" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Glossary</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18l8-12 8 12H4z" stroke="#2f8cff" stroke-width="1.5"/></svg><div class="label">Tutorials</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#2f8cff" stroke-width="1.5"/><path d="M9 12l2 2 4-4" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Quizzes</div></a>
  </main>
</body></html>
