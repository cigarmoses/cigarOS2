<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Learn • CigarOS 2</title>

  <style>
    :root {
      --bg: #e6edf5;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --radius-lg: 22px;
      --shadow-soft: 0 10px 25px rgba(15, 26, 44, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .learn-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }

    /* Top bar to match Loyalty */
    .learn-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 4px;
    }

    .learn-back {
      text-decoration: none;
      color: #007aff; /* iOS blue */
      font-size: 16px;
      font-weight: 400;
    }

    .learn-back span {
      margin-right: 2px;
    }

    .learn-title-main {
      margin: 4px 0 16px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* Grid */
    .learn-grid {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .learn-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 14px 10px 16px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      text-decoration: none;
      color: var(--ink);
      box-shadow: var(--shadow-soft);
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out,
        background 0.12s ease-out;
    }

    .learn-card:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 16px rgba(15, 26, 44, 0.15);
      background: #f9fbff;
    }

    .learn-icon-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffffff, #d7e4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 6px 16px rgba(15, 26, 44, 0.18);
      overflow: hidden;
    }

    .learn-icon-circle img {
      width: 30px;
      height: 30px;
      display: block;
    }

    .learn-icon-initial {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .learn-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    @media (min-width: 520px) {
      .learn-shell {
        padding-top: 26px;
      }
      .learn-title-main {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="learn-shell">
    <!-- Header matching Loyalty: just Back + Learn -->
    <header class="learn-topbar">
      <a href="/" class="learn-back">
        <span>‹</span>Back
      </a>
    </header>
    <h1 class="learn-title-main">Learn</h1>

    <!-- Grid of circular icon buttons (no captions) -->
    <main>
      <div class="learn-grid">
        <!-- Ring -->
        <a href="/learn/ring/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- Replace with icon if you have it:
            <img src="/img/icons/learn-ring.svg" alt="Ring" /> -->
            <span class="learn-icon-initial">R</span>
          </div>
          <div class="learn-label">Ring</div>
        </a>

        <!-- Vitolas -->
        <a href="/learn/vitolas/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- <img src="/img/icons/learn-vitolas.svg" alt="Vitolas" /> -->
            <span class="learn-icon-initial">V</span>
          </div>
          <div class="learn-label">Vitolas</div>
        </a>

        <!-- Wrapper Shade -->
        <a href="/learn/wrapper-shade/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- <img src="/img/icons/learn-wrapper.svg" alt="Wrapper Shade" /> -->
            <span class="learn-icon-initial">W</span>
          </div>
          <div class="learn-label">Wrapper Shade</div>
        </a>

        <!-- Shapes -->
        <a href="/learn/shapes/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- <img src="/img/icons/learn-shapes.svg" alt="Shapes" /> -->
            <span class="learn-icon-initial">S</span>
          </div>
          <div class="learn-label">Shapes</div>
        </a>

        <!-- Glossary -->
        <a href="/learn/glossary/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- <img src="/img/icons/learn-glossary.svg" alt="Glossary" /> -->
            <span class="learn-icon-initial">G</span>
          </div>
          <div class="learn-label">Glossary</div>
        </a>

        <!-- Brands -->
        <a href="/learn/brands/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- <img src="/img/icons/learn-brands.svg" alt="Brands" /> -->
            <span class="learn-icon-initial">B</span>
          </div>
          <div class="learn-label">Brands</div>
        </a>

        <!-- Lists -->
        <a href="/learn/lists/" class="learn-card">
          <div class="learn-icon-circle">
            <!-- <img src="/img/icons/learn-lists.svg" alt="Lists" /> -->
            <span class="learn-icon-initial">L</span>
          </div>
          <div class="learn-label">Lists</div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
