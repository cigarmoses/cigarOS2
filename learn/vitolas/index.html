<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Vitolas</title>

  <!-- Global typography -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/learn.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --accent: #007aff;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    .learn-topbar {
      padding: 12px 16px 0;
    }

    .learn-back {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
      padding: 0;
    }

    /* Scrollable page area */
    .learn-page {
      padding: 0 16px 40px;
      height: calc(100vh - 44px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Cards — matches Shapes */
    .vitola-card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .vitola-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .vitola-body {
      padding: 14px 16px 16px;
    }

    .vitola-name {
      margin: 0 0 6px;
      font-family: var(--font-display, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      font-weight: var(--weight-display-bold, 700);
      letter-spacing: -0.02em;
    }

    .vitola-desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
    }
  </style>
</head>

<body>

  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">←</button>
  </div>

  <main class="learn-page">
    <h1 class="learn-page-title">Vitolas</h1>

    <!-- Lonsdale -->
    <section class="vitola-card">
      <img
        src="/img/icons/learn/vitolas/lonsdale.png"
        alt="Lonsdale vitola"
      />
      <div class="vitola-body">
        <h2 class="vitola-name">Lonsdale</h2>
        <p class="vitola-desc">
          A classic long and slender vitola, offering an elegant smoke with a refined draw.
        </p>
      </div>
    </section>

  </main>

</body>
</html>
