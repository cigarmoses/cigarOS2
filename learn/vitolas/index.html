<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Vitolas</title>

  <!-- Global typography + Learn system -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/learn.css" />

  <style>
    /* =========================
       Vitolas – page-specific
       ========================= */

    .vitola-card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .vitola-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .vitola-body {
      padding: 14px 16px 16px;
    }

    .vitola-name {
      margin: 0 0 6px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .vitola-desc {
      margin: 0;
      color: #6a7586;
      line-height: 1.35;
    }
  </style>
</head>

<body class="learn-page">

  <!-- Top bar -->
  <header class="learn-topbar">
    <button class="learn-back" aria-label="Back">←</button>
  </header>

  <!-- Page content -->
  <main class="learn-page">
    <h1 class="learn-page-title">Vitolas</h1>

    <!-- Lonsdale -->
    <section class="vitola-card">
      <img
        src="/img/icons/learn/vitolas/lonsdale.png"
        alt="Lonsdale vitola"
      />
      <div class="vitola-body">
        <h2 class="vitola-name">Lonsdale</h2>
        <p class="vitola-desc">
          A classic long and slender vitola, offering an elegant smoke with a refined draw.
        </p>
      </div>
    </section>

  </main>

  <!-- Learn behavior (POS-style back) -->
  <script src="/js/global.js" defer></script>
  <script src="/learn/learn.js"></script>
</body>
</html>
