<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Anatomy • Learn</title>

  <!-- SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #8e8e93;
      --accent: #007aff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    /* ───────── Top bar ───────── */
    .learn-topbar {
      padding: 12px 16px 0;
    }

    .learn-back {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
      padding: 0;
    }

    /* ───────── Titles ───────── */
    .learn-title {
      margin: 12px 16px 4px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 48px;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .learn-subtitle {
      margin: 0 16px 18px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 500; /* Medium */
      font-size: 18px;
      color: var(--muted);
    }

    /* ───────── Anatomy layout ───────── */
    .anatomy-wrap {
      position: relative;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    /* Labels (left side) */
    .labels {
      position: absolute;
      left: 0;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 90px;
      z-index: 2;
    }

    .label h3 {
      margin: 0;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .label p {
      margin: 2px 0 0;
      font-size: 15px;
      color: var(--muted);
    }

    /* SVG container */
    .cigar-graphic {
      display: flex;
      justify-content: center;
      margin-left: 90px; /* space for labels */
    }

    .cigar-graphic img {
      width: 220px;          /* ✅ THIS fixes the issue */
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Small phones */
    @media (max-width: 380px) {
      .labels {
        gap: 70px;
      }
      .cigar-graphic img {
        width: 200px;
      }
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">←</button>
  </div>

  <!-- Title -->
  <h1 class="learn-title">Anatomy</h1>
  <div class="learn-subtitle">Click for an overview of each layer.</div>

  <!-- Content -->
  <section class="anatomy-wrap">

    <!-- Labels -->
    <div class="labels">
      <div class="label">
        <h3>Wrapper</h3>
        <p>Outer most layer</p>
      </div>

      <div class="label">
        <h3>Binder</h3>
        <p>Middle layer</p>
      </div>

      <div class="label">
        <h3>Filler</h3>
        <p>Interior layer</p>
      </div>
    </div>

    <!-- Graphic -->
    <div class="cigar-graphic">
      <img
        src="/img/icons/learn/learnanatomy.svg"
        alt="Cigar Anatomy"
      />
    </div>

  </section>

</body>
</html>
