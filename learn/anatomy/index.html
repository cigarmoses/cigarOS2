<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Anatomy</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/learn/learn.css" />
</head>

<body>

<main class="learn-detail-page">

  <header class="learn-topbar">
    <button class="learn-back" onclick="history.back()">
      <span class="learn-back-icon">←</span>
    </button>

    <h1 class="learn-title">Anatomy</h1>

    <span style="width:24px"></span>
  </header>

  <section class="learn-detail-main">

    <article class="learn-card learn-card-image">
      <img src="/img/learn/anatomy-diagram.png" alt="Cigar anatomy">
    </article>

    <article class="learn-card">
      <h2 class="learn-term">WRAPPER</h2>
      <p>Exterior leaf, visible color of the cigar.</p>
    </article>

    <article class="learn-card">
      <h2 class="learn-term">BINDER</h2>
      <p>Leaves that hold together the interior filler.</p>
    </article>

    <article class="learn-card">
      <h2 class="learn-term">FILLER</h2>
      <p>Tobacco leaves used in the body of the cigar.</p>
    </article>

  </section>

</main>

</html>
