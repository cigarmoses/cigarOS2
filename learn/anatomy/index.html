<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Learn • Anatomy</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <!-- POS / Learn shared styles -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    body {
      margin: 0;
      background: #ffffff;
      color: #0f1a2c;
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      min-height: 100vh;
    }

    /* Top bar */
    .learn-topbar {
      padding: 14px 16px 0;
      display: flex;
      align-items: center;
    }

    .pos-back {
      border: none;
      background: none;
      padding: 0;
      color: #007aff;
      font-size: 20px;
      cursor: pointer;
    }

    /* Page wrapper */
    .learn-page {
      padding: 8px 16px 24px;
    }

    /* Title */
    .learn-title {
      margin: 12px 0 4px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: -0.03em;
    }

    .learn-subtitle {
      margin: 0 0 12px;
      font-size: 15px;
      color: #6a7586;
    }

    /* SVG container */
    .anatomy-graphic {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 8px;
    }

    .anatomy-graphic img {
      width: 100%;
      max-width: 340px;
      max-height: calc(100vh - 240px);
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <!-- Top bar -->
  <header class="learn-topbar">
    <button
      type="button"
      class="pos-back"
      onclick="window.history.back()"
      aria-label="Back"
    >
      ←
    </button>
  </header>

  <main class="learn-page">
    <h1 class="learn-title">Anatomy</h1>
    <p class="learn-subtitle">Click for an overview of each layer.</p>

    <div class="anatomy-graphic">
      <img
        src="/img/icons/learn/learnanatomy.svg"
        alt="Cigar anatomy diagram"
      />
    </div>
  </main>
</body>
</html>
