<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Anatomy</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      min-height: 100vh;
    }

    /* Top bar */
    .learn-topbar {
      padding: 14px 16px 0;
      display: flex;
      align-items: center;
    }

    .pos-back {
      border: none;
      background: none;
      padding: 0;
      color: #007aff;
      font-size: 20px;
      cursor: pointer;
    }

    /* Centered container */
    .anatomy-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 60px);
      padding: 16px;
    }

    .anatomy-container img {
      width: 100%;
      max-width: 360px;
      max-height: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <!-- Back button -->
  <header class="learn-topbar">
    <button
      type="button"
      class="pos-back"
      onclick="window.history.back()"
      aria-label="Back"
    >
      ←
    </button>
  </header>

  <!-- Centered SVG -->
  <main class="anatomy-container">
    <img
      src="/img/icons/learn/anatomylearn2.svg"
      alt="Cigar anatomy diagram"
    />
  </main>
</body>
</html>
