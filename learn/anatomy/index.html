<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Anatomy</title>

  <!-- Global Type -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #0f1a2c;
    }

    .learn-page {
      padding: 20px 16px 32px;
    }

    /* iOS-style title */
    .learn-title {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.03em;
      margin: 0 0 20px;
    }

    /* Centered anatomy image */
    .anatomy-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .anatomy-wrap img {
      width: 100%;
      max-width: 420px;
      height: auto;
    }
  </style>
</head>

<body>
  <main class="learn-page">
    <h1 class="learn-title">Anatomy</h1>

    <div class="anatomy-wrap">
      <img
        src="/img/icons/learn/anatomylearn2.svg"
        alt="Cigar Anatomy"
      />
    </div>
  </main>
</body>
</html>
