<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Anatomy • Learn</title>

  <!-- SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --accent: #007aff;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Top bar */
    .learn-topbar {
      padding: 12px 16px 0;
    }

    .learn-back {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
    }

    /* Title */
    .learn-title {
      margin: 12px 16px 6px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 48px;
      letter-spacing: -0.04em;
    }

    .learn-subtitle {
      margin: 0 16px 20px;
      font-size: 18px;
      color: var(--muted);
    }

    /* Layout */
    .anatomy-wrap {
      position: relative;
      padding: 0 16px 40px;
      display: flex;
      justify-content: center;
    }

    .anatomy-image {
      width: 100%;
      max-width: 360px;
      height: auto;
      display: block;
    }

    /* Labels */
    .label {
      position: absolute;
      left: 0;
      width: 160px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .label h3 {
      margin: 0;
      font-weight: 800;
      font-size: 28px;
      line-height: 1;
    }

    .label p {
      margin: 4px 0 0;
      font-size: 16px;
      color: var(--muted);
    }

    .label.wrapper { top: 110px; }
    .label.binder  { top: 320px; }
    .label.filler  { top: 520px; }
  </style>
</head>

<body>

  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">←</button>
  </div>

  <h1 class="learn-title">Anatomy</h1>
  <div class="learn-subtitle">Click for an overview of each layer.</div>

  <div class="anatomy-wrap">
    <div class="label wrapper">
      <h3>Wrapper</h3>
      <p>Outer most layer</p>
    </div>

    <div class="label binder">
      <h3>Binder</h3>
      <p>Middle layer</p>
    </div>

    <div class="label filler">
      <h3>Filler</h3>
      <p>Interior layer</p>
    </div>

    <img
      src="/img/icons/learn/learnanatomy.svg"
      alt="Cigar Anatomy"
      class="anatomy-image"
    />
  </div>

</body>
</html>
