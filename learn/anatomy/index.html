<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Anatomy</title>

  <!-- SF Pro (learn-page-title lives here) -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --accent: #007aff;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar (back arrow) */
    .learn-topbar {
      padding: 12px 16px 0;
    }

    .learn-back {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
    }

    /* Page wrapper – matches Learn + Colors */
    .learn-page {
      padding: 0 16px 0;
    }

    /* Centered anatomy image */
    .anatomy-wrap {
      height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
    }

    .anatomy-wrap img {
      max-width: 100%;
      max-height: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">←</button>
  </div>

  <main class="learn-page">
    <!-- GLOBAL, LOCKED TITLE -->
    <h1 class="learn-page-title">Anatomy</h1>

    <div class="anatomy-wrap">
      <img
        src="/img/icons/learn/anatomylearn2.svg"
        alt="Cigar Anatomy"
      />
    </div>
  </main>

</body>
</html>
