<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Anatomy</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --ink: #0f1a2c;
      --muted: #8e8e93;
      --accent: #007aff;
      --bg: #ffffff;

      --shadow-main: 0 10px 28px rgba(15,26,44,0.10);
      --shadow-soft: 0 2px 6px rgba(15,26,44,0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      min-height: 100vh;
    }

    /* ───── Top Bar ───── */
    .topbar {
      padding: 14px 16px 0;
    }

    .back-btn {
      border: none;
      background: none;
      padding: 6px 4px;
      cursor: pointer;
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
    }

    /* ───── Title ───── */
    .title-wrap {
      padding: 0 16px;
    }

    h1 {
      margin: 28px 0 8px;
      font-family: "SF Pro Display";
      font-weight: 800;
      font-size: 56px;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 24px;
      font-family: "SF Pro Display";
      font-weight: 500;
      font-size: 22px;
      color: var(--muted);
    }

    /* ───── Layout ───── */
    .stage {
      padding: 0 16px 32px;
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      align-items: start;
    }

    /* Left labels */
    .layers {
      display: flex;
      flex-direction: column;
      gap: 36px;
      padding-top: 8px;
    }

    .layer {
      cursor: pointer;
    }

    .layer-title {
      font-family: "SF Pro Display";
      font-weight: 800;
      font-size: 40px;
      margin: 0;
    }

    .layer-sub {
      font-family: "SF Pro Display";
      font-weight: 600;
      font-size: 18px;
      color: var(--muted);
      margin: 4px 0 0;
    }

    /* Cigar */
    .cigar-wrap {
      display: flex;
      justify-content: center;
      position: relative;
    }

    /* 🔑 SIZE CONTROL (this fixes your issue) */
    .cigar {
      height: min(52vh, 480px);
      width: auto;
      max-width: 100%;
    }

    /* Popups */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 20;
    }

    .overlay.active {
      display: block;
    }

    .popup {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 360px;
      display: none;
      z-index: 30;

      background: rgba(160,160,160,0.6);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 18px;
      color: #fff;

      box-shadow: var(--shadow-main), var(--shadow-soft);
    }

    .popup.active {
      display: block;
    }

    .popup h2 {
      margin: 0 0 8px;
      font-family: "SF Pro Display";
      font-weight: 800;
      font-size: 28px;
    }

    .popup p {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 22px;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      .stage {
        grid-template-columns: 1fr;
      }

      .layers {
        gap: 28px;
      }

      .cigar {
        height: min(48vh, 440px);
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="title-wrap">
    <h1>Anatomy</h1>
    <p class="subtitle">Click for an overview of each layer.</p>
  </div>

  <main class="stage">
    <div class="layers">
      <div class="layer" onclick="openPop('wrapper')">
        <div class="layer-title">Wrapper</div>
        <div class="layer-sub">Outer most layer</div>
      </div>

      <div class="layer" onclick="openPop('binder')">
        <div class="layer-title">Binder</div>
        <div class="layer-sub">Middle layer</div>
      </div>

      <div class="layer" onclick="openPop('filler')">
        <div class="layer-title">Filler</div>
        <div class="layer-sub">Interior layer</div>
      </div>
    </div>

    <div class="cigar-wrap">
      <!-- ✅ CORRECT SVG + CACHE BUSTER -->
      <img
        src="/img/icons/learn/anatomy1.svg?v=6"
        class="cigar"
        alt="Cigar anatomy"
      />
    </div>
  </main>

  <div class="overlay" id="overlay" onclick="closePop()"></div>

  <div class="popup" id="popup">
    <div class="close" onclick="closePop()">×</div>
    <h2 id="pop-title"></h2>
    <p id="pop-text"></p>
  </div>

  <script>
    const copy = {
      wrapper: {
        t: "Wrapper",
        b: "Wrapper leaves are the most delicate, expensive and [ideally] perfect leaf that is applied to the outside of a cigar. In addition, wrapper leaves contribute significantly to the flavor of the cigar since they will touch the mouth and tongue."
      },
      binder: {
        t: "Binder",
        b: "Binder leaves are the dense and strong leaves applied to the outside of the filler tobaccos; forming the bunch. The binder protects and helps form the filler tobaccos in the molds and presses."
      },
      filler: {
        t: "Filler",
        b: "Filler tobacco leaves constitute the 'guts' of the cigar. Filler leaves must be expertly bunched to make a well constructed cigar that will draw and burn in balance."
      }
    };

    function openPop(key) {
      document.getElementById("pop-title").textContent = copy[key].t;
      document.getElementById("pop-text").textContent = copy[key].b;
      document.getElementById("overlay").classList.add("active");
      document.getElementById("popup").classList.add("active");
    }

    function closePop() {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("popup").classList.remove("active");
    }
  </script>
</body>
</html>
