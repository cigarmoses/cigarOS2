<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Ring</title>

  <!-- Global typography + Learn system -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/learn.css" />

  <style>
    /* =========================
       Ring – page-specific
       ========================= */

    .ring-wrap {
      height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
    }

    .ring-wrap img {
      width: 100%;
      max-width: 360px;
      max-height: 70vh;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body class="learn-page">

  <!-- Top bar -->
  <header class="learn-topbar">
    <button class="learn-back" aria-label="Back">←</button>
  </header>

  <!-- Page content -->
  <main class="learn-page">
    <h1 class="learn-page-title">Ring</h1>

    <div class="ring-wrap">
      <img
        src="/img/icons/learn/ringcoins.svg"
        alt="Cigar Ring Diagram"
      />
    </div>
  </main>

  <!-- Learn behavior (POS-style back) -->
  <script src="/learn/learn.js"></script>
</body>
</html>
