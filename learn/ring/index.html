<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <title>Learn • Ring</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --ink: #0f1a2c;
      --muted: #6a7586;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .learn-topbar {
      padding: 16px 18px 0;
      display: flex;
      align-items: center;
    }

    .pos-back {
      border: none;
      background: none;
      color: #007aff;
      font-size: 20px;
      cursor: pointer;
    }

    /* Title */
    .learn-title {
      margin: 8px 18px 0;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 900;
      font-size: 36px;
      letter-spacing: -0.03em;
    }

    /* Image wrapper */
    .learn-image-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .learn-image-wrap img {
      width: 100%;
      max-width: 360px;
      max-height: 70vh;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <!-- Top bar -->
  <header class="learn-topbar">
    <button class="pos-back" onclick="history.back()">←</button>
  </header>

  <!-- Title -->
  <h1 class="learn-title">Ring</h1>

  <!-- Centered SVG -->
  <main class="learn-image-wrap">
    <img
      src="/img/icons/learn/ringcoins.svg"
      alt="Cigar Ring Diagram"
    />
  </main>
</body>
</html>
