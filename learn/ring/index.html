<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <title>Learn • Ring</title>

  <!-- SF Pro (learn-page-title lives here) -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --accent: #007aff;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top bar (back arrow) */
    .learn-topbar {
      padding: 12px 16px 0;
      display: flex;
      align-items: center;
    }

    .learn-back {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
      padding: 0;
    }

    /* Page wrapper – matches Learn rhythm */
    .learn-page {
      padding: 0 16px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Image wrapper */
    .learn-image-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
    }

    .learn-image-wrap img {
      width: 100%;
      max-width: 360px;
      max-height: 70vh;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">←</button>
  </div>

  <main class="learn-page">
    <!-- GLOBAL, LOCKED TITLE -->
    <h1 class="learn-page-title">Ring</h1>

    <!-- Centered SVG -->
    <div class="learn-image-wrap">
      <img
        src="/img/icons/learn/ringcoins.svg"
        alt="Cigar Ring Diagram"
      />
    </div>
  </main>

</body>
</html>
