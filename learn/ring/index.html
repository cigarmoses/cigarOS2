<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Rings</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --ink:#0f1a2c;
      --muted:#8e8e93;
      --accent:#007aff;
      --bg:#ffffff;

      --card:#ffffff;
      --radius:22px;

      /* Learn-style shadows */
      --shadow-main: 0 10px 28px rgba(15,26,44,0.08);
      --shadow-soft: 0 2px 6px rgba(15,26,44,0.05);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font-text,-apple-system,BlinkMacSystemFont,system-ui,sans-serif);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* ───────── Top bar (match Learn/POS gap behavior) ───────── */
    .topbar{
      padding:14px 16px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .icon-btn{
      border:none;
      background:none;
      padding:6px 4px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .icon-btn svg{
      width:22px;height:22px;
      stroke:var(--accent);
    }

    /* ───────── Title ───────── */
    .title{
      margin:28px 16px 8px;
      font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-weight:800;
      font-size:56px;
      letter-spacing:-0.04em;
      line-height:1;
      color:var(--ink);
    }

    .subtitle{
      margin:0 16px 18px;
      font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-weight:500; /* Medium-ish iOS feel */
      font-size:22px;
      letter-spacing:-0.02em;
      color:var(--muted);
      line-height:1.2;
    }

    /* ───────── Card container ───────── */
    .card{
      margin:0 16px 28px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow-main),var(--shadow-soft);
      padding:16px 14px 18px;
    }

    /* ───────── Grid ───────── */
    .rg-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:18px 14px;
      align-items:end;
      justify-items:center;
    }

    /* each tile */
    .rg-item{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      text-align:center;
      user-select:none;
    }

    /* ring circle */
    .ring{
      border-radius:999px;
      /* tobacco-ish texture without an image */
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), rgba(0,0,0,0) 45%),
        radial-gradient(circle at 70% 70%, rgba(0,0,0,0.20), rgba(0,0,0,0) 55%),
        radial-gradient(circle at 50% 50%, #3a2217 0%, #2d1a12 40%, #1f120d 100%);
      box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.08),
        inset 0 -6px 10px rgba(0,0,0,0.25),
        0 6px 18px rgba(15,26,44,0.10);
    }

    /* label under each circle */
    .rg-label{
      font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-weight:700;
      font-size:20px;
      letter-spacing:-0.01em;
      color:#000;
      line-height:1;
    }

    .rg-sub{
      font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-weight:500;
      font-size:12px;
      color:var(--muted);
      letter-spacing:-0.01em;
      margin-top:-4px;
    }

    /* coin */
    .coin{
      border-radius:999px;
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      filter: drop-shadow(0 8px 18px rgba(15,26,44,0.14));
    }

    .coin-wrap{
      border-radius:999px;
      background:#fff;
      box-shadow: 0 10px 28px rgba(15,26,44,0.12), 0 2px 6px rgba(15,26,44,0.06);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* size presets (roughly matches your screenshot aesthetic) */
    .s64{ width:72px; height:72px; }
    .s60{ width:68px; height:68px; }
    .s58{ width:66px; height:66px; }
    .s56{ width:64px; height:64px; }
    .s54{ width:62px; height:62px; }
    .s52{ width:60px; height:60px; }
    .s50{ width:58px; height:58px; }
    .s48{ width:56px; height:56px; }
    .s46{ width:54px; height:54px; }
    .s44{ width:52px; height:52px; }
    .s42{ width:50px; height:50px; }
    .s40{ width:48px; height:48px; }
    .s38{ width:46px; height:46px; }
    .s36{ width:44px; height:44px; }
    .s32{ width:40px; height:40px; }
    .s30{ width:38px; height:38px; }
    .s28{ width:36px; height:36px; }
    .s26{ width:34px; height:34px; }
    .s24{ width:32px; height:32px; }
    .s22{ width:30px; height:30px; }
    .s20{ width:28px; height:28px; }
    .s18{ width:26px; height:26px; }
    .s16{ width:24px; height:24px; }

    /* coin sizes to visually match the chart reference */
    .q60{ width:68px; height:68px; }   /* Quarter ≈ 60 RG */
    .n54{ width:62px; height:62px; }   /* Nickel ≈ 54 RG */
    .p48{ width:56px; height:56px; }   /* Penny ≈ 48 RG */
    .d45{ width:53px; height:53px; }   /* Dime ≈ 45 RG */

    .coin-caption{
      font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-weight:600;
      font-size:11px;
      color:var(--muted);
      letter-spacing:-0.01em;
      margin-top:-2px;
      text-transform:uppercase;
    }

    @media (max-width: 380px){
      .rg-grid{ gap:16px 10px; }
      .title{ font-size:52px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="icon-btn" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"
              stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <h1 class="title">Rings</h1>
  <p class="subtitle">Ring gauge is measured in 64ths of an inch.</p>

  <section class="card">
    <div class="rg-grid">

      <!-- Row 1 -->
      <div class="rg-item">
        <div class="ring s64"></div>
        <div class="rg-label">64</div>
      </div>

      <div class="rg-item">
        <div class="ring s60"></div>
