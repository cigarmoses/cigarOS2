<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Shapes</title>

  <!-- Global Type -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #0f1a2c;
    }

    .learn-page {
      padding: 20px 16px 32px;
    }

    /* Page Title */
    .learn-title {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.03em;
      margin: 0 0 20px;
    }

    /* Shapes grid */
    .shapes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .shape-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .shape-card img {
      width: 100%;
      max-width: 120px;
      height: auto;
      margin-bottom: 12px;
    }

    /* ✅ FIX: iOS SF Pro Display Bold */
    .shape-name {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body>
  <main class="learn-page">
    <h1 class="learn-title">Shapes</h1>

    <section class="shapes-grid">
      <div class="shape-card">
        <img src="/img/icons/learn/robusto.svg" alt="Robusto">
        <div class="shape-name">Robusto</div>
      </div>

      <div class="shape-card">
        <img src="/img/icons/learn/torpedo.svg" alt="Torpedo">
        <div class="shape-name">Torpedo</div>
      </div>

      <!-- Continue cards as needed -->
    </section>
  </main>
</body>
</html>
