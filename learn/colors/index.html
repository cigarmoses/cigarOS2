<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Learn • Colors</title>

  <!-- Global typography + Learn system -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/learn.css" />

  <style>
    /* =========================
       Colors – page-specific
       ========================= */

    .colors-wrap {
      height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
    }

    .colors-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;

<body class="learn-page">

    <h1 class="learn-page-title">Colors</h1>

    <div class="colors-wrap">
      <img
        src="/img/icons/learn/learncolors.png"

      />

  <!-- Learn behavior (POS-style back) -->
  <script src="/learn/learn.js"></script>
