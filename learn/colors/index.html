<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Colors • Learn</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --ink: #0f1a2c;
      --accent: #007aff;
      --bg: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden; /* ✅ no page scroll */
    }

    /* ───────── Top bar (match Learn/POS gap style) ───────── */
    .learn-topbar {
      padding: 14px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-btn {
      border: none;
      background: none;
      padding: 6px 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
    }

    /* ───────── Title (same spacing system as Learn home) ───────── */
    .learn-title {
      margin: 28px 16px 10px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 56px;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
    }

    /* ───────── Fit-to-screen Graphic Area ───────── */
    .learn-content {
      height: calc(100vh - 14px - 22px - 28px - 10px - 56px - 16px); 
      /* Explanation (rough):
         - topbar padding/top + icon height
         - title margin-top + title + margin-bottom
         This leaves remaining height for the SVG.
         We keep it stable across iPhone sizes. */
      padding: 0 16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .colors-graphic {
      width: 100%;
      height: 100%;
      max-width: 520px;
      max-height: 100%;
      object-fit: contain; /* ✅ fits cleanly, no cropping */
      display: block;
    }

    /* Slightly tighten on very small screens */
    @media (max-width: 390px) {
      .learn-title { font-size: 52px; }
      .learn-content { padding-bottom: 12px; }
    }
  </style>
</head>

<body>
  <!-- Top bar -->
  <header class="learn-topbar">
    <button class="icon-btn" id="learn-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
      </svg>
    </button>
    <span aria-hidden="true"></span>
  </header>

  <!-- Title -->
  <h1 class="learn-title">Colors</h1>

  <!-- Graphic -->
  <main class="learn-content" aria-label="Cigar Wrapper Colors Graphic">
    <img
      src="/img/icons/learn/learncolors.svg?v=1"
      alt="Cigar Wrapper Colors"
      class="colors-graphic"
    />
  </main>

  <script>
    document.getElementById("learn-back")?.addEventListener("click", () => {
      history.length > 1 ? history.back() : (window.location.href = "/learn/");
    });
  </script>
</body>
</html>
