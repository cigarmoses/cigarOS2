<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Colors • Learn</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <!-- Shared POS / Learn styles -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Top bar – matches Anatomy */
    .learn-topbar {
      padding: 12px 16px 0;
      display: flex;
      align-items: center;
    }

    .learn-back {
      display: inline-flex;
      align-items: center;
      border: none;
      background: none;
      padding: 4px 0;
      cursor: pointer;
      color: #007aff;
    }

    .learn-back-icon {
      font-size: 20px;
      line-height: 1;
    }

    /* Title */
    .learn-title {
      margin: 12px 16px 16px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.03em;
    }

    /* Content */
    .learn-content {
      padding: 0 16px 32px;
      display: flex;
      justify-content: center;
    }

    /* Centered SVG */
    .colors-graphic {
      width: 100%;
      max-width: 420px;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">
      <span class="learn-back-icon">←</span>
    </button>
  </div>

  <!-- Title -->
  <h1 class="learn-title">Colors</h1>

  <!-- Graphic -->
  <div class="learn-content">
    <img
      src="/img/icons/learn/learncolors.svg"
      alt="Cigar Wrapper Colors"
      class="colors-graphic"
    />
  </div>

</body>
</html>
