<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Colors • Learn</title>

  <!-- SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --accent: #007aff;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    .learn-topbar {
      padding: 12px 16px 0;
    }

    .learn-back {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
    }

    /* ───────── Title (POS-matched gap) ───────── */
    .learn-title {
      margin: 28px 16px 18px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 56px;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
    }

    /* Image wrapper */
    .colors-wrap {
      height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
    }

    .colors-image {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <div class="learn-topbar">
    <button class="learn-back" onclick="history.back()">←</button>
  </div>

  <h1 class="learn-page-title">Colors</h1>

  <div class="colors-wrap">
    <img
      src="/img/icons/learn/learncolors.png"
      alt="Cigar Wrapper Colors"
      class="colors-image"
    />
  </div>

</body>
</html>
