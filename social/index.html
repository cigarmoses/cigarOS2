<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cigar Social</title>

<link rel="stylesheet" href="/css/type.css" />

<style>
:root{
--safe-top: env(safe-area-inset-top, 0px);
--safe-bottom: env(safe-area-inset-bottom, 0px);

--screen-max: 430px;

--bg: #edf2f6;
--ink: #16263d;
--muted: #51647f;

--tile-size: 132px;
--grid-gap-x: 28px;
--grid-gap-y: 26px;

--label-size: 16px;
--label-weight: 600;

--grid-top-offset: 110px;
}

body.dark{
--bg:
radial-gradient(1200px 700px at 50% -20%, #0e2244 0%, rgba(14,34,68,0) 55%),
linear-gradient(180deg, #06152d 0%, #020912 60%, #000000 100%);
--ink: #eef5ff;
--muted: #acbbd0;
}

*{box-sizing:border-box;}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100dvh;
background:var(--bg);
color:var(--ink);
font-family:var(--font-display),-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
overflow-x:hidden;
overflow-y:auto;
}

.screen{
width:100%;
max-width:var(--screen-max);
margin:0 auto;
padding:
calc(var(--safe-top) + var(--grid-top-offset))
14px
calc(var(--safe-bottom) + 92px);
display:flex;
flex-direction:column;
align-items:center;
}

.home-grid{
width:100%;
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
justify-items:center;
gap:var(--grid-gap-y) var(--grid-gap-x);
}

.home-item{
width:100%;
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:var(--ink);
}

.tile-img{
width:var(--tile-size);
height:var(--tile-size);
object-fit:contain;
filter:
drop-shadow(0 14px 24px rgba(0,0,0,.25))
drop-shadow(0 2px 6px rgba(255,255,255,.08));
transition:transform .18s ease;
}

.home-item:active .tile-img{
transform:scale(.95);
}

.icon-label{
margin-top:8px;
font-size:var(--label-size);
font-weight:var(--label-weight);
letter-spacing:-.01em;
color:var(--muted);
text-align:center;
}

.back{
position:fixed;
top:calc(var(--safe-top) + 18px);
left:20px;
font-size:18px;
text-decoration:none;
color:var(--ink);
opacity:.7;
}
</style>
</head>

<body class="day">

<a href="/" class="back">←</a>

<main class="screen">

<div class="home-grid">

<a href="/shops/" class="home-item">
<img src="/img/icons/glass/shops.png" class="tile-img" />
<div class="icon-label">Shops</div>
</a>

<a href="/brands/" class="home-item">
<img src="/img/icons/glass/brands.png" class="tile-img" />
<div class="icon-label">Brands</div>
</a>

<a href="/social/" class="home-item">
<img src="/img/icons/glass/cigarsocialglass.png" class="tile-img" />
<div class="icon-label">Cigar Social</div>
</a>

</div>

</main>

</body>
</html>
