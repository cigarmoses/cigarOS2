<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no,email=no,address=no"/>

<title>Shops • CigarOS</title>

<link rel="stylesheet" href="/css/type.css"/>
<link rel="stylesheet" href="/shops/search-shops.css?v=32"/>

<style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --bg-light:#eff2f7;
  --ink-light:#111827;
  --glass-light:#ffffff;
  --glass-light-border:rgba(0,0,0,.08);
  --shadow-light:0 12px 30px rgba(15,26,44,.08);

  --bg-dark:
    radial-gradient(1200px 540px at 50% -8%, rgba(63,108,194,.22) 0%, rgba(20,44,92,.16) 28%, rgba(4,13,34,0) 58%),
    linear-gradient(180deg, #0f2856 0%, #07142f 48%, #041027 100%);
  --ink-dark:#ffffff;
  --glass-dark:rgba(255,255,255,.08);
  --glass-dark-border:rgba(255,255,255,.12);
  --shadow-dark:0 12px 34px rgba(0,0,0,.26);
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100dvh;
  font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

html[data-theme="light"] body{
  background:var(--bg-light);
  color:var(--ink-light);
}

html[data-theme="dark"] body{
  background:var(--bg-dark);
  color:var(--ink-dark);
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  width:min(430px, calc(100% - 28px));
  margin:0 auto;
  padding-top:calc(10px + var(--safe-top));
  padding-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:transparent;
}

.tb-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  padding:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  border:1px solid transparent;
  color:inherit;
  appearance:none;
  text-decoration:none;
  background:transparent;
}

html[data-theme="light"] .tb-btn{
  background:var(--glass-light);
  border-color:var(--glass-light-border);
  box-shadow:var(--shadow-light);
}

html[data-theme="dark"] .tb-btn{
  background:var(--glass-dark);
  border-color:var(--glass-dark-border);
  box-shadow:var(--shadow-dark);
  backdrop-filter:blur(18px) saturate(1.1);
  -webkit-backdrop-filter:blur(18px) saturate(1.1);
}

.tb-btn svg{
  width:20px;
  height:20px;
  display:block;
}

.theme-toggle{
  position:relative;
  width:58px;
  height:34px;
  border:0;
  padding:0;
  border-radius:999px;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.theme-toggle-track{
  position:absolute;
  inset:0;
  border-radius:999px;
  background:#c7d1de;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}

html[data-theme="dark"] .theme-toggle-track{
  background:rgba(255,255,255,.18);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}

.theme-toggle-knob{
  position:absolute;
  top:3px;
  left:3px;
  width:28px;
  height:28px;
  border-radius:999px;
  background:#ffffff;
  box-shadow:0 3px 8px rgba(0,0,0,.18);
  transition:transform .22s ease;
  display:grid;
  place-items:center;
  color:#0f1728;
}

html[data-theme="dark"] .theme-toggle-knob{
  transform:translateX(24px);
}

.theme-icon{
  position:absolute;
  width:14px;
  height:14px;
}

.theme-icon-moon{ display:none; }
html[data-theme="dark"] .theme-icon-sun{ display:none; }
html[data-theme="dark"] .theme-icon-moon{ display:block; }

.shell{
  width:min(430px, calc(100% - 28px));
  margin:0 auto;
  padding-bottom:calc(28px + var(--safe-bottom));
}

.sh-top .sh-back{
  display:none !important;
}
</style>
</head>

<body class="shops-page">

<header class="topbar">
  <button
    type="button"
    class="tb-btn"
    id="backBtn"
    aria-label="Back">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 18L9 12L15 6"
        fill="none"
        stroke="currentColor"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
  </button>

  <button
    class="theme-toggle"
    id="themeToggle"
    aria-label="Toggle theme"
    aria-pressed="false">
    <span class="theme-toggle-track" aria-hidden="true"></span>
    <span class="theme-toggle-knob" aria-hidden="true">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.5 3.5a8 8 0 1 0 6 13.3A9 9 0 0 1 14.5 3.5Z" fill="currentColor"></path>
      </svg>
    </span>
  </button>
</header>

<div class="shell">
  <main class="sh-wrap">
    <header class="sh-top">
      <h1 class="sh-title">Shops</h1>
    </header>

    <div class="sh-search">
      <input
        id="shQuery"
        class="sh-input"
        type="search"
        placeholder="Search shops…"
        autocomplete="off"
        enterkeyhint="search"
      />
    </div>

    <div class="sh-filters">
      <div class="sh-filter-left">
        <select id="shState" class="sh-state-select" aria-label="Filter by state">
          <option value="">All States</option>
        </select>
      </div>

      <div class="sh-filter-right">
        <span class="sh-filter-label sh-taa-label">TAA</span>
        <button
          id="shTaaToggle"
          class="sh-taa-toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Show TAA shops only">
          <span class="sh-taa-toggle-track" aria-hidden="true"></span>
          <span class="sh-taa-toggle-knob" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <section id="shList" class="sh-list"></section>
  </main>
</div>

<script>
(() => {
  "use strict";

  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");
  const backBtn = document.getElementById("backBtn");

  function getSavedTheme() {
    return localStorage.getItem("theme") || root.getAttribute("data-theme") || "light";
  }

  function applyTheme(theme) {
    const next = theme === "dark" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    toggle?.setAttribute("aria-pressed", String(next === "dark"));
  }

  applyTheme(getSavedTheme());

  toggle?.addEventListener("click", () => {
    applyTheme(getSavedTheme() === "dark" ? "light" : "dark");
  });

  backBtn?.addEventListener("click", () => {
    if (history.length > 1) history.back();
    else window.location.href = "/";
  });
})();
</script>

<script src="/shops/shop-search.js?v=32"></script>
</body>
</html>
