<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Shop • CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <!-- ✅ Match CSS version to JS so cache refreshes together -->
  <link rel="stylesheet" href="/shops/shop.css?v=13.4" />
</head>

<body class="shop-public">
  <main class="sp-wrap">

    <section class="sp-top">

      <!-- SHOP pill -->
      <div class="sp-pill sp-pill-left">SHOP</div>

      <!-- ✅ TAA badge: hidden by default (JS will show only if taa=true) -->
      <img class="sp-taa" id="spTaaIcon" src="/img/icons/taa.svg" alt="TAA" style="display:none;" />

      <!-- Logo -->
      <div class="sp-logo">
        <img id="spLogo" alt="" />
      </div>

      <!-- Shop Name -->
      <h1 class="sp-title" id="spName">Shop Name</h1>

      <!-- City (CENTERED + SMALL) -->
      <div class="sp-city" id="spCityRow" aria-label="City">
        <svg viewBox="0 0 24 24" class="sp-gps" aria-hidden="true">
          <path d="M12 2c-3.9 0-7 3.1-7 7 0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7z"/>
        </svg>
        <span id="spCity">City, ST</span>
      </div>

      <!-- ACTION DOCK -->
      <div class="sp-dock sp-dock-top">

        <button class="sp-dock-btn" id="spActCall" type="button" aria-label="Call">
          <!-- ✅ remove hardcoded old cache param, let HTML version handle caching -->
          <img class="sp-dock-ico" src="/img/icons/call.svg" alt="Call" />
          <span class="sp-dock-label">Call</span>
        </button>

        <button class="sp-dock-btn" id="spActWeb" type="button" aria-label="Web">
          <img class="sp-dock-ico" src="/img/icons/web.svg" alt="Web" />
          <span class="sp-dock-label">Web</span>
        </button>

        <button class="sp-dock-btn" id="spActBrands" type="button" aria-label="Brands">
          <img class="sp-dock-ico" src="/img/icons/brands.svg" alt="Brands" />
          <span class="sp-dock-label">Brands</span>
        </button>

        <button class="sp-dock-btn" id="spActDir" type="button" aria-label="Directions">
          <img class="sp-dock-ico" src="/img/icons/directions.svg" alt="Directions" />
          <span class="sp-dock-label">Directions</span>
        </button>

        <!-- ✅ Instagram stays in the row; JS will hide it if missing -->
        <button class="sp-dock-btn" id="spActInstagram" type="button" aria-label="Instagram">
          <img class="sp-dock-ico" src="/img/icons/instagram.svg" alt="Instagram" />
          <span class="sp-dock-label">Instagram</span>
        </button>

      </div>

      <!-- AMENITIES (ICONS ONLY) -->
      <div class="sp-amen-panel">
        <div class="sp-amen-row" id="spAmenRow"></div>
      </div>

    </section>

    <!-- Bottom Section -->
    <section class="sp-bottom">

      <div class="sp-seg" role="tablist" aria-label="Shop tabs">
        <button class="sp-seg-btn" id="spTabHours" type="button" role="tab" aria-selected="false">Hours</button>
        <button class="sp-seg-btn" id="spTabAbout" type="button" role="tab" aria-selected="false">About</button>
        <button class="sp-seg-btn" id="spTabUpdates" type="button" role="tab" aria-selected="false">Updates</button>
      </div>

      <div class="sp-panels">

        <!-- CLOSED BY DEFAULT -->
        <div class="sp-panel" id="spPanelHours" role="tabpanel" aria-hidden="true">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Hours</div>
              <div class="sp-card-right" id="spHoursNow">—</div>
            </div>
            <div id="spHoursList"></div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelAbout" role="tabpanel" aria-hidden="true">
          <div class="sp-card">
            <div class="sp-card-title">About</div>
            <div class="sp-about" id="spAbout"></div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelUpdates" role="tabpanel" aria-hidden="true">
          <div class="sp-card">
            <div class="sp-card-title">Updates</div>
            <div id="spUpdateText">No updates yet.</div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- BRANDS MODAL (opens from Dock “Brands”) -->
  <div class="sp-modal" id="spBrandsModal" hidden>
    <div class="sp-modal-backdrop" id="spBrandsCloseBg" aria-hidden="true"></div>
    <div class="sp-modal-sheet" role="dialog" aria-modal="true" aria-label="Brands">
      <div class="sp-modal-head">
        <div class="sp-modal-title">Brands We Carry</div>
        <button class="sp-modal-close" id="spBrandsCloseBtn" type="button" aria-label="Close">✕</button>
      </div>

      <div class="sp-brand-grid" id="spBrandsGrid"></div>
    </div>
  </div>

  <!-- Toast for amenities -->
  <div class="sp-toast" id="spToast" hidden></div>

  <!-- ✅ Defer so DOM is ready before shop.js queries elements -->
  <script src="/shops/shop.js?v=13.6" defer></script>
</body>
</html>
