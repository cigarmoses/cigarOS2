<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Shop • CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/shops/shop.css?v=13.0" />
</head>

<body class="shop-public">
  <main class="sp-wrap">

    <section class="sp-top">

      <!-- SHOP pill -->
      <div class="sp-pill sp-pill-left">SHOP</div>

      <!-- TAA badge -->
      <img class="sp-taa" id="spTaaIcon" src="/img/icons/taa.svg" alt="TAA" />

      <!-- Logo -->
      <div class="sp-logo">
        <img id="spLogo" alt="" />
      </div>

      <!-- Shop Name -->
      <h1 class="sp-title" id="spName">Shop Name</h1>

      <!-- City -->
      <button class="sp-city" id="spAddressBtn">
        <svg viewBox="0 0 24 24" class="sp-gps">
          <path d="M12 2c-3.9 0-7 3.1-7 7 0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7z"/>
        </svg>
        <span id="spCity">City, ST</span>
      </button>

      <!-- ✅ ACTION DOCK (MOVED UP) -->
      <div class="sp-dock sp-dock-top">

        <button class="sp-dock-btn" id="spActCall">
          <span class="sp-dock-ico">📞</span>
          <span class="sp-dock-label">Call</span>
        </button>

        <button class="sp-dock-btn" id="spActWeb">
          <span class="sp-dock-ico">🌐</span>
          <span class="sp-dock-label">Web</span>
        </button>

        <button class="sp-dock-btn" id="spActBrands">
          <span class="sp-dock-ico">🏷️</span>
          <span class="sp-dock-label">Brands</span>
        </button>

        <button class="sp-dock-btn" id="spActDir">
          <span class="sp-dock-ico">🧭</span>
          <span class="sp-dock-label">Directions</span>
        </button>

      </div>

      <!-- ✅ AMENITIES ICONS ONLY -->
      <div class="sp-amen-panel">
        <div class="sp-amen-row" id="spAmenRow"></div>
      </div>

    </section>

    <!-- Bottom Section -->
    <section class="sp-bottom">

      <div class="sp-seg">
        <button class="sp-seg-btn is-active" id="spTabOverview">Overview</button>
        <button class="sp-seg-btn" id="spTabBrands">Brands</button>
        <button class="sp-seg-btn" id="spTabUpdates">Updates</button>
      </div>

      <div class="sp-panels">

        <div class="sp-panel is-active" id="spPanelOverview">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Hours</div>
              <div class="sp-card-right" id="spHoursNow">—</div>
            </div>
            <div id="spHoursList"></div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelBrands">
          <div class="sp-card">
            <div class="sp-card-title">Brands carried</div>
            <div class="sp-chips" id="spBrandChips"></div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelUpdates">
          <div class="sp-card">
            <div class="sp-card-title">Updates</div>
            <div id="spUpdateText">No updates yet.</div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="/shops/shop.js?v=13.0"></script>
</body>
</html>
