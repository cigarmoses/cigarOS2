<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Shop • CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/shops/shop.css?v=6" />
</head>

<body class="shop-public">
  <main class="sp-wrap">

    <!-- TOP PROFILE CARD -->
    <section class="sp-top sp-center" aria-label="Shop header">

      <!-- Top Left: SHOP -->
      <div class="sp-pill sp-pill-left" id="spPillLeft">SHOP</div>

      <!-- Top Right: (optional) TAA icon -->
      <div class="sp-status" aria-label="TAA status">
        <img class="sp-taa" id="spTaaIcon" src="/img/icons/taa.svg" alt="TAA" />
      </div>

      <!-- Center Logo -->
      <div class="sp-logo sp-logo-center" aria-hidden="true">
        <img id="spLogo" alt="" />
      </div>

      <!-- Center Name -->
      <h1 class="sp-title sp-title-center" id="spName">Shop Name</h1>

      <!-- City/state -->
      <button class="sp-city sp-city-center sp-link" id="spAddressBtn" type="button" aria-label="Open directions">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="sp-gps">
          <path d="M12 2c-3.9 0-7 3.1-7 7 0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7z" fill="currentColor"/>
          <circle cx="12" cy="9" r="2.5" fill="#fff"/>
        </svg>
        <span id="spCity">City, ST</span>
      </button>

      <!-- ✅ ACTION BAR MOVED UP (DIRECTLY UNDER CITY) -->
      <div class="sp-dock sp-dock-top" role="group" aria-label="Quick actions">
        <button class="sp-dock-btn" id="spActCall" type="button" aria-label="Call">
          <span class="sp-dock-ico" aria-hidden="true">📞</span>
          <span class="sp-dock-label">Call</span>
        </button>

        <button class="sp-dock-btn" id="spActWeb" type="button" aria-label="Website">
          <span class="sp-dock-ico" aria-hidden="true">🌐</span>
          <span class="sp-dock-label">Web</span>
        </button>

        <!-- ✅ Brands added (replaces Message) -->
        <button class="sp-dock-btn" id="spActBrands" type="button" aria-label="Brands">
          <span class="sp-dock-ico" aria-hidden="true">🏷️</span>
          <span class="sp-dock-label">Brands</span>
        </button>

        <button class="sp-dock-btn" id="spActDir" type="button" aria-label="Directions">
          <span class="sp-dock-ico" aria-hidden="true">🧭</span>
          <span class="sp-dock-label">Directions</span>
        </button>
      </div>

      <!-- ✅ AMENITIES ICONS ONLY (MOVED DOWN INTO OLD DOCK SPOT) -->
      <div class="sp-amen-panel" id="spAmenPanel" aria-label="Amenities">
        <div class="sp-amen-row" id="spAmenRow"></div>
      </div>

    </section>

    <!-- BOTTOM SECTION -->
    <section class="sp-bottom" aria-label="Shop details">

      <!-- SEGMENTED CONTROL -->
      <div class="sp-seg" role="tablist" aria-label="Shop sections">
        <button class="sp-seg-btn is-active" id="spTabOverview" type="button" role="tab" aria-selected="true">
          Overview
        </button>
        <button class="sp-seg-btn" id="spTabBrands" type="button" role="tab" aria-selected="false">
          Brands
        </button>
        <button class="sp-seg-btn" id="spTabUpdates" type="button" role="tab" aria-selected="false">
          Updates
        </button>
      </div>

      <!-- PANELS -->
      <div class="sp-panels">

        <!-- OVERVIEW -->
        <div class="sp-panel is-active" id="spPanelOverview" role="tabpanel">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Hours</div>
              <div class="sp-card-right" id="spHoursNow">—</div>
            </div>
            <div class="sp-hours" id="spHoursList"></div>
          </div>

          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Contact</div>
            </div>
            <div class="sp-kv">
              <div class="sp-kv-row">
                <div class="sp-kv-k">Phone</div>
                <div class="sp-kv-v" id="spPhoneVal">—</div>
              </div>
              <div class="sp-kv-row">
                <div class="sp-kv-k">Website</div>
                <div class="sp-kv-v" id="spWebVal">—</div>
              </div>
              <div class="sp-kv-row">
                <div class="sp-kv-k">Address</div>
                <div class="sp-kv-v" id="spAddrVal">—</div>
              </div>
            </div>
          </div>
        </div>

        <!-- BRANDS -->
        <div class="sp-panel" id="spPanelBrands" role="tabpanel">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Brands carried</div>
              <button class="sp-linkbtn" id="spViewAllBrands" type="button">View all</button>
            </div>
            <div class="sp-chips" id="spBrandChips"></div>
            <div class="sp-empty" id="spBrandsEmpty">No brand data yet.</div>
          </div>
        </div>

        <!-- UPDATES -->
        <div class="sp-panel" id="spPanelUpdates" role="tabpanel">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Today</div>
              <div class="sp-card-right" id="spUpdateTime">—</div>
            </div>
            <div class="sp-update" id="spUpdateText">No updates yet.</div>
            <button class="sp-linkbtn" id="spPostUpdate" type="button">Post update</button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="/shops/shop.js?v=12.6"></script>
</body>
</html>
