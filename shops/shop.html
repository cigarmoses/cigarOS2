<!-- /shops/shop.html
     FULL REPLACEMENT FILE (v13.1)
     - Segmented: Hours | About | Updates
     - Panels CLOSED by default
     - Dock icons: Brands + Directions use your SVGs
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Shop • CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/shops/shop.css?v=13.1" />
</head>

<body class="shop-public">
  <main class="sp-wrap">

    <section class="sp-top">

      <!-- SHOP pill -->
      <div class="sp-pill">SHOP</div>

      <!-- TAA badge (shown only when true) -->
      <img class="sp-taa" id="spTaaIcon" src="/img/icons/taa.svg" alt="TAA" />

      <!-- Logo -->
      <div class="sp-logo">
        <img id="spLogo" alt="" />
      </div>

      <!-- Shop Name -->
      <h1 class="sp-title" id="spName">Shop Name</h1>

      <!-- City -->
      <button class="sp-city" id="spAddressBtn" type="button">
        <svg viewBox="0 0 24 24" class="sp-gps" aria-hidden="true">
          <path d="M12 2c-3.9 0-7 3.1-7 7 0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7z"/>
        </svg>
        <span id="spCity">City, ST</span>
      </button>

      <!-- ACTION DOCK -->
      <div class="sp-dock sp-dock-top">

        <button class="sp-dock-btn" id="spActCall" type="button">
          <span class="sp-dock-ico" aria-hidden="true">📞</span>
          <span class="sp-dock-label">Call</span>
        </button>

        <button class="sp-dock-btn" id="spActWeb" type="button">
          <span class="sp-dock-ico" aria-hidden="true">🌐</span>
          <span class="sp-dock-label">Web</span>
        </button>

        <button class="sp-dock-btn" id="spActBrands" type="button">
          <img class="sp-dock-icon" src="/img/icons/brands.svg" alt="" />
          <span class="sp-dock-label">Brands</span>
        </button>

        <button class="sp-dock-btn" id="spActDir" type="button">
          <img class="sp-dock-icon" src="/img/icons/directions.svg" alt="" />
          <span class="sp-dock-label">Directions</span>
        </button>

      </div>

      <!-- AMENITIES ICONS ONLY -->
      <div class="sp-amen-panel">
        <div class="sp-amen-row" id="spAmenRow"></div>
      </div>

    </section>

    <!-- Bottom Section -->
    <section class="sp-bottom">

      <div class="sp-seg">
        <button class="sp-seg-btn" id="spTabHours" type="button">Hours</button>
        <button class="sp-seg-btn" id="spTabAbout" type="button">About</button>
        <button class="sp-seg-btn" id="spTabUpdates" type="button">Updates</button>
      </div>

      <!-- CLOSED by default -->
      <div class="sp-panels is-closed" id="spPanels">

        <div class="sp-panel" id="spPanelHours">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Hours</div>
              <div class="sp-card-right" id="spHoursNow">—</div>
            </div>
            <div id="spHoursList"></div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelAbout">
          <div class="sp-card">
            <div class="sp-card-title">About</div>
            <div id="spAboutText">—</div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelUpdates">
          <div class="sp-card">
            <div class="sp-card-title">Updates</div>
            <div id="spUpdateText">No updates yet.</div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Amenity tooltip/toast -->
  <div class="sp-toast" id="spAmenToast" role="status" aria-live="polite"></div>

  <script src="/shops/shop.js?v=13.1"></script>
</body>
</html>
