<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Shop • CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/shops/shop.css?v=13.1" />
</head>

<body class="shop-public">
  <main class="sp-wrap">

    <section class="sp-top">
      <!-- SHOP pill -->
      <div class="sp-pill sp-pill-left">SHOP</div>

      <!-- TAA badge (ONLY when true) -->
      <img class="sp-taa" id="spTaaIcon" src="/img/icons/taa.svg" alt="TAA" />

      <!-- Logo -->
      <div class="sp-logo">
        <img id="spLogo" alt="" />
      </div>

      <!-- Shop Name -->
      <h1 class="sp-title" id="spName">Shop Name</h1>

      <!-- City -->
      <button class="sp-city" id="spAddressBtn" type="button">
        <svg viewBox="0 0 24 24" class="sp-gps" aria-hidden="true">
          <path d="M12 2c-3.9 0-7 3.1-7 7 0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7z"/>
        </svg>
        <span id="spCity">City, ST</span>
      </button>

      <!-- ACTION DOCK -->
      <div class="sp-dock sp-dock-top">
        <button class="sp-dock-btn" id="spActCall" type="button">
          <span class="sp-dock-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.7 3.9 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.9.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C11.3 22 2 12.7 2 1c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.3.2 2.7.6 3.9.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
          </span>
          <span class="sp-dock-label">Call</span>
        </button>

        <button class="sp-dock-btn" id="spActWeb" type="button">
          <span class="sp-dock-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm7.9 9h-3.2c-.2-2.2-1-4.2-2.2-5.8 2.6.9 4.6 3.2 5.4 5.8zM12 4.1c1.5 1.7 2.5 4.1 2.7 6.9H9.3c.2-2.8 1.2-5.2 2.7-6.9zM4.1 13h3.2c.2 2.2 1 4.2 2.2 5.8-2.6-.9-4.6-3.2-5.4-5.8zM7.3 11H4.1c.8-2.6 2.8-4.9 5.4-5.8-1.2 1.6-2 3.6-2.2 5.8zM12 19.9c-1.5-1.7-2.5-4.1-2.7-6.9h5.4c-.2 2.8-1.2 5.2-2.7 6.9zM16.7 13h3.2c-.8 2.6-2.8 4.9-5.4 5.8 1.2-1.6 2-3.6 2.2-5.8z"/></svg>
          </span>
          <span class="sp-dock-label">Web</span>
        </button>

        <button class="sp-dock-btn" id="spActBrands" type="button">
          <span class="sp-dock-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20.6 12.7l-7.9 7.9c-.4.4-1 .4-1.4 0L3 12.3V3h9.3l8.3 8.3c.4.4.4 1 0 1.4zM7.5 7.5A1.5 1.5 0 1 0 7.5 4.5a1.5 1.5 0 0 0 0 3z"/></svg>
          </span>
          <span class="sp-dock-label">Brands</span>
        </button>

        <button class="sp-dock-btn" id="spActDir" type="button">
          <span class="sp-dock-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2l7 20-7-4-7 4 7-20zm0 6.4L9.7 15 12 13.8 14.3 15 12 8.4z"/></svg>
          </span>
          <span class="sp-dock-label">Directions</span>
        </button>
      </div>

      <!-- Amenities icons row -->
      <div class="sp-amen-panel">
        <div class="sp-amen-row" id="spAmenRow"></div>
      </div>
    </section>

    <!-- Bottom Section -->
    <section class="sp-bottom">
      <div class="sp-seg">
        <button class="sp-seg-btn is-active" id="spTabHours" type="button">Hours</button>
        <button class="sp-seg-btn" id="spTabAbout" type="button">About</button>
        <button class="sp-seg-btn" id="spTabUpdates" type="button">Updates</button>
      </div>

      <div class="sp-panels">
        <div class="sp-panel is-active" id="spPanelHours">
          <div class="sp-card">
            <div class="sp-card-head">
              <div class="sp-card-title">Hours</div>
              <div class="sp-card-right" id="spHoursNow">—</div>
            </div>
            <div id="spHoursList"></div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelAbout">
          <div class="sp-card">
            <div class="sp-card-title">About</div>
            <div class="sp-about-text" id="spAboutText">
              <span class="sp-about-muted">No details yet.</span>
            </div>
          </div>
        </div>

        <div class="sp-panel" id="spPanelUpdates">
          <div class="sp-card">
            <div class="sp-card-title">Updates</div>
            <div id="spUpdateText">No updates yet.</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- BRANDS SHEET (opened by Dock “Brands”) -->
  <div class="sp-sheet" id="spBrandsSheet" aria-hidden="true">
    <div class="sp-sheet-backdrop" id="spBrandsBackdrop"></div>
    <div class="sp-sheet-card" role="dialog" aria-modal="true" aria-label="Brands">
      <div class="sp-sheet-head">
        <div class="sp-sheet-title">Brands</div>
        <button class="sp-sheet-close" id="spBrandsClose" type="button">×</button>
      </div>

      <div class="sp-brand-grid" id="spBrandGrid"></div>
    </div>
  </div>

  <script src="/shops/shop.js?v=13.1"></script>
</body>
</html>
