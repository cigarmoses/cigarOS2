<script>
'use strict';
const items=[
['Micallef','Orange','Toro','Toro','Parejo','6','52','Colorado Claro','Medium','Connecticut','Mexican San Andrés Habano','Nicaragua, Dominican Republic','Nicaragua','/img/cigars/micallef/orangetoro.png',''],
['United Cigars','Independence','Toro','Toro','Parejo','5.875','50','Colorado','Full','Mexican Habano','Dominican HVA','Dominican Piloto Cubano and ligero, Nicaraguan ligero','Dominican Republic','/img/cigars/unitedcigars/independencetoro.png',''],
['Zino','Honduras','Toro','Toro','Parejo','6','50','Colorado','Medium','Ecuador','Honduras','Honduras','Honduras','/img/cigars/zino/hondurastoro.png',''],
['Crux','Marblehead Maduro','Toro','Toro','Parejo','6','50','Maduro','Medium-Full','Mexican San Andrés','Nicaragua','Nicaragua, Indonesia','Nicaragua','/img/cigars/crux/marbleheadmaduro.png',''],
['HVC','La Decoración','Robusto','Robusto','Parejo','5.5','52','Maduro','Medium','Ecuador Habano 2000','Nicaragua','Nicaragua Estelí and Jalapa','Nicaragua','/img/cigars/hvc/ladecoracionrobusto.png','Yes'],
['Rojas','Quiet Morning','Toro','Toro','Parejo','6','52','Colorado Claro','Mild-Medium','Ecuadorian Connecticut-seed','Nicaragua','Dominican Republic, Nicaragua','Nicaragua','/img/cigars/rojas/quietmorningtoro.png',''],
 ['Rocky Patel','Sapphire','Robusto','Robusto','Parejo','5.5','50','Maduro','Medium-Full','Mexican San Andrés','Honduras, Nicaragua','Nicaragua','Nicaragua','/img/cigars/rockypatel/sapphirerobusto.png','Yes']
 ];
 const keys=['brand','line','cigar','vitola','shape','length','ring','wrapper_shade','strength','wrapper','binder','filler','origin','cigar_img','box_pressed'];
const rows=items.map(a=>Object.fromEntries(keys.map((k,i)=>[k,a[i]])));const $=id=>document.getElementById(id);const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const el=(tag,cls,t)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(t!==undefined)n.textContent=t;return n;};
function photo(url){const frame=el('div','photo-frame'),img=new Image();img.alt='';img.decoding='async';img.addEventListener('load',()=>{let w=img.naturalWidth,h=img.naturalHeight,b={x:0,y:0,width:w,height:h};try{const s=Math.min(1,1400/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*s));c.height=Math.max(1,Math.ceil(h*s));const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);const p=ctx.getImageData(0,0,c.width,c.height).data;let l=c.width,r=-1,t=c.height,d=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(p[(y*c.width+x)*4+3]>0){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y)}if(r>=l&&d>=t){const x=Math.max(0,Math.floor((l-1)*w/c.width)),y=Math.max(0,Math.floor((t-1)*h/c.height));b={x,y,width:Math.min(w,Math.ceil((r+2)*w/c.width))-x,height:Math.min(h,Math.ceil((d+2)*h/c.height))-y}}}catch{}const vertical=b.height>b.width,ns='http://www.w3.org/2000/svg',art=document.createElementNS(ns,'svg'),source=document.createElementNS(ns,'image');art.classList.add('photo');art.setAttribute('viewBox','0 0 '+(vertical?b.height:b.width)+' '+(vertical?b.width:b.height));art.setAttribute('preserveAspectRatio','xMidYMid meet');art.setAttribute('aria-hidden','true');source.setAttribute('href',url);source.setAttribute('width',w);source.setAttribute('height',h);source.setAttribute('transform',vertical?'matrix(0 1 -1 0 '+(b.y+b.height)+' '+(-b.x)+')':'translate('+(-b.x)+' '+(-b.y)+')');art.append(source);frame.replaceChildren(art)},{once:true});img.addEventListener('error',()=>frame.remove(),{once:true});img.src=url;frame.append(img);return frame;}
const brandIcons={'Crux':'crux.svg','HVC':'hvc.svg','Micallef':'micallef.svg','Rocky Patel':'rockypatel.svg','Rojas':'rojas.svg','United Cigars':'unitedcigars.svg','Zino':'zino.svg'};
const captions={"Micallef":"Micallef Orange is the seventh addition to the acclaimed Micallef Color Series, continuing the brand’s commitment to quality and affordability. Handcrafted at the Micallef factory in Estelí, Nicaragua, this medium-bodied cigar features a Connecticut wrapper, a San Andrés Habano binder, and Nicaraguan and Dominican fillers, delivering notes of creamy coffee, toasted bread, sweetness, and pepper.","United Cigars":"Originally introduced as the limited-edition Independence Firecracker commemorating America’s 250th anniversary, Independence debuted as a regular production blend from United Cigars and Arnold André this August. Featuring a Mexican Habano wrapper, a Dominican binder, and Dominican and Nicaraguan ligero fillers, this full-bodied cigar delivers notes of floral sweetness, toasted grain, baking spices, earth, and pepper.","Zino":"Building on the success of Zino Nicaragua, Zino Honduras showcases tobaccos from the Honduran growing regions of Copán and the Jamastran Valley beneath an Ecuadorian wrapper. Handcrafted at the Diadema Cigars de Honduras factory, this medium-intensity blend balances earthy sweetness and subtle spice with distinctive notes of rosewood, orange, and cream.","Crux":"Crux Marblehead Maduro features the brand’s distinctive tapered head and Cuban-inspired 109 cap. Handcrafted in Nicaragua, the blend combines a Mexican San Andrés Maduro wrapper with Nicaraguan and Indonesian tobaccos. This medium-to-full-bodied cigar delivers notes of dark chocolate, espresso, and subtle pepper with a smooth, creamy finish.","Rocky Patel":"Following the releases of Gold Label and Emerald, Rocky Patel Sapphire showcases a carefully aged blend wrapped in a Mexican San Andrés leaf. Dual binders from Nicaragua’s Estelí region and Honduras’ Jamastran Valley surround aged Nicaraguan fillers from Condega, Estelí, and Jalapa. This medium-to-full-bodied cigar offers notes of espresso, caramel, chocolate, and sweet spices with a lingering natural sweetness.","HVC":"HVC La Decoracion revives a historic 19th-century Cuban cigar brand through Reinier Lorenzo’s modern approach to Nicaraguan cigar making. Featuring an Ecuadorian Habano 2000 wrapper over Nicaraguan tobaccos from Estelí and Jalapa, this medium-bodied, soft-pressed cigar delivers a balanced profile with rich complexity, baking spices, and a lingering sweetness.","Rojas":"Crafted by Noel Rojas at his factory in Nicaragua, Rojas Quiet Morning offers a flavorful interpretation of the traditional morning cigar. Featuring an Ecuadorian Connecticut-seed wrapper over a Nicaraguan binder and Dominican and Nicaraguan fillers, this blend delivers a creamy, balanced profile with notes of vanilla, cedar, caramel, cinnamon, and white pepper."};
function card(r){const root=el('details','card'),s=el('summary'),copy=el('div','copy');if(r.cigar_img)s.append(photo(r.cigar_img));copy.append(el('div','brand',r.brand),el('div','name',r.line+' '+r.cigar));const ch=el('span','chevron','⌄');ch.setAttribute('aria-hidden','true');copy.append(ch);if(brandIcons[r.brand]){const icon=el('img','brand-icon');icon.alt='';icon.addEventListener('load',()=>copy.classList.add('has-brand-icon'),{once:true});icon.src='/img/icons/brands/'+brandIcons[r.brand];copy.append(icon)}s.append(copy);root.append(s);const detail=el('div','details'),specs=el('div','specs');const groups=[['measurements',[['ring','Ring'],['length','Length'],['vitola','Vitola']]],['profile',[['wrapper_shade','Wrapper shade'],['strength','Strength']]],['tobaccos',[['wrapper','Wrapper'],['binder','Binder'],['filler','Filler']]],['origin-shape',[['origin','Rolled in (origin)'],['shape','Shape']]],['extras',[['box_pressed','Box-pressed']]]];for(const [name,fields] of groups){const dl=el('dl','spec-group');dl.dataset.row=name;for(const [key,label] of fields){if(!r[key])continue;const wrap=el('div','spec-pill');wrap.dataset.spec=key;wrap.append(el('dt','',label),el('dd','',r[key]));dl.append(wrap)}if(dl.children.length)specs.append(dl)}detail.append(specs);if(captions[r.brand]){detail.append(el('p','cigar-caption',captions[r.brand]));const credit=el('p','caption-credit'),a=el('a','','The Cigar Authority');a.href='https://thecigarauthority.com/2026-contenders-for-the-cigar-of-the-year/';a.target='_blank';a.rel='noopener noreferrer';credit.append(a);detail.append(credit)}root.append(detail);return root;}
const ordered=rows.sort((a,b)=>a.brand.localeCompare(b.brand));
$('results').replaceChildren(...ordered.map(card));
let stackBuilt=false;
function setView(mode){const isStack=mode==='stack';if(isStack&&!stackBuilt){$('stacked').replaceChildren(...ordered.map(r=>{const item=card(r);item.classList.add('stack-item');const summary=item.querySelector('summary');summary.setAttribute('aria-label',r.brand+' '+r.line+' '+r.cigar+' details');const plus=el('span','stack-plus');plus.setAttribute('aria-hidden','true');summary.append(plus);return item}));stackBuilt=true;}$('results').hidden=isStack;$('stacked').hidden=!isStack;$('box-view').setAttribute('aria-pressed',String(!isStack));$('stack-view').setAttribute('aria-pressed',String(isStack));}
$('box-view').addEventListener('click',()=>setView('box'));$('stack-view').addEventListener('click',()=>setView('stack'));setView('stack');
