<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><title>Two Guys Cigars: Cigar of the Year 2026 Contenders</title><link rel="stylesheet" href="/css/type.css"><link rel="stylesheet" href="/rankings/rankings.css?v=20261112-search1"><link rel="stylesheet" href="/firecrackers/firecrackers.css?v=1"><style>header h1{font-size:clamp(23px,5vw,32px);line-height:1.13;max-width:100%} .source-note{font-size:12px;opacity:.7;margin:20px 0} .source-note a{color:inherit} .card[hidden]{display:none!important}</style></head>
<body><main><section id="viewer"><header><h1>Two Guys Cigars: Cigar of the Year 2026 Contenders</h1></header><label class="main-search">Search contenders<input id="search" type="search" placeholder="Brand, wrapper, size…" autocomplete="off"></label><div class="collection-filters"><label>Brand<select id="brand"></select></label><label>Wrapper shade<select id="wrapper_shade"></select></label><label>Strength<select id="strength"></select></label></div><div class="collection-summary"><p id="summary" role="status"></p><button id="clear" class="quiet" type="button">Clear filters</button></div><div id="results"></div><p class="source-note">Six selected contenders. <a href="https://thecigarauthority.com/2026-contenders-for-the-cigar-of-the-year/" target="_blank" rel="noopener noreferrer">2026 announcement</a> · Winner announced January 2, 2027.</p></section></main>
<script>
'use strict';
const items=[
['Micallef','Orange','Toro','Toro','Parejo','6','52','Colorado Claro','Medium','Connecticut','Mexican San Andrés Habano','Nicaragua, Dominican Republic','Nicaragua','/img/cigars/micallef/orangetoro.png',''],
['United Cigars','Independence','Toro','Toro','Parejo','5.875','50','Colorado','Full','Mexican Habano','Dominican HVA','Dominican Piloto Cubano and ligero, Nicaraguan ligero','Dominican Republic','/img/cigars/unitedcigars/independencetoro.png',''],
['Zino','Honduras','Toro','Toro','Parejo','6','50','Colorado','Medium','Ecuador','Honduras','Honduras','Honduras','/img/cigars/zino/hondurastoro.png',''],
['Crux','Marblehead Maduro','Toro','Toro','Parejo','6','50','Maduro','Medium-Full','Mexican San Andrés','Nicaragua','Nicaragua, Indonesia','Nicaragua','/img/cigars/crux/marbleheadmadurotoro.png',''],
['HVC','La Decoración','Robusto','Robusto','Parejo','5.5','52','Maduro','Medium','Ecuador Habano 2000','Nicaragua','Nicaragua Estelí and Jalapa','Nicaragua','/img/cigars/hvc/ladecoracionrobusto.png','Yes'],
['Rojas','Quiet Morning','Toro','Toro','Parejo','6','52','Colorado Claro','Mild-Medium','Ecuadorian Connecticut-seed','Nicaragua','Dominican Republic, Nicaragua','Nicaragua','/img/cigars/rojas/quietmorningtoro.png','']
];
const keys=['brand','line','cigar','vitola','shape','length','ring','wrapper_shade','strength','wrapper','binder','filler','origin','cigar_img','box_pressed'];
const rows=items.map(a=>Object.fromEntries(keys.map((k,i)=>[k,a[i]])));const $=id=>document.getElementById(id);const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const el=(tag,cls,t)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(t!==undefined)n.textContent=t;return n;};
function photo(url){const frame=el('div','photo-frame'),img=new Image();img.alt='';img.decoding='async';img.addEventListener('load',()=>{let w=img.naturalWidth,h=img.naturalHeight,b={x:0,y:0,width:w,height:h};try{const s=Math.min(1,1400/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*s));c.height=Math.max(1,Math.ceil(h*s));const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);const p=ctx.getImageData(0,0,c.width,c.height).data;let l=c.width,r=-1,t=c.height,d=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(p[(y*c.width+x)*4+3]>0){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y)}if(r>=l&&d>=t){const x=Math.max(0,Math.floor((l-1)*w/c.width)),y=Math.max(0,Math.floor((t-1)*h/c.height));b={x,y,width:Math.min(w,Math.ceil((r+2)*w/c.width))-x,height:Math.min(h,Math.ceil((d+2)*h/c.height))-y}}}catch{}const vertical=b.height>b.width,ns='http://www.w3.org/2000/svg',art=document.createElementNS(ns,'svg'),source=document.createElementNS(ns,'image');art.classList.add('photo');art.setAttribute('viewBox','0 0 '+(vertical?b.height:b.width)+' '+(vertical?b.width:b.height));art.setAttribute('preserveAspectRatio','xMidYMid meet');art.setAttribute('aria-hidden','true');source.setAttribute('href',url);source.setAttribute('width',w);source.setAttribute('height',h);source.setAttribute('transform',vertical?'matrix(0 1 -1 0 '+(b.y+b.height)+' '+(-b.x)+')':'translate('+(-b.x)+' '+(-b.y)+')');art.append(source);frame.replaceChildren(art)},{once:true});img.addEventListener('error',()=>frame.remove(),{once:true});img.src=url;frame.append(img);return frame;}
function card(r){const root=el('details','card'),s=el('summary'),copy=el('div','copy');if(r.cigar_img)s.append(photo(r.cigar_img));copy.append(el('div','brand',r.brand),el('div','name',r.line+' '+r.cigar));const ch=el('span','chevron','⌄');ch.setAttribute('aria-hidden','true');copy.append(ch);s.append(copy);root.append(s);const detail=el('div','details'),specs=el('div','specs');const groups=[['measurements',[['ring','Ring'],['length','Length'],['vitola','Vitola']]],['profile',[['wrapper_shade','Wrapper shade'],['strength','Strength']]],['tobaccos',[['wrapper','Wrapper'],['binder','Binder'],['filler','Filler']]],['origin-shape',[['origin','Rolled in (origin)'],['shape','Shape']]],['extras',[['box_pressed','Box-pressed']]]];for(const [name,fields] of groups){const dl=el('dl','spec-group');dl.dataset.row=name;for(const [key,label] of fields){if(!r[key])continue;const wrap=el('div','spec-pill');wrap.dataset.spec=key;wrap.append(el('dt','',label),el('dd','',r[key]));dl.append(wrap)}if(dl.children.length)specs.append(dl)}detail.append(specs);root.append(detail);return root;}
const filters=['brand','wrapper_shade','strength'];for(const k of filters){$(k).replaceChildren(new Option('All',''),...[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(v=>new Option(v,v)))}const cards=rows.map(card);$('results').replaceChildren(...cards);function render(){const terms=norm($('search').value).split(/\s+/).filter(Boolean);let n=0;rows.forEach((r,i)=>{const match=filters.every(k=>!$(k).value||r[k]===$(k).value)&&terms.every(t=>keys.some(k=>k!=='cigar_img'&&norm(r[k]).includes(t)));cards[i].hidden=!match;if(match)n++});$('summary').textContent=n+' of '+rows.length+' contenders';}function route(){const u=new URL(location.href);u.search='';if($('search').value)u.searchParams.set('q',$('search').value);for(const k of filters)if($(k).value)u.searchParams.set(k,$(k).value);history.replaceState(null,'',u.pathname+u.search);render()}function restore(){const u=new URL(location.href);$('search').value=u.searchParams.get('q')||'';for(const k of filters)$(k).value=u.searchParams.get(k)||'';render()}for(const k of ['search',...filters])$(k).addEventListener(k==='search'?'input':'change',route);$('clear').onclick=()=>{$('search').value='';for(const k of filters)$(k).value='';route()};window.addEventListener('popstate',restore);restore();
</script></body></html>
