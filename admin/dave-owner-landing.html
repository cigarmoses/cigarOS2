<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dave Garofalo • Owner Hub</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#080a0c;background:#f0f4fb;--blue:#2c70e5;--orange:#ff9800;--green:#00ce7c}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #101b39;outline-offset:5px}main{max-width:520px;margin:auto;min-height:100svh;padding:clamp(35px,12vh,115px) 22px 25px}.owner{display:block;position:relative;z-index:2;margin:auto;width:178px;background:white;border:9px solid var(--blue);border-radius:70px;padding:13px 15px;font-weight:800;font-size:16px;line-height:1.12;box-shadow:inset 0 -3px 4px #0003}.bridge{height:39px;border:3px solid var(--blue);border-bottom:0;width:72%;margin:-20px auto 17px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:38px}.column{--accent:var(--orange);text-align:center;min-width:0}.column.retail{--accent:var(--green)}.category{display:block;border:0;background:var(--accent);color:white;font-weight:800;font-size:clamp(23px,6.2vw,36px);width:100%;padding:5px 0;margin:0 0 20px}.hub-label{display:block;color:var(--accent);font-size:10px;font-weight:800;margin-bottom:-2px}.node{display:block;width:90%;margin:auto;background:white;border:6px solid var(--accent);border-radius:60px;min-height:53px;font-size:10px;font-weight:800;padding:11px 5px;box-shadow:0 3px 3px #0002}.hub{width:100%;font-size:15px;line-height:1.14;min-height:64px;padding:8px 5px}.fork{height:37px;width:50px;margin:auto;position:relative}.fork:before{content:'';height:13px;width:4px;background:var(--accent);position:absolute;left:23px;top:0}.fork:after{content:'';position:absolute;border:4px solid var(--accent);border-bottom:0;width:50px;height:23px;left:0;bottom:0}.children{display:flex;flex-direction:column;gap:24px}.website{color:#747474}.note{font-size:11px;color:#7b8490;text-align:center;line-height:1.5;margin-top:30px}.detail{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 30px #172c4510}.detail h1{font-size:28px;margin:22px 0 10px}.detail p{font-size:16px;line-height:1.5;color:#596474}.back,.module{border:1px solid #d8e0ec;border-radius:18px;background:#f0f4fb;padding:12px 18px;font-size:16px}.modules{display:grid;gap:12px;margin-top:20px}.module{text-align:left;background:white}.result{border-radius:12px;background:#ecf3fc;padding:15px}.hidden{display:none}@media(max-width:360px){main{padding-left:16px;padding-right:16px}.columns{gap:24px}.node{font-size:9px}.hub{font-size:14px}}@media(min-width:700px){main{padding-top:65px}.columns{gap:48px}.node{min-height:64px;font-size:12px}.hub{font-size:18px}.children{gap:28px}}
</style></head><body><main><section id="landing"><button class="owner" data-dest="Dave Garofalo">DAVE<br>GAROFALO</button><div class="bridge" aria-hidden="true"></div><div class="columns"><section class="column"><button class="category" data-dest="Brands">BRANDS</button><span class="hub-label">HUB</span><button class="node hub" data-dest="United Cigars hub">UNITED<br>CIGARS</button><div class="fork" aria-hidden="true"></div><div class="children"><button class="node" data-dest="Garofalo Family Cigars">GAROFALO</button><button class="node" data-dest="La Gianna Cigars">LA GIANNA</button><button class="node" data-dest="United Cigars">UNITED</button></div></section><section class="column retail"><button class="category" data-dest="Retail">RETAIL</button><span class="hub-label">HUB</span><button class="node hub" data-dest="Two Guys Cigars group">TWO<br>GUYS</button><div class="fork" aria-hidden="true"></div><div class="children"><button class="node" data-dest="Salem">SALEM</button><button class="node" data-dest="Seabrook">SEABROOK</button><button class="node" data-dest="Nashua">NASHUA</button><button class="node website" data-dest="Website">-WEBSITE-</button></div></section></div></section><section id="detail" class="detail hidden"></section><p class="note">Interactive design preview · No live data or actions</p></main><script>
const landing=document.querySelector('#landing'),detail=document.querySelector('#detail');let history=[],focusOrigins=[];
const children={'Dave Garofalo':['Brands','Retail'],Brands:['United Cigars hub','Garofalo Family Cigars','La Gianna Cigars','United Cigars'],'United Cigars hub':['Garofalo Family Cigars','La Gianna Cigars','United Cigars'],Retail:['Two Guys Cigars group','Salem','Seabrook','Nashua','Website'],'Two Guys Cigars group':['Salem','Seabrook','Nashua']};
function open(name,push=true){if(push){history.push(name);focusOrigins.push(document.activeElement)}landing.classList.add('hidden');detail.classList.remove('hidden');const website=name==='Website';detail.innerHTML='<button class="back">‹ Back</button><h1>'+name+'</h1><p>'+(website?'Website workspace preview. No external site is opened and no website changes are made.':children[name]?'Choose a workspace below.':'Scoped workspace preview. No live account or inventory is connected.')+'</p><div class="modules">'+(children[name]|| (website?['Website overview','Content','Settings']:['Inventory','Orders','Reports'])).map(n=>'<button class="module" '+(children[name]?'data-next':'data-module')+'="'+n+'">'+n+'</button>').join('')+'</div><p id="status" role="status"></p>';detail.querySelector('.back').onclick=back;detail.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>open(b.dataset.next));detail.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{let s=document.querySelector('#status');s.className='result';s.textContent=b.dataset.module+' for '+name+': design placeholder only. No live changes.'});detail.querySelector('.back').focus();window.scrollTo(0,0)}
function back(){history.pop();const origin=focusOrigins.pop();if(history.length)open(history.at(-1),false);else{detail.classList.add('hidden');landing.classList.remove('hidden');if(origin&&origin.isConnected)origin.focus()}window.scrollTo(0,0)}document.querySelectorAll('[data-dest]').forEach(b=>b.onclick=()=>open(b.dataset.dest));
</script></body></html>
