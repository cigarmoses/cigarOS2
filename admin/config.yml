backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "shops"
    label: "Shops"
    folder: "data/shops"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Shop Slug", name: "slug", widget: "string" }
      - { label: "Shop Name", name: "name", widget: "string" }
      - { label: "City", name: "city", widget: "string" }
      - { label: "State", name: "state", widget: "string" }
      - { label: "Address", name: "address", widget: "string", required: false }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }

      # Toggle fields that match your current icons
      - label: "Amenities"
        name: "amenities"
        widget: "object"
        fields:
          - { label: "Food", name: "food", widget: "boolean", default: false }
          - { label: "Alcohol", name: "alcohol", widget: "boolean", default: false }
          - { label: "BYOB", name: "byob", widget: "boolean", default: false }
          - { label: "TVs", name: "tvs", widget: "boolean", default: false }
          - { label: "Outdoor", name: "outdoor", widget: "boolean", default: false }
          - { label: "Indoor", name: "indoor", widget: "boolean", default: true }
          - { label: "Quiet", name: "quiet", widget: "boolean", default: false }
          - { label: "Live Music", name: "livemusic", widget: "boolean", default: false }
          - { label: "TAA", name: "taa", widget: "boolean", default: false }

      # Hours like your current shop page
      - label: "Hours"
        name: "hours"
        widget: "object"
        fields:
          - { label: "Monday", name: "mon", widget: "string", required: false }
          - { label: "Tuesday", name: "tue", widget: "string", required: false }
          - { label: "Wednesday", name: "wed", widget: "string", required: false }
          - { label: "Thursday", name: "thu", widget: "string", required: false }
          - { label: "Friday", name: "fri", widget: "string", required: false }
          - { label: "Saturday", name: "sat", widget: "string", required: false }
          - { label: "Sunday", name: "sun", widget: "string", required: false }

      # ✅ Brands: multi-select from brands.json
      - label: "Brands"
        name: "brands"
        widget: "relation"
        collection: "brands"
        search_fields: ["name", "slug"]
        value_field: "slug"
        display_fields: ["name"]
        multiple: true
        required: false

  - name: "brands"
    label: "Brands"
    files:
      - label: "Brand List"
        name: "brand_list"
        file: "data/brands.json"
        fields:
          - label: "Brands"
            name: "brands"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
