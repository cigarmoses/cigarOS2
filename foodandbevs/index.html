<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food & Beverages</title>

  <!-- Core styles: keep system.css the same file I gave you -->
  <link rel="stylesheet" href="../css/system.css" />

  <style>
    /* Page-scoped tweaks for this screen only */
    .page { padding-bottom: 120px; } /* room for cart pill */
    .app-grid { grid-template-columns: repeat(4, 1fr); }
    .app-icon { width: 76px; height: 76px; background: none !important; box-shadow: none !important; }
    .app-tile { padding: 6px; gap: 6px; }
    .app-tile .app-label { display: none; } /* no captions on Food & Bevs */
    .page-title { letter-spacing: .5px; }
    /* Modal */
    .sheet {
      position: fixed; left: 0; right: 0; bottom: -100%;
      background: #0e1a28; color: #fff; border-radius: 20px 20px 0 0;
      padding: 20px 16px 24px; transition: bottom .25s ease; z-index: 80;
      box-shadow: 0 -12px 24px rgba(0,0,0,.35);
    }
    .sheet.open { bottom: 0; }
    .sheet h2 { font-size: 20px; margin: 0 0 6px; }
    .sheet .price { font-weight: 700; font-size: 18px; margin-left: auto; }
    .qty-row { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; }
    .qty-btn { width: 56px; height: 56px; border-radius: 14px; background:#09121d; color:#fff; font-size: 28px; border:1px solid rgba(255,255,255,.08); }
    .qty { width: 72px; height: 56px; border-radius:14px; background:#0b1725; color:#fff; font-weight:700; font-size:22px; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; }
    .subtotal { opacity:.8; font-size:14px; margin: 10px 0 16px; }
    .sheet-actions { display:flex; gap:12px; }
    .btn { flex:1; height:54px; border-radius:14px; font-weight:700; font-size:16px; border:none; }
    .btn-secondary { background:#101c2b; color:#fff; }
    .btn-primary { background:#ff4040; color:#fff; }
    /* Cart pill */
    .cart-pill {
      position: fixed; right: 20px; bottom: 20px; z-index: 70;
      background:#0e1a28; color:#fff; border-radius:24px; padding:12px 18px;
      display:flex; align-items:center; gap:12px;
      box-shadow:0 8px 24px rgba(0,0,0,.25); font-weight:700;
    }
    .cart-pill .count { background:#e94d45; border-radius:999px; padding:4px 8px; }
    .back-link { text-decoration:none; color:inherit; font-size:22px; }
  </style>
</head>

<body>
  <div class="page">
    <div class="toprow">
      <a href="../pos/index.html" class="back-link">←</a>
      <h1 class="page-title">FOOD &amp; BEVERAGES</h1>
    </div>

    <div id="grid" class="app-grid"></div>
  </div>

  <!-- Cart summary pill -->
  <div class="cart-pill" id="cartPill">
    <img src="../img/icons/cart.svg" alt="" style="width:18px;height:18px">
    <span class="count" id="cartCount">0</span>
    <span id="cartTotal">$0.00</span>
  </div>

  <!-- Add-to-bill sheet -->
  <div id="sheet" class="sheet" aria-hidden="true">
    <div style="display:flex; align-items:center; gap:12px;">
      <img id="sheetIcon" src="" alt="" style="width:28px;height:28px;border-radius:8px; background:#0b1725;">
      <h2 id="sheetTitle">Item</h2>
      <div class="price" id="sheetPrice">$0.00</div>
    </div>

    <div class="qty-row">
      <button class="qty-btn" id="minusBtn" aria-label="Decrease">−</button>
      <div class="qty" id="qty">1</div>
      <button class="qty-btn" id="plusBtn" aria-label="Increase">+</button>
    </div>

    <div class="subtotal" id="subtotal">$0.00 subtotal</div>

    <div class="sheet-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="addBtn">Add to Bill</button>
    </div>
  </div>

  <script>
    // ----- DATA (exact names & prices you supplied) -----
    const ITEMS = [
      { n:'7 Up', p:1.50, f:'7up.svg' },
      { n:'Cocacola', p:1.50, f:'cocacola.svg' },
      { n:'Coke Zero', p:1.50, f:'cokezero.svg' },
      { n:'Diet Coke', p:1.50, f:'dietcoke.svg' },
      { n:'Diet Dr. Pepper', p:1.50, f:'drpepperdiet.svg' },
      { n:'Dr. Pepper', p:1.50, f:'drpepper.svg' },
      { n:'Dunkin', p:3.50, f:'dunkin.svg' },
      { n:'Gatorade', p:3.50, f:'gatorade.svg' },
      { n:'Ginger Ale', p:1.50, f:'canadadry.svg' },
      { n:'GP Sweet Tea', p:1.50, f:'gpsweettea.svg' },
      { n:'GP Unsweetened Tea', p:1.50, f:'gpunsweetened.svg' },
      { n:'GP Zero Sugar Sweet Tea', p:1.50, f:'gpzerosugarsweettea.svg' },
      { n:'Monster Tea', p:3.50, f:'monster.svg' },
      { n:'Mountain Dew', p:1.50, f:'mountaindew.svg' },
      { n:'Pepsi', p:1.50, f:'pepsi.svg' },
      { n:'Red Bull', p:3.50, f:'redbull.svg' },
      { n:'Root Beer', p:1.50, f:'aw.svg' },
      { n:'Sprite', p:1.50, f:'sprite.svg' },
      { n:'Starbucks', p:3.50, f:'starbucks.svg' },
      { n:'Water', p:1.50, f:'water.svg' }
    ];
    const ICON_BASE = '../img/foodandbevs/';

    // ----- Render grid (4-up, pure SVGs, no wrappers) -----
    const grid = document.getElementById('grid');
    grid.innerHTML = ITEMS.map((it, i) => `
      <button class="app-tile" data-i="${i}" style="background:none;border:none;">
        <img class="app-icon" alt="${it.n}" src="${ICON_BASE + it.f}">
      </button>
    `).join('');

    // ----- Cart (very light demo) -----
    let cartCount = 0;
    let cartTotal = 0;
    const cartCountEl = document.getElementById('cartCount');
    const cartTotalEl = document.getElementById('cartTotal');

    function updateCartPill() {
      cartCountEl.textContent = cartCount;
      cartTotalEl.textContent = `$${cartTotal.toFixed(2)}`;
    }

    // ----- Sheet (popup) -----
    const sheet = document.getElementById('sheet');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetPrice = document.getElementById('sheetPrice');
    const sheetIcon  = document.getElementById('sheetIcon');
    const qtyEl = document.getElementById('qty');
    const subtotalEl = document.getElementById('subtotal');
    const minusBtn = document.getElementById('minusBtn');
    const plusBtn  = document.getElementById('plusBtn');
    const cancelBtn= document.getElementById('cancelBtn');
    const addBtn   = document.getElementById('addBtn');

    let currentItem = null;
    let qty = 1;

    function openSheet(item) {
      currentItem = item;
      qty = 1;
      sheetTitle.textContent = item.n;
      sheetPrice.textContent = `$${item.p.toFixed(2)}`;
      sheetIcon.src = ICON_BASE + item.f;
      qtyEl.textContent = qty;
      subtotalEl.textContent = `$${(item.p * qty).toFixed(2)} subtotal`;
      sheet.classList.add('open');
      sheet.setAttribute('aria-hidden','false');
    }
    function closeSheet() {
      sheet.classList.remove('open');
      sheet.setAttribute('aria-hidden','true');
    }

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.app-tile');
      if (!btn) return;
      const i = +btn.dataset.i;
      openSheet(ITEMS[i]);
    });

    minusBtn.onclick = () => { if (qty > 1) { qty--; qtyEl.textContent = qty; subtotalEl.textContent = `$${(currentItem.p * qty).toFixed(2)} subtotal`; } };
    plusBtn.onclick  = () => { qty++; qtyEl.textContent = qty; subtotalEl.textContent = `$${(currentItem.p * qty).toFixed(2)} subtotal`; };
    cancelBtn.onclick= closeSheet;
    addBtn.onclick   = () => {
      cartCount += qty;
      cartTotal += currentItem.p * qty;
      updateCartPill();
      closeSheet();
    };

    updateCartPill();
  </script>
</body>
</html>
