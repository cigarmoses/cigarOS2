<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Food & Beverages</title>
<link rel="stylesheet" href="/css/system.css" />
<style>
  :root{ --bg:#ECF3F7; --shadow:0 16px 36px rgba(8,15,30,.10); }
  body{ margin:0; background:var(--bg); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  .wrap{ max-width:520px; margin:0 auto; padding:18px 18px 120px; }
  .topbar{ display:flex; align-items:center; gap:10px; }
  .back{ text-decoration:none; color:#111; font-size:28px; line-height:1; }
  h1{ margin:6px 0 18px; text-align:center; font-size:22px; letter-spacing:.06em; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .icon{ display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; }
  .icon img{ width:100%; height:100%; object-fit:contain; display:block; border:none; }
  .pad-bill{ height:110px; }

  /* Simple modal */
  dialog{ border:none; border-radius:18px; width:min(92vw,420px); padding:18px;
          box-shadow:var(--shadow); }
  .modal-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .qty{ display:flex; gap:10px; align-items:center; margin:10px 0 18px; }
  .qty button{ width:36px; height:36px; border-radius:10px; border:none; background:#0b1423; color:#fff; font-size:18px; }
  .primary{ width:100%; border:none; border-radius:12px; padding:12px 14px; background:#0b1423; color:#fff; font-weight:700; }
  .ghost{ border:none; background:transparent; color:#0b1423; font-weight:600; padding:8px 10px; }

  /* bill dock */
  .bill-dock{ position:fixed; right:18px; bottom:18px; background:#0b1423; color:#fff;
              border-radius:22px; padding:10px 16px; display:flex; gap:10px; align-items:center;
              box-shadow:0 18px 46px rgba(8,15,30,.22); }
  .pill{ background:#E35151; color:#fff; border-radius:999px; padding:2px 10px; font-weight:700; }
</style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <a class="back" href="/pos/">‹</a><div style="flex:1"></div>
    </header>
    <h1>FOOD &amp; BEVERAGES</h1>

    <section id="grid" class="grid"></section>
    <div class="pad-bill"></div>
  </main>

  <!-- Quantity / Add modal -->
  <dialog id="picker">
    <div class="modal-head">
      <img id="pIcon" alt="" style="width:44px;height:44px;object-fit:contain" />
      <div>
        <div id="pName" style="font-weight:700"></div>
        <div id="pPrice" style="opacity:.7"></div>
      </div>
      <div style="flex:1"></div>
      <button class="ghost" onclick="picker.close()">Close</button>
    </div>
    <div class="qty">
      <button onclick="chg(-1)">−</button>
      <div id="q" style="min-width:36px;text-align:center;font-weight:700;">1</div>
      <button onclick="chg(1)">+</button>
    </div>
    <button class="primary" onclick="addToBill()">Add to bill</button>
  </dialog>

  <button class="bill-dock" onclick="location.href='/pos/checkout/'" aria-label="Open Bill">
    <img src="/img/icons/pos.svg" alt="" style="width:22px;height:22px" />
    <span class="pill" id="billCount">0</span>
    <span id="billTotal">$0.00</span>
  </button>

  <script>
    // Catalog (icons live in /img/icons/foodandbevs/)
    const items = [
      { id:'gatorade', name:'Gatorade', price:1.50 },
      { id:'7up', name:'7 UP', price:1.50 },
      { id:'pepsi', name:'Pepsi', price:1.50 },
      { id:'aw', name:'A&W Root Beer', price:1.50, icon:'rootbeer' },
      { id:'sprite', name:'Sprite', price:1.50 },
      { id:'drpepperdiet', name:'Diet Dr Pepper', price:1.50, icon:'dietdrpepper' },
      { id:'monstertea', name:'Monster Tea', price:3.50 },
      { id:'dietcoke', name:'Diet Coke', price:1.50, icon:'dietcoke' },
      { id:'goldpeakzero', name:'Gold Peak Zero', price:1.50 },
      { id:'goldpeaksweet', name:'Gold Peak Sweet', price:1.50 },
      { id:'goldpeakunsweet', name:'Gold Peak Unsweet', price:1.50 },
      { id:'mountaindew', name:'Mountain Dew', price:1.50 },
      { id:'canadadry', name:'Canada Dry', price:1.50, icon:'canadadry' },
      { id:'drpepper', name:'Dr Pepper', price:1.50, icon:'drpepper' },
      { id:'cocacola', name:'Coca-Cola', price:1.50, icon:'cocacola' },
      { id:'cocacolazero', name:'Coca-Cola Zero', price:1.50, icon:'cocacolazero' },
      { id:'redbull', name:'Red Bull', price:1.50 },
      { id:'water', name:'Water', price:1.00, icon:'pos' } // replace icon when you add water.svg
    ];

    const grid = document.getElementById('grid');
    items.forEach(it => {
      const btn = document.createElement('button');
      btn.className = 'icon';
      btn.style.background='transparent';
      btn.style.border='0';
      btn.style.padding='0';
      btn.onclick = () => openPicker(it);
      const img = document.createElement('img');
      const file = it.icon || it.id;
      img.src = `/img/icons/foodandbevs/${file}.svg`;
      img.alt = it.name;
      btn.appendChild(img);
      grid.appendChild(btn);
    });

    let current = null, qty = 1;
    const picker = document.getElementById('picker');
    function openPicker(it){
      current = it; qty = 1;
      document.getElementById('pIcon').src = `/img/icons/foodandbevs/${(it.icon||it.id)}.svg`;
      document.getElementById('pName').textContent = it.name;
      document.getElementById('pPrice').textContent = `$${it.price.toFixed(2)}`;
      document.getElementById('q').textContent = qty;
      picker.showModal();
    }
    function chg(n){ qty = Math.max(1, qty + n); document.getElementById('q').textContent = qty; }
    function addToBill(){
      // Hook into your cart; for now, update simple totals
      const countEl = document.getElementById('billCount');
      const totalEl = document.getElementById('billTotal');
      const newCount = (+countEl.textContent || 0) + qty;
      const newTotal = (+totalEl.textContent.replace(/[$,]/g,'') || 0) + qty * current.price;
      countEl.textContent = newCount;
      totalEl.textContent = `$${newTotal.toFixed(2)}`;
      picker.close();
    }
  </script>
</body>
</html>
