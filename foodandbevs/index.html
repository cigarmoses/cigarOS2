<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Food & Beverages</title>
  <link rel="stylesheet" href="/css/system.css?v=2.2" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="back-btn" aria-label="Back" href="/pos/">←</a>
      <h1 class="page-title">FOOD & BEVERAGES</h1>
    </header>

    <!-- 3-up grid on mobile, pure SVGs (no captions, no shells) -->
    <section id="bevGrid" class="grid cols-3"></section>
  </main>

  <!-- Cart dock (shared look) -->
  <div class="cart-dock" id="dock">
    <img class="cart-icon" src="/img/icons/pos.svg" alt="" />
    <span class="cart-count" id="dockCount">0</span>
    <span class="cart-total" id="dockTotal">$0.00</span>
  </div>

  <script>
    /* ---------- DATA ---------- */
    // Use simple, consistent ids. Price per your spec.
    const items = [
      { id:"gatorade",        price:1.50 },
      { id:"7up",             price:1.50 },
      { id:"pepsi",           price:1.50 },
      { id:"aw",              price:1.50 }, // if your file is 'rootbeer.svg', we add an alias below
      { id:"sprite",          price:1.50 },
      { id:"drpepper-diet",   price:1.50 },
      { id:"monstertea",      price:3.50 },
      { id:"dietcoke",        price:1.50 },
      { id:"canadadry",       price:1.50 },
      { id:"drpepper",        price:1.50 },
      { id:"cocacola",        price:1.50 },
      { id:"cocacolazero",    price:1.50 },
      { id:"mountaindew",     price:1.50 },
      { id:"redbull",         price:1.50 },
      { id:"gold-peak-zero",  price:1.50 },
      { id:"gold-peak-sweet", price:1.50 },
      { id:"gold-peak-unsweet", price:1.50 },
      { id:"water",           price:1.00 },
    ];

    // Optional filename aliases if your repo used different names:
    const aliases = {
      "aw": "rootbeer",                  // use file 'rootbeer.svg' for A&W
      "drpepper-diet": "dietdrpepper",   // file named 'dietdrpepper.svg'
      "gold-peak-zero": "goldpeak-zero",
      "gold-peak-sweet": "goldpeak-sweet",
      "gold-peak-unsweet": "goldpeak-unsweet",
    };

    /* ---------- HELPERS ---------- */
    const $grid = document.getElementById('bevGrid');
    const countEl = document.getElementById('dockCount');
    const totalEl = document.getElementById('dockTotal');
    const fmt = n => '$' + n.toFixed(2);

    // Lightweight cart so the dock shows something
    const cart = JSON.parse(localStorage.getItem('cart')||'{"c":0,"t":0}');
    function updateDock(){ countEl.textContent = cart.c||0; totalEl.textContent = fmt(cart.t||0); }
    function addToCart(price, qty=1){ cart.c += qty; cart.t += price*qty; localStorage.setItem('cart', JSON.stringify(cart)); updateDock(); }
    updateDock();

    // Build a resilient <img> that tries multiple paths/extensions
    function buildSmartImg(baseId){
      const file = (aliases[baseId] || baseId)
        .toLowerCase()
        .replace(/\s+/g,'-')
        .replace(/[^a-z0-9\-]/g,'');

      const candidates = [
        `/img/icons/foodandbevs/${file}.svg`,
        `/img/foodandbevs/${file}.svg`,
        `/img/icons/foodandbevs/${file}.png`,
        `/img/foodandbevs/${file}.png`,
      ];

      const img = new Image();
      img.className = 'app-icon';
      img.alt = '';
      let i = 0;
      img.src = candidates[i];
      img.onerror = () => {
        i++;
        if(i < candidates.length){ img.src = candidates[i]; }
        else {
          // Final fallback: tiny transparent pixel so layout stays clean
          img.removeAttribute('onerror');
          img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
        }
      };
      return img;
    }

    // Render the grid (no captions beneath icons)
    items.forEach(it => {
      const a = document.createElement('a');
      a.className = 'app-tile';
      a.href = '#';
      a.appendChild(buildSmartImg(it.id));
      a.addEventListener('click', e => {
        e.preventDefault();
        addToCart(it.price, 1); // default qty = 1 on tap
      });
      $grid.appendChild(a);
    });

    // Ensure cached CSS isn’t causing “white tiles”
    if('serviceWorker' in navigator){
      caches && caches.keys && caches.keys().then(keys => keys.forEach(k=>caches.delete(k)));
    }
  </script>
</body>
</html>
