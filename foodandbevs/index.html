<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food & Beverages</title>

  <!-- Base styles (your existing system.css) -->
  <link rel="stylesheet" href="/css/system.css" />

  <!-- Hard-lock this page to 4-up grid and ensure mobile cart/modal look right -->
  <style>
    /* 4-per-row on mobile */
    .grid--foods {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding: 12px 16px 96px; /* bottom room for cart pill */
    }
    /* Icon tile wrapper – no gray boxes, just clean tiles */
    .food-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
    .food-tile__btn {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(9,30,66,0.08);
      background: var(--surface, #ffffff);
      border: none;
      padding: 0;
    }
    .food-tile__btn img,
    .food-tile__btn svg {
      width: 74px; height: 74px;
      border-radius: 18px;          /* respects rounded-corner SVG artwork */
      display: block;
    }
    .food-tile__label {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.1;
      color: #142033;
    }
    .food-tile__price {
      font-size: 13px;
      color: #5b738d;
      margin-top: -2px;
    }

    /* Page header */
    .page {
      background: #eaf1f5; /* your soft blue */
      min-height: 100dvh;
    }
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px;
    }
    .header a { text-decoration: none; color: #203147; font-weight: 800; }
    .title {
      padding: 0 16px 8px;
      font-size: 32px; line-height: 1.05; font-weight: 900;
      color: #203147;
    }

    /* Floating cart pill (bottom-right) */
    .cart-pill {
      position: fixed;
      right: 16px; bottom: 20px;
      display: flex; align-items: center; gap: 12px;
      background: #0f1b2b;
      color: #fff;
      border-radius: 22px;
      padding: 12px 18px;
      box-shadow: 0 14px 28px rgba(14,27,45,0.35);
      z-index: 40;
    }
    .cart-pill__count {
      background: #e04c4c;
      min-width: 28px; height: 28px;
      border-radius: 999px;
      display: grid; place-items: center;
      font-weight: 800;
    }
    .cart-pill__total {
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    /* Modal sheet */
    .sheet {
      position: fixed; inset: 0; z-index: 50;
      display: none;
    }
    .sheet--open { display: block; }
    .sheet__scrim {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px);
    }
    .sheet__panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: #0f1b2b; color: white;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 20px;
    }
    .sheet__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sheet__title { font-size: 22px; font-weight: 900; }
    .sheet__price { font-size: 20px; font-weight: 800; }

    .qty {
      display: flex; align-items: center; gap: 12px;
      margin: 14px 0 8px;
    }
    .qty button {
      width: 56px; height: 56px; border-radius: 14px; border: none;
      background: #0b1523; color: white; font-size: 26px; font-weight: 900;
    }
    .qty__val {
      width: 74px; height: 56px; border-radius: 14px; border: none;
      display: grid; place-items: center; background: #142033; font-size: 20px; font-weight: 800;
    }

    .sheet__subtotal {
      color: #a7b8cc; font-size: 14px; margin: 8px 0 14px;
    }

    .sheet__actions {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;
    }
    .btn {
      height: 52px; border: none; border-radius: 14px; font-weight: 800; font-size: 16px;
    }
    .btn--ghost { background: #1a2940; color: #cfe0f2; }
    .btn--primary { background: #ff4343; color: white; }
  </style>
</head>
<body class="page">

  <!-- Header -->
  <div class="header">
    <a href="/pos/" aria-label="Back">←</a>
    <span style="font-weight:800;color:#5b738d;">POS</span>
  </div>
  <h1 class="title">FOOD &amp; BEVERAGES</h1>

  <!-- Grid -->
  <main id="grid" class="grid--foods" aria-live="polite"></main>

  <!-- Floating cart pill -->
  <button id="cartPill" class="cart-pill" type="button">
    <span class="cart-pill__count" id="cartCount">0</span>
    <span class="cart-pill__total" id="cartTotal">$0.00</span>
  </button>

  <!-- Quantity modal sheet -->
  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet__scrim" data-close-sheet></div>
    <div class="sheet__panel">
      <div class="sheet__row">
        <div class="sheet__title" id="sheetTitle">Item</div>
        <div class="sheet__price" id="sheetPrice">$0.00</div>
      </div>

      <div class="qty">
        <button id="btnMinus" aria-label="Decrease">−</button>
        <div class="qty__val" id="qtyVal">1</div>
        <button id="btnPlus" aria-label="Increase">+</button>
      </div>

      <div class="sheet__subtotal" id="sheetSubtotal">$0.00 subtotal</div>

      <div class="sheet__actions">
        <button class="btn btn--ghost" data-close-sheet>Cancel</button>
        <button id="btnAddToBill" class="btn btn--primary">Add to Bill</button>
      </div>
    </div>
  </div>

  <!-- Page logic (keeps your image pathing exactly as-is) -->
  <script src="/js/foodandbevs.js"></script>
</body>
</html>
