<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food & Beverages</title>
  <link rel="stylesheet" href="/css/ui.css" />
</head>
<body>
  <main class="inv-wrap">
    <header class="topbar">
      <a class="topbar-back" href="/pos/" aria-label="Back">←</a>
      <h1 class="topbar-title">Food & Beverages</h1>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <!-- PURE ICON GRID (4-up mobile) -->
    <section class="icon-grid" id="bevGrid">
      <!-- Example cells; your JS can render these dynamically -->
      <button class="icon-cell"><img src="/img/icons/foodandbevs/gatorade.svg" alt="Gatorade"></button>
      <button class="icon-cell"><img src="/img/icons/foodandbevs/7up.svg" alt="7 UP"></button>
      <button class="icon-cell"><img src="/img/icons/foodandbevs/pepsi.svg" alt="Pepsi"></button>
      <button class="icon-cell"><img src="/img/icons/foodandbevs/aw.svg" alt="A&W"></button>

      <!-- …render the rest exactly as uploaded; no wrappers needed -->
    </section>
  </main>

  <!-- FAB (bill) -->
  <button class="fab" id="fabBtn" aria-label="Open bill">
    <img src="/img/icons/pos.svg" alt="">
    <span class="fab-badge" id="fabQty">0</span>
    <span class="fab-sub" id="fabSub">$0.00</span>
  </button>

  <!-- Your existing JS that: opens qty modal on tap, adds to bill, updates FAB -->
  <script src="/foodandbevs/foodandbevs.js"></script>
</body>
</html>
