<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Food & Beverages</title>
  <link rel="preload" href="/css/system.css" as="style">
  <link rel="stylesheet" href="/css/system.css">
  <style>
    :root{
      --bg:#eaf2f6; --ink:#0f2433; --tile:#fff;
      --shadow:0 10px 24px rgba(15,36,51,.10);
      --radius:22px; --gap:18px;
    }
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    .wrap{max-width:980px;margin:0 auto;padding:20px 18px 120px}
    .back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);opacity:.7;font-weight:600}
    h1{font-size:32px;line-height:1.1;font-weight:800;margin:14px 0 22px;letter-spacing:.5px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
    @media (max-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media (max-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media (max-width:460px){.grid{grid-template-columns:repeat(3,1fr)}}

    .tile{
      background:var(--tile);border-radius:var(--radius);box-shadow:var(--shadow);
      padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink)
    }
    .icon{width:90px;height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
    .icon img{width:100%;height:100%;object-fit:contain;background:transparent;display:block}
    .name{font-weight:700;font-size:14px;text-align:center;line-height:1.2}
    .price{font-size:12px;opacity:.65;margin-top:2px}
    .fallback{width:90px;height:90px;border-radius:20px;border:2px dashed rgba(15,36,51,.25);display:flex;align-items:center;justify-content:center;font-weight:700;opacity:.55}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/pos/"><span aria-hidden="true">←</span> POS</a>
    <h1>FOOD &amp; BEVERAGES</h1>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    // Absolute, explicit filename mapping so icons never miss
    const ICON_BASE = "/img/icons/foodandbevs/";

    const ITEMS = [
      { name:"7 Up",                    price:1.50, icon:"7up.svg" },
      { name:"Cocacola",               price:1.50, icon:"cocacola.svg" },
      { name:"Coke Zero",              price:1.50, icon:"cokezero.svg" },
      { name:"Diet Coke",              price:1.50, icon:"dietcoke.svg" },
      { name:"Diet Dr. Pepper",        price:1.50, icon:"dietdrpepper.svg" },
      { name:"Dr. Pepper",             price:1.50, icon:"drpepper.svg" },
      { name:"Dunkin",                 price:3.50, icon:"dunkin.svg" },
      { name:"Gatorade",               price:3.50, icon:"gatorade.svg" },
      { name:"GP Sweet Tea",           price:1.50, icon:"gpsweettea.svg" },
      { name:"GP Unsweetened Tea",     price:1.50, icon:"gpunsweetened.svg" },
      { name:"GP Zero Sugar Sweet Tea",price:1.50, icon:"gpzerosugarsweettea.svg" }, // ← the missing one
      { name:"Monster Tea",            price:3.50, icon:"monstertea.svg" },
      { name:"Mountain Dew",           price:1.50, icon:"mountaindew.svg" },
      { name:"Pepsi",                  price:1.50, icon:"pepsi.svg" },
      { name:"Red Bull",               price:3.50, icon:"redbull.svg" },
      { name:"Root Beer",              price:1.50, icon:"rootbeer.svg" },
      { name:"Sprite",                 price:1.50, icon:"sprite.svg" },
      { name:"Starbucks",              price:3.50, icon:"starbucks.svg" },
      { name:"Water",                  price:1.50, icon:"water.svg" }
    ];

    const grid = document.getElementById('grid');

    ITEMS.forEach(item => {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = '#'; // keep your existing modal/cart wiring if needed

      const icon = document.createElement('div');
      icon.className = 'icon';

      const img = document.createElement('img');
      img.alt = item.name;
      img.loading = "lazy";
      img.decoding = "async";
      img.src = ICON_BASE + item.icon;
      img.onerror = () => { icon.innerHTML = '<div class="fallback">SVG</div>'; };

      icon.appendChild(img);

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;

      const price = document.createElement('div');
      price.className = 'price';
      price.textContent = `$${item.price.toFixed(2)}`;

      a.appendChild(icon);
      a.appendChild(name);
      a.appendChild(price);

      // If you have a global add-to-bill handler, expose data attributes:
      a.dataset.itemName  = item.name;
      a.dataset.itemPrice = item.price;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        // Hook back into your existing drawer/modal if present:
        const evt = new CustomEvent('pos:add', { detail: { name:item.name, price:item.price }});
        window.dispatchEvent(evt);
      });

      grid.appendChild(a);
    });
  </script>
</body>
</html>
