<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Food & Beverages · Smoke POS</title>

  <link rel="stylesheet" href="/style.css?v=12" />
  <link rel="stylesheet" href="/foodandbevs/food.css?v=12" />
  <link rel="icon" href="/img/icons/categories/foodandbevs.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#edf1f5" />
</head>
<body>
  <main class="page">
    <header class="pos-topbar">
      <a href="/pos/" class="pos-back" aria-label="Back">←</a>
      <h1 class="pos-title">Food &amp; Beverages</h1>
      <span class="pos-spacer"></span>
    </header>

    <section class="module-content module-split">
      <div class="bev-grid" id="bevGrid"></div>

      <aside class="cart">
        <div class="cart-header">
          <h2>Order</h2>
          <button id="clearCart" class="btn btn-light">Clear</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-totals">
          <div class="row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
          <div class="row"><span>Tax (7%)</span><strong id="tax">$0.00</strong></div>
          <div class="row total"><span>Total</span><strong id="total">$0.00</strong></div>
          <button id="checkout" class="btn btn-primary" disabled>Checkout</button>
        </div>
      </aside>
    </section>
  </main>

  <!-- Shared cart -->
  <script src="/js/cart.js?v=12"></script>
  <script src="/js/cart-ui.js?v=12"></script>
  <!-- Module logic -->
  <script src="/foodandbevs/food.js?v=12"></script>
</body>
</html>
