<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food & Beverages</title>
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/round-icons.css">
</head>
<body>
  <div class="page-container">
    <button class="back-button" onclick="history.back()">←</button>
    <h1 class="page-title">FOOD & BEVERAGES</h1>

    <div class="icon-grid">
      <img src="/img/icons/foodandbevs/7up.svg" alt="7 Up">
      <img src="/img/icons/foodandbevs/cocacola.svg" alt="Coca-Cola">
      <img src="/img/icons/foodandbevs/cokezero.svg" alt="Coke Zero">
      <img src="/img/icons/foodandbevs/dietcoke.svg" alt="Diet Coke">
      <img src="/img/icons/foodandbevs/drpepper.svg" alt="Dr Pepper">
      <img src="/img/icons/foodandbevs/gatorade.svg" alt="Gatorade">
      <img src="/img/icons/foodandbevs/goldpeaksweettea.svg" alt="Gold Peak Sweet Tea">
      <img src="/img/icons/foodandbevs/goldpeakunsweet.svg" alt="Gold Peak Unsweetened Tea">
      <img src="/img/icons/foodandbevs/goldpeakzerosugar.svg" alt="Gold Peak Zero Sugar Sweet Tea">
      <img src="/img/icons/foodandbevs/mountaindew.svg" alt="Mountain Dew">
      <img src="/img/icons/foodandbevs/redbull.svg" alt="Red Bull">
      <img src="/img/icons/foodandbevs/monster.svg" alt="Monster Energy">
      <img src="/img/icons/foodandbevs/canadadry.svg" alt="Canada Dry">
      <img src="/img/icons/foodandbevs/water.svg" alt="Water">
      <!-- Add other beverage icons as needed -->
    </div>

    <div class="cart-button">
      <img src="/img/icons/cart.svg" alt="Cart">
      <span class="cart-count">0</span>
      <span class="cart-total">$0.00</span>
    </div>
  </div>
</body>
</html>
