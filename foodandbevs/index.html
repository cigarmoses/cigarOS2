<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Food & Beverages</title>
  <link rel="stylesheet" href="/css/system.css" />
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, sans-serif;
      background: #eaf0f4;
      margin: 0;
      padding: 0;
    }
    .screen {
      padding: 18px 18px 96px;
    }
    a.back {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #1b2430;
      font-weight: 700;
    }
    h1 {
      margin: 12px 0 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 16px;
      justify-items: center;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 80px;
    }
    .tile img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
    }
    .label {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #1b2430;
      margin-top: 6px;
      line-height: 1.1;
    }
  </style>
</head>

<body>
  <div class="screen">
    <a class="back" href="/pos/"><span style="font-size:22px;">←</span>&nbsp;POS</a>
    <h1>FOOD &amp; BEVERAGES</h1>

    <div id="grid" class="grid" aria-live="polite"></div>
  </div>

  <script>
    // ----------------------------------------------------------------
    // 1) ICON RESOLVER — universal fix for all lowercase filenames
    // ----------------------------------------------------------------
    function iconSlug(label) {
      return String(label)
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/\+/g, 'plus')
        .replace(/\s+/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    function iconBaseFolder(section) {
      switch (section) {
        case 'pos':          return 'img/icons/categories';
        case 'foodandbevs':  return 'img/icons/foodandbevs';
        case 'cigars':       return 'img/icons/brands';
        default:             return 'img/icons/foodandbevs';
      }
    }

    const ICON_OVERRIDES = {}; // Optional manual overrides if needed later

    function iconPath(section, label) {
      const base = iconBaseFolder(section);
      const slug = iconSlug(label);
      const file = ICON_OVERRIDES[slug] || slug;
      return `${base}/${file}.svg`;
    }

    // ----------------------------------------------------------------
    // 2) ITEM DATA
    // ----------------------------------------------------------------
    const ITEMS = [
      { name: "7 Up", price: 1.50 },
      { name: "Cocacola", price: 1.50 },
      { name: "Coke Zero", price: 1.50 },
      { name: "Diet Coke", price: 1.50 },
      { name: "Diet Dr. Pepper", price: 1.50 },
      { name: "Dr. Pepper", price: 1.50 },
      { name: "Dunkin", price: 3.50 },
      { name: "Gatorade", price: 3.50 },
      { name: "Ginger Ale", price: 1.50 },
      { name: "GP Sweet Tea", price: 1.50 },
      { name: "GP Unsweetened Tea", price: 1.50 },
      { name: "Monster Tea", price: 3.50 },
      { name: "Canada Dry", price: 1.50 },
      { name: "Mountain Dew", price: 1.50 },
      { name: "Pepsi", price: 1.50 },
      { name: "Red Bull", price: 3.50 },
      { name: "Root Beer", price: 1.50 },
      { name: "Sprite", price: 1.50 },
      { name: "Starbucks", price: 3.50 },
      { name: "Water", price: 1.50 },
    ];

    // ----------------------------------------------------------------
    // 3) RENDER GRID
    // ----------------------------------------------------------------
    const grid = document.getElementById("grid");

    ITEMS.forEach(item => {
      const cell = document.createElement("div");
      cell.className = "tile";
      cell.innerHTML = `
        <img loading="lazy" alt="${item.name}" 
          src="${iconPath('foodandbevs', item.name)}" 
          onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 80 80&quot;><rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#e9eef3&quot;/><text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Helvetica Neue, Arial&quot; font-size=&quot;10&quot; fill=&quot;#94a3b8&quot;>icon</text></svg>')}'" />
        <div class="label">${item.name}</div>
      `;
      grid.appendChild(cell);
    });
  </script>
</body>
</html>
