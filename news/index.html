<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>News • CigarOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Main POS styles -->
  <link rel="stylesheet" href="/pos/pos.css" />
  <!-- Global SF Pro type system -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
      --pill: #f3f7fb;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text); /* SF Pro Text via type.css */
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 80px;
    }

    /* Topbar */
    .pos-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 4px;
    }

    .pos-back {
      border: none;
      background: transparent;
      padding: 0;
      font-size: 16px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .pos-back span.icon {
      font-size: 18px;
      line-height: 1;
    }

    .pos-topbar-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    header.news-header {
      padding-top: 4px;
      padding-bottom: 12px;
    }

    header.news-header h1.page-title {
      margin: 4px 0 0;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: var(--font-display); /* SF Pro Display */
    }

    .news-section-label {
      margin: 10px 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 12px 12px 10px;
      display: flex;
      gap: 12px;
      box-shadow:
        0 14px 30px rgba(11, 27, 53, 0.08),
        0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .news-logo-wrap {
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .news-logo {
      width: 52px;
      height: 52px;
      /* no background, svg as-is */
      background: transparent;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .news-logo img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .news-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .news-card-top {
      display: flex;
      align-items: center;
      justify-content: flex-start; /* name + X icon inline */
      gap: 8px;
    }

    .news-source-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-family: var(--font-display); /* Display for source labels */
    }

    .news-x-link {
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: var(--muted);
      text-decoration: none;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .news-x-link span.icon {
      font-size: 14px;
      transform: translateY(-0.5px);
    }

    .news-links {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .news-links li {
      font-size: 13px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .news-links a {
      color: var(--ink);
      text-decoration: none;
    }

    .news-links a:hover,
    .news-links a:active {
      text-decoration: underline;
    }

    /* Tony floating icon bottom-left (global pattern) */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 40;
    }
    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: inherit;
    }

    @media (min-width: 520px) {
      .wrap {
        padding-top: 18px;
      }
      header.news-header h1.page-title {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="pos-topbar">
      <button class="pos-back" type="button" onclick="history.back()">
        <span class="icon">←</span>
        <span>Back</span>
      </button>
      <div class="pos-topbar-title">Home • News</div>
    </div>

    <header class="news-header">
      <h1 class="page-title">News</h1>
      <div class="news-section-label">Sources</div>
    </header>

    <!-- JS will populate this -->
    <section class="news-list" id="news-list"></section>

  </div>

  <!-- Tony floating icon (bottom-left, same across app) -->
  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script>
    const NEWS_JSON_URL = "/pos/pos-news.json";

    // Fallback data (keeps working even if JSON fetch fails)
    const staticNewsSources = [
      {
        id: "halfwheel",
        name: "Halfwheel",
        icon: "/img/icons/halfwheel.svg",
        xHandle: "@halfwheel",
        xUrl: "https://x.com/halfwheel",
        stories: [
          {
            title: "S.T. Dupont Introduces $70,000 Jackpot Lighter",
            url: "https://halfwheel.com/s-t-dupont-introduces-70000-jackpot-lighter/457611/"
          },
          {
            title: "The Cigar Accessories I Use: Brooks Whittington",
            url: "https://halfwheel.com/the-cigar-accessories-i-use-brooks-whittington/456951/"
          },
          {
            title: "The Cigar Accessories I Use: Patrick Lagreid",
            url: "https://halfwheel.com/the-cigar-accessories-i-use-patrick-lagreid/457119/"
          }
        ]
      },
      {
        id: "cigaraficionado",
        name: "Cigar Aficionado",
        icon: "/img/icons/cigaraficionado.svg",
        xHandle: "@CigarAficMag",
        xUrl: "https://x.com/CigarAficMag",
        stories: [
          {
            title: "A Dozen Delightful Cigars You Need To Try Right Now",
            url: "https://www.cigaraficionado.com/article/a-dozen-delightful-cigars-you-need-to-try-right-now"
          },
          {
            title: "Rocky Patel Thirtieth Anniversary Heading To Shops",
            url: "https://www.cigaraficionado.com/article/rocky-patel-thirtieth-anniversary-heading-to-shops"
          },
          {
            title: "New Cuban Hoyo Debuts In Germany",
            url: "https://www.cigaraficionado.com/article/new-cuban-hoyo-debuts-in-germany"
          }
        ]
      },
      {
        id: "cigarjournal",
        name: "Cigar Journal",
        icon: "/img/icons/cigarjournal.svg",
        xHandle: "@CigarJournalMag",
        xUrl: "https://x.com/CigarJournalMag",
        stories: [
          {
            title: "Tatuaje Releases “Sextooth”",
            url: "https://www.cigarjournal.com/tatuaje-releases-sextooth/"
          },
          {
            title: "10% Off Procigar Festival 2026 Registration – Black Friday Deal",
            url: "https://www.cigarjournal.com/10-off-procigar-festival-2026-registration-black-friday-deal/"
          },
          {
            title: "PCA × FIU Luxury Marketing & Experiences Masterclass",
            url: "https://www.cigarjournal.com/pca-x-fiu-luxury-marketing-experiences-masterclass/"
          }
        ]
      },
      {
        id: "pca",
        name: "Premium Cigar Association",
        icon: "/img/icons/pca.svg",
        xHandle: "@PCA1933",
        xUrl: "https://x.com/PCA1933",
        stories: [
          {
            title: "J.C. Newman Releases Limited-Edition “The Brick House is on Fire” for TAA Retailers",
            url: "https://premiumcigars.org/j-c-newman-releases-limited-edition-the-brick-house-is-on-fire-for-taa-retailers/"
          },
          {
            title: "Duran Cigars Debuts Roberto Duran Reserva",
            url: "https://premiumcigars.org/duran-cigars-debuts-roberto-duran-reserva/"
          },
          {
            title: "Powstanie Cigars Unleashes the 2025 War Bear “War Bear of Mass Destruction”",
            url: "https://premiumcigars.org/powstanie-cigars-unleashes-the-2025-war-bear-war-bear-of-mass-destruction/"
          }
        ]
      }
    ];

    function createNewsCard(source) {
      const article = document.createElement("article");
      article.className = "news-card";

      const logoWrap = document.createElement("div");
      logoWrap.className = "news-logo-wrap";

      const logo = document.createElement("div");
      logo.className = "news-logo";

      const img = document.createElement("img");
      img.src = source.icon;
      img.alt = source.name + " logo";
      logo.appendChild(img);
      logoWrap.appendChild(logo);

      const content = document.createElement("div");
      content.className = "news-content";

      const top = document.createElement("div");
      top.className = "news-card-top";

      const nameEl = document.createElement("div");
      nameEl.className = "news-source-name";
      nameEl.textContent = source.name;

      const xLink = document.createElement("a");
      xLink.className = "news-x-link";
      xLink.href = source.xUrl;
      xLink.target = "_blank";
      xLink.rel = "noopener noreferrer";
      xLink.setAttribute("aria-label", (source.xHandle || source.name) + " on X");

      const xIcon = document.createElement("span");
      xIcon.className = "icon";
      xIcon.textContent = "𝕏";

      xLink.appendChild(xIcon);

      top.appendChild(nameEl);
      top.appendChild(xLink);

      const ul = document.createElement("ul");
      ul.className = "news-links";

      (source.stories || []).forEach(story => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = story.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = story.title;
        li.appendChild(a);
        ul.appendChild(li);
      });

      content.appendChild(top);
      content.appendChild(ul);

      article.appendChild(logoWrap);
      article.appendChild(content);

      return article;
    }

    async function loadNews() {
      const container = document.getElementById("news-list");
      container.innerHTML = "";

      let sources = staticNewsSources;

      try {
        const res = await fetch(NEWS_JSON_URL, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.sources) && data.sources.length) {
            sources = data.sources;
          }
        }
      } catch (err) {
        console.warn("Using static fallback news data:", err);
      }

      sources.forEach(src => {
        container.appendChild(createNewsCard(src));
      });
    }

    document.addEventListener("DOMContentLoaded", loadNews);
  </script>

  <!-- Tony behavior -->
  <script src="/js/tony.js" defer></script>
</body>
</html>
