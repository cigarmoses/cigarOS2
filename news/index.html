<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>News • CigarOS2</title>

  <!-- correct path from /news/index.html -->
  <link rel="stylesheet" href="../css/type.css" />

  <style>
    /* ===== HARD TYPO OVERRIDE (fixes the serif/Times issue) ===== */
    :root{
      --sf-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      --sf-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;

      --max: 980px;
      --pad: 18px;

      --radius-xl: 28px;
      --radius-lg: 22px;

      /* Light */
      --bg: #f2f2f7;
      --surface2: #ffffff;
      --ink: #0b1220;
      --muted: rgba(11,18,32,0.62);
      --hair: rgba(11,18,32,0.10);

      --shadow: 0 10px 28px rgba(0,0,0,0.10);
      --shadow2: 0 6px 16px rgba(0,0,0,0.08);

      --chip: rgba(11,18,32,0.06);
      --chipInk: rgba(11,18,32,0.82);

      --accent: #ff2d55;

      --glass: rgba(255,255,255,0.64);
      --glassStroke: rgba(255,255,255,0.50);

      /* if any svg disappears in dark, set invert(1) */
      --logo-filter-dark: none;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b0b0f;
        --surface2: rgba(24,24,32,0.92);
        --ink: #f5f7ff;
        --muted: rgba(245,247,255,0.64);
        --hair: rgba(245,247,255,0.10);

        --shadow: 0 16px 40px rgba(0,0,0,0.55);
        --shadow2: 0 10px 26px rgba(0,0,0,0.50);

        --chip: rgba(245,247,255,0.10);
        --chipInk: rgba(245,247,255,0.86);

        --glass: rgba(24,24,32,0.62);
        --glassStroke: rgba(245,247,255,0.14);
      }
    }

    *{ box-sizing:border-box; }

    /* Scope everything to this page so global CSS can’t override it */
    body.news-page{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sf-text) !important;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.news-page,
    body.news-page button,
    body.news-page input,
    body.news-page select,
    body.news-page textarea{
      font-family: var(--sf-text) !important;
    }

    /* Kill any global serif/heading rules */
    body.news-page h1,
    body.news-page h2,
    body.news-page h3,
    body.news-page h4,
    body.news-page h5,
    body.news-page h6{
      font-family: var(--sf-display) !important;
      font-style: normal !important;
      text-transform: none !important;
      letter-spacing: normal;
    }

    body.news-page p,
    body.news-page span,
    body.news-page a,
    body.news-page div{
      font-family: inherit;
    }

    /* ===== Layout ===== */
    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(28px + env(safe-area-inset-bottom));
    }

    /* Header: icon-only back + your existing News header */
    .news-header{
      display:flex;
      align-items:flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .back-btn{
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background: var(--chip);
      color: var(--chipInk);
      text-decoration:none;
      flex: 0 0 auto;
      margin-top: 2px;
    }
    .back-btn svg{ width: 20px; height: 20px; }
    .back-btn:active{ transform: scale(0.96); }

    /* This is your “perfect” News title */
    h1.page-title{
      margin: 0;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.02;
      font-family: var(--sf-display) !important;
    }

    .subhead{
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      font-family: var(--sf-display) !important;
    }

    /* Chips */
    .chips{
      display:flex;
      gap: 10px;
      overflow:auto;
      padding: 10px 0 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar{ display:none; }
    .chip{
      flex: 0 0 auto;
      display:inline-flex;
      align-items:center;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--chipInk);
      font-weight: 800;
      letter-spacing: -0.01em;
      font-family: var(--sf-display) !important;
      font-size: 16px;
      line-height: 1;
    }

    /* Featured (this is what was “red” in your screenshot — now locked down) */
    .featured{
      border-radius: var(--radius-xl);
      overflow:hidden;
      box-shadow: var(--shadow);
      background: #000;
      position: relative;
      margin: 0 0 18px;
      text-decoration:none;
      color: inherit;
    }
    .featured .img{
      height: 260px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.0)),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=70")
        center/cover no-repeat;
      filter: saturate(1.05);
    }
    .featured .fade{
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.0) 22%, rgba(0,0,0,0.62) 64%, rgba(0,0,0,0.88) 100%);
      pointer-events:none;
    }
    .featured .meta{
      position:absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .sourceBadge{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-weight: 900;
      letter-spacing: -0.01em;
      font-family: var(--sf-display) !important;
      font-size: 14px;
      line-height: 1;
    }
    .sourceBadge img{
      width: 22px;
      height: 22px;
      border-radius: 6px;
      padding: 3px;
      object-fit: contain;
      background: rgba(255,255,255,0.10);
    }
    .featured h2{
      margin:0;
      color:#fff;
      font-family: var(--sf-display) !important;
      font-weight: 900;
      letter-spacing: -0.02em;
      font-size: 26px;
      line-height: 1.12;
      max-width: 24ch;
    }
    .featured p{
      margin:0;
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      line-height: 1.35;
      max-width: 58ch;
      font-family: var(--sf-text) !important;
      font-weight: 500;
    }

    /* Sources panel */
    .sourcesPanel{
      border-radius: var(--radius-xl);
      background: var(--glass);
      border: 1px solid var(--glassStroke);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px;
      margin-bottom: 18px;
    }
    .sourcesRow{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 2px;
    }
    .sourcePill{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--ink);
      font-weight: 900;
      letter-spacing: -0.01em;
      text-decoration:none;
      font-family: var(--sf-display) !important;
      font-size: 16px;
    }
    .sourcePill img{
      width: 22px;
      height: 22px;
      border-radius: 6px;
      padding: 3px;
      object-fit: contain;
      background: rgba(255,255,255,0.08);
    }
    @media (prefers-color-scheme: dark){
      .sourcePill img{ filter: var(--logo-filter-dark); }
    }

    /* Streams */
    .section{ margin: 18px 0 22px; }
    .sectionHead{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
      margin: 0 4px 10px;
    }
    .sectionTitle{
      display:flex;
      align-items:center;
      gap: 10px;
      font-family: var(--sf-display) !important;
      font-weight: 900;
      letter-spacing: -0.02em;
      font-size: 22px;
      line-height: 1.1;
    }
    .logo{
      width: 26px;
      height: 26px;
      border-radius: 7px;
      padding: 4px;
      object-fit: contain;
      background: rgba(255,255,255,0.08);
    }
    .seeAll{
      font-weight: 900;
      color: var(--accent);
      text-decoration:none;
      letter-spacing: -0.01em;
      padding: 8px 10px;
      border-radius: 999px;
      font-family: var(--sf-display) !important;
      font-size: 16px;
    }

    .stream{ display:flex; flex-direction:column; gap: 10px; }

    .story{
      display:grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-lg);
      background: var(--surface2);
      box-shadow: var(--shadow2);
      text-decoration:none;
      color: inherit;
    }
    .thumb{
      width: 92px;
      height: 68px;
      border-radius: 14px;
      overflow:hidden;
      background: linear-gradient(135deg, rgba(0,0,0,0.10), rgba(0,0,0,0.0));
    }
    .thumb img{ width:100%; height:100%; object-fit: cover; display:block; }

    .story h3{
      margin:0 0 6px;
      font-size: 17px;
      line-height: 1.18;
      letter-spacing: -0.01em;
      font-weight: 900;
      font-family: var(--sf-display) !important;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .story .sub{
      display:flex;
      align-items:center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      font-family: var(--sf-text) !important;
    }
    .dot{ width:4px; height:4px; border-radius:50%; background: var(--hair); display:inline-block; }

    @media (max-width: 420px){
      h1.page-title{ font-size: 52px; }
      .featured .img{ height: 240px; }
      .featured h2{ font-size: 24px; }
      .story{ grid-template-columns: 86px 1fr; }
      .thumb{ width: 86px; height: 64px; }
    }
  </style>
</head>

<body class="news-page">
  <div class="wrap">

    <div class="news-header">
      <!-- icon-only iOS back -->
      <a class="back-btn" href="../index.html" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <div style="flex:1 1 auto;">
        <h1 class="page-title">News</h1>
      </div>
    </div>

    <div class="chips" aria-label="News filters">
      <div class="chip">All</div>
      <div class="chip">Releases</div>
      <div class="chip">Industry</div>
      <div class="chip">Events</div>
      <div class="chip">Reviews</div>
    </div>

    <a class="featured" href="#" 
      <div class="img"></div>
      <div class="fade"></div>
      <div class="meta">
        <div class="sourceBadge">
          <img src="../img/icons/halfwheel.svg" alt="Halfwheel" />
          Halfwheel
        </div>
    </a>

    <div class="sourcesPanel">
      <div class="sourcesRow">
        <a class="sourcePill" href="#halfwheel"><img src="../img/icons/halfwheel.svg" alt="Halfwheel">Halfwheel</a>
        <a class="sourcePill" href="#cigaraficionado"><img src="../img/icons/cigaraficionado.svg" alt="Cigar Aficionado">Cigar Aficionado</a>
        <a class="sourcePill" href="#cigarjournal"><img src="../img/icons/cigarjournal.svg" alt="Cigar Journal">Cigar Journal</a>
        <a class="sourcePill" href="#pca"><img src="../img/icons/pca.svg" alt="PCA">PCA</a>
      </div>
    </div>

    <section class="section" id="halfwheel">
      <div class="sectionHead">
        <div class="sectionTitle">
          <img class="logo" src="../img/icons/halfwheel.svg" alt="" />
          Halfwheel
        </div>
        <a class="seeAll" href="#">See all →</a>
      </div>

      <div class="stream">
        <a class="story" href="#">
          <div class="thumb"><img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=800&q=70" alt=""></div>
          <div>
            <h3>S.T. Dupont Introduces $70,000 Jackpot Lighter</h3>
            <div class="sub">Today <span class="dot"></span> 6 min read</div>
          </div>
        </a>
      </div>
    </section>

  </div>
</body>
</html>
