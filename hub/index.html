<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hub • CigarOS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <!-- Main POS / global styles -->
  <link rel="stylesheet" href="/pos/pos.css" />
  <!-- Global SF Pro type system -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #f5f6fa;
      --tile: #ffffff;
      --radius: 20px;
      --sh: 0 4px 10px rgba(0,0,0,0.08);
      --sh2: 0 6px 16px rgba(0,0,0,0.10);
      --ink: #111111;
      --muted: #6a7586;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text); /* SF Pro Text */
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .pos-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 4px;
    }

    .pos-back {
      border: none;
      background: transparent;
      padding: 0;
      font-size: 16px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .pos-back span.icon {
      font-size: 18px;
      line-height: 1;
    }

    .pos-topbar-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    header.hub-header {
      padding-top: 4px;
      padding-bottom: 14px;
    }

    header.hub-header h1.page-title {
      margin: 4px 0 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-family: var(--font-display); /* SF Pro Display */
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Grid of tiles */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 130px);
      gap: 28px;
      justify-content: center;
      margin-top: 8px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 130px;
      height: 130px;
      background: var(--tile);
      border-radius: var(--radius);
      box-shadow: var(--sh);
      text-decoration: none;
      color: #111;
      transition: 0.15s transform, 0.2s box-shadow;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: var(--sh2);
    }

    .tile svg {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: 800;
      font-size: 14px;
      font-family: var(--font-display); /* Display for tile labels */
    }

    /* Tony floating icon bottom-left */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 40;
    }
    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: inherit;
    }

    @media (min-width: 520px) {
      .wrap {
        padding-top: 18px;
      }
      header.hub-header h1.page-title {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="pos-topbar">
      <button class="pos-back" type="button" onclick="history.back()">
        <span class="icon">←</span>
        <span>Back</span>
      </button>
      <div class="pos-topbar-title">Home • Hub</div>
    </div>

    <header class="hub-header">
      <h1 class="page-title">Hub</h1>
      <div class="subtitle">Staff, links, and tools</div>
    </header>

    <main class="grid">
      <a href="#" class="tile">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="8" cy="9" r="3" stroke="#2f8cff" stroke-width="1.5"/>
          <path d="M3 20c1.5-3 4-4.5 6-4.5s4.5 1.5 6 4.5" stroke="#2f8cff" stroke-width="1.5"/>
        </svg>
        <div class="label">Staff</div>
      </a>

      <a href="#" class="tile">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="#2f8cff" stroke-width="1.5"/>
          <path d="M8 8h8M8 12h6M8 16h5" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="label">Files</div>
      </a>

      <a href="#" class="tile">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="6" cy="12" r="2.5" fill="#2f8cff"/>
          <circle cx="18" cy="7" r="2.5" fill="#2f8cff"/>
          <path d="M8.2 11.2l7-3.8M8.2 12.8L17 17" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="label">Links</div>
      </a>

      <a href="#" class="tile">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3v18M3 12h18" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="label">Settings</div>
      </a>
    </main>
  </div>

  <!-- Tony floating icon (bottom-left, same across app) -->
  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <!-- Tony behavior -->
  <script src="/js/tony.js" defer></script>
</body>
</html>
