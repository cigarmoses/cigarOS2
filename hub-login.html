<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hub Sign In • cigarOS2</title>
<style>
  :root{ --bg:#f2f2f2; --card:#fff; --ink:#0e2b2f; --muted:#6b7680; --blue:#1DA1F2; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font:16px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
  .wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
  .card{background:var(--card);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.12);padding:22px; width:min(420px, 92vw)}
  h1{margin:0 0 12px;font-size:20px}
  .logo{display:block;margin:8px auto 18px;height:56px}
  label{display:block;margin:12px 0 6px;color:var(--muted);font-weight:700}
  input{width:100%;padding:12px 14px;border:1px solid #e7ecf0;border-radius:12px;font-size:16px}
  button{margin-top:14px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
  .err{margin-top:10px;color:#b3261e}
</style>
<div class="wrap">
  <form class="card" id="f">
    <img class="logo" src="img/logo.svg" alt="Smoke">
    <h1>Hub Sign In</h1>
    <label>Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Enter password" required />
    <button>Sign In</button>
    <div id="msg" class="err"></div>
  </form>
</div>
<script>
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    const r = await fetch('/.netlify/functions/auth-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw.value })
    });
    if (r.ok) {
      location.href = 'hub.html';
    } else {
      const j = await r.json().catch(()=>({}));
      msg.textContent = j.error || 'Sign in failed';
    }
  });
</script>
