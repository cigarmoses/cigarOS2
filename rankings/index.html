<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><title>Media Rankings • CigarOS</title><link rel="stylesheet" href="/css/type.css"><link rel="stylesheet" href="/rankings/rankings.css"><script src="/rankings/publication-lists.js" defer></script><script src="/rankings/publication-search.js" defer></script><script src="/rankings/logos.js" defer></script><script src="/rankings/rankings.js" defer></script></head>
<body><main>
<section id="login" hidden><h1>Media Rankings</h1><p>Enter the shared password to explore the Top 25 lists.</p><form id="loginForm"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button type="submit">View rankings</button><p id="loginError" role="alert"></p></form></section>
<section id="viewer" hidden><header><button id="back" aria-label="Back to publications" hidden>‹</button><h1>Media Rankings</h1><button id="logout" class="quiet">Sign out</button></header><nav id="publications" aria-label="Publications"></nav>
<section id="browse" hidden><h2 id="publicationName"></h2><div class="controls"><label>Year<select id="year"></select></label><label class="search">Search rankings<input id="search" type="search" placeholder="Brand, wrapper, size, year…" autocomplete="off"></label></div><label class="toggle"><input id="cubans" type="checkbox" checked> Include Cubans 🇨🇺</label><p id="summary" role="status"></p><div id="results"></div><button id="more" hidden>Show more</button></section></section>
<p id="status" role="status">Loading rankings…</p><button id="retry" hidden>Try again</button>
</main></body></html>
