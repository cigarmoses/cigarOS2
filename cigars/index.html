<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cigars</title>
<link rel="stylesheet" href="../css/system.css" />
<style>
  body { font-family:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,sans-serif; }
  .page { padding:18px 16px 40px; background:#eaf1f5; min-height:100vh; }
  .toprow { display:flex; align-items:center; gap:16px; margin-bottom:10px; }
  .back-link { text-decoration:none; color:inherit; font-size:22px; }
  .page-title { font-weight:800; font-size:28px; letter-spacing:.5px; color:#1a2733; margin:0 0 12px; }
  .search { height:44px; border-radius:22px; border:none; padding:0 16px; width:100%; background:#fff; box-shadow:0 8px 26px rgba(10,25,41,.06); margin-bottom:16px; font-size:16px; }
  .brand-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .brand-card { display:flex; flex-direction:column; align-items:center; text-decoration:none; }
  .brand-icon { width:72px; height:72px; border-radius:18px; background:none!important; box-shadow:none!important; }
  .brand-name { margin-top:6px; font-size:12px; font-weight:700; color:#1a2733; text-align:center; }
</style>
</head>
<body>
  <main class="page">
    <div class="toprow">
      <a class="back-link" href="../pos/index.html">←</a>
      <h1 class="page-title">CIGARS</h1>
    </div>

    <input id="search" class="search" type="search" placeholder="Search brands..." />

    <section id="brands" class="brand-grid" aria-live="polite"></section>
  </main>

<script>
  const BRANDS = [
    { n:'Arturo Fuente', f:'arturofuente.svg', href:'./brand.html?b=arturo-fuente' },
    { n:'Padron', f:'padron.svg', href:'./brand.html?b=padron' },
    { n:'My Father', f:'myfather.svg', href:'./brand.html?b=my-father' },
    { n:'Oliva', f:'oliva.svg', href:'./brand.html?b=oliva' }
  ];
  const ICON_BASE = '../img/icons/brands/';

  const brandsEl=document.getElementById('brands');
  const searchEl=document.getElementById('search');

  function render(list){
    brandsEl.innerHTML=list.map(b=>`
      <a class="brand-card" href="${b.href}">
        <img class="brand-icon" src="${ICON_BASE + b.f}" alt="${b.n}">
        <div class="brand-name">${b.n}</div>
      </a>`).join('');
  }
  render(BRANDS);

  searchEl.addEventListener('input',()=>{
    const q=searchEl.value.trim().toLowerCase();
    render(!q?BRANDS:BRANDS.filter(b=>b.n.toLowerCase().includes(q)));
  });
</script>
</body>
</html>
