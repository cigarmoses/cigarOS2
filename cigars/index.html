<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cigars</title>
<link rel="stylesheet" href="/css/system.css" />
<style>
  :root{ --bg:#ECF3F7; --shadow:0 16px 36px rgba(8,15,30,.10); }
  body{ margin:0; background:var(--bg); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  .wrap{ max-width:520px; margin:0 auto; padding:18px 18px 120px; }
  .topbar{ display:flex; align-items:center; gap:10px; }
  .back{ text-decoration:none; color:#111; font-size:28px; line-height:1; }
  h1{ margin:6px 0 14px; text-align:center; font-size:22px; letter-spacing:.06em; }
  .search{ background:#fff; border-radius:24px; box-shadow:var(--shadow);
           padding:12px 16px; margin:8px 0 18px; display:flex; align-items:center; gap:10px; }
  .search input{ border:0; outline:0; font-size:16px; width:100%; background:transparent; }

  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px 14px; }
  .brand{ text-align:center; background:transparent; border:0; padding:0; }
  .brand .ico{ width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  .brand .ico img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand .lbl{ font-size:11px; margin-top:6px; line-height:1.15; }

  .pad-bill{ height:110px; }
  .bill-dock{ position:fixed; right:18px; bottom:18px; background:#0b1423; color:#fff;
              border-radius:22px; padding:10px 16px; display:flex; gap:10px; align-items:center;
              box-shadow:0 18px 46px rgba(8,15,30,.22); }
  .pill{ background:#E35151; color:#fff; border-radius:999px; padding:2px 10px; font-weight:700; }
</style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <a class="back" href="/pos/">‹</a><div style="flex:1"></div>
    </header>
    <h1>CIGARS</h1>

    <!-- Master search -->
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.2-4.2M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4z" stroke="#333" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search brands…" autocomplete="off" />
    </div>

    <!-- 4-up brands (icon + name) -->
    <section id="brandGrid" class="grid" aria-label="Brands"></section>

    <div class="pad-bill"></div>
  </main>

  <button class="bill-dock" onclick="location.href='/pos/checkout/'" aria-label="Open Bill">
    <img src="/img/icons/pos.svg" alt="" style="width:22px;height:22px" />
    <span class="pill" id="billCount">0</span>
    <span id="billTotal">$0.00</span>
  </button>

  <script>
    // Brand icons live at /img/icons/brands/<slug>.svg
    // Add as many as you want here; the slug must match the SVG filename.
    const brands = [
      { name:'Arturo Fuente', slug:'arturofuente' },
      { name:'Padron', slug:'padron' },
      { name:'Oliva', slug:'oliva' },
      { name:'My Father', slug:'myfather' },
      { name:'Ashton', slug:'ashton' },
      { name:'LFD', slug:'lfd' },
      { name:'Perdomo', slug:'perdomo' },
      { name:'Aganorsa Leaf', slug:'aganorsa' },
      { name:'Crowned Heads', slug:'crownedheads' },
      { name:'Alec Bradley', slug:'alecbradley' },
      { name:'Tatuaje', slug:'tatuaje' },
      { name:'Rocky Patel', slug:'rockypatel' },
    ];

    const grid = document.getElementById('brandGrid');
    const q = document.getElementById('q');

    function draw(list){
      grid.innerHTML = '';
      list.forEach(b=>{
        const btn = document.createElement('button');
        btn.className = 'brand';
        btn.onclick = () => location.href = `/cigars/brand/?b=${encodeURIComponent(b.slug)}`;
        btn.innerHTML = `
          <div class="ico"><img src="/img/icons/brands/${b.slug}.svg" alt="${b.name}"></div>
          <div class="lbl">${b.name}</div>
        `;
        grid.appendChild(btn);
      });
    }
    draw(brands);

    q.addEventListener('input',()=>{
      const v = q.value.trim().toLowerCase();
      draw(brands.filter(b=> b.name.toLowerCase().includes(v)));
    });
  </script>
</body>
</html>
