<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cigars</title>
  <link rel="stylesheet" href="/css/system.css">
  <link rel="stylesheet" href="/css/round-icons.css">
</head>
<body>
  <div class="page-container">
    <button class="back-button" onclick="history.back()">←</button>
    <h1 class="page-title">CIGARS</h1>

    <div class="search-bar">
      <input type="text" id="cigarSearch" placeholder="Search cigars..." onkeyup="filterCigars()">
    </div>

    <div class="icon-grid" id="cigarGrid">
      <img src="/img/icons/brands/arturofuente.svg" alt="Arturo Fuente">
      <img src="/img/icons/brands/padron.svg" alt="Padron">
      <img src="/img/icons/brands/myfather.svg" alt="My Father">
      <img src="/img/icons/brands/perdomo.svg" alt="Perdomo">
      <img src="/img/icons/brands/lfd.svg" alt="La Flor Dominicana">
      <img src="/img/icons/brands/oliva.svg" alt="Oliva">
      <!-- Add additional cigar brands here -->
    </div>

    <div class="cart-button">
      <img src="/img/icons/cart.svg" alt="Cart">
      <span class="cart-count">0</span>
      <span class="cart-total">$0.00</span>
    </div>
  </div>

  <script>
    function filterCigars() {
      const input = document.getElementById('cigarSearch').value.toLowerCase();
      const icons = document.querySelectorAll('#cigarGrid img');
      icons.forEach(icon => {
        const match = icon.alt.toLowerCase().includes(input);
        icon.style.display = match ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
