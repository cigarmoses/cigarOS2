<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PIPES • POS</title>
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 12px 110px;
    }

    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      font-size: 18px;
    }

    .pos-star {
      font-size: 26px;
      color: #ffcc00;
    }

    h1.pos-title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    /* Search bar */
    .pos-search {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 999px;
      padding: 12px 16px;
      border: none;
      margin-bottom: 18px;
    }
    .pos-search input {
      border: 0;
      outline: 0;
      width: 100%;
      background: transparent;
      font-size: 16px;
    }

    /* Items Grid */
    .pipe-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
      margin-top: 10px;
    }

    .pipe-tile {
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      color: #0f1a2c;
    }

    .pipe-icon {
      width: 120px;
      height: 120px;
      border-radius: 22px;
      overflow: hidden;
      background: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .pipe-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pipe-label {
      font-size: 14px;
      font-weight: 600;
    }

    .pipe-price {
      font-size: 14px;
      margin-top: -3px;
    }
  </style>
</head>

<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a href="/pos/" class="pos-back">← POS</a>
      <div class="pos-star">★</div>
    </div>

    <h1 class="pos-title">PIPES</h1>

    <div class="pos-search">
      <input id="pipeSearch" placeholder="Search" />
    </div>

    <div id="pipeGrid" class="pipe-grid"></div>
  </div>

  <script>
    const PIPES = [
      { name: "Pipe Tobacco", file: "pipetobacco.jpg", price: 4.99 },
      { name: "Mr. Consul Pipe", file: "mrconsulpipe.svg", price: 59.99 }
    ];

    const grid = document.getElementById("pipeGrid");
    const search = document.getElementById("pipeSearch");

    function renderPipes(filter = "") {
      grid.innerHTML = "";

      PIPES
        .filter(item => item.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(item => {
          const div = document.createElement("a");
          div.className = "pipe-tile";
          div.innerHTML = `
            <div class="pipe-icon">
              <img src="/img/pipes/${item.file}" alt="${item.name}">
            </div>
            <div class="pipe-label">${item.name}</div>
            <div class="pipe-price">$${item.price.toFixed(2)}</div>
          `;
          grid.appendChild(div);
        });
    }

    renderPipes();

    search.addEventListener("input", (e) => {
      renderPipes(e.target.value);
    });
  </script>

  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt">
  </div>

  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>
      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row"><span>Subtotal</span><span id="invoice-subtotal">$0.00</span></div>
        <div class="total-row"><span>Tax</span><span id="invoice-tax">$0.00</span></div>
        <div class="total-row total-bold"><span>TOTAL</span><span id="invoice-total">$0.00</span></div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
