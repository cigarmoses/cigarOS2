<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pipes • POS</title>
  <style>
    :root{--bg:#eaf2f6;--ink:#0f1a2c;--muted:#6d7b8e;--tile-gap:20px;--tile-size:84px;--radius:18px;--sheet:#0c1322;--sheet-ink:#eaf2f6;--accent:#ff3b30;--shadow:0 8px 30px rgba(20,30,50,.18)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji"}
    header{position:sticky;top:0;z-index:5;background:linear-gradient(#eaf2f6,#eaf2f6cc 70%,#eaf2f600);padding:20px 18px 8px}
    .row{display:flex;align-items:center;gap:12px}
    .back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#dbe6ee;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);font-size:22px;font-weight:700}
    h1{margin:0 4px;font-size:36px;letter-spacing:.5px}
    main{padding:12px 14px 120px;max-width:1100px;margin:0 auto}
    .grid{display:grid;gap:22px;grid-template-columns:repeat(4,1fr)}
    .cell{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
    .icon-btn{width:100%;aspect-ratio:1/1;display:grid;place-items:center;border:none;background:transparent;padding:0}
    .icon-btn img{width:var(--tile-size);height:var(--tile-size);object-fit:contain;background:transparent;display:block;border-radius:0}
    .name{font-size:16px;font-weight:700}
    .price{font-size:14px;color:var(--muted);font-weight:700}
    .cart{position:fixed;right:16px;bottom:22px;z-index:20;background:#0c1a2a;color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(15,27,45,.35)}
    .cart .bubble{min-width:28px;height:28px;border-radius:999px;background:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:800}
    .cart .total{font-weight:800;font-size:16px}
    .sheet{position:fixed;left:0;right:0;bottom:-100%;z-index:30;background:var(--sheet);color:var(--sheet-ink);border-top-left-radius:18px;border-top-right-radius:18px;padding:18px 16px 20px;transition:bottom .28s ease;box-shadow:0 -20px 50px rgba(0,0,0,.35)}
    .sheet.show{bottom:0}
    .sheet .title{font-size:22px;font-weight:800;margin:2px 0 8px}
    .qty{display:flex;align-items:center;gap:12px;margin:18px 0}
    .qty button{width:54px;height:54px;border-radius:14px;border:1px solid #253249;background:#132035;color:#eaf2f6;font-size:28px;font-weight:900}
    .qty .n{width:72px;height:54px;border-radius:14px;border:1px solid #253249;background:#0f1b2d;display:grid;place-items:center;font-size:22px;font-weight:900}
    .subtotal{margin:14px 0 18px;color:#9fb3c8;font-weight:700}
    .bar{display:flex;gap:12px}
    .btn{flex:1;display:grid;place-items:center;height:56px;border-radius:16px;border:1px solid #223049;background:#111e33;color:#cfe2f7;font-weight:800;font-size:18px;text-decoration:none}
    .btn.primary{background:#ff3b30;border-color:#ff3b30;color:#fff}
    @supports(padding:max(0px)){.cart{right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom))}.sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <header><div class="row"><a class="back" href="/pos/">‹</a><h1>PIPES</h1></div></header>
  <main><section id="grid" class="grid" aria-label="Pipes"></section></main>

  <a class="cart" href="/pos/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#9fb3c8" stroke-width="2"/><rect x="7" y="7" width="10" height="2" fill="#9fb3c8"/><rect x="7" y="11" width="10" height="2" fill="#9fb3c8"/><rect x="7" y="15" width="6" height="2" fill="#9fb3c8"/></svg>
    <span id="cartCount" class="bubble">0</span><span id="cartTotal" class="total">$0.00</span>
  </a>

  <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="row"><div><div id="sheetName" class="title">Item</div><div id="sheetPrice" class="price" style="color:#b8cbe0">$0.00</div></div></div>
    <div class="qty"><button id="minus">−</button><div id="qty" class="n">1</div><button id="plus">+</button></div>
    <div id="subtotal" class="subtotal">$0.00 subtotal</div>
    <div class="bar"><button id="cancel" class="btn">Cancel</button><button id="add" class="btn primary">Add to Bill</button></div>
  </aside>

  <script>
    const ITEMS = [
      // Add items here; filenames must be lowercase with no spaces/punctuation.
      // { name:'Briar Pipe', price:49.99, slug:'briarpipe' },
      // { name:'Corncob Pipe', price:12.99, slug:'corncobpipe' },
    ];
    const ICON_BASE = '/img/icons/pipes';

    const $grid=document.getElementById('grid');
    $grid.innerHTML = ITEMS.map((it,i)=>`
      <div class="cell">
        <button class="icon-btn" data-i="${i}" aria-label="${it.name}">
          <img loading="lazy" src="${ICON_BASE}/${it.slug}.svg" alt="${it.name}">
        </button>
        <div class="name">${it.name}</div><div class="price">$${it.price.toFixed(2)}</div>
      </div>`).join('');

    const CART_KEY='cigaros_cart_v1',$cartCount=document.getElementById('cartCount'),$cartTotal=document.getElementById('cartTotal');
    const readCart=()=>{try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch{return[]}};
    const writeCart=i=>{localStorage.setItem(CART_KEY,JSON.stringify(i));recalc()};
    function recalc(){const c=readCart();const n=c.reduce((a,b)=>a+b.qty,0);const t=c.reduce((s,i)=>s+i.qty*i.price,0);$cartCount.textContent=n;$cartTotal.textContent=`$${t.toFixed(2)}`}
    recalc();

    const $sheet=document.getElementById('sheet'),$name=document.getElementById('sheetName'),$price=document.getElementById('sheetPrice'),$qty=document.getElementById('qty'),$sub=document.getElementById('subtotal');
    let current=null;
    function openSheet(item){current={...item,qty:1};$name.textContent=item.name;$price.textContent=`$${item.price.toFixed(2)}`;$qty.textContent='1';$sub.textContent=`$${item.price.toFixed(2)} subtotal`;$sheet.classList.add('show');$sheet.setAttribute('aria-hidden','false')}
    function closeSheet(){$sheet.classList.remove('show');$sheet.setAttribute('aria-hidden','true');current=null}
    document.getElementById('minus').onclick=()=>{if(!current)return;current.qty=Math.max(1,current.qty-1);$qty.textContent=String(current.qty);$sub.textContent=`$${(current.qty*current.price).toFixed(2)} subtotal`};
    document.getElementById('plus').onclick =()=>{if(!current)return;current.qty++;$qty.textContent=String(current.qty);$sub.textContent=`$${(current.qty*current.price).toFixed(2)} subtotal`};
    document.getElementById('cancel').onclick=closeSheet;
    document.getElementById('add').onclick=()=>{if(!current)return;const cart=readCart();const key=`${current.name}@${current.price}`;const hit=cart.find(i=>i.key===key);if(hit){hit.qty+=current.qty}else{cart.push({key,name:current.name,price:current.price,qty:current.qty,slug:current.slug,cat:'pipes'})}writeCart(cart);closeSheet()};
    $grid.addEventListener('click',e=>{const b=e.target.closest('.icon-btn');if(!b)return;openSheet(ITEMS[+b.dataset.i])});
  </script>
</body>
</html>
