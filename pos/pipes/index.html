<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PIPES • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    .pipes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 12px;
    }
    .pipes-tile {
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      color: #0f1a2c;
    }
    .pipes-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      background: #d9d9d9;
      display: grid;
      place-items: center;
    }
    .pipes-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pipes-label {
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">PIPES</h1>

    <div class="pos-search">
      <input id="pipesSearch" placeholder="Search" />
    </div>

    <div id="pipesGrid" class="pipes-grid"></div>
  </div>

  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    // update these names to match /img/icons/pipes/*.svg
    const PIPES = [
      { name: "Corncob", file: "corncob.svg" },
      { name: "Briar", file: "briar.svg" },
      { name: "Churchwarden", file: "churchwarden.svg" },
      { name: "Meerschaum", file: "meerschaum.svg" },
      { name: "Long Stem", file: "longstem.svg" },
      { name: "Bent", file: "bent.svg" },
    ];

    const pipesGrid = document.getElementById('pipesGrid');
    const pipesSearch = document.getElementById('pipesSearch');

    function renderPipes(filter = "") {
      pipesGrid.innerHTML = "";
      PIPES.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(p => {
          const el = document.createElement('a');
          el.className = 'pipes-tile';
          // if you later have per-pipe pages, change href here
          el.href = 'javascript:void(0)';
          el.innerHTML = `
            <div class="pipes-icon">
              <img src="/img/icons/pipes/${p.file}" alt="${p.name}">
            </div>
            <div class="pipes-label">${p.name}</div>
          `;
          pipesGrid.appendChild(el);
        });
    }

    renderPipes();

    pipesSearch.addEventListener('input', e => {
      renderPipes(e.target.value);
    });
  </script>
</body>
</html>
