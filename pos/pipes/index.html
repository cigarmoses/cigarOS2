<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Pipes</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />

  <style>
    /* Ensure the icon area displays the resolved image nicely */
    .category-card-icon {
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .category-card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body class="category-page">
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Pipes</h1>

    <section class="category-search">
      <input type="search" class="category-search-input" placeholder="Search" />
    </section>

    <section class="category-grid">
      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Pipes"
        data-brand="Mr. Consul"
        data-name="Mr. Consul Pipe"
        data-price="65.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Mr. Consul Pipe</div>
        <div class="category-card-price">$65.00</div>
      </article>

      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Pipes"
        data-brand="Corn Cob"
        data-name="Corn Cob Pipe"
        data-price="10.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Corn Cob Pipe</div>
        <div class="category-card-price">$10.00</div>
      </article>
    </section>
  </main>

  <!-- ONE shared cart controller for all POS pages -->
  <script src="/pos/cart.js"></script>

  <!-- Page behavior -->
  <script>
    (function () {
      // -----------------------------
      // Config for this category page
      // -----------------------------
      const IMAGE_DIR = "/img/pipes"; // <-- Pipes folder

      // Back
      const backBtn = document.getElementById("category-back");
      if (backBtn) backBtn.addEventListener("click", () => {
        window.location.href = "/pos/";
      });

      // ---------------------------------------
      // Product image resolving (.svg/.png/.jpg)
      // ---------------------------------------
      const existsCache = new Map();

      function normalizeProductName(name) {
        return String(name || "")
          .toLowerCase()
          // remove spaces + dashes
          .replace(/[\s-]+/g, "")
          // remove remaining punctuation/special chars
          .replace(/[^a-z0-9]/g, "");
      }

      async function urlExists(url) {
        if (existsCache.has(url)) return existsCache.get(url);

        // Try HEAD first (fast). If blocked, fallback to GET.
        let ok = false;
        try {
          const res = await fetch(url, { method: "HEAD", cache: "no-store" });
          ok = res.ok;
        } catch (_) {
          ok = false;
        }

        if (!ok) {
          try {
            const res = await fetch(url, { method: "GET", cache: "no-store" });
            ok = res.ok;
          } catch (_) {
            ok = false;
          }
        }

        existsCache.set(url, ok);
        return ok;
      }

      async function resolveProductImage(productName, baseDir) {
        const key = normalizeProductName(productName);
        const exts = ["svg", "png", "jpg"];

        for (const ext of exts) {
          const url = `${baseDir}/${key}.${ext}`;
          if (await urlExists(url)) return url;
        }

        // Optional: leave blank if nothing exists
        return "";
      }

      async function applyCardIcons() {
        const cards = Array.from(document.querySelectorAll("[data-receipt-item]"));

        await Promise.all(cards.map(async (card) => {
          const iconBox = card.querySelector(".category-card-icon");
          if (!iconBox) return;

          // Manual override (optional later): data-img="/img/pipes/mrconsulpipe.svg"
          const manual = card.dataset.img || "";
          const name = card.dataset.name || "";

          const src = manual || await resolveProductImage(name, IMAGE_DIR);

          // Clear and render
          iconBox.innerHTML = "";
          if (!src) return;

          const img = document.createElement("img");
          img.alt = name;
          img.loading = "lazy";
          img.decoding = "async";
          img.src = src;
          iconBox.appendChild(img);
        }));
      }

      // ---------------------------------------
      // Add-to-invoice flow: click product card
      // ---------------------------------------
      function addFromCard(card) {
        if (!window.CigarOSCart || typeof window.CigarOSCart.add !== "function") return;

        const type = (card.dataset.type || "product").toLowerCase();
        const category = card.dataset.category || "Product";
        const brand = card.dataset.brand || "";
        const name = card.dataset.name || "Item";
        const price = Number(card.dataset.price || "0");
        const img = card.dataset.img || "";     // optional later
        const link = card.dataset.link || "";   // optional later

        // Stable stacking id
        const id = (category + "|" + brand + "|" + name).toLowerCase();

        window.CigarOSCart.add({
          id,
          type,
          category,   // bold title line in invoice for products (Pipes)
          brand,
          name,
          price,
          img,
          link,
          sub: ""     // optional extra line
        });

        // Open invoice immediately
        if (typeof window.CigarOSCart.openInvoice === "function") {
          window.CigarOSCart.openInvoice();
        }
      }

      document.querySelectorAll("[data-receipt-item]").forEach((card) => {
        card.addEventListener("click", () => addFromCard(card));
      });

      // Apply icons on load
      applyCardIcons();
    })();
  </script>
</body>
</html>
