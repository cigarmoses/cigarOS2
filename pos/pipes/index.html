<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Pipes</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />
</head>
<body class="category-page">
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Pipes</h1>

    <section class="category-search">
      <input type="search" class="category-search-input" placeholder="Search" />
    </section>

    <section class="category-grid">
      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Pipes"
        data-brand="Mr. Consul"
        data-name="Mr. Consul Pipe"
        data-price="65.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Mr. Consul Pipe</div>
        <div class="category-card-price">$65.00</div>
      </article>

      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Pipes"
        data-brand="Corn Cob"
        data-name="Corn Cob Pipe"
        data-price="10.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Corn Cob Pipe</div>
        <div class="category-card-price">$10.00</div>
      </article>
    </section>
  </main>

  <script src="/pos/cart.js" defer></script>
  <script>
    (function () {
      const backBtn = document.getElementById("category-back");
      if (backBtn) backBtn.addEventListener("click", () => window.location.href = "/pos/");
    })();
  </script>
</body>
</html>
