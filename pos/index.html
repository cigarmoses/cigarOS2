<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/"><span>←</span><span>Home</span></a>
      <div class="pos-star">★</div>
    </div>

    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">POS</h1>

    <div class="pos-search">
      <input placeholder="Search" />
    </div>

    <div class="pos-grid">
      <a class="pos-tile" href="/pos/cigars/">
        <div class="pos-tile-icon"></div>
        <div class="pos-tile-label">Cigars</div>
      </a>
      <a class="pos-tile" href="/pos/pipes/">
        <div class="pos-tile-icon"></div>
        <div class="pos-tile-label">Pipes</div>
      </a>
      <a class="pos-tile" href="/pos/foodandbevs/">
        <div class="pos-tile-icon"></div>
        <div class="pos-tile-label">Food &amp; Bevs</div>
      </a>
      <a class="pos-tile" href="/pos/packs/">
        <div class="pos-tile-icon"></div>
        <div class="pos-tile-label">Packs</div>
      </a>
      <a class="pos-tile" href="/pos/accessories/">
        <div class="pos-tile-icon"></div>
        <div class="pos-tile-label">Accessories</div>
      </a>
      <a class="pos-tile" href="/pos/ashtrays/">
        <div class="pos-tile-icon"></div>
        <div class="pos-tile-label">Ashtrays</div>
      </a>
    </div>
  </div>

  <!-- Bill tab -->
  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>
</body>
</html>
