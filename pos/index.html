<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS</title>

  <!-- Global SF Pro type system -->
  <link rel="stylesheet" href="/css/type.css" />
  <!-- Shared POS styles -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
      color: var(--ink);
      min-height: 100vh;
    }

    .pos-shell {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 32px;
    }

    /* Top bar */

    .pos-topbar {
      display: flex;
      align-items: center;
      padding: 12px 16px 0;
    }

    .pos-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: none;
      padding: 4px 0;
      font-size: 15px;
      color: #007aff;
      cursor: pointer;
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    }

    .pos-back-icon {
      font-size: 16px;
      line-height: 1;
    }

    .pos-back-label {
      font-size: 15px;
    }

    /* Main content */

    .pos-main {
      padding: 16px;
      padding-bottom: 40px;
    }

    .pos-title {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.2;
      font-family: var(--font-display-heavy, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    }

    .pos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .pos-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 14px;
      border-radius: 16px;
      background: var(--card);
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 10px rgba(15, 26, 44, 0.06);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
    }

    .pos-card:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(15, 26, 44, 0.12);
    }

    .pos-card-title {
      margin: 0 0 4px;
      font-size: 17px;
      font-family: var(--font-display-heavy, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    }

    .pos-card-body {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      color: var(--muted);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    }

    @media (min-width: 768px) {
      .pos-main {
        padding: 20px;
      }

      .pos-title {
        font-size: 30px;
      }

      .pos-card {
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="pos-shell">
    <!-- Top bar with back button -->
    <header class="pos-topbar">
      <button type="button" class="pos-back" id="pos-back">
        <span class="pos-back-icon">←</span>
        <span class="pos-back-label">Back</span>
      </button>
    </header>

    <!-- Main POS tiles -->
    <main class="pos-main">
      <h1 class="pos-title">POS</h1>

      <section class="pos-grid" aria-label="Point of Sale sections">
        <a href="/pos/cigars/" class="pos-card">
          <h2 class="pos-card-title">Cigars</h2>
          <p class="pos-card-body">Browse all cigars by brand.</p>
        </a>

        <a href="/pos/food-bevs/" class="pos-card">
          <h2 class="pos-card-title">Food &amp; Bevs</h2>
          <p class="pos-card-body">Drinks and snacks for the lounge.</p>
        </a>

        <a href="/pos/accessories/" class="pos-card">
          <h2 class="pos-card-title">Accessories</h2>
          <p class="pos-card-body">Lighters, cutters, and more.</p>
        </a>

        <a href="/pos/ashtrays/" class="pos-card">
          <h2 class="pos-card-title">Ashtrays</h2>
          <p class="pos-card-body">Table and personal ashtrays.</p>
        </a>

        <a href="/pos/pipes/" class="pos-card">
          <h2 class="pos-card-title">Pipes</h2>
          <p class="pos-card-body">Pipes and pipe tobacco.</p>
        </a>

        <a href="/pos/packs/" class="pos-card">
          <h2 class="pos-card-title">Packs</h2>
          <p class="pos-card-body">Samplers, fresh packs, and more.</p>
        </a>
      </section>
    </main>
  </div>

  <script>
    // Simple back behavior matching other pages
    (function () {
      const backBtn = document.getElementById('pos-back');
      if (!backBtn) return;
      backBtn.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '/';
        }
      });
    })();
  </script>
</body>
</html>
