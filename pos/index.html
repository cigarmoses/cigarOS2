<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CigarOS POS</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 22px 16px 10px 16px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      margin: 0;
    }
    .grid {
      padding: 10px 16px 90px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
      gap: 16px;
    }
    .tile {
      background: var(--card);
      border-radius: 26px;
      padding: 18px 16px 20px 16px;
      box-shadow: 0 10px 30px rgba(15,26,44,0.04);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tile-icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tile-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tile-title {
      font-size: 20px;
      font-weight: 700;
    }
    .tile-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.25;
    }
    /* receipt button at bottom (unchanged) */
    .receipt-fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #0f1a2c;
      border-radius: 999px;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 20px 10px 10px;
      box-shadow: 0 10px 30px rgba(15,26,44,.25);
      z-index: 5;
    }
    .receipt-icon {
      width: 49px;
      height: 49px;
      background: #fff;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .receipt-count {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: #d72828;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .receipt-total {
      color: #fff;
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CigarOS POS</h1>
  </header>

  <main class="grid">
    <!-- Cigars -->
    <a class="tile" href="/pos/cigars/">
      <div class="tile-icon">
        <!-- NEW ICON -->
        <img src="/img/icons/categories/cigars.svg" alt="Cigars" />
      </div>
      <div class="tile-title">Cigars</div>
      <div class="tile-sub">Browse brands, lines, vitolas</div>
    </a>

    <!-- Accessories -->
    <a class="tile" href="/pos/accessories/">
      <div class="tile-icon">
        <!-- NEW ICON -->
        <img src="/img/icons/categories/accessories.svg" alt="Accessories" />
      </div>
      <div class="tile-title">Accessories</div>
      <div class="tile-sub">Cutters, lighters, cases</div>
    </a>

    <!-- Ashtrays -->
    <a class="tile" href="/pos/ashtrays/">
      <div class="tile-icon">
        <!-- NEW ICON -->
        <img src="/img/icons/categories/ashtrays.svg" alt="Ashtrays" />
      </div>
      <div class="tile-title">Ashtrays</div>
      <div class="tile-sub">Table, lounge, outdoor</div>
    </a>

    <!-- Food & Bevs -->
    <a class="tile" href="/pos/foodandbevs/">
      <div class="tile-icon">
        <!-- NEW ICON -->
        <img src="/img/icons/categories/foodandbevs.svg" alt="Food and Bevs" />
      </div>
      <div class="tile-title">Food &amp; Bevs</div>
      <div class="tile-sub">Drinks, snacks</div>
    </a>

    <!-- Packs -->
    <a class="tile" href="/pos/packs/">
      <div class="tile-icon">
        <!-- NEW ICON -->
        <img src="/img/icons/categories/packs.svg" alt="Packs" />
      </div>
      <div class="tile-title">Packs</div>
      <div class="tile-sub">Bundles &amp; promos</div>
    </a>

    <!-- Pipes -->
    <a class="tile" href="/pos/pipes/">
      <div class="tile-icon">
        <!-- NEW ICON -->
        <img src="/img/icons/categories/pipes.svg" alt="Pipes" />
      </div>
      <div class="tile-title">Pipes</div>
      <div class="tile-sub">Tobacco &amp; accessories</div>
    </a>
  </main>

  <!-- same receipt button -->
  <div class="receipt-fab">
    <div class="receipt-icon">
      <div style="width:22px;height:28px;background:#0f1a2c;border-radius:4px;opacity:.15"></div>
    </div>
    <div class="receipt-count">4</div>
    <div class="receipt-total">$24.50</div>
  </div>
  <script src="/js/tony.js" defer></script>
</body>
</html>
