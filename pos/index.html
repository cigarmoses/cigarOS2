<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS · Categories</title>
  <link rel="stylesheet" href="/css/ui.css?v=1" />
  <link rel="icon" href="/img/icons/pos.svg" type="image/svg+xml" />
</head>
<body>
  <main>
    <header class="topbar">
      <a href="/" class="topbar-back" aria-label="Home">←</a>
      <h1 class="topbar-title">POS</h1>
      <span class="topbar-spacer"></span>
    </header>

    <section class="app-grid">
      <a class="app-tile" href="/pos/accessories/">
        <img class="app-icon" src="/img/icons/categories/accessories.svg" alt="" />
        <span class="app-label">Accessories</span>
      </a>

      <a class="app-tile" href="/pos/ashtrays/">
        <img class="app-icon" src="/img/icons/categories/ashtrays.svg" alt="" />
        <span class="app-label">Ashtrays</span>
      </a>

      <a class="app-tile" href="/pos/cigars/">
        <img class="app-icon" src="/img/icons/categories/cigars.svg" alt="" />
        <span class="app-label">Cigars</span>
      </a>

      <a class="app-tile" href="/pos/cutters/">
        <img class="app-icon" src="/img/icons/categories/cutters.svg" alt="" />
        <span class="app-label">Cutters</span>
      </a>

      <a class="app-tile" href="/foodandbevs/">
        <img class="app-icon" src="/img/icons/categories/foodandbevs.svg" alt="" />
        <span class="app-label">Food and Bevs</span>
      </a>

      <a class="app-tile" href="/pos/lighters/">
        <img class="app-icon" src="/img/icons/categories/lighters.svg" alt="" />
        <span class="app-label">Lighters</span>
      </a>

      <a class="app-tile" href="/pos/packs/">
        <img class="app-icon" src="/img/icons/categories/packs.svg" alt="" />
        <span class="app-label">Packs</span>
      </a>

      <a class="app-tile" href="/pos/pipes/">
        <img class="app-icon" src="/img/icons/categories/pipes.svg" alt="" />
        <span class="app-label">Pipes</span>
      </a>
    </section>
  </main>
</body>
</html>
