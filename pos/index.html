<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS</title>
  <link rel="preload" href="/css/system.css" as="style">
  <link rel="stylesheet" href="/css/system.css">
  <style>
    /* Mobile-first layout & visual consistency */
    :root{
      --bg:#eaf2f6;
      --ink:#0f2433;
      --tile:#ffffff;
      --shadow:0 10px 24px rgba(15,36,51,.10);
      --radius:22px;
      --gap:22px;
    }
    body{margin:0;background:var(--bg);color:var(--ink);font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    .wrap{max-width:980px;margin:0 auto;padding:20px 18px 120px;}
    .back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);opacity:.7;font-weight:600}
    .title{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:.5px;margin:14px 0 22px;}
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:var(--gap);
    }
    @media (min-width:520px){
      .grid{grid-template-columns:repeat(3, minmax(0,1fr))}
    }

    .tile{
      background:var(--tile);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;
      text-decoration:none;color:var(--ink);
      transition:transform .08s ease-out, box-shadow .08s ease-out;
    }
    .tile:active{transform:scale(.98)}
    .iconBox{
      width:104px;height:104px;display:flex;align-items:center;justify-content:center;margin:8px auto 10px;
    }
    .iconBox img{
      display:block;
      width:100%;height:100%;
      object-fit:contain; /* SVG renders without any added background */
      background:transparent;
    }
    .label{font-weight:700;font-size:16px}
    /* graceful-missing image placeholder */
    .fallback{
      width:104px;height:104px;border-radius:26px;border:2px dashed rgba(15,36,51,.25);
      display:flex;align-items:center;justify-content:center;font-weight:700;opacity:.5
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/"><span aria-hidden="true">←</span> Home</a>
    <h1 class="title">POS</h1>

    <div id="grid" class="grid" role="list"></div>
  </div>

  <script>
    // Canonical list (labels must match what you want shown)
    const CATEGORIES = [
      { label: "Food & Bevs", href: "/foodandbevs/" },
      { label: "Ashtrays",     href: "/pos/ashtrays/" },
      { label: "Cigars",       href: "/cigars/" },
      { label: "Packs",        href: "/pos/packs/" },
      { label: "Pipes",        href: "/pos/pipes/" },
      { label: "Accessories",  href: "/pos/accessories/" }
    ];

    // Slug → filename rules (matches your repo convention)
    function iconFile(label){
      // special case to collapse spaces/&
      if (/^food\s*&\s*bevs$/i.test(label)) return "foodandbevs.svg";
      return label
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "") + ".svg"; // remove spaces/punctuation
    }

    const grid = document.getElementById('grid');

    CATEGORIES.forEach(({label, href}) => {
      const file = iconFile(label);
      const tile = document.createElement('a');
      tile.className = 'tile';
      tile.href = href;

      const box = document.createElement('div');
      box.className = 'iconBox';

      const img = document.createElement('img');
      img.alt = label + " icon";
      img.loading = "lazy";
      img.decoding = "async";
      img.src = `/img/icons/categories/${file}`;

      // graceful fallback if file missing
      img.onerror = () => {
        box.innerHTML = `<div class="fallback">SVG</div>`;
      };

      box.appendChild(img);

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = label;

      tile.appendChild(box);
      tile.appendChild(lab);
      grid.appendChild(tile);
    });
  </script>
</body>
</html>
