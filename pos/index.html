<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />

  <!-- POS global styles -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --bg: #ffffff; /* WHITE like cigars page */
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #f2f4f7; /* Same card color used on Cigars page */
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Top Back Button */
    .pos-topbar {
      padding: 16px 18px 0;
      display: flex;
      align-items: center;
    }

    .pos-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #007aff;
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* PAGE TITLE - MATCHES CIGARS PAGE EXACTLY */
    .pos-title {
      font-family: var(--font-display);
      font-weight: 800; /* Heavy */
      font-size: 34px;
      letter-spacing: -0.02em;
      margin: 8px 18px 22px;
    }

    /* GRID OF CATEGORY BOXES */
    .pos-grid {
      padding: 0 18px 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    /* UPDATED ONLY THIS PART */
    .pos-card {
      background: var(--card);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); /* subtle iOS shadow */
      -webkit-box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .pos-card-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pos-card-desc {
      font-size: 14px;
      line-height: 1.35;
      color: var(--muted);
    }

    /* ICON FIX – ensure each card has its image correctly displayed */
    .pos-card img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <header class="pos-topbar">
    <button class="pos-back" onclick="history.back()">
      <span>←</span> <span>Back</span>
    </button>
  </header>

  <!-- PAGE TITLE -->
  <h1 class="pos-title">POS</h1>

  <!-- CATEGORY GRID -->
  <section class="pos-grid">
    <div class="pos-card" onclick="location.href='/pos/cigars/'">
      <img src="/pos/icons/cigars.svg" alt="">
      <div class="pos-card-title">Cigars</div>
      <div class="pos-card-desc">Browse all cigars by brand.</div>
    </div>

    <div class="pos-card" onclick="location.href='/pos/food/'">
      <img src="/pos/icons/food.svg" alt="">
      <div class="pos-card-title">Food & Bevs</div>
      <div class="pos-card-desc">Drinks and snacks for the lounge.</div>
    </div>

    <div class="pos-card" onclick="location.href='/pos/accessories/'">
      <img src="/pos/icons/lighter.svg" alt="">
      <div class="pos-card-title">Accessories</div>
      <div class="pos-card-desc">Lighters, cutters, and more.</div>
    </div>

    <div class="pos-card" onclick="location.href='/pos/ashtrays/'">
      <img src="/pos/icons/ashtray.svg" alt="">
      <div class="pos-card-title">Ashtrays</div>
      <div class="pos-card-desc">Table and personal ashtrays.</div>
    </div>

    <div class="pos-card" onclick="location.href='/pos/pipes/'">
      <img src="/pos/icons/pipes.svg" alt="">
      <div class="pos-card-title">Pipes</div>
      <div class="pos-card-desc">Pipes and pipe tobacco.</div>
    </div>

    <div class="pos-card" onclick="location.href='/pos/packs/'">
      <img src="/pos/icons/packs.svg" alt="">
      <div class="pos-card-title">Packs</div>
      <div class="pos-card-desc">Samplers, fresh packs, and more.</div>
    </div>
  </section>

</body>
</html>
