<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css?v=22" />
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg:#0b1323;
      --bg-grad-1:rgba(72,117,210,.30);
      --bg-grad-2:rgba(0,185,255,.10);

      --surface:#0f1b33;
      --surface-2:#13223f;
      --surface-3:#172949;
      --surface-soft:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.10);

      --text:#ffffff;
      --muted:rgba(255,255,255,.62);

      --toggle-track:#c7d1de;
      --toggle-knob:#ffffff;

      --shadow:0 18px 40px rgba(0,0,0,.26);
      --card-shadow:0 14px 34px rgba(0,0,0,.22);
    }

    html[data-theme="light"]{
      --bg:#eef2f7;
      --bg-grad-1:rgba(117,152,214,.18);
      --bg-grad-2:rgba(60,140,255,.06);

      --surface:#ffffff;
      --surface-2:#f3f5f9;
      --surface-3:#eceff5;
      --surface-soft:rgba(15,26,44,.04);
      --border:rgba(15,26,44,.08);

      --text:#101828;
      --muted:rgba(16,24,40,.62);

      --toggle-track:#c7d1de;
      --toggle-knob:#ffffff;

      --shadow:0 14px 32px rgba(15,26,44,.10);
      --card-shadow:0 12px 26px rgba(15,26,44,.08);
    }

    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 15% 5%, var(--bg-grad-1), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, var(--bg-grad-2), transparent 55%),
        var(--bg);
      font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    .pos-page{
      width:min(430px, calc(100% - 22px));
      margin:0 auto;
      padding:calc(12px + var(--safe-top)) 0 calc(28px + var(--safe-bottom));
      min-height:100dvh;
    }

    .pos-topbar{
      display:grid;
      grid-template-columns:24px 1fr 48px;
      align-items:center;
      gap:10px;
      padding:0 0 12px;
    }

    .pos-back{
      width:24px;
      height:24px;
      border:0;
      padding:0;
      display:grid;
      place-items:center;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:none;
      border-radius:0;
    }

    .pos-back svg{
      width:24px;
      height:24px;
      display:block;
    }

    .pos-topbar-spacer{
      width:24px;
      height:24px;
    }

    .pos-theme-dock{
      display:flex;
      justify-content:flex-end;
      align-items:center;
    }

    #theme-toggle{
      position:relative;
      width:48px;
      height:28px;
      border:1px solid rgba(255,255,255,.10);
      padding:0;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }

    html[data-theme="light"] #theme-toggle{
      border:1px solid rgba(15,26,44,.08);
      background:rgba(255,255,255,.96);
      box-shadow:0 10px 24px rgba(15,26,44,.06);
    }

    #theme-toggle .track{
      position:absolute;
      inset:0;
      border-radius:999px;
    }

    #theme-toggle .knob{
      position:absolute;
      top:2px;
      left:2px;
      width:22px;
      height:22px;
      border-radius:999px;
      background:#fff;
      color:#0b1323;
      box-shadow:0 3px 10px rgba(0,0,0,.16);
      transition:transform .25s ease;
      display:grid;
      place-items:center;
    }

    #theme-toggle .icon-sun,
    #theme-toggle .icon-moon{
      position:absolute;
      width:12px;
      height:12px;
    }

    #theme-toggle .icon-moon{
      display:none;
    }

    html[data-theme="dark"] #theme-toggle .knob{
      transform:translateX(20px);
    }

    html[data-theme="dark"] #theme-toggle .icon-sun{
      display:none;
    }

    html[data-theme="dark"] #theme-toggle .icon-moon{
      display:block;
    }

    .pos-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      padding:2px 2px 16px;
    }

    .pos-title{
      margin:0;
      font:900 48px/.92 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.055em;
      color:var(--text);
    }

    .pos-cart-btn{
      position:relative;
      width:44px;
      height:44px;
      border:0;
      padding:0;
      border-radius:14px;
      background:transparent;
      display:grid;
      place-items:center;
      color:var(--text);
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }

    .pos-cart-btn svg{
      width:28px;
      height:28px;
    }

    .pos-cart-badge{
      position:absolute;
      top:2px;
      right:1px;
      min-width:18px;
      height:18px;
      padding:0 5px;
      border-radius:999px;
      background:#ff453a;
      color:#fff;
      font:800 11px/18px "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      text-align:center;
      box-shadow:0 6px 16px rgba(0,0,0,.18);
    }

    .pos-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:14px;
    }

    .pos-card{
      display:flex;
      flex-direction:column;
      min-height:200px;
      border-radius:24px;
      padding:18px 16px 16px;
      background:linear-gradient(180deg, var(--surface-2) 0%, var(--surface-3) 100%);
      box-shadow:var(--shadow);
      text-decoration:none;
      color:var(--text);
      overflow:hidden;
      position:relative;
    }

    .pos-card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 0 1px var(--border);
      border-radius:24px;
    }

    .pos-card-icon{
      width:64px;
      height:64px;
      border-radius:0;
      background:transparent;
      border:none;
      box-shadow:none;
      display:grid;
      place-items:center;
      margin-bottom:18px;
      flex:0 0 auto;
      overflow:visible;
    }

    .pos-card-icon img{
      width:58px;
      height:58px;
      object-fit:contain;
      display:block;
    }

    .pos-card-icon .icon-dark,
    .pos-card-icon .icon-light{
      display:none;
    }

    html[data-theme="dark"] .pos-card-icon .icon-dark{
      display:block !important;
    }

    html[data-theme="dark"] .pos-card-icon .icon-light{
      display:none !important;
    }

    html[data-theme="light"] .pos-card-icon .icon-dark{
      display:none !important;
    }

    html[data-theme="light"] .pos-card-icon .icon-light{
      display:block !important;
    }

    .pos-card-title{
      font:900 22px/1.02 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.04em;
      color:var(--text);
    }

    .pos-card-sub{
      margin-top:8px;
      font:400 14px/1.2 "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      color:var(--muted);
    }

    .pos-card-arrow{
      margin-top:auto;
      padding-top:20px;
      display:flex;
      justify-content:flex-end;
      color:var(--muted);
      font:900 30px/1 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    @media (max-width:390px){
      .pos-page{ width:calc(100% - 18px); }
      .pos-title{ font-size:42px; }
      .pos-grid{ gap:12px; }
      .pos-card{ min-height:186px; padding:16px 14px 14px; }
      .pos-card-title{ font-size:20px; }

      .pos-topbar{
        grid-template-columns:22px 1fr 46px;
      }

      .pos-back,
      .pos-topbar-spacer{
        width:22px;
        height:22px;
      }

      .pos-back svg{
        width:22px;
        height:22px;
      }

      #theme-toggle{
        width:46px;
        height:27px;
      }

      #theme-toggle .knob{
        width:21px;
        height:21px;
      }

      html[data-theme="dark"] #theme-toggle .knob{
        transform:translateX(19px);
      }
    }
  </style>
</head>

<body class="pos-home">
  <main class="pos-page">
    <header class="pos-topbar">
      <button type="button" class="pos-back" aria-label="Back" onclick="history.length > 1 ? history.back() : window.location.href='/'">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>

      <div class="pos-topbar-spacer" aria-hidden="true"></div>

      <div class="pos-theme-dock">
        <button id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="true">
          <span class="track" aria-hidden="true"></span>
          <span class="knob" aria-hidden="true">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
              <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23 5.46 5.46"></path>
              </g>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.5 3.5a8 8 0 1 0 6 13.3A9 9 0 0 1 14.5 3.5Z" fill="currentColor"></path>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <section class="pos-head">
      <h1 class="pos-title">POS</h1>

      <a href="/pos/invoice/" class="pos-cart-btn" aria-label="Invoice">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
          <circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
        </svg>
        <span class="pos-cart-badge" data-cart-badge hidden>0</span>
      </a>
    </section>

    <section class="pos-grid">
      <a href="/pos/cigars/" class="pos-card">
        <div class="pos-card-icon">
          <img class="icon-dark" src="/uxui/darkmode/darkmodecigars.png" alt="">
          <img class="icon-light" src="/uxui/lightmode/lightmodecigars.png" alt="">
        </div>
        <div class="pos-card-title">Cigars</div>
        <div class="pos-card-sub">Browse brands and add sticks</div>
        <div class="pos-card-arrow">›</div>
      </a>

      <a href="/pos/products/" class="pos-card">
        <div class="pos-card-icon">
          <img class="icon-dark" src="/uxui/darkmode/darkmodeotherproducts.png" alt="">
          <img class="icon-light" src="/uxui/lightmode/lightmodeotherproducts.png" alt="">
        </div>
        <div class="pos-card-title">Other Products</div>
        <div class="pos-card-sub">Drinks, food, accessories, and more</div>
        <div class="pos-card-arrow">›</div>
      </a>
    </section>
  </main>

  <script src="/pos/cart.js" defer></script>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("theme") || "dark";

      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (toggle) toggle.setAttribute("aria-pressed", String(next === "dark"));
      }

      applyTheme(saved);

      toggle?.addEventListener("click", () => {
        applyTheme((root.getAttribute("data-theme") || "dark") === "dark" ? "light" : "dark");
      });
    })();
  </script>
</body>
</html>
