<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS</title>

  <!-- Core styles -->
  <link rel="stylesheet" href="../css/system.css" />
  <link rel="stylesheet" href="./pos.css" />
</head>

<body class="pos-page">
  <div class="page">
    <div class="toprow">
      <a href="../index.html" style="text-decoration:none;color:inherit;font-size:22px;">←</a>
      <h1 class="page-title">POS</h1>
    </div>

    <div class="app-grid">
      <!-- Pipes -->
      <a href="../pipes/" class="app-tile">
        <img src="../img/icons/pipes.svg" class="app-icon" alt="Pipes" />
      </a>

      <!-- Cigars -->
      <a href="../cigars/" class="app-tile">
        <img src="../img/icons/cigars.svg" class="app-icon" alt="Cigars" />
      </a>

      <!-- Food & Beverages -->
      <a href="../foodandbevs/" class="app-tile">
        <img src="../img/icons/foodandbevs.svg" class="app-icon" alt="Food and Beverages" />
      </a>

      <!-- Learn -->
      <a href="../learn/" class="app-tile">
        <img src="../img/icons/learn.svg" class="app-icon" alt="Learn" />
      </a>

      <!-- Ashtrays -->
      <a href="../ashtrays/" class="app-tile">
        <img src="../img/icons/ashtray.svg" class="app-icon" alt="Ashtrays" />
      </a>
    </div>
  </div>

  <!-- Cart Tab (Floating Bottom Right) -->
  <div style="
    position:fixed;
    bottom:20px;
    right:20px;
    background:#0e1a28;
    color:white;
    border-radius:24px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    font-weight:600;
  ">
    <img src="../img/icons/cart.svg" alt="Cart" style="width:18px;height:18px;">
    <span style="background:#e94d45;border-radius:50%;padding:4px 8px;">3</span>
    <span>$4.50</span>
  </div>
</body>
</html>
