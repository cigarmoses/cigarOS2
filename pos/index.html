<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POS · Categories</title>
<link rel="stylesheet" href="/css/system.css" />
<style>
  :root{ --bg:#ECF3F7; --tile:#fff; --shadow:0 16px 36px rgba(8,15,30,.10); }
  body{ margin:0; background:var(--bg); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  .wrap{ max-width:480px; margin:0 auto; padding:18px 18px 96px; }
  .topbar{ display:flex; align-items:center; gap:10px; }
  .back{ text-decoration:none; color:#111; font-size:28px; line-height:1; }
  h1{ margin:6px 0 18px; text-align:center; font-size:22px; letter-spacing:.06em; }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
  .tile{ background:var(--tile); border-radius:26px; box-shadow:var(--shadow);
         display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; }
  .tile img{ width:62%; height:62%; object-fit:contain; display:block; }
  /* bill dock space */
  .pad-bill{ height:96px; }
  /* Floating bill dock – hook only; keep your existing styling if you have it */
  .bill-dock{ position:fixed; right:18px; bottom:18px; background:#0b1423; color:#fff;
              border-radius:22px; padding:10px 16px; display:flex; gap:10px; align-items:center;
              box-shadow:0 18px 46px rgba(8,15,30,.22); }
  .pill{ background:#E35151; color:#fff; border-radius:999px; padding:2px 10px; font-weight:700; }
</style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <a class="back" href="/">‹</a>
      <div style="flex:1"></div>
    </header>
    <h1>POS</h1>

    <section class="grid" aria-label="POS Categories">
      <!-- Icons from /img/icons/categories/ -->
      <a class="tile" href="/pos/pipes/"><img src="/img/icons/categories/pipes.svg" alt=""></a>
      <a class="tile" href="/pos/cutters/"><img src="/img/icons/categories/cutters.svg" alt=""></a>
      <a class="tile" href="/pos/cigars/"><img src="/img/icons/categories/cigars.svg" alt=""></a>
      <a class="tile" href="/foodandbevs/"><img src="/img/icons/categories/foodandbevs.svg" alt=""></a>
      <a class="tile" href="/pos/packs/"><img src="/img/icons/categories/packs.svg" alt=""></a>
      <a class="tile" href="/pos/lighters/"><img src="/img/icons/categories/lighters.svg" alt=""></a>
      <a class="tile" href="/pos/ashtrays/"><img src="/img/icons/categories/ashtrays.svg" alt=""></a>
      <a class="tile" href="/pos/accessories/"><img src="/img/icons/categories/accessories.svg" alt=""></a>
    </section>

    <div class="pad-bill"></div>
  </main>

  <!-- Bill dock (connect to your cart totals) -->
  <button class="bill-dock" onclick="location.href='/pos/checkout/'" aria-label="Open Bill">
    <img src="/img/icons/pos.svg" alt="" style="width:22px;height:22px" />
    <span class="pill" id="billCount">0</span>
    <span id="billTotal">$0.00</span>
  </button>
  <script>
    // Optional: integrate with your existing cart to update #billCount/#billTotal
  </script>
</body>
</html>
