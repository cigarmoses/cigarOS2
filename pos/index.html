<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg:#0b1323;
      --bg-grad-1:rgba(72,117,210,.30);
      --bg-grad-2:rgba(0,185,255,.10);

      --surface:#0f1b33;
      --surface-2:#13223f;
      --surface-3:#172949;
      --surface-soft:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.10);

      --text:#ffffff;
      --muted:rgba(255,255,255,.62);

      --toggle-track:#c7d1de;
      --toggle-knob:#ffffff;

      --shadow:0 18px 40px rgba(0,0,0,.26);
      --card-shadow:0 14px 34px rgba(0,0,0,.22);
    }

    html[data-theme="light"]{
      --bg:#eef2f7;
      --bg-grad-1:rgba(117,152,214,.18);
      --bg-grad-2:rgba(60,140,255,.06);

      --surface:#ffffff;
      --surface-2:#f3f5f9;
      --surface-3:#eceff5;
      --surface-soft:rgba(15,26,44,.04);
      --border:rgba(15,26,44,.08);

      --text:#101828;
      --muted:rgba(16,24,40,.62);

      --toggle-track:#c7d1de;
      --toggle-knob:#ffffff;

      --shadow:0 14px 32px rgba(15,26,44,.10);
      --card-shadow:0 12px 26px rgba(15,26,44,.08);
    }

    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 15% 5%, var(--bg-grad-1), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, var(--bg-grad-2), transparent 55%),
        var(--bg);
      font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    .pos-page{
      width:min(430px, calc(100% - 22px));
      margin:0 auto;
      padding:calc(12px + var(--safe-top)) 0 calc(28px + var(--safe-bottom));
      min-height:100dvh;
    }

    .pos-topbar{
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      gap:10px;
      padding:0 0 12px;
    }

    .pos-back{
      width:44px;
      height:44px;
      border:0;
      border-radius:14px;
      padding:0;
      display:grid;
      place-items:center;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .pos-back svg{
      width:22px;
      height:22px;
    }

    .pos-topbar-spacer{
      width:44px;
      height:44px;
    }

    .pos-theme-dock{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    #theme-toggle{
      position:relative;
      width:58px;
      height:32px;
      border:0;
      padding:0;
      border-radius:999px;
      background:transparent;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    #theme-toggle .track{
      position:absolute;
      inset:0;
      border-radius:999px;
      background:var(--toggle-track);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    }

    #theme-toggle .knob{
      position:absolute;
      top:3px;
      left:3px;
      width:26px;
      height:26px;
      border-radius:999px;
      background:var(--toggle-knob);
      box-shadow:0 3px 8px rgba(0,0,0,.18);
      transition:transform .22s ease;
    }

    html[data-theme="dark"] #theme-toggle .knob{
      transform:translateX(26px);
    }

    .pos-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      padding:2px 2px 16px;
    }

    .pos-title{
      margin:0;
      font:900 48px/.92 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.055em;
      color:var(--text);
    }

    .pos-cart-btn{
      position:relative;
      width:44px;
      height:44px;
      border:0;
      padding:0;
      border-radius:14px;
      background:transparent;
      display:grid;
      place-items:center;
      color:var(--text);
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }

    .pos-cart-btn svg{
      width:28px;
      height:28px;
    }

    .pos-cart-badge{
      position:absolute;
      top:2px;
      right:1px;
      min-width:18px;
      height:18px;
      padding:0 5px;
      border-radius:999px;
      background:#ff453a;
      color:#fff;
      font:800 11px/18px "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      text-align:center;
      box-shadow:0 6px 16px rgba(0,0,0,.18);
    }

    .pos-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:14px;
    }

    .pos-card{
      display:flex;
      flex-direction:column;
      min-height:200px;
      border-radius:24px;
      padding:18px 16px 16px;
      background:linear-gradient(180deg, var(--surface-2) 0%, var(--surface-3) 100%);
      box-shadow:var(--shadow);
      text-decoration:none;
      color:var(--text);
      overflow:hidden;
      position:relative;
    }

    .pos-card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 0 1px var(--border);
      border-radius:24px;
    }

    .pos-card-icon{
      width:64px;
      height:64px;
      border-radius:18px;
      background:var(--surface-soft);
      border:1px solid var(--border);
      display:grid;
      place-items:center;
      margin-bottom:18px;
      flex:0 0 auto;
      box-shadow:var(--card-shadow);
    }

    .pos-card-icon svg{
      width:30px;
      height:30px;
      color:var(--text);
      opacity:.92;
    }

    .pos-card-title{
      font:900 22px/1.02 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.04em;
      color:var(--text);
    }

    .pos-card-sub{
      margin-top:8px;
      font:700 14px/1.12 "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      color:var(--muted);
    }

    .pos-card-arrow{
      margin-top:auto;
      padding-top:20px;
      display:flex;
      justify-content:flex-end;
      color:var(--muted);
      font:900 30px/1 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    @media (max-width:390px){
      .pos-page{ width:calc(100% - 18px); }
      .pos-title{ font-size:42px; }
      .pos-grid{ gap:12px; }
      .pos-card{ min-height:186px; padding:16px 14px 14px; }
      .pos-card-title{ font-size:20px; }
    }
  </style>
</head>

<body>
  <main class="pos-page">
    <header class="pos-topbar">
      <button type="button" class="pos-back" aria-label="Back" onclick="history.back()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>

      <div class="pos-theme-dock">
        <button id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="true">
          <span class="track" aria-hidden="true"></span>
          <span class="knob" aria-hidden="true"></span>
        </button>
      </div>

      <div class="pos-topbar-spacer"></div>
    </header>

    <section class="pos-head">
      <h1 class="pos-title">POS</h1>

      <a href="/pos/invoice/" class="pos-cart-btn" aria-label="Invoice">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
          <circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
        </svg>
        <span class="pos-cart-badge" data-cart-badge hidden>0</span>
      </a>
    </section>

    <section class="pos-grid">
      <a href="/pos/cigars/" class="pos-card">
        <div class="pos-card-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="10" width="12" height="4" rx="2" fill="currentColor"></rect>
            <rect x="16.5" y="10.7" width="1.8" height="2.6" rx=".8" fill="rgba(255,255,255,.35)"></rect>
          </svg>
        </div>
        <div class="pos-card-title">Cigars</div>
        <div class="pos-card-sub">Browse brands and add sticks</div>
        <div class="pos-card-arrow">›</div>
      </a>

      <a href="/pos/products/" class="pos-card">
        <div class="pos-card-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
            <path d="M7 11h10M11 7v10" fill="none" stroke="currentColor" stroke-width="1.8"></path>
          </svg>
        </div>
        <div class="pos-card-title">Other Products</div>
        <div class="pos-card-sub">Drinks, food, accessories, and more</div>
        <div class="pos-card-arrow">›</div>
      </a>
    </section>
  </main>

  <script src="/pos/cart.js" defer></script>
  <script>
    (function(){
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("theme") || "dark";

      function applyTheme(theme){
        const next = theme === "light" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if(toggle) toggle.setAttribute("aria-pressed", String(next === "dark"));
      }

      applyTheme(saved);

      toggle?.addEventListener("click", function(){
        applyTheme((root.getAttribute("data-theme") || "dark") === "dark" ? "light" : "dark");
      });
    })();
  </script>
</body>
</html>
