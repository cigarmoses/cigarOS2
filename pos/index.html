<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS · Smoke POS</title>

  <link rel="stylesheet" href="/style.css?v=6" />
  <link rel="stylesheet" href="/pos/pos.css?v=6" />
  <link rel="icon" href="/img/icons/pos.svg" type="image/svg+xml" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/" class="back">← Home</a>
      <div class="brand">
        <img src="/img/logo.png?v=6" alt="Smoke Cigar Shop & Lounge" />
        <h1>POS</h1>
      </div>
    </header>

    <section class="module-content module-split">
      <!-- Left: simple cigar grid (demo) -->
      <div class="cigar-grid" id="cigarGrid"></div>

      <!-- Right: shared cart -->
      <aside class="cart">
        <div class="cart-header">
          <h2>Order</h2>
          <button id="clearCart" class="btn btn-light">Clear</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-totals">
          <div class="row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
          <div class="row"><span>Tax (7%)</span><strong id="tax">$0.00</strong></div>
          <div class="row total"><span>Total</span><strong id="total">$0.00</strong></div>
          <button id="checkout" class="btn btn-primary" disabled>Checkout</button>
        </div>
      </aside>
    </section>
  </main>

  <!-- Shared cart libraries -->
  <script src="/js/cart.js?v=6"></script>
  <script src="/js/cart-ui.js?v=6"></script>
  <!-- Module logic -->
  <script src="/pos/pos.js?v=6"></script>
</body>
</html>
