<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS</title>
  <style>
    :root{--bg:#eaf2f6;--ink:#0f1a2c;--muted:#6d7b8e;--shadow:0 8px 30px rgba(20,30,50,.16)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    header{position:sticky;top:0;z-index:5;background:linear-gradient(#eaf2f6,#eaf2f6cc 70%,#eaf2f600);padding:20px 18px 8px}
    .row{display:flex;align-items:center;gap:12px}
    h1{margin:0 4px;font-size:36px;letter-spacing:.5px}
    main{padding:16px 14px 120px;max-width:1100px;margin:0 auto}
    .grid{display:grid;gap:24px;grid-template-columns:repeat(4,1fr)}
    .cell{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
    .tile{width:100%;aspect-ratio:1/1;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);text-decoration:none}
    .tile img{width:84px;height:84px;object-fit:contain;display:block}
    .name{font-size:16px;font-weight:800}
    a{color:inherit;text-decoration:none}
    @media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header>
    <div class="row">
      <h1>POS</h1>
    </div>
  </header>

  <main>
    <section class="grid" aria-label="POS Categories">
      <!-- Food & Beverages -->
      <a class="cell" href="/pos/foodandbevs/">
        <span class="tile">
          <img src="/img/icons/categories/foodandbevs.svg" alt="Food & Beverages icon" loading="eager">
        </span>
        <span class="name">Food & Beverages</span>
      </a>

      <!-- Cigars -->
      <a class="cell" href="/pos/cigars/">
        <span class="tile">
          <img src="/img/icons/categories/cigars.svg" alt="Cigars icon" loading="lazy">
        </span>
        <span class="name">Cigars</span>
      </a>

      <!-- Pipes -->
      <a class="cell" href="/pos/pipes/">
        <span class="tile">
          <img src="/img/icons/categories/pipes.svg" alt="Pipes icon" loading="lazy">
        </span>
        <span class="name">Pipes</span>
      </a>

      <!-- Packs -->
      <a class="cell" href="/pos/packs/">
        <span class="tile">
          <img src="/img/icons/categories/packs.svg" alt="Packs icon" loading="lazy">
        </span>
        <span class="name">Packs</span>
      </a>

      <!-- Ashtrays -->
      <a class="cell" href="/pos/ashtrays/">
        <span class="tile">
          <img src="/img/icons/categories/ashtrays.svg" alt="Ashtrays icon" loading="lazy">
        </span>
        <span class="name">Ashtrays</span>
      </a>

      <!-- Accessories -->
      <a class="cell" href="/pos/accessories/">
        <span class="tile">
          <img src="/img/icons/categories/accessories.svg" alt="Accessories icon" loading="lazy">
        </span>
        <span class="name">Accessories</span>
      </a>
    </section>
  </main>
</body>
</html>
