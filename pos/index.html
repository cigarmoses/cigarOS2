<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS</title>

  <!-- Global SF Pro -->
  <link rel="stylesheet" href="/css/type.css" />
  <!-- POS global styles -->
  <link rel="stylesheet" href="/pos/pos.css" />
</head>

<body class="pos-home">

  <!-- Top bar (back arrow only, no "Back" text) -->
  <header class="pos-topbar">
    <button type="button" class="pos-back" id="pos-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main class="pos-main">
    <h1 class="pos-title">POS</h1>

    <!-- Card grid (Learn-style) -->
    <section class="pos-grid" aria-label="POS sections">

      <button class="pos-card" type="button" data-href="/pos/cigars/">
        <div class="pos-card-icon">
          <img src="/img/icons/pos/cigars.svg" alt="" />
        </div>
        <div class="pos-card-title">Cigars</div>
      </button>

      <button class="pos-card" type="button" data-href="/pos/food/">
        <div class="pos-card-icon">
          <img src="/img/icons/pos/food.svg" alt="" />
        </div>
        <div class="pos-card-title">Food &amp; Bevs</div>
      </button>

      <button class="pos-card" type="button" data-href="/pos/accessories/">
        <div class="pos-card-icon">
          <img src="/img/icons/pos/accessories.svg" alt="" />
        </div>
        <div class="pos-card-title">Accessories</div>
      </button>

      <button class="pos-card" type="button" data-href="/pos/ashtrays/">
        <div class="pos-card-icon">
          <img src="/img/icons/pos/ashtrays.svg" alt="" />
        </div>
        <div class="pos-card-title">Ashtrays</div>
      </button>

      <button class="pos-card" type="button" data-href="/pos/pipes/">
        <div class="pos-card-icon">
          <img src="/img/icons/pos/pipes.svg" alt="" />
        </div>
        <div class="pos-card-title">Pipes</div>
      </button>

      <button class="pos-card" type="button" data-href="/pos/packs/">
        <div class="pos-card-icon">
          <img src="/img/icons/pos/packs.svg" alt="" />
        </div>
        <div class="pos-card-title">Packs</div>
      </button>

    </section>
  </main>

  <script>
    // Back arrow behavior
    document.addEventListener("DOMContentLoaded", () => {
      const backBtn = document.getElementById("pos-back");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          if (window.history.length > 1) window.history.back();
          else window.location.href = "/";
        });
      }

      // Card navigation
      document.querySelectorAll(".pos-card").forEach((card) => {
        card.addEventListener("click", () => {
          const href = card.getAttribute("data-href");
          if (href) window.location.href = href;
        });
      });
    });
  </script>
</body>
</html>
