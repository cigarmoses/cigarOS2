<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POS</title>
<link rel="stylesheet" href="../css/system.css" />
<style>
  :root { --ink:#0e1a28; --pill:#0e1a28; --accent:#ff4040; }
  body { font-family:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,sans-serif; }
  .page { padding:18px 16px 120px; background:#eaf1f5; min-height:100vh; }
  .toprow { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .back-link { text-decoration:none; color:inherit; font-size:22px; }
  .page-title { font-weight:800; font-size:28px; letter-spacing:.5px; color:#1a2733; margin:0; }
  .app-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
  .app-tile { display:flex; align-items:center; justify-content:center; border-radius:24px; background:#ffffff; box-shadow:0 10px 30px rgba(10,25,41,.08); height:140px; }
  .app-icon { width:90px; height:90px; background:none!important; box-shadow:none!important; }
  .cart-pill { position:fixed; right:20px; bottom:20px; z-index:70; background:var(--pill); color:#fff; border-radius:24px; padding:12px 18px; display:flex; gap:12px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.25); font-weight:700; }
  .cart-pill .count { background:#e94d45; border-radius:999px; padding:4px 8px; }
</style>
</head>
<body>
  <main class="page">
    <div class="toprow">
      <a class="back-link" href="../index.html">←</a>
      <h1 class="page-title">POS</h1>
    </div>

    <section id="grid" class="app-grid"></section>
  </main>

  <div class="cart-pill" id="cartPill">
    <img src="../img/icons/cart.svg" alt="" style="width:18px;height:18px">
    <span class="count" id="cartCount">0</span>
    <span id="cartTotal">$0.00</span>
  </div>

<script>
  const CATS = [
    { n:'Pipes', href:'../pos/pipes/', f:'pipes.svg' },
    { n:'Cigars', href:'../cigars/', f:'cigars.svg' },
    { n:'Food & Bevs', href:'../foodandbevs/', f:'foodbev.svg' },
    { n:'Packs', href:'../pos/packs/', f:'packs.svg' },
    { n:'Ashtrays', href:'../pos/ashtrays/', f:'ashtray.svg' }
  ];
  const ICON_BASE = '../img/icons/categories/';

  const grid = document.getElementById('grid');
  grid.innerHTML = CATS.map(c => `
    <a class="app-tile" href="${c.href}">
      <img class="app-icon" src="${ICON_BASE + c.f}" alt="${c.n}">
    </a>
  `).join('');

  let cartCount=0, cartTotal=0;
  const cartCountEl=document.getElementById('cartCount');
  const cartTotalEl=document.getElementById('cartTotal');
  function updatePill(){ cartCountEl.textContent=cartCount; cartTotalEl.textContent=`$${cartTotal.toFixed(2)}`; }
  updatePill();
</script>
</body>
</html>
