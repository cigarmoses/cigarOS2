<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>POS</title>

<style>
:root{
  --bg:#0b1323;
  --glass:rgba(255,255,255,.08);
  --glassBorder:rgba(255,255,255,.10);
  --text:#fff;
  --muted:rgba(255,255,255,.6);
}

html[data-theme="light"]{
  --bg:#eef2f7;
  --glass:rgba(255,255,255,.65);
  --glassBorder:rgba(0,0,0,.08);
  --text:#0b1220;
  --muted:rgba(0,0,0,.5);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system, SF Pro Display, sans-serif;
}

/* ===== Layout ===== */

.wrap{
  width:min(430px,100%);
  margin:auto;
  padding:20px 16px 100px;
}

/* ===== Header ===== */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.btn{
  width:42px;
  height:42px;
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--glassBorder);
  display:grid;
  place-items:center;
}

.title{
  font-size:48px;
  font-weight:900;
  letter-spacing:-.04em;
  margin:10px 0 12px;
}

/* ===== Grid ===== */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

/* ===== Cards ===== */

.card{
  border-radius:24px;
  padding:18px;
  background:var(--glass);
  backdrop-filter:blur(28px);
  border:1px solid var(--glassBorder);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card h2{
  font-size:22px;
  margin:0;
}

.arrow{
  text-align:right;
  font-size:26px;
  opacity:.6;
}

/* ===== Open Tabs ===== */

.tabs{
  margin-top:18px;
  border-radius:24px;
  padding:18px;
  background:var(--glass);
  backdrop-filter:blur(28px);
  border:1px solid var(--glassBorder);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.tabs h2{
  margin:0 0 12px;
  font-size:26px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  border-radius:16px;
  padding:14px;
  background:rgba(255,255,255,.05);
  text-align:center;
}

.stat strong{
  font-size:26px;
  display:block;
}

/* ===== Bottom Bar ===== */

.bottom{
  position:fixed;
  bottom:10px;
  left:0;
  right:0;
}

.bottom-inner{
  margin:auto;
  width:min(430px,100%);
  padding:10px;
  border-radius:26px;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(30px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav{
  text-align:center;
  font-size:11px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="btn">←</div>
    <div class="btn">☾</div>
  </div>

  <div class="title">POS</div>

  <div class="grid">
    <div class="card">
      <h2>Cigars</h2>
      <div class="arrow">›</div>
    </div>

    <div class="card">
      <h2>Other Products</h2>
      <div class="arrow">›</div>
    </div>
  </div>

  <div class="tabs">
    <h2>Open Tabs</h2>

    <div class="stats">
      <div class="stat">
        Today
        <strong>0</strong>
      </div>
      <div class="stat">
        Orders
        <strong>0</strong>
      </div>
    </div>

    <div class="arrow">›</div>
  </div>

</div>

<div class="bottom">
  <div class="bottom-inner">
    <div class="nav">Search</div>
    <div class="nav">Home</div>
    <div class="nav">Favorites</div>
    <div class="nav">Cart</div>
  </div>
</div>

</body>
</html>
