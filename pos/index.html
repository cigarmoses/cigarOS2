<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CigarOS • POS</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 18px 16px 8px;
      font-weight: 700;
      font-size: 1.6rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
      padding: 0 16px 70px;
    }
    .tile {
      background: var(--card);
      border-radius: 22px;
      padding: 16px 14px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 30px rgba(15,26,44,.04);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #0f1a2c;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .tile-title {
      font-weight: 700;
      font-size: 1rem;
    }
    .tile-sub {
      font-size: .75rem;
      color: rgba(15,26,44,.55);
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: #0f1a2c;
    }
  </style>
</head>
<body>
  <header>CigarOS POS</header>

  <div class="grid">
    <!-- Cigars -->
    <a href="/pos/cigars/" class="tile">
      <div class="tile-icon">C</div>
      <div class="tile-title">Cigars</div>
      <div class="tile-sub">Browse brands, lines, vitolas</div>
    </a>

    <!-- Accessories -->
    <a href="/pos/accessories/" class="tile">
      <div class="tile-icon">A</div>
      <div class="tile-title">Accessories</div>
      <div class="tile-sub">Cutters, lighters, cases</div>
    </a>

    <!-- Ashtrays -->
    <a href="/pos/ashtrays/" class="tile">
      <div class="tile-icon">As</div>
      <div class="tile-title">Ashtrays</div>
      <div class="tile-sub">Table, lounge, outdoor</div>
    </a>

    <!-- Food & Bevs -->
    <a href="/pos/foodandbevs/" class="tile">
      <div class="tile-icon">F</div>
      <div class="tile-title">Food & Bevs</div>
      <div class="tile-sub">Drinks, snacks</div>
    </a>

    <!-- Packs -->
    <a href="/pos/packs/" class="tile">
      <div class="tile-icon">P</div>
      <div class="tile-title">Packs</div>
      <div class="tile-sub">Bundles & promos</div>
    </a>

    <!-- Pipes -->
    <a href="/pos/pipes/" class="tile">
      <div class="tile-icon">Pi</div>
      <div class="tile-title">Pipes</div>
      <div class="tile-sub">Tobacco & accessories</div>
    </a>
  </div>

  <footer></footer>
</body>
</html>
