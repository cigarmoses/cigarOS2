<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS · Categories</title>
  <link rel="stylesheet" href="/style.css?v=11" />
  <link rel="stylesheet" href="/pos/pos.css?v=11" />
  <link rel="icon" href="/img/icons/pos.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#edf1f5" />
  <style>
    .pos-topbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:8px 12px;background:rgba(237,241,245,.9);backdrop-filter:blur(6px)}
    .pos-back{width:36px;height:36px;display:grid;place-items:center;text-decoration:none;color:#6b7280;font-size:20px;background:#e9eef5;border-radius:10px}
    .pos-title{margin:0;text-align:center;font-size:28px;letter-spacing:.5px;font-weight:900;color:#0f172a}
    .pos-spacer{display:block;width:36px;height:36px}
    .pos-cats{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:18px;justify-items:center;padding:14px}
    .cat-tile{width:100%;max-width:280px;aspect-ratio:1.25/1;background:#fff;border-radius:22px;box-shadow:8px 8px 20px #cfd6df,-8px -8px 20px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#111827;transition:transform .15s,box-shadow .15s;padding:6px 10px}
    .cat-tile:hover{transform:translateY(-2px);box-shadow:6px 6px 18px #cfd6df,-6px -6px 18px #fff}
    .cat-tile img{width:54px;height:54px;object-fit:contain;margin-bottom:10px}
    .cat-tile span{font-size:20px;font-weight:700;text-align:center}
    @media (max-width:380px){.pos-title{font-size:24px}.cat-tile span{font-size:18px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="pos-topbar">
      <a href="/" class="pos-back" aria-label="Home">←</a>
      <h1 class="pos-title">POS</h1>
      <span class="pos-spacer" aria-hidden="true"></span>
    </header>

    <section class="module-content pos-cats">
      <!-- 1) Accessories -->
      <a class="cat-tile" href="/pos/accessories/">
        <img src="/img/icons/categories/accessories.svg" onerror="this.src='/img/icons/pos.svg'" alt="Accessories" />
        <span>Accessories</span>
      </a>

      <!-- 2) Ashtrays -->
      <a class="cat-tile" href="/pos/ashtrays/">
        <img src="/img/icons/categories/ashtrays.svg" onerror="this.src='/img/icons/pos.svg'" alt="Ashtrays" />
        <span>Ashtrays</span>
      </a>

      <!-- 3) Cigars -->
      <a class="cat-tile" href="/pos/cigars/">
        <img src="/img/icons/categories/cigars.svg" onerror="this.src='/img/icons/pos.svg'" alt="Cigars" />
        <span>Cigars</span>
      </a>

      <!-- 4) Cigarsold -->
      <a class="cat-tile" href="/pos/cigarsold/">
        <img src="/img/icons/categories/cigarsold.svg" onerror="this.src='/img/icons/pos.svg'" alt="Cigarsold" />
        <span>Cigarsold</span>
      </a>

      <!-- 5) Cutters -->
      <a class="cat-tile" href="/pos/cutters/">
        <img src="/img/icons/categories/cutters.svg" onerror="this.src='/img/icons/pos.svg'" alt="Cutters" />
        <span>Cutters</span>
      </a>

      <!-- 6) Food & Bevs -->
      <a class="cat-tile" href="/foodandbevs/">
        <img src="/img/icons/categories/foodandbevs.svg" onerror="this.src='/img/icons/pos.svg'" alt="Food and Bevs" />
        <span>Food and Bevs</span>
      </a>

      <!-- 7) Lighters -->
      <a class="cat-tile" href="/pos/lighters/">
        <img src="/img/icons/categories/lighters.svg" onerror="this.src='/img/icons/pos.svg'" alt="Lighters" />
        <span>Lighters</span>
      </a>

      <!-- 8) Packs -->
      <a class="cat-tile" href="/pos/packs/">
        <img src="/img/icons/categories/packs.svg" onerror="this.src='/img/icons/pos.svg'" alt="Packs" />
        <span>Packs</span>
      </a>

      <!-- 9) Pipes -->
      <a class="cat-tile" href="/pos/pipes/">
        <img src="/img/icons/categories/pipes.svg" onerror="this.src='/img/icons/pos.svg'" alt="Pipes" />
        <span>Pipes</span>
      </a>
    </section>
  </main>
</body>
</html>
