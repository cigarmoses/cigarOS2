<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS</title>

  <link rel="stylesheet" href="/css/type.css?v=25" />
  <link rel="stylesheet" href="/pos/pos.css?v=25" />

  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg:#071b33;
      --bg2:#0b2a4f;

      --glass:rgba(255,255,255,.09);
      --glass2:rgba(255,255,255,.07);
      --glass3:rgba(255,255,255,.05);

      --stroke:rgba(255,255,255,.12);
      --stroke-soft:rgba(255,255,255,.08);

      --text:#ffffff;
      --muted:rgba(255,255,255,.70);
      --muted2:rgba(255,255,255,.52);

      --shadow:0 22px 60px rgba(0,0,0,.34);
      --shadow-soft:0 12px 28px rgba(0,0,0,.22);

      --glow:rgba(59,130,246,.22);
      --danger:#ff453a;
    }

    html[data-theme="light"]{
      --bg:#eef3fb;
      --bg2:#f7f9fd;

      --glass:rgba(255,255,255,.70);
      --glass2:rgba(255,255,255,.58);
      --glass3:rgba(255,255,255,.42);

      --stroke:rgba(15,23,42,.08);
      --stroke-soft:rgba(15,23,42,.05);

      --text:#0b1220;
      --muted:rgba(11,18,32,.62);
      --muted2:rgba(11,18,32,.46);

      --shadow:0 18px 40px rgba(15,23,42,.10);
      --shadow-soft:0 10px 22px rgba(15,23,42,.08);

      --glow:rgba(118,157,255,.12);
      --danger:#ff3b30;
    }

    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }

    body{
      margin:0;
      color:var(--text);
      font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:
        radial-gradient(1200px 700px at 15% 5%, rgba(72,117,210,.30), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(0,185,255,.10), transparent 55%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      background-attachment:fixed;
    }

    html[data-theme="light"] body{
      background:
        radial-gradient(1200px 700px at 18% 0%, rgba(80,132,255,.10), transparent 58%),
        radial-gradient(900px 620px at 100% 10%, rgba(61,201,255,.05), transparent 54%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      background-attachment:fixed;
    }

    .pos-page{
      width:min(430px, calc(100% - 22px));
      margin:0 auto;
      padding:calc(10px + var(--safe-top)) 0 calc(120px + var(--safe-bottom));
      min-height:100dvh;
    }

    .glass-surface{
      position:relative;
      overflow:hidden;
      backdrop-filter:blur(24px) saturate(1.14);
      -webkit-backdrop-filter:blur(24px) saturate(1.14);
    }

    .glass-surface::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 0 1px var(--stroke-soft);
    }

    .pos-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .pos-back,
    .pos-theme-btn,
    .pos-cart-btn{
      position:relative;
      border:0;
      padding:0;
      display:grid;
      place-items:center;
      color:var(--text);
      background:var(--glass3);
      box-shadow:var(--shadow-soft);
      -webkit-tap-highlight-color:transparent;
      text-decoration:none;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .pos-back:active,
    .pos-theme-btn:active,
    .pos-cart-btn:active{
      transform:scale(.96);
    }

    .pos-back{
      width:42px;
      height:42px;
      border-radius:999px;
    }

    .pos-back svg{
      width:22px;
      height:22px;
      display:block;
    }

    .pos-topbar-spacer{
      flex:1 1 auto;
    }

    .pos-theme-btn{
      width:52px;
      height:32px;
      border-radius:999px;
    }

    .pos-theme-btn .track{
      position:absolute;
      inset:0;
      border-radius:999px;
    }

    .pos-theme-btn .knob{
  position:absolute;
  top:3px;
  left:3px;
  width:26px;
  height:26px;
  border-radius:999px;
  background:#fff;
  color:#0b1323;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
  transition:transform .25s ease;
  display:grid;
  place-items:center;
}

.pos-theme-btn .icon-sun,
.pos-theme-btn .icon-moon{
  position:absolute;
  width:16px;
  height:16px;
  object-fit:contain;
}

/* Moon styling */
.pos-theme-btn .icon-moon{
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
}

/* DARK MODE */
html[data-theme="dark"] .pos-theme-btn .icon-sun{
  display:none;
}

html[data-theme="dark"] .pos-theme-btn .icon-moon{
  display:block;
}

html[data-theme="dark"] .pos-theme-btn .knob{
  transform:translateX(20px);
}
    
    .pos-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
      padding-top:8px;
    }

    .pos-title{
      margin:0;
      font:900 56px/.90 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.065em;
      color:var(--text);
      transform:translateZ(0);
    }

    .pos-cart-btn{
      width:46px;
      height:46px;
      border-radius:999px;
      margin-top:6px;
    }

    .pos-cart-btn img{
      width:24px;
      height:24px;
      display:block;
      object-fit:contain;
    }

    .pos-cart-badge{
      position:absolute;
      top:-2px;
      right:-1px;
      min-width:18px;
      height:18px;
      padding:0 5px;
      border-radius:999px;
      background:var(--danger);
      color:#fff;
      font:800 11px/18px "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      text-align:center;
      box-shadow:0 8px 18px rgba(255,69,58,.30);
    }

    .pos-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:14px;
      align-items:stretch;
    }

    .pos-card{
      position:relative;
      display:flex;
      flex-direction:column;
      min-height:188px;
      padding:18px 16px 16px;
      border-radius:30px;
      background:var(--glass2);
      box-shadow:var(--shadow);
      text-decoration:none;
      color:var(--text);
      overflow:hidden;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      isolation:isolate;
    }

    .pos-card:hover{
      transform:translateY(-1px);
    }

    .pos-card:active{
      transform:scale(.985);
    }

    .pos-card::after{
      content:"";
      position:absolute;
      right:-24px;
      bottom:-24px;
      width:120px;
      height:120px;
      border-radius:50%;
      background:radial-gradient(circle, var(--glow) 0%, transparent 68%);
      pointer-events:none;
      z-index:0;
    }

    .pos-card > *{
      position:relative;
      z-index:1;
    }

    .pos-card-icon{
      width:62px;
      height:62px;
      display:grid;
      place-items:center;
      margin-top:18px;
      margin-bottom:22px;
      filter:drop-shadow(0 8px 20px rgba(0,0,0,.18));
    }

    .pos-card-icon img{
      width:58px;
      height:58px;
      object-fit:contain;
      display:block;
    }

    .pos-card-icon .icon-dark,
    .pos-card-icon .icon-light{
      display:none;
    }


    
    html[data-theme="dark"] .pos-card-icon .icon-dark{
      display:block !important;
    }

    html[data-theme="light"] .pos-card-icon .icon-light{
      display:block !important;
    }

    .pos-card-title{
      font:900 22px/1.02 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.045em;
      color:var(--text);
      transform:translateZ(0);
    }

    .pos-card-arrow{
      margin-top:auto;
      padding-top:20px;
      display:flex;
      justify-content:flex-end;
      color:var(--muted2);
      font:900 22px/1 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    .pos-open-tabs{
      margin-top:16px;
      display:block;
      border-radius:32px;
      padding:18px 18px 16px;
      text-decoration:none;
      color:var(--text);
      background:var(--glass2);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      isolation:isolate;
    }

    .pos-open-tabs:hover{
      transform:translateY(-1px);
    }

    .pos-open-tabs:active{
      transform:scale(.992);
    }

    .pos-open-tabs::after{
      content:"";
      position:absolute;
      top:-30px;
      right:-16px;
      width:170px;
      height:170px;
      border-radius:50%;
      background:radial-gradient(circle, var(--glow) 0%, transparent 68%);
      pointer-events:none;
      z-index:0;
    }

    .pos-open-tabs > *{
      position:relative;
      z-index:1;
    }

    .pos-open-tabs-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:16px;
    }

    .pos-open-tabs-title{
      font:900 28px/1 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.05em;
      color:var(--text);
    }

    .pos-open-tabs-icon{
      width:54px;
      height:54px;
      flex:0 0 54px;
      border-radius:18px;
      background:rgba(255,255,255,.06);
      display:grid;
      place-items:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
    }

    .pos-open-tabs-icon img{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
    }

    .pos-open-tabs-meta{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
      margin-top:0;
    }

    .pos-open-tabs-stat{
      min-height:92px;
      border-radius:22px;
      background:rgba(255,255,255,.06);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
      padding:14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .pos-open-tabs-stat-label{
      font:700 12px/1 "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:0;
      text-transform:none;
      color:var(--text);
      opacity:.92;
    }

    .pos-open-tabs-stat-value{
      margin-top:8px;
      font:900 28px/.92 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      letter-spacing:-.05em;
      color:var(--text);
    }

    .pos-open-tabs-arrow{
      margin-top:14px;
      display:flex;
      justify-content:flex-end;
      color:var(--muted2);
      font:900 22px/1 "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    .pos-bottom-bar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:1000;
      padding:0 12px calc(10px + env(safe-area-inset-bottom));
      pointer-events:none;
    }

    .pos-bottom-bar-inner{
      width:min(430px, 100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:6px;
      padding:8px;
      border-radius:32px;
      background:rgba(6,14,28,.52);
      box-shadow:0 18px 44px rgba(0,0,0,.26);
      pointer-events:auto;
      backdrop-filter:blur(26px) saturate(1.14);
      -webkit-backdrop-filter:blur(26px) saturate(1.14);
      position:relative;
      overflow:hidden;
    }

    .pos-bottom-bar-inner::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 0 0 1px rgba(255,255,255,.08);
    }

    html[data-theme="light"] .pos-bottom-bar-inner{
      background:rgba(255,255,255,.68);
      box-shadow:0 16px 36px rgba(15,23,42,.08);
    }

    .pos-bottom-btn{
      min-height:56px;
      border-radius:22px;
      border:0;
      background:transparent;
      text-decoration:none;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      font-size:10px;
      font-weight:800;
      letter-spacing:.045em;
      text-transform:uppercase;
      line-height:1;
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
      transition:transform .16s ease, background .16s ease;
      cursor:pointer;
      position:relative;
      -webkit-tap-highlight-color:transparent;
    }

    .pos-bottom-btn span{
      font-family:inherit;
      font-size:inherit;
      font-weight:inherit;
      letter-spacing:inherit;
      text-transform:inherit;
      line-height:1;
    }

    .pos-bottom-btn:hover{
      background:rgba(255,255,255,.05);
    }

    .pos-bottom-btn:active{
      transform:scale(.965);
    }

    html[data-theme="light"] .pos-bottom-btn:hover{
      background:rgba(15,23,42,.04);
    }

    .pos-bottom-btn img{
      width:22px;
      height:22px;
      display:block;
      object-fit:contain;
    }

    .pos-bottom-badge{
      position:absolute;
      top:5px;
      right:10px;
      min-width:18px;
      height:18px;
      padding:0 5px;
      border-radius:999px;
      background:var(--danger);
      color:#fff;
      display:grid;
      place-items:center;
      font-size:10px;
      line-height:1;
      font-weight:800;
      box-shadow:0 6px 14px rgba(255,59,48,.28);
    }

    @media (max-width:390px){
      .pos-page{
        width:calc(100% - 18px);
        padding-bottom:calc(116px + var(--safe-bottom));
      }

      .pos-title{
        font-size:48px;
      }

      .pos-grid{
        gap:12px;
      }

      .pos-card{
        min-height:180px;
        padding:16px 14px 14px;
        border-radius:28px;
      }

      .pos-card-icon{
        margin-top:16px;
        margin-bottom:20px;
      }

      .pos-open-tabs{
        border-radius:28px;
        padding:16px;
      }

      .pos-open-tabs-title{
        font-size:26px;
      }

      .pos-open-tabs-stat{
        min-height:88px;
      }

      .pos-back,
      .pos-cart-btn{
        width:40px;
        height:40px;
      }

      .pos-theme-btn{
        width:50px;
        height:30px;
      }

      .pos-theme-btn .knob{
        width:24px;
        height:24px;
      }

      html[data-theme="dark"] .pos-theme-btn .knob{
        transform:translateX(20px);
      }
    }

    .pos-head{
  justify-content:flex-start !important;
}

.pos-open-tabs-head{
  justify-content:flex-start !important;
}

.pos-open-tabs-icon,
.pos-cart-btn{
  display:none !important;
}
  </style>
</head>

<body class="pos-home">
  <main class="pos-page">
    <header class="pos-topbar">
      <button type="button" class="pos-back glass-surface" aria-label="Back" onclick="history.length > 1 ? history.back() : window.location.href='/'">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>

      <div class="pos-topbar-spacer" aria-hidden="true"></div>

      <button id="theme-toggle" class="pos-theme-btn glass-surface" type="button" aria-label="Toggle theme" aria-pressed="true">
        <span class="track" aria-hidden="true"></span>
        <span class="knob" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23 5.46 5.46"></path>
            </g>
          </svg>
          <img class="icon-moon" src="/uxui/moon.svg" alt="" />
        </span>
      </button>
    </header>

    <section class="pos-head">
  <h1 class="pos-title">POS</h1>
</section>

    <section class="pos-grid">
      <a href="/pos/cigars/" class="pos-card glass-surface">
        <div class="pos-card-title">Cigars</div>
        <div class="pos-card-icon">
          <img class="icon-dark" src="/uxui/darkmode/darkmodecigars.png" alt="">
          <img class="icon-light" src="/uxui/lightmode/lightmodecigars.png" alt="">
        </div>
        <div class="pos-card-arrow">›</div>
      </a>

      <a href="/pos/products/" class="pos-card glass-surface">
        <div class="pos-card-title">Other Products</div>
        <div class="pos-card-icon">
          <img class="icon-dark" src="/uxui/darkmode/darkmodeotherproducts.png" alt="">
          <img class="icon-light" src="/uxui/lightmode/lightmodeotherproducts.png" alt="">
        </div>
        <div class="pos-card-arrow">›</div>
      </a>
    </section>

    <a href="/pos/opentabs/" class="pos-open-tabs glass-surface">
      <div class="pos-open-tabs-head">
        <div class="pos-open-tabs-title">Open Tabs</div>

        <div class="pos-open-tabs-icon" aria-hidden="true">
          <img src="/uxui/" alt="uxui/opentabs.svg">
        </div>
      </div>

      <div class="pos-open-tabs-meta">
        <div class="pos-open-tabs-stat">
          <div class="pos-open-tabs-stat-label">Today</div>
          <div class="pos-open-tabs-stat-value" id="openTabsTodayCount">0</div>
        </div>

        <div class="pos-open-tabs-stat">
          <div class="pos-open-tabs-stat-label">Orders</div>
          <div class="pos-open-tabs-stat-value" id="openTabsOrdersCount">0</div>
        </div>
      </div>

      <div class="pos-open-tabs-arrow">›</div>
    </a>
  </main>

  <nav class="pos-bottom-bar" aria-label="Primary">
    <div class="pos-bottom-bar-inner">
      <button type="button" class="pos-bottom-btn" id="posBottomSearchBtn" aria-label="Search">
        <img src="/uxui/bottombar/search.svg" alt="">
        <span>Search</span>
      </button>

      <a class="pos-bottom-btn" href="/" aria-label="Home">
        <img src="/uxui/bottombar/home.svg" alt="">
        <span>Home</span>
      </a>

      <a class="pos-bottom-btn" href="/pos/favorites/" aria-label="Favorites">
        <img src="/uxui/bottombar/favorites.svg" alt="">
        <span>Favorites</span>
      </a>

      <a class="pos-bottom-btn" href="/pos/invoice/" aria-label="Cart">
        <img src="/uxui/bottombar/cart.svg" alt="">
        <span>Cart</span>
        <span class="pos-bottom-badge" data-cart-badge hidden>0</span>
      </a>
    </div>
  </nav>

  <script src="/pos/cart.js?v=25" defer></script>
  <script src="/pos/pos.js?v=25" defer></script>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("theme") || "dark";

      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (toggle) toggle.setAttribute("aria-pressed", String(next === "dark"));
      }

      applyTheme(saved);

      toggle?.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") || "dark";
        applyTheme(current === "dark" ? "light" : "dark");
      });

      document.getElementById("posBottomSearchBtn")?.addEventListener("click", () => {
        if (typeof window.openGlobalSearch === "function") {
          window.openGlobalSearch();
        }
      });
    })();
  </script>
</body>
</html>
