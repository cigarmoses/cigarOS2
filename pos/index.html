<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CigarOS • POS Brands</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #eaf2f6;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      font-weight: 700;
      color: #0f1a2c;
      margin-top: 24px;
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 28px;
      padding: 20px;
      justify-items: center;
    }

    .brand-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #0f1a2c;
    }

    /* ---- ICON CONTAINER ---- */
    .brand-icon {
      width: 150px;
      height: 150px;
      background-color: #ffffff;
      border-radius: 124px;       /* ✅ consistent rounded corners */
      overflow: hidden;           /* ✅ ensures clean crop */
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;          /* ✅ prevents stretching or cutoff */
      border-radius: 124px;       /* ✅ double-protection for rounding */
    }

    .brand-card:hover .brand-icon {
      transform: scale(1.05);
    }

    /* ---- BRAND NAME ---- */
    .brand-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 10px;
      text-align: center;
      color: #0f1a2c;
    }
  </style>
</head>

<body>
  <h1>Cigar Brands</h1>

  <div class="brand-grid">
    <!-- Example Brand Tile -->
    <a href="/pos/cigars/brand.html?brand=Davidoff" class="brand-card">
      <div class="brand-icon">
        <img src="/img/icons/brands/davidoff.svg" alt="Davidoff Logo" />
      </div>
      <div class="brand-name">Davidoff</div>
    </a>

    <a href="/pos/cigars/brand.html?brand=Cuba%20Aliados" class="brand-card">
      <div class="brand-icon">
        <img src="/img/icons/brands/cubaaliados.svg" alt="Cuba Aliados Logo" />
      </div>
      <div class="brand-name">Cuba Aliados</div>
    </a>

    <!-- Repeat for all brands dynamically or manually as needed -->
  </div>
</body>
</html>
