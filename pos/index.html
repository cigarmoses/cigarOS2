<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CigarOS POS</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    /* back button */
    .pos-topbar {
      padding: 14px 16px 4px;
    }
    .pos-back {
      font-size: 16px;
      color: var(--ink);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      background: #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
    }

    header {
      padding: 10px 16px 10px 16px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      margin: 0;
    }
    .grid {
      padding: 10px 16px 90px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
      gap: 16px;
    }
    .tile {
      background: var(--card);
      border-radius: 26px;
      padding: 18px 16px 20px 16px;
      box-shadow: 0 10px 30px rgba(15,26,44,0.04);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tile-icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tile-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tile-title {
      font-size: 20px;
      font-weight: 700;
    }
    .tile-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.25;
    }

    #receipt-pill {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #0f1a2c;
      box-shadow: 0 10px 30px rgba(15,26,44,0.25);
      color: #ffffff;
      z-index: 10;
      font-size: 14px;
      font-weight: 600;
    }
    #receipt-pill img {
      width: 28px;
      height: 28px;
    }
    #receipt-count {
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #d72828;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ✅ Back Button Goes Here -->
  <div class="pos-topbar">
    <a class="pos-back" onclick="history.back()">← Back</a>
  </div>

  <header>
    <h1>CigarOS POS</h1>
  </header>

  <main class="grid">
    <!-- tiles… unchanged -->
  </main>

  <div id="receipt-pill">
    <img src="/uxui/receipt-icon.svg" alt="Receipt" id="receipt-icon"/>
    <span id="receipt-count">0</span>
  </div>

</body>
</html>
