<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CigarOS POS</title>
  <style>
    :root {
      --bg: #e0ecf2;
      --ink: #0f1a2c;
      --card: #ffffff;
      --nav: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      padding-bottom: 68px; /* space for bottom bar */
    }
    header {
      padding: 20px 16px 6px;
      font-size: 1.9rem;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 16px;
      padding: 10px 16px 20px;
    }
    .tile {
      background: var(--card);
      border-radius: 22px;
      padding: 16px 14px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 16px 35px rgba(9, 16, 26, 0.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tile-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: #0f1a2c;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .tile-title {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .tile-sub {
      font-size: .78rem;
      color: rgba(15,26,44,0.5);
    }
    /* bottom nav like your other screens */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: var(--nav);
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .bottom-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.02);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>CigarOS POS</header>

  <div class="grid">
    <a href="/pos/cigars/" class="tile">
      <div class="tile-icon">C</div>
      <div class="tile-title">Cigars</div>
      <div class="tile-sub">Browse brands, lines, vitolas</div>
    </a>
    <a href="/pos/accessories/" class="tile">
      <div class="tile-icon">A</div>
      <div class="tile-title">Accessories</div>
      <div class="tile-sub">Cutters, lighters, cases</div>
    </a>
    <a href="/pos/ashtrays/" class="tile">
      <div class="tile-icon">As</div>
      <div class="tile-title">Ashtrays</div>
      <div class="tile-sub">Table, lounge, outdoor</div>
    </a>
    <a href="/pos/foodandbevs/" class="tile">
      <div class="tile-icon">F</div>
      <div class="tile-title">Food & Bevs</div>
      <div class="tile-sub">Drinks, snacks</div>
    </a>
    <a href="/pos/packs/" class="tile">
      <div class="tile-icon">P</div>
      <div class="tile-title">Packs</div>
      <div class="tile-sub">Bundles & promos</div>
    </a>
    <a href="/pos/pipes/" class="tile">
      <div class="tile-icon">Pi</div>
      <div class="tile-title">Pipes</div>
      <div class="tile-sub">Tobacco & accessories</div>
    </a>
  </div>

  <div class="bottom-nav">
    <div class="bottom-btn">←</div>
    <div class="bottom-btn">→</div>
    <div class="bottom-btn">＋</div>
    <div class="bottom-btn">☺</div>
    <div class="bottom-btn">⋯</div>
  </div>
</body>
</html>
