<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POS</title>
  <link rel="stylesheet" href="/css/system.css" />
  <style>
    .page { background:#eaf1f5; min-height:100dvh; }
    .header{display:flex;align-items:center;gap:12px;padding:16px}
    .header a{color:#203147;font-weight:800;text-decoration:none}
    .title{padding:0 16px 8px;font:900 32px/1.05 system-ui;color:#203147}

    .grid--cats{
      display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px; padding:12px 16px 96px;
    }
    .tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
    .tile__btn{width:74px;height:74px;border-radius:18px;box-shadow:0 8px 24px rgba(9,30,66,.08);background:#fff;border:none;padding:0}
    .tile__btn img{width:74px;height:74px;border-radius:18px;display:block}
    .tile__label{font:700 14px/1.1 system-ui;color:#142033}
  </style>
</head>
<body class="page">
  <div class="header">
    <a href="/">←</a><span style="font-weight:800;color:#5b738d">HOME</span>
  </div>
  <h1 class="title">POS</h1>

  <main id="grid" class="grid--cats" aria-live="polite"></main>

  <script>
    const CATS = [
      { name:"Pipes", slug:"pipes", href:"/pipes/" },
      { name:"Cigars", slug:"cigars", href:"/cigars/" },
      { name:"Food & Bevs", slug:"foodandbevs", href:"/foodandbevs/" },
      { name:"Accessories", slug:"accessories", href:"/accessories/" },
      { name:"Packs", slug:"packs", href:"/packs/" },
      { name:"Ashtrays", slug:"ashtrays", href:"/ashtrays/" },
    ];
    const grid = document.getElementById('grid');
    const frag = document.createDocumentFragment();

    CATS.forEach(c=>{
      const wrap=document.createElement('div'); wrap.className='tile';
      const btn=document.createElement('a'); btn.className='tile__btn'; btn.href=c.href; btn.setAttribute('aria-label',c.name);
      const img=document.createElement('img'); img.alt=c.name; img.src=`/img/icons/categories/${c.slug}.svg`;
      btn.appendChild(img);

      const label=document.createElement('div'); label.className='tile__label'; label.textContent=c.name;
      wrap.append(btn,label); frag.appendChild(wrap);
    });

    grid.appendChild(frag);
  </script>
</body>
</html>
