<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">
  <!-- Top bar -->
  <header class="brand-topbar">
    <button class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <img id="brand-icon" class="brand-icon" alt="Brand icon" />
  </header>

  <main class="brand-main">
    <h1 class="brand-title" id="brand-title">Brand</h1>

    <!-- Search -->
    <section class="brand-search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="brand-search" type="search" placeholder="Search..." autocomplete="off" />
      </div>
    </section>

    <!-- Controls -->
    <section class="brand-controls" aria-label="Brand controls">
      <button class="pill-btn" id="btn-filters" type="button">
        <span class="pill-ico" aria-hidden="true">≡</span>
        Filters
      </button>

      <!-- ✅ Bands button (no emoji, no default highlight) -->
      <button class="pill-btn" id="btn-bandart" type="button">
        Bands
      </button>

      <!-- ✅ Padron-only toggles (JS hides for non-Padron) -->
      <button class="pill-toggle" id="tgl-maduro" type="button" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span>
        Maduro
      </button>

      <button class="pill-toggle" id="tgl-natural" type="button" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span>
        Natural
      </button>
    </section>

    <!-- List -->
    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>
  </main>

  <!-- Filters modal (placeholder for now) -->
  <div class="modal" id="modal-filters" aria-hidden="true">
    <div class="modal-scrim" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Filters">
      <div class="modal-head">
        <div class="modal-title">Filters</div>
        <button class="modal-x" type="button" data-close="1" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-empty">No additional filters yet.</div>
      </div>
      <div class="modal-foot">
        <button class="modal-btn ghost" type="button" data-close="1">Close</button>
        <button class="modal-btn primary" type="button" data-close="1">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Bands modal -->
  <div class="modal" id="modal-bandart" aria-hidden="true">
    <div class="modal-scrim" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Bands">
      <div class="modal-head">
        <div class="modal-title">Bands</div>
        <button class="modal-x" type="button" data-close="1" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="modal-note">Pick</div>

        <div class="bandart-list">
          <label class="bandart-item">
            <input type="radio" name="bandart" value="1964" />
            1964 Anniversary Series
          </label>

          <label class="bandart-item">
            <input type="radio" name="bandart" value="1926" />
            1926 Serie
          </label>

          <label class="bandart-item">
            <input type="radio" name="bandart" value="damaso" />
            Damaso
          </label>
        </div>
      </div>

      <div class="modal-foot">
        <button class="modal-btn ghost" id="bandart-clear" type="button">Clear</button>
        <button class="modal-btn primary" id="bandart-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ✅ Script should be inside body, right before closing body -->
  <script src="/pos/cigars/brand.js"></script>
</body>
</html>
