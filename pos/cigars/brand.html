<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • CigarOS 2</title>

  <style>
    /* ========== EXISTING PAGE STYLES (keep yours above if needed) ========== */
    body {
      margin: 0;
      background: #eaf2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f1a2c;
      min-height: 100vh;
    }

    .header {
      padding: 16px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .cigar-row {
      background: #fff;
      border-radius: 20px;
      padding: 14px 16px;
      margin: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15,26,44,.05);
    }

    .cigar-row:hover {
      background: #f7faff;
    }

    /* ========== NEW CIGAR DETAIL POPUP STYLING ========== */
    .cigar-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.12);
      z-index: 999;
      display: none;
    }

    .cigar-detail-card {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      margin: 0 12px;
      background: #fff;
      border-radius: 32px 0 24px 24px;
      box-shadow: 0 14px 30px rgba(8,16,24,0.12);
      padding: 16px 16px 14px;
    }

    .cigar-detail-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      position: relative;
    }

    .cd-brand {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.1;
    }

    .cd-name {
      font-weight: 700;
      font-size: .95rem;
      line-height: 1.1;
      margin-top: 3px;
    }

    .cd-close {
      border: 0;
      background: transparent;
      color: #0057b8;
      font-size: 1.4rem;
      font-weight: 700;
      position: absolute;
      top: -5px;
      right: 6px;
      cursor: pointer;
    }

    .cd-brand-icon {
      position: absolute;
      top: -8px;
      right: 36px;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: #3a2f28;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .cd-brand-icon img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    .cigar-detail-body {
      display: flex;
      gap: 14px;
      margin-top: 14px;
    }

    .cd-photo {
      width: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cd-photo img {
      max-width: 110px;
      height: auto;
    }

    .cd-info {
      flex: 1;
      min-width: 0;
    }

    .cd-line {
      font-size: .8rem;
      margin-bottom: 4px;
    }

    .cd-field {
      font-size: .78rem;
      margin-bottom: 3px;
    }

    @media (max-width: 520px) {
      .cigar-detail-body {
        gap: 10px;
      }
      .cd-photo {
        width: 95px;
      }
      .cigar-detail-card {
        top: 64px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    ← Cigars
  </div>

  <!-- ========== EXAMPLE CIGAR ROW ========== -->
  <div class="cigar-row" onclick="openCigarDetail({
      name: 'Flying Pig',
      vitola: 'Perfecto',
      wrapperShade: 'USA',
      origin: 'Nicaragua',
      strength: 'Full',
      price: '13.99',
      length: '4.00',
      ring: '56'
  })">
    <div>
      <div style="font-weight:700;">Pappy Van Winkle Flying Pig</div>
      <div style="font-size:.8rem;color:#6e7b8f;">Perfecto</div>
    </div>
    <div style="font-weight:600;">$13.99</div>
  </div>

  <!-- ========== NEW CIGAR DETAIL POPUP ========== -->
  <div class="cigar-detail-overlay" id="cigarDetailOverlay">
    <div class="cigar-detail-card" id="cigarDetailCard">
      <div class="cigar-detail-top">
        <div>
          <div class="cd-brand" id="cdBrand">Brand</div>
          <div class="cd-name" id="cdName">Cigar Name</div>
        </div>
        <button class="cd-close" onclick="closeCigarDetail()">×</button>
        <div class="cd-brand-icon">
          <img id="cdBrandIcon" src="" alt="brand icon" onerror="this.style.opacity='0'">
        </div>
      </div>

      <div class="cigar-detail-body">
        <div class="cd-photo">
          <img id="cdPhoto" src="" alt="cigar photo" onerror="this.style.opacity='0'">
        </div>
        <div class="cd-info">
          <div class="cd-line" id="cdMsrp">MSRP —</div>
          <div class="cd-line" id="cdSize">—</div>
          <div class="cd-line" id="cdVitola">—</div>

          <div class="cd-field" id="cdWrapperShade">Wrapper Shade:</div>
          <div class="cd-field" id="cdShape">Shape:</div>
          <div class="cd-field" id="cdWrapper">Wrapper:</div>
          <div class="cd-field" id="cdBinder">Binder:</div>
          <div class="cd-field" id="cdFiller">Filler:</div>
          <div class="cd-field" id="cdOrigin">Origin:</div>
          <div class="cd-field" id="cdStrength">Strength:</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== NEW JAVASCRIPT FUNCTIONS ========== -->
  <script>
    function slugify(str) {
      return (str || "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]/g, "");
    }

    function openCigarDetail(cigarObj) {
      const url = new URL(window.location.href);
      const brandName = url.searchParams.get('brand') || 'Pappy Van Winkle';
      const cigarName = cigarObj?.name || '';
      const brandSlug = slugify(brandName);
      const cigarSlug = slugify(cigarName);
      const masterSlug = brandSlug + cigarSlug;

      // Text fields
      document.getElementById('cdBrand').textContent = brandName;
      document.getElementById('cdName').textContent = cigarName;
      document.getElementById('cdMsrp').textContent = cigarObj.price
        ? 'MSRP  ' + cigarObj.price
        : 'MSRP  —';
      document.getElementById('cdSize').textContent =
        cigarObj.length && cigarObj.ring
          ? cigarObj.length + '" x ' + cigarObj.ring
          : '';
      document.getElementById('cdVitola').textContent = cigarObj.vitola || '';

      // Details
      document.getElementById('cdWrapperShade').textContent =
        'Wrapper Shade: ' + (cigarObj.wrapperShade || '');
      document.getElementById('cdShape').textContent =
        'Shape: ' + (cigarObj.shape || '');
      document.getElementById('cdWrapper').textContent =
        'Wrapper: ' + (cigarObj.wrapper || '');
      document.getElementById('cdBinder').textContent =
        'Binder: ' + (cigarObj.binder || '');
      document.getElementById('cdFiller').textContent =
        'Filler: ' + (cigarObj.filler || '');
      document.getElementById('cdOrigin').textContent =
        'Origin: ' + (cigarObj.origin || '');
      document.getElementById('cdStrength').textContent =
        'Strength: ' + (cigarObj.strength || '');

      // Images
      document.getElementById('cdBrandIcon').src =
        '/img/icons/brands/' + brandSlug + '.svg';
      document.getElementById('cdPhoto').src =
        '/img/cigars/' + masterSlug + '.png';

      // Show popup
      document.getElementById('cigarDetailOverlay').style.display = 'block';
    }

    function closeCigarDetail() {
      document.getElementById('cigarDetailOverlay').style.display = 'none';
    }
  </script>
</body>
</html>
