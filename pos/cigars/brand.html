<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <!-- Global SF Pro + POS base styles -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />

  <!-- Brand styles -->
  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">

  <!-- Top bar -->
  <header class="brand-topbar">
    <button type="button" class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="brand-main">

    <!-- Brand header -->
    <section class="brand-title-row">
      <h1 class="brand-title" id="brand-title">Brand</h1>

      <!-- brand icon -->
      <div class="brand-icon" id="brand-icon" aria-hidden="true"></div>
    </section>

    <!-- Search -->
    <section class="brand-search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
    </section>

    <!-- Controls -->
    <section class="brand-controls" aria-label="Brand controls">
      <button class="pill-btn" id="btn-filters" type="button" aria-haspopup="dialog">Filters</button>
      <button class="pill-btn" id="btn-bands" type="button" aria-haspopup="dialog">Bands</button>

      <!-- Maduro / Natural toggle -->
      <div class="seg" id="wrapper-seg" data-state="all" role="group" aria-label="Wrapper toggle">
        <button class="seg-btn" id="seg-maduro" type="button" aria-pressed="false">Maduro</button>
        <button class="seg-dot" id="seg-switch" type="button" aria-label="Toggle Maduro/Natural"></button>
        <button class="seg-btn" id="seg-natural" type="button" aria-pressed="false">Natural</button>
      </div>
    </section>

    <!-- List -->
    <section class="brand-list" id="brand-list" aria-label="Cigars list">
      <!-- rows injected -->
    </section>

    <!-- Load / error -->
    <p class="brand-status" id="brand-status" hidden></p>
  </main>

  <!-- Receipt button (bottom-right) -->
  <button type="button" class="receipt-fab" id="receipt-open" aria-label="Receipt">
    <img src="/img/icons/receipt.png" alt="" />
    <span class="receipt-badge" id="receipt-count" hidden>0</span>
  </button>

  <!-- Bottom sheet backdrop -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

  <!-- Bottom sheet: Receipt -->
  <section class="sheet" id="sheet-receipt" role="dialog" aria-modal="true" aria-label="Receipt" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <h2>Receipt</h2>
      <button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body">
      <div class="receipt-items" id="receipt-items"></div>
    </div>

    <footer class="sheet-footer">
      <button class="sheet-btn" type="button" id="receipt-clear">Clear</button>
      <button class="sheet-btn primary" type="button" data-sheet-close>Close</button>
    </footer>
  </section>

  <!-- Centered popup: Bands (white card) -->
  <section class="sheet bands-sheet" id="sheet-bands" role="dialog" aria-modal="true" aria-label="Bands" hidden>
    <header class="sheet-header bands-header">
      <h2>Filter by band art</h2>
      <button class="sheet-x bands-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body bands-body">
      <!-- JS will inject band rows into this container -->
      <div class="bands-list" id="bands-options">
        <!-- Example static rows (optional, can be removed if fully dynamic):
        <label class="band-row" data-band-id="1964">
          <div class="band-art">
            <img src="/img/bands/padron-1964.png" alt="1964 Anniversary Series band" />
          </div>
          <div class="band-meta">
            <span class="band-name">1964 Anniversary Series</span>
            <input type="checkbox" class="band-check" />
          </div>
        </label>
        -->
      </div>
    </div>

    <footer class="sheet-footer bands-footer">
      <button class="sheet-btn primary bands-confirm" type="button" id="bands-confirm">Confirm</button>
    </footer>
  </section>

  <!-- Bottom sheet: Filters -->
  <section class="sheet" id="sheet-filters" role="dialog" aria-modal="true" aria-label="Filters" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <h2>Filters</h2>
      <button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body">
      <div class="chip-grid" id="filters-options"></div>
    </div>

    <footer class="sheet-footer">
      <button class="sheet-btn" type="button" data-sheet-close>Close</button>
      <button class="sheet-btn primary" type="button" id="filters-confirm">Confirm</button>
    </footer>
  </section>

  <!-- Cigar Detail Modal -->
  <section class="modal" id="cigar-modal" role="dialog" aria-modal="true" aria-label="Cigar details" hidden>
    <div class="modal-backdrop" id="cigar-modal-backdrop"></div>

    <div class="modal-card" role="document">
      <button class="modal-close" type="button" id="cigar-modal-close" aria-label="Close">×</button>

      <div class="modal-top">
        <div class="modal-title-wrap">
          <h2 class="modal-brand" id="modal-brand">Brand</h2>
          <p class="modal-line" id="modal-line">Line + Cigar</p>
        </div>
        <div class="modal-brand-icon" id="modal-brand-icon" aria-hidden="true"></div>
      </div>

      <div class="modal-main">
        <div class="modal-img">
          <img id="modal-cigar-img" alt="" />
        </div>

        <div class="modal-info">
          <div class="stat-row">
            <div class="stat">
              <div class="stat-label">RING</div>
              <div class="stat-value" id="modal-rg">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">LENGTH</div>
              <div class="stat-value" id="modal-len">—</div>
            </div>
          </div>

          <div class="stat-row small">
            <div class="stat">
              <div class="stat-label">STRENGTH</div>
              <div class="stat-value" id="modal-strength">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">VITOLA</div>
              <div class="stat-value" id="modal-vitola">—</div>
            </div>
          </div>

          <div class="stack">
            <div class="stack-label">WRAPPER</div>
            <div class="stack-value" id="modal-wrapper">—</div>
            <div class="stack-label">BINDER</div>
            <div class="stack-value" id="modal-binder">—</div>
            <div class="stack-label">FILLER</div>
            <div class="stack-value" id="modal-filler">—</div>
          </div>

          <div class="stack">
            <div class="stack-label">ORIGIN</div>
            <div class="stack-value" id="modal-origin">—</div>
          </div>

          <div class="stack">
            <div class="stack-label">WRAPPER SHADE</div>
            <div class="stack-value" id="modal-shade">—</div>
          </div>

          <div class="rank-row">
            <div class="rank" id="modal-rank1">#1</div>
            <div class="rank" id="modal-rank2">#2</div>
          </div>

          <div class="modal-actions">
            <button type="button" class="ghost-btn">FAVORITE</button>
            <button type="button" class="ghost-btn">COMPARE</button>
            <button type="button" class="ghost-btn">WISHLIST</button>
            <button type="button" class="ghost-btn">CONNECT</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/pos/cart.js"></script>
  <script src="/pos/cigars/brand.js"></script>
</body>
</html>
