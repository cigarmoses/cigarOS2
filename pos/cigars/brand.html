<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • Brand</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 20px;
    }

    .topbar {
      display:flex;
      align-items:center;
      gap:6px;
      padding:16px 16px 4px;
      font-weight:600;
    }
    .back-btn { display:flex; gap:4px; align-items:center; cursor:pointer; }
    .page-wrap { padding:0 16px 20px; }
    .brand-title-row {
      display:flex; align-items:center; justify-content:space-between;
      margin:6px 0 12px;
    }
    .brand-title { font-size:2rem; font-weight:700; }
    .fav-star {
      width:32px;height:32px;border-radius:999px;
      background:#f7c948;display:grid;place-items:center;
    }
    .search-box {
      background:#fff;border-radius:999px;
      display:flex;align-items:center;
      padding:10px 16px;margin-bottom:18px;
    }
    .search-input {
      border:0;outline:0;background:transparent;
      width:100%;font-size:.9rem;
    }
    .cigar-list { display:flex; flex-direction:column; gap:12px; }
    .cigar-row {
      display:flex;align-items:center;gap:12px;
      background:var(--card);
      border-radius:20px;
      padding:12px 14px;
      box-shadow:0 8px 22px rgba(14,25,35,0.05);
      cursor:pointer;
    }
    .cigar-icon {
      width:54px;height:54px;border-radius:18px;
      display:grid;place-items:center;
      overflow:hidden;flex:0 0 54px;
    }
    .cigar-icon img { width:46px;height:46px;object-fit:contain; }
    .cigar-info { flex:1;min-width:0; }
    .cigar-line {
      font-weight:700;font-size:.9rem;line-height:1.15;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .cigar-vitola { font-size:.8rem;color:var(--muted);margin-top:2px; }
    .cigar-price { font-size:.8rem;margin-top:2px; }
    .qty-pill {
      width:44px;height:44px;border-radius:999px;
      border:1px solid rgba(15,26,44,0.12);
      display:grid;place-items:center;
      font-weight:600;background:#fff;
    }

    .receipt-pill {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #0f1a2c;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      color: #fff;
      min-width: 110px;
      z-index: 50;
    }
    .receipt-icon {
      width: 38px; height: 38px; border-radius: 14px;
      background: #fff; display:grid; place-items:center;
      color:#0f1a2c; font-size:.65rem; font-weight:700;
    }
    .receipt-count {
      background:#d91c1c;border-radius:999px;min-width:20px;height:20px;
      display:grid;place-items:center;font-size:.65rem;font-weight:700;
    }
    .receipt-total { font-weight:600;font-size:.85rem; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.32);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }
    .overlay.show { display:flex; }
    .cigar-modal {
      background:#fff;
      width: 100%;
      max-width: 720px;
      border-radius: 32px;
      box-shadow:0 20px 40px rgba(15,26,44,0.22);
      overflow:hidden;
      max-height: calc(100vh - 32px);
      display:flex;
      flex-direction:column;
    }
    .modal-header {
      display:flex;align-items:center;gap:12px;
      padding: 16px 20px 10px;
    }
    .modal-brand-icon {
      width:70px;height:70px;border-radius:20px;background:#3a3029;
      display:grid;place-items:center;overflow:hidden;flex:0 0 70px;
    }
    .modal-brand-icon img { width:56px;height:56px;object-fit:contain; }
    .modal-titles { flex:1;min-width:0; }
    .modal-brand-name { font-weight:700;font-size:1rem; }
    .modal-cigar-name { font-weight:700;font-size:1rem; }
    .modal-msrp { font-size:.8rem;margin-top:2px; }
    .modal-close { font-size:1.6rem;color:#d92029;cursor:pointer;font-weight:600; }
    .modal-divider { height:1px;background:rgba(0,0,0,.12);margin:6px 0 8px; }

    /* FIXED layout with full vertical cigar image */
    .modal-body {
      display: flex;
      flex-direction: row;
      gap: 18px;
      padding: 0 20px 12px;
      overflow-y: auto;
      align-items: stretch;
    }
    .modal-img-wrap {
      flex: 0 0 45%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
    }
    .modal-img-wrap img {
      width: auto;
      height: 100%;
      max-height: calc(100vh - 180px);
      object-fit: contain;
      display: block;
    }
    .modal-details {
      flex: 1;
      padding-top: 10px;
      padding-left: 28px;
      line-height: 1.1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .first-size-line { font-weight:700;margin-bottom:2px;font-size:1rem; }
    .first-size-sub { margin-bottom:10px;font-size:.9rem; }
    .modal-detail-line { margin-bottom:6px;font-size:.9rem; }
    .modal-detail-label { font-weight:700;color:#000;font-size:.86rem; }
    .modal-detail-value { font-size:.86rem;color:#000; }

    #debug {
      margin-top:8px;
      font-size:.65rem;
      color:#a33;
      white-space:pre-wrap;
    }

    @media (max-width: 680px) {
      .modal-body { flex-direction:column; }
      .modal-img-wrap img { height: 360px; max-width: 200px; }
      .modal-details { padding-left:0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <span style="font-size:1.2rem;">←</span>
      <span>Cigars</span>
    </div>
  </div>

  <div class="page-wrap">
    <div class="brand-title-row">
      <div class="brand-title" id="brandTitle">Brand</div>
      <div class="fav-star">★</div>
    </div>

    <div class="search-box">
      <input id="searchInput" class="search-input" placeholder="Search this brand..." oninput="filterCigars()" />
    </div>

    <div class="cigar-list" id="cigarList"></div>
    <div id="debug"></div>
  </div>

  <div class="receipt-pill">
    <div class="receipt-icon">🧾</div>
    <div class="receipt-count">4</div>
    <div class="receipt-total">$24.50</div>
  </div>

  <div class="overlay" id="cigarOverlay">
    <div class="cigar-modal">
      <div class="modal-header">
        <div class="modal-brand-icon">
          <img id="modalBrandImg" src="" alt="">
        </div>
        <div class="modal-titles">
          <div class="modal-brand-name" id="modalBrandName">Brand</div>
          <div class="modal-cigar-name" id="modalCigarName">Line + Cigar</div>
          <div class="modal-msrp" id="modalMSRP">MSRP</div>
        </div>
        <div class="modal-close" onclick="closeCigarModal()">✕</div>
      </div>
      <div class="modal-divider"></div>
      <div class="modal-body">
        <div class="modal-img-wrap">
          <img id="modalCigarImg" src="" alt="">
        </div>
        <div class="modal-details" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <script>
    const url = new URL(window.location.href);
    const brandParam = (url.searchParams.get('brand') || '').trim();
    document.getElementById('brandTitle').textContent = brandParam || 'Cigars';

    let allCigars = [];
    let shownCigars = [];

    fetch('../data/cigars_full.json')
      .then(r => r.json())
      .then(data => {
        allCigars = data;
        applyFilter();
      })
      .catch(err => {
        document.getElementById('debug').textContent = 'Fetch failed: ' + err;
      });

    function slugify(str){
      return (str || "")
        .toLowerCase()
        .replace(/&/g,"and")
        .replace(/[^a-z0-9]/g,"");
    }

    function applyFilter() {
      const target = brandParam.toLowerCase();

      let matches = allCigars.filter(row => {
        const brand = (row["Brand"] || "").toString().trim().toLowerCase();
        const aka   = (row["Brand aka"] || "").toString().trim().toLowerCase();
        return target &&
          (brand === target ||
           brand.includes(target) ||
           target.includes(brand) ||
           aka === target ||
           aka.includes(target));
      });

      if (matches.length === 0 && target) {
        matches = allCigars.filter(row => {
          const line  = (row["Line"]  || "").toString().trim().toLowerCase();
          const cigar = (row["Cigar"] || "").toString().trim().toLowerCase();
          return line.includes(target) || cigar.includes(target);
        });
      }

      if (matches.length === 0) {
        matches = allCigars.slice(0, 25);
      }

      shownCigars = matches;
      renderList(shownCigars);
    }

    function renderList(list){
      const wrap = document.getElementById('cigarList');
      wrap.innerHTML = '';
      list.forEach(cigar => {
        const line = (cigar["Line"] || "").toString().trim();
        const cigarName = (cigar["Cigar"] || "").toString().trim();
        const displayName = (line ? line + " " : "") + cigarName;
        const vitola = (cigar["Vitola"] || "").toString().trim();
        const msrp   = (cigar["MSRP"] || "").toString().trim();
        const brandSlug = slugify(cigar["Brand"] || "");

        const row = document.createElement('div');
        row.className = 'cigar-row';
        row.onclick = () => openCigarModal(cigar);
        row.innerHTML = `
          <div class="cigar-icon">
            <img src="/img/icons/brands/${brandSlug}.svg" onerror="this.style.opacity='0'">
          </div>
          <div class="cigar-info">
            <div class="cigar-line">${displayName}</div>
            <div class="cigar-vitola">${vitola}</div>
            <div class="cigar-price">${msrp}</div>
          </div>
          <div class="qty-pill">89</div>
        `;
        wrap.appendChild(row);
      });
    }

    function openCigarModal(cigar) {
      const overlay = document.getElementById('cigarOverlay');
      const brandName = cigar["Brand"] || "";
      const line = cigar["Line"] || "";
      const cigarName = cigar["Cigar"] || "";
      const msrp = cigar["MSRP"] || "";
      const vitola = cigar["Vitola"] || "";
      const length = cigar["LENGTH"] || "";
      const rg = cigar["RG"] || "";
      const shade = cigar["WRAPPER SHADE"] || "";
      const wrapper = cigar["WRAPPER"] || "";
      const binder = cigar["BINDER"] || "";
      const filler = cigar["FILLER"] || "";
      const origin = cigar["ORIGIN"] || "";
      const strength = cigar["STRENGTH"] || "";

      document.getElementById('modalBrandName').textContent = brandName;
      document.getElementById('modalCigarName').textContent = (line ? line + " " : "") + cigarName;
      document.getElementById('modalMSRP').textContent = msrp ? msrp : "";

      const brandSlug = slugify(brandName);
      document.getElementById('modalBrandImg').src = `/img/icons/brands/${brandSlug}.svg`;

      const cigarSlug = slugify(cigarName);
      const cigarImg = document.getElementById('modalCigarImg');
      cigarImg.src = `/img/cigars/${brandSlug}/${brandSlug}${cigarSlug}.png`;
      cigarImg.onerror = () => { cigarImg.src = `/img/cigars/${brandSlug}/${cigarSlug}.png`; };

      const details = document.getElementById('modalDetails');
      details.innerHTML = `
        <div class="first-size-line">${rg ? `${rg} x ${length}”` : ""}</div>
        <div class="first-size-sub">${vitola}</div>
        <div class="modal-detail-line"><span class="modal-detail-label">Shade</span><br><span class="modal-detail-value">${shade || "—"}</span></div>
        <div class="modal-detail-line"><span class="modal-detail-label">Wrapper</span><br><span class="modal-detail-value">${wrapper || "—"}</span></div>
        <div class="modal-detail-line"><span class="modal-detail-label">Binder</span><br><span class="modal-detail-value">${binder || "—"}</span></div>
        <div class="modal-detail-line"><span class="modal-detail-label">Filler</span><br><span class="modal-detail-value">${filler || "—"}</span></div>
        <div class="modal-detail-line"><span class="modal-detail-label">Origin</span><br><span class="modal-detail-value">${origin || "—"}</span></div>
        <div class="modal-detail-line"><span class="modal-detail-label">Strength</span><br><span class="modal-detail-value">${strength || "—"}</span></div>
      `;

      overlay.classList.add('show');
    }

    function closeCigarModal() {
      document.getElementById('cigarOverlay').classList.remove('show');
    }
  </script>
</body>
</html>
