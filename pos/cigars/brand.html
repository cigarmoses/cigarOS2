<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">

  <header class="brand-topbar">
    <button type="button" class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="brand-main">

    <section class="brand-title-row">
      <h1 class="brand-title" id="brand-title">Brand</h1>
      <div class="brand-icon" id="brand-icon" aria-hidden="true"></div>
    </section>

    <section class="brand-search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
    </section>

    <section class="brand-controls" aria-label="Brand controls">
      <button class="pill-btn" id="btn-filters" type="button" aria-haspopup="dialog">Filters</button>
      <button class="pill-btn" id="btn-bands" type="button" aria-haspopup="dialog">Bands</button>

      <div class="seg" id="wrapper-seg" data-state="all" role="group" aria-label="Wrapper toggle">
        <button class="seg-btn" id="seg-maduro" type="button" aria-pressed="false">Maduro</button>
        <button class="seg-dot" id="seg-switch" type="button" aria-label="Toggle Maduro/Natural"></button>
        <button class="seg-btn" id="seg-natural" type="button" aria-pressed="false">Natural</button>
      </div>
    </section>

    <section class="brand-applied" id="brand-applied" aria-label="Applied filters" hidden>
      <div class="applied-row" id="brand-applied-row"></div>
    </section>

    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>
    <p class="brand-status" id="brand-status" hidden></p>
  </main>

  <!-- ✅ Bands sheet -->
  <section class="sheet bands-sheet" id="sheet-bands" role="dialog" aria-modal="true" aria-label="Bands" hidden>
    <header class="sheet-header bands-header">
      <h2>Filter by band art</h2>
      <button class="sheet-x bands-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body bands-body">
      <div class="bands-list" id="bands-options"></div>
    </div>

    <footer class="sheet-footer bands-footer">
      <button class="sheet-btn primary bands-confirm" type="button" id="bands-confirm">Confirm</button>
    </footer>
  </section>

  <!-- ✅ Filters sheet -->
  <section class="sheet filters-sheet" id="sheet-filters" role="dialog" aria-modal="true" aria-label="Filters" hidden>
    <header class="sheet-header filters-header">
      <button type="button" class="filters-back" id="filters-back" aria-label="Back" hidden>←</button>
      <h2 id="filters-title">Filters</h2>
      <button class="sheet-x filters-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body filters-body">

      <div class="filters-applied" id="filters-applied" hidden>
        <div class="filters-applied-row" id="filters-applied-row"></div>
      </div>

      <div class="filters-home" id="filters-home">
        <div class="filters-grid">
          <div class="filters-row filters-row--3">
            <button class="filter-pill" type="button" data-open-filter="RG">Ring</button>
            <button class="filter-pill" type="button" data-open-filter="Length">Length</button>
            <button class="filter-pill pill-nowrap pill-wide" type="button" data-open-filter="Wrapper Shade">Wrapper Shade</button>
          </div>
          <div class="filters-row filters-row--3">
            <button class="filter-pill" type="button" data-open-filter="Shape">Shape</button>
            <button class="filter-pill" type="button" data-open-filter="Vitola">Vitolas</button>
            <button class="filter-pill" type="button" data-open-filter="Strength">Strength</button>
          </div>
        </div>

        <div class="filters-toggles">
          <div class="tog-row">
            <button class="tog" type="button" data-toggle-key="Flavored">
              <span class="tog-dot" aria-hidden="true"></span>
              <span class="tog-label">Flavored</span>
            </button>
            <button class="tog" type="button" data-toggle-key="Tubo">
              <span class="tog-dot" aria-hidden="true"></span>
              <span class="tog-label">Tubo</span>
            </button>
            <button class="tog" type="button" data-toggle-key="Tin">
              <span class="tog-dot" aria-hidden="true"></span>
              <span class="tog-label">Tin</span>
            </button>
          </div>

          <div class="tog-row">
            <button class="tog" type="button" data-toggle-key="Box-Pressed">
              <span class="tog-dot" aria-hidden="true"></span>
              <span class="tog-label">Box-pressed</span>
            </button>
            <button class="tog" type="button" data-toggle-key="Pack">
              <span class="tog-dot" aria-hidden="true"></span>
              <span class="tog-label">Packs</span>
            </button>
            <button class="tog" type="button" data-toggle-key="Barber">
              <span class="tog-dot" aria-hidden="true"></span>
              <span class="tog-label">Barberpole</span>
            </button>
          </div>
        </div>
      </div>

      <div class="filters-detail" id="filters-detail" hidden>
        <div class="filters-search">
          <span class="filters-search-ico" aria-hidden="true">🔎</span>
          <input id="filters-search" type="search" placeholder="search..." autocomplete="off" />
        </div>

        <div class="filters-list" id="filters-list"></div>
      </div>

    </div>

    <footer class="sheet-footer filters-footer">
      <button class="sheet-btn primary" type="button" id="filters-confirm" disabled>Confirm</button>
    </footer>
  </section>

  <!-- IMPORTANT:
       cart.js injects the single universal invoice button + invoice UI.
       Do NOT hardcode receipt/invoice markup here.
  -->
  <script defer src="/pos/cart.js"></script>
  <script defer src="/pos/cigars/brand.js"></script>

</body>
</html>
