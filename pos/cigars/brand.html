<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS • Brand</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/theme.css" />

  <!-- ✅ Use the brand page CSS you posted (FULL REPLACEMENT file) -->
  <link rel="stylesheet" href="/pos/cigars/brand.css" />

</head>

<body class="brand-page">
  <!-- TOP BAR -->
  <header class="brand-topbar">
    <!-- Back -->
    <button id="brand-back" class="icon-btn" type="button" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Center: Theme Toggle (NO extra knob icon, prevents double moon) -->
    <button id="themeToggle" type="button" aria-label="Toggle theme">
      <div class="tt-track" aria-hidden="true">
        <img class="tt-ico tt-ico--sun" src="/img/icons/sun.svg" alt="" />
        <img class="tt-ico tt-ico--moon" src="/img/icons/moon.svg" alt="" />
        <span class="tt-knob" aria-hidden="true"></span>
      </div>
    </button>

    <!-- Invoice/Cart -->
    <button id="invoice-btn" class="invoice-btn" type="button" aria-label="Invoice / Cart">
      <img id="invoice-icon" src="/img/icons/cart-blue.svg" alt="" />
    </button>
  </header>

  <main class="brand-main">
    <!-- Title + Brand icon -->
    <div class="brand-title-row">
      <h1 class="brand-title" id="brand-title">Brand</h1>
      <div class="brand-icon" id="brand-icon"></div>
    </div>

    <!-- Search -->
    <div class="brand-search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
    </div>

    <!-- Controls -->
    <div class="brand-controls">
      <button id="btn-filters" class="pill-btn" type="button">Filters</button>
      <button id="btn-bands" class="pill-btn" type="button">Bands</button>

      <!-- Maduro / Natural segmented -->
      <div id="wrapper-seg" class="seg" data-state="all" role="group" aria-label="Wrapper">
        <button id="seg-maduro" class="seg-btn" type="button" aria-pressed="false">Maduro</button>
        <button id="seg-switch" class="seg-dot" type="button" aria-label="Cycle wrapper"></button>
        <button id="seg-natural" class="seg-btn" type="button" aria-pressed="false">Natural</button>
      </div>
    </div>

    <!-- Status -->
    <div id="brand-status" class="brand-status" hidden>Loading…</div>

    <!-- List -->
    <section id="brand-list" class="brand-list" aria-label="Cigars"></section>
  </main>

  <!-- ===================== -->
  <!-- FILTERS SHEET (exists so Filters works) -->
  <!-- ===================== -->
  <section id="sheet-filters" class="sheet-overlay" hidden aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Filters</div>
        <button type="button" class="sheet-x" data-sheet-close aria-label="Close">×</button>
      </div>

      <!-- Put your real filters UI here later -->
      <div class="sheet-body">
        <div style="opacity:.7;font-weight:700;">Filter UI goes here.</div>
      </div>

      <div class="sheet-foot">
        <button type="button" class="pill-btn" data-sheet-close>Done</button>
      </div>
    </div>
  </section>

  <!-- ===================== -->
  <!-- BANDS SHEET (exists so Bands works) -->
  <!-- ===================== -->
  <section id="sheet-bands" class="sheet-overlay" hidden aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Bands</div>
        <button type="button" class="sheet-x" data-sheet-close aria-label="Close">×</button>
      </div>

      <div class="sheet-body">
        <div id="bands-options"></div>
      </div>

      <div class="sheet-foot">
        <button id="bands-confirm" type="button" class="pill-btn">Apply</button>
      </div>
    </div>
  </section>

  <!-- Minimal sheet styling (kept tiny + scoped, won’t blow up page sizing) -->
  <style>
    .sheet-overlay{
      position:fixed; inset:0; z-index:9998;
      display:flex; align-items:flex-end; justify-content:center;
      background:rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding:12px;
    }
    .sheet{
      width:min(720px, 100%);
      border-radius:22px;
      overflow:hidden;
      background: var(--glass);
      box-shadow: var(--shadow);
    }
    .sheet-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid var(--hair);
    }
    .sheet-title{
      font-weight:900;
      color: var(--ink);
      letter-spacing:-.02em;
    }
    .sheet-x{
      width:34px;height:34px;border-radius:12px;
      border:none;background:var(--glass2);
      color:var(--ink); font-size:22px; font-weight:900;
    }
    .sheet-body{ padding:14px 16px; max-height:60vh; overflow:auto; }
    .sheet-foot{
      padding:12px 16px;
      border-top:1px solid var(--hair);
      display:flex; justify-content:flex-end;
    }

    /* Bands rows basic layout (your brand.js uses these classnames) */
    .bands-row{
      display:flex; align-items:center; gap:12px;
      padding:12px 10px;
      border-top:1px solid var(--hair);
      cursor:pointer;
    }
    .bands-art{
      width:54px;height:54px;border-radius:14px;
      background: var(--glass2);
      box-shadow: var(--shadow);
      display:grid; place-items:center;
      overflow:hidden;
    }
    .bands-img{ width:100%; height:100%; object-fit:cover; display:block; }
    .bands-meta{ flex:1 1 auto; min-width:0; }
    .bands-label{ font-weight:900; color:var(--ink); }
    .bands-check{ width:18px; height:18px; }
  </style>

  <!-- Theme + cart swap -->
  <script defer src="/js/theme-toggle.js"></script>

  <!-- Brand logic -->
  <script defer src="/pos/cigars/brand.js"></script>
</body>
</html>
