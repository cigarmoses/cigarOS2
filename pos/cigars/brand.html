<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cigars • Brand</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color: var(--ink);
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px 8px;
    }
    header a {
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
    }
    h1 {
      font-size: 38px;
      margin: 4px 16px 12px;
    }
    .fav {
      margin-left: auto;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      background: #f1c836;
      display: grid;
      place-items: center;
      font-size: 28px;
    }
    .search-wrap {
      padding: 0 16px 14px;
    }
    .search {
      width: 100%;
      background: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 16px 120px;
    }
    .cigar-card {
      background: #fff;
      border-radius: 28px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 18px rgba(0,0,0,.06);
    }
    .cigar-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #ddd;
      background-size: cover;
      background-position: center;
      flex: 0 0 64px;
      /* no border here – you asked to remove it */
    }
    .cigar-body {
      flex: 1;
      min-width: 0;
    }
    .cigar-title {
      font-weight: 700;
      font-size: 16.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cigar-vitola {
      font-size: 14px;
      color: var(--muted);
    }
    .cigar-price {
      font-size: 14px;
      margin-top: 2px;
    }
    .qty-badge {
      width: 62px;
      height: 62px;
      border-radius: 999px;
      border: 1.5px solid #d7d7d7;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 19px;
      color: var(--ink);
    }

    /* POPUP */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 14px;
      z-index: 1000;
    }
    .overlay.show { display: flex; }
    .popup {
      width: min(760px, 100%);
      background: #fff;
      border-radius: 38px;
      position: relative;
      padding: 20px 16px 18px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
    }
    .popup-close {
      position: absolute;
      right: 16px;
      top: 12px;
      font-size: 28px;
      color: #d11219;
      cursor: pointer;
      font-weight: 600;
    }
    .popup-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .popup-brand-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: #333;
      background-size: cover;
      background-position: center;
    }
    .popup-title-block {
      flex: 1;
    }
    .popup-title-block h2 {
      margin: 0;
      font-size: 22px;
    }
    .popup-title-block .msrp {
      font-size: 16px;
      margin-top: 2px;
    }
    .popup-body {
      display: flex;
      gap: 14px;
      margin-top: 10px;
    }
    .popup-img {
      flex: 0 0 42%;
      background: #f7f7f7;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 270px;
    }
    .popup-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .popup-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
    }
    .popup-details b {
      display: block;
      margin-bottom: 2px;
    }
    .add-btn {
      margin-top: 14px;
      background: #0f1a2c;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* receipt pill on this page too */
    .receipt-pill {
      position: fixed;
      right: 14px;
      bottom: 14px;
      background: #0f1a2c;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 22px 9px 9px;
      color: #fff;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      text-decoration: none;
      z-index: 999;
    }
    .receipt-pill-icon {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: #fff;
      display: grid;
      place-items: center;
      color: #0f1a2c;
      font-size: 11px;
      font-weight: 700;
    }
    .receipt-pill-count {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #d11219;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .receipt-pill-total {
      font-size: 20px;
      font-weight: 700;
    }

    @media(max-width: 640px){
      .popup-body { flex-direction: column; }
      .popup-img { min-height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/pos/">← Cigars</a>
    <div class="fav">★</div>
  </header>
  <h1 id="brandTitle">Brand</h1>
  <div class="search-wrap">
    <input id="search" class="search" placeholder="Search this brand…" />
  </div>
  <div id="list" class="list"></div>

  <!-- POPUP -->
  <div id="overlay" class="overlay">
    <div class="popup" id="popup">
      <div class="popup-close" id="popupClose">×</div>
      <div class="popup-header">
        <div class="popup-brand-icon" id="popupBrandIcon"></div>
        <div class="popup-title-block">
          <h2 id="popupTitle">Title</h2>
          <div class="msrp" id="popupPrice"></div>
        </div>
      </div>
      <hr style="border:none;border-top:1px solid #e0e0e0;margin:8px 0 14px;">
      <div class="popup-body">
        <div class="popup-img">
          <img id="popupImg" src="" alt="">
        </div>
        <div class="popup-details" id="popupDetails">
          <!-- filled in js -->
        </div>
      </div>
      <button class="add-btn" id="addToInvoiceBtn">Add to invoice</button>
    </div>
  </div>

  <!-- sticky receipt pill -->
  <a href="/pos/receipt.html" class="receipt-pill" id="receiptPill">
    <div class="receipt-pill-icon">RCP</div>
    <div class="receipt-pill-count" id="pillCount">0</div>
    <div class="receipt-pill-total" id="pillTotal">$0.00</div>
  </a>

  <script>
    const RECEIPT_KEY = 'cigaros_receipt_v1';

    function loadReceipt() {
      try {
        return JSON.parse(localStorage.getItem(RECEIPT_KEY)) || [];
      } catch (e) {
        return [];
      }
    }
    function saveReceipt(arr){
      localStorage.setItem(RECEIPT_KEY, JSON.stringify(arr));
    }
    function money(n){
      return n ? n.toFixed(2) : '0.00';
    }
    function updatePill(){
      const cart = loadReceipt();
      const count = cart.reduce((n,i)=>n+i.qty,0);
      const total = cart.reduce((n,i)=>n + i.qty * i.msrp, 0);
      document.getElementById('pillCount').textContent = count;
      document.getElementById('pillTotal').textContent = '$' + money(total);
    }

    const brandParam = new URLSearchParams(location.search).get('brand') || '';
    document.getElementById('brandTitle').textContent = brandParam;

    let ALL = [];
    let CURRENT_CIGAR = null;

    fetch('/pos/data/cigars_full.json')
      .then(r => r.json())
      .then(data => {
        ALL = data.filter(row => (row['Brand'] || row['brand'] || '').trim().toLowerCase() === brandParam.trim().toLowerCase());
        renderList(ALL);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('list').innerHTML = '<p>Could not load cigars.</p>';
      });

    function renderList(rows){
      const list = document.getElementById('list');
      list.innerHTML = '';
      rows.forEach(row => {
        const line = (row['Line'] || row['line'] || '').trim();
        const cigar = (row['Cigar'] || row['cigar'] || '').trim();
        const name = (line ? line + ' ' : '') + cigar;
        const vitola = row['Vitola'] || row['vitola'] || '';
        const msrp = parseFloat(row['MSRP'] || row['msrp'] || 0) || 0;
        const icon = row['Brand IMG'] || row['brand img'] || row['brand_img'] || '';

        const card = document.createElement('div');
        card.className = 'cigar-card';
        card.addEventListener('click', () => openPopup(row));

        const ic = document.createElement('div');
        ic.className = 'cigar-icon';
        if (icon) ic.style.backgroundImage = `url(/${icon.replace(/^\//,'')})`;

        const body = document.createElement('div');
        body.className = 'cigar-body';

        const t = document.createElement('div');
        t.className = 'cigar-title';
        t.textContent = name || cigar || 'Untitled cigar';

        const v = document.createElement('div');
        v.className = 'cigar-vitola';
        v.textContent = vitola;

        const p = document.createElement('div');
        p.className = 'cigar-price';
        p.textContent = msrp ? msrp.toFixed(2) : '';

        body.appendChild(t);
        body.appendChild(v);
        body.appendChild(p);

        const qty = document.createElement('div');
        qty.className = 'qty-badge';
        qty.textContent = '89';

        card.appendChild(ic);
        card.appendChild(body);
        card.appendChild(qty);

        list.appendChild(card);
      });
    }

    document.getElementById('search').addEventListener('input', (e)=>{
      const q = e.target.value.toLowerCase();
      const filtered = ALL.filter(row=>{
        const line = (row['Line'] || '').toLowerCase();
        const cigar = (row['Cigar'] || '').toLowerCase();
        return line.includes(q) || cigar.includes(q);
      });
      renderList(filtered);
    });

    function openPopup(row){
      CURRENT_CIGAR = row;
      const overlay = document.getElementById('overlay');
      const brandIcon = row['Brand IMG'] || '';
      const cigarImg = row['Cigar IMG'] || '';
      const line = (row['Line'] || '').trim();
      const cigar = (row['Cigar'] || '').trim();
      const name = (line ? line + ' ' : '') + cigar;
      document.getElementById('popupTitle').textContent = name || 'Cigar';
      document.getElementById('popupPrice').textContent = (row['MSRP'] ? row['MSRP'] : '0.00');
      if (brandIcon) {
        document.getElementById('popupBrandIcon').style.backgroundImage = `url(/${brandIcon.replace(/^\//,'')})`;
      } else {
        document.getElementById('popupBrandIcon').style.backgroundImage = 'none';
      }
      if (cigarImg) {
        document.getElementById('popupImg').src = `/${cigarImg.replace(/^\//,'')}`;
      } else {
        document.getElementById('popupImg').src = '/img/cigars/placeholder.png';
      }

      // details
      const d = [];
      d.push(`<b>${row['RG'] && row['LENGTH'] ? `${row['RG']} x ${row['LENGTH']}` : ''}</b>`);
      if (row['Vitola']) d.push(`Vitola: ${row['Vitola']}`);
      if (row['WRAPPER SHADE']) d.push(`Wrapper shade: ${row['WRAPPER SHADE']}`);
      if (row['WRAPPER']) d.push(`Wrapper: ${row['WRAPPER']}`);
      if (row['BINDER']) d.push(`Binder: ${row['BINDER']}`);
      if (row['FILLER']) d.push(`Filler: ${row['FILLER']}`);
      if (row['ORIGIN']) d.push(`Origin: ${row['ORIGIN']}`);
      if (row['STRENGTH']) d.push(`Strength: ${row['STRENGTH']}`);
      document.getElementById('popupDetails').innerHTML = d.filter(Boolean).map(s=>`<div>${s}</div>`).join('');

      overlay.classList.add('show');
    }
    document.getElementById('popupClose').addEventListener('click', ()=> {
      document.getElementById('overlay').classList.remove('show');
    });

    // add to invoice
    document.getElementById('addToInvoiceBtn').addEventListener('click', ()=>{
      if (!CURRENT_CIGAR) return;
      const line = (CURRENT_CIGAR['Line'] || '').trim();
      const cigar = (CURRENT_CIGAR['Cigar'] || '').trim();
      const name = (line ? line + ' ' : '') + cigar;
      const msrp = parseFloat(CURRENT_CIGAR['MSRP'] || 0) || 0;
      const brand = CURRENT_CIGAR['Brand'] || '';
      const icon = CURRENT_CIGAR['Brand IMG'] ? `/${CURRENT_CIGAR['Brand IMG'].replace(/^\//,'')}` : '';
      const id = (brand + '-' + name).toLowerCase().replace(/\s+/g,'-');

      const cart = loadReceipt();
      const found = cart.find(i => i.id === id);
      if (found) {
        found.qty += 1;
      } else {
        cart.push({
          id,
          type: 'cigar',
          brand,
          icon,
          name,
          vitola: CURRENT_CIGAR['Vitola'] || '',
          msrp,
          qty: 1
        });
      }
      saveReceipt(cart);
      updatePill();
      document.getElementById('overlay').classList.remove('show');
    });

    updatePill();
  </script>
  <script src="/js/tony.js" defer></script>
</body>
</html>
