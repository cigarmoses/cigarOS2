<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS • Cigar Brand</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
      --card: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 110px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      gap: 4px;
      align-items: center;
      font-weight: 500;
    }
    .star {
      font-size: 22px;
      color: #ffcc00;
    }
    .title {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin: 16px 0 14px;
      word-break: break-word;
    }
    .search-bar {
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .search-bar input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
    }
    .filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .chip {
      background: #fff;
      border-radius: 14px;
      padding: 5px 10px;
      font-size: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .chip input { pointer-events: none; }
    .chip.active {
      border-color: #0f1a2c;
    }
    .cigar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cigar-row {
      display: flex;
      gap: 10px;
      background: var(--card);
      border-radius: 18px;
      padding: 10px 12px;
      align-items: center;
      min-height: 70px;
    }
    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #000;
      overflow: hidden;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cigar-body {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .brand-line {
      font-size: 12px;
      opacity: .6;
      margin-bottom: 2px;
    }
    .cigar-title {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.1;
      margin-bottom: 1px;
      overflow-wrap: anywhere;
    }
    .cigar-vitola {
      font-size: 12px;
      opacity: .8;
    }
    .cigar-price {
      font-size: 12px;
      margin-top: 3px;
      opacity: .9;
    }
    .inv-pill {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 2px solid #e3e3e3;
      background: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 12px;
      color: #0f1a2c;
      flex: 0 0 38px;
      cursor: pointer;
    }
    .inv-pill.low {
      color: #d00;
      border-color: #d00;
    }
    #empty {
      text-align: center;
      opacity: .6;
      margin-top: 20px;
    }

    /* bottom bill tab */
    .pos-bill-tab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1a2c;
      color: #fff;
      border-radius: 50px;
      padding: 10px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 60;
    }
    .pos-bill-badge {
      background: #e11;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .pos-bill-total { font-weight: 600; }

    /* bill modal */
    #billModal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 80;
    }

    /* detail overlay */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: none;
      z-index: 90;
      justify-content: center;
      align-items: flex-end;
    }
    .detail-card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px 26px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .detail-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .detail-title {
      font-size: 20px;
      font-weight: 700;
    }
    .detail-row {
      margin: 5px 0;
      font-size: 14px;
    }
    .detail-label {
      font-weight: 600;
      margin-right: 4px;
    }
    .detail-flags {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .flag-box {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #e9edf0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="/pos/cigars/" class="back">← CIGARS</a>
      <div class="star">★</div>
    </div>

    <h1 class="title" id="brandTitle">Brand</h1>

    <div class="search-bar">
      <input id="searchInput" placeholder="Search this brand…" />
    </div>

    <!-- quick feature filters -->
    <div class="filter-chips" id="featureChips">
      <label class="chip"><input type="checkbox" value="Box Pressed" /> Box Pressed</label>
      <label class="chip"><input type="checkbox" value="F/S" /> Flavored/Sweet</label>
      <label class="chip"><input type="checkbox" value="Pack" /> Packs</label>
      <label class="chip"><input type="checkbox" value="TIN" /> Tins</label>
      <label class="chip"><input type="checkbox" value="Barberpole" /> Barberpole</label>
    </div>

    <div id="cigarList" class="cigar-list"></div>
    <p id="empty">Loading…</p>
  </div>

  <!-- bill tab -->
  <div class="pos-bill-tab" onclick="openBill()">
    <div>🧾</div>
    <div class="pos-bill-badge" id="billCount">0</div>
    <div class="pos-bill-total" id="billTotal">$0.00</div>
  </div>

  <!-- bill modal -->
  <div id="billModal">
    <div onclick="closeBill()" style="position:fixed;inset:0;background:rgba(0,0,0,.35);"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;height:92vh;display:flex;justify-content:center;align-items:flex-end;">
      <iframe src="/pos/receipt/" style="width:100%;max-width:480px;height:100%;border:none;border-top-left-radius:26px;border-top-right-radius:26px;"></iframe>
    </div>
  </div>

  <!-- detail overlay -->
  <div id="detailOverlay" class="detail-overlay">
    <div class="detail-card" id="detailCard">
      <div class="detail-top">
        <div class="detail-title" id="detailTitle">Cigar name</div>
        <button onclick="closeDetail()" style="background:none;border:none;font-size:20px;">×</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <script>
    // --- CONFIG ---
    const CSV_URL = "/hub/hub_11-5-25.csv"; // your uploaded CSV
    // ---------------

    const brandName = decodeURIComponent(
      window.location.pathname.split("/").filter(Boolean).slice(-1)[0] || "Brand"
    );

    document.getElementById("brandTitle").textContent = brandName;

    const cigarListEl = document.getElementById("cigarList");
    const emptyEl = document.getElementById("empty");
    const searchInput = document.getElementById("searchInput");
    const featureChips = document.getElementById("featureChips");

    let ALL_ROWS = [];
    let ACTIVE_FEATURES = new Set();

    // cart ui
    function loadCart() {
      const saved = JSON.parse(localStorage.getItem("posCart") || '{"items":[],"count":0,"total":0}');
      document.getElementById("billCount").textContent = saved.count || 0;
      document.getElementById("billTotal").textContent = "$" + (saved.total || 0).toFixed(2);
      return saved;
    }
    function saveCart(cart) {
      localStorage.setItem("posCart", JSON.stringify(cart));
      document.getElementById("billCount").textContent = cart.count;
      document.getElementById("billTotal").textContent = "$" + cart.total.toFixed(2);
    }
    let CART = loadCart();

    // fetch CSV and render
    fetch(CSV_URL)
      .then(r => r.text())
      .then(text => {
        const rows = parseCSV(text);
        ALL_ROWS = rows.filter(r => (r["Brand"] || "").trim() === brandName);
        renderList();
      })
      .catch(err => {
        console.error(err);
        emptyEl.textContent = "Could not load " + CSV_URL;
      });

    function renderList() {
      cigarListEl.innerHTML = "";
      let list = [...ALL_ROWS];

      // search
      const term = searchInput.value.toLowerCase();
      if (term) {
        list = list.filter(r => {
          const line = (r["Line"] || "").toLowerCase();
          const cigar = (r["Cigar"] || "").toLowerCase();
          const vitola = (r["Vitola"] || "").toLowerCase();
          return line.includes(term) || cigar.includes(term) || vitola.includes(term);
        });
      }

      // feature filters
      if (ACTIVE_FEATURES.size) {
        list = list.filter(r => {
          for (const f of ACTIVE_FEATURES) {
            if (f === "Box Pressed" && !isX(r["Box Pressed"])) return false;
            if (f === "F/S" && !isX(r["F/S"]) && !isX(r["Flavored or sweet"])) return false;
            if (f === "Pack" && !isX(r["Pack"])) return false;
            if (f === "TIN" && !isX(r["TIN"])) return false;
            if (f === "Barberpole" && !isX(r["Barberpole"])) return false;
          }
          return true;
        });
      }

      if (!list.length) {
        emptyEl.style.display = "block";
        emptyEl.textContent = "No cigars for this brand.";
        return;
      }
      emptyEl.style.display = "none";

      list.forEach(row => {
        const line = row["Line"] || "";
        const cigar = row["Cigar"] || "";
        const vitola = row["Vitola"] || "";
        const msrp = row["Cigar MSRP"] || row["MSRP"] || "";
        const inv = row["INVENTORY"] || row["Inventory"] || "0";
        const invNum = parseInt(inv, 10) || 0;
        const brandImg = row["Brand IMG"] && row["Brand IMG"].trim()
          ? row["Brand IMG"].trim()
          : `/img/icons/brands/${brandName}.svg`;

        const rowEl = document.createElement("div");
        rowEl.className = "cigar-row";
        rowEl.innerHTML = `
          <div class="brand-icon">
            <img src="${brandImg}" alt="${brandName}" onerror="this.src='/img/placeholder.svg'">
          </div>
          <div class="cigar-body">
            <div class="brand-line">${brandName}</div>
            <div class="cigar-title">${line ? line + " " : ""}${cigar}</div>
            ${vitola ? `<div class="cigar-vitola">${vitola}</div>` : ""}
            ${msrp ? `<div class="cigar-price">$${Number(msrp).toFixed(2)}</div>` : ""}
          </div>
          <div class="inv-pill ${invNum < 12 ? "low" : ""}">${invNum}</div>
        `;

        // click on body = show details
        rowEl.querySelector(".cigar-body").addEventListener("click", () => {
          openDetail(row, brandImg, brandName);
        });

        // click on inventory = add to bill
        rowEl.querySelector(".inv-pill").addEventListener("click", (e) => {
          const price = parseFloat(msrp) || 0;
          // add to cart
          CART.count = (CART.count || 0) + 1;
          CART.total = (CART.total || 0) + price;
          CART.items = CART.items || [];
          CART.items.push({
            name: (line ? line + " " : "") + cigar,
            brand: brandName,
            price: price,
            qty: 1
          });
          saveCart(CART);

          // decrease visible inventory
          let current = parseInt(e.currentTarget.textContent.trim(), 10) || 0;
          if (current > 0) current -= 1;
          e.currentTarget.textContent = current;
          if (current < 12) e.currentTarget.classList.add("low");
        });

        cigarListEl.appendChild(rowEl);
      });
    }

    // search
    searchInput.addEventListener("input", renderList);

    // feature chips
    featureChips.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const input = chip.querySelector("input");
      if (chip.classList.contains("active")) {
        chip.classList.remove("active");
        input.checked = false;
        ACTIVE_FEATURES.delete(input.value);
      } else {
        chip.classList.add("active");
        input.checked = true;
        ACTIVE_FEATURES.add(input.value);
      }
      renderList();
    });

    // detail overlay functions
    function openDetail(row, brandImg, brandName) {
      const overlay = document.getElementById("detailOverlay");
      const body = document.getElementById("detailBody");
      document.getElementById("detailTitle").textContent =
        (row["Line"] ? row["Line"] + " " : "") + (row["Cigar"] || "");

      let html = "";
      const fields = [
        ["Vitola", row["Vitola"]],
        ["Length", row["LENGTH"] || row["Length"]],
        ["Ring", row["Ring"] || row["RG"]],
        ["Wrapper Shade", row["WRAPPER SHADE"]],
        ["Strength", row["STRENGTH"]],
        ["Origin", row["ORIGIN"]],
        ["Wrapper", row["WRAPPER"]],
        ["Binder", row["BINDER"]],
        ["Filler", row["FILLER"]],
        ["Shape", row["SHAPE"]],
        ["Cigar MSRP", row["Cigar MSRP"] || row["MSRP"]],
        ["Box MSRP", row["Box MSRP"]],
        ["Box Count", row["Box Count"]],
      ];
      fields.forEach(([label, val]) => {
        if (val && String(val).trim() !== "") {
          html += `<div class="detail-row"><span class="detail-label">${label}:</span> ${val}</div>`;
        }
      });

      html += `<div class="detail-row" style="margin-top:12px;font-weight:600;">Features</div>`;
      html += `<div class="detail-row">
        ${isX(row["Box Pressed"]) ? "• Box Pressed<br>" : ""}
        ${isX(row["F/S"]) || isX(row["Flavored or sweet"]) ? "• Flavored/Sweet<br>" : ""}
        ${isX(row["Pack"]) ? "• Pack<br>" : ""}
        ${isX(row["TIN"]) ? "• Tin<br>" : ""}
        ${isX(row["Barberpole"]) ? "• Barberpole<br>" : ""}
      </div>`;

      body.innerHTML = html;
      overlay.style.display = "flex";
    }
    function closeDetail() {
      document.getElementById("detailOverlay").style.display = "none";
    }
    window.closeDetail = closeDetail;

    // bill modal
    function openBill() {
      document.getElementById("billModal").style.display = "block";
    }
    function closeBill() {
      document.getElementById("billModal").style.display = "none";
    }
    window.closeBill = closeBill;

    function isX(v) {
      if (!v) return false;
      return String(v).trim().toLowerCase() === "x";
    }

    // tiny CSV parser that handles quoted fields
    function parseCSV(text) {
      const lines = text.replace(/\r/g, "").split("\n").filter(Boolean);
      if (!lines.length) return [];
      const headers = splitCSVLine(lines[0]);
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = splitCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h.trim()] = cols[idx] !== undefined ? cols[idx].trim() : "";
        });
        rows.push(obj);
      }
      return rows;
    }
    function splitCSVLine(line) {
      const out = [];
      let cur = "";
      let inside = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          inside = !inside;
        } else if (c === "," && !inside) {
          out.push(cur);
          cur = "";
        } else {
          cur += c;
        }
      }
      out.push(cur);
      return out;
    }
  </script>
</body>
</html>
