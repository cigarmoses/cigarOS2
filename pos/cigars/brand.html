<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<title>POS • Brand</title>

<link rel="stylesheet" href="/css/type.css?v=18" />
<link rel="stylesheet" href="/css/theme.css?v=18" />
<link rel="stylesheet" href="/css/theme-toggle.css?v=18" />
<link rel="stylesheet" href="/pos/pos.css?v=18" />
<link rel="stylesheet" href="/pos/cigars/cigars.css?v=18" />
<link rel="stylesheet" href="/pos/cigars/brand.css?v=18" />

</head>

<body class="brand-page">

<header class="brand-topbar">

<button id="back-btn" class="icon-btn" type="button" aria-label="Back">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
<path d="M15.5 19.5L8 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</button>

<div class="theme-dock">
<button id="theme-toggle" class="moon-toggle" type="button" aria-label="Toggle theme">
<span class="moon-track" aria-hidden="true"></span>
<span class="moon-knob" aria-hidden="true"></span>
</button>
</div>

<button
id="invoice-btn"
class="invoice-btn pos-invoice-btn"
data-invoice-btn
type="button"
aria-label="Invoice"
>

<svg id="invoice-icon" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
<path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
<circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
</svg>

<span id="invoice-badge" class="invoice-badge" data-cart-badge hidden>0</span>

</button>

</header>


<main class="brand-main">

<section class="brand-header">

<div class="brand-title-row">

<h1 id="brand-title" class="brand-title">Brand</h1>

<div id="brand-icon" class="brand-icon">
<img id="brand-icon-img" src="" alt="" />
</div>

</div>


<div class="brand-search">

<div class="search-wrap">

<span class="search-ico" aria-hidden="true">🔎</span>

<input
id="brand-search"
type="search"
placeholder="Search…"
autocomplete="off"
/>

</div>

</div>


<div class="brand-controls">

<button id="btn-filters" class="pill-btn" type="button">Filters</button>

<button id="btn-bands" class="pill-btn" type="button">Bands</button>


<div id="wrapper-seg" class="seg" data-state="maduro">

<button class="seg-btn" type="button" data-state="maduro">Maduro</button>

<button
id="wrapper-switch"
class="seg-switch"
type="button"
aria-label="Toggle wrapper"
></button>

<button class="seg-btn" type="button" data-state="natural">Natural</button>

</div>

</div>

</section>


<section class="brand-list" id="brand-list" aria-label="Cigars list"></section>

</main>


<section id="sheet-bands" class="sheet" hidden>

<div class="sheet-card" role="dialog" aria-modal="true" aria-label="Bands">

<div class="sheet-head">
<div class="sheet-title">Bands</div>
<button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
</div>

<div id="bands-options" class="bands-options"></div>

<div class="sheet-foot">
<button id="bands-confirm" class="sheet-apply" type="button">Confirm</button>
</div>

</div>

</section>


<section id="sheet-detail" class="detail-sheet" hidden>

<div class="detail-sheet__backdrop" data-detail-close></div>

<div class="detail-sheet__card old-detail-layout" role="dialog" aria-modal="true" aria-label="Cigar detail">

<button class="sheet-x detail-close-top" type="button" data-detail-close aria-label="Close">×</button>


<div class="detail-topbar">

<div class="detail-brand-icon-wrap">
<img id="detail-brand-icon" class="detail-brand-icon" src="" alt="" />
</div>

<div class="detail-title-wrap">

<div id="detail-brand" class="detail-brand"></div>

<h2 id="detail-name" class="detail-name"></h2>

<div id="detail-vitola" class="detail-vitola"></div>

</div>

</div>


<div class="detail-content">

<div class="detail-left">
<img id="detail-image" class="detail-stick old-detail-stick" src="" alt="" />
</div>


<div class="detail-right">

<div class="detail-grid old-detail-grid">

<div class="detail-box">
<div class="detail-box__label">Ring</div>
<div id="detail-ring" class="detail-box__value"></div>
</div>

<div class="detail-box">
<div class="detail-box__label">Length</div>
<div id="detail-length" class="detail-box__value"></div>
</div>

<div class="detail-box">
<div class="detail-box__label">Shape</div>
<div id="detail-shape" class="detail-box__value detail-box__value--sm"></div>
</div>

<div class="detail-box">
<div class="detail-box__label">Vitola</div>
<div id="detail-vitola-box" class="detail-box__value detail-box__value--sm"></div>
</div>

<div class="detail-panel">
<div class="detail-panel__row"><span>Wrapper</span><strong id="detail-wrapper"></strong></div>
<div class="detail-panel__row"><span>Binder</span><strong id="detail-binder"></strong></div>
<div class="detail-panel__row"><span>Filler</span><strong id="detail-filler"></strong></div>
<div class="detail-panel__row"><span>Origin</span><strong id="detail-origin"></strong></div>
</div>

<div class="detail-box detail-box--wide">
<div class="detail-box__label">Strength</div>
<div id="detail-strength" class="detail-box__value detail-box__value--sm"></div>
</div>

<div class="detail-box detail-box--wide">
<div class="detail-box__label">Wrapper Shade</div>
<div id="detail-shade" class="detail-box__value detail-box__value--sm"></div>
</div>

</div>

</div>

</div>


<div class="detail-actions">

<button class="detail-btn" type="button">Add</button>
<button class="detail-btn" type="button">Edit</button>
<button class="detail-btn" type="button">Compare</button>

</div>

</div>

</section>


<script defer src="/pos/cart.js?v=18"></script>
<script defer src="/pos/cigars/brand.js?v=18"></script>

</body>
</html>
