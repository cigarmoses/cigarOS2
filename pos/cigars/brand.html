<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brand</title>

<link rel="stylesheet" href="/css/type.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/pos.css">
<link rel="stylesheet" href="/pos/cigars/brand.css">

</head>

<body class="brand-page">

<header class="brand-header">

<button id="back-btn" class="icon-btn">
←
</button>

<div class="brand-title-wrap">
<img id="brand-icon-img" class="brand-icon">
<h1 id="brand-title">Brand</h1>
</div>

<button id="invoice-btn" class="invoice-btn">
<svg viewBox="0 0 24 24">
<path d="M7 4h-2l-1 2v2h2l3.6 7.6-1.35 2.45A2 2 0 0 0 10 21h10v-2H10.42a.25.25 0 0 1-.22-.37L11.1 17h5.45a2 2 0 0 0 1.8-1.1L21 9H7.42l-.94-2z"/>
</svg>
</button>

</header>

<div class="brand-search">

<input id="brand-search" placeholder="Search cigars">

</div>

<div class="brand-controls">

<button id="btn-filters" class="brand-btn">Filters</button>

<button id="btn-bands" class="brand-btn">Bands</button>

<div id="wrapper-switch" class="wrapper-toggle">
Maduro
</div>

</div>

<div id="brand-list" class="brand-list"></div>

<!-- FILTER MODAL -->

<div id="filters-modal" class="modal">

<div class="modal-card">

<h2>Filters</h2>

<div id="filters-body"></div>

<button id="filters-close">Close</button>

</div>

</div>

<!-- BANDS MODAL -->

<div id="bands-modal" class="modal">

<div class="modal-card">

<h2>Bands</h2>

<div id="bands-options"></div>

<button id="bands-close">Close</button>

</div>

</div>

<!-- CIGAR MODAL -->

<div id="cigar-modal" class="modal">

<div class="modal-card" id="cigar-modal-card"></div>

</div>

<script defer src="/pos/cart.js"></script>
<script defer src="/pos/cigars/brand.js"></script>

</body>
</html>
