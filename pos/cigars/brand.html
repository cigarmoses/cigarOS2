<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <!-- Global SF Pro + POS base styles -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />

  <!-- Brand styles -->
  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">

  <!-- Top bar -->
  <header class="brand-topbar">
    <button type="button" class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="brand-topbar-center">
      <h1 class="brand-title" id="brand-title">Brand</h1>
    </div>

    <div class="brand-topbar-right">
      <button type="button" class="icon-btn" id="brand-filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="brand-icon-wrap" aria-hidden="true">
        <img id="brand-icon-img" class="brand-icon" alt="" />
      </div>
    </div>
  </header>

  <!-- List -->
  <main class="brand-main">
    <ul class="brand-list" id="brand-list" aria-label="Cigars list"></ul>
  </main>

  <!-- Filters Modal (matches Cigars page style) -->
  <div class="pos-modal" id="filters-modal" aria-hidden="true">
    <div class="pos-modal__backdrop" data-close="filters"></div>

    <section class="pos-modal__sheet" role="dialog" aria-modal="true" aria-labelledby="filters-title">
      <header class="pos-modal__header">
        <div class="pos-modal__title" id="filters-title">Filters</div>
        <button class="pos-modal__close" type="button" aria-label="Close filters" data-close="filters">×</button>
      </header>

      <div class="pos-modal__content">
        <div class="filters-grid" id="filters-grid">
          <!-- Buttons injected by JS to keep ordering consistent -->
        </div>
      </div>

      <footer class="pos-modal__footer">
        <button type="button" class="btn-confirm" id="filters-confirm">Confirm</button>
      </footer>
    </section>
  </div>

  <script src="/pos/cart.js"></script>
  <script src="/pos/cigars/brand.js"></script>
</body>
</html>
