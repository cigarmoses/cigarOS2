<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Brand • CigarOS2</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/theme-toggle.css" />
  <link rel="stylesheet" href="/css/pos-brand.css" />
</head>

<body class="pos brand-pos">
  <!-- top chrome -->
  <header class="brand-topbar" role="banner">
    <!-- back -->
    <button id="brand-back" class="icon-btn icon-btn--back" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- centered theme toggle -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
      <span class="tt-track" aria-hidden="true">
        <img class="tt-ico tt-ico--sun" src="/img/icons/sun.svg" alt="" />
        <img class="tt-ico tt-ico--moon" src="/img/icons/moon.svg" alt="" />

        <span class="tt-knob" aria-hidden="true">
          <img class="tt-knob-ico tt-knob-ico--sun" src="/img/icons/sun.svg" alt="" />
          <img class="tt-knob-ico tt-knob-ico--moon" src="/img/icons/moon.svg" alt="" />
        </span>
      </span>
    </button>

    <!-- invoice/cart (top right) -->
    <button id="invoice-pill" class="icon-btn icon-btn--cart" type="button" aria-label="Invoice">
      <span class="cart-ico" aria-hidden="true">
        <img class="cart-img cart-img--empty" src="/img/icons/cart-blue.svg" alt="" />
        <img class="cart-img cart-img--hot" src="/img/icons/cart-red.svg" alt="" />
      </span>
    </button>
  </header>

  <main class="brand-wrap" role="main">
    <div class="brand-head">
      <div class="brand-title-row">
        <h1 id="brand-title" class="brand-title">Brand</h1>
        <div id="brand-icon" class="brand-icon" aria-hidden="true"></div>
      </div>

      <div class="brand-search bubble">
        <svg class="brand-search-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21"
                fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
        </svg>
        <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
      </div>

      <div class="brand-controls">
        <button id="btn-filters" class="pill-btn bubble" type="button">Filters</button>
        <button id="btn-bands" class="pill-btn bubble" type="button">Bands</button>
      </div>

      <!-- Maduro / Natural segmented -->
      <div id="wrapper-seg" class="seg bubble" data-state="all" role="group" aria-label="Wrapper filter">
        <button id="seg-maduro" class="seg-btn" type="button" aria-pressed="false">Maduro</button>
        <button id="seg-switch" class="seg-switch" type="button" aria-label="Switch wrapper filter">
          <span class="seg-dot" aria-hidden="true"></span>
        </button>
        <button id="seg-natural" class="seg-btn" type="button" aria-pressed="false">Natural</button>
      </div>
    </div>

    <div class="brand-divider"></div>

    <div id="brand-status" class="brand-status" aria-live="polite"></div>
    <div id="brand-list" class="brand-list" role="list"></div>
  </main>

  <!-- shared sheet backdrop used by Bands/Receipt -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

  <!-- Bands sheet -->
  <section id="sheet-bands" class="sheet" hidden aria-hidden="true">
    <div class="sheet-hd">
      <div class="sheet-title">Bands</div>
      <button type="button" class="sheet-x" data-sheet-close aria-label="Close">×</button>
    </div>
    <div class="sheet-bd">
      <div id="bands-options" class="bands-options"></div>
    </div>
    <div class="sheet-ft">
      <button id="bands-confirm" class="sheet-primary" type="button">Done</button>
    </div>
  </section>

  <!-- Receipt sheet placeholder (brand.js references it) -->
  <section id="sheet-receipt" class="sheet" hidden aria-hidden="true"></section>

  <!-- scripts -->
  <script defer src="/js/theme-toggle.js"></script>
  <script defer src="/pos/cigars/brand.js?v=13.0"></script>
</body>
</html>
