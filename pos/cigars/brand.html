<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <!-- Global typography + POS base -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />

  <!-- Brand page styles -->
  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">
  <!-- Top bar -->
  <header class="brand-topbar">
    <button class="brand-back icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
      </svg>
    </button>

    <div class="brand-topbar-right">
      <img id="brand-icon" class="brand-icon" alt="" />
    </div>
  </header>

  <main class="brand-main">
    <h1 class="brand-title" id="brand-title">Brand</h1>

    <!-- Search -->
    <section class="brand-search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input
          id="search-input"
          type="search"
          class="search-input"
          placeholder="Search..."
          autocomplete="off"
        />
      </div>
    </section>

    <!-- Controls row (4 buttons) -->
    <section class="brand-controls" aria-label="Brand controls">
      <button type="button" class="ctrl-btn" id="btn-filters">
        <span class="ctrl-ico" aria-hidden="true">≡</span>
        <span>Filters</span>
      </button>

      <button type="button" class="ctrl-btn" id="btn-bandart">
        <span class="ctrl-ico" aria-hidden="true">🖼️</span>
        <span>Band Art</span>
      </button>

      <button type="button" class="ctrl-toggle" id="toggle-maduro" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span>
        <span>Maduro</span>
      </button>

      <button type="button" class="ctrl-toggle" id="toggle-natural" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span>
        <span>Natural</span>
      </button>
    </section>

    <!-- List -->
    <section class="brand-list" aria-label="Cigars list">
      <div id="list" class="cigar-list"></div>

      <div id="empty" class="empty-state" hidden>
        No cigars found.
      </div>
    </section>
  </main>

  <!-- Filters Modal -->
  <div class="modal" id="filters-modal" aria-hidden="true">
    <div class="modal-scrim" data-close="filters-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="filters-title">
      <div class="modal-head">
        <h2 id="filters-title">Filters</h2>
        <button class="modal-x" type="button" data-close="filters-modal" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="modal-search">
          <span class="search-ico" aria-hidden="true">🔎</span>
          <input id="filters-search" type="search" placeholder="search..." />
        </div>

        <div class="segmented" role="tablist" aria-label="Filter type">
          <button class="seg-btn is-on" type="button" data-filter-type="Vitola" role="tab" aria-selected="true">Vitola</button>
          <button class="seg-btn" type="button" data-filter-type="Wrapper Shade" role="tab" aria-selected="false">Shade</button>
          <button class="seg-btn" type="button" data-filter-type="Shape" role="tab" aria-selected="false">Shape</button>
          <button class="seg-btn" type="button" data-filter-type="Strength" role="tab" aria-selected="false">Strength</button>
          <button class="seg-btn" type="button" data-filter-type="RG" role="tab" aria-selected="false">Ring</button>
          <button class="seg-btn" type="button" data-filter-type="Length" role="tab" aria-selected="false">Length</button>
        </div>

        <div class="picklist" id="filters-list" aria-label="Filter values">
          <!-- built by JS -->
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn-secondary" type="button" data-close="filters-modal">Cancel</button>
        <button class="btn-primary" type="button" id="filters-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Band Art Modal (Padron only) -->
  <div class="modal" id="bandart-modal" aria-hidden="true">
    <div class="modal-scrim" data-close="bandart-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bandart-title">
      <div class="modal-head">
        <h2 id="bandart-title">Band Art</h2>
        <button class="modal-x" type="button" data-close="bandart-modal" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="picklist" id="bandart-list" aria-label="Band art options">
          <!-- built by JS -->
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn-secondary" type="button" data-close="bandart-modal">Cancel</button>
        <button class="btn-primary" type="button" id="bandart-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/pos/cigars/brand.js"></script>
</body>
</html>
