<!-- /pos/cigars/brand.html (FULL FILE REPLACEMENT) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <!-- Global SF Pro + POS base styles -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />

  <!-- Brand styles -->
  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">

  <!-- Top bar -->
  <header class="brand-topbar">
    <button type="button" class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="brand-main">

    <!-- Brand header -->
    <section class="brand-title-row">
      <h1 class="brand-title" id="brand-title">Brand</h1>

      <!-- brand icon -->
      <div class="brand-icon" id="brand-icon" aria-hidden="true"></div>
    </section>

    <!-- Search -->
    <section class="brand-search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
    </section>

    <!-- Controls -->
    <section class="brand-controls" aria-label="Brand controls">
      <button class="pill-btn" id="btn-filters" type="button" aria-haspopup="dialog">Filters</button>
      <button class="pill-btn" id="btn-bands" type="button" aria-haspopup="dialog">Bands</button>

      <!-- Maduro / Natural toggle -->
      <div class="seg" id="wrapper-seg" data-state="all" role="group" aria-label="Wrapper toggle">
        <button class="seg-btn" id="seg-maduro" type="button" aria-pressed="false">Maduro</button>
        <button class="seg-dot" id="seg-switch" type="button" aria-label="Toggle Maduro/Natural"></button>
        <button class="seg-btn" id="seg-natural" type="button" aria-pressed="false">Natural</button>
      </div>
    </section>

    <!-- ✅ Applied filters row (shows on page, with X buttons) -->
    <section class="brand-applied" id="brand-applied" hidden aria-label="Applied filters"></section>

    <!-- List -->
    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>

    <!-- Load / error -->
    <p class="brand-status" id="brand-status" hidden></p>
  </main>

  <!-- Receipt button (bottom-right) -->
  <button type="button" class="receipt-fab" id="receipt-open" aria-label="Receipt">
    <img src="/img/icons/receipt.png" alt="" />
    <span class="receipt-badge" id="receipt-count" hidden>0</span>
  </button>

  <!-- Bottom sheet backdrop -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

  <!-- Bottom sheet: Receipt -->
  <section class="sheet" id="sheet-receipt" role="dialog" aria-modal="true" aria-label="Receipt" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <h2>Receipt</h2>
      <button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body">
      <div class="receipt-items" id="receipt-items"></div>
    </div>

    <footer class="sheet-footer">
      <button class="sheet-btn" type="button" id="receipt-clear">Clear</button>
      <button class="sheet-btn primary" type="button" data-sheet-close>Close</button>
    </footer>
  </section>

  <!-- Centered popup: Bands (white card) -->
  <section class="sheet bands-sheet" id="sheet-bands" role="dialog" aria-modal="true" aria-label="Bands" hidden>
    <header class="sheet-header bands-header">
      <h2>Filter by band art</h2>
      <button class="sheet-x bands-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <div class="sheet-body bands-body">
      <div class="bands-list" id="bands-options"></div>
    </div>

    <footer class="sheet-footer bands-footer">
      <button class="sheet-btn primary bands-confirm" type="button" id="bands-confirm">Confirm</button>
    </footer>
  </section>

  <!-- ✅ NEW FILTERS POPUP (mirrors Cigars home layout + drilldown + back) -->
  <section class="sheet filters-sheet" id="sheet-filters" role="dialog" aria-modal="true" aria-label="Filters" hidden>
    <header class="filters-top">
      <button type="button" class="filters-back" id="filters-back" aria-label="Back" hidden>←</button>
      <h2 class="filters-title" id="filters-title">Filters</h2>
      <button class="filters-x" type="button" data-sheet-close aria-label="Close">×</button>
    </header>

    <!-- applied chips inside modal -->
    <div class="filters-applied" id="filters-applied" hidden></div>

    <!-- main menu (grid) -->
    <div class="filters-main" id="filters-main">
      <div class="filters-card">
        <div class="filters-grid">

          <!-- Row 1 (3): Ring, Wrapper Shade, Vitolas -->
          <div class="filters-row filters-row--shade3">
            <button class="filter-pill pill-compact" type="button" data-fm-open="ring">Ring</button>
            <button class="filter-pill pill-nowrap" type="button" data-fm-open="shade">Wrapper Shade</button>
            <button class="filter-pill pill-compact" type="button" data-fm-open="vitola">Vitolas</button>
          </div>

          <!-- Row 2 (3): Flavored, Box-Pressed, Strength -->
          <div class="filters-row filters-row--3">
            <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="flavored">Flavored</button>
            <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="boxpressed">Box-Pressed</button>
            <button class="filter-pill" type="button" data-fm-open="strength">Strength</button>
          </div>

          <!-- VIEW ALL -->
          <div class="filters-viewall">
            <button type="button" class="filters-viewall-btn" id="filters-viewall">view all</button>
          </div>

          <div class="filters-expanded" id="filters-expanded" hidden>
            <div class="filters-row filters-row--wrap">
              <button class="filter-pill" type="button" data-fm-open="length">Length</button>
              <button class="filter-pill" type="button" data-fm-open="shape">Shape</button>
              <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="tin">Tin</button>
              <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="pack">Packs</button>
              <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="barberpole">Barberpole</button>
              <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="tubo">Tubo</button>
              <button class="filter-pill filter-pill--toggle" type="button" data-fm-toggle="favorite">Favorite</button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- drilldown list view -->
    <div class="filters-sub" id="filters-sub" hidden>
      <div class="filters-search-row">
        <div class="filters-search">
          <span class="filters-search-ico" aria-hidden="true">🔎</span>
          <input id="filters-search" type="search" placeholder="search..." autocomplete="off" />
        </div>
      </div>
      <div class="filters-list" id="filters-list"></div>
    </div>

    <footer class="filters-footer">
      <button class="filters-confirm" type="button" id="filters-confirm">Confirm</button>
    </footer>
  </section>

  <script src="/pos/cart.js"></script>
  <script src="/pos/cigars/brand.js"></script>
</body>
</html>
