<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/cigars/brand.css?v=20251231-1" />
</head>

<body class="brand-page">

  <!-- Top bar -->
  <header class="brand-topbar">
    <button type="button" class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="brand-topbar-title">
      <div class="brand-name" id="brand-title">Brand</div>
    </div>

    <div class="brand-topbar-right">
      <button type="button" class="icon-btn" id="brand-filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="brand-badge">
        <img id="brand-icon-img" alt="" />
      </div>
    </div>
  </header>

  <!-- Controls (SEARCH + BUTTONS + TOGGLE) -->
  <section class="brand-controls">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input id="brand-search" type="search" placeholder="Search..." autocomplete="off" />
    </div>

    <div class="control-row">
      <button class="pill-btn" id="btn-filters" type="button">Filters</button>
      <button class="pill-btn" id="btn-bands" type="button">Bands</button>

      <div class="shade-toggle" role="group" aria-label="Maduro Natural toggle">
        <span class="shade-label shade-left" id="shade-maduro-label">Maduro</span>
        <button class="shade-switch" id="shade-toggle" type="button" aria-label="Toggle shade"></button>
        <span class="shade-label shade-right" id="shade-natural-label">Natural</span>
      </div>
    </div>
  </section>

  <!-- List -->
  <main class="brand-main">
    <ul class="brand-list" id="brand-list" aria-label="Cigars list"></ul>
  </main>

  <!-- Filters Modal -->
  <div class="modal" id="filters-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="filters"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="filters-title">
      <div class="modal-head">
        <div class="modal-title" id="filters-title">Filters</div>
        <button class="modal-x" type="button" data-close="filters" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="filters-grid" id="filters-grid"></div>
      </div>

      <div class="modal-foot">
        <button class="btn-confirm" id="filters-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Bands Modal (placeholder) -->
  <div class="modal" id="bands-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="bands"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bands-title">
      <div class="modal-head">
        <div class="modal-title" id="bands-title">Bands</div>
        <button class="modal-x" type="button" data-close="bands" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="bands-note">Bands UI goes here (kept intact so your page isn’t missing buttons).</div>
      </div>

      <div class="modal-foot">
        <button class="btn-confirm" id="bands-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/pos/cart.js"></script>
  <script src="/pos/cigars/brand.js?v=20251231-1"></script>
</body>
</html>
