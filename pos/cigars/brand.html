<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • Brand</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    .topbar {
      display:flex;
      align-items:center;
      gap:6px;
      padding:16px 16px 4px;
      font-weight:600;
    }
    .back-btn { display:flex; gap:4px; align-items:center; cursor:pointer; }

    .page-wrap { padding:0 16px 80px; }

    .brand-title-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:6px 0 12px;
    }
    .brand-title {
      font-size:2rem;
      font-weight:700;
    }
    .fav-star {
      width:32px;
      height:32px;
      border-radius:999px;
      background:#f7c948;
      display:grid;
      place-items:center;
    }

    .search-box {
      background:#fff;
      border-radius:999px;
      display:flex;
      align-items:center;
      padding:10px 16px;
      margin-bottom:18px;
    }
    .search-input {
      border:0;
      outline:0;
      background:transparent;
      width:100%;
      font-size:.9rem;
    }

    .cigar-list {
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* cigar card */
    .cigar-row {
      display:flex;
      align-items:center;
      gap:12px;
      background:var(--card);
      border-radius:20px;
      padding:12px 14px;
      box-shadow:0 8px 22px rgba(14,25,35,0.05);
      cursor:pointer;
    }
    .cigar-icon {
      width:54px;
      height:54px;
      border-radius:18px;
      background:#3a3029;
      display:grid;
      place-items:center;
      overflow:hidden;
      flex:0 0 54px;
    }
    .cigar-icon img {
      width:46px;
      height:46px;
      object-fit:contain;
    }
    .cigar-info {
      flex:1;
      min-width:0;
    }
    .cigar-line {
      font-weight:700;
      font-size:.9rem;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cigar-vitola {
      font-size:.8rem;
      color:var(--muted);
      margin-top:2px;
    }
    .cigar-price {
      font-size:.8rem;
      color:var(--ink);
      margin-top:2px;
    }
    .qty-pill {
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid rgba(15,26,44,0.12);
      display:grid;
      place-items:center;
      font-weight:600;
      background:#fff;
      flex:0 0 44px;
    }

    .error-msg { color:#a33; margin-top:16px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <span style="font-size:1.2rem;">←</span>
      <span>Cigars</span>
    </div>
  </div>

  <div class="page-wrap">
    <div class="brand-title-row">
      <div class="brand-title" id="brandTitle">Brand</div>
      <div class="fav-star">★</div>
    </div>

    <div class="search-box">
      <input id="searchInput" class="search-input" placeholder="Search this brand..." oninput="filterCigars()" />
    </div>

    <div class="cigar-list" id="cigarList"></div>
    <div id="errorBox" class="error-msg"></div>
  </div>

  <script>
    // brand from URL
    const url = new URL(window.location.href);
    const brandParam = url.searchParams.get('brand') || 'Pappy Van Winkle';
    document.getElementById('brandTitle').textContent = brandParam;

    let allCigars = [];
    let brandCigars = [];

    // normalize helper
    function norm(str) {
      return (str || "").toString().trim().toLowerCase();
    }

    // we try a few possible paths so it works on Netlify regardless of root
    const possiblePaths = [
      '../data/cigars_full.json',
      '/pos/data/cigars_full.json',
      '/data/cigars_full.json'
    ];

    loadJsonInOrder(possiblePaths);

    function loadJsonInOrder(paths, idx=0) {
      if (idx >= paths.length) {
        document.getElementById('errorBox').textContent = 'Could not load cigars.';
        return;
      }
      fetch(paths[idx])
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data => {
          allCigars = data;
          filterByBrand();
        })
        .catch(err => {
          // try next path
          loadJsonInOrder(paths, idx + 1);
        });
    }

    function filterByBrand() {
      const target = norm(brandParam);
      // match on Brand and MANUFACTURER, allow contains both ways
      brandCigars = allCigars.filter(row => {
        const b = norm(row["Brand"]);
        const m = norm(row["MANUFACTURER"]);
        return (
          b === target ||
          m === target ||
          (b && b.includes(target)) ||
          (target && target.includes(b)) ||
          (m && m.includes(target))
        );
      });
      renderList(brandCigars);
    }

    function slugify(str){
      return (str || "").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
    }

    function renderList(list){
      const wrap = document.getElementById('cigarList');
      wrap.innerHTML = '';
      if (!list || list.length === 0) {
        wrap.innerHTML = '<p style="color:#6a7586;">No cigars found for this brand.</p>';
        return;
      }

      list.forEach(cigar => {
        const line = cigar["Line"] ? cigar["Line"].toString().trim() : "";
        const cigarName = cigar["Cigar"] ? cigar["Cigar"].toString().trim() : "";
        const displayName = (line ? line + " " : "") + cigarName;

        const vitola = cigar["Vitola"] || "";
        const msrp = cigar["MSRP"] ? cigar["MSRP"].toString() : "";
        const inventory = cigar["Inventory"] != null ? cigar["Inventory"] : "";

        const brandSlug = slugify(cigar["Brand"] || "");

        const row = document.createElement('div');
        row.className = 'cigar-row';
        row.innerHTML = `
          <div class="cigar-icon">
            <img src="/img/icons/brands/${brandSlug}.svg" onerror="this.style.opacity='0'">
          </div>
          <div class="cigar-info">
            <div class="cigar-line">${displayName}</div>
            <div class="cigar-vitola">${vitola}</div>
            <div class="cigar-price">${msrp}</div>
          </div>
          <div class="qty-pill">${inventory}</div>
        `;
        wrap.appendChild(row);
      });
    }

    function filterCigars(){
      const val = norm(document.getElementById('searchInput').value);
      const filtered = brandCigars.filter(row => {
        const line = norm(row["Line"]);
        const cigar = norm(row["Cigar"]);
        const combined = (line + " " + cigar).trim();
        return combined.includes(val);
      });
      renderList(filtered);
    }
  </script>
</body>
</html>
