<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • CigarOS 2</title>
  <style>
    :root {
      --bg:#dfeaf0;
      --ink:#000000;
      --muted:#6a7586;
      --divider:#e4e7ea;
      --popup-bg:#ffffff;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      min-height:100vh;
    }

    /* Layout -------------------------------------------------- */
    .topbar{display:flex;align-items:center;gap:6px;padding:16px 16px 4px;font-weight:600;}
    .back-btn{display:flex;align-items:center;gap:4px;cursor:pointer;}
    .page-wrap{padding:0 16px 80px;}
    .brand-title-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px;}
    .brand-title{font-size:1.9rem;font-weight:700;}
    .fav-star{width:28px;height:28px;border-radius:50%;background:#f7c948;display:grid;place-items:center;}
    .search-box{background:#fff;border-radius:999px;display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:18px;}
    .search-input{border:0;outline:0;background:transparent;width:100%;font-size:.85rem;}
    .cigar-list{display:flex;flex-direction:column;gap:12px;}
    .cigar-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 6px 20px rgba(15,26,44,.05);cursor:pointer;}
    .cigar-icon{width:54px;height:54px;border-radius:18px;background:#3a3029;display:grid;place-items:center;overflow:hidden;}
    .cigar-icon img{width:46px;height:46px;object-fit:contain;}
    .cigar-info{flex:1;}
    .cigar-name{font-weight:700;font-size:.9rem;}
    .cigar-meta{font-size:.74rem;color:var(--muted);}
    .qty-pill{width:44px;height:44px;border-radius:50%;border:1px solid rgba(14,25,35,.15);display:grid;place-items:center;font-weight:600;background:#fff;}

    /* Popup --------------------------------------------------- */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:none;align-items:center;justify-content:center;padding:10px;}
    .popup{background:var(--popup-bg);border-radius:28px;width:94%;max-width:640px;max-height:92vh;overflow-y:auto;padding:16px 20px 24px;box-shadow:0 20px 40px rgba(0,0,0,.28);position:relative;}
    .popup-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .popup-icon{width:58px;height:58px;border-radius:18px;background:#3a2f28;display:grid;place-items:center;overflow:hidden;}
    .popup-icon img{width:70%;height:70%;object-fit:contain;}
    .popup-head-text{flex:1;}
    .popup-brand{font-weight:700;font-size:.95rem;margin:0;}
    .popup-cigar{font-weight:700;font-size:1.1rem;margin:2px 0;}
    .popup-msrp{font-size:.85rem;margin:0;}
    .popup-close{border:0;background:transparent;font-size:1.6rem;color:#d53434;font-weight:700;cursor:pointer;line-height:1;}
    .popup-divider{height:1px;background:var(--divider);margin-bottom:18px;}

    .popup-body{
      display:flex;
      align-items:flex-start;
      gap:36px;
    }
    .popup-img-col{
      width:38%;
      max-width:230px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }
    .popup-img-col img{
      width:100%;
      height:auto;
      max-height:70vh;
      object-fit:contain;
    }

    /* Adjusted right column position and font size */
    .popup-details{
      flex:1 1 58%;
      margin-left:42px;     /* pushes text right */
      margin-top:38px;      /* moves text down */
      min-width:0;
    }
    .spec-block{margin-bottom:14px;}
    .spec-label{
      font-family:"Helvetica Neue";
      font-weight:700;
      font-size:1.15rem;
      color:var(--ink);
    }
    .spec-value{
      font-family:"Helvetica Neue";
      font-weight:400;
      font-size:1.18rem;
      color:var(--ink);
    }

    @media(max-width:540px){
      .popup-body{gap:26px;}
      .popup-details{margin-left:18px;margin-top:18px;}
      .spec-label{font-size:1.05rem;}
      .spec-value{font-size:1.08rem;}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="history.back()"><span style="font-size:1.2rem;">←</span><span>Cigars</span></div>
  </div>

  <div class="page-wrap">
    <div class="brand-title-row">
      <div class="brand-title" id="brandTitle">Brand</div>
      <div class="fav-star">★</div>
    </div>
    <div class="search-box">
      <input id="searchInput" class="search-input" placeholder="Search this brand..." oninput="filterCigars()" />
    </div>
    <div class="cigar-list" id="cigarList"></div>
  </div>

  <!-- POPUP -->
  <div class="overlay" id="popupOverlay">
    <div class="popup" id="popup">
      <div class="popup-header">
        <div class="popup-icon"><img id="popupBrandIcon" src="" alt=""></div>
        <div class="popup-head-text">
          <p class="popup-brand" id="popupBrand">Brand</p>
          <p class="popup-cigar" id="popupCigar">Cigar name</p>
          <p class="popup-msrp" id="popupMsrp">MSRP —</p>
        </div>
        <button class="popup-close" onclick="closePopup()">×</button>
      </div>
      <div class="popup-divider"></div>

      <div class="popup-body" id="popupBody">
        <div class="popup-img-col" id="popupImgCol" style="display:none;">
          <img id="popupImg" src="" alt="cigar photo">
        </div>

        <div class="popup-details">
          <!-- RG x LENGTH and VITOLA shown without labels -->
          <div class="spec-block">
            <div class="spec-value" id="svSize" style="font-weight:700;"></div>
            <div class="spec-value" id="svVitola"></div>
          </div>
          <div class="spec-block"><div class="spec-label">WRAPPER SHADE</div><div class="spec-value" id="svWrapperShade">—</div></div>
          <div class="spec-block"><div class="spec-label">WRAPPER</div><div class="spec-value" id="svWrapper">—</div></div>
          <div class="spec-block"><div class="spec-label">BINDER</div><div class="spec-value" id="svBinder">—</div></div>
          <div class="spec-block"><div class="spec-label">FILLER</div><div class="spec-value" id="svFiller">—</div></div>
          <div class="spec-block"><div class="spec-label">ORIGIN</div><div class="spec-value" id="svOrigin">—</div></div>
          <div class="spec-block"><div class="spec-label">STRENGTH</div><div class="spec-value" id="svStrength">—</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const url = new URL(window.location.href);
    const brandParam = url.searchParams.get('brand') || 'Pappy Van Winkle';
    document.getElementById('brandTitle').textContent = brandParam;

    const hubCigars = [
      {brand:"Pappy Van Winkle",brandAka:"",name:"Pappy Van Winkle Flying Pig",msrp:"13.99",length:"4.00",ring:"56",vitola:"Perfecto",wrapperShade:"USA",origin:"Nicaragua",strength:"Full"},
      {brand:"La Aroma de Cuba",brandAka:"ladc",name:"Mi Amor Belicoso",msrp:"12.00",vitola:"Belicoso",origin:"Nicaragua",strength:"Medium-Full"}
    ];
    const brandCigars = hubCigars.filter(c=>c.brand===brandParam);

    function slugify(str){return(str||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");}

    function renderList(list){
      const wrap=document.getElementById('cigarList');wrap.innerHTML='';
      list.forEach(cigar=>{
        const row=document.createElement('div');
        row.className='cigar-row';
        row.innerHTML=`
          <div class="cigar-icon"><img src="/img/icons/brands/${slugify(cigar.brand)}.svg" onerror="this.style.opacity='0'"></div>
          <div class="cigar-info"><div class="cigar-name">${cigar.name}</div><div class="cigar-meta">${cigar.vitola||''}</div><div class="cigar-meta">${cigar.msrp||''}</div></div>
          <div class="qty-pill">0</div>`;
        row.addEventListener('click',()=>openPopup(cigar));wrap.appendChild(row);
      });
    }

    function openPopup(cigar){
      const popup=document.getElementById('popup');
      const popupImgCol=document.getElementById('popupImgCol');
      const popupImg=document.getElementById('popupImg');

      document.getElementById('popupBrand').textContent=cigar.brand;
      let cigarName=cigar.name;
      if(cigarName.toLowerCase().startsWith(cigar.brand.toLowerCase())) cigarName=cigarName.slice(cigar.brand.length).trim();
      document.getElementById('popupCigar').textContent=cigarName;
      document.getElementById('popupMsrp').textContent=cigar.msrp||'—';

      document.getElementById('svSize').textContent=cigar.ring&&cigar.length?`${cigar.ring} x ${cigar.length}”`:'';
      document.getElementById('svVitola').textContent=cigar.vitola||'';

      document.getElementById('svWrapperShade').textContent=cigar.wrapperShade||'—';
      document.getElementById('svWrapper').textContent=cigar.wrapper||'—';
      document.getElementById('svBinder').textContent=cigar.binder||'—';
      document.getElementById('svFiller').textContent=cigar.filler||'—';
      document.getElementById('svOrigin').textContent=cigar.origin||'—';
      document.getElementById('svStrength').textContent=cigar.strength||'—';

      const brandSlug=slugify(cigar.brand);
      const brandAka=cigar.brandAka?slugify(cigar.brandAka):"";
      document.getElementById('popupBrandIcon').src=`/img/icons/brands/${brandSlug}.svg`;

      let cigarSlug=slugify(cigar.name);
      if(cigarSlug.startsWith(brandSlug)) cigarSlug=cigarSlug.slice(brandSlug.length);
      const akaPath=brandAka?`/img/cigars/${brandAka}${cigarSlug}.png`:"";
      const normalPath=`/img/cigars/${brandSlug}${cigarSlug}.png`;

      if(brandAka){
        const testImg=new Image();
        testImg.onload=function(){popupImg.src=akaPath;popupImgCol.style.display='flex';popup.classList.remove('no-image');};
        testImg.onerror=function(){fallbackToNormal();};
        testImg.src=akaPath;
      }else fallbackToNormal();

      function fallbackToNormal(){
        const testImg2=new Image();
        testImg2.onload=function(){popupImg.src=normalPath;popupImgCol.style.display='flex';popup.classList.remove('no-image');};
        testImg2.onerror=function(){popupImgCol.style.display='none';popup.classList.add('no-image');};
        testImg2.src=normalPath;
      }

      document.getElementById('popupOverlay').style.display='flex';
    }
    function closePopup(){document.getElementById('popupOverlay').style.display='none';}
    renderList(brandCigars);
  </script>
</body>
</html>
