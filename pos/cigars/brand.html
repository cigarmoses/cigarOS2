<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Brand</title>

  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">
  <!-- Top bar -->
  <header class="brand-topbar">
    <button class="icon-btn" id="brand-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="brand-main">
    <!-- Title row: title left, icon right (same row) -->
    <div class="brand-title-row">
      <h1 class="brand-title" id="brand-title">Brand</h1>
      <img class="brand-icon" id="brand-icon" alt="Brand icon" />
    </div>

    <!-- Search -->
    <section class="brand-search" aria-label="Search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="brand-search" type="search" placeholder="Search..." autocomplete="off" />
      </div>
    </section>

    <!-- Controls -->
    <section class="brand-controls" aria-label="Controls">
      <button class="pill-btn" id="btn-filters" type="button" aria-haspopup="dialog">
        <span class="pill-ico" aria-hidden="true">
          <!-- 3 lines, different widths -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 7h14" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M5 12h10" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M5 17h12" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </span>
        Filters
      </button>

      <button class="pill-btn" id="btn-bands" type="button" aria-haspopup="dialog">
        Bands
      </button>

      <!-- Padron-only segmented control -->
      <div class="seg" id="padron-seg" aria-label="Padron wrapper selector">
        <button class="seg-btn" id="seg-maduro" type="button" aria-pressed="false">
          Maduro
        </button>
        <div class="seg-dot" aria-hidden="true"></div>
        <button class="seg-btn" id="seg-natural" type="button" aria-pressed="false">
          Natural
        </button>
      </div>
    </section>

    <!-- List -->
    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>
  </main>

  <!-- Filters Modal -->
  <div class="modal" id="modal-filters" aria-hidden="true" role="dialog" aria-label="Filters">
    <div class="modal-scrim" data-close="1"></div>
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Filters</div>
        <button class="modal-x" type="button" data-close="1" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-empty">Filters coming next.</div>
      </div>
      <div class="modal-foot">
        <button class="modal-btn ghost" type="button" data-close="1">Close</button>
        <button class="modal-btn primary" type="button" data-close="1">OK</button>
      </div>
    </div>
  </div>

  <!-- Bands Modal -->
  <div class="modal" id="modal-bands" aria-hidden="true" role="dialog" aria-label="Bands">
    <div class="modal-scrim" data-close="1"></div>
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Bands</div>
        <button class="modal-x" type="button" data-close="1" aria-label="Close">✕</button>
      </div>

      <div class="modal-body">
        <div class="modal-note">Pick</div>

        <div class="bandart-list">
          <label class="bandart-item">
            <input type="radio" name="bandart" value="1964" />
            1964 Anniversary Series
          </label>

          <label class="bandart-item">
            <input type="radio" name="bandart" value="1926" />
            1926 Serie
          </label>

          <label class="bandart-item">
            <input type="radio" name="bandart" value="damaso" />
            Damaso
          </label>
        </div>
      </div>

      <div class="modal-foot">
        <button class="modal-btn ghost" id="bands-clear" type="button">Clear</button>
        <button class="modal-btn primary" id="bands-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Script BEFORE closing body ✅ -->
  <script src="/pos/cigars/brand.js"></script>
</body>
</html>
