<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS • Brand</title>

  <link rel="stylesheet" href="/css/type.css?v=34" />
  <link rel="stylesheet" href="/pos/pos.css?v=34" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css?v=34" />
  <link rel="stylesheet" href="/pos/cigars/brand.css?v=34" />
</head>

<body class="brand-page">
  <header class="brand-topbar">
    <button id="back-btn" class="brand-back" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.5 19.5L8 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="brand-topbar-spacer" aria-hidden="true"></div>

    <div class="brand-theme-dock">
      <button id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="true">
        <span class="track" aria-hidden="true"></span>
        <span class="knob" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23 5.46 5.46"></path>
            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 3.5a8 8 0 1 0 6 13.3A9 9 0 0 1 14.5 3.5Z" fill="currentColor"></path>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <main class="brand-main">
    <section class="brand-header">
      <div class="brand-title-row">
        <div class="brand-title-block">
          <h1 id="brand-title" class="brand-title">Brand</h1>
          <div class="brand-manufacturer" style="display:none;"></div>
        </div>

        <div id="brand-icon" class="brand-icon">
          <img id="brand-icon-img" src="" alt="" />
        </div>
      </div>

      <div class="brand-search">
        <div class="search-wrap">
          <span class="search-ico" aria-hidden="true">🔎</span>
          <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
        </div>
      </div>

      <div class="brand-controls">
        <button id="btn-filters" class="pill-btn" type="button">Filters</button>
        <button id="btn-bands" class="pill-btn" type="button">Bands</button>

        <div id="wrapper-seg" class="seg" data-state="maduro">
          <button class="seg-btn" type="button" data-state="maduro">Maduro</button>
          <button id="wrapper-switch" class="seg-switch" type="button" aria-label="Toggle wrapper"></button>
          <button class="seg-btn" type="button" data-state="natural">Natural</button>
        </div>
      </div>
    </section>

    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>
  </main>

  <nav class="cigars-bottom-bar" aria-label="Primary">
    <div class="cigars-bottom-bar-inner">
      <button type="button" class="cb-nav-btn" id="brandSearchBtn" aria-label="Search">
        <img class="cb-nav-icon" src="/uxui/bottombar/search.svg" alt="">
        <span>Search</span>
      </button>

      <a class="cb-nav-btn" href="/" aria-label="Home">
        <img class="cb-nav-icon" src="/uxui/bottombar/home.svg" alt="">
        <span>Home</span>
      </a>

      <a class="cb-nav-btn" href="/pos/favorites/" aria-label="Favorites">
        <img class="cb-nav-icon" src="/uxui/bottombar/favorites.svg" alt="">
        <span>Favorites</span>
      </a>

      <a class="cb-nav-btn" href="/pos/invoice/" aria-label="Cart">
        <img class="cb-nav-icon" src="/uxui/bottombar/cart.svg" alt="">
        <span>Cart</span>
        <span class="cb-nav-badge" data-cart-badge hidden>0</span>
      </a>
    </div>
  </nav>

  <section id="sheet-bands" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Bands">
      <div class="sheet-head">
        <div class="sheet-title">Bands</div>
        <button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
      </div>

      <div id="bands-options" class="bands-options"></div>

      <div class="sheet-foot">
        <button id="bands-confirm" class="sheet-apply" type="button">Confirm</button>
      </div>
    </div>
  </section>

  <script defer src="/pos/cart.js?v=34"></script>
  <script defer src="/pos/pos.js?v=34"></script>
  <script defer src="/pos/cigars/brand.js?v=34"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("theme") || root.getAttribute("data-theme") || "dark";

      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (toggle) toggle.setAttribute("aria-pressed", String(next === "dark"));
      }

      applyTheme(saved);

      toggle?.addEventListener("click", () => {
        applyTheme((root.getAttribute("data-theme") || "dark") === "dark" ? "light" : "dark");
      });
    })();
  </script>
</body>
</html>
