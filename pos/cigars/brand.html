<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cigars • Brand</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
      --accent: #f7c948;
      --radius-lg: 28px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 16px 0 16px;
    }
    .back-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
      color: var(--ink);
    }
    .fav-btn {
      margin-left: auto;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: #f3c748;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #0f1a2c;
      border: none;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      margin: 0;
    }
    .search-wrap {
      padding: 16px;
    }
    .search-input {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 16px;
      background: #fff;
      outline: none;
    }
    .list-wrap {
      padding: 0 16px 90px 16px;
    }
    .cigar-card {
      background: #fff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px 16px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(15,26,44,0.05);
      cursor: pointer;
    }
    .cigar-thumb {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      background: #f7f7f7;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* REMOVE black border */
      border: none;
    }
    .cigar-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
    }
    .cigar-meta {
      flex: 1 1 auto;
      min-width: 0;
    }
    .cigar-name {
      font-weight: 700;
      font-size: 20px;
      line-height: 1.1;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cigar-vitola {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.1;
    }
    .cigar-price {
      color: var(--muted);
      font-size: 15px;
      margin-top: 4px;
    }
    .qty-pill {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      background: #fff;
      border: 2.5px solid rgba(15,26,44,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
      flex: 0 0 auto;
    }

    /* receipt button bottom right */
    .receipt-fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #0f1a2c;
      border-radius: 999px;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 20px 10px 10px;
      box-shadow: 0 10px 30px rgba(15,26,44,.25);
      z-index: 5;
    }
    .receipt-icon {
      width: 49px;
      height: 49px;
      background: #fff;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .receipt-count {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: #d72828;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .receipt-total {
      color: #fff;
      font-weight: 700;
      font-size: 16px;
    }

    /* MODAL */
    .cigar-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.28);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }
    .cigar-modal-backdrop.show {
      display: flex;
    }
    .cigar-modal {
      background: #fff;
      border-radius: 30px;
      width: min(960px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(15,26,44,.2);
    }
    .cigar-modal-header {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 18px 20px 14px 20px;
    }
    .cigar-modal-brandicon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cigar-modal-brandicon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cigar-modal-titleblock {
      flex: 1 1 auto;
    }
    .cigar-modal-titleblock .brand {
      font-weight: 700;
      font-size: 18px;
    }
    .cigar-modal-titleblock .cigar {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      margin-top: 2px;
    }
    .cigar-modal-titleblock .msrp {
      margin-top: 6px;
      font-size: 16px;
    }
    .cigar-modal-close {
      border: none;
      background: none;
      font-size: 26px;
      cursor: pointer;
      color: #d72626;
    }
    .cigar-modal-divider {
      height: 1px;
      background: rgba(0,0,0,.06);
      margin: 0 20px 0 20px;
    }
    .cigar-modal-body {
      display: flex;
      gap: 18px;
      padding: 20px;
      overflow-y: auto;
      max-height: 70vh;
    }
    /* LEFT COLUMN – cigar image */
    .cigar-modal-imagewrap {
      flex: 0 0 38%;
      max-width: 38%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
    }
    .cigar-modal-imagewrap img {
      width: auto;
      height: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
    }
    /* RIGHT COLUMN – details */
    .cigar-modal-info {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: flex-start;
      padding-top: 6px;
    }
    .cigar-detail-label {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 2px;
    }
    .cigar-detail-value {
      font-size: 16px;
      margin-bottom: 6px;
    }

    @media (max-width: 760px) {
      .cigar-modal {
        height: 92vh;
      }
      .cigar-modal-body {
        flex-direction: row;
      }
      .cigar-modal-imagewrap {
        flex: 0 0 42%;
        max-width: 42%;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="back-btn" href="/pos/">&larr;</a>
    <h1 id="brandTitle">Cigars</h1>
    <button class="fav-btn" type="button">&#9733;</button>
  </header>
  <div class="search-wrap">
    <input id="searchInput" class="search-input" placeholder="Search this brand..." />
  </div>
  <div class="list-wrap" id="cigarList">
    <!-- cards inject here -->
  </div>

  <!-- receipt button -->
  <div class="receipt-fab">
    <div class="receipt-icon">
      <!-- little receipt icon could be img -->
      <div style="width:22px;height:28px;background:#0f1a2c;border-radius:4px;opacity:.15"></div>
    </div>
    <div class="receipt-count">4</div>
    <div class="receipt-total">$24.50</div>
  </div>

  <!-- modal -->
  <div class="cigar-modal-backdrop" id="cigarModal">
    <div class="cigar-modal">
      <div class="cigar-modal-header">
        <div class="cigar-modal-brandicon" id="modalBrandIcon"></div>
        <div class="cigar-modal-titleblock">
          <div class="brand" id="modalBrand"></div>
          <div class="cigar" id="modalCigar"></div>
          <div class="msrp" id="modalMSRP"></div>
        </div>
        <button class="cigar-modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="cigar-modal-divider"></div>
      <div class="cigar-modal-body">
        <div class="cigar-modal-imagewrap">
          <img id="modalCigarImg" src="" alt="Cigar photo" onerror="this.style.display='none';" />
        </div>
        <div class="cigar-modal-info">
          <div>
            <div class="cigar-detail-label" id="modalSize"></div>
            <div class="cigar-detail-value" id="modalVitola"></div>
          </div>
          <div>
            <div class="cigar-detail-label">Shade</div>
            <div class="cigar-detail-value" id="modalShade">—</div>
          </div>
          <div>
            <div class="cigar-detail-label">Wrapper</div>
            <div class="cigar-detail-value" id="modalWrapper">—</div>
          </div>
          <div>
            <div class="cigar-detail-label">Binder</div>
            <div class="cigar-detail-value" id="modalBinder">—</div>
          </div>
          <div>
            <div class="cigar-detail-label">Filler</div>
            <div class="cigar-detail-value" id="modalFiller">—</div>
          </div>
          <div>
            <div class="cigar-detail-label">Origin</div>
            <div class="cigar-detail-value" id="modalOrigin">—</div>
          </div>
          <div>
            <div class="cigar-detail-label">Strength</div>
            <div class="cigar-detail-value" id="modalStrength">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const brandParam = (params.get('brand') || '').trim();
  const brandTitle = document.getElementById('brandTitle');
  const listEl = document.getElementById('cigarList');
  const searchInput = document.getElementById('searchInput');

  if (brandParam) {
    brandTitle.textContent = brandParam;
  }

  let cigarsForBrand = [];

  // ---- helpers
  function slugify(str) {
    return (str || '')
      .toLowerCase()
      .replace(/&/g, 'and')
      .replace(/[^a-z0-9]+/g, '');
  }

  function buildCigarImagePath(item) {
    // try brand aka first
    const aka = item["Brand aka"] || item["Brand AKA"] || "";
    const brand = item["Brand"] || "";
    const brandFolder = slugify(aka || brand);
    const fullName = ((item["Line"] || "") + " " + (item["Cigar"] || "")).trim();
    const cigarSlug = slugify(fullName);
    if (!brandFolder || !cigarSlug) return "";
    // your pattern: /img/cigars/{brandFolder}/{brandFolder}{cigarSlug}.png
    // BUT you have some like /img/cigars/acid/acid1400cc.png
    // so we try two options
    const opt1 = `/img/cigars/${brandFolder}/${brandFolder}${cigarSlug}.png`;
    const opt2 = `/img/cigars/${brandFolder}/${cigarSlug}.png`;
    return {opt1, opt2};
  }

  function renderList(rows) {
    listEl.innerHTML = '';
    rows.forEach(row => {
      const card = document.createElement('div');
      card.className = 'cigar-card';
      card.addEventListener('click', () => openModal(row));

      const thumb = document.createElement('div');
      thumb.className = 'cigar-thumb';
      const img = document.createElement('img');
      img.src = (row["Brand IMG"] || "").trim();
      img.alt = row["Brand"] || "";
      thumb.appendChild(img);

      const meta = document.createElement('div');
      meta.className = 'cigar-meta';
      const h = document.createElement('div');
      // display name = Line + Cigar
      const line = (row["Line"] || "").trim();
      const cigar = (row["Cigar"] || "").trim();
      const displayName = (line ? line + ' ' : '') + cigar;
      h.className = 'cigar-name';
      h.textContent = displayName;
      const v = document.createElement('div');
      v.className = 'cigar-vitola';
      v.textContent = (row["Vitola"] || "").trim();
      const p = document.createElement('div');
      p.className = 'cigar-price';
      p.textContent = (row["MSRP"] || "").trim();
      meta.appendChild(h);
      meta.appendChild(v);
      meta.appendChild(p);

      const qty = document.createElement('div');
      qty.className = 'qty-pill';
      qty.textContent = '89';

      card.appendChild(thumb);
      card.appendChild(meta);
      card.appendChild(qty);

      listEl.appendChild(card);
    });
  }

  // ---- modal
  const modal = document.getElementById('cigarModal');
  const modalBrandIcon = document.getElementById('modalBrandIcon');
  const modalBrand = document.getElementById('modalBrand');
  const modalCigar = document.getElementById('modalCigar');
  const modalMSRP = document.getElementById('modalMSRP');
  const modalImg = document.getElementById('modalCigarImg');
  const modalSize = document.getElementById('modalSize');
  const modalVitola = document.getElementById('modalVitola');
  const modalShade = document.getElementById('modalShade');
  const modalWrapper = document.getElementById('modalWrapper');
  const modalBinder = document.getElementById('modalBinder');
  const modalFiller = document.getElementById('modalFiller');
  const modalOrigin = document.getElementById('modalOrigin');
  const modalStrength = document.getElementById('modalStrength');
  const modalClose = document.getElementById('modalClose');

  function openModal(row) {
    modalBrandIcon.innerHTML = '';
    if (row["Brand IMG"]) {
      const bi = document.createElement('img');
      bi.src = row["Brand IMG"];
      modalBrandIcon.appendChild(bi);
    }

    modalBrand.textContent = (row["Brand"] || "").trim();
    modalCigar.textContent = (((row["Line"] || "") + " " + (row["Cigar"] || "")).trim());
    modalMSRP.textContent = (row["MSRP"] || "").trim();

    const rg = (row["RG"] || "").trim();
    const len = (row["LENGTH"] || "").trim();
    modalSize.textContent = (rg || len) ? `${rg ? rg : ''}${rg && len ? ' x ' : ''}${len ? len + '”' : ''}` : '';
    modalVitola.textContent = (row["Vitola"] || "").trim();

    modalShade.textContent = (row["WRAPPER SHADE"] || row["Wrapper Shade"] || "—").trim() || "—";
    modalWrapper.textContent = (row["WRAPPER"] || row["Wrapper"] || "—").trim() || "—";
    modalBinder.textContent = (row["BINDER"] || row["Binder"] || "—").trim() || "—";
    modalFiller.textContent = (row["FILLER"] || row["Filler"] || "—").trim() || "—";
    modalOrigin.textContent = (row["ORIGIN"] || row["Origin"] || "—").trim() || "—";
    modalStrength.textContent = (row["STRENGTH"] || row["Strength"] || "—").trim() || "—";

    // image
    const imgCandidates = buildCigarImagePath(row);
    if (imgCandidates) {
      modalImg.style.display = 'block';
      modalImg.src = imgCandidates.opt1;
      modalImg.onerror = function() {
        if (modalImg.src.endsWith(imgCandidates.opt1)) {
          modalImg.src = imgCandidates.opt2;
        } else {
          modalImg.style.display = 'none';
        }
      };
    } else {
      modalImg.style.display = 'none';
    }

    modal.classList.add('show');
  }

  modalClose.addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('show');
  });

  // fetch data
  fetch('/pos/data/cigars_full.json')
    .then(res => res.json())
    .then(data => {
      // normalize brand comparison
      const wanted = brandParam.toLowerCase();
      cigarsForBrand = data.filter(row => {
        const brand = (row["Brand"] || "").trim().toLowerCase();
        if (brand !== wanted) return false;

        // filter OUT empty rows → this removes your blank cards
        const line = (row["Line"] || "").trim();
        const cigar = (row["Cigar"] || "").trim();
        return line.length > 0 || cigar.length > 0;
      });

      renderList(cigarsForBrand);
    })
    .catch(err => {
      console.error(err);
      listEl.innerHTML = '<p>Could not load cigars.</p>';
    });

  // search
  searchInput.addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const filtered = cigarsForBrand.filter(row => {
      const line = (row["Line"] || "").toLowerCase();
      const cigar = (row["Cigar"] || "").toLowerCase();
      return line.includes(q) || cigar.includes(q);
    });
    renderList(filtered);
  });

})();
</script>
</body>
</html>
