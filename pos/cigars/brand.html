<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/pos/pos.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CigarOS POS • Brand</title>

  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --pill: #f3f7fb;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    /* Top bar */
    .pos-topbar {
      padding: 14px 16px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pos-back {
      font-size: 16px;
      color: var(--ink);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 3px;
      background: #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
    }
    .pos-fav {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: #ffce33;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: #111;
    }

    header {
      padding: 10px 16px 4px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      margin: 0;
    }
    .brand-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Search */
    .brand-search-row {
      padding: 8px 20px 8px 20px;
    }
    .brand-search {
      background: #ffffff;
      border-radius: 999px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
    }
    .brand-search input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      font-size: 14px;
    }

    /* Cigar list pills – 3-section inner rectangle */
    .cigar-list-wrap {
      padding: 4px 12px 110px 12px;
    }
    .cigar-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .cigar-row {
      padding: 2px 4px;
    }

    .cigar-inner {
      width: 100%;
      background: var(--pill);
      border-radius: 15px;
      padding: 8px 10px;
      box-shadow: 0 10px 24px rgba(15,26,44,0.08);
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) 52px;
      align-items: center;
      column-gap: 8px;
    }

    .cigar-section {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cigar-section-left {
      justify-content: flex-start;
    }
    .cigar-section-middle {
      justify-content: flex-start;
      align-items: flex-start;
      padding-right: 4px;
    }
    .cigar-section-right {
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .cigar-thumb {
      width: 64px;
      height: 64px;
      border-radius: 4px;
      overflow: hidden;
      background: #dfe7ec;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .cigar-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cigar-middle {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .cigar-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      white-space: normal; /* allow wrapping */
    }
    .cigar-vitola {
      font-size: 13px;
      color: var(--muted);
    }
    .cigar-price {
      font-size: 13px;
      font-weight: 600;
    }

    .cigar-stock-count {
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
    }

    #brandEmpty {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--muted);
    }

    /* ================= INVOICE POPUP (same as before) ================= */

    .invoice-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      z-index: 9999;
      padding: 20px;
    }
    .invoice-popup.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .invoice-popup-inner {
      width: 100%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 36px;
      padding: 28px 26px 32px;
      box-shadow: 0 12px 50px rgba(0,0,0,0.20);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .invoice-header {
      text-align: center;
      margin-bottom: 14px;
    }
    .invoice-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .invoice-date {
      margin: 0;
      font-size: 13px;
      color: #222;
      font-weight: 500;
    }

    .invoice-body {
      margin-top: 18px;
    }

    .loyalty-row {
      width: 100%;
      background: #e8f0f5;
      border-radius: 999px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #invoice-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .invoice-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e8f0f5;
      border-radius: 30px;
      padding: 14px 18px;
      box-sizing: border-box;
    }

    .invoice-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .invoice-thumb {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #cfdde7;
      overflow: hidden;
      flex-shrink: 0;
    }
    .invoice-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .invoice-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .invoice-name {
      font-size: 15px;
      font-weight: 700;
      color: #007aff;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .invoice-meta {
      font-size: 13px;
      color: #111;
      font-weight: 500;
      line-height: 1.2;
    }

    .invoice-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 90px;
      font-size: 13px;
      font-weight: 500;
    }

    .invoice-qty-label {
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .invoice-qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f2f6fa;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .invoice-qty-btn {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .invoice-qty-value {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
    }

    .invoice-line-total {
      font-weight: 700;
      font-size: 14px;
    }

    .invoice-totals {
      margin-top: 26px;
      text-align: right;
      font-size: 16px;
    }
    .invoice-totals .total-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 4px;
    }
    .invoice-totals .total-bold {
      font-size: 20px;
      font-weight: 700;
      margin-top: 10px;
    }

    .invoice-close {
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="pos-topbar">
    <a class="pos-back" href="/pos/cigars/">← Cigars</a>
    <div class="pos-fav">★</div>
  </div>

  <!-- Header -->
  <header>
    <h1 id="brandTitle">Brand</h1>
    <div id="brandSubtitle" class="brand-subtitle"></div>
  </header>

  <!-- Search within this brand -->
  <div class="brand-search-row">
    <div class="brand-search">
      <input id="brandSearch" placeholder="Search this brand…" />
    </div>
  </div>

  <!-- Brand cigars list -->
  <main class="cigar-list-wrap">
    <div id="brandEmpty" style="display:none;"></div>
    <div id="cigarList" class="cigar-list"></div>
  </main>

  <script>
    // ===== BRAND INVENTORY FROM CSV =====

    const CSV_URL = "/hub/hub_11-5-25.csv";
    const params = new URLSearchParams(window.location.search);
    const brandParam = (params.get("brand") || "").trim();

    const brandTitleEl = document.getElementById("brandTitle");
    const brandSubtitleEl = document.getElementById("brandSubtitle");
    const cigarList = document.getElementById("cigarList");
    const brandEmpty = document.getElementById("brandEmpty");
    const brandSearch = document.getElementById("brandSearch");

    if (brandParam) {
      if (brandTitleEl) brandTitleEl.textContent = brandParam;
      if (brandSubtitleEl) brandSubtitleEl.textContent = "CigarOS POS · " + brandParam;
    }

    let brandRows = [];

    fetch(CSV_URL)
      .then(r => r.text())
      .then(text => {
        const rows = parseCSV(text);
        const normalizedBrand = brandParam.toLowerCase();
        brandRows = rows.filter(r => {
          const b = (r["Brand"] || r["brand"] || "").trim().toLowerCase();
          return b === normalizedBrand;
        });

        renderBrandCigars(brandRows);
      })
      .catch(err => {
        console.error(err);
        brandEmpty.style.display = "block";
        brandEmpty.textContent = "Could not load cigar inventory.";
      });

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const header = lines.shift().split(",");
      return lines.map(line => {
        const cells = line.split(",");
        const obj = {};
        header.forEach((h, i) => {
          obj[h.trim()] = (cells[i] || "").trim();
        });
        return obj;
      });
    }

    function slug(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function formatPrice(raw) {
      if (!raw) return "";
      const trimmed = raw.trim();
      if (!trimmed) return "";
      if (trimmed.startsWith("$")) return trimmed;
      return `$${trimmed}`;
    }

    function getStockCount(row) {
      const fromCsv =
        row["On Hand"] ||
        row["On-hand"] ||
        row["Inventory"] ||
        row["Stock"] ||
        "";
      if (fromCsv) return fromCsv;
      return "89"; // default for now
    }

    function renderBrandCigars(rows, term = "") {
      cigarList.innerHTML = "";

      const searchTerm = term.toLowerCase();
      const filtered = rows.filter(r => {
        const line = (r["Line"] || "").toLowerCase();
        const name = (r["Cigar Name"] || r["Cigar"] || "").toLowerCase();
        const vitola = (r["Vitola"] || "").toLowerCase();
        return (
          !searchTerm ||
          line.includes(searchTerm) ||
          name.includes(searchTerm) ||
          vitola.includes(searchTerm)
        );
      });

      if (!filtered.length) {
        brandEmpty.style.display = "block";
        brandEmpty.textContent = "No cigars found for this brand.";
        return;
      }

      brandEmpty.style.display = "none";

      filtered.forEach(r => {
        const line = r["Line"] || "";
        const cigarName = r["Cigar Name"] || r["Cigar"] || "";
        const vitola = r["Vitola"] || "";
        const msrp = formatPrice(r["MSRP"] || r["Price"] || "");
        const stockCount = getStockCount(r);

        const photoCol = r["Cigar Photo"] || r["Photo"] || "";
        let imgSrc = photoCol;
        if (!imgSrc) {
          const brandSlug = slug(r["Brand"] || "");
          const cigarSlug = slug(cigarName || line);
          imgSrc = `/img/cigars/${brandSlug}_${cigarSlug}.jpg`;
        }

        const rowEl = document.createElement("div");
        rowEl.className = "cigar-row";
        rowEl.innerHTML = `
          <div class="cigar-inner">
            <div class="cigar-section cigar-section-left">
              <div class="cigar-thumb">
                <img src="${imgSrc}" alt="${cigarName || line}"
                     onerror="this.src='/img/icons/categories/cigars.svg'">
              </div>
            </div>
            <div class="cigar-section cigar-section-middle">
              <div class="cigar-middle">
                <div class="cigar-name">${line ? line + " " + cigarName : cigarName || line}</div>
                <div class="cigar-vitola">${vitola}</div>
                <div class="cigar-price">${msrp}</div>
              </div>
            </div>
            <div class="cigar-section cigar-section-right">
              <div class="cigar-stock-count">${stockCount}</div>
            </div>
          </div>
        `;
        cigarList.appendChild(rowEl);
      });
    }

    if (brandSearch) {
      brandSearch.addEventListener("input", e => {
        renderBrandCigars(brandRows, e.target.value);
      });
    }

    // ===== INVOICE DEMO LOGIC (unchanged) =====

    const POS_TAX_RATE = 0.07;

    const demoCartItems = [
      {
        id: "demo1",
        name: "Sample Cigar",
        vitola: "Robusto",
        brand: brandParam || "House",
        price: 10.00,
        qty: 1,
        icon: "/img/icons/categories/cigars.svg"
      },
      {
        id: "demo2",
        name: "Sprite",
        vitola: "Food & Beverage",
        brand: "",
        price: 1.50,
        qty: 2,
        icon: "/img/icons/foodandbevs/sprite.svg"
      }
    ];

    function money(value) {
      return value.toFixed(2);
    }

    function renderInvoice() {
      const container = document.getElementById("invoice-items");
      if (!container) return;

      container.innerHTML = "";
      let subtotal = 0;

      demoCartItems.forEach((item, index) => {
        const lineTotal = item.price * item.qty;
        subtotal += lineTotal;

        const row = document.createElement("div");
        row.className = "invoice-item";
        row.dataset.index = String(index);
        row.innerHTML = `
          <div class="invoice-left">
            <div class="invoice-thumb">
              <img src="${item.icon}" alt="${item.brand || item.name}">
            </div>
            <div class="invoice-text">
              <button type="button" class="invoice-name">${item.name}</button>
              <div class="invoice-meta">${item.vitola}</div>
              <div class="invoice-meta">${item.brand}</div>
              <div class="invoice-meta">$${money(item.price)}</div>
            </div>
          </div>
          <div class="invoice-right">
            <div class="invoice-qty-label">QTY</div>
            <div class="invoice-qty-control">
              <button class="invoice-qty-btn" data-dir="-1">−</button>
              <span class="invoice-qty-value">${item.qty}</span>
              <button class="invoice-qty-btn" data-dir="1">+</button>
            </div>
            <div class="invoice-line-total">$${money(lineTotal)}</div>
          </div>
        `;
        container.appendChild(row);
      });

      const subtotalEl = document.getElementById("invoice-subtotal");
      const taxEl = document.getElementById("invoice-tax");
      const totalEl = document.getElementById("invoice-total");

      const tax = subtotal * POS_TAX_RATE;
      const total = subtotal + tax;

      if (subtotalEl) subtotalEl.textContent = `$${money(subtotal)}`;
      if (taxEl) taxEl.textContent = `$${money(tax)}`;
      if (totalEl) totalEl.textContent = `$${money(total)}`;

      container.querySelectorAll(".invoice-qty-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const row = btn.closest(".invoice-item");
          if (!row) return;
          const index = Number(row.dataset.index || "0");
          const dir = Number(btn.getAttribute("data-dir") || "0");
          const item = demoCartItems[index];
          if (!item) return;
          const newQty = item.qty + dir;
          if (newQty < 0) return;
          item.qty = newQty;
          renderInvoice();
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const dateEl = document.getElementById("invoice-date");
      if (dateEl) {
        const d = new Date();
        const weekday = d.toLocaleDateString(undefined, { weekday: "long" });
        const dateStr = d.toLocaleDateString(undefined, { month: "2-digit", day: "2-digit", year: "2-digit" });
        const timeStr = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        dateEl.textContent = `${weekday}, ${dateStr} — ${timeStr}`;
      }
      renderInvoice();
    });
  </script>

  <!-- Red receipt pill -->
  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt" />
  </div>

  <!-- Invoice Popup -->
  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2 class="invoice-title">INVOICE</h2>
        <p class="invoice-date" id="invoice-date"></p>
      </div>

      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row"><span>Subtotal</span><span id="invoice-subtotal">$0.00</span></div>
        <div class="total-row"><span>Tax</span><span id="invoice-tax">$0.00</span></div>
        <div class="total-row total-bold"><span>TOTAL</span><span id="invoice-total">$0.00</span></div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
