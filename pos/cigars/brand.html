<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • Brand</title>

  <!-- Shared invoice / receipt styles -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 110px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 500;
    }
    .star {
      font-size: 22px;
      color: #ffcc00;
    }

    .brand-title {
      margin: 18px 0 10px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    /* search bar */
    .brand-search {
      margin: 6px 0 18px;
    }
    .brand-search-inner {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 999px;
      padding: 10px 14px;
      border: 1px solid rgba(15,26,44,0.05);
      box-shadow: 0 1px 3px rgba(15,26,44,0.06);
    }
    .brand-search-inner input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      font-size: 15px;
    }

    /* cigar list */
    .cigar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cigar-card {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 2px 6px rgba(15,26,44,0.04);
    }

    .cigar-icon {
      flex: 0 0 60px;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      overflow: hidden;
      background: #dfe7ec;
      display: grid;
      place-items: center;
      margin-right: 12px;
    }
    .cigar-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cigar-main {
      flex: 1;
      min-width: 0;
    }
    .cigar-line {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cigar-vitola {
      font-size: 14px;
      color: rgba(17,24,39,0.78);
      margin-top: 3px;
    }
    .cigar-price {
      font-size: 14px;
      color: rgba(17,24,39,0.78);
      margin-top: 3px;
    }

    /* inventory number on the right – NO circle */
    .cigar-inv {
      margin-left: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      cursor: pointer;
      /* remove any circle look */
      border: none;
      background: none;
      padding: 0;
    }

    .cigar-inv small {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(17,24,39,0.55);
    }

    #emptyMsg {
      text-align: center;
      opacity: 0.6;
      margin-top: 20px;
      font-size: 14px;
    }

    /* simple invoice item styling inside popup */
    .invoice-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 14px;
    }
    .invoice-line-main {
      flex: 1;
      min-width: 0;
      margin-right: 8px;
    }
    .invoice-line-name {
      font-weight: 600;
    }
    .invoice-line-meta {
      font-size: 12px;
      opacity: 0.8;
    }
    .invoice-line-qty {
      width: 30px;
      text-align: center;
      font-weight: 600;
      margin-right: 6px;
    }
    .invoice-line-price {
      width: 70px;
      text-align: right;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="/pos/cigars/" class="back-link">← <span>Cigars</span></a>
      <div class="star">★</div>
    </div>

    <h1 id="brandTitle" class="brand-title">Brand</h1>

    <div class="brand-search">
      <div class="brand-search-inner">
        <input id="searchInput" placeholder="Search this brand…" />
      </div>
    </div>

    <div id="cigarList" class="cigar-list"></div>
    <p id="emptyMsg" style="display:none;">No cigars found for this brand.</p>
  </div>

  <!-- Tony icon stays on all POS pages -->
  <script src="/js/tony.js" defer></script>

  <!-- Red receipt pill -->
  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt" />
  </div>

  <!-- Invoice Popup -->
  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>

      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>

        <!-- CART ITEMS GO HERE -->
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="invoice-subtotal">$0.00</span>
        </div>
        <div class="total-row">
          <span>Tax</span>
          <span id="invoice-tax">$0.00</span>
        </div>
        <div class="total-row total-bold">
          <span>TOTAL</span>
          <span id="invoice-total">$0.00</span>
        </div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <!-- Shared behavior for red pill open/close -->
  <script src="/pos/pos.js" defer></script>

  <!-- Brand-page specific logic -->
  <script>
    // ====== CONFIG ======
    const CSV_URL = "/hub/hub_11-5-25.csv";
    const TAX_RATE = 0.07;

    const params = new URLSearchParams(window.location.search);
    const BRAND_NAME = params.get("brand") || "Cigars";

    const brandTitle = document.getElementById("brandTitle");
    const listEl = document.getElementById("cigarList");
    const emptyMsg = document.getElementById("emptyMsg");
    const searchInput = document.getElementById("searchInput");

    brandTitle.textContent = BRAND_NAME;

    let brandRows = [];
    let cart = [];

    // ---- CSV parsing ----
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];

      const header = lines.shift().split(",").map(h => h.trim());
      return lines.map(line => {
        // Very simple CSV split – OK for your sheet
        const cells = line.split(",");
        const obj = {};
        header.forEach((h, i) => {
          obj[h] = (cells[i] || "").trim();
        });
        return obj;
      });
    }

    function normalizeBrand(str) {
      return (str || "").trim();
    }

    function buildDisplayRow(row) {
      const brand = normalizeBrand(row["Brand"] || row["BRAND"] || "");
      if (brand !== BRAND_NAME) return null;

      const line = row["Line"] || row["LINE"] || "";
      const cigar =
        row["Cigar"] ||
        row["Cigar Name"] ||
        row["CIGAR NAME"] ||
        row["Name"] ||
        "";
      const vitola = row["Vitola"] || row["VITOLA"] || "";
      const priceRaw =
        row["MSRP"] ||
        row["Price"] ||
        row["PRICE"] ||
        row["Price (MSRP)"] ||
        "";
      const rating =
        row["RATING"] ||
        row["Rating"] ||
        row["rating"] ||
        row["Score"] ||
        row["SCORE"] ||
        "89";

      return {
        brand,
        line,
        cigar,
        vitola,
        priceRaw,
        rating
      };
    }

    function parsePriceNumber(priceRaw) {
      const n = parseFloat(String(priceRaw).replace(/[^0-9.]/g, ""));
      return isNaN(n) ? 0 : n;
    }

    function renderList(filterTerm = "") {
      listEl.innerHTML = "";
      const term = filterTerm.toLowerCase();

      const filtered = brandRows.filter(item => {
        if (!item) return false;
        if (!term) return true;
        return (
          (item.cigar || "").toLowerCase().includes(term) ||
          (item.line || "").toLowerCase().includes(term) ||
          (item.vitola || "").toLowerCase().includes(term)
        );
      });

      if (!filtered.length) {
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "cigar-card";

        const iconName = item.brand.toLowerCase().replace(/[^a-z0-9]/g, "");
        const priceLabel = item.priceRaw ? `$${parsePriceNumber(item.priceRaw).toFixed(2)}` : "";

        card.innerHTML = `
          <div class="cigar-icon">
            <img src="/img/icons/brands/${iconName}.svg" alt="${item.brand}" onerror="this.src='/img/placeholder.svg'">
          </div>
          <div class="cigar-main">
            <div class="cigar-line">${item.cigar || item.line || "Cigar"}</div>
            <div class="cigar-vitola">${item.vitola || ""}</div>
            <div class="cigar-price">${priceLabel}</div>
          </div>
          <button
            class="cigar-inv"
            type="button"
            data-role="inventory-badge"
            data-brand="${item.brand}"
            data-line="${item.line}"
            data-cigar="${item.cigar}"
            data-vitola="${item.vitola}"
            data-price="${parsePriceNumber(item.priceRaw)}"
          >
            ${item.rating}
            <small>IN STOCK</small>
          </button>
        `;

        const badge = card.querySelector(".cigar-inv");
        badge.addEventListener("click", () => handleInventoryClick(badge, item));

        listEl.appendChild(card);
      });
    }

    function handleInventoryClick(el, item) {
      const brand = el.dataset.brand || item.brand;
      const line = el.dataset.line || item.line;
      const cigar = el.dataset.cigar || item.cigar;
      const vitola = el.dataset.vitola || item.vitola;
      const priceNum = parseFloat(el.dataset.price || "") || parsePriceNumber(item.priceRaw || "");

      if (!cigar) return;

      // Find existing cart line
      const key = `${brand}|||${line}|||${cigar}|||${vitola}`;
      let existing = cart.find(c => c.key === key);
      if (!existing) {
        existing = { key, brand, line, cigar, vitola, priceNum, qty: 0 };
        cart.push(existing);
      }
      existing.qty += 1;

      rebuildInvoice();
      openInvoicePopup();
    }

    function rebuildInvoice() {
      const itemsEl = document.getElementById("invoice-items");
      if (!itemsEl) return;

      itemsEl.innerHTML = "";

      if (!cart.length) {
        itemsEl.innerHTML = "<p style='opacity:.7;font-size:14px;'>No items yet.</p>";
        updateTotals(0);
        return;
      }

      let subtotal = 0;

      cart.forEach(item => {
        const lineTotal = item.priceNum * item.qty;
        subtotal += lineTotal;

        const row = document.createElement("div");
        row.className = "invoice-line";
        row.innerHTML = `
          <div class="invoice-line-main">
            <div class="invoice-line-name">${item.cigar || item.line}</div>
            <div class="invoice-line-meta">
              ${item.vitola ? item.vitola + " · " : ""}${item.brand}
            </div>
          </div>
          <div class="invoice-line-qty">×${item.qty}</div>
          <div class="invoice-line-price">$${lineTotal.toFixed(2)}</div>
        `;
        itemsEl.appendChild(row);
      });

      updateTotals(subtotal);
    }

    function updateTotals(subtotal) {
      const subEl = document.getElementById("invoice-subtotal");
      const taxEl = document.getElementById("invoice-tax");
      const totalEl = document.getElementById("invoice-total");

      const tax = subtotal * TAX_RATE;
      const total = subtotal + tax;

      if (subEl) subEl.textContent = `$${subtotal.toFixed(2)}`;
      if (taxEl) taxEl.textContent = `$${tax.toFixed(2)}`;
      if (totalEl) totalEl.textContent = `$${total.toFixed(2)}`;

      // also set date on header
      const dateEl = document.getElementById("invoice-date");
      if (dateEl) {
        const d = new Date();
        const dayName = d.toLocaleDateString(undefined, { weekday: "long" });
        const dateStr = d.toLocaleDateString(undefined, { month: "2-digit", day: "2-digit", year: "2-digit" });
        const timeStr = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        dateEl.textContent = `${dayName}, ${dateStr} — ${timeStr}`;
      }
    }

    function openInvoicePopup() {
      const popup = document.getElementById("invoice-popup");
      if (popup) {
        popup.classList.add("open");
      }
    }

    // Hook up search
    if (searchInput) {
      searchInput.addEventListener("input", e => {
        renderList(e.target.value || "");
      });
    }

    // Load data
    fetch(CSV_URL)
      .then(res => res.text())
      .then(text => {
        const rows = parseCSV(text);
        brandRows = rows
          .map(buildDisplayRow)
          .filter(Boolean);
        renderList("");
      })
      .catch(err => {
        console.error(err);
        emptyMsg.style.display = "block";
        emptyMsg.textContent = "Could not load cigar data.";
      });
  </script>
</body>
</html>
