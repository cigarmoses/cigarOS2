<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS • Brand</title>

  <!-- Keep these aligned with /pos/cigars/index.html so the UI matches across POS -->
  <link rel="stylesheet" href="/css/type.css?v=13" />
  <link rel="stylesheet" href="/css/theme.css?v=13" />
  <link rel="stylesheet" href="/css/theme-toggle.css?v=13" />
  <link rel="stylesheet" href="/pos/pos.css?v=13" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css?v=13" />
  <link rel="stylesheet" href="/pos/cigars/brand.css?v=13" />
</head>

<body class="brand-page">
  <header class="brand-topbar">
    <button id="back-btn" class="icon-btn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M15.5 19.5L8 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div id="theme-dock" class="theme-dock">
      <!-- theme-toggle.js populates/controls this -->
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
        <span class="theme-toggle__sun" aria-hidden="true">☀︎</span>
        <span class="theme-toggle__track" aria-hidden="true"></span>
        <span class="theme-toggle__moon" aria-hidden="true">☾</span>
      </button>
    </div>

    <button id="invoice-btn" class="invoice-btn" type="button" aria-label="Invoice">
      <img id="invoice-icon" src="/img/icons/cart.svg" alt="" />
      <span id="invoice-badge" class="invoice-badge" hidden>0</span>
    </button>
  </header>

  <main class="brand-main">
    <section class="brand-header">
      <div class="brand-title-row">
        <h1 id="brand-title" class="brand-title">Brand</h1>
        <div id="brand-icon" class="brand-icon">
          <img id="brand-icon-img" src="" alt="" />
        </div>
      </div>

      <div class="brand-search">
        <div class="search-wrap">
          <span class="search-ico" aria-hidden="true">🔎</span>
          <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
        </div>
      </div>

      <div class="brand-controls">
        <button id="btn-filters" class="pill-btn" type="button">Filters</button>
        <button id="btn-bands" class="pill-btn" type="button">Bands</button>

        <div id="wrapper-seg" class="seg" data-state="maduro">
          <button class="seg-btn is-on" type="button" data-state="maduro">Maduro</button>
          <button id="wrapper-switch" class="seg-switch" type="button" aria-label="Toggle wrapper"></button>
          <button class="seg-btn" type="button" data-state="natural">Natural</button>
        </div>
      </div>
    </section>

    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>
  </main>

  <!-- ==============================
       BANDS SHEET (big bands)
       ============================== -->
  <section id="sheet-bands" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Bands">
      <div class="sheet-head">
        <div class="sheet-title">Bands</div>
        <button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
      </div>

      <div id="bands-options" class="bands-options"></div>

      <div class="sheet-foot">
        <button id="bands-confirm" class="sheet-apply" type="button">Confirm</button>
      </div>
    </div>
  </section>

  <!-- Theme toggle -->
  <script defer src="/js/theme-toggle.js"></script>

  <!-- Cart (invoice) behavior + badge + add-to-cart capture handlers -->
  <script defer src="/pos/cart.js?v=13"></script>

  <!-- Brand page logic -->
  <script defer src="/pos/cigars/brand.js?v=13"></script>
</body>

</html>
