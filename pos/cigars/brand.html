<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>POS • Brand</title>

  <!-- keep whatever type file you already use -->
  <link rel="stylesheet" href="/css/type.css" />

  <!-- your tokens/theme -->
  <link rel="stylesheet" href="/css/theme.css" />

  <!-- NEW: toggle + header buttons -->
  <link rel="stylesheet" href="/css/theme-toggle.css" />

  <!-- keep your existing POS/page css (DO NOT remove your real file if different) -->
  <link rel="stylesheet" href="/css/pos.css" />
</head>

<body>
  <header class="pos-header">
    <div class="pos-header-top">
      <!-- Back -->
      <button class="icon-btn" type="button" aria-label="Back" onclick="history.back()">
        <!-- use whatever icon you already had; placeholder arrow -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Right cluster: cart -->
      <a class="icon-btn" href="/pos/invoice/" aria-label="Invoice / Cart">
        <img id="invoice-icon" src="/img/icons/cart-empty.svg" alt="" />
      </a>
    </div>

    <!-- Center toggle -->
    <div class="pos-header-center">
      <button id="themeToggle" type="button" aria-label="Toggle theme">
        <div class="tt-track" aria-hidden="true">
          <span class="tt-ico tt-ico--sun"><img src="/img/icons/sun.svg" alt=""></span>
          <span class="tt-ico tt-ico--moon"><img src="/img/icons/moon.svg" alt=""></span>

          <!-- single knob icon (we swap via JS) -->
          <span class="tt-knob">
            <img id="themeKnobIcon" src="/img/icons/sun.svg" alt="">
          </span>
        </div>
      </button>
    </div>
  </header>

  <main class="brand-page">
    <!-- IMPORTANT: keep your existing brand title/logo/list markup below.
         This is a minimal scaffold that won’t change sizing. -->

    <h1 class="page-title" id="brandTitle">Brand</h1>

    <div class="brand-controls">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Search…" autocomplete="off" />
      </div>

      <div class="pill-row">
        <button id="btnFilters" type="button">Filters</button>
        <button id="btnBands" type="button">Bands</button>
      </div>

      <!-- Maduro / Natural (your existing control should render here) -->
      <div id="wrapperToggleMount"></div>
    </div>

    <section id="cigarList"></section>
  </main>

  <!-- Sheets / Modals (IDs stable so your JS can bind again) -->
  <section id="sheetBands" hidden></section>
  <section id="sheetFilters" hidden></section>

  <!-- Theme + cart swap -->
  <script defer src="/js/theme-toggle.js"></script>

  <!-- ✅ KEEP your real brand page JS file here.
       If your site uses a different path, keep YOURS.
       This is what restores Filters/Bands clicks + cigar detail navigation. -->
  <script defer src="/pos/cigars/brand.js"></script>
</body>
</html>
