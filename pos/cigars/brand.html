<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Brand</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/cigars/brand.css" />
</head>

<body class="brand-page">
  <header class="brand-topbar">
    <button type="button" class="pos-back" id="brand-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main class="brand-main">
    <section class="brand-header">
      <div class="brand-header-left">
        <div class="brand-badge" id="brand-badge">
          <img id="brand-badge-img" alt="" />
        </div>
        <div class="brand-headings">
          <h1 class="brand-title" id="brand-title">Brand</h1>
          <div class="brand-sub" id="brand-sub">Cigars</div>
        </div>
      </div>
    </section>

    <section class="brand-list-wrap">
      <div id="brand-list" class="brand-list" aria-live="polite"></div>
    </section>
  </main>

  <script defer src="/pos/cigars/brand.js"></script>
</body>
</html>
