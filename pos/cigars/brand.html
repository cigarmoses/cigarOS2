<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<title>POS • Brand</title>

<link rel="stylesheet" href="/css/type.css?v=33" />
<link rel="stylesheet" href="/css/theme.css?v=33" />
<link rel="stylesheet" href="/css/theme-toggle.css?v=33" />
<link rel="stylesheet" href="/pos/pos.css?v=33" />
<link rel="stylesheet" href="/pos/cigars/cigars.css?v=33" />
<link rel="stylesheet" href="/pos/cigars/brand.css?v=33" />
</head>

<body class="brand-page">
  <header class="brand-topbar">
    <button id="back-btn" class="icon-btn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M15.5 19.5L8 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="brand-topbar-spacer" aria-hidden="true"></div>

  </header>

  <main class="brand-main">
    <section class="brand-header">
      <div class="brand-title-row">
        <h1 id="brand-title" class="brand-title">Brand</h1>

        <div id="brand-icon" class="brand-icon">
          <img id="brand-icon-img" src="" alt="" />
        </div>
      </div>

      <div class="brand-search">
        <div class="search-wrap">
          <span class="search-ico" aria-hidden="true">🔎</span>
          <input id="brand-search" type="search" placeholder="Search…" autocomplete="off" />
        </div>
      </div>

      <div class="brand-controls">
        <button id="btn-filters" class="pill-btn" type="button">Filters</button>
        <button id="btn-bands" class="pill-btn" type="button">Bands</button>

        <div id="wrapper-seg" class="seg" data-state="maduro">
          <button class="seg-btn" type="button" data-state="maduro">Maduro</button>
          <button id="wrapper-switch" class="seg-switch" type="button" aria-label="Toggle wrapper"></button>
          <button class="seg-btn" type="button" data-state="natural">Natural</button>
        </div>
      </div>
    </section>

    <section class="brand-list" id="brand-list" aria-label="Cigars list"></section>
  </main>

  <nav class="cigars-bottom-bar" aria-label="Primary">
    <div class="cigars-bottom-bar-inner">
      <button type="button" class="cb-nav-btn" id="brandSearchBtn" aria-label="Search">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>

      <a class="cb-nav-btn" href="/" aria-label="Home">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </a>

      <a class="cb-nav-btn" href="/pos/favorites/" aria-label="Favorites">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s-6.7-4.35-9.33-7.02C.7 12.02 1.1 8.5 4 7.1c1.9-.9 4.1-.3 5.3 1.2 1.2-1.5 3.4-2.1 5.3-1.2 2.9 1.4 3.3 4.92 1.33 6.88C18.7 16.65 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Favorites</span>
      </a>

      <a class="cb-nav-btn" href="/pos/invoice/" aria-label="Cart">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
          <circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
        </svg>
        <span>Cart</span>
      </a>
    </div>
  </nav>

  <section id="sheet-bands" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Bands">
      <div class="sheet-head">
        <div class="sheet-title">Bands</div>
        <button class="sheet-x" type="button" data-sheet-close aria-label="Close">×</button>
      </div>

      <div id="bands-options" class="bands-options"></div>

      <div class="sheet-foot">
        <button id="bands-confirm" class="sheet-apply" type="button">Confirm</button>
      </div>
    </div>
  </section>

  <script defer src="/uxui/topbar/topbar.js?v=33"></script>
<script defer src="/pos/cart.js?v=33"></script>
<script defer src="/pos/cigars/brand.js?v=33"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CigarOSTopbar.mount(".brand-topbar");
  });
</script>

</body>
</html>
