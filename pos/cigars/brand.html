<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • Brand</title>
  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 65px;
    }
    .topbar {
      display:flex;
      align-items:center;
      gap:6px;
      padding:16px 16px 4px;
      font-weight:600;
    }
    .back-btn { display:flex; gap:4px; align-items:center; cursor:pointer; }
    .page-wrap { padding:0 16px 80px; }
    .brand-title-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:6px 0 12px;
    }
    .brand-title { font-size:2rem; font-weight:700; }
    .fav-star {
      width:32px; height:32px; border-radius:999px;
      background:#f7c948; display:grid; place-items:center;
    }
    .search-box {
      background:#fff;
      border-radius:999px;
      display:flex; align-items:center;
      padding:10px 16px;
      margin-bottom:18px;
    }
    .search-input {
      border:0; outline:0; background:transparent; width:100%;
      font-size:.9rem;
    }
    .cigar-list { display:flex; flex-direction:column; gap:12px; }

    .cigar-row {
      display:flex;
      align-items:center;
      gap:12px;
      background:var(--card);
      border-radius:20px;
      padding:12px 14px;
      box-shadow:0 8px 22px rgba(14,25,35,0.05);
    }
    .cigar-icon {
      width:54px; height:54px; border-radius:18px;
      background:#3a3029; display:grid; place-items:center;
      overflow:hidden; flex:0 0 54px;
    }
    .cigar-icon img {
      width:46px; height:46px; object-fit:contain;
    }
    .cigar-info { flex:1; min-width:0; }
    .cigar-line {
      font-weight:700; font-size:.9rem; line-height:1.15;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .cigar-vitola {
      font-size:.8rem; color:var(--muted); margin-top:2px;
    }
    .cigar-price {
      font-size:.8rem; margin-top:2px;
    }
    .qty-pill {
      width:44px; height:44px; border-radius:999px;
      border:1px solid rgba(15,26,44,0.12);
      display:grid; place-items:center;
      font-weight:600; background:#fff;
    }
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 58px;
      background: #0f1a2c;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .bottom-btn {
      width: 40px; height: 40px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      display: grid; place-items: center;
      color: #fff;
    }
    #debug {
      margin-top:8px;
      font-size:.65rem;
      color:#a33;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <span style="font-size:1.2rem;">←</span>
      <span>Cigars</span>
    </div>
  </div>

  <div class="page-wrap">
    <div class="brand-title-row">
      <div class="brand-title" id="brandTitle">Brand</div>
      <div class="fav-star">★</div>
    </div>

    <div class="search-box">
      <input id="searchInput" class="search-input" placeholder="Search this brand..." oninput="filterCigars()" />
    </div>

    <div class="cigar-list" id="cigarList"></div>
    <div id="debug"></div>
  </div>

  <div class="bottom-nav">
    <div class="bottom-btn">←</div>
    <div class="bottom-btn">→</div>
    <div class="bottom-btn">＋</div>
    <div class="bottom-btn">☺</div>
    <div class="bottom-btn">⋯</div>
  </div>

  <script>
    const url = new URL(window.location.href);
    const brandParam = (url.searchParams.get('brand') || '').trim();
    document.getElementById('brandTitle').textContent = brandParam || 'Cigars';

    let allCigars = [];
    let brandCigars = [];

    // path is relative: /pos/cigars/brand.html -> /pos/data/cigars_full.json
    fetch('../data/cigars_full.json')
      .then(r => r.json())
      .then(data => {
        allCigars = data;
        showForBrand();
      })
      .catch(err => {
        document.getElementById('debug').textContent = 'Fetch failed: ' + err;
      });

    function showForBrand() {
      const target = brandParam.toLowerCase();

      // filter by Brand or Brand aka
      brandCigars = allCigars.filter(row => {
        const brand = (row["Brand"] || "").toString().trim().toLowerCase();
        const aka = (row["Brand aka"] || "").toString().trim().toLowerCase();
        if (!target) return false;
        return (
          brand === target ||
          brand.includes(target) ||
          target.includes(brand) ||
          aka === target ||
          aka.includes(target)
        );
      });

      // if no match, show first 25 so we can see data
      if (brandCigars.length === 0) {
        brandCigars = allCigars.slice(0, 25);
        document.getElementById('debug').textContent =
          'No exact matches for "' + brandParam + '". Showing first 25 cigars from file.';
      } else {
        document.getElementById('debug').textContent = '';
      }

      renderList(brandCigars);
    }

    function slugify(str){
      return (str || "").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
    }

    function renderList(list){
      const wrap = document.getElementById('cigarList');
      wrap.innerHTML = '';
      list.forEach(cigar => {
        // your JSON has both Line and Cigar separately
        const line = (cigar["Line"] || "").toString().trim();
        const cigarName = (cigar["Cigar"] || "").toString().trim();
        const displayName = (line ? line + " " : "") + cigarName;

        const vitola = (cigar["Vitola"] || "").toString().trim();
        const msrp = (cigar["MSRP"] || "").toString().trim();

        // you don't have Inventory in the JSON yet, so show 89 like before
        const inventory = '89';

        const brandSlug = slugify(cigar["Brand"] || "");

        const row = document.createElement('div');
        row.className = 'cigar-row';
        row.innerHTML = `
          <div class="cigar-icon">
            <img src="/img/icons/brands/${brandSlug}.svg" onerror="this.style.opacity='0'">
          </div>
          <div class="cigar-info">
            <div class="cigar-line">${displayName}</div>
            <div class="cigar-vitola">${vitola}</div>
            <div class="cigar-price">${msrp}</div>
          </div>
          <div class="qty-pill">${inventory}</div>
        `;
        wrap.appendChild(row);
      });
    }

    function filterCigars(){
      const val = document.getElementById('searchInput').value.toLowerCase();
      const filtered = brandCigars.filter(row => {
        const line = (row["Line"] || "").toString().toLowerCase();
        const cigar = (row["Cigar"] || "").toString().toLowerCase();
        return (line + " " + cigar).includes(val);
      });
      renderList(filtered);
    }
  </script>
</body>
</html>
