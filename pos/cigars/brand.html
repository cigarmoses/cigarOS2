<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CigarOS — Brand</title>

  <link rel="stylesheet" href="/pos/cigars/brand.css?v=1.0.0" />
</head>

<body>
  <div class="page" id="page">
    <!-- Top bar -->
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <span class="chev"></span>
      </button>

      <div class="topbar-right">
        <!-- Horizontal iOS-style theme pill -->
        <button class="theme-pill" id="themePill" aria-label="Toggle theme">
          <span class="theme-dot" aria-hidden="true"></span>
          <span class="theme-ico sun" aria-hidden="true">☀︎</span>
          <span class="theme-ico moon" aria-hidden="true">☾</span>
        </button>

        <!-- Cart -->
        <button class="cart-btn" id="cartBtn" aria-label="Invoice">
          <img id="cartIcon" src="/img/icons/uxui/cartglass.svg" alt="" />
          <span class="cart-badge" id="cartBadge" hidden>0</span>
        </button>
      </div>
    </header>

    <!-- Brand header -->
    <section class="brand-header">
      <h1 class="brand-title" id="brandTitle">Brand</h1>
      <img class="brand-logo" id="brandLogo" alt="" />
    </section>

    <!-- Search -->
    <section class="search-wrap">
      <div class="search">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="searchInput" type="search" placeholder="Search…" autocomplete="off" />
      </div>
    </section>

    <!-- Controls row -->
    <section class="controls">
      <button class="pill-btn" id="filtersBtn">Filters</button>
      <button class="pill-btn" id="bandsBtn">Bands</button>

      <div class="segmented" role="tablist" aria-label="Wrapper toggle">
        <button class="seg-btn is-active" id="maduroBtn" data-wrapper="maduro" role="tab" aria-selected="true">
          Maduro
        </button>
        <button class="seg-btn" id="naturalBtn" data-wrapper="natural" role="tab" aria-selected="false">
          Natural
        </button>
        <span class="seg-knob" id="segKnob" aria-hidden="true"></span>
      </div>
    </section>

    <!-- List -->
    <main class="list" id="list"></main>
  </div>

  <!-- Bands Sheet -->
  <div class="sheet-backdrop" id="bandsBackdrop" hidden></div>
  <section class="sheet" id="bandsSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2 class="sheet-title">Bands</h2>
      <button class="sheet-close" id="bandsClose" aria-label="Close">×</button>
    </div>

    <div class="sheet-body" id="bandsBody">
      <!-- injected rows -->
    </div>

    <div class="sheet-foot">
      <button class="primary" id="bandsConfirm">Confirm</button>
    </div>
  </section>

  <!-- Filters Sheet (same UX pattern as home POS — but generic container here) -->
  <div class="sheet-backdrop" id="filtersBackdrop" hidden></div>
  <section class="sheet" id="filtersSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2 class="sheet-title">Filters</h2>
      <button class="sheet-close" id="filtersClose" aria-label="Close">×</button>
    </div>

    <div class="sheet-body" id="filtersBody">
      <div class="empty-note">Filters UI goes here (wired to your dataset fields).</div>
    </div>

    <div class="sheet-foot">
      <button class="primary" id="filtersConfirm">Confirm</button>
    </div>
  </section>

  <script src="/pos/cigars/brand.js?v=1.0.0"></script>
</body>
</html>
