<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aladino • POS</title>
  <style>
    :root{
      --bg:#eaf2f6; --ink:#0f1a2c; --muted:#6b7a90; --brand:#3775c8;
      --line:#dfe7ee; --card:#fff; --shadow:0 10px 28px rgba(15,26,44,.10);
    }
    html,body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:15px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .wrap{
      max-width:480px;
      width:100%;
      margin:0 auto;
      padding:12px 12px 72px;
      box-sizing:border-box;
    }

    /* header (centered title, back left, star right) */
    .topbar{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      height:40px;
      margin-bottom:6px;
    }
    .back{
      position:absolute;
      left:0;
      top:50%;
      transform:translateY(-50%);
      display:inline-flex;
      gap:6px;
      align-items:center;
      color:var(--brand);
      text-decoration:none;
      font-weight:600;
      font-size:14px;
    }
    .title{
      font-size:28px;
      font-weight:700;
      text-align:center;
      line-height:1;
    }
    .fav{
      position:absolute;
      right:0;
      top:50%;
      transform:translateY(-50%);
      font-size:24px;
      color:#f5d34f;
      cursor:pointer;
    }

    /* search with gap under title */
    .search{
      display:flex;align-items:center;background:#fff;border-radius:999px;
      padding:9px 12px;border:1px solid var(--line);box-shadow:var(--shadow);
      margin-top:14px;
    }
    .search input{border:0;outline:0;width:100%;font-size:14px}
    .search svg{opacity:.6}

    /* list */
    .cigar-list{margin-top:12px;display:grid;gap:10px}
    .cigar-item{
      background:#dfe9ef33;
      border-radius:16px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }
    .cigar-left{
      display:flex;
      gap:10px;
      align-items:center;
      min-width:0;
      flex:1 1 auto;
    }
    .brand-icon{
      width:52px;
      height:52px;
      border-radius:14px;
      background:#000;
      display:grid;
      place-items:center;
      overflow:hidden;
      flex:0 0 52px;
    }
    .brand-icon img{width:100%;height:100%;object-fit:contain;}
    .cigar-text{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0; /* allow wrapping */
    }
    .brand-name{
      font-size:12px;
      color:#7a8a9f;
      line-height:1.1;
    }
    .cigar-name{
      font-size:15px;
      font-weight:700;
      line-height:1.1;
      white-space:normal;
      word-break:break-word;
    }
    .cigar-vitola{
      font-size:12px;
      color:#7a8a9f;
      line-height:1.1;
    }
    .cigar-msrp{
      font-size:12px;
      color:#0f1a2c;
      line-height:1.1;
    }
    .inv-wrap{
      display:flex;
      justify-content:flex-end;
      flex:0 0 auto;
    }
    .inv-circle{
      width:44px;
      height:44px;
      border-radius:999px;
      background:#fff;
      border:1.5px solid #d7e1e8;
      display:grid;
      place-items:center;
      font-weight:600;
      font-size:14px;
      color:#0f1a2c;
    }
    .inv-low .inv-circle{
      color:#e11d48;
      border-color:#f4c2cd;
    }
    .empty{color:#7a8a9f;text-align:center;margin:24px 0;font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- top -->
    <div class="topbar">
      <a class="back" href="/pos/cigars/"><span>←</span><span>POS</span></a>
      <div class="title">Aladino</div>
      <div class="fav" title="Favorite brand">★</div>
    </div>

    <!-- search -->
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" placeholder="Search Aladino..." />
    </div>

    <!-- list -->
    <div id="cigarList" class="cigar-list"></div>
    <div id="empty" class="empty" style="display:none;">No cigars found for this brand.</div>
  </div>

  <script>
    const DATA_URL = "/pos/data/cigars_master.json";
    const BRAND = "Aladino";

    const $list = document.getElementById('cigarList');
    const $empty = document.getElementById('empty');
    const $q = document.getElementById('q');

    let ALL_ROWS = [];
    let BRAND_ROWS = [];

    function getMsrp(row){
      return row["CIGAR MSRP"] ??
             row["Cigar MSRP"] ??
             row["MSRP"] ??
             "";
    }
    function moneyMaybe(n){
      const v = Number(n);
      if (isFinite(v)) return v.toFixed(2);
      return n;
    }
    function rootify(p){ return p ? '/' + String(p).replace(/^\/+/, '') : ''; }

    function render(rows){
      $list.innerHTML = "";
      if (!rows || rows.length === 0){
        $empty.style.display = "block";
        return;
      }
      $empty.style.display = "none";

      rows.forEach(r => {
        const invNum = parseInt(r["INVENTORY"] || 0, 10);
        const low = invNum < 12;
        const brandImg = r["Brand IMG"] ? rootify(r["Brand IMG"]) : "/img/icons/brands/aladino.svg";
        const lineCigar = `${r["Line"] || ""} ${r["Cigar"] || ""}`.trim();
        const msrpVal = getMsrp(r);
        const msrpText = msrpVal !== "" ? "$" + moneyMaybe(msrpVal) : "";

        const div = document.createElement("div");
        div.className = "cigar-item";
        div.innerHTML = `
          <div class="cigar-left">
            <div class="brand-icon">
              <img src="${brandImg}" alt="${r["Brand"] || ""}">
            </div>
            <div class="cigar-text">
              <div class="brand-name">${r["Brand"] || ""}</div>
              <div class="cigar-name">${lineCigar}</div>
              <div class="cigar-vitola">${r["Vitola"] || ""}</div>
              <div class="cigar-msrp">${msrpText}</div>
            </div>
          </div>
          <div class="inv-wrap ${low ? "inv-low" : "inv-ok"}">
            <div class="inv-circle">${isNaN(invNum) ? 0 : Math.floor(invNum)}</div>
          </div>
        `;
        $list.appendChild(div);
      });
    }

    function applySearch(){
      const q = $q.value.trim().toLowerCase();
      if (!q){
        render(BRAND_ROWS);
        return;
      }
      const filtered = BRAND_ROWS.filter(r => {
        return (
          (r["Line"] || "").toLowerCase().includes(q) ||
          (r["Cigar"] || "").toLowerCase().includes(q) ||
          (r["Vitola"] || "").toLowerCase().includes(q)
        );
      });
      render(filtered);
    }

    $q.addEventListener("input", applySearch);

    fetch(DATA_URL)
      .then(r => {
        if(!r.ok) throw new Error("failed to load data");
        return r.json();
      })
      .then(json => {
        ALL_ROWS = Array.isArray(json) ? json : [];
        BRAND_ROWS = ALL_ROWS.filter(r => (r["Brand"] || "").trim() === BRAND);
        render(BRAND_ROWS);
      })
      .catch(err => {
        console.error(err);
        $empty.textContent = "Could not load " + DATA_URL;
        $empty.style.display = "block";
      });
  </script>
</body>
</html>
