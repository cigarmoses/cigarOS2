<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS • Cigars</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 110px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      gap: 4px;
      align-items: center;
      font-weight: 500;
    }
    .star {
      font-size: 22px;
      color: #ffcc00;
    }
    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin: 16px 0 14px;
    }
    .search-bar {
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .search-bar input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
    }
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 12px;
    }
    .brand-card {
      text-align: center;
      cursor: pointer;
    }
    .brand-icon {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: #dfe7ec;
      display: grid;
      place-items: center;
      margin: 0 auto 5px;
      overflow: hidden;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-name {
      font-size: 12px;
      font-weight: 500;
      color: #243448;
      line-height: 1.1;
    }
    /* bill tab */
    .pos-bill-tab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1a2c;
      color: #fff;
      border-radius: 50px;
      padding: 10px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 50;
    }
    .pos-bill-icon { font-size: 16px; }
    .pos-bill-badge {
      background: #e11;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .pos-bill-total { font-weight: 600; }
    /* bill modal */
    #billModal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 80;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="/pos/" class="back">← POS</a>
      <div class="star">★</div>
    </div>

    <h1 class="title">CIGARS</h1>

    <div class="search-bar">
      <input id="searchInput" placeholder="Search…" />
    </div>

    <div id="brandGrid" class="brand-grid"></div>
    <p id="empty" style="display:none; margin-top:18px; text-align:center; opacity:.6;">No brands matched.</p>
  </div>

  <!-- bill tab (universal) -->
  <div class="pos-bill-tab" onclick="openBill()">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">0</div>
    <div class="pos-bill-total" id="billTotal">$0.00</div>
  </div>

  <!-- bill modal with iframe -->
  <div id="billModal">
    <div onclick="closeBill()" style="position:fixed;inset:0;background:rgba(0,0,0,.35);"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;height:92vh;display:flex;justify-content:center;align-items:flex-end;">
      <iframe src="/pos/receipt/" style="width:100%;max-width:480px;height:100%;border:none;border-top-left-radius:26px;border-top-right-radius:26px;"></iframe>
    </div>
  </div>

  <script>
    // 👇 change this only when you upload a new CSV online
    const CSV_URL = "/hub/hub_11-5-25.csv";

    const brandGrid = document.getElementById("brandGrid");
    const searchInput = document.getElementById("searchInput");
    const emptyMsg = document.getElementById("empty");
    let ALL_BRANDS = [];

    // fetch CSV from your site
    fetch(CSV_URL)
      .then(r => r.text())
      .then(text => {
        const rows = parseCSV(text);
        // get unique brands
        const map = new Map();
        rows.forEach(row => {
          const brand = (row["Brand"] || "").trim();
          if (!brand) return;
          if (!map.has(brand)) {
            // if CSV has Brand IMG use it, else build path with NO dashes
            const img = (row["Brand IMG"] && row["Brand IMG"].trim())
              ? row["Brand IMG"].trim()
              : `/img/icons/brands/${brand}.svg`;
            map.set(brand, { name: brand, img });
          }
        });
        ALL_BRANDS = Array.from(map.values()).sort((a,b) => a.name.localeCompare(b.name));
        renderBrands(ALL_BRANDS);
      })
      .catch(err => {
        console.error("CSV load failed", err);
        emptyMsg.style.display = "block";
        emptyMsg.textContent = "Could not load " + CSV_URL;
      });

    function renderBrands(list) {
      brandGrid.innerHTML = "";
      if (!list.length) {
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      list.forEach(b => {
        const div = document.createElement("div");
        div.className = "brand-card";
        div.innerHTML = `
          <div class="brand-icon">
            <img src="${b.img}" alt="${b.name}" onerror="this.src='/img/placeholder.svg'">
          </div>
          <div class="brand-name">${b.name}</div>
        `;
        div.addEventListener("click", () => {
          // go to brand page — uses exact brand name, no dashes
          // if your folders are lowercase, you can .toLowerCase() here
          window.location.href = "/pos/cigars/" + encodeURIComponent(b.name) + "/";
        });
        brandGrid.appendChild(div);
      });
    }

    function parseCSV(str) {
      const lines = str.split(/\r?\n/).filter(l => l.trim().length);
      if (!lines.length) return [];
      const headers = splitCSVLine(lines[0]);
      const out = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = splitCSVLine(lines[i]);
        const row = {};
        headers.forEach((h, idx) => {
          row[h.trim()] = (cols[idx] || "").trim();
        });
        out.push(row);
      }
      return out;
    }
    function splitCSVLine(line) {
      const out = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          inQuotes = !inQuotes;
          continue;
        }
        if (ch === "," && !inQuotes) {
          out.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out;
    }

    // search
    searchInput.addEventListener("input", () => {
      const term = searchInput.value.toLowerCase();
      const filtered = ALL_BRANDS.filter(b => b.name.toLowerCase().includes(term));
      renderBrands(filtered);
    });

    // bill tab open/close
    function openBill() {
      document.getElementById("billModal").style.display = "block";
    }
    function closeBill() {
      document.getElementById("billModal").style.display = "none";
    }
    window.closeBill = closeBill;
  </script>
</body>
</html>
