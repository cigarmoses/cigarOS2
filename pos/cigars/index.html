<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cigars</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css" />
</head>

<body class="cigars-page">
  <header class="cigars-topbar">
    <button type="button" class="pos-back" id="cigars-back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main class="cigars-main">
    <section class="cigars-header">
      <h1 class="cigars-title">Cigars</h1>

      <div class="cigars-search-wrap">
        <div class="cigars-search-bar">
          <span class="cigars-search-icon">🔍</span>
          <input
            id="cigars-search-input"
            type="search"
            placeholder="Search for brand, cigar, vitola, etc..."
          />
        </div>
      </div>
    </section>

    <section class="cigars-filters-section">
      <div class="cigars-filters-card">
        <div class="cigars-filters-header">
          <div class="cigars-filters-title">Filters</div>
          <button type="button" class="cigars-filters-viewall" id="filters-view-all">
            view all
          </button>
        </div>

        <div class="cigars-filters-grid">
          <div class="cigars-filters-row">
            <button class="filter-pill" id="filter-manufacturer" data-filter="manufacturer">Manufacturer</button>
            <button class="filter-pill" id="filter-brand" data-filter="brand">Brand</button>
          </div>

          <div class="cigars-filters-row">
            <button class="filter-pill" id="filter-shade" data-filter="shade">Shade</button>
            <button class="filter-pill" id="filter-vitola" data-filter="vitola">Vitola</button>
            <button class="filter-pill" id="filter-length" data-filter="length">Length</button>
            <button class="filter-pill" id="filter-ring" data-filter="ring">Ring</button>
          </div>

          <div class="cigars-filters-row">
            <button class="filter-pill" id="filter-shape" data-filter="shape">Shape</button>
            <button class="filter-pill" id="filter-strength" data-filter="strength">Strength</button>
          </div>

          <div class="cigars-filters-row">
            <button class="filter-pill filter-pill--toggle" id="filter-tubo" data-filter="tubo">Tubo</button>
            <button class="filter-pill filter-pill--toggle" id="filter-flavored" data-filter="flavored">Flavored</button>
            <button class="filter-pill filter-pill--toggle" id="filter-tin" data-filter="tin">Tin</button>
            <button class="filter-pill filter-pill--toggle" id="filter-pack" data-filter="pack">Pack</button>
          </div>

          <div class="cigars-filters-row">
            <button class="filter-pill filter-pill--toggle" id="filter-barberpole" data-filter="barberpole">Barberpole</button>
            <button class="filter-pill filter-pill--toggle" id="filter-boxpressed" data-filter="boxpressed">Box-Pressed</button>
          </div>
        </div>
      </div>
    </section>

    <section class="cigars-brands-section">
      <h2 class="cigars-brands-title">Brands</h2>

      <!-- Builder compatibility + Dec 10 styling hook -->
      <div id="category-grid" class="brands-grid"></div>
    </section>
  </main>

  <script defer src="/pos/pos.js"></script>
  <script defer src="/pos/img/scripts/build-cigars.js"></script>
  <script defer src="/pos/cigars/cigars.js"></script>
</body>
</html>
