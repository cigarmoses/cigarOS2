<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • POS</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
      --panel: #ffffff;
      --pill: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 90px;
    }
    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .pos-star {
      font-size: 22px;
      color: #ffcc00;
    }
    .pos-header-spacer {
      height: 16px;
    }
    .pos-title {
      text-align: center;
      font-weight: 700;
      font-size: 32px;
      margin: 0 0 14px;
    }

    /* search row with filter button on the left like your mock */
    .search-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      align-items: center;
    }
    .filter-pill {
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      cursor: pointer;
      justify-content: center;
    }
    .filter-pill svg {
      width: 15px;
      height: 15px;
    }
    .pos-search {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      gap: 6px;
      border: 1px solid rgba(0,0,0,.02);
    }
    .pos-search input {
      border: 0;
      outline: 0;
      width: 100%;
      background: transparent;
      font-size: 14px;
    }

    /* brand grid – 4 across */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 14px;
      margin-top: 20px;
    }
    .brand-tile {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      overflow: hidden;
      background: #d7dfe4;
      display: grid;
      place-items: center;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-label {
      font-size: 13px;
      font-weight: 500;
    }
    .brand-disabled {
      opacity: .6;
      pointer-events: none;
    }

    /* bill tab (same as other pages) */
    .pos-bill-tab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1a2c;
      color: #fff;
      border-radius: 50px;
      padding: 10px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 50;
    }
    .pos-bill-icon { font-size: 16px; }
    .pos-bill-badge {
      background: #e11;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .pos-bill-total { font-weight: 600; }

    /* FILTER PANEL */
    .filter-overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 9999;
    }
    .filter-overlay.show {
      display: block;
    }
    .filter-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.35);
    }
    .filter-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(420px, 100%);
      height: 100%;
      background: #fff;
      border-top-left-radius: 26px;
      border-bottom-left-radius: 26px;
      box-shadow: -4px 0 10px rgba(0,0,0,0.08);
      overflow-y: auto;
      padding: 16px 16px 40px;
    }
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .filter-title {
      font-weight: 600;
      font-size: 16px;
    }
    .filter-close {
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .chev {
      border: solid #000;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 3px;
      transform: rotate(45deg);
      margin-left: 6px;
    }
    /* vitola icons grid */
    .vitola-grid, .shade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 10px;
    }
    .vitola-item, .shade-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .vitola-icon, .shade-icon {
      width: 58px;
      height: 36px;
      border-radius: 14px;
      background: #f5f5f5;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .shade-icon {
      width: 48px;
      height: 48px;
      border-radius: 999px;
    }
    .vitola-icon img,
    .shade-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .vitola-label, .shade-label {
      font-size: 11px;
      text-align: center;
      line-height: 1.1;
    }
    .is-selected .vitola-icon,
    .is-selected .shade-icon {
      outline: 2px solid #0f1a2c;
    }
    /* features checkboxes */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .feature-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #0f1a2c;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">CIGARS</h1>

    <!-- search & filter -->
    <div class="search-row">
      <div class="filter-pill" onclick="openFilter()">
        <!-- simple funnel icon -->
        <svg viewBox="0 0 20 20">
          <path fill="white" d="M2 3h16l-5.5 6.2V14L7.5 17V9.2L2 3z"/>
        </svg>
        <span>filter</span>
      </div>
      <div class="pos-search">
        <input id="searchInput" placeholder="Search brands..." />
      </div>
    </div>

    <!-- brand grid -->
    <div id="brandGrid" class="brand-grid"></div>
  </div>

  <!-- bill tab -->
  <div class="pos-bill-tab" onclick="openBill()">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <!-- bill modal -->
  <div id="billModal" class="bill-modal" style="display:none;">
    <div class="bill-backdrop" onclick="closeBill()" style="position:fixed;inset:0;background:rgba(0,0,0,.35);"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;height:92vh;display:flex;justify-content:center;align-items:flex-end;">
      <iframe src="/pos/receipt/" title="Invoice" style="width:100%;max-width:480px;height:100%;border:none;border-top-left-radius:26px;border-top-right-radius:26px;overflow:hidden;"></iframe>
    </div>
  </div>

  <!-- FILTER PANEL -->
  <div id="filterOverlay" class="filter-overlay">
    <div class="filter-backdrop" onclick="closeFilter()"></div>
    <div class="filter-panel">
      <div class="filter-header">
        <div class="filter-title">Filters</div>
        <div class="filter-close" onclick="closeFilter()">×</div>
      </div>

      <!-- Vitola -->
      <div class="section" id="secVitola">
        <div class="section-title" onclick="toggleSection('vitolaBody')">
          <span>Vitola</span>
          <span class="chev"></span>
        </div>
        <div id="vitolaBody" class="vitola-grid">
          <!-- will be filled by JS -->
        </div>
      </div>

      <hr style="border:none;border-top:1px solid rgba(0,0,0,.05);margin:10px 0 14px;">

      <!-- Wrapper Shade -->
      <div class="section" id="secShade">
        <div class="section-title" onclick="toggleSection('shadeBody')">
          <span>Wrapper Shade</span>
          <span class="chev"></span>
        </div>
        <div id="shadeBody" class="shade-grid">
          <!-- JS -->
        </div>
      </div>

      <hr style="border:none;border-top:1px solid rgba(0,0,0,.05);margin:10px 0 14px;">

      <!-- Features -->
      <div class="section" id="secFeatures">
        <div class="section-title" onclick="toggleSection('featuresBody')">
          <span>Features</span>
          <span class="chev"></span>
        </div>
        <div id="featuresBody" class="feature-list">
          <label class="feature-row"><input type="checkbox" value="boxPressed" class="feat-check"> Box Pressed</label>
          <label class="feature-row"><input type="checkbox" value="flavoredSweet" class="feat-check"> Flavored/Sweet</label>
          <label class="feature-row"><input type="checkbox" value="pack" class="feat-check"> Packs</label>
          <label class="feature-row"><input type="checkbox" value="tin" class="feat-check"> Tins</label>
          <label class="feature-row"><input type="checkbox" value="barberpole" class="feat-check"> Barberpole</label>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* 1. BRAND GRID ---------------------------------------------------- */
    // This is the visual roster of brand icons in /img/icons/brands/
    const ALL_BRANDS = [
      "Aladino",
      "1502",
      "Acid",
      "Aging Room",
      "Alec Bradley",
      "Angel Cuesta",
      "Arturo Fuente",
      "Ashton",
      "Asylum 13",
      "Atabey",
      "AVO",
      "Baccarat"
      // keep adding as you upload SVGs
    ];

    const brandGrid = document.getElementById('brandGrid');
    const searchInput = document.getElementById('searchInput');

    function renderBrands(term = "") {
      brandGrid.innerHTML = "";
      ALL_BRANDS
        .filter(name => name.toLowerCase().includes(term.toLowerCase()))
        .forEach(name => {
          const isAladino = name.toLowerCase() === "aladino";
          const tile = document.createElement('a');
          tile.className = "brand-tile" + (isAladino ? "" : " brand-disabled");
          tile.href = isAladino ? "/pos/cigars/aladino/" : "javascript:void(0)";
          tile.innerHTML = `
            <div class="brand-icon">
              <img src="/img/icons/brands/${name.toLowerCase().replace(/\s+/g,'')}.svg" alt="${name}">
            </div>
            <div class="brand-label">${name}</div>
          `;
          brandGrid.appendChild(tile);
        });
    }

    renderBrands();

    searchInput.addEventListener('input', e => {
      renderBrands(e.target.value);
    });

    /* 2. FILTER PANEL -------------------------------------------------- */
    const filterOverlay = document.getElementById('filterOverlay');

    function openFilter() {
      filterOverlay.classList.add('show');
    }
    function closeFilter() {
      filterOverlay.classList.remove('show');
    }
    function toggleSection(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.display = (el.style.display === "none") ? "grid" : "none";
    }

    // vitolas to show (these map to /img/icons/vitolas/*.svg)
    const VITOLAS = [
      { key: "robusto", label: "Robusto" },
      { key: "toro", label: "Toro" },
      { key: "churchill", label: "Churchill" },
      { key: "gordo", label: "Gordo" },
      { key: "perfecto", label: "Perfecto" },
      { key: "torpedo", label: "Torpedo" }
    ];
    // wrapper shades to show (map to /img/icons/wrappershades/*.svg)
    const SHADES = [
      { key: "connecticut", label: "Connecticut" },
      { key: "colorado", label: "Colorado" },
      { key: "coloradomaduro", label: "Colorado Maduro" },
      { key: "maduro", label: "Maduro" },
      { key: "oscuro", label: "Oscuro" }
    ];

    const vitolaBody = document.getElementById('vitolaBody');
    const shadeBody = document.getElementById('shadeBody');

    VITOLAS.forEach(v => {
      const div = document.createElement('div');
      div.className = "vitola-item";
      div.dataset.value = v.key;
      div.innerHTML = `
        <div class="vitola-icon">
          <img src="/img/icons/vitolas/${v.key}.svg" alt="${v.label}">
        </div>
        <div class="vitola-label">${v.label}</div>
      `;
      div.addEventListener('click', () => {
        div.classList.toggle('is-selected');
        collectFilters();
      });
      vitolaBody.appendChild(div);
    });

    SHADES.forEach(s => {
      const div = document.createElement('div');
      div.className = "shade-item";
      div.dataset.value = s.key;
      div.innerHTML = `
        <div class="shade-icon">
          <img src="/img/icons/wrappershades/${s.key}.svg" alt="${s.label}">
        </div>
        <div class="shade-label">${s.label}</div>
      `;
      div.addEventListener('click', () => {
        div.classList.toggle('is-selected');
        collectFilters();
      });
      shadeBody.appendChild(div);
    });

    // collect selected filters (you can re-use this in brand pages)
    function collectFilters() {
      const selectedVitolas = Array.from(document.querySelectorAll('.vitola-item.is-selected')).map(v => v.dataset.value);
      const selectedShades = Array.from(document.querySelectorAll('.shade-item.is-selected')).map(v => v.dataset.value);
      const selectedFeatures = Array.from(document.querySelectorAll('.feat-check:checked')).map(v => v.value);

      // for now just log them – hook this to your cigar-list filtering
      console.log({
        vitolas: selectedVitolas,
        wrapperShades: selectedShades,
        features: selectedFeatures
      });
    }

    document.querySelectorAll('.feat-check').forEach(chk => {
      chk.addEventListener('change', collectFilters);
    });

    /* 3. BILL MODAL (same pattern everywhere) -------------------------- */
    function openBill() {
      document.getElementById('billModal').style.display = 'block';
    }
    function closeBill() {
      document.getElementById('billModal').style.display = 'none';
    }
    // expose to iframe
    window.closeBill = closeBill;
  </script>
</body>
</html>
