<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <!-- Global POS + Type system -->
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/css/type.css" />

  <title>POS • Cigars</title>

  <style>
    :root {
      --bg: #dfeaf0;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --card: #ffffff;
      --pill: #f3f7fb;
      --radius-lg: 24px;
      --radius-icon: 124px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text); /* SF Pro Text via type.css */
      min-height: 100vh;
    }

    /* --------- Shell --------- */

    .cigars-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 16px 32px;
    }

    .pos-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 12px;
      gap: 8px;
    }

    .pos-back {
      font-family: var(--font-text);
      font-size: 14px;
      text-decoration: none;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pos-back-icon {
      font-size: 18px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .pos-title {
      flex: 1;
      text-align: center;
      font-family: var(--font-display); /* SF Pro Display Heavy */
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .pos-spacer {
      width: 48px; /* balances back link */
      height: 1px;
    }

    /* --------- Card / Panel --------- */

    .cigars-card {
      background: var(--card); /* flat white background per your note */
      border-radius: var(--radius-lg);
      padding: 14px 14px 20px;
    }

    .cigars-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cigars-header-title {
      font-family: var(--font-display); /* SF Pro Display Heavy */
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .cigars-header-sub {
      font-family: var(--font-display);
      font-weight: 600; /* SF Pro Display Bold */
      font-size: 12px;
      color: var(--muted);
    }

    /* --------- Master Search --------- */

    .master-search-wrap {
      margin-bottom: 12px;
    }

    .master-search-input {
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: 9px 12px;
      font-family: var(--font-text);
      font-size: 14px;
      background: var(--pill);
      color: var(--ink);
      outline: none;
    }

    .master-search-input::placeholder {
      color: var(--muted);
    }

    /* --------- Filters row (chips) --------- */

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .filter-chip {
      font-family: var(--font-text);
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--pill);
      color: var(--muted);
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-chip.is-active {
      background: #cfe2ff;
      color: var(--ink);
      font-weight: 600;
    }

    /* --------- Brand section --------- */

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 6px;
    }

    .section-label {
      font-family: var(--font-display);
      font-weight: 600; /* SF Pro Display Bold */
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-badge {
      font-family: var(--font-text);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--pill);
      color: var(--muted);
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)); /* 3 per row */
      gap: 16px 10px;
      margin-top: 4px;
    }

    .brand-item {
      text-align: center;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 90px;
      height: 90px;
      border-radius: var(--radius-icon); /* rounded corners, 124-style */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent; /* lets SVG decide its own background */
    }

    .brand-icon img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-family: var(--font-display); /* SF Pro Display Regular */
      font-weight: 400;
      font-size: 12px;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    /* Small “no results” style */
    .no-results {
      margin-top: 12px;
      font-family: var(--font-text);
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    @media (min-width: 540px) {
      .cigars-shell {
        padding-top: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="cigars-shell">
    <!-- Top bar -->
    <header class="pos-topbar">
      <a href="/pos/" class="pos-back">
        <span class="pos-back-icon">‹</span>
        <span>Back</span>
      </a>
      <div class="pos-title">POS</div>
      <div class="pos-spacer"></div>
    </header>

    <!-- White card panel -->
    <main class="cigars-card">
      <div class="cigars-header">
        <div>
          <div class="cigars-header-title">Cigars</div>
          <!-- Optional sublabel; remove if you want it totally clean -->
          <div class="cigars-header-sub">Search, filter & choose brand</div>
        </div>
      </div>

      <!-- Master search bar -->
      <div class="master-search-wrap">
        <input
          id="masterSearch"
          class="master-search-input"
          type="search"
          placeholder="Search by cigar, brand, line, wrapper..."
          autocomplete="off"
        />
      </div>

      <!-- Filters row - built/enhanced by JS -->
      <div id="filterRow" class="filters-row">
        <!-- Example static chips; your JS can replace/augment these -->
        <button class="filter-chip" data-filter-id="wrapper">Wrapper</button>
        <button class="filter-chip" data-filter-id="vitola">Vitola</button>
        <button class="filter-chip" data-filter-id="strength">Strength</button>
        <button class="filter-chip" data-filter-id="country">Country</button>
      </div>

      <!-- Brand section label -->
      <div class="section-row">
        <div class="section-label">Brands</div>
        <div id="brandCount" class="section-badge">0 brands</div>
      </div>

      <!-- Brand grid: JS will populate #brandGrid with .brand-item tiles -->
      <div id="brandGrid" class="brand-grid">
        <!-- Example structure for one item; your JS should create this pattern:
        <a href="/pos/brand.html?brand=Ashton" class="brand-item">
          <div class="brand-icon">
            <img src="/img/icons/brands/ashton.svg" alt="Ashton" loading="lazy" />
          </div>
          <div class="brand-name">Ashton</div>
        </a>
        -->
      </div>

      <div id="noResults" class="no-results" style="display:none;">
        No cigars match your search yet.
      </div>
    </main>
  </div>

  <!-- Build / filter logic for cigars + brands -->
  <script src="/pos/img/scripts/build-cigars.js" defer></script>
</body>
</html>
