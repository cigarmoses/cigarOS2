<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Cigars</title>

  <link rel="stylesheet" href="/css/type.css?v=21" />
  <link rel="stylesheet" href="/pos/pos.css?v=22" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css?v=31" />
</head>

<body class="cigars-page">
  <header class="cigars-topbar">
    <button
      type="button"
      class="cigars-back"
      aria-label="Back"
      onclick="history.length > 1 ? history.back() : window.location.href='/'"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <div class="cigars-topbar-spacer"></div>

    <div class="cigars-theme-dock">
      <button id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="track"></span>
        <span class="knob">
          <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M14.5 3.5a8 8 0 1 0 6 13.3A9 9 0 0 1 14.5 3.5Z" fill="currentColor"></path>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <main class="cigars-main">
    <div class="cigars-title-row">
      <h1 class="cigars-title">Cigars</h1>

      <div class="cigars-title-actions">
        <button type="button" class="cigars-filter-btn" id="btn-open-filters">
          <svg viewBox="0 0 24 24">
            <path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="cigars-search-wrap">
      <div class="cigars-search-bar">
        <div class="cigars-search-icon">
          <svg viewBox="0 0 24 24">
            <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>

        <input
          id="cigars-search-input"
          type="search"
          autocomplete="off"
          placeholder=""
        />
      </div>

      <div id="cigarsAppliedFilters"></div>
    </div>

    <section id="cigarsList"></section>
  </main>

  <nav class="cigars-bottom-bar">
    <div class="cigars-bottom-bar-inner">
      <button type="button" class="cb-nav-btn" id="cbSearchBtn">
        <svg class="cb-nav-svg" viewBox="0 0 24 24">
          <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>

      <a class="cb-nav-btn" href="/">
        <svg class="cb-nav-svg" viewBox="0 0 24 24">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.1"/>
        </svg>
        <span>Home</span>
      </a>

      <a class="cb-nav-btn" href="/pos/favorites/">
        <svg class="cb-nav-svg" viewBox="0 0 24 24">
          <path d="M12 21s-6.7-4.35-9.33-7.02C.7 12.02 1.1 8.5 4 7.1c1.9-.9 4.1-.3 5.3 1.2 1.2-1.5 3.4-2.1 5.3-1.2 2.9 1.4 3.3 4.92 1.33 6.88C18.7 16.65 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.9"/>
        </svg>
        <span>Favorites</span>
      </a>

      <a class="cb-nav-btn" href="/pos/invoice/">
        <svg class="cb-nav-svg" viewBox="0 0 24 24">
          <path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
          <circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
        </svg>
        <span>Cart</span>
      </a>
    </div>
  </nav>

  <script src="/pos/cart.js?v=30" defer></script>
  <script src="/pos/cigars/cigars.js?v=22" defer></script>

  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("theme") || "light";

      function apply(theme){
        root.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
        toggle.setAttribute("aria-pressed", theme === "dark");
      }

      apply(saved);

      toggle.addEventListener("click", () => {
        apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
      });
    })();
  </script>
</body>
</html>
