<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CIGARS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    /* 4-column cigar grid, matches Food & Bevs layout */
    .cigar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 12px;
    }
    .cigar-tile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #0f1a2c;
      text-decoration: none;
    }
    .cigar-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      background: #d9d9d9;
      display: grid;
      place-items: center;
    }
    .cigar-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cigar-label {
      font-size: 13px;
      font-weight: 500;
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <!-- top bar -->
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">CIGARS</h1>

    <!-- search bar -->
    <div class="pos-search">
      <input placeholder="Search" id="searchInput" />
    </div>

    <!-- cigar icons -->
    <div id="cigarGrid" class="cigar-grid"></div>
  </div>

  <!-- bill tab -->
  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    // all cigar brand icons from /img/icons/brands/
    const CIGAR_BRANDS = [
      "aladino", "1502", "acid", "agingroom", "alecbradley", "angelcuesta",
      "arturofuente", "ashton", "asylum13", "atabey", "avo", "baccarat"
      // add more as you upload them
    ];

    const grid = document.getElementById("cigarGrid");
    const searchInput = document.getElementById("searchInput");

    function renderGrid(filter = "") {
      grid.innerHTML = "";
      CIGAR_BRANDS.filter(name =>
        name.toLowerCase().includes(filter.toLowerCase())
      ).forEach(name => {
        const div = document.createElement("a");
        div.className = "cigar-tile";
        div.href = `/pos/cigars/${name}/`;
        div.innerHTML = `
          <div class="cigar-icon">
            <img src="/img/icons/brands/${name}.svg" alt="${name}">
          </div>
          <div class="cigar-label">${formatName(name)}</div>
        `;
        grid.appendChild(div);
      });
    }

    function formatName(name) {
      return name
        .replace(/-/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    renderGrid();

    searchInput.addEventListener("input", e => {
      renderGrid(e.target.value);
    });
  </script>
</body>
</html>
