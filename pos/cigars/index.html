<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Cigars</title>

  <link rel="stylesheet" href="/css/type.css?v=20" />
  <link rel="stylesheet" href="/pos/pos.css?v=20" />
  <link rel="stylesheet" href="/uxui/topbar/topbar.css?v=20" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css?v=20" />
</head>

<body class="cigars-page">
  <div id="universalTopbar"></div>

  <main class="cigars-main" role="main">
    <div class="cigars-title-row">
      <h1 class="cigars-title">Cigars</h1>

      <div class="cigars-title-actions">
        <button type="button" class="cigars-filter-btn" id="btn-open-filters" aria-label="Filters">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M7 12h10M10 18h4"
                  fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="cigars-search-wrap">
      <div class="cigars-search-bar">
        <div class="cigars-search-icon">🔍</div>
        <input
          id="cigars-search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder=""
          aria-label="Search cigars"
        />
      </div>

      <div class="cigars-applied-filters" id="cigarsAppliedFilters" aria-label="Applied filters"></div>
    </div>

    <section class="cigars-list" id="cigarsList"></section>
  </main>

  <script src="/uxui/topbar/topbar.js?v=20" defer></script>
  <script src="/pos/cart.js?v=20" defer></script>
  <script src="/pos/cigars/cigars.js?v=20" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.CigarOSTopbar) {
        window.CigarOSTopbar.mount("#universalTopbar", {
          searchHref: "/search/",
          homeHref: "/",
          favoritesHref: "/pos/favorites/",
          cartHref: "/pos/invoice/",
          showThemeToggle: true
        });
      }
    });
  </script>
</body>
</html>
