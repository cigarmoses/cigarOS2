<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/css/type.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS</title>

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --pill: #f2f4f7;
      --pill-active: #3b99ff;
      --pill-active-text: #ffffff;
      --outline: #d5dde7;
      --feature-active: #007aff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      padding: 24px 18px 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Heading */
    .page-title {
      font-family: var(--font-display, "SF Pro Display", -apple-system, system-ui, sans-serif);
      font-size: 40px;
      line-height: 1.0;
      font-weight: 800;
      margin: 0 0 18px;
    }

    /* Master search bar */
    .master-search-wrap {
      margin-bottom: 16px;
    }

    .master-search {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--outline);
      background: #f9fafb;
      box-shadow: 0 0 0 0 transparent;
    }

    .master-search-icon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .master-search-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      width: 100%;
    }

    .master-search-input::placeholder {
      color: #a0acbd;
    }

    /* Filter rows */
    .filters {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .filter-pill {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--pill);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .filter-pill.primary {
      border-radius: 14px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .filter-pill.has-selection {
      background: var(--pill-active);
      color: var(--pill-active-text);
    }

    /* Features row */
    .features-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eef1f6;
      margin-bottom: 12px;
    }

    .feature-toggle {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      gap: 4px;
    }

    .feature-label {
      color: var(--ink);
      font-weight: 500;
    }

    .feature-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid #c5ceda;
      background: transparent;
    }

    .feature-toggle.active .feature-label {
      color: var(--feature-active);
      font-weight: 600;
    }

    .feature-toggle.active .feature-dot {
      background: var(--feature-active);
      border-color: var(--feature-active);
    }

    /* Results list */
    .results {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .cigar-card {
      background: #f7f9fc;
      border-radius: 14px;
      padding: 12px 12px 10px;
      border: 1px solid #e0e6f0;
    }

    .cigar-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .cigar-line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .cigar-meta {
      font-size: 12px;
      color: var(--muted);
    }

    /* Popup overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      justify-content: flex-end;
      z-index: 2000;
    }

    .overlay.visible {
      display: flex;
    }

    .filter-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      max-height: 70vh;
      border-radius: 18px 18px 0 0;
      margin: 0 auto;
      padding: 12px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #d0d6e0;
      margin: 4px auto 4px;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }

    .sheet-search {
      border-radius: 999px;
      border: 1px solid #dde3ef;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sheet-search input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
    }

    .sheet-search input::placeholder {
      color: #a0acbd;
    }

    .sheet-options {
      flex: 1;
      overflow-y: auto;
      margin-top: 6px;
      padding-right: 2px;
    }

    .sheet-option {
      padding: 9px 2px;
      font-size: 15px;
      border-bottom: 1px solid #f0f2f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .sheet-option-label {
      flex: 1;
    }

    .sheet-option-check {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid #c5ceda;
      background: #ffffff;
    }

    .sheet-option.selected .sheet-option-check {
      background: var(--feature-active);
      border-color: var(--feature-active);
    }

    .sheet-footer {
      margin-top: 10px;
    }

    .sheet-done {
      width: 100%;
      padding: 11px 0;
      border-radius: 11px;
      background: var(--feature-active);
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .page {
        padding-top: 32px;
      }
      .page-title {
        font-size: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">Cigars</h1>

    <!-- Master search -->
    <div class="master-search-wrap">
      <div class="master-search">
        <svg class="master-search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" stroke="#9aa5b6" stroke-width="1.5" fill="none"></circle>
          <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="#9aa5b6" stroke-width="1.5" stroke-linecap="round"></line>
        </svg>
        <input
          id="masterSearch"
          class="master-search-input"
          type="search"
          placeholder="Search cigars, brands, anything…" />
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <!-- Line 1 -->
      <div class="filter-row">
        <div class="filter-pill primary" data-filter="manufacturer">Manufacturer</div>
        <div class="filter-pill primary" data-filter="brand">Brand</div>
      </div>

      <!-- Line 2 -->
      <div class="filter-row">
        <div class="filter-pill" data-filter="priceRange">Price range</div>
        <div class="filter-pill" data-filter="vitola">Vitola</div>
        <div class="filter-pill" data-filter="rg">RG</div>
        <div class="filter-pill" data-filter="length">Length</div>
        <div class="filter-pill" data-filter="wrapperShade">Wrapper Shade</div>
      </div>

      <!-- Line 3 -->
      <div class="filter-row">
        <div class="filter-pill" data-filter="wrapper">Wrapper</div>
        <div class="filter-pill" data-filter="binder">Binder</div>
        <div class="filter-pill" data-filter="filler">Filler</div>
        <div class="filter-pill" data-filter="origin">Origin</div>
        <div class="filter-pill" data-filter="strength">Strength</div>
        <div class="filter-pill" data-filter="shape">Shape</div>
      </div>
    </div>

    <!-- Line 4: Features (single click) -->
    <div class="features-row">
      <div class="feature-toggle" data-feature="boxPressed">
        <span class="feature-label">Box-Pressed</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="tubo">
        <span class="feature-label">Tubo</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="flavored">
        <span class="feature-label">Flavored</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="tin">
        <span class="feature-label">Tin</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="pack">
        <span class="feature-label">Pack</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="barberpole">
        <span class="feature-label">Barberpole</span>
        <div class="feature-dot"></div>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="results"></div>
  </div>

  <!-- Filter popup sheet -->
  <div id="filterOverlay" class="overlay">
    <div class="filter-sheet">
      <div class="sheet-handle"></div>
      <div id="sheetTitle" class="sheet-title">Filter</div>
      <div class="sheet-search">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" stroke="#9aa5b6" stroke-width="1.5" fill="none"></circle>
          <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="#9aa5b6" stroke-width="1.5" stroke-linecap="round"></line>
        </svg>
        <input id="sheetSearchInput" type="search" placeholder="Search in filter…" />
      </div>
      <div id="sheetOptions" class="sheet-options"></div>
      <div class="sheet-footer">
        <button id="sheetDone" class="sheet-done">Done</button>
      </div>
    </div>
  </div>

  <script>
    // ---- DATA SOURCE ----
    // Point this at your hub JSON (all cigars inventory)
    const DATA_URL = "/pos/pos-hub.json"; // change if your path is different

    let allCigars = [];
    let currentFiltered = [];

    const state = {
      searchText: "",
      filters: {
        manufacturer: [],
        brand: [],
        priceRange: [],
        vitola: [],
        rg: [],
        length: [],
        wrapperShade: [],
        wrapper: [],
        binder: [],
        filler: [],
        origin: [],
        strength: [],
        shape: [],
        features: {
          boxPressed: false,
          tubo: false,
          flavored: false,
          tin: false,
          pack: false,
          barberpole: false
        }
      }
    };

    const filterConfig = {
      manufacturer: { label: "Manufacturer", field: "manufacturer" },
      brand:       { label: "Brand",        field: "brand" },
      priceRange:  { label: "Price range",  field: "__priceRange" },
      vitola:      { label: "Vitola",       field: "vitola" },
      rg:          { label: "RG",           field: "ring" },
      length:      { label: "Length",       field: "length" },
      wrapperShade:{ label: "Wrapper Shade",field: "wrapper_shade" },
      wrapper:     { label: "Wrapper",      field: "wrapper" },
      binder:      { label: "Binder",       field: "binder" },
      filler:      { label: "Filler",       field: "filler" },
      origin:      { label: "Origin",       field: "origin" },
      strength:    { label: "Strength",     field: "strength" },
      shape:       { label: "Shape",        field: "shape" }
    };

    const PRICE_RANGES = [
      { label: "$0 – $9.99",  min: 0,  max: 9.99 },
      { label: "$10 – $14.99",min:10,  max:14.99 },
      { label: "$15 – $19.99",min:15,  max:19.99 },
      { label: "$20 – $29.99",min:20,  max:29.99 },
      { label: "$30+",        min:30,  max:9999 }
    ];

    // --------- LOAD DATA ---------
    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        allCigars = await res.json();
      } catch (e) {
        console.error("Error loading cigars data", e);
        allCigars = [];
      }
      applyFilters();
    }

    // --------- RENDER RESULTS ---------
    function renderResults(list) {
      const container = document.getElementById("results");
      if (!list.length) {
        container.innerHTML = '<div style="font-size:13px;color:#8994a5;">No cigars match your filters yet.</div>';
        return;
      }

      container.innerHTML = list.map(c => {
        const line  = c.line || "";
        const cigar = c.cigar || c.name || "";
        const brand = c.brand || "";
        const vitola = c.vitola || "";
        const rg = c.ring || c.rg || "";
        const len = c.length || "";
        const wrapper = c.wrapper || "";
        const origin = c.origin || "";
        return `
          <div class="cigar-card">
            <div class="cigar-name">${cigar}</div>
            <div class="cigar-line">${brand}${line ? " • " + line : ""}</div>
            <div class="cigar-meta">
              ${vitola ? vitola + " • " : ""}${len && rg ? `${len} × ${rg}` : ""}
            </div>
            <div class="cigar-meta">
              ${wrapper || ""}${wrapper && origin ? " • " : ""}${origin || ""}
            </div>
          </div>
        `;
      }).join("");
    }

    // --------- APPLY FILTERS ---------
    function applyFilters() {
      const text = state.searchText.trim().toLowerCase();

      let list = allCigars.filter(c => {
        // master search
        if (text) {
          const haystack = [
            c.cigar, c.name, c.line, c.brand, c.manufacturer,
            c.vitola, c.wrapper, c.wrapper_shade, c.binder, c.filler,
            c.origin, c.strength, c.shape, c.notes, c.size
          ].filter(Boolean).join(" ").toLowerCase();

          if (!haystack.includes(text)) return false;
        }

        // normal multi-select filters
        for (const key of Object.keys(filterConfig)) {
          const selected = state.filters[key];
          if (!selected || !selected.length) continue;

          if (key === "priceRange") {
            const price = parseFloat(c.msrp || c.price || c.retail || "0") || 0;
            const ok = selected.some(label => {
              const range = PRICE_RANGES.find(r => r.label === label);
              return range && price >= range.min && price <= range.max;
            });
            if (!ok) return false;
          } else {
            const field = filterConfig[key].field;
            const val = (c[field] != null ? String(c[field]) : "").trim();
            if (!selected.includes(val)) return false;
          }
        }

        // feature toggles
        const ft = state.filters.features;
        if (ft.boxPressed && !truthy(c.box_pressed || c.boxpressed)) return false;
        if (ft.tubo       && !truthy(c.tubo)) return false;
        if (ft.flavored   && !truthy(c.flavored)) return false;
        if (ft.tin        && !truthy(c.tin)) return false;
        if (ft.pack       && !truthy(c.pack)) return false;
        if (ft.barberpole && !truthy(c.barberpole)) return false;

        return true;
      });

      currentFiltered = list;
      renderResults(list);
      refreshFilterPills();
      refreshFeatureToggles();
    }

    function truthy(v) {
      if (v === true) return true;
      if (typeof v === "number") return v !== 0;
      if (!v) return false;
      const s = String(v).toLowerCase();
      return ["y","yes","true","1"].includes(s);
    }

    // --------- MASTER SEARCH ---------
    document.getElementById("masterSearch").addEventListener("input", e => {
      state.searchText = e.target.value;
      applyFilters();
    });

    // --------- FILTER POPUP SHEET ---------
    const overlay = document.getElementById("filterOverlay");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetSearchInput = document.getElementById("sheetSearchInput");
    const sheetOptions = document.getElementById("sheetOptions");
    const sheetDone = document.getElementById("sheetDone");

    let activeFilterKey = null;
    let activeOptionsAll = [];

    document.querySelectorAll(".filter-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const key = pill.getAttribute("data-filter");
        openFilterSheet(key);
      });
    });

    function openFilterSheet(key) {
      activeFilterKey = key;
      const cfg = filterConfig[key];
      if (!cfg) return;

      sheetTitle.textContent = cfg.label;
      sheetSearchInput.value = "";

      if (key === "priceRange") {
        activeOptionsAll = PRICE_RANGES.map(r => r.label);
      } else {
        const field = cfg.field;
        const set = new Set();
        allCigars.forEach(c => {
          const val = c[field];
          if (val != null && String(val).trim() !== "") {
            set.add(String(val).trim());
          }
        });
        activeOptionsAll = Array.from(set).sort((a,b)=>a.localeCompare(b));
      }

      renderSheetOptions(activeOptionsAll);
      overlay.classList.add("visible");
      sheetSearchInput.focus();
    }

    function renderSheetOptions(list) {
      const selected = state.filters[activeFilterKey] || [];
      sheetOptions.innerHTML = list.map(opt => {
        const isSel = selected.includes(opt);
        return `
          <div class="sheet-option ${isSel ? "selected" : ""}" data-value="${opt}">
            <div class="sheet-option-label">${opt}</div>
            <div class="sheet-option-check"></div>
          </div>
        `;
      }).join("");

      sheetOptions.querySelectorAll(".sheet-option").forEach(el => {
        el.addEventListener("click", () => {
          const val = el.getAttribute("data-value");
          toggleFilterValue(activeFilterKey, val);
          el.classList.toggle("selected");
        });
      });
    }

    sheetSearchInput.addEventListener("input", () => {
      const q = sheetSearchInput.value.trim().toLowerCase();
      const filtered = !q
        ? activeOptionsAll
        : activeOptionsAll.filter(o => o.toLowerCase().includes(q));
      renderSheetOptions(filtered);
    });

    sheetDone.addEventListener("click", () => {
      overlay.classList.remove("visible");
      applyFilters();
    });

    overlay.addEventListener("click", e => {
      if (e.target === overlay) {
        overlay.classList.remove("visible");
      }
    });

    function toggleFilterValue(key, value) {
      const arr = state.filters[key] || [];
      const idx = arr.indexOf(value);
      if (idx === -1) arr.push(value);
      else arr.splice(idx, 1);
      state.filters[key] = arr;
    }

    function refreshFilterPills() {
      document.querySelectorAll(".filter-pill").forEach(pill => {
        const key = pill.getAttribute("data-filter");
        const arr = state.filters[key];
        pill.classList.toggle("has-selection", Array.isArray(arr) && arr.length > 0);
      });
    }

    // --------- FEATURES (single-click) ---------
    document.querySelectorAll(".feature-toggle").forEach(el => {
      el.addEventListener("click", () => {
        const feat = el.getAttribute("data-feature");
        state.filters.features[feat] = !state.filters.features[feat];
        applyFilters();
      });
    });

    function refreshFeatureToggles() {
      document.querySelectorAll(".feature-toggle").forEach(el => {
        const feat = el.getAttribute("data-feature");
        const on = !!state.filters.features[feat];
        el.classList.toggle("active", on);
      });
    }

    // Init
    loadData();
  </script>
</body>
</html>
