<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Cigars</title>

  <link rel="stylesheet" href="/css/type.css?v=20" />
  <link rel="stylesheet" href="/pos/pos.css?v=20" />
  <link rel="stylesheet" href="/uxui/topbar/topbar.css?v=20" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css?v=20" />
</head>

<body class="cigars-page">

  <!-- ✅ NEW TOPBAR -->
  <header class="cigars-topbar">
    <div class="ct-left">
      <button class="ct-btn" onclick="window.location.href='/'">🏠</button>
      <button class="ct-btn" onclick="window.location.href='/search/'">🔍</button>
    </div>

    <div class="ct-center">
      <button class="ct-btn" onclick="window.location.href='/pos/favorites/'">⭐</button>
      <button class="ct-btn" onclick="window.location.href='/pos/invoice/'">🧾</button>
    </div>

    <div class="ct-right">
      <button id="theme-toggle" class="ct-toggle" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main class="cigars-main" role="main">

    <div class="cigars-title-row">
      <h1 class="cigars-title">Cigars</h1>

      <button type="button" class="cigars-filter-btn" id="btn-open-filters">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h16M7 12h10M10 18h4"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="cigars-search-wrap">
      <div class="cigars-search-bar">
        <div class="cigars-search-icon">🔍</div>
        <input
          id="cigars-search-input"
          type="search"
          placeholder="Search cigars"
        />
      </div>

      <div id="cigarsAppliedFilters"></div>
    </div>

    <section id="cigarsList"></section>
  </main>

  <!-- ✅ GLASS BOTTOM BAR -->
  <nav class="cigars-bottom-bar">
    <button onclick="window.location.href='/'">Home</button>
    <button onclick="window.location.href='/search/'">Search</button>
    <button onclick="window.location.href='/pos/favorites/'">Favorites</button>
    <button onclick="window.location.href='/pos/invoice/'">Invoice</button>
  </nav>

  <script src="/pos/cart.js?v=20" defer></script>
  <script src="/pos/cigars/cigars.js?v=20" defer></script>

</body>
</html>
