<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cigars</title>
  <link rel="stylesheet" href="/css/system.css" />
  <style>
    .page{background:#eaf1f5;min-height:100dvh}
    .header{display:flex;align-items:center;gap:12px;padding:16px}
    .header a{color:#203147;font-weight:800;text-decoration:none}
    .title{padding:0 16px 6px;font:900 32px/1.05 system-ui;color:#203147}

    .search{margin:8px 16px 10px}
    .search input{
      width:100%;height:46px;border:none;border-radius:24px;padding:0 16px;font:600 16px system-ui;
      background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)
    }

    .grid--brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:12px 16px 24px}
    .tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
    .tile__btn{width:74px;height:74px;border-radius:18px;background:#fff;border:none;box-shadow:0 8px 24px rgba(9,30,66,.08);padding:0}
    .tile__btn img{width:74px;height:74px;border-radius:18px;display:block}
    .tile__label{font:800 14px/1.1 system-ui;color:#142033}
  </style>
</head>
<body class="page">
  <div class="header">
    <a href="/pos/">←</a><span style="font-weight:800;color:#5b738d">POS</span>
  </div>
  <h1 class="title">CIGARS</h1>

  <div class="search"><input id="q" type="search" placeholder="Search brands…"></div>
  <main id="grid" class="grid--brands" aria-live="polite"></main>

  <script>
    // Add more brands as you drop icons in /img/icons/brands/
    const BRANDS = [
      { name:"Arturo Fuente", slug:"arturofuente2", href:"/cigars/brand/arturo-fuente/" },
      { name:"Padron", slug:"padron", href:"/cigars/brand/padron/" },
      { name:"My Father", slug:"myfather", href:"/cigars/brand/my-father/" },
      { name:"Oliva", slug:"oliva", href:"/cigars/brand/oliva/" },
    ];

    const grid = document.getElementById('grid');
    const q = document.getElementById('q');

    function render(list){
      const frag=document.createDocumentFragment();
      list.forEach(b=>{
        const wrap=document.createElement('div'); wrap.className='tile';
        const btn=document.createElement('a'); btn.className='tile__btn'; btn.href=b.href; btn.setAttribute('aria-label',b.name);
        const img=document.createElement('img'); img.alt=b.name; img.src=`/img/icons/brands/${b.slug}.svg`;
        btn.appendChild(img);
        const label=document.createElement('div'); label.className='tile__label'; label.textContent=b.name;
        wrap.append(btn,label); frag.appendChild(wrap);
      });
      grid.innerHTML=''; grid.appendChild(frag);
    }
    render(BRANDS);

    q.addEventListener('input', ()=>{
      const v=q.value.trim().toLowerCase();
      render(BRANDS.filter(b=>b.name.toLowerCase().includes(v)));
    });
  </script>
</body>
</html>
