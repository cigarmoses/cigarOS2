<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/pos/pos.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS • Cigars</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 110px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      gap: 4px;
      align-items: center;
      font-weight: 500;
    }
    .star {
      font-size: 22px;
      color: #ffcc00;
    }
    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin: 16px 0 14px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .search-bar {
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      flex: 1;
    }
    .search-bar input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
    }
    .filter-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      border: none;
      background: #0f1a2c;
      color: #fff;
      font-size: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 12px;
    }
    .brand-card {
      text-align: center;
      cursor: pointer;
    }
    .brand-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: #dfe7ec;
      display: grid;
      place-items: center;
      margin: 0 auto 5px;
      overflow: hidden;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-name {
      font-size: 12px;
      font-weight: 500;
      color: #243448;
      line-height: 1.1;
    }
    #empty {
      text-align: center;
      opacity: .6;
      margin-top: 18px;
    }

    /* filter sheet */
    #filterSheet {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.3);
      display: none;
      z-index: 180;
    }
    .filter-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 16px 16px 26px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .filter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .filter-title { font-size: 20px; font-weight: 700; }
    .filter-close { background:none;border:none;font-size:24px;cursor:pointer;}
    .filter-section { margin-top: 12px; }
    .filter-section h3 {
      font-size: 16px;
      margin: 10px 0 6px;
    }
    .vitola-row, .wrapper-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .vitola-item, .wrapper-item {
      border: 1px solid #e5e9ee;
      border-radius: 16px;
      padding: 6px 10px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .vitola-item.active,
    .wrapper-item.active {
      background: #0f1a2c;
      color: #fff;
      border-color: #0f1a2c;
    }
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .feature-check {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 14px;
    }
    .feature-check input {
      width: 16px;
      height: 16px;
    }

    /* ---------- Invoice popup line-item layout ---------- */

    .invoice-body {
      margin-top: 18px;
    }

    #invoice-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .invoice-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e7f0f7;
      border-radius: 30px;
      padding: 14px 18px;
    }

    .invoice-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .invoice-thumb {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      overflow: hidden;
      background: #c4d4df;
      flex-shrink: 0;
    }

    .invoice-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .invoice-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 13px;
    }

    .invoice-name {
      padding: 0;
      margin: 0;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 700;
      color: #0080ff;
      text-decoration: underline;
      cursor: pointer;
      text-align: left;
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .invoice-meta {
      color: #222222;
      font-size: 13px;
      line-height: 1.2;
    }

    .invoice-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      margin-left: 10px;
      min-width: 90px;
      font-size: 13px;
      font-weight: 500;
    }

    .invoice-qty-label {
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .invoice-qty-control {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15,26,44,0.05);
    }

    .invoice-qty-btn {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.2);
      background: #ffffff;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .invoice-qty-value {
      min-width: 14px;
      text-align: center;
      font-weight: 600;
    }

    .invoice-line-total {
      font-weight: 600;
      font-size: 14px;
    }

    .invoice-totals {
      margin-top: 24px;
      text-align: right;
    }

    .invoice-totals .total-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 4px;
      font-size: 16px;
    }

    .invoice-totals .total-bold {
      font-size: 20px;
      font-weight: 700;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="/pos/" class="back">← POS</a>
      <div class="star">★</div>
    </div>

    <h1 class="title">CIGARS</h1>

    <div class="search-row">
      <div class="search-bar">
        <input id="searchInput" placeholder="Search…" />
      </div>
      <button class="filter-btn" onclick="openFilter()">⌕</button>
    </div>

    <div id="brandGrid" class="brand-grid"></div>
    <p id="empty" style="display:none;">No brands matched.</p>
  </div>

  <!-- filter sheet -->
  <div id="filterSheet">
    <div class="filter-panel">
      <div class="filter-head">
        <div class="filter-title">Filters</div>
        <button class="filter-close" onclick="closeFilter()">×</button>
      </div>

      <div class="filter-section">
        <h3>Vitola</h3>
        <div id="vitolaList" class="vitola-row"></div>
      </div>

      <div class="filter-section">
        <h3>Wrapper Shade</h3>
        <div id="wrapperList" class="wrapper-row"></div>
      </div>

      <div class="filter-section">
        <h3>Features</h3>
        <div class="features-list">
          <label class="feature-check"><input type="checkbox" data-feature="Box Pressed"> Box Pressed</label>
          <label class="feature-check"><input type="checkbox" data-feature="Flavored/Sweet"> Flavored/Sweet</label>
          <label class="feature-check"><input type="checkbox" data-feature="Pack"> Packs</label>
          <label class="feature-check"><input type="checkbox" data-feature="Tin"> Tins</label>
          <label class="feature-check"><input type="checkbox" data-feature="Barberpole"> Barberpole</label>
        </div>
      </div>
    </div>
  </div>

  <!-- main cigars JS -->
  <script>
    // CSV location
    const CSV_URL = "/hub/hub_11-5-25.csv";

    const brandGrid = document.getElementById("brandGrid");
    const emptyMsg = document.getElementById("empty");
    const searchInput = document.getElementById("searchInput");

    let allRows = [];
    let allBrands = [];
    let activeFilters = {
      vitola: null,
      wrapper: null,
      features: []
    };

    fetch(CSV_URL)
      .then(r => r.text())
      .then(text => {
        allRows = parseCSV(text);
        buildFilterLists(allRows);
        buildBrandList(allRows);
      })
      .catch(err => {
        console.error(err);
        emptyMsg.style.display = "block";
        emptyMsg.textContent = "Could not load " + CSV_URL;
      });

    // basic CSV -> objects
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const header = lines.shift().split(",");
      return lines.map(line => {
        const cells = line.split(",");
        const obj = {};
        header.forEach((h,i) => obj[h.trim()] = (cells[i] || "").trim());
        return obj;
      });
    }

    function normalizeBrandToSvg(name) {
      return name.toLowerCase().replace(/[^a-z0-9]/g,"");
    }

    function buildBrandList(rows) {
      const map = new Map();
      rows.forEach(r => {
        const b = (r["Brand"] || r["brand"] || "").trim();
        if (!b) return;
        if (!map.has(b)) map.set(b, []);
        map.get(b).push(r);
      });
      allBrands = Array.from(map.entries()).map(([name,rows]) => ({ name, rows }));
      renderBrands(allBrands);
    }

    function renderBrands(list) {
      brandGrid.innerHTML = "";
      if (!list.length) {
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      list.forEach(b => {
        const iconName = normalizeBrandToSvg(b.name);
        const div = document.createElement("div");
        div.className = "brand-card";
        div.innerHTML = `
          <div class="brand-icon">
            <img src="/img/icons/brands/${iconName}.svg" alt="${b.name}" onerror="this.src='/img/placeholder.svg'">
          </div>
          <div class="brand-name">${b.name}</div>
        `;
        div.addEventListener("click", () => {
          window.location.href = "/pos/cigars/brand.html?brand=" + encodeURIComponent(b.name);
        });
        brandGrid.appendChild(div);
      });
    }

    // search & filters work together
    searchInput.addEventListener("input", applyFilters);

    function applyFilters() {
      const term = searchInput.value.toLowerCase();
      const filtered = allBrands.filter(b => {
        // text match
        const matchesText = b.name.toLowerCase().includes(term);

        // filter match: brand must have at least 1 cigar that matches
        const matchesCigar = b.rows.some(row => {
          // vitola
          if (activeFilters.vitola && (row["Vitola"] || "").toLowerCase() !== activeFilters.vitola.toLowerCase()) return false;
          // wrapper
          if (activeFilters.wrapper && (row["Wrapper Shade"] || row["WRAPPER SHADE"] || "").toLowerCase() !== activeFilters.wrapper.toLowerCase()) return false;
          // features
          for (const ft of activeFilters.features) {
            const colVal =
              row[ft] || row[ft.toUpperCase()] || row[ft.replace("/", " or ").toUpperCase()] || "";
            if (!colVal || colVal === "0" || colVal.toLowerCase() === "false") {
              return false;
            }
          }
          return true;
        });

        return matchesText && matchesCigar;
      });

      renderBrands(filtered);
    }

    // build lists for filters
    function buildFilterLists(rows) {
      const vitolas = new Set();
      const wrappers = new Set();

      rows.forEach(r => {
        const v = r["Vitola"] || r["VITOLA"] || "";
        if (v) vitolas.add(v.trim());
        const w = r["Wrapper Shade"] || r["WRAPPER SHADE"] || "";
        if (w) wrappers.add(w.trim());
      });

      const vList = document.getElementById("vitolaList");
      Array.from(vitolas).sort().forEach(v => {
        const btn = document.createElement("div");
        btn.className = "vitola-item";
        btn.textContent = v;
        btn.onclick = () => {
          if (activeFilters.vitola === v) {
            activeFilters.vitola = null;
            btn.classList.remove("active");
          } else {
            activeFilters.vitola = v;
            [...vList.children].forEach(c => c.classList.remove("active"));
            btn.classList.add("active");
          }
          applyFilters();
        };
        vList.appendChild(btn);
      });

      const wList = document.getElementById("wrapperList");
      Array.from(wrappers).sort().forEach(w => {
        const btn = document.createElement("div");
        btn.className = "wrapper-item";
        btn.textContent = w;
        btn.onclick = () => {
          if (activeFilters.wrapper === w) {
            activeFilters.wrapper = null;
            btn.classList.remove("active");
          } else {
            activeFilters.wrapper = w;
            [...wList.children].forEach(c => c.classList.remove("active"));
            btn.classList.add("active");
          }
          applyFilters();
        };
        wList.appendChild(btn);
      });

      // features
      document.querySelectorAll(".feature-check input").forEach(cb => {
        cb.addEventListener("change", () => {
          const feat = cb.dataset.feature;
          if (cb.checked) {
            if (!activeFilters.features.includes(feat)) activeFilters.features.push(feat);
          } else {
            activeFilters.features = activeFilters.features.filter(f => f !== feat);
          }
          applyFilters();
        });
      });
    }

    function openFilter(){ document.getElementById("filterSheet").style.display="block"; }
    function closeFilter(){ document.getElementById("filterSheet").style.display="none"; }

    /* ---------- Demo invoice content & qty adjusters ---------- */

    const POS_TAX_RATE = 0.07;

    const demoCartItems = [
      {
        id: "flying-pig",
        name: "Flying Pig",
        vitola: "Perfecto",
        brand: "Pappy Van Winkle",
        price: 13.99,
        qty: 1,
        icon: "/img/icons/categories/cigars.svg"
      },
      {
        id: "padron-3000-maduro",
        name: "Padron 3000 Maduro",
        vitola: "Robusto",
        brand: "Padron",
        price: 10.25,
        qty: 2,
        icon: "/img/icons/categories/cigars.svg"
      },
      {
        id: "sprite-can",
        name: "Sprite",
        vitola: "Food and Beverages",
        brand: "",
        price: 1.50,
        qty: 3,
        icon: "/img/icons/foodandbevs/sprite.svg"
      }
    ];

    function formatMoney(value) {
      return value.toFixed(2);
    }

    function renderInvoice() {
      const container = document.getElementById("invoice-items");
      if (!container) return;

      container.innerHTML = "";
      let subtotal = 0;

      demoCartItems.forEach((item, index) => {
        const lineTotal = item.price * item.qty;
        subtotal += lineTotal;

        const row = document.createElement("div");
        row.className = "invoice-item";
        row.dataset.index = String(index);
        row.innerHTML = `
          <div class="invoice-left">
            <div class="invoice-thumb">
              <img src="${item.icon}" alt="${item.brand || item.name}">
            </div>
            <div class="invoice-text">
              <button type="button" class="invoice-name">${item.name}</button>
              <div class="invoice-meta">${item.vitola}</div>
              <div class="invoice-meta">${item.brand}</div>
              <div class="invoice-meta">${formatMoney(item.price)}</div>
            </div>
          </div>
          <div class="invoice-right">
            <div class="invoice-qty-label">QTY</div>
            <div class="invoice-qty-control">
              <button class="invoice-qty-btn" data-dir="-1">−</button>
              <span class="invoice-qty-value">${item.qty}</span>
              <button class="invoice-qty-btn" data-dir="1">+</button>
            </div>
            <div class="invoice-line-total">$${formatMoney(lineTotal)}</div>
          </div>
        `;
        container.appendChild(row);
      });

      const subtotalEl = document.getElementById("invoice-subtotal");
      const taxEl = document.getElementById("invoice-tax");
      const totalEl = document.getElementById("invoice-total");

      const tax = subtotal * POS_TAX_RATE;
      const total = subtotal + tax;

      if (subtotalEl) subtotalEl.textContent = `$${formatMoney(subtotal)}`;
      if (taxEl) taxEl.textContent = `$${formatMoney(tax)}`;
      if (totalEl) totalEl.textContent = `$${formatMoney(total)}`;

      // bind qty buttons
      container.querySelectorAll(".invoice-qty-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const row = btn.closest(".invoice-item");
          if (!row) return;
          const index = Number(row.dataset.index || "0");
          const dir = Number(btn.getAttribute("data-dir") || "0");
          const item = demoCartItems[index];
          if (!item) return;
          const newQty = item.qty + dir;
          if (newQty < 0) return;
          item.qty = newQty;
          renderInvoice();
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const dateEl = document.getElementById("invoice-date");
      if (dateEl) {
        const d = new Date();
        const weekday = d.toLocaleDateString(undefined, { weekday: "long" });
        const dateStr = d.toLocaleDateString(undefined, { month: "2-digit", day: "2-digit", year: "2-digit" });
        const timeStr = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        dateEl.textContent = `${weekday}, ${dateStr} — ${timeStr}`;
      }
      renderInvoice();
    });
  </script>

  <!-- Red receipt pill -->
 <div class="receipt-pill" id="open-receipt">
  <img src="/uxui/receipt-icon.svg" class="receipt-pill-icon" alt="Receipt" />
  <span class="receipt-pill-count" id="receipt-count">0</span>
</div>
  <!-- Invoice Popup -->
  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">

      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>

      <div class="invoice-body">

        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>

        <!-- CART ITEMS -->
        <div id="invoice-items"></div>

      </div>

      <div class="invoice-totals">
        <div class="total-row"><span>Subtotal</span><span id="invoice-subtotal">$0.00</span></div>
        <div class="total-row"><span>Tax</span><span id="invoice-tax">$0.00</span></div>
        <div class="total-row total-bold"><span>TOTAL</span><span id="invoice-total">$0.00</span></div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
