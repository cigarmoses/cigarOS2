<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cigars</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css" />
</head>

<body class="cigars-page">
  <header class="cigars-topbar">
    <button type="button" class="pos-back" id="cigars-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main class="cigars-main">
    <section class="cigars-header">
      <!-- Title row + Top-right actions -->
      <div class="cigars-title-row">
        <h1 class="cigars-title">Cigars</h1>

        <!-- Right-side actions: Filters + Favorites -->
        <div class="cigars-title-actions" style="display:flex;align-items:flex-end;gap:10px;margin-bottom:10px;">
          <!-- Filters icon (purple spot) -->
          <button
            type="button"
            id="btn-open-filters"
            class="cigars-filter-btn"
            aria-label="Filters"
            title="Filters"
            style="
              flex:0 0 auto;
              display:grid;
              place-items:center;
              width:46px;height:46px;
              border-radius:14px;
              background:transparent;
              border:none;
              color:#0f1a2c;
              -webkit-tap-highlight-color:transparent;
              cursor:pointer;
            "
          >
            <!-- iOS-style filter icon -->
            <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 6h16M7 12h13M10 18h10"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <!-- ⭐ Favorites -->
          <a
            class="cigars-fav-btn"
            href="/pos/cigars/favorites.html"
            aria-label="Favorites"
            title="Favorites"
          >★</a>
        </div>
      </div>

      <div class="cigars-search-wrap">
        <div class="cigars-search-bar">
          <span class="cigars-search-icon" aria-hidden="true">🔍</span>
          <input
            id="cigars-search-input"
            type="search"
            placeholder="Search for brand, cigar, vitola, etc..."
            autocomplete="off"
          />
        </div>
      </div>
    </section>

    <!-- ✅ REMOVED: old Filters card section (under the red X) -->

    <section class="cigars-brands-section">
      <h2 class="cigars-brands-title">Brands</h2>
      <div id="category-grid" class="brands-grid"></div>
    </section>
  </main>

  <script defer src="/pos/pos.js"></script>
  <script defer src="/pos/img/scripts/build-cigars.js"></script>
  <script defer src="/pos/cigars/cigars.js"></script>

  <!-- ✅ Bottom-sheet filter system root (JS injects full sheet markup) -->
  <div id="filter-modal" class="fm fm--hidden" aria-hidden="true"></div>
</body>
</html>
