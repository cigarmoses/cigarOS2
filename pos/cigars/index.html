<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars • POS</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 90px;
    }
    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .pos-star { font-size: 22px; color: #ffcc00; }

    .pos-header-spacer { height: 16px; }
    .pos-title {
      text-align: center;
      font-weight: 700;
      font-size: 32px;
      margin: 0 0 14px;
    }

    /* search + filter */
    .search-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      align-items: center;
    }
    .filter-pill {
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      cursor: pointer;
      justify-content: center;
    }
    .filter-pill svg { width: 15px; height: 15px; }

    .pos-search {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      gap: 6px;
      border: 1px solid rgba(0,0,0,.02);
    }
    .pos-search input {
      border: 0;
      outline: 0;
      width: 100%;
      background: transparent;
      font-size: 14px;
    }

    /* brand grid */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 14px;
      margin-top: 20px;
    }
    .brand-tile {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      overflow: hidden;
      background: #d7dfe4;
      display: grid;
      place-items: center;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-label { font-size: 13px; font-weight: 500; }
    .brand-disabled { opacity: .6; pointer-events: none; }

    /* bill tab */
    .pos-bill-tab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1a2c;
      color: #fff;
      border-radius: 50px;
      padding: 10px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 50;
    }
    .pos-bill-icon { font-size: 16px; }
    .pos-bill-badge {
      background: #e11;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .pos-bill-total { font-weight: 600; }

    /* FILTER PANEL */
    .filter-overlay { position: fixed; inset: 0; display: none; z-index: 9999; }
    .filter-overlay.show { display: block; }
    .filter-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
    .filter-panel {
      position: absolute;
      top: 0; right: 0;
      width: min(420px, 100%);
      height: 100%;
      background: #fff;
      border-top-left-radius: 26px;
      border-bottom-left-radius: 26px;
      box-shadow: -4px 0 10px rgba(0,0,0,0.08);
      overflow-y: auto;
      padding: 16px 16px 40px;
    }
    .filter-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    .filter-title { font-weight: 700; font-size: 18px; }
    .filter-close { font-size: 26px; line-height: 1; cursor: pointer; }
    .section { margin-bottom: 16px; }
    .section-title {
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .chev {
      border: solid #000;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 3px;
      transform: rotate(45deg);
      margin-left: 6px;
    }

    /* vitola icons grid (NO BACKGROUND, LARGER) */
    .vitola-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 10px;
    }
    .vitola-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .vitola-icon {
      width: 100%;
      height: 58px;
      display: grid;
      place-items: center;
    }
    .vitola-icon img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      filter: none;
    }
    .vitola-label {
      font-size: 12px;
      text-align: center;
      font-weight: 500;
    }
    .is-selected .vitola-icon img {
      transform: scale(1.1);
    }

    /* wrapper shades */
    .shade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .shade-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .shade-icon {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      overflow: hidden;
      background: none;
    }
    .shade-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .shade-label { font-size: 11px; text-align: center; }

    /* features */
    .feature-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .feature-row { display: flex; align-items: center; gap: 8px; }
    .feature-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: #0f1a2c; }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">CIGARS</h1>

    <div class="search-row">
      <div class="filter-pill" onclick="openFilter()">
        <svg viewBox="0 0 20 20"><path fill="white" d="M2 3h16l-5.5 6.2V14L7.5 17V9.2L2 3z"/></svg>
        <span>filter</span>
      </div>
      <div class="pos-search">
        <input id="searchInput" placeholder="Search brands..." />
      </div>
    </div>

    <div id="brandGrid" class="brand-grid"></div>
  </div>

  <!-- bill tab -->
  <div class="pos-bill-tab" onclick="openBill()">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <!-- FILTER PANEL -->
  <div id="filterOverlay" class="filter-overlay">
    <div class="filter-backdrop" onclick="closeFilter()"></div>
    <div class="filter-panel">
      <div class="filter-header">
        <div class="filter-title">Filters</div>
        <div class="filter-close" onclick="closeFilter()">×</div>
      </div>

      <div class="section" id="secVitola">
        <div class="section-title" onclick="toggleSection('vitolaBody')">
          <span>Vitola</span><span class="chev"></span>
        </div>
        <div id="vitolaBody" class="vitola-grid"></div>
      </div>

      <hr style="border:none;border-top:1px solid rgba(0,0,0,.05);margin:10px 0 14px;">

      <div class="section" id="secShade">
        <div class="section-title" onclick="toggleSection('shadeBody')">
          <span>Wrapper Shade</span><span class="chev"></span>
        </div>
        <div id="shadeBody" class="shade-grid"></div>
      </div>

      <hr style="border:none;border-top:1px solid rgba(0,0,0,.05);margin:10px 0 14px;">

      <div class="section" id="secFeatures">
        <div class="section-title" onclick="toggleSection('featuresBody')">
          <span>Features</span><span class="chev"></span>
        </div>
        <div id="featuresBody" class="feature-list">
          <label class="feature-row"><input type="checkbox"> Box Pressed</label>
          <label class="feature-row"><input type="checkbox"> Flavored/Sweet</label>
          <label class="feature-row"><input type="checkbox"> Packs</label>
          <label class="feature-row"><input type="checkbox"> Tins</label>
          <label class="feature-row"><input type="checkbox"> Barberpole</label>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VITOLAS = ["robusto","toro","churchill","gordo","perfecto","torpedo"];
    const SHADES = ["connecticut","colorado","coloradomaduro","maduro","oscuro"];
    const ALL_BRANDS = ["Aladino","1502","Acid","Aging Room","Alec Bradley","Angel Cuesta","Arturo Fuente","Ashton","Asylum 13","Atabey","AVO","Baccarat"];

    const vitolaBody = document.getElementById('vitolaBody');
    const shadeBody = document.getElementById('shadeBody');
    const brandGrid = document.getElementById('brandGrid');
    const searchInput = document.getElementById('searchInput');
    const filterOverlay = document.getElementById('filterOverlay');

    function renderBrands(term=""){
      brandGrid.innerHTML="";
      ALL_BRANDS.filter(n=>n.toLowerCase().includes(term.toLowerCase())).forEach(n=>{
        const t=document.createElement('a');
        t.className="brand-tile"+(n.toLowerCase()==="aladino"?"":" brand-disabled");
        t.href=n.toLowerCase()==="aladino"?"/pos/cigars/aladino/":"javascript:void(0)";
        t.innerHTML=`<div class="brand-icon"><img src="/img/icons/brands/${n.toLowerCase().replace(/\s+/g,'')}.svg"></div><div class="brand-label">${n}</div>`;
        brandGrid.appendChild(t);
      });
    }
    renderBrands();
    searchInput.addEventListener('input',e=>renderBrands(e.target.value));

    VITOLAS.forEach(v=>{
      const d=document.createElement('div');
      d.className="vitola-item";
      d.innerHTML=`<div class="vitola-icon"><img src="/img/icons/vitolas/${v}.svg"></div><div class="vitola-label">${v.charAt(0).toUpperCase()+v.slice(1)}</div>`;
      vitolaBody.appendChild(d);
    });
    SHADES.forEach(s=>{
      const d=document.createElement('div');
      d.className="shade-item";
      d.innerHTML=`<div class="shade-icon"><img src="/img/icons/wrappershades/${s}.svg"></div><div class="shade-label">${s.charAt(0).toUpperCase()+s.slice(1)}</div>`;
      shadeBody.appendChild(d);
    });

    function openFilter(){filterOverlay.classList.add('show')}
    function closeFilter(){filterOverlay.classList.remove('show')}
    function toggleSection(id){const el=document.getElementById(id);el.style.display=el.style.display==="none"?"grid":"none";}
  </script>
</body>
</html>
