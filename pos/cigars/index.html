<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/css/type.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS</title>

  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f1a2c;
      --muted: #6a7586;
      --pill: #f2f4f7;
      --pill-active: #3b99ff;
      --pill-active-text: #ffffff;
      --outline: #d5dde7;
      --feature-active: #007aff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      padding: 24px 18px 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Heading */
    .page-title {
      font-family: var(--font-display, "SF Pro Display", -apple-system, system-ui, sans-serif);
      font-size: 40px;
      line-height: 1.0;
      font-weight: 800;
      margin: 0 0 18px;
    }

    /* Master search bar */
    .master-search-wrap {
      margin-bottom: 16px;
    }

    .master-search {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--outline);
      background: #f9fafb;
    }

    .master-search-icon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .master-search-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      width: 100%;
    }

    .master-search-input::placeholder {
      color: #a0acbd;
    }

    /* Filter rows */
    .filters {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;           /* ✅ wrap so no horizontal scroll */
      gap: 8px;
    }

    .filter-pill {
      flex: 1 1 calc(50% - 8px); /* ✅ 2 per row on mobile */
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--pill);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .filter-pill.primary {
      border-radius: 14px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .filter-pill.has-selection {
      background: var(--pill-active);
      color: var(--pill-active-text);
    }

    @media (min-width: 768px) {
      .filter-pill {
        flex: 1 1 calc(33.333% - 8px);   /* 3 per row on larger screens */
      }
    }

    /* Features row */
    .features-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eef1f6;
      margin-bottom: 12px;
    }

    .feature-toggle {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      gap: 4px;
    }

    .feature-label {
      color: var(--ink);
      font-weight: 500;
    }

    .feature-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid #c5ceda;
      background: transparent;
    }

    .feature-toggle.active .feature-label {
      color: var(--feature-active);
      font-weight: 600;
    }

    .feature-toggle.active .feature-dot {
      background: var(--feature-active);
      border-color: var(--feature-active);
    }

    /* BRAND GRID (icons) */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .brand-tile {
      background: #f7f9fc;
      border-radius: 16px;
      padding: 10px 6px 9px;
      border: 1px solid #e0e6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon-wrap {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    .brand-count {
      font-size: 11px;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      .brand-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (min-width: 900px) {
      .brand-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .page {
        padding-top: 32px;
      }
      .page-title {
        font-size: 44px;
      }
    }

    /* Popup overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      justify-content: flex-end;
      z-index: 2000;
    }

    .overlay.visible {
      display: flex;
    }

    .filter-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      max-height: 70vh;
      border-radius: 18px 18px 0 0;
      margin: 0 auto;
      padding: 12px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #d0d6e0;
      margin: 4px auto 4px;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }

    .sheet-search {
      border-radius: 999px;
      border: 1px solid #dde3ef;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sheet-search input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
    }

    .sheet-search input::placeholder {
      color: #a0acbd;
    }

    .sheet-options {
      flex: 1;
      overflow-y: auto;
      margin-top: 6px;
      padding-right: 2px;
    }

    .sheet-option {
      padding: 9px 2px;
      font-size: 15px;
      border-bottom: 1px solid #f0f2f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .sheet-option-label {
      flex: 1;
    }

    .sheet-option-check {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid #c5ceda;
      background: #ffffff;
    }

    .sheet-option.selected .sheet-option-check {
      background: var(--feature-active);
      border-color: var(--feature-active);
    }

    .sheet-footer {
      margin-top: 10px;
    }

    .sheet-done {
      width: 100%;
      padding: 11px 0;
      border-radius: 11px;
      background: var(--feature-active);
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">Cigars</h1>

    <!-- Master search -->
    <div class="master-search-wrap">
      <div class="master-search">
        <svg class="master-search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" stroke="#9aa5b6" stroke-width="1.5" fill="none"></circle>
          <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="#9aa5b6" stroke-width="1.5" stroke-linecap="round"></line>
        </svg>
        <input
          id="masterSearch"
          class="master-search-input"
          type="search"
          placeholder="Search cigars, brands, anything…" />
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <!-- Line 1 -->
      <div class="filter-row">
        <div class="filter-pill primary" data-filter="manufacturer">Manufacturer</div>
        <div class="filter-pill primary" data-filter="brand">Brand</div>
      </div>

      <!-- Line 2 -->
      <div class="filter-row">
        <div class="filter-pill" data-filter="priceRange">Price range</div>
        <div class="filter-pill" data-filter="vitola">Vitola</div>
        <div class="filter-pill" data-filter="rg">RG</div>
        <div class="filter-pill" data-filter="length">Length</div>
        <div class="filter-pill" data-filter="wrapperShade">Wrapper Shade</div>
      </div>

      <!-- Line 3 -->
      <div class="filter-row">
        <div class="filter-pill" data-filter="wrapper">Wrapper</div>
        <div class="filter-pill" data-filter="binder">Binder</div>
        <div class="filter-pill" data-filter="filler">Filler</div>
        <div class="filter-pill" data-filter="origin">Origin</div>
        <div class="filter-pill" data-filter="strength">Strength</div>
        <div class="filter-pill" data-filter="shape">Shape</div>
      </div>
    </div>

    <!-- Line 4: Features (single click, no popup) -->
    <div class="features-row">
      <div class="feature-toggle" data-feature="boxPressed">
        <span class="feature-label">Box-Pressed</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="tubo">
        <span class="feature-label">Tubo</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="flavored">
        <span class="feature-label">Flavored</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="tin">
        <span class="feature-label">Tin</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="pack">
        <span class="feature-label">Pack</span>
        <div class="feature-dot"></div>
      </div>
      <div class="feature-toggle" data-feature="barberpole">
        <span class="feature-label">Barberpole</span>
        <div class="feature-dot"></div>
      </div>
    </div>

    <!-- BRAND ICON GRID -->
    <div id="brandGrid" class="brand-grid"></div>
  </div>

  <!-- Filter popup sheet -->
  <div id="filterOverlay" class="overlay">
    <div class="filter-sheet">
      <div class="sheet-handle"></div>
      <div id="sheetTitle" class="sheet-title">Filter</div>
      <div class="sheet-search">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" stroke="#9aa5b6" stroke-width="1.5" fill="none"></circle>
          <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="#9aa5b6" stroke-width="1.5" stroke-linecap="round"></line>
        </svg>
        <input id="sheetSearchInput" type="search" placeholder="Search in filter…" />
      </div>
      <div id="sheetOptions" class="sheet-options"></div>
      <div class="sheet-footer">
        <button id="sheetDone" class="sheet-done">Done</button>
      </div>
    </div>
  </div>

  <script>
    // ====== DATA SOURCE: CSV HUB ======
    const DATA_URL = "/hub/hub_11-5-25.csv";

    let allCigars = [];
    let currentFiltered = [];

    const state = {
      searchText: "",
      filters: {
        manufacturer: [],
        brand: [],
        priceRange: [],
        vitola: [],
        rg: [],
        length: [],
        wrapperShade: [],
        wrapper: [],
        binder: [],
        filler: [],
        origin: [],
        strength: [],
        shape: [],
        features: {
          boxPressed: false,
          tubo: false,
          flavored: false,
          tin: false,
          pack: false,
          barberpole: false
        }
      }
    };

    const filterConfig = {
      manufacturer: { label: "Manufacturer", field: "manufacturer" },
      brand:       { label: "Brand",        field: "brand" },
      priceRange:  { label: "Price range",  field: "msrp" }, // handled separately
      vitola:      { label: "Vitola",       field: "vitola" },
      rg:          { label: "RG",           field: "ring" },
      length:      { label: "Length",       field: "length" },
      wrapperShade:{ label: "Wrapper Shade",field: "wrapper_shade" },
      wrapper:     { label: "Wrapper",      field: "wrapper" },
      binder:      { label: "Binder",       field: "binder" },
      filler:      { label: "Filler",       field: "filler" },
      origin:      { label: "Origin",       field: "origin" },
      strength:    { label: "Strength",     field: "strength" },
      shape:       { label: "Shape",        field: "shape" }
    };

    const PRICE_RANGES = [
      { label: "$0 – $9.99",  min: 0,  max: 9.99 },
      { label: "$10 – $14.99",min:10,  max:14.99 },
      { label: "$15 – $19.99",min:15,  max:19.99 },
      { label: "$20 – $29.99",min:20,  max:29.99 },
      { label: "$30+",        min:30,  max:9999 }
    ];

    // ------ CSV PARSER (simple, assumes no quoted commas) ------
    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/);
      if (!rows.length) return { headers: [], data: [] };
      const headers = rows[0].split(",").map(h => h.trim());
      const data = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i].split(",");
        if (row.length === 1 && row[0].trim() === "") continue;
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (row[idx] || "").trim();
        });
        data.push(obj);
      }
      return { headers, data };
    }

    // Build a map of canonical fields -> header index
    function buildColumnMap(headers) {
      const norms = headers.map(h => h.toLowerCase().replace(/[^a-z0-9]/g,""));

      function findIndex(candidates) {
        for (let i = 0; i < norms.length; i++) {
          for (const c of candidates) {
            if (norms[i].includes(c)) return i;
          }
        }
        return -1;
      }

      return {
        brand:        findIndex(["brand"]),
        manufacturer: findIndex(["manufacturer","factory"]),
        cigar:        findIndex(["cigar","cigarname"]),
        line:         findIndex(["line"]),
        vitola:       findIndex(["vitola","size"]),
        ring:         findIndex(["ring","rg","ringgauge"]),
        length:       findIndex(["length","len"]),
        wrapper:      findIndex(["wrapper"]),
        wrapper_shade:findIndex(["wrappershade","shade"]),
        binder:       findIndex(["binder"]),
        filler:       findIndex(["filler"]),
        origin:       findIndex(["origin","country"]),
        strength:     findIndex(["strength","body"]),
        shape:        findIndex(["shape"]),
        msrp:         findIndex(["msrp","price","retail"]),
        box_pressed:  findIndex(["boxpressed","boxpress"]),
        tubo:         findIndex(["tubo"]),
        flavored:     findIndex(["flavored","infused"]),
        tin:          findIndex(["tin"]),
        pack:         findIndex(["pack"]),
        barberpole:   findIndex(["barberpole"])
      };
    }

    function makeCigar(row, headers, map) {
      function pick(key) {
        const idx = map[key];
        if (idx == null || idx < 0) return "";
        const h = headers[idx];
        return row[h] || "";
      }
      return {
        brand:        pick("brand"),
        manufacturer: pick("manufacturer"),
        cigar:        pick("cigar"),
        line:         pick("line"),
        vitola:       pick("vitola"),
        ring:         pick("ring"),
        length:       pick("length"),
        wrapper:      pick("wrapper"),
        wrapper_shade:pick("wrapper_shade"),
        binder:       pick("binder"),
        filler:       pick("filler"),
        origin:       pick("origin"),
        strength:     pick("strength"),
        shape:        pick("shape"),
        msrp:         pick("msrp"),
        box_pressed:  pick("box_pressed"),
        tubo:         pick("tubo"),
        flavored:     pick("flavored"),
        tin:          pick("tin"),
        pack:         pick("pack"),
        barberpole:   pick("barberpole")
      };
    }

    // --------- LOAD DATA FROM CSV ---------
    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        const text = await res.text();
        const { headers, data } = parseCSV(text);
        const map = buildColumnMap(headers);
        allCigars = data.map(row => makeCigar(row, headers, map));
      } catch (e) {
        console.error("Error loading cigars data", e);
        allCigars = [];
      }
      applyFilters();   // with no filters = all brands
    }

    // Brand slug for icon filenames
    function brandSlug(brand) {
      return String(brand || "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]/g, "");
    }

    // --------- RENDER BRAND GRID ---------
    function renderBrandGrid(list) {
      const container = document.getElementById("brandGrid");

      if (!list.length) {
        container.innerHTML =
          '<div style="font-size:13px;color:#8994a5;">No brands match your filters yet.</div>';
        return;
      }

      const counts = {};
      list.forEach(c => {
        const b = c.brand || "Unknown";
        counts[b] = (counts[b] || 0) + 1;
      });

      const brands = Object.keys(counts).sort((a,b)=>a.localeCompare(b));

      container.innerHTML = brands.map(brand => {
        const slug = brandSlug(brand);
        const count = counts[brand];
        const brandParam = encodeURIComponent(brand);
        return `
          <a class="brand-tile" href="/pos/cigars/brand.html?brand=${brandParam}">
            <div class="brand-icon-wrap">
              <img class="brand-icon" src="/img/icons/brands/${slug}.svg" alt="${brand}">
            </div>
            <div class="brand-name">${brand}</div>
            <div class="brand-count">${count} cigar${count === 1 ? "" : "s"}</div>
          </a>
        `;
      }).join("");
    }

    // --------- APPLY FILTERS (on canonical cigar objects) ---------
    function truthy(v) {
      if (v === true) return true;
      if (typeof v === "number") return v !== 0;
      if (!v) return false;
      const s = String(v).toLowerCase();
      return ["y","yes","true","1"].includes(s);
    }

    function applyFilters() {
      const text = state.searchText.trim().toLowerCase();

      let list = allCigars.filter(c => {
        // master search
        if (text) {
          const haystack = [
            c.cigar, c.line, c.brand, c.manufacturer,
            c.vitola, c.wrapper, c.wrapper_shade, c.binder, c.filler,
            c.origin, c.strength, c.shape
          ].filter(Boolean).join(" ").toLowerCase();

          if (!haystack.includes(text)) return false;
        }

        // multi-select filters
        for (const key of Object.keys(filterConfig)) {
          const selected = state.filters[key];
          if (!selected || !selected.length) continue;

          if (key === "priceRange") {
            const price = parseFloat(c.msrp || "0") || 0;
            const ok = selected.some(label => {
              const range = PRICE_RANGES.find(r => r.label === label);
              return range && price >= range.min && price <= range.max;
            });
            if (!ok) return false;
          } else {
            const fieldName = filterConfig[key].field;
            const val = (c[fieldName] != null ? String(c[fieldName]) : "").trim();
            if (!selected.includes(val)) return false;
          }
        }

        // features
        const ft = state.filters.features;
        if (ft.boxPressed && !truthy(c.box_pressed)) return false;
        if (ft.tubo       && !truthy(c.tubo)) return false;
        if (ft.flavored   && !truthy(c.flavored)) return false;
        if (ft.tin        && !truthy(c.tin)) return false;
        if (ft.pack       && !truthy(c.pack)) return false;
        if (ft.barberpole && !truthy(c.barberpole)) return false;

        return true;
      });

      currentFiltered = list;
      renderBrandGrid(list);
      refreshFilterPills();
      refreshFeatureToggles();
    }

    // --------- MASTER SEARCH ---------
    document.getElementById("masterSearch").addEventListener("input", e => {
      state.searchText = e.target.value;
      applyFilters();
    });

    // --------- FILTER POPUP SHEET ---------
    const overlay = document.getElementById("filterOverlay");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetSearchInput = document.getElementById("sheetSearchInput");
    const sheetOptions = document.getElementById("sheetOptions");
    const sheetDone = document.getElementById("sheetDone");

    let activeFilterKey = null;
    let activeOptionsAll = [];

    document.querySelectorAll(".filter-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const key = pill.getAttribute("data-filter");
        openFilterSheet(key);
      });
    });

    function openFilterSheet(key) {
      activeFilterKey = key;
      const cfg = filterConfig[key];
      if (!cfg) return;

      sheetTitle.textContent = cfg.label;
      sheetSearchInput.value = "";

      if (key === "priceRange") {
        activeOptionsAll = PRICE_RANGES.map(r => r.label);
      } else {
        const fieldName = cfg.field;
        const set = new Set();
        allCigars.forEach(c => {
          const val = c[fieldName];
          if (val != null && String(val).trim() !== "") {
            set.add(String(val).trim());
          }
        });
        activeOptionsAll = Array.from(set).sort((a,b)=>a.localeCompare(b));
      }

      renderSheetOptions(activeOptionsAll);
      overlay.classList.add("visible");
      sheetSearchInput.focus();
    }

    function renderSheetOptions(list) {
      const selected = state.filters[activeFilterKey] || [];
      sheetOptions.innerHTML = list.map(opt => {
        const isSel = selected.includes(opt);
        return `
          <div class="sheet-option ${isSel ? "selected" : ""}" data-value="${opt}">
            <div class="sheet-option-label">${opt}</div>
            <div class="sheet-option-check"></div>
          </div>
        `;
      }).join("");

      sheetOptions.querySelectorAll(".sheet-option").forEach(el => {
        el.addEventListener("click", () => {
          const val = el.getAttribute("data-value");
          toggleFilterValue(activeFilterKey, val);
          el.classList.toggle("selected");
        });
      });
    }

    sheetSearchInput.addEventListener("input", () => {
      const q = sheetSearchInput.value.trim().toLowerCase();
      const filtered = !q
        ? activeOptionsAll
        : activeOptionsAll.filter(o => o.toLowerCase().includes(q));
      renderSheetOptions(filtered);
    });

    sheetDone.addEventListener("click", () => {
      overlay.classList.remove("visible");
      applyFilters();
    });

    overlay.addEventListener("click", e => {
      if (e.target === overlay) {
        overlay.classList.remove("visible");
      }
    });

    function toggleFilterValue(key, value) {
      const arr = state.filters[key] || [];
      const idx = arr.indexOf(value);
      if (idx === -1) arr.push(value);
      else arr.splice(idx, 1);
      state.filters[key] = arr;
    }

    function refreshFilterPills() {
      document.querySelectorAll(".filter-pill").forEach(pill => {
        const key = pill.getAttribute("data-filter");
        const arr = state.filters[key];
        pill.classList.toggle("has-selection", Array.isArray(arr) && arr.length > 0);
      });
    }

    // --------- FEATURES (single-click) ---------
    document.querySelectorAll(".feature-toggle").forEach(el => {
      el.addEventListener("click", () => {
        const feat = el.getAttribute("data-feature");
        state.filters.features[feat] = !state.filters.features[feat];
        applyFilters();
      });
    });

    function refreshFeatureToggles() {
      document.querySelectorAll(".feature-toggle").forEach(el => {
        const feat = el.getAttribute("data-feature");
        const on = !!state.filters.features[feat];
        el.classList.toggle("active", on);
      });
    }

    // Init
    loadData();
  </script>
</body>
</html>
