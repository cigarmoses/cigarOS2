<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CIGARS • POS</title>
  <style>
    :root{
      --bg:#eaf2f6; --ink:#0f1a2c; --muted:#6b7a90; --brand:#3775c8; --line:#dfe7ee;
      --card:#fff; --shadow:0 10px 28px rgba(15,26,44,.10);
    }
    html,body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:16px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }
    .wrap{
      max-width:480px;
      width:100%;
      margin:0 auto;
      padding:12px 12px 64px;
      box-sizing:border-box;
    }

    /* top bar with centered title */
    .topbar{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      height:40px;
      margin-bottom:6px;
    }
    .back{
      position:absolute;
      left:0;
      top:50%;
      transform:translateY(-50%);
      display:inline-flex;
      gap:6px;
      align-items:center;
      color:var(--brand);
      text-decoration:none;
      font-weight:600;
      font-size:14px;
    }
    .title{
      font-size:26px;
      font-weight:700;
      text-align:center;
      line-height:1;
    }
    .fav{
      position:absolute;
      right:0;
      top:50%;
      transform:translateY(-50%);
      font-size:22px;
      color:#f5d34f;
      cursor:pointer;
    }

    .search{
      display:flex;align-items:center;background:#fff;border-radius:999px;
      padding:10px 12px;border:1px solid var(--line);box-shadow:var(--shadow);
      margin-top:14px; /* gap under title */
    }
    .search input{border:0;outline:0;width:100%;font-size:15px}
    .search svg{opacity:.6}

    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
    .tile{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
      text-decoration:none;
      color:inherit;
    }
    .icon{
      width:72px;
      height:72px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }
    .name{
      font-weight:700;
      text-align:center;
      font-size:14px;
    }
    .empty{color:var(--muted);text-align:center;margin:24px 0}

    /* non-clickable brands */
    .tile.disabled{
      opacity:0.55;
      cursor:default;
    }
    .tile.disabled:hover{
      transform:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="title">CIGARS</div>
      <div class="fav" title="Favorite list">★</div>
    </div>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" placeholder="Search brands..." />
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">No brands match your search.</div>
  </div>

<script>
  // 1) list every SVG you currently have in /img/icons/brands/
  // add/remove from here — this is your “visual roster”
  const ALL_BRANDS = [
    "Aladino",
    "Arturo Fuente",
    "Padron",
    "My Father",
    "Oliva",
    "Aging Room",
    "Acid",
    "Alec Bradley",
    "Angel Cuesta",
    "Ashton",
    "Asylum",
    "Plasencia",
    "Crowned Heads"
    "Davidoff"
  ];

  // 2) make only these clickable right now
  const CLICKABLE = new Set([
    "Aladino"  // the only live brand today
  ]);

  const $grid = document.getElementById('grid');
  const $q = document.getElementById('q');
  const $empty = document.getElementById('empty');

  function slug(s){
    return String(s||'')
      .toLowerCase()
      .replace(/&/g,'and')
      .replace(/[^a-z0-9]+/g,'');
  }
  function rootify(p){ return p ? '/' + String(p).replace(/^\/+/, '') : ''; }

  function toNiceName(name){
    // if you added raw filenames like "agingroom", make them nicer
    if (name === "agingroom") return "Aging Room";
    if (name === "acid") return "Acid";
    if (name === "alecbradley") return "Alec Bradley";
    if (name === "arturofuente") return "Arturo Fuente";
    return name;
  }

  function buildTile(brandName){
    const nice = toNiceName(brandName);
    const isClickable = CLICKABLE.has(nice) || CLICKABLE.has(brandName);
    const s = slug(brandName);
    const imgPath = `/img/icons/brands/${s}.svg`;

    const el = document.createElement(isClickable ? 'a' : 'div');
    el.className = 'tile' + (isClickable ? '' : ' disabled');
    if (isClickable){
      el.href = `/pos/cigars/${slug(nice)}/`;
    }

    el.innerHTML = `
      <div class="icon"><img src="${imgPath}" alt="${nice}"></div>
      <div class="name">${nice}</div>
    `;
    return el;
  }

  function render(list){
    $grid.innerHTML = '';
    if (!list.length){
      $empty.style.display = 'block';
      return;
    }
    $empty.style.display = 'none';
    list.forEach(name => {
      $grid.appendChild(buildTile(name));
    });
  }

  // initial render
  render(ALL_BRANDS);

  // search
  $q.addEventListener('input', ()=>{
    const q = $q.value.trim().toLowerCase();
    const filtered = ALL_BRANDS.filter(name => toNiceName(name).toLowerCase().includes(q));
    render(filtered);
  });
</script>
</body>
</html>
