<!-- /pos/cigars/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cigars</title>

  <link rel="stylesheet" href="/css/type.css?v=13" />
  <link rel="stylesheet" href="/pos/pos.css?v=13" />
  <link rel="stylesheet" href="/pos/cigars/cigars.css?v=13" />
</head>

<body class="cigars-page">
  <header class="cigars-topbar">
    <button type="button" class="pos-back" aria-label="Back" onclick="history.back()">
      <span class="pos-back-icon">←</span>
    </button>

    <!-- If you have an invoice icon in your global UI, it can live here.
         IMPORTANT: only the real invoice button should have data-invoice-btn -->
    <button type="button" class="pos-invoice-btn" data-invoice-btn aria-label="Invoice">
      🧾
      <span data-cart-badge>0</span>
    </button>
  </header>

  <main class="cigars-main" role="main">
    <h1 class="cigars-title">Cigars</h1>

    <!-- Your cigars page JS should render into this -->
    <section class="cigars-list" id="cigarsList"></section>
  </main>

  <script src="/pos/cart.js?v=13" defer></script>
  <script src="/pos/cigars/cigars.js?v=13" defer></script>
</body>
</html>
