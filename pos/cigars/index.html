<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CIGARS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    .pos-tile-icon img {
      background:#000;
      object-fit: contain;
    }
    .pos-tile.disabled {
      opacity:.55;
      cursor:default;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">CIGARS</h1>

    <div class="pos-search">
      <input id="q" placeholder="Search" />
    </div>

    <div id="grid" class="pos-grid"></div>
    <div id="empty" class="empty" style="display:none;">No brands match your search.</div>
  </div>

  <!-- universal bill tab -->
  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    const ALL_BRANDS = [
      { label: "Aladino",       file: "aladino.svg",      clickable: true  },
      { label: "1502",          file: "1502.svg",         clickable: false },
      { label: "Acid",          file: "acid.svg",         clickable: false },
      { label: "Aging Room",    file: "agingroom.svg",    clickable: false },
      { label: "Alec Bradley",  file: "alecbradley.svg",  clickable: false },
      { label: "Angel Cuesta",  file: "angelcuesta.svg",  clickable: false },
      { label: "Arturo Fuente", file: "arturofuente.svg", clickable: false },
      { label: "Ashton",        file: "ashton.svg",       clickable: false },
      { label: "Asylum 13",     file: "asylum13.svg",     clickable: false },
      { label: "Atabey",        file: "atabey.svg",       clickable: false },
      { label: "AVO",           file: "avo.svg",          clickable: false },
      { label: "Baccarat",      file: "baccarat.svg",     clickable: false },
    ];

    const $grid = document.getElementById('grid');
    const $q = document.getElementById('q');
    const $empty = document.getElementById('empty');

    function toSlug(s){
      return s.toLowerCase().replace(/[^a-z0-9]+/g,'');
    }

    function buildTile(brand){
      const src = `/img/icons/brands/${brand.file}`;
      const el = document.createElement(brand.clickable ? 'a' : 'div');
      el.className = 'pos-tile' + (brand.clickable ? '' : ' disabled');
      if (brand.clickable) {
        el.href = `/pos/cigars/${toSlug(brand.label)}/`;
      }
      el.innerHTML = `
        <div class="pos-tile-icon"><img src="${src}" alt="${brand.label}"></div>
        <div class="pos-tile-label">${brand.label}</div>
      `;
      return el;
    }

    function render(list){
      $grid.innerHTML = '';
      if (!list.length){
        $empty.style.display = 'block';
        return;
      }
      $empty.style.display = 'none';
      list.forEach(b => $grid.appendChild(buildTile(b)));
    }

    render(ALL_BRANDS);

    $q.addEventListener('input', ()=>{
      const v = $q.value.trim().toLowerCase();
      const filtered = ALL_BRANDS.filter(b => b.label.toLowerCase().includes(v));
      render(filtered);
    });

    // bill tab: hook into real cart later
    // document.getElementById('billCount').textContent = cart.items.length;
    // document.getElementById('billTotal').textContent = '$' + cart.total.toFixed(2);
  </script>
</body>
</html>
