<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CigarOS — Detail</title>

  <link rel="stylesheet" href="/pos/cigars/detail.css?v=1.0.0" />
</head>

<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back"><span class="chev"></span></button>
  </header>

  <main class="detail">
    <section class="hero">
      <div class="hero-head">
        <div>
          <h1 class="brand" id="brandName">Brand</h1>
          <h2 class="name" id="cigarName">Cigar Name</h2>
        </div>

        <img class="logo" id="brandLogo" alt="" />
      </div>
    </section>

    <section class="grid">
      <div class="stick" id="stickWrap">
        <img id="stickImg" alt="" />
      </div>

      <div class="specs">
        <div class="spec-row">
          <div class="spec">
            <div class="k">RING</div>
            <div class="v" id="ring">—</div>
          </div>
          <div class="spec">
            <div class="k">LENGTH</div>
            <div class="v" id="length">—</div>
          </div>
        </div>

        <div class="spec-row">
          <div class="spec">
            <div class="k">SHAPE</div>
            <div class="v" id="shape">—</div>
          </div>
          <div class="spec">
            <div class="k">VITOLA</div>
            <div class="v" id="vitola">—</div>
          </div>
        </div>

        <div class="spec-col">
          <div class="kv"><span class="k">WRAPPER</span><span class="v" id="wrapper">—</span></div>
          <div class="kv"><span class="k">BINDER</span><span class="v" id="binder">—</span></div>
          <div class="kv"><span class="k">FILLER</span><span class="v" id="filler">—</span></div>
          <div class="kv"><span class="k">ORIGIN</span><span class="v" id="origin">—</span></div>
        </div>

        <div class="spec-wide">
          <div class="kv"><span class="k">STRENGTH</span><span class="v" id="strength">—</span></div>
        </div>

        <div class="spec-wide">
          <div class="kv"><span class="k">WRAPPER SHADE</span><span class="v" id="shade">—</span></div>
        </div>
      </div>
    </section>

    <section class="actions">
      <button class="ghost" id="compareBtn">COMPARE</button>
      <button class="ghost" id="editBtn">EDIT</button>
      <button class="primary" id="addBtn">ADD</button>
    </section>
  </main>

  <script src="/pos/cigars/detail.js?v=1.0.0"></script>
</body>
</html>
