<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Favorites</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <!-- Reuse the same cigars page styling so brand tiles match 1:1 -->
  <link rel="stylesheet" href="/pos/cigars/cigars.css" />
  <link rel="stylesheet" href="/pos/cigars/favorites.css" />
</head>

<body class="cigars-page favorites-page">
  <header class="cigars-topbar">
    <button type="button" class="pos-back" id="fav-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main class="cigars-main">
    <section class="cigars-header">
      <h1 class="cigars-title favorites-title">Favorites</h1>
    </section>

    <!-- Brands (must match /pos/cigars/ grid style) -->
    <section class="cigars-brands-section">
      <h2 class="cigars-brands-title">Brands</h2>
      <div id="fav-brands-grid" class="brands-grid"></div>
    </section>

    <!-- Cigars (must match brand-page row layout, but WHITE container) -->
    <section class="favorites-cigars-section">
      <h2 class="favorites-cigars-title">Cigars</h2>
      <div id="fav-cigars-list" class="fav-cigars-list"></div>
      <div id="fav-status" class="fav-status" hidden></div>
    </section>
  </main>

  <script defer src="/pos/pos.js"></script>
  <script defer src="/pos/cigars/favorites.js"></script>
</body>
</html>
