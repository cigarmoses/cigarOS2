<!-- Receipt Floating Button -->
<div class="receipt-fab" id="receiptFab">
  <div class="receipt-icon">
    <div class="receipt-icon-inner"></div>
  </div>
  <div class="receipt-count" id="receiptCount">4</div>
  <div class="receipt-total" id="receiptTotal">$24.50</div>
</div>

<!-- Receipt Modal / Overlay -->
<div class="receipt-overlay" id="receiptOverlay" aria-modal="true" role="dialog">
  <div class="receipt-modal" id="receiptModal">
    <div class="receipt-modal-header">
      <div class="receipt-modal-title">Current receipt</div>
      <div class="receipt-modal-close" id="receiptClose" aria-label="Close receipt">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div class="receipt-modal-body" id="receiptBody">
      <div class="receipt-line">
        <div class="receipt-line-left">
          <div class="receipt-line-title">Pappy Van Winkle Flying Pig</div>
          <div class="receipt-line-sub">Qty 1 · $13.99</div>
        </div>
        <div class="receipt-line-right">$13.99</div>
      </div>

      <div class="receipt-line">
        <div class="receipt-line-left">
          <div class="receipt-line-title">ACID 1400cc Tubo</div>
          <div class="receipt-line-sub">Qty 1 · $13.20</div>
        </div>
        <div class="receipt-line-right">$13.20</div>
      </div>
    </div>

    <div class="receipt-footer">
      <div>
        <div class="receipt-total-label">Total</div>
        <div class="receipt-total-amount" id="receiptTotalFooter">$27.19</div>
      </div>
      <button class="receipt-checkout" id="checkoutBtn">Checkout</button>
    </div>
  </div>
</div>
