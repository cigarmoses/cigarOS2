<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ASHTRAYS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css" />
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 90px;
    }
    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .pos-star {
      font-size: 22px;
      color: #ffcc00;
    }
    .pos-header-spacer {
      height: 16px;
    }
    .pos-title {
      text-align: center;
      font-weight: 700;
      font-size: 30px;
      margin: 0 0 10px;
    }

    .pos-search {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 999px;
      padding: 10px 12px;
      border: 1px solid rgba(0,0,0,.03);
      margin-bottom: 14px;
    }
    .pos-search input {
      border: 0;
      outline: 0;
      width: 100%;
      background: transparent;
      font-size: 14px;
    }

    .ash-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .ash-tile {
      text-align: center;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .ash-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #d9d9d9;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .ash-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ash-label {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
    }
    .ash-price {
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">ASHTRAYS</h1>

    <div class="pos-search">
      <input id="ashSearch" placeholder="Search" />
    </div>

    <div id="ashGrid" class="ash-grid"></div>
  </div>

  <script>
    // PRODUCTS (using /img/ashtrays/)
    const ASHTRAYS = [
      {
        name: "Opus X 20th Anniversary Ashtray",
        price: "$199.99",
        img: "/img/ashtrays/opusx20thanniversaryashtray.jpg"
      },
      {
        name: "Rocky Patel Luxury Luminoso Ashtray",
        price: "$59.99",
        img: "/img/ashtrays/rockypatelluxuryluminosoashtray.jpg"
      }
    ];

    const grid = document.getElementById("ashGrid");
    const search = document.getElementById("ashSearch");

    function renderAshtrays(filter = "") {
      grid.innerHTML = "";
      const term = filter.toLowerCase();

      ASHTRAYS
        .filter(a => a.name.toLowerCase().includes(term))
        .forEach(a => {
          const div = document.createElement("a");
          div.className = "ash-tile";
          div.href = "javascript:void(0)";
          div.innerHTML = `
            <div class="ash-icon">
              <img src="${a.img}" alt="${a.name}">
            </div>
            <div class="ash-label">${a.name}</div>
            <div class="ash-price">${a.price}</div>
          `;
          grid.appendChild(div);
        });
    }

    renderAshtrays();

    search.addEventListener("input", e => {
      renderAshtrays(e.target.value);
    });
  </script>

  <!-- Red receipt pill -->
  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt" />
  </div>

  <!-- Invoice Popup -->
  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>

      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row"><span>Subtotal</span><span id="invoice-subtotal">$0.00</span></div>
        <div class="total-row"><span>Tax</span><span id="invoice-tax">$0.00</span></div>
        <div class="total-row total-bold"><span>TOTAL</span><span id="invoice-total">$0.00</span></div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
