<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Ashtrays</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />

  <style>
    /* Ensure the icon area displays the resolved image nicely */
    .category-card-icon{
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .category-card-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
  </style>
</head>
<body class="category-page">
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Ashtrays</h1>

    <section class="category-search">
      <input type="search" class="category-search-input" placeholder="Search" />
    </section>

    <section class="category-grid">
      <article class="category-card" data-receipt-item
        data-brand="Rocky Patel" data-name="Rocky Patel Ashtray" data-price="39.99">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Rocky Patel Ashtray</div>
        <div class="category-card-price">$39.99</div>
      </article>

      <article class="category-card" data-receipt-item
        data-brand="Ceramic" data-name="Ceramic Ashtray" data-price="24.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Ceramic Ashtray</div>
        <div class="category-card-price">$24.00</div>
      </article>
    </section>
  </main>

  <!-- Universal cart + receipt modal + universal receipt FAB -->
  <script src="/pos/cart.js" defer></script>

  <!-- Page behavior: add items to the universal cart, icons, and back nav -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const IMAGE_DIR = "/img/ashtrays"; // <-- Ashtrays folder

      // ---------------------------------------
      // Product image resolving (.svg/.png/.jpg)
      // ---------------------------------------
      const existsCache = new Map();

      function normalizeProductName(name) {
        return String(name || "")
          .toLowerCase()
          .replace(/[\s-]+/g, "")     // remove spaces + dashes
          .replace(/[^a-z0-9]/g, ""); // remove punctuation/special chars
      }

      async function urlExists(url) {
        if (existsCache.has(url)) return existsCache.get(url);

        let ok = false;

        // Try HEAD first (fast)
        try {
          const res = await fetch(url, { method: "HEAD", cache: "no-store" });
          ok = res.ok;
        } catch (_) {
          ok = false;
        }

        // Fallback to GET if needed
        if (!ok) {
          try {
            const res = await fetch(url, { method: "GET", cache: "no-store" });
            ok = res.ok;
          } catch (_) {
            ok = false;
          }
        }

        existsCache.set(url, ok);
        return ok;
      }

      async function resolveProductImage(productName, baseDir) {
        const key = normalizeProductName(productName);
        const exts = ["svg", "png", "jpg"];

        for (const ext of exts) {
          const url = `${baseDir}/${key}.${ext}`;
          if (await urlExists(url)) return url;
        }
        return "";
      }

      async function applyCardIcons() {
        const cards = Array.from(document.querySelectorAll("[data-receipt-item]"));

        await Promise.all(cards.map(async (card) => {
          const iconBox = card.querySelector(".category-card-icon");
          if (!iconBox) return;

          // Optional manual override later:
          // data-img="/img/ashtrays/rockypatelluxuryluminosoashtray.jpg"
          const manual = card.dataset.img || "";
          const name = card.dataset.name || "";

          const src = manual || await resolveProductImage(name, IMAGE_DIR);

          iconBox.innerHTML = "";
          if (!src) return;

          const img = document.createElement("img");
          img.alt = name;
          img.loading = "lazy";
          img.decoding = "async";
          img.src = src;
          iconBox.appendChild(img);
        }));
      }

      // Apply icons on load
      applyCardIcons();

      // ---------------------------------------
      // Add-to-invoice flow (your existing logic)
      // ---------------------------------------
      function addFromCard(card) {
        if (!window.CigarOSCart || typeof window.CigarOSCart.add !== "function") return;

        const brand = card.dataset.brand || "";
        const name = card.dataset.name || "Item";
        const price = Number(card.dataset.price || "0");
        const vitola = card.dataset.vitola || "";

        const id = (brand + "|" + name + "|" + vitola).toLowerCase();

        window.CigarOSCart.add({
          id,
          name,
          brand,
          sub: vitola,
          price,
          img: ""
        });
      }

      document.querySelectorAll("[data-receipt-item]").forEach((card) => {
        card.addEventListener("click", () => addFromCard(card));
      });

      const backBtn = document.getElementById("category-back");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          window.location.href = "/pos/";
        });
      }
    });
  </script>
</body>
</html>
