<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ASHTRAYS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    .ash-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 12px;
    }
    .ash-tile {
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      color: #0f1a2c;
    }
    .ash-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      background: #d9d9d9;
      display: grid;
      place-items: center;
    }
    .ash-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ash-label {
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">ASHTRAYS</h1>

    <div class="pos-search">
      <input id="ashSearch" placeholder="Search" />
    </div>

    <div id="ashGrid" class="ash-grid"></div>
  </div>

  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    // update names to match /img/icons/ashtrays/*.svg
    const ASHTRAYS = [
      { name: "Single Slot", file: "single.svg" },
      { name: "4 Slot", file: "4slot.svg" },
      { name: "Ceramic", file: "ceramic.svg" },
      { name: "Glass", file: "glass.svg" },
      { name: "Branded", file: "branded.svg" },
    ];

    const ashGrid = document.getElementById('ashGrid');
    const ashSearch = document.getElementById('ashSearch');

    function renderAshtrays(filter = "") {
      ashGrid.innerHTML = "";
      ASHTRAYS.filter(a => a.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(a => {
          const el = document.createElement('a');
          el.className = 'ash-tile';
          el.href = 'javascript:void(0)';
          el.innerHTML = `
            <div class="ash-icon">
              <img src="/img/icons/ashtrays/${a.file}" alt="${a.name}">
            </div>
            <div class="ash-label">${a.name}</div>
          `;
          ashGrid.appendChild(el);
        });
    }

    renderAshtrays();

    ashSearch.addEventListener('input', e => {
      renderAshtrays(e.target.value);
    });
  </script>
</body>
</html>
