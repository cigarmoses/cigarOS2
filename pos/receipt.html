<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Receipt</title>

  <!-- Global SF Pro + POS styles -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --ink: #0f1a2c;
      --muted: #6a7586;
      --accent: #007aff;
      --bg-soft: #f5f7fa;
      --border-subtle: #e3e6ec;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: var(--font-text, -apple-system, BlinkMacSystemFont, system-ui, sans-serif);
    }

    .receipt-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */

    .receipt-topbar {
      padding: 16px 18px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .receipt-close {
      border: none;
      background: none;
      padding: 4px 0;
      font-size: 17px;
      color: #007aff;
      cursor: pointer;
    }

    .receipt-title-block {
      flex: 1;
      margin-left: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .receipt-datetime {
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    .receipt-customer-btn {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      font-size: 13px;
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .receipt-customer-btn span {
      color: var(--muted);
    }

    .receipt-customer-btn strong {
      color: var(--ink);
    }

    /* Main title */

    .receipt-main-title {
      margin: 0 18px 8px;
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-weight: 900; /* Heavy */
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    /* Customer search placeholder (gives you room to wire a real search later) */

    .receipt-customer-search {
      margin: 0 18px 12px;
      display: none; /* show when Attach Customer is tapped */
    }

    .receipt-customer-search input {
      width: 100%;
      border-radius: 999px;
      border: none;
      background: var(--bg-soft);
      padding: 10px 14px;
      font-size: 15px;
      outline: none;
    }

    /* Items list */

    .receipt-items {
      margin: 8px 0 0;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .receipt-row {
      display: grid;
      grid-template-columns: 70px 1.6fr auto auto;
      column-gap: 10px;
      align-items: center;
      padding: 10px 18px;
    }

    .receipt-row + .receipt-row {
      border-top: 1px solid var(--border-subtle);
    }

    /* Brand icon + name */

    .receipt-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
    }

    .receipt-brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: contain;
      background: #ffffff;
    }

    .receipt-brand-name {
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 11px;
      color: var(--muted);
    }

    /* Cigar name + vitola */

    .receipt-product {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .receipt-product-name {
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600; /* slightly bolder */
    }

    .receipt-product-vitola {
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 12px;
      color: var(--muted);
    }

    /* Qty adjuster */

    .receipt-qty {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: var(--bg-soft);
      padding: 2px 8px;
      gap: 8px;
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 14px;
    }

    .receipt-qty button {
      border: none;
      background: none;
      font-size: 18px;
      line-height: 1;
      padding: 2px;
      cursor: pointer;
      color: var(--ink);
    }

    .receipt-qty span {
      min-width: 14px;
      text-align: center;
    }

    /* Line item total */

    .receipt-line-total {
      text-align: right;
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    /* Summary (subtotal, tax, total) */

    .receipt-summary {
      padding: 14px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 15px;
    }

    .receipt-summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .receipt-summary-row.total {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800; /* Heavy-ish for Total */
    }

    /* Bottom buttons */

    .receipt-actions {
      margin-top: 12px;
      padding: 0 18px 28px;
      display: flex;
      gap: 10px;
    }

    .receipt-btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }

    .receipt-btn-secondary {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      color: var(--ink);
    }

    .receipt-btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="receipt-page">
    <!-- Top bar -->
    <header class="receipt-topbar">
      <button class="receipt-close" type="button">Close</button>

      <div class="receipt-title-block">
        <div class="receipt-datetime" id="receiptDatetime">
          <!-- JS can overwrite this with real date/time -->
          Dec 10, 2025 • 4:24 PM
        </div>
        <button class="receipt-customer-btn" type="button">
          <span>Customer:</span>
          <strong>Attach customer ▾</strong>
        </button>
      </div>
    </header>

    <h1 class="receipt-main-title">Receipt</h1>

    <!-- Optional customer search field (can show when Attach is tapped) -->
    <div class="receipt-customer-search" id="receiptCustomerSearch">
      <input type="search" placeholder="Search or add customer for points…" />
    </div>

    <!-- Items list -->
    <section class="receipt-items">
      <!-- Row 1 -->
      <div class="receipt-row">
        <div class="receipt-brand">
          <img src="/img/icons/brands/padron.svg" alt="Padron" class="receipt-brand-icon" />
          <div class="receipt-brand-name">Padron</div>
        </div>

        <div class="receipt-product">
          <div class="receipt-product-name">1964 Anniversary</div>
          <div class="receipt-product-vitola">Torcedor • 6 x 52</div>
        </div>

        <div class="receipt-qty">
          <button type="button">−</button>
          <span>1</span>
          <button type="button">+</button>
        </div>

        <div class="receipt-line-total">$18.00</div>
      </div>

      <!-- Row 2 -->
      <div class="receipt-row">
        <div class="receipt-brand">
          <img src="/img/icons/brands/arturofuente.svg" alt="Arturo Fuente" class="receipt-brand-icon" />
          <div class="receipt-brand-name">Arturo Fuente</div>
        </div>

        <div class="receipt-product">
          <div class="receipt-product-name">Don Carlos Eye of the Shark</div>
          <div class="receipt-product-vitola">Figurado • 5.75 x 52</div>
        </div>

        <div class="receipt-qty">
          <button type="button">−</button>
          <span>2</span>
          <button type="button">+</button>
        </div>

        <div class="receipt-line-total">$59.00</div>
      </div>
    </section>

    <!-- Summary -->
    <section class="receipt-summary">
      <div class="receipt-summary-row">
        <span>Subtotal</span>
        <span>$77.00</span>
      </div>
      <div class="receipt-summary-row">
        <span>Tax</span>
        <span>$5.39</span>
      </div>
      <div class="receipt-summary-row total">
        <span>Total</span>
        <span>$82.39</span>
      </div>
    </section>

    <!-- Actions -->
    <div class="receipt-actions">
      <button class="receipt-btn receipt-btn-secondary" type="button">
        SAVE DRAFT
      </button>
      <button class="receipt-btn receipt-btn-primary" type="button">
        MOCKUP
      </button>
    </div>
  </div>

  <script>
    // Example: set real date/time on load
    const dtEl = document.getElementById("receiptDatetime");
    if (dtEl) {
      const now = new Date();
      const opts = {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      };
      dtEl.textContent = now.toLocaleString(undefined, opts);
    }

    // You can hook this up later so tapping "Attach customer"
    // reveals the search input or opens a modal.
    const attachBtn = document.querySelector(".receipt-customer-btn");
    const searchRow = document.getElementById("receiptCustomerSearch");
    if (attachBtn && searchRow) {
      attachBtn.addEventListener("click", () => {
        const isVisible = searchRow.style.display === "block";
        searchRow.style.display = isVisible ? "none" : "block";
      });
    }
  </script>
</body>
</html>
