<div class="invoice-item">
  <!-- LEFT: Brand icon -->
  <div class="invoice-item-icon">
    <img src="/img/icons/brands/padron.svg" alt="Padron logo">
  </div>

  <!-- MIDDLE: Text block (max 5 lines total) -->
  <div class="invoice-item-text">
    <!-- Line + Cigar name (wrapping link, max 2 lines) -->
    <a href="#"
       class="invoice-item-title">
      1926 1926 No. 35 Natural
    </a>

    <!-- Vitola / Brand / MSRP (3 lines) -->
    <div class="invoice-item-meta">
      <div class="invoice-item-vitola">Corona</div>
      <div class="invoice-item-brand">Padron</div>
      <div class="invoice-item-msrp">22.48</div>
    </div>
  </div>

  <!-- RIGHT: QTY block (3 lines: label, controls, line total) -->
  <div class="invoice-item-qty">
    <div class="invoice-item-qty-label">QTY</div>
    <div class="invoice-item-qty-controls">
      <button class="invoice-qty-btn">−</button>
      <span class="invoice-qty-value">1</span>
      <button class="invoice-qty-btn">+</button>
    </div>
    <div class="invoice-item-line-total">$22.48</div>
  </div>
</div>
