<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invoice</title>
  <style>
    :root{
      --bg:#9aa1a6;           /* page backdrop (behind the card) */
      --ink:#0f1a2c;          /* primary text */
      --muted:#6a7586;        /* secondary text */
      --card:#ffffff;         /* invoice card */
      --pill:#0f1a2c;         /* receipt pill background */
      --accent:#0b62ff;       /* links/interactive */
      --danger:#d11219;
      --ring:#e8eef2;         /* line item bg */
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color:var(--ink);
    }

    header{
      display:flex;
      align-items:center;
      gap:10px;
      padding:14px 14px 6px;
    }
    .back{
      text-decoration:none;
      color:var(--ink);
      font-weight:700;
      font-size:16px;
    }

    /* Invoice card */
    .sheet{
      width:min(880px, 100%);
      margin:8px auto 120px;
      background:var(--card);
      border-radius:36px;
      padding:24px 18px 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    .title{
      text-align:center;
      font-weight:900;
      font-size:42px;
      margin:6px 0 2px;
    }
    .stamp{
      text-align:center;
      font-size:20px;
      margin:0 0 14px;
    }

    /* Loyalty select */
    .loyal-wrap{
      background:#eef4f7;
      border-radius:18px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin: 0 6px 16px;
      font-weight:700;
    }
    .loyal-select{
      flex:1;
      min-width:0;
      background:#eef4f7;
      border:none;
      font: inherit;
      color: var(--ink);
      outline:none;
    }

    /* Lines */
    .lines{
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:0 6px;
    }
    .line{
      background:var(--ring);
      border-radius:26px;
      padding:14px;
      display:grid;
      grid-template-columns: 86px 1fr 120px;
      gap:12px;
      align-items:center;
    }
    .brand-ic{
      width:86px;
      height:86px;
      border-radius:20px;
      background:#ddd;
      background-size:cover;
      background-position:center;
    }
    .mid{
      min-width:0;
    }
    .name{
      margin:0;
      font-weight:900;
      font-size:22px;
      color:var(--accent);
      text-decoration:underline;
      text-underline-offset:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{ margin:4px 0 0; color:var(--ink); }
    .muted{ color:var(--muted); }
    .msrp{ margin-top:2px; font-weight:600; }

    .qty{
      justify-self:end;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .qty label{ font-weight:800; letter-spacing:.5px; }
    .stepper{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:8px;
      justify-content:flex-end;
    }
    .btn{
      width:42px; height:42px;
      border-radius:999px;
      border:none;
      display:grid; place-items:center;
      font-weight:900; font-size:20px;
      background:#0f1a2c; color:#fff;
      cursor:pointer;
    }
    .btn:active{ transform: translateY(1px); }
    .qty-val{
      width:34px; text-align:center; font-weight:800;
    }
    .line-total{
      text-align:right;
      font-weight:800;
      font-size:22px;
    }

    /* Totals */
    .totals{
      display:grid;
      grid-template-columns: 1fr auto;
      row-gap:10px;
      width:min(420px, 100%);
      margin: 18px 6px 0 auto;
      font-size:20px;
    }
    .totals b{ font-weight:900; }
    .hr{ border:none; border-top:1px solid #e6eaee; margin:16px 6px; }

    /* Receipt pill (always present) */
    .pill{
      position:fixed;
      right:14px;
      bottom:14px;
      background:var(--pill);
      color:#fff;
      display:flex;
      align-items:center;
      gap:14px;
      padding:9px 22px 9px 9px;
      border-radius:999px;
      text-decoration:none;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      z-index:999;
    }
    .pill-ic{
      width:54px; height:54px; border-radius:999px; background:#fff;
      color:var(--pill); display:grid; place-items:center;
      font-weight:900; font-size:12px;
    }
    .pill-count{
      width:26px; height:26px; border-radius:999px; background:#d11219;
      display:grid; place-items:center; font-weight:900;
    }
    .pill-total{ font-size:20px; font-weight:900; }

    @media (max-width:720px){
      .line{
        grid-template-columns: 74px 1fr;
        grid-template-areas:
          "ic mid"
          "ic qty";
        align-items:start;
      }
      .brand-ic{ grid-area: ic; width:74px; height:74px; }
      .mid{ grid-area: mid; }
      .qty{ grid-area: qty; justify-self:start; }
      .line-total{ grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back" href="/pos/">← Back</a>
  </header>

  <main class="sheet" id="sheet">
    <h1 class="title">Invoice</h1>
    <p class="stamp" id="stamp">—</p>

    <div class="loyal-wrap">
      <div>Loyalty customer</div>
      <select id="loyal" class="loyal-select">
        <option value="">Select customer…</option>
        <option>John Smith</option>
        <option>Mary Jones</option>
        <option>Walk-in</option>
      </select>
    </div>

    <section id="lines" class="lines"></section>

    <hr class="hr" />

    <section class="totals">
      <div>Subtotal</div>      <div id="subtotal"><b>$0.00</b></div>
      <div>Tax (7%)</div>      <div id="tax"><b>$0.00</b></div>
      <div><b>TOTAL</b></div>  <div id="grand"><b>$0.00</b></div>
    </section>
  </main>

  <!-- Always-on pill -->
  <a href="/pos/receipt.html" class="pill" id="pill">
    <div class="pill-ic">RCP</div>
    <div class="pill-count" id="pillCount">0</div>
    <div class="pill-total" id="pillTotal">$0.00</div>
  </a>

  <script>
    /* --------- Storage + helpers --------- */
    const STORAGE_KEY = 'cigaros_receipt_v1';
    const TAX_RATE = 0.07;

    function loadCart(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch(e){ return []; }
    }
    function saveCart(v){ localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); }
    function money(n){ return (n||0).toFixed(2); }

    function setStamp(){
      const d = new Date();
      const day = d.toLocaleDateString(undefined, { weekday:'long' });
      const date = d.toLocaleDateString(undefined, { year:'numeric', month:'numeric', day:'numeric' });
      const time = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
      document.getElementById('stamp').textContent = `${day}, ${date} ${time}`;
    }

    /* --------- Render --------- */
    let CART = loadCart();

    function render(){
      setStamp();
      const wrap = document.getElementById('lines');
      wrap.innerHTML = '';

      if (!CART.length){
        wrap.innerHTML = `<div style="padding:18px; color:var(--muted);">Nothing here yet. Add items from any POS page, then tap the pill.</div>`;
      }

      CART.forEach(item => {
        const line = document.createElement('div');
        line.className = 'line';
        line.dataset.id = item.id;

        const ic = document.createElement('div');
        ic.className = 'brand-ic';
        if (item.icon) ic.style.backgroundImage = `url(${item.icon})`;

        const mid = document.createElement('div');
        mid.className = 'mid';
        mid.innerHTML = `
          <h3 class="name"><a href="#" style="color:var(--accent);text-decoration:underline">${item.name}</a></h3>
          <div class="meta"><span class="muted">${item.vitola || ''}</span></div>
          <div class="meta"><span class="muted">${item.brand || ''}</span></div>
          <div class="msrp">${money(item.msrp)}</div>
        `;

        const qty = document.createElement('div');
        qty.className = 'qty';
        qty.innerHTML = `
          <div style="text-align:right">
            <label>QTY</label>
            <div class="stepper">
              <button class="btn btn-minus" aria-label="decrease">−</button>
              <div class="qty-val">${item.qty}</div>
              <button class="btn btn-plus" aria-label="increase">+</button>
            </div>
            <div class="line-total">$${money(item.qty * item.msrp)}</div>
          </div>
        `;

        line.appendChild(ic);
        line.appendChild(mid);
        line.appendChild(qty);
        wrap.appendChild(line);
      });

      updateTotals();
      updatePill();
    }

    function updateTotals(){
      const subtotal = CART.reduce((n,i)=> n + i.qty*i.msrp, 0);
      const tax = subtotal * TAX_RATE;
      const grand = subtotal + tax;
      document.getElementById('subtotal').innerHTML = `<b>$${money(subtotal)}</b>`;
      document.getElementById('tax').innerHTML = `<b>$${money(tax)}</b>`;
      document.getElementById('grand').innerHTML = `<b>$${money(grand)}</b>`;
    }

    function updatePill(){
      const count = CART.reduce((n,i)=>n+i.qty,0);
      const total = CART.reduce((n,i)=>n+i.qty*i.msrp,0);
      document.getElementById('pillCount').textContent = count;
      document.getElementById('pillTotal').textContent = '$'+money(total);
    }

    /* --------- Events --------- */
    document.getElementById('lines').addEventListener('click', (e)=>{
      const btnMinus = e.target.closest('.btn-minus');
      const btnPlus  = e.target.closest('.btn-plus');
      if (!btnMinus && !btnPlus) return;

      const lineEl = e.target.closest('.line');
      const id = lineEl?.dataset?.id;
      if (!id) return;
      const item = CART.find(i=>i.id===id);
      if (!item) return;

      if (btnPlus) item.qty += 1;
      if (btnMinus) item.qty -= 1;

      if (item.qty <= 0){
        CART = CART.filter(i=>i.id!==id);
      }
      saveCart(CART);
      render();
    });

    /* Optional: remember chosen loyalty customer */
    const loyal = document.getElementById('loyal');
    loyal.value = localStorage.getItem('cigaros_loyal_name') || '';
    loyal.addEventListener('change', ()=>{
      localStorage.setItem('cigaros_loyal_name', loyal.value || '');
    });

    /* --------- Kickoff --------- */
    render();
  </script>
</body>
</html>
