<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PACKS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css" />

  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 12px 110px;
    }

    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      font-size: 18px;
    }

    .pos-star {
      font-size: 26px;
      color: #ffcc00;
    }

    h1.pos-title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    .pos-search {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 999px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }

    .pos-search input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 16px;
      background: transparent;
    }

    .packs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
      margin-top: 10px;
    }

    .packs-tile {
      text-align: center;
      color: var(--ink);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .packs-icon {
      width: 120px;
      height: 120px;
      border-radius: 22px;
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .packs-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 3-line description under image */
    .packs-brand {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
    }

    .packs-label {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    .packs-price {
      font-size: 14px;
      margin-top: -3px;
    }
  </style>
</head>

<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a href="/pos/" class="pos-back">← POS</a>
      <div class="pos-star">★</div>
    </div>

    <h1 class="pos-title">PACKS</h1>

    <div class="pos-search">
      <input id="packsSearch" placeholder="Search">
    </div>

    <div id="packsGrid" class="packs-grid"></div>
  </div>

  <script>
    // Brand / Item / Price wired in, with Arturo Fuente Shark Pack at the bottom
    const PACKS = [
      { brand: "n/a",            name: "3 Pack",  file: "3pack.svg",  price: "" },
      { brand: "n/a",            name: "4 Pack",  file: "4pack.svg",  price: "" },
      { brand: "n/a",            name: "5 Pack",  file: "5pack.svg",  price: "" },
      { brand: "n/a",            name: "10 Pack", file: "10pack.svg", price: "" },
      { brand: "n/a",            name: "Sampler", file: "sampler.svg", price: "" },
      { brand: "Arturo Fuente",  name: "Shark Pack", file: "sharkpack.svg", price: "$175.00" }
    ];

    const grid = document.getElementById("packsGrid");
    const search = document.getElementById("packsSearch");

    function renderPacks(filter = "") {
      grid.innerHTML = "";
      const term = filter.toLowerCase();

      PACKS
        .filter(p => {
          const haystack = (p.brand + " " + p.name).toLowerCase();
          return haystack.includes(term);
        })
        .forEach(p => {
          const brandLine =
            p.brand && p.brand.toLowerCase() !== "n/a"
              ? `<div class="packs-brand">${p.brand}</div>`
              : "";

          const priceLine =
            p.price
              ? `<div class="packs-price">${p.price}</div>`
              : "";

          const el = document.createElement("a");
          el.className = "packs-tile";
          el.innerHTML = `
            <div class="packs-icon">
              <img src="/img/packs/${p.file}" alt="${p.name}">
            </div>
            ${brandLine}
            <div class="packs-label">${p.name}</div>
            ${priceLine}
          `;
          grid.appendChild(el);
        });
    }

    renderPacks();

    search.addEventListener("input", e => {
      renderPacks(e.target.value);
    });
  </script>

  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt">
  </div>

  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>
      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row"><span>Subtotal</span><span id="invoice-subtotal">$0.00</span></div>
        <div class="total-row"><span>Tax</span><span id="invoice-tax">$0.00</span></div>
        <div class="total-row total-bold"><span>TOTAL</span><span id="invoice-total">$0.00</span></div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
