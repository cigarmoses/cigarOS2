<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PACKS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    .packs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 12px;
    }
    .packs-tile {
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      color: #0f1a2c;
    }
    .packs-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      background: #d9d9d9;
      display: grid;
      place-items: center;
    }
    .packs-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .packs-label {
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">PACKS</h1>

    <div class="pos-search">
      <input id="packsSearch" placeholder="Search" />
    </div>

    <div id="packsGrid" class="packs-grid"></div>
  </div>

  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    // update names to match /img/icons/packs/*.svg
    const PACKS = [
      { name: "3 Pack", file: "3pack.svg" },
      { name: "4 Pack", file: "4pack.svg" },
      { name: "5 Pack", file: "5pack.svg" },
      { name: "10 Pack", file: "10pack.svg" },
      { name: "Sampler", file: "sampler.svg" },
    ];

    const packsGrid = document.getElementById('packsGrid');
    const packsSearch = document.getElementById('packsSearch');

    function renderPacks(filter = "") {
      packsGrid.innerHTML = "";
      PACKS.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(p => {
          const el = document.createElement('a');
          el.className = 'packs-tile';
          el.href = 'javascript:void(0)';
          el.innerHTML = `
            <div class="packs-icon">
              <img src="/img/icons/packs/${p.file}" alt="${p.name}">
            </div>
            <div class="packs-label">${p.name}</div>
          `;
          packsGrid.appendChild(el);
        });
    }

    renderPacks();

    packsSearch.addEventListener('input', e => {
      renderPacks(e.target.value);
    });
  </script>
</body>
</html>
