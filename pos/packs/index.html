<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Packs</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />
</head>
<body class="category-page">
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Packs</h1>

    <section class="category-search">
      <input type="search" class="category-search-input" placeholder="Search" />
    </section>

    <section class="category-grid">
      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Packs"
        data-brand="Arturo Fuente"
        data-name="Shark Pack"
        data-price="71.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Shark Pack</div>
        <div class="category-card-price">$71.00</div>
      </article>

      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Packs"
        data-brand="Padron"
        data-name="Padron Sample Pack"
        data-price="89.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Padron Sample Pack</div>
        <div class="category-card-price">$89.00</div>
      </article>
    </section>
  </main>

  <!-- ONE shared cart controller for all POS pages -->
  <script src="/pos/cart.js" defer></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const backBtn = document.getElementById("category-back");
      if (backBtn) backBtn.addEventListener("click", () => (window.location.href = "/pos/"));

      // Click product => add item (invoice does NOT auto-open on page load anymore)
      document.querySelectorAll("[data-receipt-item]").forEach((card) => {
        card.addEventListener("click", () => {
          const type = (card.dataset.type || "product").toLowerCase();
          const category = card.dataset.category || "Product";
          const brand = card.dataset.brand || "";
          const name = card.dataset.name || "Item";
          const price = Number(card.dataset.price || "0");

          const id = (category + "|" + brand + "|" + name).toLowerCase();

          window.CigarOSCart?.add({
            id,
            type,
            category,  // <- bold title line in invoice
            brand,
            name,
            price,
            img: "",
            link: "",
            sub: ""
          });

          // OPTIONAL: if you want it to open right after adding:
          // window.CigarOSCart?.openInvoice();
        });
      });
    });
  </script>
</body>
</html>
