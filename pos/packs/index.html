<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Packs</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />

  <style>
    /* Ensure the icon area displays the resolved image nicely */
    .category-card-icon{
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .category-card-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
  </style>
</head>
<body class="category-page">
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Packs</h1>

    <section class="category-search">
      <input type="search" class="category-search-input" placeholder="Search" />
    </section>

    <section class="category-grid">
      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Packs"
        data-brand="Arturo Fuente"
        data-name="Shark Pack"
        data-img-key="sharkpack"
        data-price="71.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Shark Pack</div>
        <div class="category-card-price">$71.00</div>
      </article>

      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Packs"
        data-brand="Padron"
        data-name="Padron Sample Pack"
        data-img-key="padronsamplepack"
        data-price="89.00">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Padron Sample Pack</div>
        <div class="category-card-price">$89.00</div>
      </article>

      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Packs"
        data-brand="Perdomo"
        data-name="Perdomo Fresh Pack Champagne"
        data-img-key="perdomofreshpackchampagne"
        data-price="34.99">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Perdomo Fresh Pack Champagne</div>
        <div class="category-card-price">$34.99</div>
      </article>

      <article class="category-card" data-receipt-item
        data-type="product"
        data-category="Packs"
        data-brand="Perdomo"
        data-name="Perdomo Fresh Pack Maduro"
        data-img-key="perdomofreshpackmaduro"
        data-price="34.99">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Perdomo Fresh Pack Maduro</div>
        <div class="category-card-price">$34.99</div>
      </article>
    </section>
  </main>

  <!-- ONE shared cart controller for all POS pages -->
  <script src="/pos/cart.js" defer></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const IMAGE_DIR = "/img/packs";

      const backBtn = document.getElementById("category-back");
      if (backBtn) backBtn.addEventListener("click", () => (window.location.href = "/pos/"));

      // ---------------------------------------
      // Image resolver: img-key → name fallback
      // Ext order: .svg → .png → .jpg
      // ---------------------------------------
      const existsCache = new Map();

      function normalizeKey(str) {
        return String(str || "")
          .toLowerCase()
          .replace(/[\s-]+/g, "")
          .replace(/[^a-z0-9]/g, "");
      }

      async function urlExists(url) {
        if (existsCache.has(url)) return existsCache.get(url);

        let ok = false;

        try {
          const res = await fetch(url, { method: "HEAD", cache: "no-store" });
          ok = res.ok;
        } catch (_) {
          ok = false;
        }

        if (!ok) {
          try {
            const res = await fetch(url, { method: "GET", cache: "no-store" });
            ok = res.ok;
          } catch (_) {
            ok = false;
          }
        }

        existsCache.set(url, ok);
        return ok;
      }

      async function resolveByKey(key, baseDir) {
        const exts = ["svg", "png", "jpg"];
        for (const ext of exts) {
          const url = `${baseDir}/${key}.${ext}`;
          if (await urlExists(url)) return url;
        }
        return "";
      }

      async function resolveProductImage(card) {
        // Optional manual override:
        // data-img="/img/packs/perdomofreshpackmaduro.png"
        const manual = card.dataset.img || "";
        if (manual) return manual;

        // 1) data-img-key (preferred)
        const keyRaw = card.dataset.imgKey || "";
        const key = normalizeKey(keyRaw);
        if (key) {
          const hit = await resolveByKey(key, IMAGE_DIR);
          if (hit) return hit;
        }

        // 2) fallback: normalized product name
        const name = card.dataset.name || "";
        const nameKey = normalizeKey(name);
        if (nameKey) return await resolveByKey(nameKey, IMAGE_DIR);

        return "";
      }

      async function applyCardIcons() {
        const cards = Array.from(document.querySelectorAll("[data-receipt-item]"));

        await Promise.all(cards.map(async (card) => {
          const iconBox = card.querySelector(".category-card-icon");
          if (!iconBox) return;

          const src = await resolveProductImage(card);

          iconBox.innerHTML = "";
          if (!src) return;

          const img = document.createElement("img");
          img.alt = card.dataset.name || "Product";
          img.loading = "lazy";
          img.decoding = "async";
          img.src = src;
          iconBox.appendChild(img);
        }));
      }

      applyCardIcons();

      // Click product => add item (invoice does NOT auto-open)
      document.querySelectorAll("[data-receipt-item]").forEach((card) => {
        card.addEventListener("click", () => {
          const type = (card.dataset.type || "product").toLowerCase();
          const category = card.dataset.category || "Product";
          const brand = card.dataset.brand || "";
          const name = card.dataset.name || "Item";
          const price = Number(card.dataset.price || "0");

          const id = (category + "|" + brand + "|" + name).toLowerCase();

          window.CigarOSCart?.add({
            id,
            type,
            category,
            brand,
            name,
            price,
            img: "",
            link: "",
            sub: ""
          });

          // OPTIONAL: open right after adding
          // window.CigarOSCart?.openInvoice();
        });
      });
    });
  </script>
</body>
</html>
