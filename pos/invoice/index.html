<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Invoice</title>

  <link rel="stylesheet" href="/css/type.css?v=18" />
  <link rel="stylesheet" href="/pos/pos.css?v=18" />
  <link rel="stylesheet" href="/pos/invoice/invoice.css?v=18" />
</head>

<body class="inv-page">
  <main class="inv-wrap" role="main">
    <header class="inv-head">
      <div class="inv-title">INVOICE</div>
      <div class="inv-meta" id="invMeta">—</div>
      <div class="inv-shop" id="invShop">Smoke Cigar Lounge</div>
      <div class="inv-num" id="invNum">INV #—</div>
    </header>

    <section class="inv-customer-wrap" aria-label="Customer selector">
      <button
        class="inv-customer"
        id="invCustomerBtn"
        type="button"
        aria-expanded="false"
        aria-controls="invCustomerMenu"
      >
        <span class="inv-customer-label" id="invCustomerLabel">Link order to: Select Profile</span>
      </button>

      <div class="inv-customer-menu" id="invCustomerMenu" hidden>
        <div class="inv-customer-search-wrap">
          <input
            id="invCustomerSearch"
            class="inv-customer-search"
            type="search"
            placeholder="Search customers"
            autocomplete="off"
          />
        </div>
        <div class="inv-customer-list" id="invCustomerList"></div>
      </div>
    </section>

    <section class="inv-items" id="invItems" aria-label="Invoice items"></section>

    <section class="inv-summary-area" aria-label="Invoice summary">
      <section class="inv-totals" aria-label="Totals">
        <div class="trow"><div>Tobacco:</div><div id="tTobacco">$0.00</div></div>
        <div class="trow"><div>Alcohol:</div><div id="tAlcohol">$0.00</div></div>
        <div class="trow"><div>Other:</div><div id="tOther">$0.00</div></div>
        <div class="trow"><div>Subtotal:</div><div id="tSubtotal">$0.00</div></div>
        <div class="trow"><div>Tax:</div><div id="tTax">$0.00</div></div>

        <div class="grand">
          <div>Total:</div>
          <div id="tGrand">$0.00</div>
        </div>
      </section>
    </section>
  </main>

  <footer class="inv-actions">
    <button class="inv-action" id="keepTabOpenBtn" type="button">KEEP TAB OPEN</button>
    <button class="inv-action inv-action--primary" id="cashOutBtn" type="button">CASH OUT</button>
    <button class="inv-action" id="saveToProfileBtn" type="button">SAVE TO PROFILE</button>
    <button class="inv-action" id="splitBillBtn" type="button">SPLIT BILL</button>
  </footer>

  <script src="/pos/cart.js?v=18" defer></script>
  <script src="/pos/invoice/invoice.js?v=18" defer></script>
</body>
</html>
