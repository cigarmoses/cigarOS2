<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask Tony – Full Working Demo</title>

<!-- ================== -->
<!--       CSS          -->
<!-- ================== -->

<style>

/* Global fonts */
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI", sans-serif;
  background: #111;
  color: #fff;
}

/* ===== ASK TONY SYSTEM ===== */

.ask-tony-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .18s ease-out, visibility .18s ease-out;
}

.ask-tony-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.ask-tony-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(4px);
}

/* modal */
.ask-tony-modal {
  position: relative;
  max-width: 580px;
  width: 92vw;
  max-height: 78vh;
  padding: 18px;
  border-radius: 28px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow:
    0 18px 40px rgba(0,0,0,.65),
    0 0 0 1px rgba(0,0,0,.55);
}

/* auto dark / light */
@media (prefers-color-scheme: dark) {
  .ask-tony-modal { background: #151518; color: #f7f7f9; }
  .ask-tony-messages { background: #111117; }
  .ask-tony-input { background: #111117; color: #f7f7f9; border-color: #2c2d32; }
  .ask-tony-chip { background: #23242a; border-color: #2f3138; color: #f7f7f9; }
  .ask-tony-chip:hover { background: #2f3138; }
  .ask-tony-msg-bubble-tony { background: #2f3138; color: #f7f7f9; }
}

@media (prefers-color-scheme: light) {
  .ask-tony-modal { background: #f4f4f8; color: #111; }
  .ask-tony-messages { background: #fff; }
  .ask-tony-input { background: #fff; color: #111; border-color: #ccc; }
  .ask-tony-chip { background: #eee; border-color: #ccc; color: #111; }
  .ask-tony-chip:hover { background: #ddd; }
  .ask-tony-msg-bubble-tony { background: #e5e5ea; color: #000; }
}

/* close btn */
.ask-tony-close {
  position: absolute;
  top: 12px;
  right: 14px;
  background: transparent;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: inherit;
}

/* header */
.ask-tony-header {
  text-align: center;
  padding-top: 8px;
}

.ask-tony-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.ask-tony-avatar img {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  margin-bottom: 8px;
}

.ask-tony-subtitle {
  margin: 0;
  font-size: 14px;
  opacity: .85;
  margin-bottom: 10px;
}

/* suggestion chips */
.ask-tony-suggestions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.ask-tony-chip {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid;
  cursor: pointer;
  font-size: 13px;
}

.ask-tony-suggestions.is-hidden { display: none; }

/* messages */
.ask-tony-messages {
  flex: 1;
  padding: 10px;
  border-radius: 16px;
  overflow-y: auto;
  margin-bottom: 12px;
}

/* bubbles container */
.ask-tony-msg-row {
  display: flex;
  margin-bottom: 8px;
}

.ask-tony-msg-user { justify-content: flex-end; }
.ask-tony-msg-tony { justify-content: flex-start; }

.ask-tony-msg-bubble {
  max-width: 80%;
  padding: 8px 11px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.35;
}

/* iMessage bubble colors */
.ask-tony-msg-bubble-user {
  background: #0b84ff;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.ask-tony-msg-bubble-tony {
  border-bottom-left-radius: 4px;
}

/* input row */
.ask-tony-input-row {
  display: flex;
  gap: 8px;
}

.ask-tony-input {
  flex: 1;
  border: 1px solid;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 15px;
}

.ask-tony-send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 15px;
}

/* launcher button */
.ask-tony-launch-btn {
  position: fixed;
  left: 14px;
  bottom: 18px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: none;
  background: #111;
  box-shadow: 0 8px 18px rgba(0,0,0,.5);
  cursor: pointer;
  z-index: 9998;
}

.ask-tony-launch-btn img {
  width: 40px;
  height: 40px;
}

</style>
</head>

<body>

<h1 style="padding:20px; text-align:center;">Your Page Content Here</h1>

<!-- ========================= -->
<!--     ASK TONY OVERLAY      -->
<!-- ========================= -->

<div id="ask-tony-overlay" class="ask-tony-overlay ask-tony-hidden">
  <div class="ask-tony-backdrop"></div>

  <div class="ask-tony-modal">
    <button class="ask-tony-close">✕</button>

    <div class="ask-tony-header">
      <h2 class="ask-tony-title">Ask Tony…</h2>
      <div class="ask-tony-avatar">
        <img src="img/icons/tony-icon.svg" alt="Tony">
      </div>
      <p class="ask-tony-subtitle">He knows cigars. And he knows a guy.</p>
    </div>

    <!-- Suggestions -->
    <div id="ask-tony-suggestions" class="ask-tony-suggestions">
      <button class="ask-tony-chip" data-question="What does vitola mean?">What does vitola mean?</button>
      <button class="ask-tony-chip" data-question="What are some good Connecticut gordos?">What are some good Connecticut gordos?</button>
      <button class="ask-tony-chip" data-question="Top 25 cigars last year?">Top 25 cigars last year?</button>
    </div>

    <!-- Messages -->
    <div id="ask-tony-messages" class="ask-tony-messages"></div>

    <!-- Input -->
    <form id="ask-tony-form" class="ask-tony-input-row">
      <input id="ask-tony-input" type="text" class="ask-tony-input" placeholder="Ask Tony…" />
      <button id="ask-tony-send" type="submit" class="ask-tony-send-btn">▶</button>
    </form>
  </div>
</div>

<!-- Launcher -->
<button id="ask-tony-launch" class="ask-tony-launch-btn">
  <img src="img/icons/tony-icon.svg" alt="Ask Tony" />
</button>

<!-- ================== -->
<!--       JS           -->
<!-- ================== -->

<script>
(function() {
  const overlay = document.getElementById("ask-tony-overlay");
  const launchBtn = document.getElementById("ask-tony-launch");
  const closeBtn = document.querySelector(".ask-tony-close");
  const form = document.getElementById("ask-tony-form");
  const input = document.getElementById("ask-tony-input");
  const messagesEl = document.getElementById("ask-tony-messages");
  const suggestions = document.getElementById("ask-tony-suggestions");

  let hasAnsweredOnce = false;

  /* Open / close */
  launchBtn.onclick = () => {
    overlay.classList.remove("ask-tony-hidden");
    suggestions.classList.remove("is-hidden");
    hasAnsweredOnce = false;
    input.focus();
  };

  closeBtn.onclick = () => overlay.classList.add("ask-tony-hidden");

  overlay.onclick = (e) => {
    if (e.target === overlay || e.target.classList.contains("ask-tony-backdrop")) {
      overlay.classList.add("ask-tony-hidden");
    }
  };

  /* Hide suggestions once a question is asked */
  function hideSuggestions() {
    if (!hasAnsweredOnce) {
      suggestions.classList.add("is-hidden");
      hasAnsweredOnce = true;
    }
  }

  /* Add message bubble */
  function addMessage(role, text) {
    const row = document.createElement("div");
    row.classList.add("ask-tony-msg-row");
    row.classList.add(role === "user" ? "ask-tony-msg-user" : "ask-tony-msg-tony");

    const bubble = document.createElement("div");
    bubble.classList.add("ask-tony-msg-bubble");
    bubble.classList.add(role === "user" ? "ask-tony-msg-bubble-user" : "ask-tony-msg-bubble-tony");
    bubble.textContent = text;

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  /* Fake Tony logic */
  async function getTonyReply(question) {
    return "Good question. Here’s how I look at it: give me the brand, line, and vitola and I’ll narrow it down for you. I got you.";
  }

  async function submitQuestion(text) {
    addMessage("user", text);
    hideSuggestions();

    const reply = await getTonyReply(text);
    addMessage("assistant", reply);

    input.value = "";
    input.focus();
  }

  /* Suggestions click */
  document.querySelectorAll(".ask-tony-chip").forEach(chip => {
    chip.onclick = () => submitQuestion(chip.dataset.question);
  });

  /* Form */
  form.onsubmit = (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) submitQuestion(q);
  };

})();
</script>

</body>
</html>
