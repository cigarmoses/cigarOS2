<!-- /pos/accessories/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Accessories</title>

  <!-- Your global POS styles (keep these if you already have them) -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <!-- If you have a category page CSS, use it; otherwise it will still render fine -->
  <link rel="stylesheet" href="/pos/category.css" />

  <style>
    /* Minimal safe styling so it never shows raw text */
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background:#fff;
      color:#0b1220;
    }

    /* Header row: back button left, invoice pill injected top-right */
    .page-header{
      position:relative;
      padding:14px 14px 0;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      min-height:58px;
    }
    .icon-btn{
      width:44px;height:44px;
      display:grid;place-items:center;
      border:none;background:transparent;
      color:#0b5cff;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
    }
    .icon-btn svg{ width:26px;height:26px; }

    .page-main{
      padding:0 14px 120px;
    }

    .page-title{
      margin:6px 0 14px;
      font-size:64px;
      line-height:.92;
      letter-spacing:-.02em;
      font-weight:900;
      color:#0f1a2c;
    }

    .search{
      width:100%;
      height:58px;
      border-radius:999px;
      border:none;
      outline:none;
      padding:0 22px;
      font-size:22px;
      font-weight:700;
      background:#f2f4f7;
      color:#0f1a2c;
      margin-bottom:16px;
    }

    /* Simple grid for products */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:16px;
    }

    .card{
      background:#fff;
      border-radius:22px;
      padding:14px;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
      border:1px solid rgba(0,0,0,.06);
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:190px;
    }

    .card img{
      width:100%;
      height:120px;
      object-fit:contain;
      border-radius:16px;
      background:#f5f6f8;
    }

    .name{
      font-weight:900;
      font-size:20px;
      line-height:1.05;
      word-break:break-word;
    }

    .price-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:auto;
    }

    .price{
      font-weight:900;
      font-size:20px;
      color:#667085;
      white-space:nowrap;
    }

    /* Green + button */
    .pos-add{
      width:40px;height:40px;
      border-radius:999px;
      border:none;
      background:#34c759;
      color:#fff;
      font-weight:900;
      font-size:22px;
      line-height:1;
      display:grid;
      place-items:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .pos-add:active{ transform:scale(.98); }

    @media (min-width: 900px){
      .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .page-title{ font-size:72px; }
    }
  </style>
</head>

<body>
  <!-- TOP BAR (back left) + invoice pill will inject to top-right because of .page-header -->
  <header class="page-header">
    <button class="icon-btn" type="button" onclick="history.back()" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="page-main">
    <h1 class="page-title">Accessories</h1>

    <input id="search" class="search" type="search" placeholder="Search" />

    <section class="grid" id="grid">
      <!-- accessories.js will render cards here -->
    </section>
  </main>

  <!-- IMPORTANT: cart.js must load on every POS page -->
  <script src="/pos/cart.js?v=999" defer></script>

  <!-- Your Accessories page controller -->
  <script src="/pos/accessories/accessories.js?v=999" defer></script>
</body>
</html>
