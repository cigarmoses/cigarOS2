<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FOOD &amp; BEVS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css" />
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 90px;
    }
    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .pos-star {
      font-size: 22px;
      color: #ffcc00;
    }
    .pos-header-spacer {
      height: 16px;
    }
    .pos-title {
      text-align: center;
      font-weight: 700;
      font-size: 28px;
      margin: 0;
    }

    /* 4-across icon grid, no captions */
    .bev-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 32px; /* extra space you asked for */
    }
    .bev-tile {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bev-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
    }
    .bev-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">FOOD &amp; BEVS</h1>

    <div id="bevGrid" class="bev-grid"></div>
  </div>

  <script>
    // SVGs from /img/icons/foodandbevs/
    const FOOD_BEVS = [
      { name: "7up",                    file: "7up.svg" },
      { name: "cocacola",               file: "cocacola.svg" },
      { name: "cokezero",               file: "cokezero.svg" },
      { name: "dietcoke",               file: "dietcoke.svg" },
      { name: "dietdrpepper",           file: "dietdrpepper.svg" },
      { name: "drpepper",               file: "drpepper.svg" },
      { name: "dunkin",                 file: "dunkin.svg" },
      { name: "gatorade",               file: "gatorade.svg" },
      { name: "gingerale",              file: "gingerale.svg" },
      { name: "gpsweettea",             file: "gpsweettea.svg" },
      { name: "gpunsweetenedtea",       file: "gpunsweetenedtea.svg" },
      { name: "gpzerosugarsweettea",    file: "gpzerosugarsweettea.svg" },
      { name: "monstertea",             file: "monstertea.svg" },
      { name: "mountaindew",            file: "mountaindew.svg" },
      { name: "pepsi",                  file: "pepsi.svg" },
      { name: "redbull",                file: "redbull.svg" },
      { name: "rootbeer",               file: "rootbeer.svg" },
      { name: "sprite",                 file: "sprite.svg" },
      { name: "starbucks",              file: "starbucks.svg" },
      { name: "water",                  file: "water.svg" },
    ];

    const grid = document.getElementById('bevGrid');

    FOOD_BEVS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'bev-tile';
      div.innerHTML = `
        <div class="bev-icon">
          <img src="/img/icons/foodandbevs/${item.file}" alt="${item.name}">
        </div>
      `;
      grid.appendChild(div);
    });
  </script>

  <!-- Red receipt pill -->
  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt" />
  </div>

  <!-- Invoice Popup -->
  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>

      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>

        <!-- CART ITEMS GO HERE -->
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="invoice-subtotal">$0.00</span>
        </div>
        <div class="total-row">
          <span>Tax</span>
          <span id="invoice-tax">$0.00</span>
        </div>
        <div class="total-row total-bold">
          <span>TOTAL</span>
          <span id="invoice-total">$0.00</span>
        </div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
