<!-- /pos/foodandbevs/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Food &amp; Bevs</title>

  <!-- Global POS styles -->
  <link rel="stylesheet" href="/pos/pos.css" />

  <!-- Category grid base styles (shared) -->
  <link rel="stylesheet" href="/pos/category.css" />

  <!-- Page-specific overrides -->
  <link rel="stylesheet" href="/pos/foodandbevs.css" />

  <!-- Invoice / cart modal styles -->
  <link rel="stylesheet" href="/pos/invoice.css" />
</head>

<body class="page">
  <!-- Top bar -->
  <header class="page-header">
    <a class="back" href="/pos/" aria-label="Back">
      ←
    </a>
    <h1 class="page-title">Food &amp; Bevs</h1>
  </header>

  <!-- Search (if you already have a wired search, keep it; otherwise it’s just UI) -->
  <div class="page-search">
    <input id="search" type="search" placeholder="Search" autocomplete="off" />
  </div>

  <!-- Grid -->
  <main class="page-content">
    <!-- IMPORTANT: foodandbevs.js requires #grid -->
    <div id="grid" class="category-grid category-grid-foodbevs" aria-label="Food &amp; Bevs products"></div>
  </main>

  <!-- OPTIONAL legacy bottom sheet UI (safe to keep even if not used)
       If these IDs exist, earlier versions may open it.
       If you don’t want the sheet at all, you can delete this entire block.
  -->
  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet__panel">
      <button class="sheet__close" type="button" data-close-sheet aria-label="Close">✕</button>

      <div class="sheet__title" id="sheetTitle">Item</div>
      <div class="sheet__price" id="sheetPrice">$0.00</div>

      <div class="sheet__qty">
        <button id="btnMinus" type="button" class="qty-btn" aria-label="Decrease">−</button>
        <div id="qtyVal" class="qty-val">1</div>
        <button id="btnPlus" type="button" class="qty-btn" aria-label="Increase">+</button>
      </div>

      <div id="sheetSubtotal" class="sheet__subtotal">$0.00 subtotal</div>

      <button id="btnAddToBill" type="button" class="sheet__add">
        Add to Bill
      </button>
    </div>
    <div class="sheet__backdrop" data-close-sheet></div>
  </section>

  <!-- OPTIONAL legacy cart pill (safe if present; cart.js has its own FAB anyway) -->
  <div id="cartPill" class="cart-pill" hidden>
    <span id="cartCount">0</span>
    <span id="cartTotal">$0.00</span>
  </div>

  <!-- SCRIPTS (order matters)
       1) cart.js injects the invoice FAB + modal and attaches listeners
       2) foodandbevs.js renders tiles and triggers add-to-invoice
       NOTE: absolute /pos/... paths avoid folder-route issues.
  -->
  <script src="/pos/cart.js?v=10" defer></script>
  <script src="/pos/foodandbevs.js?v=10" defer></script>
</body>
</html>
