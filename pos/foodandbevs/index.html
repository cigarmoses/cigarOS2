<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Food & Bevs</title>

  <!-- Global SF Pro + POS base styles -->
  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <!-- Category layout styles -->
  <link rel="stylesheet" href="/pos/category.css" />
</head>
<body class="category-page">

  <!-- Top bar -->
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Food &amp; Bevs</h1>

    <section class="category-search">
      <input
        type="search"
        class="category-search-input"
        placeholder="Search"
      />
    </section>

    <section class="category-grid">
      <!-- Example items — replace with your real products -->
      <article class="category-card" data-receipt-item
        data-brand="Coca-Cola" data-name="Coca-Cola" data-price="1.50">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Coca-Cola</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card" data-receipt-item
        data-brand="Pepsi" data-name="Pepsi" data-price="1.50">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Pepsi</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card" data-receipt-item
        data-brand="Monster" data-name="Monster Energy" data-price="3.99">
        <div class="category-card-icon"></div>
        <div class="category-card-name">Monster Energy</div>
        <div class="category-card-price">$3.99</div>
      </article>

      <!-- Add as many as you want; layout will wrap automatically -->
    </section>
  </main>

  <!-- Floating receipt icon -->
  <div class="pos-receipt-fab" id="posReceiptFab">
    <img src="/pos/assets/receipt-icon.png" alt="Receipt" />
    <div class="pos-receipt-badge" id="posReceiptBadge">0</div>
  </div>

  <!-- Shared category JS (back button + receipt icon + localStorage cart) -->
  <script>
    (function () {
      const STORAGE_KEY = "posReceiptItems";

      function loadItems() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function saveItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function getCount(items) {
        return items.reduce((sum, item) => sum + (item.qty || 0), 0);
      }

      function updateReceiptBadge() {
        const badge = document.getElementById("posReceiptBadge");
        if (!badge) return;
        const items = loadItems();
        const count = getCount(items);
        if (count === 0) {
          badge.style.display = "none";
        } else {
          badge.textContent = String(count);
          badge.style.display = "flex";
        }
      }

      document.querySelectorAll("[data-receipt-item]").forEach((card) => {
        card.addEventListener("click", () => {
          const name = card.dataset.name || "Item";
          const price = Number(card.dataset.price || "0");
          const brand = card.dataset.brand || "";
          const vitola = card.dataset.vitola || "";

          const items = loadItems();
          const key = brand + "|" + name + "|" + vitola;
          const existing = items.find((i) => i.key === key);

          if (existing) {
            existing.qty += 1;
            existing.lineTotal = Number((existing.qty * existing.price).toFixed(2));
          } else {
            items.push({
              key,
              brand,
              name,
              vitola,
              price,
              qty: 1,
              lineTotal: Number(price.toFixed(2)),
            });
          }

          saveItems(items);
          updateReceiptBadge();
        });
      });

      const backBtn = document.getElementById("category-back");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          window.location.href = "/pos/";
        });
      }

      const fab = document.getElementById("posReceiptFab");
      if (fab) {
        fab.addEventListener("click", () => {
          window.location.href = "/pos/receipt.html";
        });
      }

      updateReceiptBadge();
    })();
  </script>
</body>
</html>
