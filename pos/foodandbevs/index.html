<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FOOD &amp; BEVS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    /* same layout as cigars: 4-across icons, no captions, no search */
    .bev-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 12px;
    }
    .bev-tile {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bev-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      /* your other pages have rounded colored icons, so no extra border */
    }
    .bev-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <!-- top bar just like cigars -->
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">FOOD &amp; BEVS</h1>

    <!-- no search bar here -->

    <!-- icons -->
    <div id="bevGrid" class="bev-grid"></div>
  </div>

  <!-- universal bill tab -->
  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    // all SVGs live in /img/icons/foodandbevs/
    // change the filenames below if your repo uses a slightly different naming
    const FOOD_BEVS = [
      { name: "7up",               file: "7up.svg" },
      { name: "cocacola",          file: "cocacola.svg" },
      { name: "cokezero",     file: "cokezero.svg" },
      { name: "dietcoke",          file: "dietcoke.svg" },
      { name: "dietdrpepper",     file: "dietdrpepper.svg" },
      { name: "drpepper",          file: "drpepper.svg" },
      { name: "dunkin",            file: "dunkin.svg" },
      { name: "gatorade",          file: "gatorade.svg" },
      { name: "gingerale",         file: "gingerale.svg" },
      { name: "gpsweettea",    file: "gpsweettea.svg" },
      { name: "gpunsweetened",  file: "gpunsweetened.svg" },
      { name: "gpzerosugar",    file: "gpzerosugar.svg" },
      { name: "monstertea",      file: "monstertea.svg" },
      { name: "mountaindew",       file: "mountaindew.svg" },
      { name: "pepsi",             file: "pepsi.svg" },
      { name: "redbull",           file: "redbull.svg" },
      { name: "rootbeer",       file: "rootbeer.svg" },
      { name: "sprite",            file: "sprite.svg" },
      { name: "starbucks",         file: "starbucks.svg" },
      { name: "water",             file: "water.svg" },
    ];

    const grid = document.getElementById('bevGrid');

    FOOD_BEVS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'bev-tile';
      div.innerHTML = `
        <div class="bev-icon">
          <img src="/img/icons/foodandbevs/${item.file}" alt="${item.name}">
        </div>
      `;
      grid.appendChild(div);
    });

    // bill tab can later read real cart values
    // document.getElementById('billCount').textContent = cart.count;
    // document.getElementById('billTotal').textContent = '$' + cart.total.toFixed(2);
  </script>
</body>
</html>
