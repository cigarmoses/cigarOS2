  <!-- Floating receipt icon -->
  <div class="pos-receipt-fab" id="posReceiptFab">
    <img src="/pos/assets/receipt-icon.png" alt="Receipt" />
    <div class="pos-receipt-badge" id="posReceiptBadge">0</div>
  </div>

  <!-- Shared script -->
  <script>
    (function () {
      const STORAGE_KEY = "posReceiptItems";

      function loadItems() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch { return []; }
      }

      function saveItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function getCount(items) {
        return items.reduce((sum, item) => sum + (item.qty || 0), 0);
      }

      function updateReceiptBadge() {
        const badge = document.getElementById("posReceiptBadge");
        if (!badge) return;
        const count = getCount(loadItems());
        badge.style.display = count > 0 ? "flex" : "none";
        if (count > 0) badge.textContent = count;
      }

      document.querySelectorAll("[data-receipt-item]").forEach((card) => {
        card.addEventListener("click", () => {
          const name = card.dataset.name;
          const price = Number(card.dataset.price);
          const brand = card.dataset.brand;
          const vitola = card.dataset.vitola || "";

          const items = loadItems();
          const key = `${brand}|${name}|${vitola}`;
          const existing = items.find((i) => i.key === key);

          if (existing) {
            existing.qty++;
            existing.lineTotal = existing.qty * existing.price;
          } else {
            items.push({
              key, brand, name, vitola,
              price, qty: 1,
              lineTotal: price
            });
          }

          saveItems(items);
          updateReceiptBadge();
        });
      });

      document.getElementById("category-back")
        ?.addEventListener("click", () => (window.location.href = "/pos/"));

      document.getElementById("posReceiptFab")
        ?.addEventListener("click", () => (window.location.href = "/pos/receipt.html"));

      updateReceiptBadge();
    })();
  </script>

</body>
</html>
