<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Food & Beverages</title>

  <!-- shared category styles (4-per-row, no white boxes, centered small text) -->
  <link rel="stylesheet" href="../category.css">
  <!-- page-specific behaviors and (optional) overrides -->
  <link rel="stylesheet" href="./foodandbevs.css">
</head>
<body>
  <div class="page hide-captions"><!-- hide-captions = icon-only grid -->
    <header>
      <h1 class="title">FOOD &amp; BEVERAGES</h1>
    </header>

    <!-- The grid is populated by /pos/foodandbevs/foodandbevs.js using img/icons/foodandbevs/*.svg -->
    <main id="grid" class="grid"></main>
  </div>

  <!-- existing shared cart/modal should continue to work; do not change sources -->
  <script src="./foodandbevs.js"></script>
  <script>
    // minimal bootstrap if your JS expects a mount
    if (typeof renderFoodAndBevs === 'function') {
      renderFoodAndBevs(document.getElementById('grid'));
    }
  </script>
</body>
</html>
