<!-- /pos/foodandbevs/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Food &amp; Bevs</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />
  <link rel="stylesheet" href="/pos/foodandbevs.css" />

  <style>
    .page-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .page-header-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .page-title{ margin:0; }
    .invoice-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff;
      font-weight:900;
      font-size:16px;
      line-height:1;
      -webkit-tap-highlight-color:transparent;
    }
    .invoice-badge{
      min-width:26px;
      height:26px;
      padding:0 8px;
      border-radius:999px;
      background:#ff3b30;
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:14px;
    }
  </style>
</head>

<body class="page">
  <header class="page-header">
    <div class="page-header-left">
      <a class="back" href="/pos/" aria-label="Back">←</a>
      <h1 class="page-title">Food &amp; Bevs</h1>
    </div>

    <!-- ✅ Top-right invoice -->
    <button id="invoiceBtn" class="invoice-btn" type="button" aria-label="Invoice">
      Invoice
      <span id="invoiceBadge" class="invoice-badge" hidden>0</span>
    </button>
  </header>

  <div class="page-search">
    <input id="search" type="search" placeholder="Search" autocomplete="off" />
  </div>

  <main class="page-content">
    <div id="grid" class="category-grid category-grid-foodbevs" aria-label="Food &amp; Bevs products"></div>
  </main>

  <!-- ✅ cart.js handles cart + badge + routing -->
  <script src="/pos/cart.js?v=12" defer></script>
  <script src="/pos/foodandbevs.js?v=12" defer></script>
</body>
</html>
