<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Food &amp; Bevs</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />
</head>
<body class="category-page">

  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Food &amp; Bevs</h1>

    <section class="category-search">
      <input type="search" class="category-search-input" placeholder="Search" />
    </section>

    <section class="category-grid">

      <!-- Each card uses data-invoice-product so /pos/cart.js can show:
           click -> confirm popup -> Add to invoice -> badge turns red -> invoice popup shows item
      -->

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="7up"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/7up.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/7up.svg" alt="7up" />
        </div>
        <div class="category-card-name">7up</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Coca-Cola"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/cocacola.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/cocacola.svg" alt="Coca-Cola" />
        </div>
        <div class="category-card-name">Coca-Cola</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Coke Zero"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/cokezero.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/cokezero.svg" alt="Coke Zero" />
        </div>
        <div class="category-card-name">Coke Zero</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Diet Coke"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/dietcoke.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/dietcoke.svg" alt="Diet Coke" />
        </div>
        <div class="category-card-name">Diet Coke</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Dr Pepper"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/drpepper.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/drpepper.svg" alt="Dr Pepper" />
        </div>
        <div class="category-card-name">Dr Pepper</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Diet Dr Pepper"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/dietdrpepper.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/dietdrpepper.svg" alt="Diet Dr Pepper" />
        </div>
        <div class="category-card-name">Diet Dr Pepper</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Dunkin Iced Coffee"
        data-price="3.99"
        data-img="/img/icons/foodandbevs/dunkin.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/dunkin.svg" alt="Dunkin Iced Coffee" />
        </div>
        <div class="category-card-name">Dunkin Iced Coffee</div>
        <div class="category-card-price">$3.99</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Gatorade"
        data-price="2.99"
        data-img="/img/icons/foodandbevs/gatorade.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/gatorade.svg" alt="Gatorade" />
        </div>
        <div class="category-card-name">Gatorade</div>
        <div class="category-card-price">$2.99</div>
      </article>

      <article class="category-card"
        data-invoice-product
        data-category="Food & Bevs"
        data-name="Ginger Ale"
        data-price="1.50"
        data-img="/img/icons/foodandbevs/gingerale.svg">
        <div class="category-card-icon">
          <img src="/img/icons/foodandbevs/gingerale.svg" alt="Ginger Ale" />
        </div>
        <div class="category-card-name">Ginger Ale</div>
        <div class="category-card-price">$1.50</div>
      </article>

      <!-- keep adding your remaining cards the same way -->

    </section>
  </main>

  <script>
    // back button
    (function () {
      const backBtn = document.getElementById("category-back");
      if (backBtn) backBtn.addEventListener("click", () => (window.location.href = "/pos/"));
    })();
  </script>

  <!-- Single source of truth for invoice/cart UX -->
  <script src="/pos/cart.js"></script>
</body>
</html>
