<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FOOD &amp; BEVS • POS</title>
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 90px;
    }
    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .pos-star {
      font-size: 22px;
      color: #ffcc00;
    }
    .pos-header-spacer {
      height: 16px;
    }
    .pos-title {
      text-align: center;
      font-weight: 700;
      font-size: 28px;
      margin: 0;
    }

    /* 4-across icon grid, no captions */
    .bev-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 32px; /* extra space you asked for */
    }
    .bev-tile {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bev-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
    }
    .bev-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* bill tab */
    .pos-bill-tab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1a2c;
      color: #fff;
      border-radius: 50px;
      padding: 10px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 50;
    }
    .pos-bill-icon {
      font-size: 16px;
    }
    .pos-bill-badge {
      background: #e11;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .pos-bill-total {
      font-weight: 600;
    }

    /* bill modal */
    .bill-modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 9999;
    }
    .bill-modal.show {
      display: block;
    }
    .bill-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.35);
    }
    .bill-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 92vh;
      max-height: 760px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .bill-frame {
      width: 100%;
      max-width: 480px;
      height: 100%;
      border: none;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">FOOD &amp; BEVS</h1>

    <div id="bevGrid" class="bev-grid"></div>
  </div>

  <!-- bill tab -->
  <div class="pos-bill-tab" onclick="openBill()">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <!-- bill modal -->
  <div id="billModal" class="bill-modal">
    <div class="bill-backdrop" onclick="closeBill()"></div>
    <div class="bill-panel">
      <iframe src="/pos/receipt/" class="bill-frame" title="Invoice"></iframe>
    </div>
  </div>

  <script>
    // SVGs from /img/icons/foodandbevs/
    const FOOD_BEVS = [
      { name: "7up",               file: "7up.svg" },
      { name: "cocacola",          file: "cocacola.svg" },
      { name: "cokezero",     file: "cokezero.svg" },
      { name: "dietcoke",          file: "dietcoke.svg" },
      { name: "dietdrpepper",     file: "dietdrpepper.svg" },
      { name: "drpepper",          file: "drpepper.svg" },
      { name: "dunkin",            file: "dunkin.svg" },
      { name: "gatorade",          file: "gatorade.svg" },
      { name: "gingerale",         file: "gingerale.svg" },
      { name: "gpsweettea",    file: "gpsweettea.svg" },
      { name: "gpunsweetenedtea",  file: "gpunsweetenedtea.svg" },
      { name: "gpzerosugarsweettea",    file: "gpzerosugarsweettea.svg" },
      { name: "monsterrehab",      file: "monsterrehab.svg" },
      { name: "mountaindew",       file: "mountaindew.svg" },
      { name: "pepsi",             file: "pepsi.svg" },
      { name: "redbull",           file: "redbull.svg" },
      { name: "rootbeer",       file: "rootbeer.svg" },
      { name: "sprite",            file: "sprite.svg" },
      { name: "starbucks",         file: "starbucks.svg" },
      { name: "water",             file: "water.svg" },
    ];

    const grid = document.getElementById('bevGrid');

    FOOD_BEVS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'bev-tile';
      div.innerHTML = `
        <div class="bev-icon">
          <img src="/img/icons/foodandbevs/${item.file}" alt="${item.name}">
        </div>
      `;
      grid.appendChild(div);
    });

    function openBill() {
      document.getElementById('billModal').classList.add('show');
    }
    function closeBill() {
      document.getElementById('billModal').classList.remove('show');
    }
    // allow iframe to call parent.closeBill()
    window.closeBill = closeBill;
  </script>
</body>
</html>
