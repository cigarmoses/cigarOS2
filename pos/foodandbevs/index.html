<!-- /pos/foodandbevs/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>POS • Food &amp; Bevs</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />

  <style>
    /* Match Accessories behavior (contain images nicely) */
    .category-card-icon{
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .category-card-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
  </style>
</head>

<!-- IMPORTANT:
     data-category MUST match the JSON category.
     For Food & Bevs, this should be exactly "Food & Bevs"
-->
<body class="category-page" data-category="Food & Bevs">
  <header class="category-topbar">
    <button type="button" class="pos-back" id="category-back" aria-label="Back">
      <span class="pos-back-icon">←</span>
    </button>
  </header>

  <main>
    <h1 class="category-title">Food &amp; Bevs</h1>

    <section class="category-search">
      <input
        type="search"
        class="category-search-input"
        placeholder="Search"
        autocomplete="off"
      />
    </section>

    <!-- category-page.js renders cards into THIS -->
    <section class="category-grid" aria-label="Food &amp; Bevs products"></section>
  </main>

  <!-- cart.js injects the invoice FAB + modal -->
  <script src="/pos/cart.js" defer></script>

  <!-- universal category renderer from /pos/pos-products.json -->
  <script src="/pos/category-page.js" defer></script>
</body>
</html>
