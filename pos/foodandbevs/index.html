<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Food & Beverages • POS</title>
<style>
  :root{--bg:#eaf2f6;--ink:#0f1a2c;--muted:#6d7b8e;--accent:#ff3b30}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji"}
  .page{max-width:1100px;margin:0 auto}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(#eaf2f6,#eaf2f6cc 70%,#eaf2f600);padding:20px 18px 8px}
  header .row{display:flex;align-items:center;gap:12px}
  header .back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#dbe6ee;text-decoration:none;color:var(--ink);font-size:22px;font-weight:700}
  header .title{margin:0 auto;font-weight:900;font-size:28px;letter-spacing:.5px;text-align:center}
  main{padding:14px}

  /* 4-up grid; ICONS ONLY – no captions under icons */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px}
  .item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;background:transparent;border:none;padding:0}
  .thumb{width:90px;height:90px;border-radius:20px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}

  /* cart chip */
  .cart{position:fixed;right:16px;bottom:22px;z-index:20;background:#0c1a2a;color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(15,27,45,.35);text-decoration:none}
  .cart .bubble{min-width:28px;height:28px;border-radius:999px;background:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:800}
  .cart .total{font-weight:800;font-size:16px}

  /* bottom sheet */
  .sheet{position:fixed;left:0;right:0;bottom:-100%;z-index:30;background:#0c1322;color:#eaf2f6;border-top-left-radius:18px;border-top-right-radius:18px;padding:18px 16px 20px;transition:bottom .28s ease;box-shadow:0 -20px 50px rgba(0,0,0,.35)}
  .sheet.show{bottom:0}
  .sheet .title{font-size:22px;font-weight:800;margin:2px 0 8px}
  .price{color:#b8cbe0}
  .qty{display:flex;align-items:center;gap:12px;margin:18px 0}
  .qty button{width:54px;height:54px;border-radius:14px;border:1px solid #253249;background:#132035;color:#eaf2f6;font-size:28px;font-weight:900}
  .qty .n{width:72px;height:54px;border-radius:14px;border:1px solid #253249;background:#0f1b2d;display:grid;place-items:center;font-size:22px;font-weight:900}
  .subtotal{margin:14px 0 18px;color:#9fb3c8;font-weight:700}
  .bar{display:flex;gap:12px}
  .btn{flex:1;display:grid;place-items:center;height:56px;border-radius:16px;border:1px solid #223049;background:#111e33;color:#cfe2f7;font-weight:800;font-size:18px;text-decoration:none}
  .btn.primary{background:#ff3b30;border-color:#ff3b30;color:#fff}
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="row">
        <a class="back" href="/pos/">‹</a>
        <h1 class="title">FOOD &amp; BEVERAGES</h1>
      </div>
    </header>

    <main>
      <section id="grid" class="grid" aria-label="Food & Beverages"></section>
    </main>
  </div>

  <!-- cart chip -->
  <a class="cart" href="/pos/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="3" stroke="#9fb3c8" stroke-width="2"/>
      <rect x="7" y="7" width="10" height="2" fill="#9fb3c8"/>
      <rect x="7" y="11" width="10" height="2" fill="#9fb3c8"/>
      <rect x="7" y="15" width="6" height="2" fill="#9fb3c8"/>
    </svg>
    <span id="cartCount" class="bubble">0</span>
    <span id="cartTotal" class="total">$0.00</span>
  </a>

  <!-- bottom sheet -->
  <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="row">
      <div>
        <div id="sheetName" class="title">Item</div>
        <div id="sheetPrice" class="price">$0.00</div>
      </div>
    </div>
    <div class="qty">
      <button id="minus">−</button>
      <div id="qty" class="n">1</div>
      <button id="plus">+</button>
    </div>
    <div id="subtotal" class="subtotal">$0.00 subtotal</div>
    <div class="bar">
      <button id="cancel" class="btn">Cancel</button>
      <button id="add" class="btn primary">Add to Bill</button>
    </div>
  </aside>

  <script>
    // EXACT icon folder + slugs (all lowercase, no spaces/punctuation)
    const ICON_BASE = '/img/icons/foodandbevs';
    const ITEMS = [
      {name:'7 Up', price:1.50, slug:'7up'},
      {name:'Cocacola', price:1.50, slug:'cocacola'},
      {name:'Coke Zero', price:1.50, slug:'cokezero'},
      {name:'Diet Coke', price:1.50, slug:'dietcoke'},
      {name:'Diet Dr. Pepper', price:1.50, slug:'dietdrpepper'},
      {name:'Dr. Pepper', price:1.50, slug:'drpepper'},
      {name:'Dunkin', price:3.50, slug:'dunkin'},
      {name:'Gatorade', price:3.50, slug:'gatorade'},
      {name:'Ginger Ale', price:1.50, slug:'gingerale'},
      {name:'GP Sweet Tea', price:1.50, slug:'gpsweettea'},
      {name:'GP Unsweetened Tea', price:1.50, slug:'gpunsweetened'},
      {name:'GP Zero Sugar Sweet Tea', price:1.50, slug:'gpzerosugarsweettea'},
      {name:'Monster Tea', price:3.50, slug:'monstertea'},
      {name:'Mountain Dew', price:1.50, slug:'mountaindew'},
      {name:'Pepsi', price:1.50, slug:'pepsi'},
      {name:'Red Bull', price:3.50, slug:'redbull'},
      {name:'Root Beer', price:1.50, slug:'rootbeer'},
      {name:'Sprite', price:1.50, slug:'sprite'},
      {name:'Starbucks', price:3.50, slug:'starbucks'},
      {name:'Water', price:1.50, slug:'water'}
    ];

    // Render icons ONLY (no captions) for neat 4x rows
    const $grid=document.getElementById('grid');
    $grid.innerHTML = ITEMS.map((it,i)=>`
      <button class="item" data-i="${i}" aria-label="${it.name}">
        <div class="thumb">
          <img loading="lazy" src="${ICON_BASE}/${it.slug}.svg" alt="${it.name}">
        </div>
      </button>
    `).join('');

    // Cart helpers (shared key across POS)
    const CART_KEY='cigaros_cart_v1';
    const $count=document.getElementById('cartCount'),$total=document.getElementById('cartTotal');
    const read=()=>{try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch{return[]}};
    const write=v=>{localStorage.setItem(CART_KEY,JSON.stringify(v));recalc()};
    function recalc(){const c=read();const n=c.reduce((a,b)=>a+b.qty,0);const t=c.reduce((s,i)=>s+i.qty*i.price,0);$count.textContent=n;$total.textContent=`$${t.toFixed(2)}`} recalc();

    // Bottom sheet
    const $sheet=document.getElementById('sheet'),$name=document.getElementById('sheetName'),$price=document.getElementById('sheetPrice'),$qty=document.getElementById('qty'),$sub=document.getElementById('subtotal');
    let cur=null;
    function openSheet(item){cur={...item,qty:1};$name.textContent=item.name;$price.textContent=`$${item.price.toFixed(2)}`;$qty.textContent='1';$sub.textContent=`$${item.price.toFixed(2)} subtotal`;$sheet.classList.add('show');$sheet.setAttribute('aria-hidden','false')}
    function closeSheet(){$sheet.classList.remove('show');$sheet.setAttribute('aria-hidden','true');cur=null}
    document.getElementById('minus').onclick=()=>{if(!cur)return;cur.qty=Math.max(1,cur.qty-1);$qty.textContent=cur.qty;$sub.textContent=`$${(cur.qty*cur.price).toFixed(2)} subtotal`}
    document.getElementById('plus').onclick =()=>{if(!cur)return;cur.qty++;$qty.textContent=cur.qty;$sub.textContent=`$${(cur.qty*cur.price).toFixed(2)} subtotal`}
    document.getElementById('cancel').onclick=closeSheet;
    document.getElementById('add').onclick=()=>{if(!cur)return;const cart=read();const key=\`${cur.name}@${cur.price}\`;const hit=cart.find(i=>i.key===key);if(hit){hit.qty+=cur.qty}else{cart.push({key,name:cur.name,price:cur.price,qty:cur.qty,slug:cur.slug,cat:'foodandbevs'})}write(cart);closeSheet()};
    $grid.addEventListener('click',e=>{const b=e.target.closest('.item');if(!b)return;openSheet(ITEMS[+b.dataset.i])});
  </script>
</body>
</html>
