<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FOOD &amp; BEVS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css">
  <style>
    /* food/bevs uses same grid as cigars but no captions & no search */
    .bev-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 12px;
    }
    .bev-tile {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bev-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #d9d9d9;
      overflow: hidden;
    }
    .bev-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <!-- top bar -->
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">FOOD &amp; BEVS</h1>

    <!-- no search bar here -->

    <!-- icons only -->
    <div id="bevGrid" class="bev-grid"></div>
  </div>

  <!-- bill tab (universal) -->
  <div class="pos-bill-tab">
    <div class="pos-bill-icon">🧾</div>
    <div class="pos-bill-badge" id="billCount">1</div>
    <div class="pos-bill-total" id="billTotal">$1.50</div>
  </div>

  <script>
    // this matches what’s in your screenshot – update paths/names as you add more
    const BEVS = [
      { name: "7up",               file: "/img/icons/foodandbevs/7up.png" },
      { name: "Coca Cola",         file: "/img/icons/foodandbevs/cocacola.png" },
      { name: "Coke Zero",         file: "/img/icons/foodandbevs/cokezero.png" },
      { name: "Diet Coke",         file: "/img/icons/foodandbevs/dietcoke.png" },
      { name: "Dr Pepper Light",   file: "/img/icons/foodandbevs/drpepper-light.png" },
      { name: "Dr Pepper",         file: "/img/icons/foodandbevs/drpepper.png" },
      { name: "Dunkin",            file: "/img/icons/foodandbevs/dunkin.png" },
      { name: "Gatorade",          file: "/img/icons/foodandbevs/gatorade.png" },
      { name: "Canada Dry",        file: "/img/icons/foodandbevs/canadadry.png" },
      { name: "Gold Peak Sweet",   file: "/img/icons/foodandbevs/goldpeak-sweet.png" },
      { name: "Gold Peak Unsweet", file: "/img/icons/foodandbevs/goldpeak-unsweet.png" },
      { name: "Gold Peak Black",   file: "/img/icons/foodandbevs/goldpeak-black.png" },
      { name: "Monster Rehab",     file: "/img/icons/foodandbevs/monsterrehab.png" },
      { name: "Mountain Dew",      file: "/img/icons/foodandbevs/mountaindew.png" },
      { name: "Pepsi",             file: "/img/icons/foodandbevs/pepsi.png" },
      { name: "Red Bull",          file: "/img/icons/foodandbevs/redbull.png" },
      { name: "A&W",               file: "/img/icons/foodandbevs/aw.png" },
      { name: "Sprite",            file: "/img/icons/foodandbevs/sprite.png" },
      { name: "Starbucks",         file: "/img/icons/foodandbevs/starbucks.png" },
      { name: "Water",             file: "/img/icons/foodandbevs/water.png" },
    ];

    const grid = document.getElementById('bevGrid');

    BEVS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'bev-tile';
      div.innerHTML = `
        <div class="bev-icon">
          <img src="${item.file}" alt="${item.name}">
        </div>
      `;
      grid.appendChild(div);
    });
  </script>
</body>
</html>
