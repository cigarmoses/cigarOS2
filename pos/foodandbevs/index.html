<!-- /pos/foodandbevs/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Food &amp; Bevs</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/category.css" />
  <link rel="stylesheet" href="/pos/foodandbevs.css" />

  <style>
    /* Header Invoice button (top-right) */
    .invoice-btn{
      margin-left:auto;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      text-decoration:none;
      font-weight:900;
      color:#0b1220;
      background:rgba(255,255,255,.75);
      border:1px solid rgba(15,23,42,.08);
      -webkit-tap-highlight-color: transparent;
    }
    .invoice-badge{
      min-width:22px;
      height:22px;
      padding:0 7px;
      border-radius:999px;
      background:#ff3b30;
      color:#fff;
      font-weight:900;
      font-size:12px;
      display:grid;
      place-items:center;
      line-height:1;
    }
  </style>
</head>

<body class="page">
  <header class="page-header">
    <a class="back" href="/pos/" aria-label="Back">←</a>

    <h1 class="page-title">Food &amp; Bevs</h1>

    <!-- Top-right invoice button (NO floating icon anywhere) -->
    <a class="invoice-btn" id="invoiceBtn" href="/pos/invoice/" aria-label="Invoice">
      Invoice
      <span class="invoice-badge" id="invoiceBadge" hidden>0</span>
    </a>
  </header>

  <div class="page-search">
    <input id="search" type="search" placeholder="Search" autocomplete="off" />
  </div>

  <main class="page-content">
    <div id="grid" class="category-grid category-grid-foodbevs" aria-label="Food &amp; Bevs products"></div>
  </main>

  <!-- IMPORTANT:
       cart.js is now state + badge updater ONLY.
       No floating icon, no modal, no sheet.
  -->
  <script src="/pos/cart.js?v=12" defer></script>
  <script src="/pos/foodandbevs.js?v=12" defer></script>
</body>
</html>
