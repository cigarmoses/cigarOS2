<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FOOD &amp; BEVS • POS</title>
  <link rel="stylesheet" href="/pos/pos.css" />
  <style>
    :root {
      --bg: #eaf2f6;
      --ink: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .pos-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 90px;
    }
    .pos-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pos-back {
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .pos-star {
      font-size: 22px;
      color: #ffcc00;
    }
    .pos-header-spacer {
      height: 16px;
    }
    .pos-title {
      text-align: center;
      font-weight: 700;
      font-size: 28px;
      margin: 0;
    }

    /* 4-across icon grid */
    .bev-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 32px; /* extra space you asked for */
    }

    .bev-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      color: var(--ink);
    }

    .bev-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
    }
    .bev-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 3-line description under the picture */
    .bev-brand {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
    }
    .bev-item {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }
    .bev-price {
      font-size: 13px;
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <div class="pos-wrap">
    <div class="pos-topbar">
      <a class="pos-back" href="/pos/"><span>←</span><span>POS</span></a>
      <div class="pos-star">★</div>
    </div>
    <div class="pos-header-spacer"></div>
    <h1 class="pos-title">FOOD &amp; BEVS</h1>

    <div id="bevGrid" class="bev-grid"></div>
  </div>

  <script>
    // Data aligned with pos-categories-prices.csv
    // Brand is "n/a" for all, so it's skipped in the UI per your rule.
    const FOOD_BEVS = [
      { brand: "n/a", name: "7 Up",                     file: "7up.svg",                     price: "$1.50" },
      { brand: "n/a", name: "Cocacola",                file: "cocacola.svg",                price: "$1.50" },
      { brand: "n/a", name: "Coke Zero",               file: "cokezero.svg",                price: "$1.50" },
      { brand: "n/a", name: "Diet Coke",               file: "dietcoke.svg",                price: "$1.50" },
      { brand: "n/a", name: "Diet Dr. Pepper",         file: "dietdrpepper.svg",            price: "$1.50" },
      { brand: "n/a", name: "Dr. Pepper",              file: "drpepper.svg",                price: "$1.50" },
      { brand: "n/a", name: "Dunkin",                  file: "dunkin.svg",                  price: "$3.50" },
      { brand: "n/a", name: "Gatorade",                file: "gatorade.svg",                price: "$3.50" },
      { brand: "n/a", name: "Ginger Ale",              file: "gingerale.svg",               price: "$1.50" },
      { brand: "n/a", name: "GP Sweet Tea",            file: "gpsweettea.svg",              price: "$1.50" },
      { brand: "n/a", name: "GP Unsweetened Tea",      file: "gpunsweetenedtea.svg",        price: "$1.50" },
      { brand: "n/a", name: "GP Zero Sugar Sweet Tea", file: "gpzerosugarsweettea.svg",     price: "$1.50" },
      { brand: "n/a", name: "Monster Tea",             file: "monstertea.svg",              price: "$3.50" },
      { brand: "n/a", name: "Mountain Dew",            file: "mountaindew.svg",             price: "$1.50" },
      { brand: "n/a", name: "Pepsi",                   file: "pepsi.svg",                   price: "$1.50" },
      { brand: "n/a", name: "Red Bull",                file: "redbull.svg",                 price: "$3.50" },
      { brand: "n/a", name: "Root Beer",               file: "rootbeer.svg",                price: "$1.50" },
      { brand: "n/a", name: "Sprite",                  file: "sprite.svg",                  price: "$1.50" },
      { brand: "n/a", name: "Starbucks",               file: "starbucks.svg",               price: "$3.50" },
      { brand: "n/a", name: "Water",                   file: "water.svg",                   price: "$1.50" }
    ];

    const grid = document.getElementById('bevGrid');

    function renderFoodBevs() {
      grid.innerHTML = "";

      FOOD_BEVS.forEach(item => {
        const div = document.createElement('div');
        div.className = 'bev-tile';

        const brandLine =
          item.brand &&
          item.brand.toLowerCase() !== 'n/a'
            ? `<div class="bev-brand">${item.brand}</div>`
            : '';

        div.innerHTML = `
          <div class="bev-icon">
            <img src="/img/icons/foodandbevs/${item.file}" alt="${item.name}">
          </div>
          ${brandLine}
          <div class="bev-item">${item.name}</div>
          <div class="bev-price">${item.price}</div>
        `;
        grid.appendChild(div);
      });
    }

    renderFoodBevs();
  </script>

  <!-- Red receipt pill -->
  <div class="receipt-pill" id="open-receipt">
    <img src="/uxui/receipt-icon.svg" alt="Receipt" />
  </div>

  <!-- Invoice Popup -->
  <div id="invoice-popup" class="invoice-popup">
    <div class="invoice-popup-inner">
      <div class="invoice-header">
        <h2>Invoice</h2>
        <p id="invoice-date"></p>
      </div>

      <div class="invoice-body">
        <div class="loyalty-row">
          <span>Loyalty customer</span>
          <span class="dropdown-arrow">▼</span>
        </div>

        <!-- CART ITEMS GO HERE -->
        <div id="invoice-items"></div>
      </div>

      <div class="invoice-totals">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="invoice-subtotal">$0.00</span>
        </div>
        <div class="total-row">
          <span>Tax</span>
          <span id="invoice-tax">$0.00</span>
        </div>
        <div class="total-row total-bold">
          <span>TOTAL</span>
          <span id="invoice-total">$0.00</span>
        </div>
      </div>

      <div id="close-receipt" class="invoice-close">Close</div>
    </div>
  </div>

  <script src="/js/tony.js" defer></script>
  <script src="/pos/pos.js" defer></script>
</body>
</html>
