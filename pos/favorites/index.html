<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Favorites</title>
  <!-- POS favorites horizontal photos: 2026-10-13-r1 -->

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css?v=36" />

  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --bg:#eef3fb;
      --bg2:#f7f9fd;
      --glass:rgba(255,255,255,.70);
      --glass2:rgba(255,255,255,.58);
      --glass3:rgba(255,255,255,.42);
      --stroke:rgba(15,23,42,.08);
      --stroke-soft:rgba(15,23,42,.05);
      --text:#0b1220;
      --muted:rgba(11,18,32,.62);
      --muted2:rgba(11,18,32,.46);
      --shadow:0 18px 40px rgba(15,23,42,.10);
      --shadow-soft:0 10px 22px rgba(15,23,42,.08);
      --glow:rgba(118,157,255,.12);
      --green:#34c759;
      --blue:#3b82f6;
    }

    html[data-theme="dark"]{
      --bg:#071b33;
      --bg2:#0b2a4f;
      --glass:rgba(255,255,255,.09);
      --glass2:rgba(255,255,255,.07);
      --glass3:rgba(255,255,255,.05);
      --stroke:rgba(255,255,255,.12);
      --stroke-soft:rgba(255,255,255,.08);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --muted2:rgba(255,255,255,.50);
      --shadow:0 22px 60px rgba(0,0,0,.34);
      --shadow-soft:0 12px 28px rgba(0,0,0,.22);
      --glow:rgba(59,130,246,.22);
      --green:#34c759;
      --blue:#4c7cff;
    }

    *{box-sizing:border-box;}
    html,body{min-height:100%;margin:0;}

    body.favorites-page{
      color:var(--text);
      font-family:var(--font-sans);
      background:
        radial-gradient(1200px 700px at 18% 0%, rgba(80,132,255,.10), transparent 58%),
        radial-gradient(900px 620px at 100% 10%, rgba(61,201,255,.05), transparent 54%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      background-attachment:fixed;
    }

    html[data-theme="dark"] body.favorites-page{
      background:
        radial-gradient(1200px 700px at 15% 5%, rgba(72,117,210,.30), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(0,185,255,.10), transparent 55%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      background-attachment:fixed;
    }

    .glass-surface{
      position:relative;
      overflow:hidden;
      backdrop-filter:blur(24px) saturate(1.14);
      -webkit-backdrop-filter:blur(24px) saturate(1.14);
    }

    .glass-surface::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 0 1px var(--stroke-soft);
    }

    .favorites-topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:grid;
      grid-template-columns:42px 1fr 52px;
      align-items:center;
      width:min(430px, calc(100% - 28px));
      margin:0 auto;
      padding:calc(10px + var(--safe-top)) 0 18px;
    }

    .favorites-back{
      position:relative;
      width:42px;
      height:42px;
      border:0;
      padding:0;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.05);
      color:var(--text);
      border-radius:999px;
      box-shadow:0 12px 28px rgba(0,0,0,.22);
      cursor:pointer;
      appearance:none;
      -webkit-tap-highlight-color:transparent;
    }

    .favorites-back svg{
      width:22px;
      height:22px;
      display:block;
    }

    .favorites-theme-dock{
      display:flex;
      justify-content:flex-end;
    }

    #theme-toggle{
      position:relative;
      width:52px;
      height:32px;
      border:0;
      padding:0;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      box-shadow:0 12px 28px rgba(0,0,0,.22);
      cursor:pointer;
      appearance:none;
      -webkit-tap-highlight-color:transparent;
    }

    #theme-toggle .knob{
      position:absolute;
      top:3px;
      left:3px;
      width:26px;
      height:26px;
      border-radius:999px;
      background:transparent;
      transition:transform .25s ease;
      display:grid;
      place-items:center;
    }

    #theme-toggle .icon-sun,
    #theme-toggle .icon-moon{
      position:absolute;
      width:26px;
      height:26px;
      display:block;
    }

    #theme-toggle .icon-sun{
      color:#ffcc00;
      display:block;
    }

    #theme-toggle .icon-moon{
      color:#fff4b8;
      display:none;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
    }

    html[data-theme="dark"] #theme-toggle .knob{
      transform:translateX(20px);
    }

    html[data-theme="dark"] #theme-toggle .icon-sun{
      display:none;
    }

    html[data-theme="dark"] #theme-toggle .icon-moon{
      display:block;
    }

    html[data-theme="light"] .favorites-back,
    html[data-theme="light"] #theme-toggle{
      color:#101828;
      background:rgba(255,255,255,.82);
      box-shadow:0 10px 24px rgba(15,26,44,.08);
    }

    .favorites-main{
      width:min(430px, calc(100% - 22px));
      margin:0 auto;
      padding:0 0 calc(118px + var(--safe-bottom));
    }

    .page-title{
      margin:8px 2px 10px;
      font-family:var(--font-display);
      font-size:56px;
      font-weight:900;
      letter-spacing:-.065em;
      line-height:.90;
      color:var(--text);
    }

    .summary{
      margin:0 2px 18px;
      color:var(--muted2);
      font-family:var(--font-display);
      font-size:15px;
      font-weight:600;
    }

    .favorites-actions{
      display:flex;
      justify-content:flex-end;
      margin:0 2px 12px;
    }

    .clear-btn{
      height:38px;
      padding:0 14px;
      border:0;
      border-radius:999px;
      background:var(--glass2);
      color:var(--muted);
      box-shadow:var(--shadow-soft);
      font-family:var(--font-display);
      font-size:13px;
      font-weight:750;
      cursor:pointer;
      appearance:none;
    }

    .clear-btn[hidden]{
      display:none !important;
    }

    .brand-list{
      padding:8px 2px 0;
    }

    /* Photos use the exact width of the former .brand-row cards.
       The SVG rotates the original PNG without stretching it.
       Only fully transparent image margins are excluded, when readable. */
    #favoritesContent{ position:relative; }
    .favorite-photo-row{
      position:relative;
      display:block;
      width:100%;
      margin:0 0 10px;
      padding:0;
      border:0;
      background:transparent;
      box-shadow:none;
      touch-action:pan-y pinch-zoom;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }
    .favorite-photo-link{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:104px;
      padding:10px 0;
      color:var(--text);
      text-decoration:none;
      border:0;
      background:transparent;
      -webkit-tap-highlight-color:transparent;
      -webkit-user-drag:none;
      -webkit-touch-callout:none;
      touch-action:pan-y pinch-zoom;
      cursor:pointer;
    }
    .favorite-photo-link:focus-visible{
      outline:2px solid var(--blue);
      outline-offset:4px;
      border-radius:8px;
    }
    .favorite-photo-art{
      display:block;
      flex:0 0 100%;
      width:100%;
      height:auto;
      max-width:100%;
      overflow:hidden;
      pointer-events:none;
      -webkit-user-select:none;
      user-select:none;
      filter:drop-shadow(0 8px 10px rgba(0,0,0,.16));
    }
    .favorite-photo-status{
      color:var(--muted2);
      font-family:var(--font-sans, -apple-system, sans-serif);
      font-size:14px;
      font-weight:400;
      text-align:center;
    }
    .favorite-photo-row.is-photo-loading .favorite-photo-link{
      min-height:104px;
    }
    .favorite-photo-row.is-sort-placeholder{
      opacity:0 !important;
      pointer-events:none !important;
    }
    .favorite-photo-preview{
      opacity:.97;
      will-change:transform;
      pointer-events:none !important;
    }
    .favorite-photo-preview .favorite-photo-link{
      cursor:grabbing;
    }
    .favorite-photo-preview .favorite-photo-art{
      filter:drop-shadow(0 14px 14px rgba(0,0,0,.32));
    }
    body.favorites-is-sorting{
      cursor:grabbing;
      -webkit-user-select:none;
      user-select:none;
      overscroll-behavior:none;
    }
    .favorites-sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip-path:inset(50%);
      white-space:nowrap;
      border:0;
    }
    @media (prefers-reduced-motion:reduce){
      .favorite-photo-row,.favorite-photo-preview{ transition:none; }
    }

    .empty,
    .loading,
    .error{
      padding:24px 12px;
      text-align:center;
      color:var(--muted);
      font-family:var(--font-display);
      font-size:18px;
      font-weight:700;
    }

    .cigars-bottom-bar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:1000;
      pointer-events:none;
      padding:0 12px calc(10px + var(--safe-bottom));
    }

    .cigars-bottom-bar-inner{
      width:min(430px, 100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:8px;
      padding:10px;
      border-radius:26px;
      border:1px solid var(--stroke);
      background:var(--glass);
      box-shadow:var(--shadow);
      backdrop-filter:blur(26px) saturate(1.12);
      -webkit-backdrop-filter:blur(26px) saturate(1.12);
      pointer-events:auto;
    }

    .cb-nav-btn{
      min-height:54px;
      border-radius:18px;
      border:0;
      background:transparent;
      text-decoration:none;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:10px;
      font-weight:800;
      letter-spacing:.02em;
      text-transform:uppercase;
      cursor:pointer;
      appearance:none;
      position:relative;
    }

    .cb-nav-icon{
      width:22px;
      height:22px;
      display:block;
      object-fit:contain;
    }

    .cb-nav-btn.is-active{
      background:rgba(255,255,255,.08);
    }

    html[data-theme="light"] .cb-nav-btn.is-active{
      background:rgba(15,23,40,.05);
    }

    .pos-action-sheet{
      position:fixed;
      inset:0;
      z-index:5000;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:18px 14px calc(18px + var(--safe-bottom));
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease;
    }

    .pos-action-sheet[hidden]{
      display:none !important;
    }

    .pos-action-sheet.is-open{
      opacity:1;
      pointer-events:auto;
    }

    .pos-action-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.34);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .pos-action-card{
      position:relative;
      z-index:1;
      width:min(430px, 100%);
      border-radius:30px;
      padding:22px 18px 18px;
      background:rgba(255,255,255,.94);
      color:#0b1220;
      border:1px solid rgba(255,255,255,.70);
      box-shadow:0 24px 70px rgba(0,0,0,.30);
      transform:translateY(22px);
      transition:transform .22s cubic-bezier(.2,.9,.2,1);
    }

    .pos-action-sheet.is-open .pos-action-card{
      transform:translateY(0);
    }

    .pos-action-title{
      font-family:var(--font-display);
      font-size:28px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.045em;
      text-align:center;
      margin:0 0 22px;
      color:#0b1220;
    }

    .pos-action-lines{
      display:grid;
      gap:16px;
    }

    .pos-action-line{
      padding:14px 14px 12px;
      border-radius:22px;
      background:rgba(15,26,44,.045);
      border:1px solid rgba(15,26,44,.07);
    }

    .pos-action-line-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .pos-action-label{
      font-family:var(--font-display);
      font-size:22px;
      line-height:1;
      font-weight:850;
      letter-spacing:-.035em;
      color:#0b1220;
    }

    .pos-action-stepper{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:13px;
      font-family:var(--font-display);
      font-weight:900;
      color:#0b1220;
    }

    .pos-action-stepper button{
      width:32px;
      height:32px;
      border:0;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:#0b1220;
      color:#fff;
      font-size:20px;
      line-height:1;
      font-weight:800;
      cursor:pointer;
      appearance:none;
    }

    .pos-action-stepper span{
      min-width:24px;
      text-align:center;
      font-size:22px;
      line-height:1;
      font-weight:900;
    }

    .pos-action-line-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding-top:10px;
      font-family:var(--font-display);
      font-size:17px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.02em;
      color:rgba(11,18,32,.64);
    }

    .pos-action-line-bottom span:last-child{
      color:#0b1220;
    }

    .pos-action-total{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:18px 2px 16px;
      font-family:var(--font-display);
      font-size:22px;
      line-height:1;
      font-weight:850;
      letter-spacing:-.035em;
      color:#0b1220;
    }

    .pos-action-total strong{
      font-size:24px;
      font-weight:950;
    }

    .pos-action-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .pos-action-buttons button,
    .pos-action-favorite{
      height:52px;
      border:0;
      border-radius:18px;
      font-family:var(--font-display);
      font-size:18px;
      font-weight:850;
      cursor:pointer;
      appearance:none;
    }

    .pos-action-cancel{
      background:rgba(15,26,44,.07);
      color:#0b1220;
    }

    .pos-action-add{
      background:#34c759;
      color:#fff;
      box-shadow:0 12px 24px rgba(52,199,89,.24);
    }

    .pos-action-favorite{
      width:100%;
      margin-top:12px;
      background:rgba(255,204,0,.18);
      color:#0b1220;
    }

    .pos-action-favorite.is-saved{
      background:rgba(52,199,89,.16);
      color:#168034;
    }

    .pos-toast{
      position:fixed;
      left:50%;
      bottom:calc(104px + var(--safe-bottom));
      z-index:7000;
      transform:translate(-50%, 12px);
      opacity:0;
      pointer-events:none;
      padding:12px 16px;
      border-radius:999px;
      background:rgba(11,18,32,.92);
      color:#fff;
      font-family:var(--font-display);
      font-size:14px;
      font-weight:800;
      box-shadow:0 12px 26px rgba(0,0,0,.28);
      transition:opacity .18s ease, transform .18s ease;
    }

    .pos-toast.is-showing{
      opacity:1;
      transform:translate(-50%, 0);
    }

    @media (max-width:390px){
      .favorites-topbar{
        grid-template-columns:40px 1fr 50px;
        width:calc(100% - 18px);
      }

      .favorites-back{
        width:40px;
        height:40px;
      }

      #theme-toggle{
        width:50px;
        height:30px;
      }

      #theme-toggle .knob{
        width:24px;
        height:24px;
      }

      #theme-toggle .icon-sun,
      #theme-toggle .icon-moon{
        width:24px;
        height:24px;
      }

      html[data-theme="dark"] #theme-toggle .knob{
        transform:translateX(20px);
      }

      .favorites-main{
        width:calc(100% - 18px);
      }

      .page-title{
        font-size:46px;
      }

    }
  </style>
</head>

<body class="favorites-page">
  <header class="favorites-topbar">
    <button
      type="button"
      class="favorites-back glass-surface"
      aria-label="Back"
      onclick="history.length > 1 ? history.back() : window.location.href='/pos/cigars/'"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <div aria-hidden="true"></div>

    <div class="favorites-theme-dock">
      <button id="theme-toggle" class="glass-surface" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="knob" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23 5.46 5.46"></path>
            </g>
          </svg>
          <img class="icon-moon" src="/uxui/moon.svg" alt="" />
        </span>
      </button>
    </div>
  </header>

  <main class="favorites-main">
    <h1 class="page-title">Favorites</h1>
    <div class="summary" id="favoritesSummary">Loading favorites…</div>

    <div class="favorites-actions">
      <button class="clear-btn" id="clearFavoritesBtn" type="button" hidden>Clear All</button>
    </div>

    <p id="favoritesReorderHelp" class="favorites-sr-only">Tap a cigar photo to open its detail page. On a touch screen, hold then drag to reorder. With a mouse, click and drag. With a keyboard, focus a cigar link and press Alt plus Up or Down.</p>
    <div id="favoritesAnnouncement" class="favorites-sr-only" role="status" aria-live="polite"></div>
    <section class="brand-list" id="favoritesContent" role="list" aria-label="Favorite cigars">
      <div class="loading">Loading favorites…</div>
    </section>
  </main>

  <nav class="cigars-bottom-bar" aria-label="Primary">
    <div class="cigars-bottom-bar-inner">
      <button type="button" class="cb-nav-btn" id="cbSearchBtn" aria-label="Search">
        <img class="cb-nav-icon" src="/uxui/bottombar/search.svg" alt="" />
        <span>Search</span>
      </button>

      <a class="cb-nav-btn" href="/" aria-label="Home">
        <img class="cb-nav-icon" src="/uxui/bottombar/home.svg" alt="" />
        <span>Home</span>
      </a>

      <a class="cb-nav-btn is-active" href="/pos/favorites/" aria-label="Favorites">
        <img class="cb-nav-icon" src="/uxui/bottombar/favorites.svg" alt="" />
        <span>Favorites</span>
      </a>

      <a class="cb-nav-btn" href="/pos/invoice/" aria-label="Cart">
        <img class="cb-nav-icon" src="/uxui/bottombar/cart.svg" alt="" />
        <span>Cart</span>
      </a>
    </div>
  </nav>

  <script src="/pos/cart.js?v=35" defer></script>
  <script src="/pos/pos.js?v=35" defer></script>

  <script>
    (() => {
      "use strict";

      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/10-5j7vKT123WtNhqLynxX3n9BXpb1VlKcuPZHj9YxdM/gviz/tq?tqx=out:csv";

      const POS_CIGAR_FAVORITES_KEY = "cigaros_pos_favorites_cigars";
      // Ordering is independent of membership: dragging never rewrites favorites.
      const FAVORITES_ORDER_KEY = "cigaros_pos_favorites_order_v1";

      const $ = (sel, root = document) => root.querySelector(sel);

      const content = $("#favoritesContent");
      const summary = $("#favoritesSummary");
      const clearBtn = $("#clearFavoritesBtn");

      const state = {
        records: [],
        catalogLoaded: false,
        loadToken: 0,
        visibleIds: [],
        drag: null,
        settling: false,
        suppressClickUntil: 0,
        ignoreMouseUntil: 0,
        refreshQueued: false,
        renderGeneration: 0,
        photoJobs: [],
        localImageUrls: [],
        actionRow: null,
        singleQty: 1,
        boxQty: 0,
      };

      function norm(v){
        return String(v ?? "").trim().replace(/\s+/g, " ");
      }

      function esc(s){
        return String(s ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function normalizeHeader(h){
        return String(h || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, " ")
          .replace(/[^a-z0-9 ]/g, "")
          .replace(/ /g, "_");
      }

      function normalizeBrand(v){
        return String(v || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, "and")
          .replace(/[^a-z0-9]+/g, "");
      }

      function normalizeLoose(v){
        return String(v || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, " and ")
          .replace(/["'’]/g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function normalizeAssetPath(path){
        const value = String(path || "").trim();
        if(!value) return "";
        if(/^https?:\/\//i.test(value)) return value;
        return value.startsWith("/") ? value : `/${value}`;
      }

      function parseCSV(text){
        const rows = [];
        let cur = [];
        let field = "";
        let inQuotes = false;

        for(let i = 0; i < text.length; i++){
          const ch = text[i];
          const next = text[i + 1];

          if(inQuotes){
            if(ch === '"' && next === '"'){
              field += '"';
              i++;
            }else if(ch === '"'){
              inQuotes = false;
            }else{
              field += ch;
            }
          }else{
            if(ch === '"') inQuotes = true;
            else if(ch === ","){
              cur.push(field);
              field = "";
            }else if(ch === "\n"){
              cur.push(field);
              rows.push(cur);
              cur = [];
              field = "";
            }else if(ch !== "\r"){
              field += ch;
            }
          }
        }

        cur.push(field);
        rows.push(cur);
        return rows;
      }

      function mapRows(csv){
        const headers = csv[0] || [];
        const keys = headers.map(normalizeHeader);

        return csv.slice(1)
          .filter((r) => r && !r.every((c) => !String(c || "").trim()))
          .map((r) => {
            const obj = {};
            keys.forEach((k, i) => {
              obj[k] = (r[i] ?? "").trim();
            });
            return obj;
          });
      }

      function getField(r, keys){
        for(const k of keys){
          if(r && r[k] != null && String(r[k]).trim() !== ""){
            return String(r[k]).trim();
          }
        }
        return "";
      }

      function resolveBrandVal(r){
        return getField(r, ["brand", "brand_name", "manufacturer_brand", "cigar_brand"]);
      }

      function resolveManufacturerVal(r){
        return getField(r, ["manufacturer", "maker"]);
      }

      function resolveLine(r){
        return getField(r, ["line", "series"]);
      }

      function resolveName(r){
        return getField(r, ["cigar", "name"]);
      }

      function resolveVitola(r){
        return getField(r, ["vitola", "style", "vitola_name", "size"]);
      }

      function resolveRing(r){
        return getField(r, ["ring", "ring_gauge", "rg"]);
      }

      function resolveLength(r){
        return getField(r, ["length"]);
      }

      function resolveShape(r){
        return getField(r, ["shape"]);
      }

      function resolveWrapper(r){
        return getField(r, ["wrapper"]);
      }

      function resolveBinder(r){
        return getField(r, ["binder"]);
      }

      function resolveFiller(r){
        return getField(r, ["filler"]);
      }

      function resolveOrigin(r){
        return getField(r, ["origin", "country_of_origin", "country"]);
      }

      function resolveStrength(r){
        return getField(r, ["strength"]);
      }

      function resolveShade(r){
        return getField(r, ["wrapper_shade", "wrapper_shade_type", "shade", "wrapper"]);
      }

      function resolveBrandImage(r){
        return getField(r, ["brand_img", "brand_image", "brandicon", "brand_icon"]);
      }

      function resolveLineImage(r){
        return getField(r, ["line_img", "line_image", "lineicon", "line_icon", "brand_line_img"]);
      }

      function resolveDetailKey(r){
        return getField(r, ["key", "cigar_id", "id", "row_id"]);
      }

      function resolveDisplayName(r){
        const line = resolveLine(r);
        const cigar = resolveName(r);
        return [line, cigar].filter(Boolean).join(" ").trim() || cigar || line || "";
      }

      function resolveFavoriteKey(r){
        return (
          resolveDetailKey(r) ||
          [resolveBrandVal(r), resolveLine(r), resolveName(r), resolveVitola(r)]
            .filter(Boolean)
            .join("|")
        );
      }

      function resolvePriceNumber(r){
        const raw = getField(r, ["msrp", "cigar_msrp", "cigar_retail"]);
        const n = Number(String(raw || "").replace(/[^0-9.-]/g, ""));
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      function resolvePrice(r){
        const n = resolvePriceNumber(r);
        return n > 0 ? n.toFixed(2) : "—";
      }

      function resolveBoxCount(r){
        const raw = getField(r, ["box_count", "box_qty", "box_quantity", "count_per_box"]);
        const n = Number(String(raw || "").replace(/[^0-9.]/g, ""));
        return Number.isFinite(n) && n > 0 ? n : 20;
      }

      function resolveBoxMsrpNumber(r){
        const raw = getField(r, ["box_msrp", "box_price", "box_retail"]);
        const n = Number(String(raw || "").replace(/[^0-9.-]/g, ""));
        if(Number.isFinite(n) && n > 0) return n;
        return resolvePriceNumber(r) * resolveBoxCount(r);
      }

      function makeDetailHref(r){
        const detailKey = resolveDetailKey(r);
        if(detailKey) return `/pos/cigars/cigar.html?key=${encodeURIComponent(detailKey)}`;

        const fallbackKey = [resolveBrandVal(r), resolveDisplayName(r), resolveVitola(r)]
          .filter(Boolean)
          .join("|");

        return `/pos/cigars/cigar.html?key=${encodeURIComponent(fallbackKey)}`;
      }

      function buildBrandIconCandidates(r){
        const brandImg = normalizeAssetPath(resolveBrandImage(r));
        const brand = normalizeBrand(resolveBrandVal(r));
        const out = [];

        if(brandImg) out.push(brandImg);
        if(brand){
          out.push(`/img/icons/brands/${brand}.svg`);
          out.push(`/img/icons/brands/${brand}.png`);
        }

        return Array.from(new Set(out.filter(Boolean)));
      }

      function rowIconCandidatesForRow(r){
        const lineImg = normalizeAssetPath(resolveLineImage(r));
        const brandImg = normalizeAssetPath(resolveBrandImage(r));
        return Array.from(new Set([lineImg, brandImg, ...buildBrandIconCandidates(r)].filter(Boolean)));
      }

      function bindImageFallback(img, candidates){
        if(!img) return;

        const list = Array.from(new Set(candidates.filter(Boolean)));
        let idx = 0;

        img.onerror = () => {
          idx++;
          if(idx < list.length){
            img.src = list[idx];
          }else{
            img.onerror = null;
            img.style.visibility = "hidden";
          }
        };

        if(list[0]) img.src = list[0];
        else img.style.visibility = "hidden";
      }

      function readFavorites(){
        const value = localStorage.getItem(POS_CIGAR_FAVORITES_KEY);
        if(value === null) return [];
        let items;
        try { items = JSON.parse(value); }
        catch { throw new Error("Saved favorites could not be read. Your stored data has not been changed."); }
        if(!Array.isArray(items)) throw new Error("Saved favorites have an unrecognized format. Your stored data has not been changed.");
        return items;
      }

      function writeFavorites(items){
        localStorage.setItem(POS_CIGAR_FAVORITES_KEY, JSON.stringify(items));
      }

      function favoriteId(favorite){
        if(typeof favorite === "string" || typeof favorite === "number") return String(favorite).trim();
        if(!favorite || typeof favorite !== "object") return "";
        return norm(favorite.key || favorite.id || favorite.href || favorite.url) ||
          JSON.stringify([favorite.brand, favorite.line, favorite.cigar || favorite.name, favorite.vitola]);
      }

      function readOrder(){
        try{
          const value = JSON.parse(localStorage.getItem(FAVORITES_ORDER_KEY) || "[]");
          return Array.isArray(value) ? value.filter(id => typeof id === "string") : [];
        }catch { return []; }
      }

      function orderedFavorites(items){
        const rank = new Map(readOrder().map((id, i) => [id, i]));
        return items.map((item, i) => ({item, i})).sort((a,b) =>
          (rank.get(favoriteId(a.item)) ?? Infinity) - (rank.get(favoriteId(b.item)) ?? Infinity) || a.i - b.i
        ).map(entry => entry.item);
      }

      function persistOrder(ids){
        // Read membership fresh. Keep newly added, hidden and unmatched items.
        // Never write to POS_CIGAR_FAVORITES_KEY during a reorder.
        const current = orderedFavorites(readFavorites());
        const currentIds = [...new Set(current.map(favoriteId).filter(Boolean))];
        const currentSet = new Set(currentIds);
        const selected = [...new Set(ids)].filter(id => currentSet.has(id));
        const selectedSet = new Set(selected);
        let at = 0;
        const next = currentIds.map(id => selectedSet.has(id) ? selected[at++] : id);
        localStorage.setItem(FAVORITES_ORDER_KEY, JSON.stringify(next));
      }

      function findRecordByFavorite(records, fav){
        const key = String(fav?.key || fav || "").trim();
        if(!key) return null;

        const exact = records.find(r => resolveDetailKey(r) === key || resolveFavoriteKey(r) === key);
        if(exact) return exact;
        const loose = normalizeLoose(key);

        return records.find((r) => {
          const candidates = [
            resolveFavoriteKey(r),
            resolveDetailKey(r),
            [resolveBrandVal(r), resolveLine(r), resolveName(r), resolveVitola(r)].filter(Boolean).join("|"),
            [resolveBrandVal(r), resolveLine(r), resolveName(r), resolveVitola(r)].filter(Boolean).join(" "),
            [resolveLine(r), resolveName(r)].filter(Boolean).join(" "),
            resolveDisplayName(r),
          ].filter(Boolean);

          return candidates.some((c) => String(c).trim() === key || normalizeLoose(c) === loose);
        }) || null;
      }

      function isFavorite(r){
        const key = resolveFavoriteKey(r);
        return readFavorites().some((item) => item && item.key === key);
      }

      function removeFavorite(r){
        const key = resolveFavoriteKey(r);
        writeFavorites(readFavorites().filter((item) => item && item.key !== key));
      }

      function showToast(message){

        if(!toast){
          toast = document.createElement("div");

          document.body.appendChild(toast);
        }

        toast.textContent = message;
        toast.classList.add("is-showing");

        window.clearTimeout(toast.__timer);
        toast.__timer = window.setTimeout(() => {
          toast.classList.remove("is-showing");
        }, 1300);
      }

      function money(n){
        const num = Number(n || 0);
        return Number.isFinite(num) ? num.toFixed(2) : "0.00";
      }

      function buildCartItem(r, type = "stick"){
        const isBox = type === "box";
        const unitPrice = isBox ? resolveBoxMsrpNumber(r) : resolvePriceNumber(r);
        const detailKey = resolveDetailKey(r);

        return {
          key: `${detailKey || `${normalizeBrand(resolveBrandVal(r))}|${resolveDisplayName(r)}|${resolveVitola(r)}`}|${type}`,
          type: "cigar",
          purchaseType: type,
          category: "Cigars",
          id: detailKey || resolveName(r),
          brand: resolveBrandVal(r),
          manufacturer: resolveManufacturerVal(r),
          line: resolveLine(r),
          cigar: resolveName(r),
          name: `${resolveDisplayName(r)}${isBox ? " (Box)" : ""}`,
          displayName: resolveDisplayName(r),
          vitola: resolveVitola(r),
          ring: resolveRing(r),
          length: resolveLength(r),
          shape: resolveShape(r),
          wrapper: resolveWrapper(r),
          binder: resolveBinder(r),
          filler: resolveFiller(r),
          origin: resolveOrigin(r),
          shade: resolveShade(r),
          strength: resolveStrength(r),
          image: rowIconCandidatesForRow(r)[0] || "",
          msrp: unitPrice,
          boxCount: resolveBoxCount(r),
          url: makeDetailHref(r),
        };
      }

      function updateActionSheet(){
        const r = state.actionRow;
        if(!r) return;

        const singlePrice = resolvePriceNumber(r);
        const boxPrice = resolveBoxMsrpNumber(r);

        $("#singleQty").textContent = String(state.singleQty);
        $("#boxQty").textContent = String(state.boxQty);

        $("#singleUnit").textContent = money(singlePrice);
        $("#singleTotal").textContent = money(singlePrice * state.singleQty);

        $("#boxUnit").textContent = money(boxPrice);
        $("#boxTotal").textContent = money(boxPrice * state.boxQty);

        $("#actionTotal").textContent = `$${money(singlePrice * state.singleQty + boxPrice * state.boxQty)}`;

      /* Horizontal cigar photos. No band/brand icon is used as a photo fallback. */
      function photoURL(value){
        const raw = String(value || "").trim();
        if(!raw || /^(n\/a|none|null|undefined|—)$/i.test(raw)) return "";
        if(/^blob:/.test(raw) || /^data:image\/(png|jpeg|webp);/i.test(raw)) return raw;
        const path = normalizeAssetPath(raw);
        try{
          const url = new URL(path, location.origin);
          return ["http:", "https:"].includes(url.protocol) ? url.href : "";
        }catch{ return ""; }
      }

      function safeDetailHref(value){
        if(!value) return "";
        try{
          const url = new URL(value, location.origin);
          return url.origin === location.origin && /^\/pos\/cigars\/cigar(?:\.html)?\/?$/.test(url.pathname)
            ? url.pathname + url.search + url.hash : "";
        }catch{ return ""; }
      }

      function recordFromFavorite(favorite){
        if(!favorite || typeof favorite !== "object") return {key:favoriteId(favorite), __fromFavorite:true};
        const record = {};
        Object.entries(favorite).forEach(([key,value]) => {
          if(typeof value === "string" || typeof value === "number") record[normalizeHeader(key)] = String(value);
        });
        record.key = favoriteId(favorite);
        record.cigar = record.cigar || favorite.name || favorite.displayName || "";
        // A saved display name may already contain the line.
        if(!favorite.cigar && (favorite.name || favorite.displayName)) record.line = "";
        record.__fromFavorite = true;
        return record;
      }

      function photoCandidates(record, favorite){
        const source = getField(record, ["cigar_img", "cigar_image", "cigarimg", "photo", "image"]);
        const favoriteObject = favorite && typeof favorite === "object" ? favorite : {};
        const saved = [favoriteObject.cigarImage, favoriteObject.img, favoriteObject.image];
        const extra = Array.isArray(favoriteObject.imageCandidates) ? favoriteObject.imageCandidates : [];
        const out = [source, ...saved, ...extra];
        const brand = normalizeBrand(resolveBrandVal(record));
        const line = normalizeBrand(resolveLine(record));
        const cigar = normalizeBrand(resolveName(record));
        const vitola = normalizeBrand(resolveVitola(record));
        const explicit = getField(record,["cuban","is_cuban"]).toLowerCase();
        const cuban = ["x","true","yes","1","cuba","cuban"].includes(explicit) ||
          (!explicit && (resolveOrigin(record).toLowerCase() === "cuba" || /habanos/i.test(resolveManufacturerVal(record))));
        if(cuban && brand){
          if(line && cigar) out.push(`/img/cigars/cuban/${brand}/${line}${cigar}.png`);
          if(line && cigar && vitola) out.push(`/img/cigars/cuban/${brand}/${line}${cigar}${vitola}.png`);
          if(cigar) out.push(`/img/cigars/cuban/${brand}/${cigar}.png`);
        }
        if(brand && cigar){
          const names = [
            line ? brand+line+cigar : "",
            line && vitola ? brand+line+cigar+vitola : "",
            line ? line+cigar : "",
            line && vitola ? line+cigar+vitola : "",
            line && vitola ? line+vitola : "",
            brand+cigar,
            vitola ? brand+cigar+vitola : "",
            cigar,
            vitola ? cigar+vitola : ""
          ];
          [...new Set(names.filter(Boolean))].forEach(name => out.push(`/img/cigars/${brand}/${name}.png`));
        }
        return [...new Set(out.map(photoURL).filter(url => url && !/\/(?:icons|bandart)\//i.test(url)))];
      }

      let localPhotoDatabase;
      function getLocalPhotoDatabase(){
        if(localPhotoDatabase) return localPhotoDatabase;
        localPhotoDatabase = new Promise(resolve => {
          if(!window.indexedDB){ resolve(null); return; }
          let request, done=false;
          const timer=setTimeout(() => finish(null),2000);
          const finish=value => {
            if(done){ value?.close?.(); return; }
            done=true;clearTimeout(timer);resolve(value);
          };
          try{ request = indexedDB.open("cigaros_demo_pos"); }
          catch { finish(null); return; }
          // Read an existing editor image only. Do not create a new database.
          request.onupgradeneeded = () => request.transaction.abort();
          request.onerror = () => finish(null);
          request.onblocked = () => finish(null);
          request.onsuccess = () => {
            const db = request.result;
            if(!db.objectStoreNames.contains("records")){ db.close(); finish(null); return; }
            db.onversionchange = () => db.close();
            finish(db);
          };
        });
        return localPhotoDatabase;
      }

      async function savedEditorPhoto(record){
        const key = resolveDetailKey(record);
        if(!key) return null;
        const db = await getLocalPhotoDatabase();
        if(!db) return null;
        return new Promise(resolve => {
          try{
            const tx = db.transaction("records", "readonly");
            const request = tx.objectStore("records").get(key);
            tx.oncomplete = () => resolve(request.result?.image?.blob instanceof Blob ? request.result.image.blob : null);
            tx.onabort = () => resolve(null);
            tx.onerror = () => resolve(null);
          }catch { resolve(null); }
        });
      }

      function releasePhotos(){
        state.renderGeneration++;
        for(const cancel of [...state.photoJobs]) cancel();
        state.photoJobs = [];
        state.localImageUrls.forEach(url => URL.revokeObjectURL(url));
        state.localImageUrls = [];
      }

      function preloadPhoto(url){
        return new Promise(resolve => {
          const img = new Image();
          let finished = false;
          let timeout;
          const finish = value => {
            if(finished) return;
            finished = true;
            clearTimeout(timeout);
            img.onload = img.onerror = null;
            const at = state.photoJobs.indexOf(cancel);
            if(at >= 0) state.photoJobs.splice(at,1);
            resolve(value);
          };
          const cancel = () => { finish(null); img.removeAttribute("src"); };
          state.photoJobs.push(cancel);
          img.onload = () => finish(img.naturalWidth && img.naturalHeight ? img : null);
          img.onerror = () => finish(null);
          timeout = setTimeout(() => { finish(null); img.removeAttribute("src"); }, 6000);
          img.decoding = "async";
          img.src = url;
        });
      }

      function visiblePhotoBounds(img){
        const width = img.naturalWidth, height = img.naturalHeight;
        const full = {x:0,y:0,width,height};
        try{
          // Remove transparent padding only, never leaf pixels or white backgrounds.
          // Downsample solely for bounds detection; the displayed image stays original.
          const scale = Math.min(1, 1400 / Math.max(width,height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.ceil(width*scale));
          canvas.height = Math.max(1, Math.ceil(height*scale));
          const ctx = canvas.getContext("2d", {willReadFrequently:true});
          if(!ctx) return full;
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          const pixels = ctx.getImageData(0,0,canvas.width,canvas.height).data;
          let left=canvas.width, right=-1, top=canvas.height, bottom=-1;
          for(let y=0;y<canvas.height;y++) for(let x=0;x<canvas.width;x++){
            if(pixels[(y*canvas.width+x)*4+3] > 0){
              left=Math.min(left,x); right=Math.max(right,x);
              top=Math.min(top,y); bottom=Math.max(bottom,y);
            }
          }
          if(right < left || bottom < top) return full;
          const sx=width/canvas.width, sy=height/canvas.height;
          const x=Math.max(0,Math.floor((left-1)*sx));
          const y=Math.max(0,Math.floor((top-1)*sy));
          const x2=Math.min(width,Math.ceil((right+2)*sx));
          const y2=Math.min(height,Math.ceil((bottom+2)*sy));
          return {x,y,width:x2-x,height:y2-y};
        }catch{
          // Cross-origin images without CORS remain usable, without alpha trimming.
          return full;
        }
      }

      function makePhotoArt(img, record, favorite){
        const bounds=visiblePhotoBounds(img);
        const hinted=normalizeLoose(getField(record,["cigar_image_orientation","image_orientation"]) || favorite?.imageOrientation || "");
        const orientation=["head top","head bottom","head left","head right"].includes(hinted)
          ? hinted : bounds.height > bounds.width ? "head top" : "head right";
        const vertical=orientation === "head top" || orientation === "head bottom";
        const w=vertical ? bounds.height : bounds.width;
        const h=vertical ? bounds.width : bounds.height;
        const ns="http://www.w3.org/2000/svg";
        const art=document.createElementNS(ns,"svg");
        art.classList.add("favorite-photo-art");
        art.setAttribute("viewBox",`0 0 ${w} ${h}`);
        art.setAttribute("width",String(w));
        art.setAttribute("height",String(h));
        art.setAttribute("preserveAspectRatio","xMidYMid meet");
        art.setAttribute("aria-hidden","true");
        art.setAttribute("focusable","false");
        art.dataset.orientation=orientation;
        art.style.aspectRatio=`${w} / ${h}`;
        const image=document.createElementNS(ns,"image");
        image.setAttribute("width",String(img.naturalWidth));
        image.setAttribute("height",String(img.naturalHeight));
        image.setAttribute("href",img.src);
        image.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href",img.src);
        const {x,y,width,height}=bounds;
        const transform=orientation === "head top" ? `matrix(0 1 -1 0 ${y+height} ${-x})`
          : orientation === "head bottom" ? `matrix(0 -1 1 0 ${-y} ${x+width})`
          : orientation === "head left" ? `matrix(-1 0 0 -1 ${x+width} ${y+height})`
          : `translate(${-x} ${-y})`;
        image.setAttribute("transform",transform);
        art.appendChild(image);
        return art;
      }

      async function loadCigarPhoto(row, record, favorite, generation){
        try{
          const candidates=photoCandidates(record,favorite);
          const local=await savedEditorPhoto(record);
          if(generation !== state.renderGeneration || !row.isConnected) return;
          if(local){
            const url=URL.createObjectURL(local);
            state.localImageUrls.push(url);
            candidates.unshift(url);
          }
          for(const url of candidates){
            const img=await preloadPhoto(url);
            if(generation !== state.renderGeneration || !row.isConnected) return;
            if(!img) continue;
            const art=makePhotoArt(img,record,favorite);
            row.querySelector(".favorite-photo-link").replaceChildren(art);
            row.classList.remove("is-photo-loading");
            row.dataset.photoSource=url;
            return;
          }
          row.querySelector(".favorite-photo-status").textContent="Photo unavailable — tap for details";
        }catch(error){
          console.warn("[pos favorites] Photo unavailable:",error);
          const message=row.querySelector(".favorite-photo-status");
          if(message) message.textContent="Photo unavailable — tap for details";
        }finally{
          if(generation === state.renderGeneration) row.classList.remove("is-photo-loading");
        }
      }

      function createRow(record, favorite, id){
        const row=document.createElement("div");
        row.className="favorite-photo-row is-photo-loading";
        row.dataset.favoriteId=id;
        row.setAttribute("role","listitem");
        const link=document.createElement("a");
        link.className="favorite-photo-link";
        link.draggable=false;
        link.href=record.__fromFavorite
          ? safeDetailHref(favorite?.href || favorite?.url) || makeDetailHref(record)
          : makeDetailHref(record);
        const label=[resolveBrandVal(record),resolveDisplayName(record)].filter(Boolean).join(" ") || "Favorite cigar";
        link.setAttribute("aria-label",label);
        link.setAttribute("aria-describedby","favoritesReorderHelp");
        const message=document.createElement("span");
        message.className="favorite-photo-status";
        message.textContent="Loading photo…";
        link.appendChild(message);
        row.appendChild(link);
        return row;
      }

      /* Touch and mouse sorting are local to this page. The actual favorite
         records are never changed during sorting; only the separate ID order. */
      const prefersReducedMotion=() => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const photoRows=() => Array.from(content.children).filter(el => el.matches(".favorite-photo-row[data-favorite-id]"));
      function photoRowAt(target){
        const row=target instanceof Element ? target.closest(".favorite-photo-row[data-favorite-id]") : null;
        return row?.parentElement === content ? row : null;
      }
      function announce(message){
        const live=$("#favoritesAnnouncement");
        if(live) live.textContent=String(message || "");
      }
      function requestQueuedRefresh(){
        if(!state.refreshQueued) return;
        state.refreshQueued=false;
        refreshFavorites();
      }
      function startPhotoPress(row,x,y,kind,id){
        if(state.settling || row.classList.contains("is-photo-loading")) return;
        cancelPhotoDrag();
        const drag={row,x,y,startX:x,startY:y,kind,id,active:false,timer:0,raf:0,
          original:photoRows().map(el => el.dataset.favoriteId),clone:null,animations:[],lastFrame:0};
        state.drag=drag;
        drag.timer=setTimeout(() => activatePhotoDrag(drag),kind === "touch" ? 300 : 240);
      }
      function activatePhotoDrag(drag){
        if(state.drag !== drag || !drag.row.isConnected) return;
        clearTimeout(drag.timer);
        drag.active=true;
        const rect=drag.row.getBoundingClientRect();
        drag.rect={top:rect.top,left:rect.left,width:rect.width,height:rect.height};
        drag.offsetY=drag.startY-rect.top;
        const clone=drag.row.cloneNode(true);
        clone.removeAttribute("data-favorite-id");
        clone.removeAttribute("role");
        clone.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
        clone.querySelectorAll("a").forEach(el => {el.removeAttribute("href");el.tabIndex=-1;});
        clone.classList.add("favorite-photo-preview");
        clone.setAttribute("aria-hidden","true");
        clone.inert=true;
        clone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;margin:0;z-index:1100;pointer-events:none;transition:none;`;
        document.body.appendChild(clone);
        drag.clone=clone;
        drag.row.classList.add("is-sort-placeholder");
        document.body.classList.add("favorites-is-sorting");
        announce("Picked up "+drag.row.querySelector("a").getAttribute("aria-label"));
        drag.raf=requestAnimationFrame(photoDragFrame);
      }
      function movePhotoDrag(x,y,kind,id,event){
        const drag=state.drag;
        if(!drag || drag.kind !== kind || drag.id !== id || state.settling) return;
        drag.x=x;drag.y=y;
        if(!drag.active && Math.hypot(x-drag.startX,y-drag.startY)>8){
          if(kind === "touch"){
            state.suppressClickUntil=Date.now()+350;
            cancelPhotoDrag();
            return; // A quick swipe remains native page scrolling.
          }
          activatePhotoDrag(drag);
        }
        if(drag.active && event.cancelable) event.preventDefault();
      }
      function movePhotoPlaceholder(drag){
        const others=photoRows().filter(row => row !== drag.row);
        const centerY=drag.y-drag.offsetY+drag.rect.height/2;
        const listTop=content.getBoundingClientRect().top;
        let next=null;
        // offsetTop is layout-based, so animated neighbors cannot cause jitter.
        for(const row of others){
          if(centerY < listTop+row.offsetTop+row.offsetHeight/2){next=row;break;}
        }
        if(drag.row.nextElementSibling === next) return;
        const before=new Map(others.map(row => [row,row.getBoundingClientRect()]));
        drag.animations.forEach(animation => animation.cancel());
        drag.animations=[];
        content.insertBefore(drag.row,next);
        if(!prefersReducedMotion()) others.forEach(row => {
          const old=before.get(row),current=row.getBoundingClientRect();
          const dy=old.top-current.top;
          if(dy && row.animate) drag.animations.push(row.animate(
            [{transform:`translateY(${dy}px)`},{transform:"translateY(0)"}],
            {duration:160,easing:"ease-out"}
          ));
        });
      }
      function photoDragFrame(time){
        const drag=state.drag;
        if(!drag?.active || state.settling) return;
        const view=window.visualViewport;
        const top=view?.offsetTop || 0;
        const height=view?.height || window.innerHeight;
        const nav=document.querySelector(".cigars-bottom-bar-inner")?.getBoundingClientRect();
        const bottom=Math.min(top+height,nav?.top || top+height);
        const edge=64;
        const elapsed=Math.min((time-(drag.lastFrame || time))/16.67,2);
        drag.lastFrame=time;
        const scroll=drag.y < top+edge ? -Math.min(12,(top+edge-drag.y)/4)
          : drag.y > bottom-edge ? Math.min(12,(drag.y-bottom+edge)/4) : 0;
        if(scroll) window.scrollBy(0,scroll*elapsed);
        drag.clone.style.transform=`translate3d(0,${drag.y-drag.startY}px,0)`;
        movePhotoPlaceholder(drag);
        drag.raf=requestAnimationFrame(photoDragFrame);
      }
      function cleanupPhotoDrag(drag){
        clearTimeout(drag.timer);
        cancelAnimationFrame(drag.raf);
        drag.animations.forEach(animation => animation.cancel());
        drag.dropAnimation?.cancel();
        drag.clone?.remove();
        drag.row.classList.remove("is-sort-placeholder");
        document.body.classList.remove("favorites-is-sorting");
      }
      function restorePhotoOrder(ids){
        const rows=new Map(photoRows().map(row => [row.dataset.favoriteId,row]));
        ids.forEach(id => {if(rows.has(id)) content.appendChild(rows.get(id));});
      }
      function cancelPhotoDrag(){
        const drag=state.drag;
        if(!drag) return;
        if(drag.active){
          restorePhotoOrder(drag.original);
          state.suppressClickUntil=Date.now()+600;
        }
        cleanupPhotoDrag(drag);
        state.drag=null;
        state.settling=false;
        requestQueuedRefresh();
      }
      async function finishPhotoDrag(event){
        const drag=state.drag;
        if(!drag || state.settling) return;
        clearTimeout(drag.timer);
        if(!drag.active){
          cleanupPhotoDrag(drag);state.drag=null;
          requestQueuedRefresh();return;
        }
        if(event?.cancelable) event.preventDefault();
        state.suppressClickUntil=Date.now()+800;
        cancelAnimationFrame(drag.raf);
        state.settling=true;
        const target=drag.row.getBoundingClientRect();
        try{
          if(drag.clone?.animate && !prefersReducedMotion()){
            drag.dropAnimation=drag.clone.animate([
              {transform:drag.clone.style.transform || "translate3d(0,0,0)"},
              {transform:`translate3d(${target.left-drag.rect.left}px,${target.top-drag.rect.top}px,0)`}
            ],{duration:130,easing:"ease-out",fill:"forwards"});
            await drag.dropAnimation.finished.catch(() => {});
          }
          if(state.drag !== drag) return;
          persistOrder(photoRows().map(row => row.dataset.favoriteId));
          announce("New favorites order saved.");
        }catch(error){
          restorePhotoOrder(drag.original);
          showToast("Could not save the new order. Your favorites have not changed.");
          console.warn("[pos favorites] Order save failed:",error);
        }finally{
          if(state.drag === drag){
            cleanupPhotoDrag(drag);state.drag=null;state.settling=false;
            requestQueuedRefresh();
          }
        }
      }
      function touchWithId(list,id){return Array.from(list).find(touch => touch.identifier === id);}
      function bindPhotoInteractions(){
        content.addEventListener("touchstart",event => {
          state.ignoreMouseUntil=Date.now()+1200;
          if(event.touches.length !== 1){cancelPhotoDrag();return;}
          const row=photoRowAt(event.target);if(!row) return;
          const touch=event.changedTouches[0];
          startPhotoPress(row,touch.clientX,touch.clientY,"touch",touch.identifier);
        },{passive:true});
        document.addEventListener("touchstart",event => {
          if(event.touches.length>1) cancelPhotoDrag();
        },{passive:true});
        document.addEventListener("touchmove",event => {
          const drag=state.drag;if(!drag || drag.kind !== "touch") return;
          const touch=touchWithId(event.touches,drag.id);
          if(touch) movePhotoDrag(touch.clientX,touch.clientY,"touch",drag.id,event);
        },{passive:false});
        document.addEventListener("touchend",event => {
          const drag=state.drag;
          if(drag?.kind === "touch" && touchWithId(event.changedTouches,drag.id)){
            state.ignoreMouseUntil=Date.now()+1200;
            void finishPhotoDrag(event);
          }
        },{passive:false});
        document.addEventListener("touchcancel",cancelPhotoDrag,{passive:true});
        content.addEventListener("mousedown",event => {
          if(event.button !== 0 || event.ctrlKey || event.metaKey || Date.now()<state.ignoreMouseUntil) return;
          const row=photoRowAt(event.target);
          if(row) startPhotoPress(row,event.clientX,event.clientY,"mouse",0);
        });
        document.addEventListener("mousemove",event => movePhotoDrag(event.clientX,event.clientY,"mouse",0,event));
        document.addEventListener("mouseup",event => {if(state.drag?.kind === "mouse") void finishPhotoDrag(event);});
        content.addEventListener("dragstart",event => event.preventDefault());
        content.addEventListener("contextmenu",event => {if(photoRowAt(event.target)) event.preventDefault();});
        content.addEventListener("click",event => {
          if(Date.now()<state.suppressClickUntil || state.drag?.active || state.settling){
            event.preventDefault();event.stopImmediatePropagation();
          }
        },true);
        content.addEventListener("keydown",event => {
          const row=photoRowAt(event.target);
          if(!row || !event.altKey || !["ArrowUp","ArrowDown"].includes(event.key)) return;
          event.preventDefault();cancelPhotoDrag();
          const rows=photoRows(),at=rows.indexOf(row),dest=at+(event.key === "ArrowUp" ? -1 : 1);
          if(dest<0 || dest>=rows.length) return;
          [rows[at],rows[dest]]=[rows[dest],rows[at]];
          try{
            persistOrder(rows.map(item => item.dataset.favoriteId));
            rows.forEach(item => content.appendChild(item));
            row.querySelector("a").focus({preventScroll:true});
            announce("New favorites order saved.");
          }catch(error){showToast("Could not save the new order.");}
        });
        document.addEventListener("keydown",event => {if(event.key === "Escape") cancelPhotoDrag();});
        window.addEventListener("scroll",() => {if(state.drag && !state.drag.active) cancelPhotoDrag();},{passive:true});
        window.addEventListener("resize",cancelPhotoDrag);
        window.addEventListener("pagehide",cancelPhotoDrag);
        document.addEventListener("visibilitychange",() => {
          if(document.hidden) cancelPhotoDrag();
          else refreshFavorites();
        });
        window.addEventListener("pageshow",event => {if(event.persisted) refreshFavorites();});
        window.addEventListener("storage",event => {
          if(event.key === POS_CIGAR_FAVORITES_KEY || event.key === FAVORITES_ORDER_KEY || event.key === null) refreshFavorites();
        });
      }

      function updateSummary(count){
        if(count <= 0){
          summary.textContent = "No cigar favorites saved yet.";
          clearBtn.hidden = true;
          return;
        }

        summary.textContent = count === 1 ? "1 cigar favorite." : `${count} cigar favorites.`;
        clearBtn.hidden = false;
      }

      async function loadFavorites(){
        if(state.drag || state.settling){ state.refreshQueued = true; return; }
        const token = ++state.loadToken;
        const favorites = orderedFavorites(readFavorites());
        updateSummary(favorites.length);
        if(!favorites.length){
          releasePhotos();
          content.innerHTML = '<div class="empty">No cigar favorites yet.</div>';
          state.visibleIds = [];
          return;
        }

        let catalogError = null;
        if(!state.catalogLoaded){
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 15000);
          try{
            const res = await fetch(SHEET_CSV_URL, {cache:"no-store", signal:controller.signal});
            if(!res.ok) throw new Error(`CSV fetch failed: ${res.status}`);
            state.records = mapRows(parseCSV(await res.text()));
            state.catalogLoaded = true;
          }catch(error){ catalogError = error; }
          finally{ clearTimeout(timeout); }
        }
        if(token !== state.loadToken) return;
        if(state.drag || state.settling){ state.refreshQueued = true; return; }

        releasePhotos();
        const generation = state.renderGeneration;
        const latest = orderedFavorites(readFavorites());
        const seen = new Set();
        const entries = latest.flatMap(favorite => {
          const id = favoriteId(favorite);
          if(!id || seen.has(id)) return [];
          seen.add(id);
          const record = findRecordByFavorite(state.records, favorite) || recordFromFavorite(favorite);
          return [{record, favorite, id}];
        });
        content.replaceChildren();
        state.visibleIds = entries.map(entry => entry.id);
        entries.forEach(({record, favorite, id}) => {
          const row = createRow(record, favorite, id);
          content.appendChild(row);
          void loadCigarPhoto(row, record, favorite, generation);
        });
        updateSummary(entries.length);
        if(!entries.length) content.innerHTML = '<div class="empty">No cigar favorites yet.</div>';
        if(catalogError){
          console.warn("[pos favorites] Catalog unavailable:", catalogError);
          announce("The cigar catalog could not be loaded. Saved favorites have not been changed.");
        }
      }

      function refreshFavorites(){
        loadFavorites().catch(error => {
          console.warn("[pos favorites] Load error:", error);
          summary.textContent = "Could not load favorites.";
          // Do not erase stored favorites, even on a network/storage failure.
          if(!content.querySelector(".favorite-photo-row")) content.innerHTML = '<div class="error">Could not read favorites. Please reload. Your saved data has not been cleared.</div>';
          announce(error.message || "Could not load favorites.");
        });
      }

      function applyTheme(theme){
        const next = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        $("#theme-toggle")?.setAttribute("aria-pressed", String(next === "dark"));
      }

      document.addEventListener("click", (e) => {
        const target = e.target;
        if(!(target instanceof Element)) return;

        if(target.closest("[data-action-close]")){
          closeActionSheet();
          return;
        }

        if(target.closest("[data-qty-plus='single']")){
          state.singleQty += 1;
          updateActionSheet();
          return;
        }

        if(target.closest("[data-qty-minus='single']")){
          state.singleQty = Math.max(0, state.singleQty - 1);
          updateActionSheet();
          return;
        }

        if(target.closest("[data-qty-plus='box']")){
          state.boxQty += 1;
          updateActionSheet();
          return;
        }

        if(target.closest("[data-qty-minus='box']")){
          state.boxQty = Math.max(0, state.boxQty - 1);
          updateActionSheet();
          return;
        }

        if(target.closest("#actionAddBtn")){
          addActionItemsToCart();
          return;
        }

        if(target.closest("#actionFavoriteBtn")){
          if(!state.actionRow) return;

          removeFavorite(state.actionRow);
          showToast("Removed from Favorites");
          closeActionSheet();

          window.setTimeout(() => {
            loadFavorites().catch(() => {
              content.innerHTML = `<div class="error">Error loading favorites.</div>`;
            });
          }, 160);
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme =
          localStorage.getItem("theme") ||
          document.documentElement.getAttribute("data-theme") ||
          "light";

        applyTheme(savedTheme);

        $("#theme-toggle")?.addEventListener("click", () => {
          applyTheme(
            (document.documentElement.getAttribute("data-theme") || "light") === "dark"
              ? "light"
              : "dark"
          );
        });

        $("#cbSearchBtn")?.addEventListener("click", () => {
          if(typeof window.openGlobalSearch === "function"){
            window.openGlobalSearch();
          }
        });

        clearBtn?.addEventListener("click", () => {
          cancelPhotoDrag();
          try{
            writeFavorites([]);
            refreshFavorites();
          }catch(error){ showToast("Could not clear favorites. Please allow browser storage."); }
        });

        ensureActionSheet();

        bindPhotoInteractions();
        refreshFavorites();
      });
    })();
  </script>
</body>
</html>
