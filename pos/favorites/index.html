<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Favorites</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css?v=36" />

  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --bg:#eef3fb;
      --bg2:#f7f9fd;
      --glass:rgba(255,255,255,.70);
      --glass2:rgba(255,255,255,.58);
      --glass3:rgba(255,255,255,.42);
      --stroke:rgba(15,23,42,.08);
      --stroke-soft:rgba(15,23,42,.05);
      --text:#0b1220;
      --muted:rgba(11,18,32,.62);
      --muted2:rgba(11,18,32,.46);
      --shadow:0 18px 40px rgba(15,23,42,.10);
      --shadow-soft:0 10px 22px rgba(15,23,42,.08);
      --glow:rgba(118,157,255,.12);
      --green:#34c759;
      --blue:#3b82f6;
    }

    html[data-theme="dark"]{
      --bg:#071b33;
      --bg2:#0b2a4f;
      --glass:rgba(255,255,255,.09);
      --glass2:rgba(255,255,255,.07);
      --glass3:rgba(255,255,255,.05);
      --stroke:rgba(255,255,255,.12);
      --stroke-soft:rgba(255,255,255,.08);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --muted2:rgba(255,255,255,.50);
      --shadow:0 22px 60px rgba(0,0,0,.34);
      --shadow-soft:0 12px 28px rgba(0,0,0,.22);
      --glow:rgba(59,130,246,.22);
      --green:#34c759;
      --blue:#4c7cff;
    }

    *{box-sizing:border-box;}
    html,body{min-height:100%;margin:0;}

    body.favorites-page{
      color:var(--text);
      font-family:var(--font-sans);
      background:
        radial-gradient(1200px 700px at 18% 0%, rgba(80,132,255,.10), transparent 58%),
        radial-gradient(900px 620px at 100% 10%, rgba(61,201,255,.05), transparent 54%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      background-attachment:fixed;
    }

    html[data-theme="dark"] body.favorites-page{
      background:
        radial-gradient(1200px 700px at 15% 5%, rgba(72,117,210,.30), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(0,185,255,.10), transparent 55%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
      background-attachment:fixed;
    }

    .glass-surface{
      position:relative;
      overflow:hidden;
      backdrop-filter:blur(24px) saturate(1.14);
      -webkit-backdrop-filter:blur(24px) saturate(1.14);
    }

    .glass-surface::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 0 1px var(--stroke-soft);
    }

    .favorites-topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:grid;
      grid-template-columns:42px 1fr 52px;
      align-items:center;
      width:min(430px, calc(100% - 28px));
      margin:0 auto;
      padding:calc(10px + var(--safe-top)) 0 18px;
    }

    .favorites-back{
      position:relative;
      width:42px;
      height:42px;
      border:0;
      padding:0;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.05);
      color:var(--text);
      border-radius:999px;
      box-shadow:0 12px 28px rgba(0,0,0,.22);
      cursor:pointer;
      appearance:none;
      -webkit-tap-highlight-color:transparent;
    }

    .favorites-back svg{
      width:22px;
      height:22px;
      display:block;
    }

    .favorites-theme-dock{
      display:flex;
      justify-content:flex-end;
    }

    #theme-toggle{
      position:relative;
      width:52px;
      height:32px;
      border:0;
      padding:0;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      box-shadow:0 12px 28px rgba(0,0,0,.22);
      cursor:pointer;
      appearance:none;
      -webkit-tap-highlight-color:transparent;
    }

    #theme-toggle .knob{
      position:absolute;
      top:3px;
      left:3px;
      width:26px;
      height:26px;
      border-radius:999px;
      background:transparent;
      transition:transform .25s ease;
      display:grid;
      place-items:center;
    }

    #theme-toggle .icon-sun,
    #theme-toggle .icon-moon{
      position:absolute;
      width:26px;
      height:26px;
      display:block;
    }

    #theme-toggle .icon-sun{
      color:#ffcc00;
      display:block;
    }

    #theme-toggle .icon-moon{
      color:#fff4b8;
      display:none;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
    }

    html[data-theme="dark"] #theme-toggle .knob{
      transform:translateX(20px);
    }

    html[data-theme="dark"] #theme-toggle .icon-sun{
      display:none;
    }

    html[data-theme="dark"] #theme-toggle .icon-moon{
      display:block;
    }

    html[data-theme="light"] .favorites-back,
    html[data-theme="light"] #theme-toggle{
      color:#101828;
      background:rgba(255,255,255,.82);
      box-shadow:0 10px 24px rgba(15,26,44,.08);
    }

    .favorites-main{
      width:min(430px, calc(100% - 22px));
      margin:0 auto;
      padding:0 0 calc(118px + var(--safe-bottom));
    }

    .page-title{
      margin:8px 2px 10px;
      font-family:var(--font-display);
      font-size:56px;
      font-weight:900;
      letter-spacing:-.065em;
      line-height:.90;
      color:var(--text);
    }

    .summary{
      margin:0 2px 18px;
      color:var(--muted2);
      font-family:var(--font-display);
      font-size:15px;
      font-weight:600;
    }

    .favorites-actions{
      display:flex;
      justify-content:flex-end;
      margin:0 2px 12px;
    }

    .clear-btn{
      height:38px;
      padding:0 14px;
      border:0;
      border-radius:999px;
      background:var(--glass2);
      color:var(--muted);
      box-shadow:var(--shadow-soft);
      font-family:var(--font-display);
      font-size:13px;
      font-weight:750;
      cursor:pointer;
      appearance:none;
    }

    .clear-btn[hidden]{
      display:none !important;
    }

    .brand-list{
      padding:8px 2px 0;
    }

    .brand-row{
      position:relative;
      display:grid;
      grid-template-columns:56px minmax(0,1fr) 84px;
      align-items:center;
      gap:12px;
      padding:14px 12px;
      border-radius:24px;
      background:var(--glass2);
      box-shadow:var(--shadow-soft);
      margin-bottom:10px;
      isolation:isolate;
      text-decoration:none;
      color:inherit;
    }

    .brand-row::after{
      content:"";
      position:absolute;
      right:-18px;
      bottom:-18px;
      width:110px;
      height:110px;
      border-radius:50%;
      background:radial-gradient(circle, var(--glow) 0%, transparent 68%);
      pointer-events:none;
      z-index:0;
    }

    .brand-row > *{
      position:relative;
      z-index:1;
    }

    .row-ico{
      width:56px;
      height:56px;
      border-radius:16px;
      object-fit:cover;
      background:transparent;
      padding:0;
      border:none;
      box-shadow:none;
    }

    .brand-row-left{
      min-width:0;
      cursor:pointer;
    }

    .brand-row-title{
      font-family:var(--font-display);
      font-size:17px;
      font-weight:750;
      letter-spacing:-.02em;
      color:var(--text);
      line-height:1.04;
    }

    .brand-row-sub{
      display:block;
      margin-top:4px;
      font-family:var(--font-display);
      font-size:14px;
      font-weight:500;
      line-height:1.1;
      letter-spacing:-.01em;
      color:var(--muted2);
    }

    .brand-row-right{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
      width:78px;
      min-width:78px;
    }

    .brand-row-msrp{
      font-family:var(--font-display);
      font-size:18px;
      font-weight:700;
      letter-spacing:-.03em;
      line-height:1;
      color:var(--text);
    }

    .qty-btn{
      width:26px;
      height:26px;
      border-radius:999px;
      border:0;
      background:var(--green);
      color:#fff;
      display:grid;
      place-items:center;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      appearance:none;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 8px 16px rgba(0,0,0,.18);
    }

    .empty,
    .loading,
    .error{
      padding:24px 12px;
      text-align:center;
      color:var(--muted);
      font-family:var(--font-display);
      font-size:18px;
      font-weight:700;
    }

    .cigars-bottom-bar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:1000;
      pointer-events:none;
      padding:0 12px calc(10px + var(--safe-bottom));
    }

    .cigars-bottom-bar-inner{
      width:min(430px, 100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:8px;
      padding:10px;
      border-radius:26px;
      border:1px solid var(--stroke);
      background:var(--glass);
      box-shadow:var(--shadow);
      backdrop-filter:blur(26px) saturate(1.12);
      -webkit-backdrop-filter:blur(26px) saturate(1.12);
      pointer-events:auto;
    }

    .cb-nav-btn{
      min-height:54px;
      border-radius:18px;
      border:0;
      background:transparent;
      text-decoration:none;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:10px;
      font-weight:800;
      letter-spacing:.02em;
      text-transform:uppercase;
      cursor:pointer;
      appearance:none;
      position:relative;
    }

    .cb-nav-icon{
      width:22px;
      height:22px;
      display:block;
      object-fit:contain;
    }

    .cb-nav-btn.is-active{
      background:rgba(255,255,255,.08);
    }

    html[data-theme="light"] .cb-nav-btn.is-active{
      background:rgba(15,23,40,.05);
    }

    .pos-action-sheet{
      position:fixed;
      inset:0;
      z-index:5000;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:18px 14px calc(18px + var(--safe-bottom));
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease;
    }

    .pos-action-sheet[hidden]{
      display:none !important;
    }

    .pos-action-sheet.is-open{
      opacity:1;
      pointer-events:auto;
    }

    .pos-action-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.34);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .pos-action-card{
      position:relative;
      z-index:1;
      width:min(430px, 100%);
      border-radius:30px;
      padding:22px 18px 18px;
      background:rgba(255,255,255,.94);
      color:#0b1220;
      border:1px solid rgba(255,255,255,.70);
      box-shadow:0 24px 70px rgba(0,0,0,.30);
      transform:translateY(22px);
      transition:transform .22s cubic-bezier(.2,.9,.2,1);
    }

    .pos-action-sheet.is-open .pos-action-card{
      transform:translateY(0);
    }

    .pos-action-title{
      font-family:var(--font-display);
      font-size:28px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.045em;
      text-align:center;
      margin:0 0 22px;
      color:#0b1220;
    }

    .pos-action-lines{
      display:grid;
      gap:16px;
    }

    .pos-action-line{
      padding:14px 14px 12px;
      border-radius:22px;
      background:rgba(15,26,44,.045);
      border:1px solid rgba(15,26,44,.07);
    }

    .pos-action-line-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .pos-action-label{
      font-family:var(--font-display);
      font-size:22px;
      line-height:1;
      font-weight:850;
      letter-spacing:-.035em;
      color:#0b1220;
    }

    .pos-action-stepper{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:13px;
      font-family:var(--font-display);
      font-weight:900;
      color:#0b1220;
    }

    .pos-action-stepper button{
      width:32px;
      height:32px;
      border:0;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:#0b1220;
      color:#fff;
      font-size:20px;
      line-height:1;
      font-weight:800;
      cursor:pointer;
      appearance:none;
    }

    .pos-action-stepper span{
      min-width:24px;
      text-align:center;
      font-size:22px;
      line-height:1;
      font-weight:900;
    }

    .pos-action-line-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding-top:10px;
      font-family:var(--font-display);
      font-size:17px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.02em;
      color:rgba(11,18,32,.64);
    }

    .pos-action-line-bottom span:last-child{
      color:#0b1220;
    }

    .pos-action-total{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:18px 2px 16px;
      font-family:var(--font-display);
      font-size:22px;
      line-height:1;
      font-weight:850;
      letter-spacing:-.035em;
      color:#0b1220;
    }

    .pos-action-total strong{
      font-size:24px;
      font-weight:950;
    }

    .pos-action-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .pos-action-buttons button,
    .pos-action-favorite{
      height:52px;
      border:0;
      border-radius:18px;
      font-family:var(--font-display);
      font-size:18px;
      font-weight:850;
      cursor:pointer;
      appearance:none;
    }

    .pos-action-cancel{
      background:rgba(15,26,44,.07);
      color:#0b1220;
    }

    .pos-action-add{
      background:#34c759;
      color:#fff;
      box-shadow:0 12px 24px rgba(52,199,89,.24);
    }

    .pos-action-favorite{
      width:100%;
      margin-top:12px;
      background:rgba(255,204,0,.18);
      color:#0b1220;
    }

    .pos-action-favorite.is-saved{
      background:rgba(52,199,89,.16);
      color:#168034;
    }

    .pos-toast{
      position:fixed;
      left:50%;
      bottom:calc(104px + var(--safe-bottom));
      z-index:7000;
      transform:translate(-50%, 12px);
      opacity:0;
      pointer-events:none;
      padding:12px 16px;
      border-radius:999px;
      background:rgba(11,18,32,.92);
      color:#fff;
      font-family:var(--font-display);
      font-size:14px;
      font-weight:800;
      box-shadow:0 12px 26px rgba(0,0,0,.28);
      transition:opacity .18s ease, transform .18s ease;
    }

    .pos-toast.is-showing{
      opacity:1;
      transform:translate(-50%, 0);
    }

    @media (max-width:390px){
      .favorites-topbar{
        grid-template-columns:40px 1fr 50px;
        width:calc(100% - 18px);
      }

      .favorites-back{
        width:40px;
        height:40px;
      }

      #theme-toggle{
        width:50px;
        height:30px;
      }

      #theme-toggle .knob{
        width:24px;
        height:24px;
      }

      #theme-toggle .icon-sun,
      #theme-toggle .icon-moon{
        width:24px;
        height:24px;
      }

      html[data-theme="dark"] #theme-toggle .knob{
        transform:translateX(20px);
      }

      .favorites-main{
        width:calc(100% - 18px);
      }

      .page-title{
        font-size:46px;
      }

      .brand-row{
        grid-template-columns:52px minmax(0,1fr) 72px;
        padding:12px;
        border-radius:20px;
        margin-bottom:9px;
      }

      .row-ico{
        width:52px;
        height:52px;
      }

      .brand-row-sub{
        font-size:13px;
      }

      .brand-row-msrp{
        font-size:17px;
      }

      .qty-btn{
        width:24px;
        height:24px;
        font-size:15px;
      }

      .brand-row-right{
        width:72px;
        min-width:72px;
      }
    }
  </style>
</head>

<body class="favorites-page">
  <header class="favorites-topbar">
    <button
      type="button"
      class="favorites-back glass-surface"
      aria-label="Back"
      onclick="history.length > 1 ? history.back() : window.location.href='/pos/cigars/'"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <div aria-hidden="true"></div>

    <div class="favorites-theme-dock">
      <button id="theme-toggle" class="glass-surface" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="knob" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23 5.46 5.46"></path>
            </g>
          </svg>
          <img class="icon-moon" src="/uxui/moon.svg" alt="" />
        </span>
      </button>
    </div>
  </header>

  <main class="favorites-main">
    <h1 class="page-title">Favorites</h1>
    <div class="summary" id="favoritesSummary">Loading favorites…</div>

    <div class="favorites-actions">
      <button class="clear-btn" id="clearFavoritesBtn" type="button" hidden>Clear All</button>
    </div>

    <section class="brand-list" id="favoritesContent">
      <div class="loading">Loading favorites…</div>
    </section>
  </main>

  <nav class="cigars-bottom-bar" aria-label="Primary">
    <div class="cigars-bottom-bar-inner">
      <button type="button" class="cb-nav-btn" id="cbSearchBtn" aria-label="Search">
        <img class="cb-nav-icon" src="/uxui/bottombar/search.svg" alt="" />
        <span>Search</span>
      </button>

      <a class="cb-nav-btn" href="/" aria-label="Home">
        <img class="cb-nav-icon" src="/uxui/bottombar/home.svg" alt="" />
        <span>Home</span>
      </a>

      <a class="cb-nav-btn is-active" href="/pos/favorites/" aria-label="Favorites">
        <img class="cb-nav-icon" src="/uxui/bottombar/favorites.svg" alt="" />
        <span>Favorites</span>
      </a>

      <a class="cb-nav-btn" href="/pos/invoice/" aria-label="Cart">
        <img class="cb-nav-icon" src="/uxui/bottombar/cart.svg" alt="" />
        <span>Cart</span>
      </a>
    </div>
  </nav>

  <script src="/pos/cart.js?v=35" defer></script>
  <script src="/pos/pos.js?v=35" defer></script>

  <script>
    (() => {
      "use strict";

      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/10-5j7vKT123WtNhqLynxX3n9BXpb1VlKcuPZHj9YxdM/gviz/tq?tqx=out:csv";

      const POS_CIGAR_FAVORITES_KEY = "cigaros_pos_favorites_cigars";

      const $ = (sel, root = document) => root.querySelector(sel);

      const content = $("#favoritesContent");
      const summary = $("#favoritesSummary");
      const clearBtn = $("#clearFavoritesBtn");

      const state = {
        records: [],
        actionRow: null,
        singleQty: 1,
        boxQty: 0,
      };

      function norm(v){
        return String(v ?? "").trim().replace(/\s+/g, " ");
      }

      function esc(s){
        return String(s ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function normalizeHeader(h){
        return String(h || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, " ")
          .replace(/[^a-z0-9 ]/g, "")
          .replace(/ /g, "_");
      }

      function normalizeBrand(v){
        return String(v || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, "and")
          .replace(/[^a-z0-9]+/g, "");
      }

      function normalizeLoose(v){
        return String(v || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, " and ")
          .replace(/["'’]/g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function normalizeAssetPath(path){
        const value = String(path || "").trim();
        if(!value) return "";
        if(/^https?:\/\//i.test(value)) return value;
        return value.startsWith("/") ? value : `/${value}`;
      }

      function parseCSV(text){
        const rows = [];
        let cur = [];
        let field = "";
        let inQuotes = false;

        for(let i = 0; i < text.length; i++){
          const ch = text[i];
          const next = text[i + 1];

          if(inQuotes){
            if(ch === '"' && next === '"'){
              field += '"';
              i++;
            }else if(ch === '"'){
              inQuotes = false;
            }else{
              field += ch;
            }
          }else{
            if(ch === '"') inQuotes = true;
            else if(ch === ","){
              cur.push(field);
              field = "";
            }else if(ch === "\n"){
              cur.push(field);
              rows.push(cur);
              cur = [];
              field = "";
            }else if(ch !== "\r"){
              field += ch;
            }
          }
        }

        cur.push(field);
        rows.push(cur);
        return rows;
      }

      function mapRows(csv){
        const headers = csv[0] || [];
        const keys = headers.map(normalizeHeader);

        return csv.slice(1)
          .filter((r) => r && !r.every((c) => !String(c || "").trim()))
          .map((r) => {
            const obj = {};
            keys.forEach((k, i) => {
              obj[k] = (r[i] ?? "").trim();
            });
            return obj;
          });
      }

      function getField(r, keys){
        for(const k of keys){
          if(r && r[k] != null && String(r[k]).trim() !== ""){
            return String(r[k]).trim();
          }
        }
        return "";
      }

      function resolveBrandVal(r){
        return getField(r, ["brand", "brand_name", "manufacturer_brand", "cigar_brand"]);
      }

      function resolveManufacturerVal(r){
        return getField(r, ["manufacturer", "maker"]);
      }

      function resolveLine(r){
        return getField(r, ["line", "series"]);
      }

      function resolveName(r){
        return getField(r, ["cigar", "name"]);
      }

      function resolveVitola(r){
        return getField(r, ["vitola", "style", "vitola_name", "size"]);
      }

      function resolveRing(r){
        return getField(r, ["ring", "ring_gauge", "rg"]);
      }

      function resolveLength(r){
        return getField(r, ["length"]);
      }

      function resolveShape(r){
        return getField(r, ["shape"]);
      }

      function resolveWrapper(r){
        return getField(r, ["wrapper"]);
      }

      function resolveBinder(r){
        return getField(r, ["binder"]);
      }

      function resolveFiller(r){
        return getField(r, ["filler"]);
      }

      function resolveOrigin(r){
        return getField(r, ["origin", "country_of_origin", "country"]);
      }

      function resolveStrength(r){
        return getField(r, ["strength"]);
      }

      function resolveShade(r){
        return getField(r, ["wrapper_shade", "wrapper_shade_type", "shade", "wrapper"]);
      }

      function resolveBrandImage(r){
        return getField(r, ["brand_img", "brand_image", "brandicon", "brand_icon"]);
      }

      function resolveLineImage(r){
        return getField(r, ["line_img", "line_image", "lineicon", "line_icon", "brand_line_img"]);
      }

      function resolveDetailKey(r){
        return getField(r, ["key", "cigar_id", "id", "row_id"]);
      }

      function resolveDisplayName(r){
        const line = resolveLine(r);
        const cigar = resolveName(r);
        return [line, cigar].filter(Boolean).join(" ").trim() || cigar || line || "";
      }

      function resolveFavoriteKey(r){
        return (
          resolveDetailKey(r) ||
          [resolveBrandVal(r), resolveLine(r), resolveName(r), resolveVitola(r)]
            .filter(Boolean)
            .join("|")
        );
      }

      function resolvePriceNumber(r){
        const raw = getField(r, ["msrp", "cigar_msrp", "cigar_retail"]);
        const n = Number(String(raw || "").replace(/[^0-9.-]/g, ""));
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      function resolvePrice(r){
        const n = resolvePriceNumber(r);
        return n > 0 ? n.toFixed(2) : "—";
      }

      function resolveBoxCount(r){
        const raw = getField(r, ["box_count", "box_qty", "box_quantity", "count_per_box"]);
        const n = Number(String(raw || "").replace(/[^0-9.]/g, ""));
        return Number.isFinite(n) && n > 0 ? n : 20;
      }

      function resolveBoxMsrpNumber(r){
        const raw = getField(r, ["box_msrp", "box_price", "box_retail"]);
        const n = Number(String(raw || "").replace(/[^0-9.-]/g, ""));
        if(Number.isFinite(n) && n > 0) return n;
        return resolvePriceNumber(r) * resolveBoxCount(r);
      }

      function makeDetailHref(r){
        const detailKey = resolveDetailKey(r);
        if(detailKey) return `/pos/cigars/cigar.html?key=${encodeURIComponent(detailKey)}`;

        const fallbackKey = [resolveBrandVal(r), resolveDisplayName(r), resolveVitola(r)]
          .filter(Boolean)
          .join("|");

        return `/pos/cigars/cigar.html?key=${encodeURIComponent(fallbackKey)}`;
      }

      function buildBrandIconCandidates(r){
        const brandImg = normalizeAssetPath(resolveBrandImage(r));
        const brand = normalizeBrand(resolveBrandVal(r));
        const out = [];

        if(brandImg) out.push(brandImg);
        if(brand){
          out.push(`/img/icons/brands/${brand}.svg`);
          out.push(`/img/icons/brands/${brand}.png`);
        }

        return Array.from(new Set(out.filter(Boolean)));
      }

      function rowIconCandidatesForRow(r){
        const lineImg = normalizeAssetPath(resolveLineImage(r));
        const brandImg = normalizeAssetPath(resolveBrandImage(r));
        return Array.from(new Set([lineImg, brandImg, ...buildBrandIconCandidates(r)].filter(Boolean)));
      }

      function bindImageFallback(img, candidates){
        if(!img) return;

        const list = Array.from(new Set(candidates.filter(Boolean)));
        let idx = 0;

        img.onerror = () => {
          idx++;
          if(idx < list.length){
            img.src = list[idx];
          }else{
            img.onerror = null;
            img.style.visibility = "hidden";
          }
        };

        if(list[0]) img.src = list[0];
        else img.style.visibility = "hidden";
      }

      function readFavorites(){
        try{
          const raw = JSON.parse(localStorage.getItem(POS_CIGAR_FAVORITES_KEY) || "[]");
          return Array.isArray(raw) ? raw : [];
        }catch{
          return [];
        }
      }

      function writeFavorites(items){
        localStorage.setItem(POS_CIGAR_FAVORITES_KEY, JSON.stringify(items));
      }

      function findRecordByFavorite(records, fav){
        const key = String(fav?.key || fav || "").trim();
        if(!key) return null;

        const loose = normalizeLoose(key);

        return records.find((r) => {
          const candidates = [
            resolveFavoriteKey(r),
            resolveDetailKey(r),
            [resolveBrandVal(r), resolveLine(r), resolveName(r), resolveVitola(r)].filter(Boolean).join("|"),
            [resolveBrandVal(r), resolveLine(r), resolveName(r), resolveVitola(r)].filter(Boolean).join(" "),
            [resolveLine(r), resolveName(r)].filter(Boolean).join(" "),
            resolveDisplayName(r),
          ].filter(Boolean);

          return candidates.some((c) => String(c).trim() === key || normalizeLoose(c) === loose);
        }) || null;
      }

      function isFavorite(r){
        const key = resolveFavoriteKey(r);
        return readFavorites().some((item) => item && item.key === key);
      }

      function removeFavorite(r){
        const key = resolveFavoriteKey(r);
        writeFavorites(readFavorites().filter((item) => item && item.key !== key));
      }

      function showToast(message){
        let toast = document.querySelector(".pos-toast");

        if(!toast){
          toast = document.createElement("div");
          toast.className = "pos-toast";
          document.body.appendChild(toast);
        }

        toast.textContent = message;
        toast.classList.add("is-showing");

        window.clearTimeout(toast.__timer);
        toast.__timer = window.setTimeout(() => {
          toast.classList.remove("is-showing");
        }, 1300);
      }

      function money(n){
        const num = Number(n || 0);
        return Number.isFinite(num) ? num.toFixed(2) : "0.00";
      }

      function buildCartItem(r, type = "stick"){
        const isBox = type === "box";
        const unitPrice = isBox ? resolveBoxMsrpNumber(r) : resolvePriceNumber(r);
        const detailKey = resolveDetailKey(r);

        return {
          key: `${detailKey || `${normalizeBrand(resolveBrandVal(r))}|${resolveDisplayName(r)}|${resolveVitola(r)}`}|${type}`,
          type: "cigar",
          purchaseType: type,
          category: "Cigars",
          id: detailKey || resolveName(r),
          brand: resolveBrandVal(r),
          manufacturer: resolveManufacturerVal(r),
          line: resolveLine(r),
          cigar: resolveName(r),
          name: `${resolveDisplayName(r)}${isBox ? " (Box)" : ""}`,
          displayName: resolveDisplayName(r),
          vitola: resolveVitola(r),
          ring: resolveRing(r),
          length: resolveLength(r),
          shape: resolveShape(r),
          wrapper: resolveWrapper(r),
          binder: resolveBinder(r),
          filler: resolveFiller(r),
          origin: resolveOrigin(r),
          shade: resolveShade(r),
          strength: resolveStrength(r),
          image: rowIconCandidatesForRow(r)[0] || "",
          msrp: unitPrice,
          boxCount: resolveBoxCount(r),
          url: makeDetailHref(r),
        };
      }

      function ensureActionSheet(){
        if($("#pos-action-sheet")) return;

        const sheet = document.createElement("div");
        sheet.id = "pos-action-sheet";
        sheet.className = "pos-action-sheet";
        sheet.hidden = true;

        sheet.innerHTML = `
          <div class="pos-action-backdrop" data-action-close></div>

          <div class="pos-action-card" role="dialog" aria-modal="true" aria-label="Add cigar">
            <div class="pos-action-title" id="pos-action-title">Cigar</div>

            <div class="pos-action-lines">
              <div class="pos-action-line">
                <div class="pos-action-line-top">
                  <div class="pos-action-label">Single</div>
                  <div class="pos-action-stepper">
                    <button type="button" data-qty-minus="single">−</button>
                    <span id="singleQty">1</span>
                    <button type="button" data-qty-plus="single">+</button>
                  </div>
                </div>
                <div class="pos-action-line-bottom">
                  <span id="singleUnit">0.00</span>
                  <span id="singleTotal">0.00</span>
                </div>
              </div>

              <div class="pos-action-line">
                <div class="pos-action-line-top">
                  <div class="pos-action-label">Box</div>
                  <div class="pos-action-stepper">
                    <button type="button" data-qty-minus="box">−</button>
                    <span id="boxQty">0</span>
                    <button type="button" data-qty-plus="box">+</button>
                  </div>
                </div>
                <div class="pos-action-line-bottom">
                  <span id="boxUnit">0.00</span>
                  <span id="boxTotal">0.00</span>
                </div>
              </div>
            </div>

            <div class="pos-action-total">
              <span>Total:</span>
              <strong id="actionTotal">$0.00</strong>
            </div>

            <div class="pos-action-buttons">
              <button type="button" class="pos-action-cancel" data-action-close>Cancel</button>
              <button type="button" class="pos-action-add" id="actionAddBtn">Add</button>
            </div>

            <button type="button" class="pos-action-favorite is-saved" id="actionFavoriteBtn">
              Saved as Favorite
            </button>
          </div>
        `;

        document.body.appendChild(sheet);
      }

      function updateActionSheet(){
        const r = state.actionRow;
        if(!r) return;

        const singlePrice = resolvePriceNumber(r);
        const boxPrice = resolveBoxMsrpNumber(r);

        $("#singleQty").textContent = String(state.singleQty);
        $("#boxQty").textContent = String(state.boxQty);

        $("#singleUnit").textContent = money(singlePrice);
        $("#singleTotal").textContent = money(singlePrice * state.singleQty);

        $("#boxUnit").textContent = money(boxPrice);
        $("#boxTotal").textContent = money(boxPrice * state.boxQty);

        $("#actionTotal").textContent = `$${money(singlePrice * state.singleQty + boxPrice * state.boxQty)}`;
      }

      function openActionSheet(r){
        ensureActionSheet();

        state.actionRow = r;
        state.singleQty = 1;
        state.boxQty = 0;

        $("#pos-action-title").textContent = resolveDisplayName(r) || "Cigar";

        updateActionSheet();

        const sheet = $("#pos-action-sheet");
        sheet.hidden = false;
        requestAnimationFrame(() => sheet.classList.add("is-open"));
      }

      function closeActionSheet(){
        const sheet = $("#pos-action-sheet");
        if(!sheet) return;

        sheet.classList.remove("is-open");
        window.setTimeout(() => {
          if(!sheet.classList.contains("is-open")) sheet.hidden = true;
        }, 180);
      }

      function addActionItemsToCart(){
        const r = state.actionRow;
        if(!r) return;

        if(state.singleQty > 0){
          const stickItem = buildCartItem(r, "stick");
          const currentQty = window.cigarOSCart?.getItemQty?.(stickItem) || 0;
          window.cigarOSCart?.setQty?.(stickItem, currentQty + state.singleQty);
        }

        if(state.boxQty > 0){
          const boxItem = buildCartItem(r, "box");
          const currentQty = window.cigarOSCart?.getItemQty?.(boxItem) || 0;
          window.cigarOSCart?.setQty?.(boxItem, currentQty + state.boxQty);
        }

        showToast("Added to invoice");
        closeActionSheet();
      }

      function createRow(r){
        const iconCandidates = rowIconCandidatesForRow(r);
        const row = document.createElement("article");

        row.className = "brand-row";
        row.innerHTML = `
          <img class="row-ico" src="${esc(iconCandidates[0] || "")}" alt="" loading="lazy" decoding="async" />

          <div class="brand-row-left">
            <div class="brand-row-title">${esc(resolveDisplayName(r) || "Unnamed cigar")}</div>
            <div class="brand-row-sub">${esc(resolveVitola(r) || "—")}</div>
          </div>

          <div class="brand-row-right">
            <div class="brand-row-msrp">${esc(resolvePrice(r))}</div>
            <button class="qty-btn qty-btn--plus" type="button" aria-label="Open add menu">+</button>
          </div>
        `;

        const icon = $(".row-ico", row);
        const left = $(".brand-row-left", row);
        const plus = $(".qty-btn--plus", row);

        bindImageFallback(icon, iconCandidates);

        icon?.addEventListener("click", () => {
          window.location.href = makeDetailHref(r);
        });

        left?.addEventListener("click", () => {
          window.location.href = makeDetailHref(r);
        });

        plus?.addEventListener("click", (e) => {
          e.stopPropagation();
          openActionSheet(r);
        });

        return row;
      }

      function updateSummary(count){
        if(count <= 0){
          summary.textContent = "No cigar favorites saved yet.";
          clearBtn.hidden = true;
          return;
        }

        summary.textContent = count === 1 ? "1 cigar favorite." : `${count} cigar favorites.`;
        clearBtn.hidden = false;
      }

      async function loadFavorites(){
        const favorites = readFavorites();

        updateSummary(favorites.length);

        if(!favorites.length){
          content.innerHTML = `<div class="empty">No cigar favorites yet.</div>`;
          return;
        }

        const res = await fetch(SHEET_CSV_URL, { cache:"no-store" });
        if(!res.ok) throw new Error(`CSV fetch failed: ${res.status}`);

        const text = await res.text();
        state.records = mapRows(parseCSV(text));

        const found = favorites
          .map((fav) => findRecordByFavorite(state.records, fav))
          .filter(Boolean);

        updateSummary(found.length);

        if(!found.length){
          content.innerHTML = `<div class="empty">Favorites were saved, but no matching cigars were found in the current sheet.</div>`;
          return;
        }

        content.innerHTML = "";
        found.forEach((r) => content.appendChild(createRow(r)));
      }

      function applyTheme(theme){
        const next = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        $("#theme-toggle")?.setAttribute("aria-pressed", String(next === "dark"));
      }

      document.addEventListener("click", (e) => {
        const target = e.target;
        if(!(target instanceof Element)) return;

        if(target.closest("[data-action-close]")){
          closeActionSheet();
          return;
        }

        if(target.closest("[data-qty-plus='single']")){
          state.singleQty += 1;
          updateActionSheet();
          return;
        }

        if(target.closest("[data-qty-minus='single']")){
          state.singleQty = Math.max(0, state.singleQty - 1);
          updateActionSheet();
          return;
        }

        if(target.closest("[data-qty-plus='box']")){
          state.boxQty += 1;
          updateActionSheet();
          return;
        }

        if(target.closest("[data-qty-minus='box']")){
          state.boxQty = Math.max(0, state.boxQty - 1);
          updateActionSheet();
          return;
        }

        if(target.closest("#actionAddBtn")){
          addActionItemsToCart();
          return;
        }

        if(target.closest("#actionFavoriteBtn")){
          if(!state.actionRow) return;

          removeFavorite(state.actionRow);
          showToast("Removed from Favorites");
          closeActionSheet();

          window.setTimeout(() => {
            loadFavorites().catch(() => {
              content.innerHTML = `<div class="error">Error loading favorites.</div>`;
            });
          }, 160);
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme =
          localStorage.getItem("theme") ||
          document.documentElement.getAttribute("data-theme") ||
          "light";

        applyTheme(savedTheme);

        $("#theme-toggle")?.addEventListener("click", () => {
          applyTheme(
            (document.documentElement.getAttribute("data-theme") || "light") === "dark"
              ? "light"
              : "dark"
          );
        });

        $("#cbSearchBtn")?.addEventListener("click", () => {
          if(typeof window.openGlobalSearch === "function"){
            window.openGlobalSearch();
          }
        });

        clearBtn?.addEventListener("click", () => {
          writeFavorites([]);
          updateSummary(0);
          content.innerHTML = `<div class="empty">No cigar favorites yet.</div>`;
        });

        ensureActionSheet();

        loadFavorites().catch((err) => {
          console.warn("[pos favorites] load error:", err);
          content.innerHTML = `<div class="error">Error loading favorites.</div>`;
          summary.textContent = "Could not load favorites.";
        });
      });
    })();
  </script>
</body>
</html>
