<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Favorites</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/uxui/topbar/topbar.css" />

  <style>
    :root{
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bg:#eff2f7;
      --ink:#101828;
      --muted:rgba(16,24,40,.58);

      --surface:rgba(255,255,255,.92);
      --surface-border:rgba(15,23,40,.08);
      --surface-shadow:0 12px 30px rgba(15,26,44,.08);

      --row-bg:rgba(255,255,255,.96);
      --row-border:rgba(15,23,40,.08);
      --row-shadow:0 8px 18px rgba(15,26,44,.06);

      --pill-bg:rgba(16,24,40,.05);
      --pill-border:rgba(16,24,40,.08);

      --danger:#e11d48;
      --accent:#0f7aff;
    }

    html[data-theme="dark"]{
      --bg:
        radial-gradient(1200px 540px at 50% -8%, rgba(63,108,194,.22) 0%, rgba(20,44,92,.16) 28%, rgba(4,13,34,0) 58%),
        linear-gradient(180deg, #0f2856 0%, #07142f 48%, #041027 100%);
      --ink:#ffffff;
      --muted:rgba(255,255,255,.64);

      --surface:rgba(13,21,39,.58);
      --surface-border:rgba(255,255,255,.12);
      --surface-shadow:0 12px 34px rgba(0,0,0,.26);

      --row-bg:rgba(13,21,39,.66);
      --row-border:rgba(255,255,255,.10);
      --row-shadow:0 10px 22px rgba(0,0,0,.18);

      --pill-bg:rgba(255,255,255,.06);
      --pill-border:rgba(255,255,255,.10);

      --danger:#ff4d73;
      --accent:#5aa7ff;
    }

    *{ box-sizing:border-box; }
    html, body{ margin:0; min-height:100%; }

    body{
      min-height:100dvh;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .wrap{
      width:min(430px, calc(100% - 28px));
      margin:0 auto;
      padding:6px 0 calc(34px + var(--safe-bottom));
    }

    .page-title{
      margin:8px 2px 18px;
      font-family:var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size:58px;
      line-height:.92;
      font-weight:800;
      letter-spacing:-.05em;
      color:var(--ink);
    }

    .card{
      border-radius:24px;
      background:var(--surface);
      border:1px solid var(--surface-border);
      box-shadow:var(--surface-shadow);
      padding:18px 16px;
    }

    .empty,
    .loading,
    .error{
      font-size:15px;
      line-height:1.45;
      color:var(--muted);
      font-weight:600;
    }

    .fav-list{
      display:grid;
      gap:12px;
    }

    .fav-row{
      display:grid;
      grid-template-columns:72px minmax(0, 1fr) auto;
      gap:12px;
      align-items:center;
      padding:12px;
      border-radius:22px;
      background:var(--row-bg);
      border:1px solid var(--row-border);
      box-shadow:var(--row-shadow);
      text-decoration:none;
      color:inherit;
      -webkit-tap-highlight-color:transparent;
    }

    .fav-thumb-wrap{
      width:72px;
      height:94px;
      border-radius:18px;
      background:var(--pill-bg);
      border:1px solid var(--pill-border);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }

    .fav-thumb{
      max-width:54px;
      max-height:82px;
      width:auto;
      height:auto;
      display:block;
      object-fit:contain;
    }

    .fav-thumb-placeholder{
      font-size:12px;
      line-height:1.2;
      text-align:center;
      font-weight:700;
      color:var(--muted);
      padding:8px;
    }

    .fav-main{
      min-width:0;
    }

    .fav-brand-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:4px;
      min-width:0;
    }

    .fav-brand-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-width:0;
      max-width:100%;
      color:inherit;
      text-decoration:none;
      border-radius:10px;
      -webkit-tap-highlight-color:transparent;
    }

    .fav-brand-link:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }

    .fav-brand-icon-wrap{
      width:24px;
      height:24px;
      border-radius:8px;
      background:var(--pill-bg);
      border:1px solid var(--pill-border);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }

    .fav-brand-icon{
      width:20px;
      height:20px;
      display:block;
      object-fit:contain;
    }

    .fav-brand-icon-placeholder{
      width:20px;
      height:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      font-weight:900;
      color:var(--muted);
    }

    .fav-brand{
      font-size:13px;
      line-height:1.15;
      font-weight:800;
      letter-spacing:-.01em;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }

    .fav-name{
      font-size:21px;
      line-height:1.02;
      font-weight:800;
      letter-spacing:-.04em;
      color:var(--ink);
      margin-bottom:10px;
      word-break:break-word;
    }

    .fav-meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .fav-pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      min-height:30px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--pill-bg);
      border:1px solid var(--pill-border);
      font-size:12px;
      line-height:1;
      font-weight:800;
      letter-spacing:.02em;
      color:var(--ink);
    }

    .fav-pill-label{
      color:var(--muted);
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .fav-side{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      min-height:94px;
    }

    .fav-open{
      font-size:12px;
      font-weight:800;
      color:var(--accent);
      letter-spacing:.04em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .fav-remove{
      appearance:none;
      border:0;
      background:transparent;
      color:var(--danger);
      font-size:13px;
      line-height:1;
      font-weight:800;
      padding:8px 4px;
      cursor:pointer;
      white-space:nowrap;
    }

    .fav-remove:active{
      transform:translateY(1px);
    }

    .summary{
      margin:0 2px 14px;
      font-size:14px;
      line-height:1.35;
      font-weight:700;
      color:var(--muted);
    }

    .top-actions{
      display:flex;
      justify-content:flex-end;
      margin-bottom:12px;
    }

    .clear-btn{
      appearance:none;
      border:1px solid var(--pill-border);
      background:var(--pill-bg);
      color:var(--ink);
      min-height:38px;
      padding:0 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      letter-spacing:.02em;
      cursor:pointer;
    }

    .clear-btn[hidden]{
      display:none !important;
    }
  </style>
</head>
<body>
  <div id="universalTopbar"></div>

  <main class="wrap">
    <h1 class="page-title">Favorites</h1>
    <div class="summary" id="favoritesSummary">Loading favorites…</div>

    <div class="top-actions">
      <button class="clear-btn" id="clearFavoritesBtn" type="button" hidden>Clear All</button>
    </div>

    <section class="card">
      <div id="favoritesContent" class="loading">Loading favorites…</div>
    </section>
  </main>

  <script src="/uxui/topbar/topbar.js"></script>
  <script>
    (() => {
      "use strict";

      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/10-5j7vKT123WtNhqLynxX3n9BXpb1VlKcuPZHj9YxdM/gviz/tq?tqx=out:csv";

      const FAVORITES_KEY = "cigaros_favorite_keys";
      const LENGTH_COL_INDEX = 11;
      const RING_COL_INDEX = 12;

      const $ = (sel, root = document) => root.querySelector(sel);

      const content = $("#favoritesContent");
      const summary = $("#favoritesSummary");
      const clearBtn = $("#clearFavoritesBtn");

      function getSavedTheme() {
        return localStorage.getItem("theme") || document.documentElement.getAttribute("data-theme") || "light";
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
      }

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let cur = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];

          if (ch === '"' && inQuotes && next === '"') {
            cur += '"';
            i++;
            continue;
          }

          if (ch === '"') {
            inQuotes = !inQuotes;
            continue;
          }

          if (ch === "," && !inQuotes) {
            row.push(cur);
            cur = "";
            continue;
          }

          if ((ch === "\n" || ch === "\r") && !inQuotes) {
            if (ch === "\r" && next === "\n") i++;
            row.push(cur);
            rows.push(row);
            row = [];
            cur = "";
            continue;
          }

          cur += ch;
        }

        if (cur.length || row.length) {
          row.push(cur);
          rows.push(row);
        }

        return rows;
      }

      function normalizeHeader(h) {
        return String(h || "").trim().toLowerCase().replace(/\s+/g, "");
      }

      function rowsToObjects(rows) {
        if (!rows || rows.length < 2) return [];
        const headers = rows[0].map((h) => String(h || "").trim());
        const normHeaders = headers.map(normalizeHeader);

        const data = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.every((c) => !String(c || "").trim())) continue;

          const obj = {};
          for (let j = 0; j < headers.length; j++) {
            obj[headers[j]] = r[j] ?? "";
            obj[normHeaders[j]] = r[j] ?? "";
          }

          obj.__row = r;
          obj.__length_col = r[LENGTH_COL_INDEX] ?? "";
          obj.__ring_col = r[RING_COL_INDEX] ?? "";
          data.push(obj);
        }

        return data;
      }

      function getField(rec, keys) {
        for (const key of keys) {
          const value = rec?.[key];
          if (value != null && String(value).trim() !== "") return String(value).trim();
        }
        return "";
      }

      function normalizeLoose(s) {
        return String(s || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, " and ")
          .replace(/["'’]/g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function slugify(s) {
        return normalizeLoose(s).replace(/\s+/g, "-");
      }

      function compactKey(s) {
        return String(s || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, "and")
          .replace(/["'’]/g, "")
          .replace(/[^a-z0-9]+/g, "");
      }

      function normalizeBrand(v) {
        return compactKey(v);
      }

      function normalizeAssetPath(path) {
        const value = String(path || "").trim();
        if (!value) return "";
        if (/^https?:\/\//i.test(value)) return value;
        return value.startsWith("/") ? value : `/${value}`;
      }

      function escapeHTML(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttr(s) {
        return escapeHTML(s);
      }

      function getCigarId(rec) {
        return getField(rec, [
          "Key",
          "key",
          "Cigar ID",
          "cigarId",
          "cigarid",
          "cigar_id",
          "id",
          "row_id"
        ]);
      }

      function getBrand(rec) {
        return getField(rec, ["Brand", "brand", "brandname", "Brand aka", "brandaka"]);
      }

      function getLine(rec) {
        return getField(rec, ["Line", "line", "Series", "series"]);
      }

      function getName(rec) {
        return getField(rec, ["Cigar", "cigar", "Name", "name"]);
      }

      function getVitola(rec) {
        return getField(rec, ["Vitola", "vitola", "Style", "style", "Size", "size"]);
      }

      function getShape(rec) {
        return getField(rec, ["Shape", "shape"]);
      }

      function getWrapper(rec) {
        return getField(rec, ["Wrapper", "wrapper"]);
      }

      function getStrength(rec) {
        return getField(rec, ["Strength", "strength"]);
      }

      function getRing(rec) {
        const direct = getField(rec, ["Ring", "ring", "RG", "rg", "Ring Size", "ringsize"]);
        if (direct) return direct;
        return String(rec?.__ring_col || "").trim();
      }

      function getLength(rec) {
        const direct = getField(rec, ["Length", "length", "Len", "len"]);
        if (direct) return direct;
        return String(rec?.__length_col || "").trim();
      }

      function getImage(rec) {
        return getField(rec, ["Cigar IMG", "cigarimg", "Image", "image", "Photo", "photo"]);
      }

      function getBrandImage(rec) {
        return getField(rec, ["Brand IMG", "brandimg", "brand_image"]);
      }

      function makeSlugFromRecord(rec) {
        const id = getCigarId(rec);
        const brand = getBrand(rec);
        const line = getLine(rec);
        const name = getName(rec);
        const vitola = getVitola(rec);
        return slugify([brand, line, name, vitola, id].filter(Boolean).join(" "));
      }

      function scoreRecord(rec) {
        let score = 0;
        if (getRing(rec)) score += 50;
        if (getLength(rec)) score += 50;
        if (getImage(rec)) score += 5;
        if (getVitola(rec)) score += 3;
        if (getShape(rec)) score += 3;
        if (getWrapper(rec)) score += 2;
        if (getStrength(rec)) score += 2;
        return score;
      }

      function buildBrandHref(brand) {
        const value = String(brand || "").trim();
        if (!value) return "/pos/cigars/";
        return `/pos/cigars/brand?brand=${encodeURIComponent(value)}`;
      }

      function buildBrandIconCandidates(rec) {
        const fromSheet = normalizeAssetPath(getBrandImage(rec));
        const brand = getBrand(rec);
        const brandKey = normalizeBrand(brand);

        const out = [];
        if (fromSheet) out.push(fromSheet);

        if (brandKey) {
          out.push(`/img/icons/brands/${brandKey}.svg`);
          out.push(`/img/icons/brands/${brandKey}.png`);
        }

        return Array.from(new Set(out.filter(Boolean)));
      }

      function buildCigarImageCandidates(rec) {
        const fromSheet = normalizeAssetPath(getImage(rec));
        const brand = getBrand(rec);
        const line = getLine(rec);
        const cigar = getName(rec);
        const vitola = getVitola(rec);

        const brandFolder = normalizeBrand(brand);
        const brandKey = compactKey(brand);
        const lineKey = compactKey(line);
        const cigarKey = compactKey(cigar);
        const vitolaKey = compactKey(vitola);

        const out = [];
        if (fromSheet) out.push(fromSheet);

        if (brandFolder) {
          const names = [];

          if (brandKey && lineKey && cigarKey) names.push(`${brandKey}${lineKey}${cigarKey}`);
          if (brandKey && lineKey && cigarKey && vitolaKey) names.push(`${brandKey}${lineKey}${cigarKey}${vitolaKey}`);
          if (lineKey && cigarKey) names.push(`${lineKey}${cigarKey}`);
          if (lineKey && cigarKey && vitolaKey) names.push(`${lineKey}${cigarKey}${vitolaKey}`);
          if (brandKey && cigarKey) names.push(`${brandKey}${cigarKey}`);
          if (brandKey && cigarKey && vitolaKey) names.push(`${brandKey}${cigarKey}${vitolaKey}`);
          if (cigarKey) names.push(`${cigarKey}`);
          if (cigarKey && vitolaKey) names.push(`${cigarKey}${vitolaKey}`);

          Array.from(new Set(names)).forEach((name) => {
            out.push(`/img/cigars/${brandFolder}/${name}.png`);
          });
        }

        return Array.from(new Set(out.filter(Boolean)));
      }

      function wireImageFallback(img, fallbackText, fallbackClass = "fav-thumb-placeholder") {
        if (!img) return;

        function tryNext() {
          let fallbacks = [];
          try {
            fallbacks = JSON.parse(img.dataset.fallbacks || "[]");
          } catch {
            fallbacks = [];
          }

          const next = fallbacks.shift();
          img.dataset.fallbacks = JSON.stringify(fallbacks);

          if (next) {
            img.src = next;
            return;
          }

          const fallback = document.createElement("div");
          fallback.className = fallbackClass;
          fallback.textContent = fallbackText;
          img.replaceWith(fallback);
        }

        img.addEventListener("error", tryNext, { once: false });
      }

      function readFavoriteIds() {
        try {
          const raw = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
          return Array.isArray(raw) ? raw.filter(Boolean) : [];
        } catch {
          return [];
        }
      }

      function writeFavoriteIds(ids) {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(new Set(ids))));
      }

      function removeFavorite(id) {
        const next = readFavoriteIds().filter((v) => v !== id);
        writeFavoriteIds(next);
        return next;
      }

      function findRecordByFavoriteId(records, id) {
        const raw = String(id || "").trim();
        if (!raw) return null;

        const targetLoose = normalizeLoose(raw);
        const targetSlug = slugify(raw);

        const matches = records.filter((r) => {
          const candidates = [
            getCigarId(r),
            getName(r),
            [getLine(r), getName(r)].filter(Boolean).join(" ").trim(),
            [getBrand(r), getLine(r), getName(r)].filter(Boolean).join(" ").trim(),
            [getBrand(r), getName(r)].filter(Boolean).join(" ").trim(),
            [getName(r), getVitola(r)].filter(Boolean).join(" ").trim(),
            makeSlugFromRecord(r)
          ]
            .filter(Boolean)
            .map((v) => String(v).trim());

          return candidates.some((value) => {
            return value === raw || normalizeLoose(value) === targetLoose || slugify(value) === targetSlug;
          });
        });

        if (!matches.length) return null;
        matches.sort((a, b) => scoreRecord(b) - scoreRecord(a));
        return matches[0];
      }

      function buildDetailHref(rec) {
        const id = getCigarId(rec);
        const slug = makeSlugFromRecord(rec);
        const params = new URLSearchParams();
        if (id) params.set("id", id);
        if (slug) params.set("slug", slug);
        return `/pos/cigars/cigar/?${params.toString()}`;
      }

      function createRow(rec) {
        const id = getCigarId(rec);
        const brand = getBrand(rec) || "—";
        const line = getLine(rec);
        const name = getName(rec);
        const displayName = [line, name].filter(Boolean).join(" ").trim() || name || line || "—";
        const vitola = getVitola(rec) || "—";
        const ring = getRing(rec) || "—";
        const length = getLength(rec) || "—";
        const shape = getShape(rec) || "—";
        const wrapper = getWrapper(rec) || "—";
        const strength = getStrength(rec) || "—";

        const imageCandidates = buildCigarImageCandidates(rec);
        const brandImageCandidates = buildBrandIconCandidates(rec);
        const href = buildDetailHref(rec);
        const brandHref = buildBrandHref(brand);

        const row = document.createElement("a");
        row.className = "fav-row";
        row.href = href;
        row.innerHTML = `
          <div class="fav-thumb-wrap">
            ${
              imageCandidates.length
                ? `<img
                    class="fav-thumb"
                    src="${escapeAttr(imageCandidates[0])}"
                    data-fallbacks='${escapeAttr(JSON.stringify(imageCandidates.slice(1)))}'
                    alt="${escapeAttr(displayName)}"
                    loading="lazy"
                    decoding="async">`
                : `<div class="fav-thumb-placeholder">No image</div>`
            }
          </div>

          <div class="fav-main">
            <div class="fav-brand-row">
              <a class="fav-brand-link" href="${escapeAttr(brandHref)}" data-brand-link="true" aria-label="Open ${escapeAttr(brand)} brand page">
                <span class="fav-brand-icon-wrap">
                  ${
                    brandImageCandidates.length
                      ? `<img
                          class="fav-brand-icon"
                          src="${escapeAttr(brandImageCandidates[0])}"
                          data-fallbacks='${escapeAttr(JSON.stringify(brandImageCandidates.slice(1)))}'
                          alt="${escapeAttr(brand)}"
                          loading="lazy"
                          decoding="async">`
                      : `<span class="fav-brand-icon-placeholder">${escapeHTML(String(brand).slice(0, 1).toUpperCase() || "B")}</span>`
                  }
                </span>
                <span class="fav-brand">${escapeHTML(brand)}</span>
              </a>
            </div>

            <div class="fav-name">${escapeHTML(displayName)}</div>

            <div class="fav-meta">
              <div class="fav-pill"><span class="fav-pill-label">Vitola</span>${escapeHTML(vitola)}</div>
              <div class="fav-pill"><span class="fav-pill-label">Ring</span>${escapeHTML(ring)}</div>
              <div class="fav-pill"><span class="fav-pill-label">Length</span>${escapeHTML(length)}</div>
              <div class="fav-pill"><span class="fav-pill-label">Shape</span>${escapeHTML(shape)}</div>
              <div class="fav-pill"><span class="fav-pill-label">Wrapper</span>${escapeHTML(wrapper)}</div>
              <div class="fav-pill"><span class="fav-pill-label">Strength</span>${escapeHTML(strength)}</div>
            </div>
          </div>

          <div class="fav-side">
            <div class="fav-open">Open</div>
            <button class="fav-remove" type="button" data-remove-id="${escapeAttr(id)}">Remove</button>
          </div>
        `;

        const img = row.querySelector(".fav-thumb");
        wireImageFallback(img, "No image");

        const brandImg = row.querySelector(".fav-brand-icon");
        wireImageFallback(brandImg, String(brand).slice(0, 1).toUpperCase() || "B", "fav-brand-icon-placeholder");

        row.querySelectorAll("[data-brand-link='true']").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
          });
        });

        const removeBtn = row.querySelector(".fav-remove");
        removeBtn?.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          removeFavorite(id);
          row.remove();
          updateSummary();
          toggleEmptyState();
        });

        return row;
      }

      function updateSummary() {
        const count = readFavoriteIds().length;
        if (count === 0) {
          summary.textContent = "No favorites saved yet.";
          clearBtn.hidden = true;
          return;
        }

        summary.textContent = count === 1 ? "1 cigar saved." : `${count} cigars saved.`;
        clearBtn.hidden = false;
      }

      function toggleEmptyState() {
        const list = $(".fav-list", content);
        if (list && list.children.length > 0) return;

        content.innerHTML = `<div class="empty">No favorites yet.</div>`;
      }

      async function loadFavoritesUI() {
        applyTheme(getSavedTheme());

        const favoriteIds = readFavoriteIds();
        updateSummary();

        if (!favoriteIds.length) {
          content.innerHTML = `<div class="empty">No favorites yet.</div>`;
          return;
        }

        content.innerHTML = `<div class="loading">Loading favorites…</div>`;

        const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(\`CSV fetch failed: \${res.status}\`);

        const csvText = await res.text();
        const rows = parseCSV(csvText);
        const records = rowsToObjects(rows);

        const found = [];
        for (const id of favoriteIds) {
          const rec = findRecordByFavoriteId(records, id);
          if (rec) found.push(rec);
        }

        if (!found.length) {
          content.innerHTML = `<div class="empty">Your saved favorites were not found in the current sheet.</div>`;
          clearBtn.hidden = false;
          return;
        }

        const list = document.createElement("div");
        list.className = "fav-list";

        found.forEach((rec) => {
          list.appendChild(createRow(rec));
        });

        content.innerHTML = "";
        content.appendChild(list);
      }

      clearBtn?.addEventListener("click", () => {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify([]));
        updateSummary();
        content.innerHTML = `<div class="empty">No favorites yet.</div>`;
      });

      document.addEventListener("DOMContentLoaded", () => {
        window.CigarOSTopbar?.mount("#universalTopbar", {
          homeHref: "/",
          favoritesHref: "/pos/favorites/",
          cartHref: "/pos/invoice/",
          searchAction: "modal"
        });

        loadFavoritesUI().catch((err) => {
          console.warn("[favorites] load error:", err);
          content.innerHTML = `<div class="error">Error loading favorites.</div>`;
          summary.textContent = "Could not load favorites.";
        });
      });
    })();
  </script>
</body>
</html>
