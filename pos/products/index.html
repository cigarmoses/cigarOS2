<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Other Products</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/pos/pos.css" />
  <link rel="stylesheet" href="/pos/products/products.css" />
</head>

<body class="products-page">
  <main class="products-page-wrap">

    <header class="products-topbar">
      <button type="button" class="products-back" aria-label="Back" onclick="history.back()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>

      <div class="products-theme-dock">
        <button id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="true">
          <span class="track" aria-hidden="true"></span>
          <span class="knob" aria-hidden="true"></span>
        </button>
      </div>

      <div class="products-topbar-spacer"></div>
    </header>

    <section class="products-head">
      <h1 class="products-title">Other Products</h1>

      <a href="/pos/invoice/" class="products-cart-btn" aria-label="Invoice">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
          <circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
        </svg>
        <span class="products-cart-badge" data-cart-badge hidden>0</span>
      </a>
    </section>

    <section class="products-controls">
      <div class="products-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
        </svg>
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="Search products"
          aria-label="Search products"
        />
      </div>

      <button id="favToggle" type="button" class="products-icon-btn" aria-label="Favorites">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 18.2 6.1 21l1.1-6.3L2.6 10l6.4-.9L12 3.4l3 5.7 6.4.9-4.6 4.7 1.1 6.3z" fill="currentColor"/>
        </svg>
      </button>

      <button id="filterBtn" type="button" class="products-icon-btn" aria-label="Filters">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </section>

    <nav id="categoryRow" class="pos-categories" aria-label="Product categories"></nav>

    <section id="productGrid" class="pos-grid" aria-label="Products grid"></section>

  </main>

  <div class="products-billbar">
    <button id="addToBill" type="button" class="products-billbtn">Add to Bill (0)</button>
  </div>

  <script src="/pos/cart.js" defer></script>
  <script src="/pos/products/products.js" defer></script>
</body>
</html>
