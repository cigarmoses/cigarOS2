<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Products</title>

  <link rel="stylesheet" href="/css/type.css" />
  <link rel="stylesheet" href="/css/ios26-system.css" />
  <link rel="stylesheet" href="/uxui/topbar/topbar.css?v=30" />
  <link rel="stylesheet" href="/pos/products/products.css?v=30" />
</head>

<body class="products-page">
  <main class="products-page-wrap">
    <div id="universalTopbar"></div>

    <section class="products-head">
      <h1 class="products-title">Products</h1>
    </section>

    <section class="products-controls">
      <div class="products-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
        </svg>
        <input
          id="searchInput"
          name="q"
          type="text"
          inputmode="search"
          autocomplete="off"
          placeholder=""
          aria-label="Search products"
        />
      </div>

      <button id="filterBtn" type="button" class="products-icon-btn" aria-label="Filters">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </section>

    <nav id="categoryRow" class="pos-categories" aria-label="Product categories"></nav>
    <section id="productGrid" class="pos-grid" aria-label="Products grid"></section>
  </main>

  <div class="products-billbar">
    <button id="addToBill" type="button" class="products-billbtn">Add to Bill (0)</button>
  </div>

  <nav class="products-bottom-bar" aria-label="Primary">
    <div class="products-bottom-bar-inner">
      <button type="button" class="cb-nav-btn" id="productsSearchBtn" aria-label="Search">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2L21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>

      <a class="cb-nav-btn" href="/" aria-label="Home">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </a>

      <a class="cb-nav-btn" href="/pos/favorites/" aria-label="Favorites">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s-6.7-4.35-9.33-7.02C.7 12.02 1.1 8.5 4 7.1c1.9-.9 4.1-.3 5.3 1.2 1.2-1.5 3.4-2.1 5.3-1.2 2.9 1.4 3.3 4.92 1.33 6.88C18.7 16.65 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Favorites</span>
      </a>

      <a class="cb-nav-btn" href="/pos/invoice/" aria-label="Cart">
        <svg class="cb-nav-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h14l-1.7 6.8a2 2 0 0 1-1.94 1.52H10.1a2 2 0 0 1-1.95-1.57L6.1 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="18.5" r="1.6" fill="currentColor"/>
          <circle cx="17.5" cy="18.5" r="1.6" fill="currentColor"/>
        </svg>
        <span>Cart</span>
      </a>
    </div>
  </nav>

  <script src="/uxui/topbar/topbar.js?v=30" defer></script>
  <script src="/pos/cart.js?v=30" defer></script>
  <script src="/pos/products/products.js?v=30" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.CigarOSTopbar?.mount("#universalTopbar", {
        backHref: "/"
      });

      document.getElementById("productsSearchBtn")?.addEventListener("click", () => {
        window.openGlobalSearch?.();
      });
    });
  </script>
</body>
</html>
