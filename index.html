<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>cigarOS2</title>
<meta name="color-scheme" content="light only" />
<style>
  :root{
    /* Background + ink */
    --bg: #eef2f6;            /* very soft gray-blue */
    --surface: #f6f9fc;        /* tile base */
    --ink: #0f2b2c;            /* label color */
    --muted:#7c8a96;

    /* Brand accent for Hub button */
    --accent-start:#14b4ff;
    --accent-end:#0b7ef4;

    /* Neumorphism shadows */
    --shadow-light: rgba(255,255,255,0.85);
    --shadow-dark:  rgba(35,60,90,0.20);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex;
    flex-direction:column;
  }

  /* Header / Logo */
  header{
    padding: 22px 16px 10px;
    text-align:center;
  }
  .logo{
    display:inline-block;
    height:64px;              /* smaller than tiles as you requested */
    max-width: 78vw;
    object-fit: contain;
    filter: drop-shadow(-6px -6px 12px var(--shadow-light))
            drop-shadow(8px 8px 18px var(--shadow-dark));
  }

  /* Grid */
  .grid{
    width: min(1020px, 92vw);
    margin: 10px auto 28px;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;                /* even spacing – no overlaps */
  }
  @media (min-width: 760px){
    .grid{ grid-template-columns: repeat(3, 1fr); gap: 26px; }
  }

  /* Neumorphic tile */
  .tile{
    position:relative;
    border-radius:28px;
    background: var(--surface);
    min-height: 150px;
    padding: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:inherit;
    box-shadow:
      -12px -12px 20px var(--shadow-light),
       12px  12px 22px var(--shadow-dark);
    transition: transform .06s ease, box-shadow .12s ease, filter .12s ease;
  }

  /* Soft inner pod for the icon (like the reference) */
  .pod{
    width: 88px;
    height: 88px;
    border-radius:22px;
    display:grid;
    place-items:center;
    background: var(--surface);
    box-shadow:
      inset -8px -8px 14px var(--shadow-light),
      inset  8px  8px 14px var(--shadow-dark);
  }

  /* Masked SVG so we can tint it to ink without editing files */
  .glyph{
    width: 46px;
    height: 46px;
    background: var(--ink);
    -webkit-mask: var(--icon) center / contain no-repeat;
            mask: var(--icon) center / contain no-repeat;
    opacity: .9;
  }

  .label{
    position:absolute;
    bottom:14px;
    left:0; right:0;
    text-align:center;
    font-weight:800;
    letter-spacing:.2px;
  }

  /* Press/hover */
  .tile:active{
    transform: translateY(1px);
    box-shadow:
      -8px -8px 14px var(--shadow-light),
       8px  8px 16px var(--shadow-dark);
    filter: saturate(1.02);
  }
  @media (hover:hover){
    .tile:hover{ filter: saturate(1.05); }
  }

  /* HUB – long pill button */
  .hub{
    grid-column: 1 / -1;
    border-radius: 999px;
    min-height: 68px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 900;
    letter-spacing:.4px;
    color:#fff;
    background: linear-gradient(135deg,var(--accent-start),var(--accent-end));
    box-shadow:
      -10px -10px 18px var(--shadow-light),
       12px  12px 22px var(--shadow-dark);
  }
  .hub:active{
    transform: translateY(1px);
    box-shadow:
      -8px -8px 14px var(--shadow-light),
       9px  9px 18px var(--shadow-dark);
  }

  /* Footer space on tall phones */
  .spacer{height:8px}
</style>
</head>
<body>

<header>
  <img class="logo" src="img/logo.svg" alt="Smoke Cigar Shop &amp; Lounge">
</header>

<main class="grid">
  <!-- POS -->
  <a class="tile" href="pos.html" data-icon="img/icons/pos.svg">
    <div class="pod"><span class="glyph"></span></div>
    <div class="label">POS</div>
  </a>

  <!-- Today -->
  <a class="tile" href="today.html" data-icon="img/icons/today.svg">
    <div class="pod"><span class="glyph"></span></div>
    <div class="label">Today</div>
  </a>

  <!-- Loyalty -->
  <a class="tile" href="loyalty.html" data-icon="img/icons/loyalty.svg">
    <div class="pod"><span class="glyph"></span></div>
    <div class="label">Loyalty</div>
  </a>

  <!-- Reports -->
  <a class="tile" href="reports.html" data-icon="img/icons/reports.svg">
    <div class="pod"><span class="glyph"></span></div>
    <div class="label">Reports</div>
  </a>

  <!-- Learn -->
  <a class="tile" href="learn.html" data-icon="img/icons/learn.svg">
    <div class="pod"><span class="glyph"></span></div>
    <div class="label">Learn</div>
  </a>

  <!-- News -->
  <a class="tile" href="news.html" data-icon="img/icons/news.svg">
    <div class="pod"><span class="glyph"></span></div>
    <div class="label">News</div>
  </a>

  <!-- HUB (full-width pill) -->
  <a class="tile hub" href="hub.html">HUB</a>
</main>

<div class="spacer"></div>

<script>
  // Apply each icon file as a CSS mask so we can tint uniformly
  document.querySelectorAll('.tile[data-icon]').forEach(el=>{
    const url = el.getAttribute('data-icon');
    el.style.setProperty('--icon', `url("${url}")`);
  });
</script>
</body>
</html>
