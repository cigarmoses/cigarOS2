<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke POS Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="logo">
    <img src="/img/logo.png" alt="Smoke Cigar Shop & Lounge">
  </div>

  <div class="grid">
    <div class="tile pos" data-label="POS"></div>
    <div class="tile today" data-label="Today"></div>
    <div class="tile profile" data-label="Profile"></div>
    <div class="tile reports" data-label="Reports"></div>
    <div class="tile learn" data-label="Learn"></div>
    <div class="tile news" data-label="News"></div>
    <div class="tile hub" data-label="Hub"></div>
  </div>

</body>
</html>
