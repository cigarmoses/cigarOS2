<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>cigarOS2</title>
<meta name="color-scheme" content="light only" />
<style>
  :root{
    --bg:#eef2f6;
    --surface:#f6f9fc;
    --ink:#0f2b2c;
    --accent-start:#14b4ff;
    --accent-end:#0b7ef4;
    --shadow-light: rgba(255,255,255,0.88);
    --shadow-dark:  rgba(28,46,72,0.22);

    /* square tile size */
    --tile: clamp(120px, 30vw, 200px);
    --gap: clamp(14px, 3.5vw, 26px);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{padding:22px 16px 8px; text-align:center}
  .logo{
    height:66px;              /* logo smaller than tiles */
    max-width:78vw;
    object-fit:contain;
    filter: drop-shadow(-6px -6px 12px var(--shadow-light))
            drop-shadow( 8px  8px 18px var(--shadow-dark));
  }

  /* Grid */
  .grid{
    width:min(1000px, 94vw);
    display:grid;
    grid-template-columns: repeat(2, var(--tile));
    justify-content:center;
    gap: var(--gap);
    margin: 8px auto 28px;
  }
  @media (min-width:760px){
    .grid{ grid-template-columns: repeat(3, var(--tile)); }
  }

  /* Square neumorphic tile */
  .tile{
    width:var(--tile);
    aspect-ratio:1/1;                  /* <- stays square */
    border-radius:28px;
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:
      -14px -14px 22px var(--shadow-light),
       14px  14px 24px var(--shadow-dark);
    transition: transform .06s ease, box-shadow .12s ease, filter .12s ease;
  }
  .tile:active{
    transform:translateY(1px);
    box-shadow:
      -10px -10px 16px var(--shadow-light),
       10px  10px 18px var(--shadow-dark);
  }

  /* Your SVGs (no labels/pods from us) */
  .icon{
    width:58%;              /* adjust to taste */
    height:auto;
    display:block;
    pointer-events:none;    /* taps/clicks go to tile link */
  }

  /* Centered HUB tile (same size as others) */
  .hub-wrapper{
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    margin-top: var(--gap);
    margin-bottom: 20px;
  }

  .spacer{height:10px}
</style>
</head>
<body>

<header>
  <img class="logo" src="img/logo.svg" alt="Smoke Cigar Shop &amp; Lounge">
</header>

<main class="grid">
  <a class="tile" href="pos.html" aria-label="POS">
    <img class="icon" src="img/icons/pos.svg" alt="">
  </a>

  <a class="tile" href="today.html" aria-label="Today">
    <img class="icon" src="img/icons/today.svg" alt="">
  </a>

  <a class="tile" href="loyalty.html" aria-label="Loyalty">
    <img class="icon" src="img/icons/loyalty.svg" alt="">
  </a>

  <a class="tile" href="reports.html" aria-label="Reports">
    <img class="icon" src="img/icons/reports.svg" alt="">
  </a>

  <a class="tile" href="learn.html" aria-label="Learn">
    <img class="icon" src="img/icons/learn.svg" alt="">
  </a>

  <a class="tile" href="news.html" aria-label="News">
    <img class="icon" src="img/icons/news.svg" alt="">
  </a>

  <!-- Centered HUB icon -->
  <div class="hub-wrapper">
    <a class="tile" href="hub.html" aria-label="Hub">
      <img class="icon" src="img/icons/hub.svg" alt="">
    </a>
  </div>
</main>

<div class="spacer"></div>
</body>
</html>
