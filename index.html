<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CigarOS</title>

  <!-- SF Pro Display rules live here -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --bg:#eaf2f6;
      --ink:#0f1a2c;
      --muted:#607080;
    }
    body{
      margin:0;
      background:var(--bg);
      font-family: var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display","SF Pro Text", system-ui, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      min-height:100vh;
      padding-top:28px;
    }

    .shop-logo{
      width:64px;
      height:auto;
      margin-bottom:24px;
    }

    .home-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:28px 36px;
      justify-items:center;
      margin-top:24px;
      padding-bottom:36px;
    }

    .icon-tile{
      width:140px;
      height:140px;
      background:#fff;
      border-radius:124px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 2px 6px rgba(0,0,0,.10);
      transition:transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-tile:active{ transform:scale(.98); }

    .icon-tile img{
      width:80px;
      height:80px;
      object-fit:contain;
    }
  </style>
</head>

<body>
  <img src="/img/homescreenlogo.svg" alt="CigarOS" class="shop-logo" />

  <div class="home-grid">
    <a href="/pos/" class="icon-tile"><img src="/img/icons/pos.svg" alt="POS"></a>
    <a href="/today/" class="icon-tile"><img src="/img/icons/today.svg" alt="Today"></a>
    <a href="/loyalty/" class="icon-tile"><img src="/img/icons/loyalty.svg" alt="Loyalty"></a>
    <a href="/hub/" class="icon-tile"><img src="/img/icons/hub.svg" alt="Hub"></a>
    <a href="/reports/" class="icon-tile"><img src="/img/icons/reports.svg" alt="Reports"></a>
    <a href="/learn/" class="icon-tile"><img src="/img/icons/learn.svg" alt="Learn"></a>
    <a href="/news/" class="icon-tile"><img src="/img/icons/news.svg" alt="News"></a>

    <!-- ✅ NEW: Shops (PNG is fine) -->
    <a href="/shops/" class="icon-tile"><img src="/img/icons/shops.png" alt="Shops"></a>
  </div>

  <script src="/js/global.js" defer></script>
</body>
</html>
