<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --screen-max: 430px;

      --bg: #edf2f6;
      --panel-bg: transparent;
      --ink: #16263d;
      --muted: #4d5f77;

      --toggle-bg: #c8d0db;
      --toggle-shadow: 0 8px 18px rgba(61,81,105,.14);

      --tile-size: 126px;
      --grid-gap-x: 28px;
      --grid-gap-y: 20px;

      --label-size: 16px;
      --label-weight: 600;

      --grid-top-offset: 100px;
    }

    body.dark{
      --bg:
        radial-gradient(1200px 620px at 50% -10%, #0d1c36 0%, rgba(13,28,54,0) 55%),
        linear-gradient(180deg, #07111f 0%, #030914 48%, #000000 100%);
      --panel-bg: transparent;
      --ink: #eef5ff;
      --muted: #acbbd0;

      --toggle-bg: #24385e;
      --toggle-shadow: 0 10px 20px rgba(0,0,0,.24);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      transition: background .25s ease, color .25s ease;
    }

    .screen{
      width:100%;
      max-width: var(--screen-max);
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        calc(var(--safe-top) + var(--grid-top-offset))
        14px
        calc(var(--safe-bottom) + 92px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      position:relative;
    }

    .topbar{
      position:fixed;
      top: calc(var(--safe-top) + 18px);
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100vw - 28px), var(--screen-max));
      display:flex;
      justify-content:flex-end;
      align-items:center;
      padding-right: 2px;
      z-index: 50;
      pointer-events:none;
    }

    .theme-toggle{
      width: 86px;
      height: 42px;
      border: none;
      border-radius: 999px;
      background: var(--toggle-bg);
      box-shadow: var(--toggle-shadow);
      position: relative;
      cursor: pointer;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      transition: background .25s ease, box-shadow .25s ease, transform .15s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: inline-flex;
      align-items: center;
      pointer-events:auto;
    }

    .theme-toggle:active{
      transform: scale(.97);
    }

    .theme-icon{
      position:absolute;
      top: 5px;
      left: 5px;
      width: 32px;
      height: 32px;
      display:block;
      object-fit:contain;
      transition: left .22s ease, opacity .2s ease, transform .2s ease;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,.12));
    }

    body.dark .theme-icon{
      left: 49px;
    }

    .theme-icon.sun{
      opacity:1;
      transform:scale(1) rotate(0deg);
    }

    .theme-icon.moon{
      opacity:0;
      transform:scale(.85) rotate(-18deg);
    }

    body.dark .theme-icon.sun{
      opacity:0;
      transform:scale(.85) rotate(18deg);
    }

    body.dark .theme-icon.moon{
      opacity:1;
      transform:scale(1) rotate(0deg);
    }

    .menu-wrap{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-top: 0;
    }

    .home-panel{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      background: var(--panel-bg);
      border-radius: 24px;
      padding: 8px 12px 12px;
      transition: background .25s ease;
      overflow: visible;
    }

    .home-grid{
      width:100%;
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      justify-items:center;
      align-content:start;
      gap: var(--grid-gap-y) var(--grid-gap-x);
    }

    .home-item{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-decoration:none;
      color:var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    .tile-img{
      width: var(--tile-size);
      height: var(--tile-size);
      display:block;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
      filter:
        drop-shadow(0 10px 16px rgba(33,122,255,.08))
        drop-shadow(0 3px 7px rgba(255,255,255,.02));
      transition: transform .16s ease, filter .18s ease;
    }

    .home-item:active .tile-img{
      transform: translateY(1px) scale(.97);
      filter:
        drop-shadow(0 8px 12px rgba(33,122,255,.10))
        drop-shadow(0 2px 6px rgba(255,255,255,.03));
    }

    .icon-label{
      margin-top: 6px;
      font-size: var(--label-size);
      line-height: 1.05;
      font-weight: var(--label-weight);
      letter-spacing: -.03em;
      color: var(--muted);
      text-align:center;
      transition: color .25s ease;
    }

    @media (max-height: 900px){
      .screen{
        padding-top: calc(var(--safe-top) + var(--grid-top-offset));
        padding-bottom: calc(var(--safe-bottom) + 98px);
      }
      .tile-img{
        width: 122px;
        height: 122px;
      }
    }

    @media (max-height: 860px){
      .screen{
        padding-top: calc(var(--safe-top) + var(--grid-top-offset));
        padding-bottom: calc(var(--safe-bottom) + 104px);
      }
      .tile-img{
        width: 118px;
        height: 118px;
      }
      .icon-label{
        font-size: 14px;
      }
      .theme-toggle{
        width: 82px;
        height: 40px;
      }
      .theme-icon{
        width: 30px;
        height: 30px;
        top: 5px;
        left: 5px;
      }
      body.dark .theme-icon{
        left: 47px;
      }
    }

    @media (prefers-reduced-motion: reduce){
      .theme-toggle,
      .theme-icon,
      .tile-img{
        transition:none;
      }
    }
  </style>
</head>

<body class="day">
  <main class="screen">
    <div class="topbar">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle day and night mode" type="button">
        <img class="theme-icon sun" src="/img/icons/sun.svg" alt="" aria-hidden="true" />
        <img class="theme-icon moon" src="/img/icons/moon.svg" alt="" aria-hidden="true" />
      </button>
    </div>

    <div class="menu-wrap">
      <section class="home-panel" aria-label="CigarOS Home">
        <div class="home-grid">
          <a href="/pos/" class="home-item">
            <img src="/img/icons/glass/pos.png" alt="POS" class="tile-img" />
            <div class="icon-label">POS</div>
          </a>

          <a href="/today/" class="home-item">
            <img src="/img/icons/glass/today.png" alt="Today" class="tile-img" />
            <div class="icon-label">Today</div>
          </a>

          <a href="/loyalty/" class="home-item">
            <img src="/img/icons/glass/loyalty.png" alt="Loyalty" class="tile-img" />
            <div class="icon-label">Loyalty</div>
          </a>

          <a href="/inventory/" class="home-item">
            <img src="/img/icons/glass/inventory.png" alt="Inventory" class="tile-img" />
            <div class="icon-label">Inventory</div>
          </a>

          <a href="/reports/" class="home-item">
            <img src="/img/icons/glass/reports.png" alt="Reports" class="tile-img" />
            <div class="icon-label">Reports</div>
          </a>

          <a href="/learn/" class="home-item">
            <img src="/img/icons/glass/learn.png" alt="Learn" class="tile-img" />
            <div class="icon-label">Learn</div>
          </a>

          <a href="/news/" class="home-item">
            <img src="/img/icons/glass/news.png" alt="News" class="tile-img" />
            <div class="icon-label">News</div>
          </a>

          <a href="/social/" class="home-item">
            <img src="/img/icons/glass/cigarsocialglass.png" alt="Cigar Social" class="tile-img" />
            <div class="icon-label">Cigar Social</div>
          </a>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/global.js" defer></script>
  <script>
    (function () {
      const body = document.body;
      const toggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('cigaros-home-theme');

      if (savedTheme === 'dark') {
        body.classList.add('dark');
        body.classList.remove('day');
      } else {
        body.classList.add('day');
        body.classList.remove('dark');
      }

      toggle.addEventListener('click', function () {
        body.classList.toggle('dark');
        body.classList.toggle('day');

        const isDark = body.classList.contains('dark');
        localStorage.setItem('cigaros-home-theme', isDark ? 'dark' : 'day');
      });
    })();
  </script>
</body>
</html>
