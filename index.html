<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CigarOS Home</title>
<style>
  :root { --bg:#f5f6fa; --tile:#fff; --radius:20px; --sh:0 4px 10px rgba(0,0,0,.08); --sh2:0 6px 16px rgba(0,0,0,.10); }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:40px 0 80px }
  header { text-align:center; margin-bottom:40px }
  header img { width:160px; height:auto }
  .grid { display:grid; grid-template-columns:repeat(2,130px); gap:28px; justify-content:center }
  .tile { display:flex; align-items:center; justify-content:center; width:130px; height:130px; background:var(--tile); border-radius:var(--radius); box-shadow:var(--sh); text-decoration:none; transition:.15s transform,.2s box-shadow }
  .tile:hover { transform:translateY(-3px); box-shadow:var(--sh2) }
  .tile img { width:56px; height:56px; display:block }
</style>
</head>
<body>
  <header>
    <img src="/img/logo-smoke.png" alt="Smoke Cigar Shop & Lounge logo" />
  </header>

  <main class="grid">
    <a href="/pos/"      class="tile" title="POS"><img src="/img/icons/pos.svg"    alt="POS" /></a>
    <a href="/today/"    class="tile" title="Today"><img src="/img/icons/today.svg" alt="Today" /></a>
    <a href="/loyalty/"  class="tile" title="Loyalty"><img src="/img/icons/loyalty.svg" alt="Loyalty" /></a>
    <a href="/reports/"  class="tile" title="Reports"><img src="/img/icons/reports.svg" alt="Reports" /></a>
    <a href="/learn/"    class="tile" title="Learn"><img src="/img/icons/learn.svg" alt="Learn" /></a>
    <a href="/news/"     class="tile" title="News"><img src="/img/icons/news.svg"  alt="News" /></a>
    <a href="/hub/"      class="tile" title="Hub"><img src="/img/icons/hub.svg"    alt="Hub" /></a>
  </main>
</body>
</html>
