<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke POS / CigarOS v2</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/img/icons/pos.svg" type="image/svg+xml">
</head>
<body>

  <!-- ======= HEADER LOGO ======= -->
  <div class="logo">
    <img src="/img/logo.png" alt="Smoke Cigar Shop & Lounge">
  </div>

  <!-- ======= DASHBOARD GRID ======= -->
  <div class="grid">
    <div class="tile pos" title="POS"></div>
    <div class="tile today" title="Today"></div>
    <div class="tile profile" title="Profile"></div>
    <div class="tile reports" title="Reports"></div>
    <div class="tile learn" title="Learn"></div>
    <div class="tile news" title="News"></div>
    <div class="tile hub" title="Hub"></div>
  </div>

  <!-- ======= OPTIONAL SCRIPTS ======= -->
  <script>
    // Simple example: clickable tiles
    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', () => {
        const section = tile.classList[1]; // e.g., "pos", "reports", etc.
        alert(`Opening ${section.toUpperCase()} module...`);
        // In production, you could route to /pos, /reports, etc.
        // window.location.href = `/${section}.html`;
      });
    });
  </script>

</body>
</html>
