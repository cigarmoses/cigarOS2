<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CigarOS</title>

<link rel="stylesheet" href="/css/type.css" />

<style>

:root{
  --bg:#eaf2f6;
  --ink:#0f1a2c;
  --muted:#607080;
}

body.dark{
  --bg:#020617;
  --ink:#ffffff;
  --muted:#8ca0b5;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-display), -apple-system, BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;

  display:flex;
  flex-direction:column;
  align-items:center;

  height:100vh;
  overflow:hidden;
}

/* top bar */

.topbar{
  width:100%;
  display:flex;
  justify-content:flex-start;
  padding:16px 18px 0 18px;
}

.theme-toggle{
  width:42px;
  height:26px;
  border-radius:20px;
  background:#d5dde4;
  position:relative;
  cursor:pointer;
  transition:.25s;
}

body.dark .theme-toggle{
  background:#1c2c44;
}

.toggle-dot{
  width:20px;
  height:20px;
  border-radius:50%;
  background:white;
  position:absolute;
  top:3px;
  left:3px;
  transition:.25s;
}

body.dark .toggle-dot{
  left:19px;
  background:#0b1f3f;
}

/* logo */

.shop-logo{
  width:70px;
  margin-top:4px;
  margin-bottom:10px;
}

/* grid */

.home-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px 34px;
  justify-items:center;
}

/* icon tile */

.icon-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.icon-tile{
  width:118px;
  height:118px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.15s;
}

.icon-tile:active{
  transform:scale(.95);
}

.icon-tile img{
  width:118px;
  height:118px;
}

/* labels */

.icon-label{
  margin-top:8px;
  font-size:17px;
  font-weight:600;
  color:var(--muted);
}

</style>
</head>

<body>

<div class="topbar">
  <div class="theme-toggle" onclick="toggleTheme()">
    <div class="toggle-dot"></div>
  </div>
</div>

<img src="/img/homescreenlogo.svg" class="shop-logo">

<div class="home-grid">

<div class="icon-wrap">
<a href="/pos/" class="icon-tile">
<img src="/img/icons/glass/pos.png">
</a>
<div class="icon-label">POS</div>
</div>

<div class="icon-wrap">
<a href="/today/" class="icon-tile">
<img src="/img/icons/glass/today.png">
</a>
<div class="icon-label">Today</div>
</div>

<div class="icon-wrap">
<a href="/loyalty/" class="icon-tile">
<img src="/img/icons/glass/loyalty.png">
</a>
<div class="icon-label">Loyalty</div>
</div>

<div class="icon-wrap">
<a href="/inventory/" class="icon-tile">
<img src="/img/icons/glass/inventory.png">
</a>
<div class="icon-label">Inventory</div>
</div>

<div class="icon-wrap">
<a href="/reports/" class="icon-tile">
<img src="/img/icons/glass/reports.png">
</a>
<div class="icon-label">Reports</div>
</div>

<div class="icon-wrap">
<a href="/learn/" class="icon-tile">
<img src="/img/icons/glass/learn.png">
</a>
<div class="icon-label">Learn</div>
</div>

<div class="icon-wrap">
<a href="/news/" class="icon-tile">
<img src="/img/icons/glass/news.png">
</a>
<div class="icon-label">News</div>
</div>

<div class="icon-wrap">
<a href="/social/" class="icon-tile">
<img src="/img/icons/glass/messages.png">
</a>
<div class="icon-label">Cigar Social</div>
</div>

</div>

<script>

function toggleTheme(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
