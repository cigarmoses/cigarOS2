<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Home · CigarOS</title>
  <link rel="stylesheet" href="/css/ui.css?v=1" />
  <link rel="icon" href="/img/icons/pos.svg" type="image/svg+xml" />
</head>
<body>
  <main>
    <!-- Shop logo -->
    <img class="home-logo" src="/img/homescreenlogo.svg" alt="Smoke Cigar Shop & Lounge" />

    <!-- Home tiles: icons only (no labels per your rule) -->
    <section class="app-grid">
      <a class="app-tile" href="/pos/">
        <img class="app-icon" src="/img/icons/categories/cigars.svg" alt="POS" />
        <!-- no label -->
      </a>

      <a class="app-tile" href="/today/">
        <img class="app-icon" src="/img/icons/today.svg" alt="Today" />
      </a>

      <a class="app-tile" href="/loyalty/">
        <img class="app-icon" src="/img/icons/loyalty.svg" alt="Loyalty" />
      </a>

      <a class="app-tile" href="/reports/">
        <img class="app-icon" src="/img/icons/reports.svg" alt="Reports" />
      </a>

      <a class="app-tile" href="/learn/">
        <img class="app-icon" src="/img/icons/learn.svg" alt="Learn" />
      </a>

      <a class="app-tile" href="/news/">
        <img class="app-icon" src="/img/icons/news.svg" alt="News" />
      </a>

      <a class="app-tile" href="/hub/">
        <img class="app-icon" src="/img/icons/hub.svg" alt="Hub" />
      </a>
    </section>
  </main>
</body>
</html>
