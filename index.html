<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --screen-max: 430px;

      --bg: #edf2f6;
      --panel-bg: rgba(255,255,255,.16);
      --ink: #16263d;
      --muted: #4d5f77;

      --toggle-bg: rgba(196,206,217,.95);
      --toggle-dot: #ffffff;
      --toggle-icon: #0f172a;
      --toggle-shadow: 0 6px 16px rgba(61,81,105,.16);

      --logo-w: 88px;

      --tile-size: 140px;
      --grid-gap-x: 28px;
      --grid-gap-y: 10px;

      --label-size: 15px;
      --label-weight: 700;

      --panel-radius: 24px;
      --panel-pad-top: 8px;
      --panel-pad-x: 16px;
      --panel-pad-bottom: 12px;
    }

    body.dark{
      --bg:
        radial-gradient(1200px 620px at 50% -10%, #0d1c36 0%, rgba(13,28,54,0) 55%),
        linear-gradient(180deg, #07111f 0%, #030914 48%, #000000 100%);
      --panel-bg: rgba(255,255,255,.045);
      --ink: #eef5ff;
      --muted: #acbbd0;

      --toggle-bg: rgba(33,50,77,.95);
      --toggle-dot: #dce9ff;
      --toggle-icon: #06162e;
      --toggle-shadow: 0 8px 18px rgba(0,0,0,.28);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
    }

    body{
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      overflow-y: hidden;
      transition: background .25s ease, color .25s ease;
    }

    .screen{
      width:100%;
      max-width: var(--screen-max);
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        calc(var(--safe-top) + 8px)
        14px
        calc(var(--safe-bottom) + 62px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      position:relative;
    }

    .topbar{
      width:100%;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      min-height:34px;
      margin-bottom:4px;
      padding-right:2px;
    }

    .theme-toggle{
      width:50px;
      height:30px;
      border:none;
      border-radius:999px;
      background: var(--toggle-bg);
      box-shadow: var(--toggle-shadow);
      position:relative;
      cursor:pointer;
      padding:0;
      appearance:none;
      -webkit-appearance:none;
      transition: background .25s ease, box-shadow .25s ease, transform .15s ease;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .theme-toggle:active{
      transform: scale(.97);
    }

    .theme-toggle-dot{
      position:absolute;
      top:3px;
      left:3px;
      width:24px;
      height:24px;
      border-radius:50%;
      background: var(--toggle-dot);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.55),
        0 2px 8px rgba(0,0,0,.18);
      transition: left .22s ease, background .25s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    body.dark .theme-toggle-dot{
      left:23px;
    }

    .theme-icon{
      width:13px;
      height:13px;
      display:block;
      color: var(--toggle-icon);
      transition: color .25s ease, opacity .2s ease, transform .2s ease;
      position:absolute;
    }

    .theme-icon.sun{
      opacity:1;
      transform:scale(1) rotate(0deg);
    }

    .theme-icon.moon{
      opacity:0;
      transform:scale(.75) rotate(-20deg);
    }

    body.dark .theme-icon.sun{
      opacity:0;
      transform:scale(.75) rotate(20deg);
    }

    body.dark .theme-icon.moon{
      opacity:1;
      transform:scale(1) rotate(0deg);
    }

    .shop-logo{
      width: var(--logo-w);
      height:auto;
      display:block;
      margin: 4px 0 6px;
      user-select:none;
      -webkit-user-drag:none;
    }

    .home-panel{
      width:100%;
      flex:1;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      background: var(--panel-bg);
      border-radius: var(--panel-radius);
      padding: var(--panel-pad-top) var(--panel-pad-x) var(--panel-pad-bottom);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background .25s ease;
      overflow:hidden;
    }

    .home-grid{
      width:100%;
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      justify-items:center;
      align-content:start;
      gap: var(--grid-gap-y) var(--grid-gap-x);
    }

    .home-item{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-decoration:none;
      color:var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    .tile-img{
      width: var(--tile-size);
      height: var(--tile-size);
      display:block;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
      filter:
        drop-shadow(0 12px 18px rgba(33,122,255,.08))
        drop-shadow(0 4px 8px rgba(255,255,255,.02));
      transition: transform .16s ease, filter .18s ease;
    }

    .home-item:active .tile-img{
      transform: translateY(1px) scale(.97);
      filter:
        drop-shadow(0 8px 14px rgba(33,122,255,.10))
        drop-shadow(0 3px 7px rgba(255,255,255,.03));
    }

    .icon-label{
      margin-top: 4px;
      font-size: var(--label-size);
      line-height: 1.05;
      font-weight: var(--label-weight);
      letter-spacing: -.03em;
      color: var(--muted);
      text-align:center;
      transition: color .25s ease;
    }

    @media (max-height: 860px){
      .screen{
        padding-bottom: calc(var(--safe-bottom) + 58px);
      }
    }

    @media (prefers-reduced-motion: reduce){
      .theme-toggle,
      .theme-toggle-dot,
      .theme-icon,
      .tile-img{
        transition:none;
      }
    }
  </style>
</head>

<body class="day">
  <main class="screen">
    <div class="topbar">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle day and night mode" type="button">
        <span class="theme-toggle-dot">
          <svg class="theme-icon sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="1.75" x2="12" y2="4.5"></line>
              <line x1="12" y1="19.5" x2="12" y2="22.25"></line>
              <line x1="1.75" y1="12" x2="4.5" y2="12"></line>
              <line x1="19.5" y1="12" x2="22.25" y2="12"></line>
              <line x1="4.55" y1="4.55" x2="6.5" y2="6.5"></line>
              <line x1="17.5" y1="17.5" x2="19.45" y2="19.45"></line>
              <line x1="17.5" y1="6.5" x2="19.45" y2="4.55"></line>
              <line x1="4.55" y1="19.45" x2="6.5" y2="17.5"></line>
            </g>
          </svg>

          <svg class="theme-icon moon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.2 14.2A8.7 8.7 0 0 1 9.8 3.8a.75.75 0 0 0-.9-.95A10 10 0 1 0 21.15 15.1a.75.75 0 0 0-.95-.9Z"></path>
          </svg>
        </span>
      </button>
    </div>

    <img src="/img/homescreenlogo.svg" alt="CigarOS" class="shop-logo" />

    <section class="home-panel" aria-label="CigarOS Home">
      <div class="home-grid">
        <a href="/pos/" class="home-item">
          <img src="/img/icons/glass/pos.png" alt="POS" class="tile-img" />
          <div class="icon-label">POS</div>
        </a>

        <a href="/today/" class="home-item">
          <img src="/img/icons/glass/today.png" alt="Today" class="tile-img" />
          <div class="icon-label">Today</div>
        </a>

        <a href="/loyalty/" class="home-item">
          <img src="/img/icons/glass/loyalty.png" alt="Loyalty" class="tile-img" />
          <div class="icon-label">Loyalty</div>
        </a>

        <a href="/inventory/" class="home-item">
          <img src="/img/icons/glass/inventory.png" alt="Inventory" class="tile-img" />
          <div class="icon-label">Inventory</div>
        </a>

        <a href="/reports/" class="home-item">
          <img src="/img/icons/glass/reports.png" alt="Reports" class="tile-img" />
          <div class="icon-label">Reports</div>
        </a>

        <a href="/learn/" class="home-item">
          <img src="/img/icons/glass/learn.png" alt="Learn" class="tile-img" />
          <div class="icon-label">Learn</div>
        </a>

        <a href="/news/" class="home-item">
          <img src="/img/icons/glass/news.png" alt="News" class="tile-img" />
          <div class="icon-label">News</div>
        </a>

        <a href="/social/" class="home-item">
          <img src="/img/icons/glass/cigarsocialglass.png" alt="Cigar Social" class="tile-img" />
          <div class="icon-label">Cigar Social</div>
        </a>
      </div>
    </section>
  </main>

  <script src="/js/global.js" defer></script>
  <script>
    (function () {
      const body = document.body;
      const toggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('cigaros-home-theme');

      if (savedTheme === 'dark') {
        body.classList.add('dark');
        body.classList.remove('day');
      } else {
        body.classList.add('day');
        body.classList.remove('dark');
      }

      toggle.addEventListener('click', function () {
        body.classList.toggle('dark');
        body.classList.toggle('day');

        const isDark = body.classList.contains('dark');
        localStorage.setItem('cigaros-home-theme', isDark ? 'dark' : 'day');
      });
    })();
  </script>
</body>
</html>
