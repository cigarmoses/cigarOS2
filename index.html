<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CigarOS</title>

<link rel="stylesheet" href="/css/type.css" />

<style>

:root{
--safe-top: env(safe-area-inset-top,0px);
--safe-bottom: env(safe-area-inset-bottom,0px);

--screen-max:430px;

--bg:#edf2f6;
--panel-bg:rgba(255,255,255,.16);
--ink:#16263d;
--muted:#4d5f77;

--tile-size:140px;

--grid-gap-x:28px;
--grid-gap-y:8px;

--label-size:15px;
--label-weight:700;

--panel-radius:24px;

}

body.dark{
--bg:
radial-gradient(1200px 620px at 50% -10%, #0d1c36 0%, rgba(13,28,54,0) 55%),
linear-gradient(180deg,#07111f 0%,#030914 48%,#000000 100%);

--panel-bg:rgba(255,255,255,.045);
--ink:#eef5ff;
--muted:#acbbd0;
}

*{box-sizing:border-box;}

html,body{
margin:0;
min-height:100%;
}

body{
min-height:100dvh;
background:var(--bg);
color:var(--ink);

font-family:var(--font-display),
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"SF Pro Text",
system-ui,
sans-serif;

-webkit-font-smoothing:antialiased;

overflow-x:hidden;
overflow-y:auto;

transition:background .25s ease,color .25s ease;
}

.screen{

width:100%;
max-width:var(--screen-max);

margin:0 auto;

padding:

calc(var(--safe-top) + 70px)

14px

calc(var(--safe-bottom) + 100px);

display:flex;
flex-direction:column;
align-items:center;
}

.topbar{

position:fixed;

top:calc(var(--safe-top) + 16px);

right:16px;

z-index:50;

}

/* toggle */

.theme-toggle{

width:94px;
height:52px;

border-radius:999px;

background:rgba(180,190,205,.65);

border:none;

display:flex;
align-items:center;

position:relative;

backdrop-filter:blur(10px);

cursor:pointer;

}

.theme-icon{

width:38px;
height:38px;

position:absolute;

left:6px;

transition:left .25s ease;

}

body.dark .theme-icon{

left:50px;

}

.home-panel{

width:100%;

background:var(--panel-bg);

border-radius:var(--panel-radius);

padding:12px 16px 14px;

backdrop-filter:blur(10px);

}

.home-grid{

width:100%;

display:grid;

grid-template-columns:repeat(2,1fr);

justify-items:center;

gap:var(--grid-gap-y) var(--grid-gap-x);

}

.home-item{

display:flex;
flex-direction:column;
align-items:center;

text-decoration:none;

}

.tile-img{

width:var(--tile-size);
height:var(--tile-size);

object-fit:contain;

transition:transform .15s ease;

}

.home-item:active .tile-img{

transform:scale(.96);

}

.icon-label{

margin-top:4px;

font-size:var(--label-size);
font-weight:var(--label-weight);

letter-spacing:-.03em;

color:var(--muted);

}

/* responsive tuning */

@media (max-height:900px){

:root{
--tile-size:132px;
--grid-gap-y:6px;
}

}

@media (max-height:820px){

:root{
--tile-size:124px;
--grid-gap-y:4px;
}

}

</style>
</head>

<body class="day">

<div class="topbar">

<button class="theme-toggle" id="themeToggle">

<img id="themeIcon"
class="theme-icon"
src="/img/icons/sun.svg">

</button>

</div>

<main class="screen">

<section class="home-panel">

<div class="home-grid">

<a href="/pos/" class="home-item">
<img src="/img/icons/glass/pos.png" class="tile-img">
<div class="icon-label">POS</div>
</a>

<a href="/today/" class="home-item">
<img src="/img/icons/glass/today.png" class="tile-img">
<div class="icon-label">Today</div>
</a>

<a href="/loyalty/" class="home-item">
<img src="/img/icons/glass/loyalty.png" class="tile-img">
<div class="icon-label">Loyalty</div>
</a>

<a href="/inventory/" class="home-item">
<img src="/img/icons/glass/inventory.png" class="tile-img">
<div class="icon-label">Inventory</div>
</a>

<a href="/reports/" class="home-item">
<img src="/img/icons/glass/reports.png" class="tile-img">
<div class="icon-label">Reports</div>
</a>

<a href="/learn/" class="home-item">
<img src="/img/icons/glass/learn.png" class="tile-img">
<div class="icon-label">Learn</div>
</a>

<a href="/news/" class="home-item">
<img src="/img/icons/glass/news.png" class="tile-img">
<div class="icon-label">News</div>
</a>

<a href="/social/" class="home-item">
<img src="/img/icons/glass/cigarsocialglass.png" class="tile-img">
<div class="icon-label">Cigar Social</div>
</a>

</div>
</section>

</main>

<script>

const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

let dark=false;

toggle.onclick=()=>{

dark=!dark;

document.body.classList.toggle("dark");

icon.src = dark
? "/img/icons/moon.svg"
: "/img/icons/sun.svg";

};

</script>

</body>
</html>
