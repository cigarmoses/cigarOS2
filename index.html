<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>cigarOS2</title>
<meta name="color-scheme" content="light only" />
<style>
  :root{
    --bg:#eef2f6;
    --surface:#f6f9fc;
    --shadow-light: rgba(255,255,255,0.85);
    --shadow-dark:  rgba(35,60,90,0.20);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }

  header{padding:20px 16px 4px; text-align:center}
  .logo{
    height:64px;                /* logo stays smaller than tiles */
    max-width:78vw; object-fit:contain;
    filter: drop-shadow(-6px -6px 12px var(--shadow-light))
            drop-shadow( 8px  8px 18px var(--shadow-dark));
  }

  /* --- Grid of square neumorphic tiles --- */
  .grid{
    width:min(980px,94vw);
    margin:14px auto 28px;
    display:grid;
    gap:20px;
    grid-template-columns:repeat(2,1fr); /* phones */
  }
  @media (min-width:760px){
    .grid{ grid-template-columns:repeat(3,1fr); }
  }
  @media (min-width:1080px){
    .grid{ grid-template-columns:repeat(4,1fr); }
  }

  .tile{
    aspect-ratio:1 / 1;                /* perfect square */
    border-radius:26px;
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    box-shadow:
      -12px -12px 20px var(--shadow-light),
       12px  12px 22px var(--shadow-dark);
    transition:transform .06s ease, box-shadow .12s ease;
    touch-action:manipulation;
  }
  .tile:active{
    transform:translateY(1px);
    box-shadow:
      -8px -8px 14px var(--shadow-light),
       8px  8px 16px var(--shadow-dark);
  }

  /* Your square SVG icons (no extra label/pod) */
  .icon{
    width:72%;               /* fills most of the square */
    height:72%;
    max-width:260px;         /* caps huge desktop tiles */
    max-height:260px;
    object-fit:contain;
    display:block;
    pointer-events:none;     /* taps go to link */
  }

  /* tweak the visual density a bit on very small screens */
  @media (max-width:360px){
    .grid{ gap:16px; }
    .icon{ width:68%; height:68%; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="img/logo.svg" alt="Smoke Cigar Shop &amp; Lounge">
</header>

<main class="grid" aria-label="App sections">
  <a class="tile" href="pos.html" aria-label="POS">
    <img class="icon" src="img/icons/pos.svg" alt="">
  </a>

  <a class="tile" href="today.html" aria-label="Today">
    <img class="icon" src="img/icons/today.svg" alt="">
  </a>

  <a class="tile" href="loyalty.html" aria-label="Loyalty">
    <img class="icon" src="img/icons/loyalty.svg" alt="">
  </a>

  <a class="tile" href="reports.html" aria-label="Reports">
    <img class="icon" src="img/icons/reports.svg" alt="">
  </a>

  <a class="tile" href="learn.html" aria-label="Learn">
    <img class="icon" src="img/icons/learn.svg" alt="">
  </a>

  <a class="tile" href="news.html" aria-label="News">
    <img class="icon" src="img/icons/news.svg" alt="">
  </a>

  <a class="tile" href="hub.html" aria-label="Hub">
    <img class="icon" src="img/icons/hub.svg" alt="">
  </a>
</main>

</body>
</html>
