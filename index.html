<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --bg:#020611;
      --bg2:#061120;
      --ink:#eef5ff;
      --muted:rgba(222,236,255,.78);
      --tile-size:140px;
      --icon-size:140px;
      --label-size:17px;
      --grid-gap-x:26px;
      --grid-gap-y:24px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
    }

    body{
      background:
        radial-gradient(1200px 700px at 50% -10%, #0a1c38 0%, rgba(10,28,56,0) 55%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 42%, #000 100%);
      color:var(--ink);
      font-family: var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      display:flex;
      justify-content:flex-start;
      align-items:center;
      flex-direction:column;
      padding:28px 20px 42px;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .home-shell{
      width:100%;
      max-width:420px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .shop-logo{
      width:72px;
      height:auto;
      margin:8px 0 26px;
      display:block;
    }

    .home-grid{
      width:100%;
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:var(--grid-gap-y) var(--grid-gap-x);
      justify-items:center;
      align-items:start;
      padding-bottom:24px;
    }

    .home-item{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-decoration:none;
      color:var(--ink);
      -webkit-tap-highlight-color:transparent;
      transition:transform .16s ease, opacity .16s ease;
    }

    .home-item:active{
      transform:scale(.98);
      opacity:.96;
    }

    .home-item img{
      width:var(--icon-size);
      height:var(--icon-size);
      object-fit:contain;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      filter:
        drop-shadow(0 8px 18px rgba(25,120,255,.08))
        drop-shadow(0 2px 8px rgba(255,255,255,.03));
    }

    .home-item span{
      display:block;
      margin-top:10px;
      font-size:var(--label-size);
      line-height:1.15;
      font-weight:600;
      letter-spacing:-0.02em;
      color:var(--muted);
      text-align:center;
    }

    @media (max-width:390px){
      :root{
        --icon-size:128px;
        --label-size:16px;
        --grid-gap-x:18px;
        --grid-gap-y:20px;
      }

      body{
        padding-left:16px;
        padding-right:16px;
      }

      .shop-logo{
        width:66px;
        margin-bottom:22px;
      }
    }
  </style>
</head>

<body>
  <main class="home-shell">
    <img src="/img/homescreenlogo.svg" alt="CigarOS" class="shop-logo" />

    <section class="home-grid" aria-label="CigarOS Home">
      <a href="/pos/" class="home-item">
        <img src="/img/icons/glass/pos.png" alt="POS" />
        <span>POS</span>
      </a>

      <a href="/today/" class="home-item">
        <img src="/img/icons/glass/today.png" alt="Today" />
        <span>Today</span>
      </a>

      <a href="/loyalty/" class="home-item">
        <img src="/img/icons/glass/loyalty.png" alt="Loyalty" />
        <span>Loyalty</span>
      </a>

      <a href="/inventory/" class="home-item">
        <img src="/img/icons/glass/inventory.png" alt="Inventory" />
        <span>Inventory</span>
      </a>

      <a href="/reports/" class="home-item">
        <img src="/img/icons/glass/reports.png" alt="Reports" />
        <span>Reports</span>
      </a>

      <a href="/learn/" class="home-item">
        <img src="/img/icons/glass/learn.png" alt="Learn" />
        <span>Learn</span>
      </a>

      <a href="/news/" class="home-item">
        <img src="/img/icons/glass/news.png" alt="News" />
        <span>News</span>
      </a>

      <a href="/social/" class="home-item">
        <img src="/img/icons/glass/messages.png" alt="Cigar Social" />
        <span>Cigar Social</span>
      </a>
    </section>
  </main>

  <script src="/js/global.js" defer></script>
</body>
</html>
