<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CigarOS Home</title>
<style>
  :root {
    --bg: #f5f6fa;
    --tile-bg: #ffffff;
    --shadow: 0 4px 10px rgba(0,0,0,0.08);
    --radius: 20px;
  }

  body {
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 0 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header img {
    width: 160px;
    height: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 130px);
    gap: 28px;
    justify-content: center;
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--tile-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
  }

  .tile img {
    width: 56px;
    height: 56px;
  }
</style>
</head>
<body>
  <header>
    <img src="/img/logo-smoke.png" alt="Smoke Cigar Shop & Lounge logo" />
  </header>

  <main class="grid">
    <!-- POS -->
    <a href="/pos/" class="tile" title="Go to POS">
      <img src="/img/icons/pos.svg" alt="POS Icon" />
    </a>

    <!-- Calendar -->
    <a href="/calendar.html" class="tile" title="Calendar">
      <img src="/img/icons/calendar.svg" alt="Calendar Icon" />
    </a>

    <!-- Profile -->
    <a href="/profile.html" class="tile" title="Profile">
      <img src="/img/icons/profile.svg" alt="Profile Icon" />
    </a>

    <!-- Social -->
    <a href="/social.html" class="tile" title="Social">
      <img src="/img/icons/share.svg" alt="Share Icon" />
    </a>

    <!-- Learn -->
    <a href="/learn.html" class="tile" title="Learn">
      <img src="/img/icons/learn.svg" alt="Learn Icon" />
    </a>

    <!-- News -->
    <a href="/news.html" class="tile" title="News">
      <img src="/img/icons/news.svg" alt="News Icon" />
    </a>

    <!-- The Hub -->
    <a href="/hub/" class="tile" title="The Hub">
      <img src="/img/icons/thehub.svg" alt="The Hub Icon" />
    </a>
  </main>
</body>
</html>
