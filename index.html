<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>cigarOS2</title>
  <link rel="icon" href="/img/logo.svg" />
  <meta name="color-scheme" content="light only" />
  <style>
    /* ===============================
       Neumorphic Home — Exact Theme
       =============================== */
    :root{
      /* Background + tile colors (set to a soft, cool-gray scheme) */
      --bg:            #EDF1F5;
      --tile:          #F7FAFD;

      /* Outer drop shadows (neumorphism) */
      --shadow-dark:   rgba(22, 44, 76, 0.22);   /* bottom-right */
      --shadow-light:  rgba(255,255,255,0.95);   /* top-left    */

      /* Inner inset shadows for the icon “well” */
      --inset-dark:    rgba(22, 44, 76, 0.20);
      --inset-light:   rgba(255,255,255,1);

      /* Optional tint if your SVGs are monotone (not applied to multi-color art) */
      --icon-tint:     #24373B;

      /* Sizing */
      --tile-size:     clamp(120px, 30vw, 200px);  /* square size */
      --gap:           clamp(14px, 3.5vw, 26px);   /* spacing     */
    }

    /* Base layout */
    *{ box-sizing: border-box }
    html,body{ height:100% }
    body{
      margin:0;
      background: var(--bg);
      color:#0f2b2c;
      -webkit-font-smoothing: antialiased;
      font:16px/1.35 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue";
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* Logo header */
    header{ padding:22px 16px 8px; text-align:center }
    .logo{
      height:66px; max-width:78vw; object-fit:contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.06));
      user-select:none; -webkit-user-drag:none;
    }

    /* Grid of square tiles */
    .grid{
      width:min(1000px, 94vw);
      display:grid;
      grid-template-columns: repeat(2, var(--tile-size));
      justify-content:center;
      gap: var(--gap);
      margin: 8px auto 28px;
    }
    @media (min-width:760px){
      .grid{ grid-template-columns: repeat(3, var(--tile-size)); }
    }

    /* Neumorphic tile (square) */
    .tile{
      width:var(--tile-size);
      aspect-ratio:1/1;
      border-radius:28px;
      background:var(--tile);
      display:grid; place-items:center;
      text-decoration:none;
      box-shadow:
        14px 22px 36px var(--shadow-dark),
       -10px -10px 28px var(--shadow-light);
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Inner “icon well” for depth */
    .tile::before{
      content:"";
      position:absolute;
      width:56%;
      height:56%;
      border-radius:20px;
      background:var(--tile);
      box-shadow:
        inset 10px 10px 18px var(--inset-dark),
        inset -10px -10px 18px var(--inset-light);
      transition: transform .12s ease;
    }

    /* Pressed state */
    .tile:active{
      transform: translateY(2px);
      box-shadow:
        8px 14px 24px var(--shadow-dark),
       -6px -6px 18px var(--shadow-light);
    }
    .tile:active::before{ transform: scale(0.985); }

    /* Your SVG icons (no extra text labels) */
    .icon{
      position:relative; z-index:1;
      width:58%; height:auto; display:block;
      pointer-events:none; user-select:none; -webkit-user-drag:none;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.08));
    }
    /* If you need a global tint for single-color SVGs, add class "tint" to the <img> and uncomment below
    .tint{ filter: none; }
    .tint path, .tint use, .tint svg { fill: var(--icon-tint) !important; }
    */

    /* Centered HUB (same size as others) */
    .hub-wrapper{
      grid-column: 1 / -1;
      display:flex; justify-content:center;
      margin-top: var(--gap);
      margin-bottom: 20px;
    }

    .spacer{ height:12px }
  </style>
</head>
<body>

  <header>
    <img class="logo" src="/img/logo.svg" alt="Smoke Cigar Shop &amp; Lounge">
  </header>

  <main class="grid" aria-label="Main Apps">
    <a class="tile" href="/pos.html" aria-label="POS">
      <img class="icon" src="/img/icons/pos.svg" alt="">
    </a>

    <a class="tile" href="/today.html" aria-label="Today">
      <img class="icon" src="/img/icons/today.svg" alt="">
    </a>

    <a class="tile" href="/loyalty.html" aria-label="Loyalty">
      <img class="icon" src="/img/icons/loyalty.svg" alt="">
    </a>

    <a class="tile" href="/reports.html" aria-label="Reports">
      <img class="icon" src="/img/icons/reports.svg" alt="">
    </a>

    <a class="tile" href="/learn.html" aria-label="Learn">
      <img class="icon" src="/img/icons/learn.svg" alt="">
    </a>

    <a class="tile" href="/news.html" aria-label="News">
      <img class="icon" src="/img/icons/news.svg" alt="">
    </a>

    <!-- HUB: same-size square, centered on its own row -->
    <div class="hub-wrapper">
      <a class="tile" href="/hub.html" aria-label="Hub">
        <img class="icon" src="/img/icons/hub.svg" alt="">
      </a>
    </div>
  </main>

  <div class="spacer"></div>
</body>
</html>
