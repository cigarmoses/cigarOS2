<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reports</title>
<style>
  :root{--bg:#f5f6fa;--tile:#fff;--radius:20px;--sh:0 4px 10px rgba(0,0,0,.08);--sh2:0 6px 16px rgba(0,0,0,.10)}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 0 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px} header img{width:32px;height:32px;border-radius:6px}
  .grid{display:grid;grid-template-columns:repeat(2,130px);gap:28px;justify-content:center}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:130px;height:130px;background:var(--tile);border-radius:20px;box-shadow:var(--sh);text-decoration:none;color:#111;transition:.15s transform,.2s box-shadow}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
  .tile svg{width:40px;height:40px;margin-bottom:10px}
  .label{font-weight:800;font-size:14px}
</style></head>
<body>
  <header><a href="/"><img src="/img/logo-smoke.png" alt="Back"/></a><span>Reports</span></header>
  <main class="grid">
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19h16M6 19V7a1 1 0 011-1h2v13M14 19V5h2a1 1 0 011 1v13" stroke="#2f8cff" stroke-width="1.5"/></svg><div class="label">Sales</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="#2f8cff" stroke-width="1.5"/><path d="M7 9h10M7 13h6M7 17h8" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Inventory</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="10" r="3" stroke="#2f8cff" stroke-width="1.5"/><path d="M3 20c1.5-3 4-4.5 6-4.5s4.5 1.5 6 4.5" stroke="#2f8cff" stroke-width="1.5"/><rect x="14" y="8" width="7" height="7" rx="1.5" fill="#a7d0ff"/></svg><div class="label">Customers</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M6 7h12M6 12h12M6 17h12" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Exports</div></a>
  </main>
</body></html>
