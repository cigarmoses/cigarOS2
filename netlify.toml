[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/pos"
  to = "/pos/index.html"
  status = 200

[[redirects]]
  from = "/pos/*"
  to = "/pos/index.html"
  status = 200

# Hub points to existing root-level hub.html
[[redirects]]
  from = "/hub"
  to = "/hub.html"
  status = 200

[[redirects]]
  from = "/hub/*"
  to = "/hub.html"
  status = 200
