# Shops (LIST)
[[redirects]]
  from = "/shops"
  to = "/shops/index.html"
  status = 200

# Shops (PRETTY URL -> shop-page)
# /shops/cigarsinternationalbridgeville  -> /shops/shop-page.html?shop=cigarsinternationalbridgeville
[[redirects]]
  from = "/shops/:slug"
  to = "/shops/shop-page.html?shop=:slug"
  status = 200

# Shops fallback
[[redirects]]
  from = "/shops/*"
  to = "/shops/index.html"
  status = 200
