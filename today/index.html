<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Today</title>
<style>
  :root{--bg:#f5f6fa;--tile:#fff;--radius:20px;--sh:0 4px 10px rgba(0,0,0,.08);--sh2:0 6px 16px rgba(0,0,0,.10);--muted:#667085}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 0 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  header a{display:inline-flex;align-items:center;text-decoration:none;color:#111;font-weight:700}
  header img{width:32px;height:32px;border-radius:6px}
  .hint{color:var(--muted);font-size:12px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(2,130px);gap:28px;justify-content:center}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:130px;height:130px;background:var(--tile);border-radius:var(--radius);box-shadow:var(--sh);text-decoration:none;color:#111;transition:.15s transform,.2s box-shadow}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
  .tile svg{width:40px;height:40px;margin-bottom:10px}
  .label{font-weight:800;font-size:14px}
</style></head>
<body>
  <header>
    <a href="/"><img src="/img/logo-smoke.png" alt="Back" /></a>
    <span>Today</span>
  </header>
  <div class="hint">Tap to open.</div>

  <main class="grid">
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="15" rx="2.5" stroke="#2f8cff" stroke-width="1.5"/><rect x="3" y="8" width="18" height="3" fill="#a7d0ff"/><circle cx="12" cy="15" r="3" fill="#2f8cff"/></svg><div class="label">Calendar</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#2f8cff" stroke-width="1.5"/><path d="M7 13h10M7 9h10M7 17h6" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Tasks</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4v5c0 5-4 7-8 9-4-2-8-4-8-9V7l8-4z" stroke="#2f8cff" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="#a7d0ff"/></svg><div class="label">Events</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="2" stroke="#2f8cff" stroke-width="1.5"/><path d="M6 8h12M6 12h10M6 16h8" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Notes</div></a>
  </main>
</body></html>
