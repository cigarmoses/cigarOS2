<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Today • CigarOS</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #eff2f7;
      --ink: #101828;
      --muted: rgba(16,24,40,.58);
      --muted-2: rgba(16,24,40,.42);

      --surface: rgba(255,255,255,.86);
      --surface-2: rgba(255,255,255,.94);
      --surface-border: rgba(15,23,40,.08);
      --surface-shadow: 0 12px 30px rgba(15,26,44,.08);

      --accent: #7c5cff;
      --link: #007aff;
    }

    html[data-theme="dark"]{
      --bg:
        radial-gradient(1200px 540px at 50% -8%, rgba(63,108,194,.22) 0%, rgba(20,44,92,.16) 28%, rgba(4,13,34,0) 58%),
        linear-gradient(180deg, #0f2856 0%, #07142f 48%, #041027 100%);
      --ink: #ffffff;
      --muted: rgba(255,255,255,.64);
      --muted-2: rgba(255,255,255,.42);

      --surface: rgba(13,21,39,.58);
      --surface-2: rgba(255,255,255,.08);
      --surface-border: rgba(255,255,255,.12);
      --surface-shadow: 0 12px 34px rgba(0,0,0,.26);

      --accent: #9a84ff;
      --link: #7db8ff;
    }

    *{ box-sizing:border-box; }
    html, body{ margin:0; min-height:100%; }

    body{
      min-height:100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      width: min(430px, calc(100% - 28px));
      margin: 0 auto;
      padding-top: calc(10px + var(--safe-top));
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
    }

    .tb-btn{
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: var(--surface-2);
      box-shadow: var(--surface-shadow);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    .tb-btn svg{
      width: 20px;
      height: 20px;
      display: block;
    }

    .theme-toggle{
      position: relative;
      width: 58px;
      height: 34px;
      border: 0;
      padding: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle-track{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #c7d1de;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    }

    .theme-toggle-knob{
      position: absolute;
      top: 3px;
      left: 3px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,.18);
      transition: transform .22s ease;
      display: grid;
      place-items: center;
      color: #0f1728;
    }

    html[data-theme="dark"] .theme-toggle-knob{
      transform: translateX(24px);
    }

    .theme-icon{
      position: absolute;
      width: 14px;
      height: 14px;
    }

    .theme-icon-moon{ display:none; }
    html[data-theme="dark"] .theme-icon-sun{ display:none; }
    html[data-theme="dark"] .theme-icon-moon{ display:block; }

    .page{
      width: min(430px, calc(100% - 28px));
      margin: 0 auto;
      padding: 6px 0 calc(34px + var(--safe-bottom));
    }

    .date-headline{
      margin: 8px 2px 18px;
    }

    .date-month{
      font-family: var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      color: var(--muted);
    }

    .date-dow{
      margin-top: 2px;
      font-family: var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 58px;
      line-height: .92;
      font-weight: 800;
      letter-spacing: -.05em;
      color: var(--ink);
    }

    .actions-row{
      display:flex;
      justify-content:flex-end;
      margin: -4px 2px 14px;
    }

    .history-link{
      border:none;
      background:transparent;
      color:var(--link);
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size:15px;
      font-weight:700;
      padding:0;
      cursor:pointer;
      text-decoration:underline;
    }

    .stats-row{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:10px;
      margin-bottom:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
    }

    .full-row{ grid-column:1 / -1; }

    .card{
      background:var(--surface);
      border:1px solid var(--surface-border);
      border-radius:24px;
      box-shadow:var(--surface-shadow);
      padding:14px 14px 13px;
      backdrop-filter:blur(18px) saturate(1.05);
      -webkit-backdrop-filter:blur(18px) saturate(1.05);
    }

    .card-label,
    .section-label{
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.05em;
      font-weight:700;
      color:var(--muted);
      margin-bottom:4px;
    }

    .card-value{
      font-family:var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size:34px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.04em;
      color:var(--ink);
    }

    .simple-list,
    .history-list{
      list-style:none;
      padding:0;
      margin:4px 0 0;
    }

    .simple-list li{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      padding:4px 0;
    }

    .simple-label{
      font-size:15px;
      font-weight:600;
      color:var(--ink);
    }

    .simple-meta{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }

    .history-card{
      border-left:4px solid var(--accent);
      padding-left:12px;
    }

    .history-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:7px 0;
      cursor:pointer;
      border-radius:10px;
    }

    .history-row:active{ opacity:.72; }

    .history-name{
      font-size:15px;
      font-weight:700;
      color:var(--ink);
    }

    .history-amount{
      font-size:14px;
      font-weight:700;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }

    .link-btn{
      border:none;
      background:transparent;
      color:var(--link);
      font-size:15px;
      font-weight:700;
      padding:6px 0 0;
      margin-top:4px;
      cursor:pointer;
      text-decoration:underline;
      text-align:left;
    }

    #datePicker{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:0;
      height:0;
    }

    .tony-fab{
      position:fixed;
      left:16px;
      bottom:calc(16px + var(--safe-bottom));
      width:46px;
      height:46px;
      border-radius:999px;
      background:transparent;
      border:none;
      padding:0;
      z-index:40;
    }

    .tony-fab img{
      width:100%;
      height:100%;
      display:block;
      border-radius:inherit;
    }

    @media (max-width:390px){
      .date-dow{ font-size:52px; }
      .card-value{ font-size:30px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="tb-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" aria-pressed="false">
      <span class="theme-toggle-track" aria-hidden="true"></span>
      <span class="theme-toggle-knob" aria-hidden="true">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.5 3.5a8 8 0 1 0 6 13.3A9 9 0 0 1 14.5 3.5Z" fill="currentColor"></path>
        </svg>
      </span>
    </button>
  </header>

  <main class="page">
    <section class="date-headline">
      <div class="date-month" id="headlineMonth">DECEMBER 1</div>
      <div class="date-dow" id="headlineDow">MON</div>
    </section>

    <div class="actions-row">
      <button class="history-link" id="historyBtn">History</button>
      <input type="date" id="datePicker" />
    </div>

    <section class="stats-row">
      <article class="card">
        <div class="card-label">Cigars</div>
        <div class="card-value" id="cigarsCount">0</div>
      </article>

      <article class="card">
        <div class="card-label">Sales</div>
        <div class="card-value" id="salesTotal">0</div>
      </article>

      <article class="card">
        <div class="card-label">Avg</div>
        <div class="card-value" id="avgSale">0</div>
      </article>
    </section>

    <section class="grid">
      <article class="card">
        <div class="section-label">Vitola</div>
        <ul class="simple-list" id="vitolaList"></ul>
      </article>

      <article class="card">
        <div class="section-label">Brand</div>
        <ul class="simple-list" id="brandList"></ul>
      </article>

      <article class="card history-card full-row">
        <div class="section-label">History</div>
        <ul class="history-list" id="historyList"></ul>
        <button class="link-btn" id="viewAllBtn">View all transactions</button>
      </article>
    </section>
  </main>

  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script>
    const CUSTOMER_POOL = [
      { id: "moses", first: "Alex", last: "Moses" },
      { id: "nguyen", first: "Linh", last: "Nguyen" },
      { id: "sibbett", first: "Jamie", last: "Sibbett" },
      { id: "mcclure", first: "Pat", last: "McClure" },
      { id: "kennedy", first: "Chris", last: "Kennedy" },
      { id: "brown", first: "Taylor", last: "Brown" },
      { id: "rodriguez", first: "Carlos", last: "Rodriguez" },
      { id: "lee", first: "Jordan", last: "Lee" },
      { id: "smith", first: "Morgan", last: "Smith" },
      { id: "guest", first: "Guest", last: "Guest" }
    ];

    const PRODUCT_POOL = [
      { id: "af-hemingway-short-story", name: "Arturo Fuente Hemingway Short Story", brand: "Arturo Fuente", vitola: "Robusto", msrp: 10.95 },
      { id: "padron-1964-toro", name: "Padron 1964 Anniversary Toro Maduro", brand: "Padron", vitola: "Toro", msrp: 18.50 },
      { id: "oscar-valadas-leaf-gordo", name: "Oscar Valladares Leaf by Oscar Gordo", brand: "Oscar Valladares", vitola: "Gordo", msrp: 12.50 },
      { id: "af-chateau-fuente", name: "Arturo Fuente Chateau Fuente", brand: "Arturo Fuente", vitola: "Toro", msrp: 9.75 },
      { id: "padron-3000-natural", name: "Padron 3000 Natural", brand: "Padron", vitola: "Robusto", msrp: 11.50 },
      { id: "oscar-wild-hunter-toro", name: "Oscar Valladares Wild Hunter Toro", brand: "Oscar Valladares", vitola: "Toro", msrp: 10.25 }
    ];

    function generateSampleSalesForDay(dateStr) {
      const sales = [];
      let remainingCigars = 133;
      let ticketIndex = 1;
      const base = new Date(dateStr + "T10:00:00");

      while (remainingCigars > 0) {
        const maxQty = Math.min(4, remainingCigars);
        const qty = Math.max(1, Math.floor(Math.random() * maxQty) + 1);
        remainingCigars -= qty;

        const customer = CUSTOMER_POOL[Math.floor(Math.random() * CUSTOMER_POOL.length)];
        const product = PRODUCT_POOL[Math.floor(Math.random() * PRODUCT_POOL.length)];
        const ticketTime = new Date(base.getTime() + ticketIndex * 7 * 60000);
        const lineTotal = product.msrp * qty;

        sales.push({
          id: `T-${dateStr.replace(/-/g, "")}-${String(ticketIndex).padStart(3,"0")}`,
          date: dateStr,
          timestamp: ticketTime.toISOString(),
          customerId: customer.id,
          customerFirst: customer.first,
          customerLast: customer.last,
          items: [{
            sku: product.id,
            name: product.name,
            brand: product.brand,
            vitola: product.vitola,
            qty,
            msrp: product.msrp,
            lineTotal
          }],
          ticketTotal: lineTotal
        });

        ticketIndex++;
      }
      return sales;
    }

    const SALES_DATA = generateSampleSalesForDay("2025-12-01");

    const cigarsCountEl = document.getElementById("cigarsCount");
    const salesTotalEl = document.getElementById("salesTotal");
    const avgSaleEl = document.getElementById("avgSale");
    const vitolaListEl = document.getElementById("vitolaList");
    const brandListEl = document.getElementById("brandList");
    const historyListEl = document.getElementById("historyList");
    const headlineMonthEl = document.getElementById("headlineMonth");
    const headlineDowEl = document.getElementById("headlineDow");
    const datePickerEl = document.getElementById("datePicker");

    let currentDate = "2025-12-01";

    function getTheme() {
      return localStorage.getItem("theme") || document.documentElement.getAttribute("data-theme") || "light";
    }

    function applyTheme(theme) {
      const next = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      document.getElementById("themeToggle")?.setAttribute("aria-pressed", String(next === "dark"));
    }

    function formatCurrency(num) {
      return num.toLocaleString(undefined, {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2
      });
    }

    function formatMonthAndDay(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const monthName = d.toLocaleDateString(undefined, { month: "long" });
      return `${monthName.toUpperCase()} ${d.getDate()}`;
    }

    function formatDow(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      return d.toLocaleDateString(undefined, { weekday: "short" }).toUpperCase();
    }

    function getSalesForDate(dateStr) {
      return SALES_DATA.filter(s => s.date === dateStr);
    }

    function updateSummaryForDate(dateStr) {
      const tickets = getSalesForDate(dateStr);

      headlineMonthEl.textContent = formatMonthAndDay(dateStr);
      headlineDowEl.textContent = formatDow(dateStr);

      if (!tickets.length) {
        cigarsCountEl.textContent = "0";
        salesTotalEl.textContent = "0";
        avgSaleEl.textContent = "0";
        vitolaListEl.innerHTML = "<li><span class='simple-meta'>No sales</span></li>";
        brandListEl.innerHTML = "<li><span class='simple-meta'>No sales</span></li>";
        historyListEl.innerHTML = "<li><span class='simple-meta'>No sales</span></li>";
        return;
      }

      let totalCigars = 0;
      let totalSales = 0;
      const vitolaCounts = {};
      const brandCounts = {};

      tickets.forEach(t => {
        totalSales += t.ticketTotal;
        t.items.forEach(item => {
          totalCigars += item.qty;
          vitolaCounts[item.vitola] = (vitolaCounts[item.vitola] || 0) + item.qty;
          brandCounts[item.brand] = (brandCounts[item.brand] || 0) + item.qty;
        });
      });

      const avgSale = tickets.length ? totalSales / tickets.length : 0;

      cigarsCountEl.textContent = totalCigars;
      salesTotalEl.textContent = (totalSales / 1000).toFixed(1);
      avgSaleEl.textContent = Math.round(avgSale);

      const vitolaEntries = Object.entries(vitolaCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
      vitolaListEl.innerHTML = "";
      vitolaEntries.forEach(([name, count]) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="simple-label">${name}</span><span class="simple-meta">${count}</span>`;
        vitolaListEl.appendChild(li);
      });

      const brandEntries = Object.entries(brandCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
      brandListEl.innerHTML = "";
      brandEntries.forEach(([name, count]) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="simple-label">${name}</span><span class="simple-meta">${count}</span>`;
        brandListEl.appendChild(li);
      });

      const lastTen = [...tickets].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).slice(-10);
      historyListEl.innerHTML = "";

      lastTen.forEach(t => {
        const li = document.createElement("li");
        li.className = "history-row";
        li.dataset.customerId = t.customerId;

        const nameSpan = document.createElement("span");
        nameSpan.className = "history-name";
        nameSpan.textContent = `${t.customerFirst} ${t.customerLast}`;

        const amtSpan = document.createElement("span");
        amtSpan.className = "history-amount";
        amtSpan.textContent = formatCurrency(t.ticketTotal);

        li.appendChild(nameSpan);
        li.appendChild(amtSpan);

        li.addEventListener("click", () => {
          window.location.href = `/loyalty/?customer=${encodeURIComponent(t.customerId)}`;
        });

        historyListEl.appendChild(li);
      });
    }

    applyTheme(getTheme());

    document.getElementById("themeToggle").addEventListener("click", () => {
      applyTheme(getTheme() === "dark" ? "light" : "dark");
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else window.location.href = "/";
    });

    document.getElementById("historyBtn").addEventListener("click", () => {
      try { datePickerEl.showPicker(); }
      catch { datePickerEl.click(); }
    });

    datePickerEl.addEventListener("change", e => {
      const ds = e.target.value;
      if (!ds) return;
      currentDate = ds;
      updateSummaryForDate(ds);
    });

    document.getElementById("viewAllBtn").addEventListener("click", () => {
      window.location.href = "/reports/transactions/";
    });

    document.getElementById("tonyFab").addEventListener("click", () => {
      window.location.href = "/tony/";
    });

    (() => {
      datePickerEl.value = currentDate;
      updateSummaryForDate(currentDate);
    })();
  </script>
</body>
</html>
