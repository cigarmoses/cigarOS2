<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Today • CigarOS 2</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #8e8e93;
      --accent: #7c5cff;
      --accent-soft: #efe8ff;
      --link-blue: #007aff;
      --pill-yellow-soft: #fff5d6;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 10px 12px 40px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 10px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn {
      border: none;
      background: #e4e4ea;
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }
    .back-arrow {
      font-size: 16px;
      margin-bottom: 1px;
    }
    .top-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: normal;
    }
    .history-btn {
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--link-blue);
      padding: 6px 4px;
      text-decoration: underline;
    }

    /* Date headline */
    .date-headline {
      margin: 10px 2px 14px;
    }
    .date-headline .month {
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .date-headline .dow {
      font-size: 52px;        /* bigger MON */
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    /* Hidden date picker */
    #datePicker {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 14px 14px;
      box-shadow: 0 12px 30px rgba(15, 26, 44, 0.08);
    }

    .card-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink);      /* black */
      font-weight: 700;       /* bold */
      margin-bottom: 2px;
    }
    .card-value {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.15;
    }

    .card-label-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--pill-yellow-soft);
      margin-left: -4px;
      margin-bottom: 6px;
    }
    .card-label-pill span {
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;       /* bold */
      color: var(--ink);      /* black */
    }

    /* Top stats row: Cigars / Sales / Avg */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    /* Lower grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .full-row {
      grid-column: 1 / -1;
    }

    /* Lists */
    .simple-list {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      font-size: 15px;
    }
    .simple-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3px 0;
    }
    .simple-list .label {
      font-weight: 500;
    }
    .simple-list .meta {
      font-size: 13px;
      color: var(--muted);
      margin-left: 8px;
    }

    /* History block */
    .history-card {
      border-left: 4px solid var(--accent);
      padding-left: 10px;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      font-size: 15px;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-radius: 10px;
      cursor: pointer;
    }
    .history-row:active {
      background: rgba(124, 92, 255, 0.08);
    }
    .history-name {
      font-weight: 600;
    }
    .history-amount {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
    }

    /* Link-style button (View all transactions) */
    .link-btn {
      border: none;
      background: transparent;
      padding: 6px 0 0;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 500;
      color: var(--link-blue);
      text-decoration: underline;
      cursor: pointer;
      text-align: left;
    }

    /* Tony floating icon bottom-left */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      z-index: 40;
    }

    @media (max-width: 360px) {
      .card-value { font-size: 28px; }
      .history-list, .simple-list { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-btn" id="backBtn">
          <span class="back-arrow">‹</span>
          <span>Back</span>
        </button>
      </div>
      <div class="top-title">Today</div>
      <button class="history-btn" id="historyBtn">History</button>
      <input type="date" id="datePicker" />
    </header>

    <!-- Date headline -->
    <section class="date-headline">
      <div class="month" id="headlineMonth">DECEMBER 1</div>
      <div class="dow" id="headlineDow">MON</div>
    </section>

    <!-- Top stats row: Cigars / Sales / Avg -->
    <section class="stats-row">
      <article class="card">
        <div class="card-label">Cigars</div>
        <div class="card-value" id="cigarsCount">0</div>
      </article>

      <article class="card">
        <div class="card-label">Sales</div>
        <div class="card-value" id="salesTotal">0</div>
      </article>

      <article class="card">
        <div class="card-label">Avg</div>
        <div class="card-value" id="avgSale">0</div>
      </article>
    </section>

    <!-- Lower grid: Vitola + Brand side by side, History full width -->
    <section class="grid">
      <!-- Vitola -->
      <article class="card">
        <div class="card-label-pill">
          <span>Vitola</span>
        </div>
        <ul class="simple-list" id="vitolaList"></ul>
      </article>

      <!-- Brand -->
      <article class="card">
        <div class="card-label-pill">
          <span>Brand</span>
        </div>
        <ul class="simple-list" id="brandList"></ul>
      </article>

      <!-- History -->
      <article class="card history-card full-row">
        <div class="card-label">History</div>
        <ul class="history-list" id="historyList"></ul>
        <button class="link-btn" id="viewAllBtn">View all transactions</button>
      </article>
    </section>
  </div>

  <!-- Tony floating icon (bottom-left, same on all pages) -->
  <button class="tony-fab" id="tonyFab">🧔🏻‍♂️</button>

  <script>
    /************************************************************
     * SAMPLE SALES DATA
     ************************************************************/

    const CUSTOMER_POOL = [
      { id: "moses",   first: "Alex",  last: "Moses"   },
      { id: "nguyen",  first: "Linh",  last: "Nguyen"  },
      { id: "sibbett", first: "Jamie", last: "Sibbett" },
      { id: "mcclure", first: "Pat",   last: "McClure" },
      { id: "kennedy", first: "Chris", last: "Kennedy" },
      { id: "brown",   first: "Taylor",last: "Brown"   },
      { id: "rodriguez",first:"Carlos",last:"Rodriguez"},
      { id: "lee",     first: "Jordan",last: "Lee"     },
      { id: "smith",   first: "Morgan",last: "Smith"   },
      { id: "guest",   first: "Guest", last: "Guest"   }
    ];

    const PRODUCT_POOL = [
      {
        id: "af-hemingway-short-story",
        name: "Arturo Fuente Hemingway Short Story",
        brand: "Arturo Fuente",
        vitola: "Robusto",
        msrp: 10.95
      },
      {
        id: "padron-1964-toro",
        name: "Padrón 1964 Anniversary Toro Maduro",
        brand: "Padron",
        vitola: "Toro",
        msrp: 18.50
      },
      {
        id: "oscar-valadas-leaf-gordo",
        name: "Oscar Valladares Leaf by Oscar Gordo",
        brand: "Oscar Valladares",
        vitola: "Gordo",
        msrp: 12.50
      },
      {
        id: "af-chateau-fuente",
        name: "Arturo Fuente Chateau Fuente",
        brand: "Arturo Fuente",
        vitola: "Toro",
        msrp: 9.75
      },
      {
        id: "padron-3000-natural",
        name: "Padrón 3000 Natural",
        brand: "Padron",
        vitola: "Robusto",
        msrp: 11.50
      },
      {
        id: "oscar-wild-hunter-toro",
        name: "Oscar Valladares Wild Hunter Toro",
        brand: "Oscar Valladares",
        vitola: "Toro",
        msrp: 10.25
      }
    ];

    function generateSampleSalesForDay(dateStr) {
      const sales = [];
      let remainingCigars = 133;
      let ticketIndex = 1;
      const base = new Date(dateStr + "T10:00:00");

      while (remainingCigars > 0) {
        const maxQty = Math.min(4, remainingCigars);
        const qty = Math.max(1, Math.floor(Math.random() * maxQty) + 1);
        remainingCigars -= qty;

        const customer =
          CUSTOMER_POOL[Math.floor(Math.random() * CUSTOMER_POOL.length)];
        const product =
          PRODUCT_POOL[Math.floor(Math.random() * PRODUCT_POOL.length)];

        const ticketTime = new Date(base.getTime() + ticketIndex * 7 * 60000);
        const lineTotal = product.msrp * qty;

        sales.push({
          id: `T-${dateStr.replace(/-/g, "")}-${String(ticketIndex).padStart(3,"0")}`,
          date: dateStr,
          timestamp: ticketTime.toISOString(),
          customerId: customer.id,
          customerFirst: customer.first,
          customerLast: customer.last,
          items: [
            {
              sku: product.id,
              name: product.name,
              brand: product.brand,
              vitola: product.vitola,
              qty,
              msrp: product.msrp,
              lineTotal
            }
          ],
          ticketTotal: lineTotal
        });

        ticketIndex++;
      }
      return sales;
    }

    const SALES_DATA = generateSampleSalesForDay("2025-12-01");

    /************************************************************
     * UI + AGGREGATION
     ************************************************************/

    const cigarsCountEl = document.getElementById("cigarsCount");
    const salesTotalEl = document.getElementById("salesTotal");
    const avgSaleEl = document.getElementById("avgSale");
    const vitolaListEl = document.getElementById("vitolaList");
    const brandListEl = document.getElementById("brandList");
    const historyListEl = document.getElementById("historyList");
    const headlineMonthEl = document.getElementById("headlineMonth");
    const headlineDowEl = document.getElementById("headlineDow");
    const datePickerEl = document.getElementById("datePicker");

    let currentDate = "2025-12-01";

    function formatCurrency(num) {
      return num.toLocaleString(undefined, {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2
      });
    }

    function formatMonthAndDay(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const monthName = d.toLocaleDateString(undefined, { month: "long" });
      return `${monthName.toUpperCase()} ${d.getDate()}`;
    }

    function formatDow(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      return d.toLocaleDateString(undefined, { weekday: "short" }).toUpperCase();
    }

    function getSalesForDate(dateStr) {
      return SALES_DATA.filter(s => s.date === dateStr);
    }

    function updateSummaryForDate(dateStr) {
      const tickets = getSalesForDate(dateStr);

      headlineMonthEl.textContent = formatMonthAndDay(dateStr);
      headlineDowEl.textContent = formatDow(dateStr);

      if (tickets.length === 0) {
        cigarsCountEl.textContent = "0";
        salesTotalEl.textContent = "0";
        avgSaleEl.textContent = "0";
        vitolaListEl.innerHTML = "<li><span class='meta'>No sales</span></li>";
        brandListEl.innerHTML = "<li><span class='meta'>No sales</span></li>";
        historyListEl.innerHTML = "<li><span class='meta'>No sales</span></li>";
        return;
      }

      let totalCigars = 0;
      let totalSales = 0;
      const vitolaCounts = {};
      const brandCounts = {};

      tickets.forEach(t => {
        totalSales += t.ticketTotal;
        t.items.forEach(item => {
          totalCigars += item.qty;
          vitolaCounts[item.vitola] =
            (vitolaCounts[item.vitola] || 0) + item.qty;
          brandCounts[item.brand] =
            (brandCounts[item.brand] || 0) + item.qty;
        });
      });

      const avgSale =
        tickets.length > 0 ? totalSales / tickets.length : 0;

      cigarsCountEl.textContent = totalCigars;
      const thousands = totalSales / 1000;
      salesTotalEl.textContent = thousands.toFixed(1);
      avgSaleEl.textContent = Math.round(avgSale);

      // Vitola list (top 3)
      const vitolaEntries = Object.entries(vitolaCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      vitolaListEl.innerHTML = "";
      vitolaEntries.forEach(([name, count]) => {
        const li = document.createElement("li");
        li.innerHTML =
          `<span class="label">${name}</span>` +
          `<span class="meta">${count}</span>`;
        vitolaListEl.appendChild(li);
      });

      // Brand list (top 3)
      const brandEntries = Object.entries(brandCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      brandListEl.innerHTML = "";
      brandEntries.forEach(([name, count]) => {
        const li = document.createElement("li");
        li.innerHTML =
          `<span class="label">${name}</span>` +
          `<span class="meta">${count}</span>`;
        brandListEl.appendChild(li);
      });

      // Last 10 sales (first + last name)
      const lastTen = [...tickets]
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
        .slice(-10);

      historyListEl.innerHTML = "";
      lastTen.forEach(t => {
        const li = document.createElement("li");
        li.className = "history-row";
        li.dataset.customerId = t.customerId;

        const nameSpan = document.createElement("span");
        nameSpan.className = "history-name";
        nameSpan.textContent = `${t.customerFirst} ${t.customerLast}`;

        const amtSpan = document.createElement("span");
        amtSpan.className = "history-amount";
        amtSpan.textContent = formatCurrency(t.ticketTotal);

        li.appendChild(nameSpan);
        li.appendChild(amtSpan);

        li.addEventListener("click", () => {
          const url = `/loyalty/?customer=${encodeURIComponent(t.customerId)}`;
          window.location.href = url;
        });

        historyListEl.appendChild(li);
      });
    }

    // Back button
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "/"; // home
    });

    // History button -> open date picker
    document.getElementById("historyBtn").addEventListener("click", () => {
      try {
        datePickerEl.showPicker();
      } catch (e) {
        datePickerEl.click();
      }
    });

    // Date picker change
    datePickerEl.addEventListener("change", e => {
      const ds = e.target.value;
      if (!ds) return;
      currentDate = ds;
      updateSummaryForDate(ds);
    });

    // View all transactions link
    document.getElementById("viewAllBtn").addEventListener("click", () => {
      // Update this path to wherever your full transaction list lives
      window.location.href = "/reports/transactions/";
    });

    // Tony FAB – route to Tony / Ask Tony overlay
    document.getElementById("tonyFab").addEventListener("click", () => {
      // Update this to your Tony page or overlay trigger
      window.location.href = "/tony/";
    });

    // Initial load
    (function init() {
      datePickerEl.value = currentDate;
      updateSummaryForDate(currentDate);
    })();
  </script>
</body>
</html>
