<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Favorites | Cigar Social</title>
  <link rel="stylesheet" href="/profile/favorites/favorites.css" />
</head>

<body class="favorites-page">
  <main class="fav-page">
    <header class="fav-topbar">
      <a class="fav-back" href="/profile/" aria-label="Back">‹</a>

      <button id="themeToggle" class="fav-theme-btn" type="button" aria-label="Toggle theme">
        <img id="themeIcon" src="/img/icons/moon.svg" alt="" />
      </button>
    </header>

    <section class="fav-hero">
      <h1>Favorites</h1>
    </section>

    <section class="fav-tabs" aria-label="Favorite categories">
      <button class="fav-tab active" type="button" data-type="cigar">Cigars</button>
      <button class="fav-tab" type="button" data-type="brand">Brands</button>
      <button class="fav-tab" type="button" data-type="shop">Shops</button>
    </section>

    <section class="fav-tools">
      <div class="fav-search-shell">
        <span class="fav-search-icon">⌕</span>
        <input id="favSearch" class="fav-search" type="search" placeholder="Search favorites" autocomplete="off" />
      </div>

      <button id="favFilterBtn" class="fav-filter-btn" type="button">Filters</button>

      <button id="favAddBtn" class="fav-add-btn" type="button" aria-label="Add favorite">+</button>
    </section>

    <section id="favAppliedFilters" class="fav-applied-filters" hidden></section>
    <section id="favStatus" class="fav-status" hidden></section>
    <section id="favList" class="fav-list" aria-live="polite"></section>
  </main>

  <div id="favFilterSheet" class="fav-sheet" aria-hidden="true">
    <div class="fav-sheet-backdrop" data-close-sheet></div>

    <section class="fav-sheet-panel" role="dialog" aria-modal="true" aria-label="Filters">
      <div class="fav-sheet-handle"></div>

      <header class="fav-sheet-header">
        <div>
          <h2>Filters</h2>
          <p id="favSheetSubtitle">Filter your saved cigars.</p>
        </div>

        <button id="favClearFilters" class="fav-clear-btn" type="button">Clear</button>
      </header>

      <div id="favFilterGroups" class="fav-filter-groups"></div>

      <footer class="fav-sheet-footer">
        <button id="favDoneFilters" class="fav-done-btn" type="button">Done</button>
      </footer>
    </section>
  </div>

  <script src="/profile/favorites/favorites.js"></script>
</body>
</html>
