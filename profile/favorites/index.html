<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Favorites</title>
  <link rel="stylesheet" href="./favorites.css" />
</head>

<body class="favorites-page">
  <main class="fav-shell">

    <header class="fav-topbar">
      <a class="back-btn" href="/profile/" aria-label="Back">‹</a>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <img class="theme-icon" id="themeIcon" src="/img/icons/sun.svg" alt="" />
      </button>
    </header>

    <section class="fav-hero">
      <h1 id="pageTitle">Favorites</h1>
      <button class="add-btn" type="button">+</button>
    </section>

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="cigars">Cigars</button>
      <button class="tab-btn" data-tab="brands">Brands</button>
      <button class="tab-btn" data-tab="shops">Shops</button>
    </nav>

    <section class="fav-grid" id="favGrid"></section>

  </main>

  <script src="./favorites.js"></script>
</body>
</html>
