<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Favorites</title>
  <link rel="stylesheet" href="./favorites.css" />
</head>

<body class="favorites-page">
  <main class="fav-shell">

    <header class="fav-topbar">
      <a class="back-btn" href="/profile/">‹</a>

      <button class="theme-toggle" id="themeToggle" type="button">
        <img id="themeIcon" class="theme-icon" src="/img/icons/moon.svg" alt="" />
      </button>
    </header>

    <section class="fav-hero">
      <h1>Favorites</h1>
      <button class="add-btn" type="button">+</button>
    </section>

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="cigars" type="button">Cigars</button>
      <button class="tab-btn" data-tab="brands" type="button">Brands</button>
      <button class="tab-btn" data-tab="shops" type="button">Shops</button>
    </nav>

    <section class="fav-list" id="favGrid"></section>

  </main>

  <script src="./favorites.js"></script>
</body>
</html>
