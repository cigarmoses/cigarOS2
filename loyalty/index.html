<!doctype html>
<html lang="en" data-theme="light">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no,email=no,address=no"/>

<title>Loyalty • CigarOS</title>

<link rel="stylesheet" href="/css/type.css"/>

<style>

/* ===== BASE ===== */

body{
  margin:0;
  font-family:var(--font-text);
  background:var(--bg);
  color:var(--text);
  transition:background .25s ease,color .25s ease;
}

/* LIGHT */
:root{
  --bg:#f2f3f7;
  --text:#0a0a0a;
}

/* DARK */
html[data-theme="dark"]{
  --bg:#0b1323;
  --text:#ffffff;
}

/* ===== TOP BAR ===== */

.loyalty-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 18px;
}

.loyalty-title{
  font-size:28px;
  font-weight:800;
  letter-spacing:-.02em;
}

/* ===== PREMIUM TOGGLE ===== */

.theme-toggle.premium-toggle{
  position:relative;
  width:64px;
  height:34px;
  border:0;
  border-radius:999px;
  background:transparent;
  cursor:pointer;
  overflow:hidden;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 4px 14px rgba(0,0,0,.16);
}

.premium-toggle-track{
  position:absolute;
  inset:0;
  border-radius:999px;
  overflow:hidden;
}

/* SKY */
.premium-sky{
  position:absolute;
  inset:0;
  transition:.3s ease;
}

.premium-sky-day{
  background:linear-gradient(180deg,#72d4ff,#4bb8ff);
}

.premium-sky-night{
  background:linear-gradient(90deg,#7b2ee6,#1a1d4d);
  opacity:0;
}

html[data-theme="dark"] .premium-sky-day{
  opacity:0;
}

html[data-theme="dark"] .premium-sky-night{
  opacity:1;
}

/* CLOUDS */
.cloud{
  position:absolute;
  background:#fff;
  border-radius:999px;
}

.cloud-1{width:16px;height:5px;left:14px;top:10px;}
.cloud-2{width:18px;height:6px;left:28px;top:20px;}

/* STARS */
.star{
  position:absolute;
  width:3px;height:3px;
  background:#fff;
  border-radius:50%;
  animation:twinkle 3s infinite;
}

.star-1{top:8px;left:40px;}
.star-2{top:18px;left:50px;}

@keyframes twinkle{
  0%,100%{opacity:.4}
  50%{opacity:1}
}

/* KNOB */
.premium-toggle-knob{
  position:absolute;
  top:3px;
  left:3px;
  width:28px;
  height:28px;
  border-radius:999px;
  background:#fff;
  display:grid;
  place-items:center;
  transition:.3s cubic-bezier(.22,.8,.25,1);
}

html[data-theme="dark"] .premium-toggle-knob{
  transform:translateX(30px);
}

/* ICONS */
.theme-icon{
  width:16px;
  height:16px;
  position:absolute;
}

.theme-icon-moon{display:none;}

html[data-theme="dark"] .theme-icon-sun{display:none;}
html[data-theme="dark"] .theme-icon-moon{display:block;}

</style>

</head>

<body>

<header class="loyalty-top">

<h1 class="loyalty-title">Loyalty</h1>

<button class="theme-toggle premium-toggle" id="themeToggle">

  <span class="premium-toggle-track">

    <span class="premium-sky premium-sky-day">
      <span class="cloud cloud-1"></span>
      <span class="cloud cloud-2"></span>
    </span>

    <span class="premium-sky premium-sky-night">
      <span class="star star-1"></span>
      <span class="star star-2"></span>
    </span>

  </span>

  <span class="premium-toggle-knob">
    <img src="/uxui/lightmode/newsun.svg" class="theme-icon theme-icon-sun"/>
    <img src="/uxui/darkmode/newmoon.svg" class="theme-icon theme-icon-moon"/>
  </span>

</button>

</header>

<script>

/* ===== THEME SYSTEM ===== */

const THEME_KEY = "cigaros_theme";

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_KEY, theme);
}

function getTheme(){
  return localStorage.getItem(THEME_KEY) || "light";
}

applyTheme(getTheme());

document.getElementById("themeToggle").addEventListener("click", () => {
  applyTheme(getTheme() === "dark" ? "light" : "dark");
});

</script>

</body>
</html>
