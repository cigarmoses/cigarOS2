<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loyalty • CigarOS 2</title>
  <style>
    :root {
      --bg: #edf3f9;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #6e7b8f;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    .page {
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Search Box */
    .search-box {
      background: var(--surface);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px rgba(15,26,44,.08);
    }
    .search-box input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      font-size: .85rem;
    }

    /* Segment Controls */
    .segmented {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .seg-btn {
      background: var(--surface);
      border-radius: 12px;
      padding: 8px 18px;
      border: 1px solid transparent;
      font-size: .8rem;
      cursor: pointer;
    }
    .seg-btn.active {
      background: #d7ecff;
      border-color: #b6d7ff;
      color: #003c73;
    }

    /* List Rows */
    .list-wrap {
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(15,26,44,.06);
    }

    .list-header, .row {
      display: grid;
      grid-template-columns: 0.4fr 1fr 0.4fr 0.7fr;
      padding: 12px 14px;
      font-size: .75rem;
      align-items: center;
    }
    .list-header {
      font-weight: 600;
      background: #f3f7fb;
    }

    .row {
      border-bottom: 1px solid rgba(0,0,0,.04);
      cursor: pointer;
    }
    .row:last-child { border-bottom: 0; }

    .locker-badge {
      width: 36px;
      height: 28px;
      border-radius: 10px;
      background: #cfe9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .7rem;
    }
    .regular-bg { background: #fff; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 16px;
      z-index: 999;
    }

    .modal {
      background: #fff;
      border-radius: 28px;
      width: min(92vw, 480px);
      box-shadow: 0 20px 40px rgba(15,26,44,.2);
      padding: 20px 20px 30px;
    }

    .close-x {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #f1f4f7;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      font-size: 22px;
      cursor: pointer;
    }

    .contact-card {
      background: #fff;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(15,26,44,.08);
      margin-bottom: 18px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: #e7eaef;
      background-size: cover;
    }

    .contact-lines {
      display: flex;
      flex-direction: column;
      font-size: .85rem;
    }

    .contact-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 2px;
    }
    .contact-nick {
      color: var(--muted);
      margin-bottom: 8px;
      font-size: .8rem;
    }

    /* HISTORY */
    .history-card {
      background: #fff;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(15,26,44,.08);
    }
    .history-head {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* PROFILE */
    .profile-card {
      background: #fff;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(15,26,44,.08);
    }
    .profile-head {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .profile-grid {
      display: flex;
      gap: 28px;
      font-size: .85rem;
      margin-bottom: 16px;
    }

    .section-label {
      font-size: .82rem;
      font-weight: 600;
      margin: 10px 0 6px;
    }

    .h-scroll {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding-bottom: 6px;
    }

    .brand-pill img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f3f4f5;
      padding: 6px;
    }

    .cigar-card {
      background: #f8f9fb;
      padding: 12px 14px;
      border-radius: 12px;
      min-width: 150px;
    }
    .cigar-name { font-weight: 600; margin-bottom: 4px; }
    .cigar-sub { font-size: .75rem; color: var(--muted); }

  </style>
</head>
<body>
  <div class="page">

    <!-- Search -->
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search" oninput="filterRows()">
    </div>

    <!-- Segments -->
    <div class="segmented">
      <button class="seg-btn lockers active" onclick="switchMode('lockers')">Lockers</button>
      <button class="seg-btn regulars" onclick="switchMode('regulars')">Regulars</button>
    </div>

    <!-- List -->
    <div class="list-wrap" id="listWrap">
      <div class="list-header">
        <div></div>
        <div>Name</div>
        <div>Pts</div>
        <div>Last Visit</div>
      </div>
    </div>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">

      <div class="close-x" onclick="closeModal()">&times;</div>

      <!-- Contact -->
      <div class="contact-card">
        <div class="avatar" id="pAvatar"></div>

        <div class="contact-lines">
          <div class="contact-name" id="pName">Robert Jones</div>
          <div class="contact-nick" id="pNickname">Uncle Bob</div>
          <div id="pContactLine1">—</div>
          <div id="pContactLine2">—</div>
        </div>
      </div>

      <!-- History -->
      <div class="history-card">
        <div class="history-head">
          <div>History</div>
          <div id="pPoints">0 points</div>
        </div>
        <div style="text-align:right; font-size:.8rem; color:#006ded; cursor:pointer;">
          VIEW ALL
        </div>
      </div>

      <!-- Profile -->
      <div class="profile-card">
        <div class="profile-head">
          <div>Profile</div>
          <div style="font-size:.85rem; color:#006ded;">EDIT</div>
        </div>

        <div class="profile-grid">
          <div>Ring: <span id="pRing">—</span></div>
          <div>Vitola: <span id="pVitola">—</span></div>
        </div>

        <div class="section-label">Favorite Brands</div>
        <div class="h-scroll" id="favBrandsRow"></div>

        <div class="section-label">Favorite Cigars</div>
        <div class="h-scroll" id="favCigarsRow"></div>

        <div class="section-label">Wishlist</div>
        <div class="h-scroll" id="wishlistRow"></div>
      </div>

    </div>
  </div>

  <script src="/loyalty/loyalty.js"></script>
</body>
</html>
