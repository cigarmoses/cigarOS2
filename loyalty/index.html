<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Loyalty • CigarOS2</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg:#eff2f7;
      --ink:#101828;
      --muted:rgba(16,24,40,.58);
      --muted-2:rgba(16,24,40,.42);

      --surface:rgba(255,255,255,.92);
      --surface-2:rgba(255,255,255,.96);
      --surface-border:rgba(15,23,40,.08);
      --surface-shadow:0 12px 30px rgba(15,26,44,.08);

      --seg-bg:#e8ebf1;
      --seg-border:rgba(15,23,40,.10);

      --ios-blue:#007aff;
      --ios-green:#34c759;

      --tint-locker:#e5f0ff;
      --tint-regular:#fff3e6;
      --hairline:rgba(60,60,67,.18);
    }

    html[data-theme="dark"]{
      --bg:
        radial-gradient(1200px 540px at 50% -8%, rgba(63,108,194,.22) 0%, rgba(20,44,92,.16) 28%, rgba(4,13,34,0) 58%),
        linear-gradient(180deg, #0f2856 0%, #07142f 48%, #041027 100%);

      --ink:#ffffff;
      --muted:rgba(255,255,255,.64);
      --muted-2:rgba(255,255,255,.42);

      --surface:rgba(13,21,39,.58);
      --surface-2:rgba(255,255,255,.08);
      --surface-border:rgba(255,255,255,.12);
      --surface-shadow:0 12px 34px rgba(0,0,0,.26);

      --seg-bg:rgba(255,255,255,.08);
      --seg-border:rgba(255,255,255,.12);

      --tint-locker:rgba(66,120,196,.18);
      --tint-regular:rgba(255,168,84,.14);
      --hairline:rgba(255,255,255,.10);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100dvh;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:60;
      width:min(430px, calc(100% - 28px));
      margin:0 auto;
      padding-top:calc(10px + var(--safe-top));
      padding-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:transparent;
    }

    .tb-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      border:1px solid var(--surface-border);
      background:var(--surface-2);
      box-shadow:var(--surface-shadow);
      display:grid;
      place-items:center;
      padding:0;
      cursor:pointer;
      color:var(--ink);
      -webkit-tap-highlight-color:transparent;
      appearance:none;
    }

    .tb-btn svg{
      width:20px;
      height:20px;
      display:block;
    }

    /* ===== PREMIUM TOGGLE ===== */

    .theme-toggle.premium-toggle{
      position:relative;
      width:64px;
      height:34px;
      border:0;
      padding:0;
      border-radius:999px;
      background:transparent;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      overflow:hidden;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 4px 14px rgba(0,0,0,.16);
      flex:0 0 auto;
    }

    .premium-toggle-track{
      position:absolute;
      inset:0;
      border-radius:999px;
      overflow:hidden;
    }

    .premium-sky{
      position:absolute;
      inset:0;
      transition:opacity .28s ease, transform .32s ease;
    }

    .premium-sky-day{
      background:linear-gradient(180deg, #72d4ff 0%, #4bb8ff 100%);
      opacity:1;
      transform:scale(1);
    }

    .premium-sky-night{
      background:linear-gradient(90deg, #7b2ee6 0%, #1a1d4d 100%);
      opacity:0;
      transform:scale(1.06);
    }

    html[data-theme="dark"] .premium-sky-day{
      opacity:0;
      transform:scale(1.06);
    }

    html[data-theme="dark"] .premium-sky-night{
      opacity:1;
      transform:scale(1);
    }

    .cloud{
      position:absolute;
      background:rgba(255,255,255,.96);
      border-radius:999px;
      filter:drop-shadow(0 1px 2px rgba(255,255,255,.15));
    }

    .cloud::before,
    .cloud::after{
      content:"";
      position:absolute;
      background:inherit;
      border-radius:999px;
    }

    .cloud-1{
      width:16px;
      height:5px;
      left:13px;
      top:10px;
    }

    .cloud-1::before{
      width:6px;
      height:6px;
      left:2px;
      top:-3px;
    }

    .cloud-1::after{
      width:7px;
      height:7px;
      left:7px;
      top:-4px;
    }

    .cloud-2{
      width:20px;
      height:6px;
      left:26px;
      top:21px;
    }

    .cloud-2::before{
      width:8px;
      height:8px;
      left:3px;
      top:-4px;
    }

    .cloud-2::after{
      width:10px;
      height:10px;
      left:9px;
      top:-5px;
    }

    .cloud-3{
      width:10px;
      height:4px;
      left:34px;
      top:8px;
      opacity:.9;
    }

    .cloud-3::before{
      width:5px;
      height:5px;
      left:1px;
      top:-2px;
    }

    .cloud-3::after{
      width:5px;
      height:5px;
      left:4px;
      top:-2px;
    }

    .star{
      position:absolute;
      width:3px;
      height:3px;
      border-radius:50%;
      background:rgba(255,255,255,.95);
      box-shadow:0 0 4px rgba(255,255,255,.6);
      animation:premiumTwinkle 2.8s ease-in-out infinite;
    }

    .star-1{ top:8px; left:38px; animation-delay:0s; }
    .star-2{ top:12px; left:49px; width:2px; height:2px; animation-delay:.4s; }
    .star-3{ top:18px; left:42px; animation-delay:.8s; }
    .star-4{ top:22px; left:52px; width:2px; height:2px; animation-delay:1.2s; }
    .star-5{ top:15px; left:31px; width:2px; height:2px; animation-delay:1.6s; }
    .star-6{ top:26px; left:26px; width:2px; height:2px; animation-delay:2s; }

    @keyframes premiumTwinkle{
      0%, 100%{ opacity:.45; transform:scale(.85); }
      50%{ opacity:1; transform:scale(1.15); }
    }

    .premium-toggle-knob{
      position:absolute;
      top:3px;
      left:3px;
      width:28px;
      height:28px;
      border-radius:999px;
      background:#fff;
      box-shadow:
        0 3px 8px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.7);
      transition:transform .3s cubic-bezier(.22,.8,.25,1), background-color .22s ease;
      display:grid;
      place-items:center;
      z-index:2;
    }

    html[data-theme="dark"] .premium-toggle-knob{
      transform:translateX(30px);
    }

    .theme-icon{
      position:absolute;
      width:16px;
      height:16px;
      object-fit:contain;
      pointer-events:none;
      transition:opacity .2s ease, transform .24s ease;
    }

    .theme-icon-moon{ display:none; }

    html[data-theme="dark"] .theme-icon-sun{
      display:none;
    }

    html[data-theme="dark"] .theme-icon-moon{
      display:block;
    }

    .theme-toggle.premium-toggle:active .premium-toggle-knob{
      transform:scale(.96);
    }

    html[data-theme="dark"] .theme-toggle.premium-toggle:active .premium-toggle-knob{
      transform:translateX(30px) scale(.96);
    }

    .wrap{
      max-width:520px;
      margin:0 auto;
      padding:6px 12px calc(28px + var(--safe-bottom));
      position:relative;
    }

    h1.page-title{
      font-family:var(--font-display), -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size:56px;
      font-weight:800;
      line-height:.92;
      letter-spacing:-.04em;
      margin:6px 0 14px;
      color:var(--ink);
    }

    .controls-row{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto auto;
      gap:10px;
      align-items:center;
      margin-bottom:12px;
    }

    .mode-toggle{
      display:inline-flex;
      width:100%;
      padding:2px;
      border-radius:999px;
      background:var(--seg-bg);
      border:1px solid var(--seg-border);
      min-width:0;
    }

    .mode-btn{
      border:none;
      background:transparent;
      padding:10px 14px;
      font-size:15px;
      border-radius:999px;
      cursor:pointer;
      color:var(--muted);
      font-weight:600;
      min-width:0;
      flex:1 1 0;
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      letter-spacing:-0.02em;
    }

    .mode-btn.active{
      background:#ffffff;
      color:#111;
      box-shadow:0 1px 1px rgba(0,0,0,.12);
      font-weight:700;
    }

    html[data-theme="dark"] .mode-btn.active{
      background:rgba(255,255,255,.14);
      color:#fff;
      box-shadow:none;
    }

    .filters-btn{
      height:42px;
      border:1px solid var(--surface-border);
      background:var(--surface);
      color:var(--ink);
      border-radius:999px;
      padding:0 14px;
      font-size:15px;
      font-weight:600;
      line-height:1;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:var(--surface-shadow);
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      letter-spacing:-0.02em;
    }

    .filters-btn .dot{
      width:7px;
      height:7px;
      border-radius:999px;
      background:rgba(0,0,0,.25);
      display:none;
    }

    .filters-btn.active .dot{
      display:block;
      background:var(--ios-blue);
    }

    .add-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      border:1px solid var(--surface-border);
      background:var(--surface);
      color:var(--ios-green);
      font-size:32px;
      line-height:1;
      padding:0;
      cursor:pointer;
      display:none;
      align-items:center;
      justify-content:center;
      box-shadow:var(--surface-shadow);
      -webkit-tap-highlight-color:transparent;
    }

    .add-btn span{
      display:block;
      transform:translateY(-1px);
      font-weight:700;
    }

    .search-wrap{
      margin-top:0;
    }

    .search-input{
      width:100%;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid var(--surface-border);
      font-size:17px;
      outline:none;
      background:var(--surface);
      color:var(--ink);
      box-shadow:var(--surface-shadow);
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .search-input::placeholder{
      color:var(--muted);
    }

    .summary{
      margin-top:8px;
      font-size:15px;
      color:var(--muted);
      padding-left:4px;
      user-select:none;
      font-weight:600;
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      letter-spacing:-0.02em;
    }

    .chips{
      margin-top:10px;
      display:none;
      flex-wrap:wrap;
      gap:8px;
      padding-left:2px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--surface-border);
      background:var(--surface);
      font-size:13px;
      font-weight:700;
      color:var(--ink);
      line-height:1;
      box-shadow:var(--surface-shadow);
    }

    .chip button{
      border:none;
      background:transparent;
      padding:0;
      cursor:pointer;
      font-weight:900;
      color:var(--muted);
      font-size:14px;
      line-height:1;
    }

    .list{
      margin-top:10px;
      background:var(--surface);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--surface-shadow);
      border:1px solid var(--surface-border);
      position:relative;
      backdrop-filter:blur(16px) saturate(1.04);
      -webkit-backdrop-filter:blur(16px) saturate(1.04);
    }

    .row{
      min-height:50px;
      padding:13px 14px;
      padding-right:24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--hairline);
      cursor:pointer;
      background:transparent;
      position:relative;
    }

    .row:last-child{
      border-bottom:none;
    }

    .row.locker{ background:var(--tint-locker); }
    .row.regular{ background:var(--tint-regular); }

    .row-left{
      min-width:0;
      display:flex;
      flex-direction:column;
    }

    .row-name{
      font-family:var(--font-text), -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size:17px;
      line-height:1.2;
      letter-spacing:-0.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding-right:86px;
      color:var(--ink);
    }

    .name-last{ font-weight:800; }
    .name-first{ font-weight:500; }

    .locker-num{
      font-weight:500;
      font-variant-numeric:tabular-nums;
      display:inline-block;
      min-width:22px;
      margin-right:12px;
      color:var(--ink);
    }

    .row-right{
      position:absolute;
      right:28px;
      top:50%;
      transform:translateY(-50%);
      display:inline-flex;
      align-items:center;
      gap:8px;
      pointer-events:none;
    }

    .loy-ico{
      width:18px;
      height:18px;
      display:block;
      object-fit:contain;
      flex:0 0 auto;
    }

    .empty-state{
      padding:16px;
      text-align:center;
      font-size:14px;
      color:var(--muted);
    }

    footer{
      margin-top:16px;
      font-size:11px;
      text-align:center;
      color:var(--muted);
    }

    .az-index{
      position:fixed;
      right:6px;
      top:170px;
      bottom:80px;
      width:16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
      z-index:50;
    }

    .az-letter{
      font-size:11px;
      line-height:11px;
      color:rgba(60,60,67,.55);
      font-weight:600;
      width:16px;
      text-align:center;
      padding:1px 0;
      border-radius:6px;
    }

    .az-letter.active{
      color:var(--ios-blue);
      background:rgba(0,122,255,.12);
    }

    dialog#addCustomerDialog{
      border:none;
      border-radius:18px;
      padding:0;
      width:92vw;
      max-width:520px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      overflow:hidden;
      background:#fff;
    }

    .dlg-wrap{
      padding:14px 14px 12px;
      background:#fff;
      font-family:var(--font-text);
    }

    .dlg-title{
      font-family:var(--font-display);
      font-weight:800;
      font-size:20px;
      line-height:1.2;
    }

    .dlg-sub{
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    .dlg-form{
      margin-top:12px;
      display:grid;
      gap:10px;
    }

    .dlg-input{
      width:100%;
      border:1px solid rgba(0,0,0,.12);
      border-radius:12px;
      padding:10px 12px;
      font-size:15px;
      outline:none;
    }

    .dlg-actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
      padding-top:12px;
      border-top:1px solid rgba(0,0,0,.08);
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:10px 14px;
      font-weight:600;
      cursor:pointer;
      font-size:15px;
    }

    .btn-cancel{ background:rgba(0,0,0,.06); color:#111; }
    .btn-save{ background:var(--ios-green); color:#fff; }

    dialog#profileDialog{
      border:none;
      padding:0;
      width:92vw;
      max-width:560px;
      border-radius:18px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 24px 70px rgba(0,0,0,.28);
    }

    dialog#profileDialog::backdrop{
      background:rgba(0,0,0,.25);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
    }

    .p-wrap{
      padding:16px 16px 10px;
      background:#fff;
      font-family:var(--font-text);
    }

    .p-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .p-name{
      font-family:var(--font-display);
      font-weight:900;
      font-size:54px;
      line-height:.92;
      letter-spacing:-0.8px;
      margin:0;
    }

    .p-name .pn-first,
    .p-name .pn-last{
      display:block;
    }

    .p-sub{
      margin-top:6px;
      font-size:22px;
      line-height:1.1;
      color:rgba(17,17,17,.62);
      font-weight:700;
    }

    .p-aka{
      display:block;
      margin-top:2px;
      font-size:20px;
      color:rgba(17,17,17,.55);
      font-weight:700;
    }

    .p-pill{
      flex:0 0 auto;
      margin-top:6px;
      background:var(--ios-green);
      color:#fff;
      font-weight:800;
      font-size:18px;
      line-height:1;
      padding:8px 14px;
      border-radius:8px;
      min-width:58px;
      text-align:center;
      font-variant-numeric:tabular-nums;
    }

    .p-details{
      margin-top:18px;
      color:rgba(17,17,17,.55);
      font-size:18px;
      line-height:1.25;
      white-space:pre-line;
    }

    .p-divider{
      margin-top:14px;
      height:1px;
      background:rgba(0,0,0,.10);
    }

    .p-actions{
      padding:10px 16px 14px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .p-close{
      border:none;
      background:transparent;
      color:#ff3b30;
      font-size:22px;
      font-weight:900;
      cursor:pointer;
      padding:8px 8px;
      border-radius:10px;
    }

    .tony-fab{
      position:fixed;
      left:16px;
      bottom:16px;
      width:46px;
      height:46px;
      border-radius:999px;
      background:transparent;
      border:none;
      padding:0;
      z-index:40;
    }

    .tony-fab img{
      width:100%;
      height:100%;
      display:block;
      border-radius:inherit;
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.25);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
      display:none;
      z-index:200;
    }

    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:#fff;
      border-radius:18px 18px 0 0;
      box-shadow:0 -20px 60px rgba(0,0,0,.25);
      transform:translateY(110%);
      transition:transform .22s ease;
      z-index:201;
      max-height:82vh;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .sheet.open{ transform:translateY(0); }
    .sheet-backdrop.open{ display:block; }

    .sheet-grab{
      height:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }

    .sheet-grab:before{
      content:"";
      width:42px;
      height:5px;
      border-radius:999px;
      background:rgba(0,0,0,.18);
    }

    .sheet-head{
      padding:10px 14px 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid rgba(0,0,0,.08);
    }

    .sheet-title{
      font-family:var(--font-display);
      font-weight:900;
      font-size:20px;
      letter-spacing:-0.2px;
    }

    .sheet-actions{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .sheet-btn{
      border:none;
      background:transparent;
      color:var(--ios-blue);
      font-weight:800;
      font-size:14px;
      padding:8px 8px;
      cursor:pointer;
    }

    .sheet-btn.reset{
      color:rgba(0,0,0,.45);
      font-weight:800;
    }

    .sheet-body{
      padding:12px 14px 14px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      flex:1;
    }

    .sheet-section{ margin-top:12px; }
    .sheet-section:first-child{ margin-top:0; }

    .sheet-label{
      font-size:12px;
      font-weight:800;
      color:rgba(0,0,0,.55);
      text-transform:uppercase;
      letter-spacing:.08em;
      padding:0 2px 8px;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .pill-toggle{
      border:1px solid rgba(0,0,0,.14);
      background:#fff;
      border-radius:999px;
      padding:10px 12px;
      font-size:16px;
      font-family:var(--font-display);
      font-weight:400;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
      line-height:1;
      color:var(--ios-blue);
    }

    .pill-toggle.on{
      border-color:rgba(0,122,255,.35);
      background:rgba(0,122,255,.08);
      color:var(--ios-blue);
    }

    .pill-toggle .mini{
      width:8px;
      height:8px;
      border-radius:999px;
      background:rgba(0,0,0,.22);
      flex:0 0 auto;
    }

    .pill-toggle.on .mini{
      background:var(--ios-blue);
    }

    .role-ico{
      width:22px;
      height:22px;
      display:block;
      object-fit:contain;
      flex:0 0 auto;
    }

    .sheet-search{
      width:100%;
      border:none;
      outline:none;
      background:#f2f2f7;
      border-radius:12px;
      padding:10px 12px;
      font-size:15px;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .brand-list{
      margin-top:10px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 0 0 1px rgba(0,0,0,.06);
      overflow:hidden;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border-bottom:1px solid rgba(0,0,0,.08);
      cursor:pointer;
    }

    .brand-row:last-child{ border-bottom:none; }

    .brand-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .brand-ico{
      width:28px;
      height:28px;
      display:block;
      object-fit:contain;
      flex:0 0 auto;
      border:none !important;
      outline:none !important;
      box-shadow:none !important;
      background:transparent !important;
      border-radius:0 !important;
    }

    .brand-name{
      font-family:var(--font-display);
      font-size:18px;
      font-weight:400;
      color:#111;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-check{
      width:22px;
      height:22px;
      border-radius:6px;
      box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      background:#fff;
    }

    .brand-row.on .brand-check{
      box-shadow:inset 0 0 0 2px rgba(0,122,255,.45);
      background:rgba(0,122,255,.10);
    }

    .brand-check svg{
      width:14px;
      height:14px;
      display:none;
    }

    .brand-row.on .brand-check svg{
      display:block;
    }

    .sheet-foot{
      padding:12px 14px 14px;
      border-top:1px solid rgba(0,0,0,.08);
      background:#fff;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
    }

    .apply-btn{
      border:none;
      background:var(--ios-blue);
      color:#fff;
      font-weight:900;
      font-size:15px;
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
      min-width:110px;
      box-shadow:0 6px 20px rgba(0,122,255,.25);
    }

    @media (max-width:440px){
      .controls-row{
        grid-template-columns:minmax(0, 1fr) auto auto;
      }

      .mode-btn{
        min-width:0;
        padding-left:12px;
        padding-right:12px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="tb-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <button class="theme-toggle premium-toggle" id="themeToggle" aria-label="Toggle theme" aria-pressed="false">
      <span class="premium-toggle-track" aria-hidden="true">
        <span class="premium-sky premium-sky-day">
          <span class="cloud cloud-1"></span>
          <span class="cloud cloud-2"></span>
          <span class="cloud cloud-3"></span>
        </span>

        <span class="premium-sky premium-sky-night">
          <span class="star star-1"></span>
          <span class="star star-2"></span>
          <span class="star star-3"></span>
          <span class="star star-4"></span>
          <span class="star star-5"></span>
          <span class="star star-6"></span>
        </span>
      </span>

      <span class="premium-toggle-knob" aria-hidden="true">
        <img
          class="theme-icon theme-icon-sun"
          src="/uxui/lightmode/newsun.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="theme-icon theme-icon-moon"
          src="/uxui/darkmode/newmoon.svg"
          alt=""
          aria-hidden="true"
        />
      </span>
    </button>
  </header>

  <div class="wrap">
    <h1 class="page-title">Loyalty</h1>

    <div class="controls-row">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="all">All</button>
        <button class="mode-btn" data-mode="regular">Regulars</button>
        <button class="mode-btn" data-mode="lockers">Lockers</button>
      </div>

      <button id="filtersBtn" class="filters-btn" type="button" aria-label="Filters">
        <span class="dot" aria-hidden="true"></span>
        Filters
      </button>

      <button id="addCustomerBtn" class="add-btn" type="button" aria-label="Add customer">
        <span>+</span>
      </button>
    </div>

    <div class="search-wrap">
      <input id="search" class="search-input" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <div id="summary" class="summary"></div>
    <div id="chips" class="chips" aria-label="Applied filters"></div>
    <div id="list" class="list"></div>

    <footer>CigarOS2 • Loyalty</footer>
  </div>

  <div id="azIndex" class="az-index" aria-hidden="true"></div>

  <dialog id="addCustomerDialog">
    <div class="dlg-wrap">
      <div class="dlg-title">Add Customer</div>
      <div class="dlg-sub">First, last, cell, email (for now)</div>

      <div class="dlg-form">
        <input id="acFirst" class="dlg-input" placeholder="First name" autocomplete="off" />
        <input id="acLast" class="dlg-input" placeholder="Last name" autocomplete="off" />
        <input id="acPhone" class="dlg-input" placeholder="Cell" inputmode="tel" autocomplete="off" />
        <input id="acEmail" class="dlg-input" placeholder="Email" inputmode="email" autocomplete="off" />
      </div>

      <div class="dlg-actions">
        <button id="acCancel" class="btn btn-cancel" type="button">Cancel</button>
        <button id="acSave" class="btn btn-save" type="button">Save</button>
      </div>
    </div>
  </dialog>

  <dialog id="profileDialog">
    <div class="p-wrap">
      <div class="p-top">
        <div>
          <div id="pName" class="p-name">
            <span class="pn-first"></span>
            <span class="pn-last"></span>
          </div>

          <div id="pAka" class="p-aka" style="display:none;"></div>
          <div id="pTier" class="p-sub"></div>
        </div>

        <div id="pPointsPill" class="p-pill">0</div>
      </div>

      <div id="pDetails" class="p-details">—</div>
      <div class="p-divider"></div>
    </div>

    <div class="p-actions">
      <button id="pCloseX" class="p-close" type="button" aria-label="Close">X</button>
    </div>
  </dialog>

  <div id="filterBackdrop" class="sheet-backdrop" aria-hidden="true"></div>

  <section id="filterSheet" class="sheet" role="dialog" aria-modal="true" aria-label="Loyalty Filters">
    <div class="sheet-grab" aria-hidden="true"></div>

    <div class="sheet-head">
      <div class="sheet-title">Filters</div>
      <div class="sheet-actions">
        <button id="filtersReset" class="sheet-btn reset" type="button">Reset</button>
        <button id="filtersClose" class="sheet-btn" type="button">Done</button>
      </div>
    </div>

    <div class="sheet-body">
      <div class="sheet-section">
        <div class="sheet-label">Roles</div>
        <div class="pill-row">
          <button class="pill-toggle" type="button" data-role="Military">
            <span class="mini"></span>
            <img class="role-ico" src="/img/icons/loyalty/military.svg" alt="" aria-hidden="true">
            Military
          </button>

          <button class="pill-toggle" type="button" data-role="Police">
            <span class="mini"></span>
            <img class="role-ico" src="/img/icons/loyalty/police.svg" alt="" aria-hidden="true">
            Police
          </button>

          <button class="pill-toggle" type="button" data-role="Firefighter">
            <span class="mini"></span>
            <img class="role-ico" src="/img/icons/loyalty/firefighter.svg" alt="" aria-hidden="true">
            Firefighter
          </button>

          <button class="pill-toggle" type="button" data-role="Paramedic">
            <span class="mini"></span>
            <img class="role-ico" src="/img/icons/loyalty/paramedic.svg" alt="" aria-hidden="true">
            Paramedic
          </button>
        </div>
      </div>

      <div class="sheet-section">
        <div class="sheet-label">Fav Brands</div>
        <input id="brandSearch" class="sheet-search" type="search" placeholder="Search brands" autocomplete="off" />
        <div id="brandList" class="brand-list"></div>
      </div>
    </div>

    <div class="sheet-foot">
      <button id="filtersApply" class="apply-btn" type="button">Apply</button>
    </div>
  </section>

  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script src="/loyalty/loyalty.js" defer></script>

  <script>
    (() => {
      "use strict";

      const root = document.documentElement;
      const toggle = document.getElementById("themeToggle");
      const backBtn = document.getElementById("backBtn");

      function getSavedTheme() {
        return localStorage.getItem("theme") || root.getAttribute("data-theme") || "light";
      }

      function applyTheme(theme) {
        const next = theme === "dark" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        toggle?.setAttribute("aria-pressed", String(next === "dark"));
      }

      applyTheme(getSavedTheme());

      toggle?.addEventListener("click", () => {
        applyTheme(getSavedTheme() === "dark" ? "light" : "dark");
      });

      backBtn?.addEventListener("click", () => {
        if (history.length > 1) history.back();
        else window.location.href = "/";
      });
    })();

    document.addEventListener("error", (e) => {
      const el = e.target;
      if (el && el.tagName === "IMG" && (el.classList.contains("brand-ico") || el.classList.contains("role-ico"))) {
        el.style.display = "none";
      }
    }, true);
  </script>
</body>
</html>
