<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loyalty • CigarOS2</title>

  <style>
    :root {
      --bg: #f2f2f7;        /* iOS background */
      --surface: #ffffff;   /* white cards / list */
      --ink: #111111;
      --muted: #8e8e93;
      --seg-bg: #e4e4ea;
      --seg-border: #c7c7cc;
      --blue-pill: #0a84ff1a;
      --peach-pill: #ff9f0a1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 12px 24px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .back-link {
      font-size: 15px;
      color: var(--blue);
      text-decoration: none;
      padding: 4px 0;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin: 4px 0 0;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Mode toggle – iOS segmented control style */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      border-radius: 999px;
      background: var(--seg-bg);
      border: 1px solid var(--seg-border);
      margin-top: 12px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 5px 16px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
      min-width: 96px;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 1px rgba(0,0,0,0.12);
    }

    /* Search bar */
    .search-wrap {
      margin-top: 12px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12);
    }

    .search-input:focus {
      box-shadow: 0 0 0 1px #0a84ff;
    }

    /* Summary */
    .summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      padding-left: 4px;
    }

    /* List container */
    .list {
      margin-top: 10px;
      background: var(--surface);
      border-radius: 14px;
      padding: 4px 16px 6px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }

    .row {
      padding: 8px 0;
      margin: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      border-bottom: 0.5px solid #d1d1d6;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row.locker,
    .row.regular {
      /* same layout; no background gradients like Contacts */
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .name {
      font-weight: 600;
      font-size: 16px;
    }

    .nickname {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .points-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f2f2f7;
      color: var(--muted);
      white-space: nowrap;
    }

    .row.locker .points-pill {
      background: var(--blue-pill);
    }

    .row.regular .points-pill {
      background: var(--peach-pill);
    }

    .meta-line {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .meta-pill {
      padding: 1px 6px;
      border-radius: 999px;
      background: #f2f2f7;
    }

    .contact-line {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .empty-state {
      padding: 16px 0;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 16px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="javascript:history.back()" class="back-link">← Back</a>
      <div></div>
    </div>

    <h1>Loyalty</h1>
    <div class="subtitle">Lockers, regulars & rewards contacts</div>

    <div class="mode-toggle" aria-label="Contact type toggle">
      <button class="mode-btn active" data-mode="lockers">Lockers</button>
      <button class="mode-btn" data-mode="regular">Regulars</button>
    </div>

    <div class="search-wrap">
      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="Search"
        autocomplete="off"
      />
    </div>

    <div id="summary" class="summary"></div>

    <div id="list" class="list"></div>

    <footer>
      CigarOS2 • Loyalty
    </footer>
  </div>

  <script src="/loyalty/loyalty.js" defer></script>
</body>
</html>
