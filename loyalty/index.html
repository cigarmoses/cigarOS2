<!doctype html>
<html lang="en" data-theme="light">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no,email=no,address=no"/>

<title>Loyalty • CigarOS</title>

<link rel="stylesheet" href="/css/type.css"/>

<style>

/* ===== BASE ===== */

:root{
  --bg:#eff2f7;
  --ink:#101828;
}

html[data-theme="dark"]{
  --bg:#0b1323;
  --ink:#ffffff;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-text);
}

/* ===== TOPBAR ===== */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
}

/* ===== TOGGLE (SVG VERSION) ===== */

.theme-toggle{
  position:relative;
  width:46px;
  height:22px;
  border:0;
  background:transparent;
  cursor:pointer;
}

.theme-toggle-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.theme-toggle-img-dark{
  display:none;
}

html[data-theme="dark"] .theme-toggle-img-light{
  display:none;
}

html[data-theme="dark"] .theme-toggle-img-dark{
  display:block;
}

/* ===== PAGE ===== */

.wrap{
  padding:18px;
}

.page-title{
  font-size:48px;
  font-weight:800;
  margin:0 0 20px;
}

</style>

</head>

<body>

<header class="topbar">

<h1 class="page-title">Loyalty</h1>

<button class="theme-toggle" id="themeToggle">

  <img
    src="/uxui/topbar/lightmode/lightmodesuntoggle.svg"
    class="theme-toggle-img theme-toggle-img-light"
  />

  <img
    src="/uxui/topbar/darkmode/darkmodemoontoggle.svg"
    class="theme-toggle-img theme-toggle-img-dark"
  />

</button>

</header>

<div class="wrap">
  <!-- Your existing loyalty content stays here -->
</div>

<script>

const toggle = document.getElementById("themeToggle");

function getTheme(){
  return localStorage.getItem("theme") || "light";
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);
}

applyTheme(getTheme());

toggle.addEventListener("click", () => {
  applyTheme(getTheme() === "dark" ? "light" : "dark");
});

</script>

</body>
</html>
