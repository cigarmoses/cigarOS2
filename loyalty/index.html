<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Loyalty</title>
<style>
  :root{--bg:#f5f6fa;--tile:#fff;--radius:20px;--sh:0 4px 10px rgba(0,0,0,.08);--sh2:0 6px 16px rgba(0,0,0,.10);--muted:#667085}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 0 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px} header a{display:inline-flex;text-decoration:none;color:#111;font-weight:700}
  header img{width:32px;height:32px;border-radius:6px}
  .grid{display:grid;grid-template-columns:repeat(2,130px);gap:28px;justify-content:center}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:130px;height:130px;background:var(--tile);border-radius:var(--radius);box-shadow:var(--sh);text-decoration:none;color:#111;transition:.15s transform,.2s box-shadow}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
  .tile svg{width:40px;height:40px;margin-bottom:10px}
  .label{font-weight:800;font-size:14px}
</style></head>
<body>
  <header><a href="/"><img src="/img/logo-smoke.png" alt="Back"/></a><span>Loyalty</span></header>
  <main class="grid">
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21l-7-7a5 5 0 017-7l0 0a5 5 0 017 7l-7 7z" stroke="#2f8cff" stroke-width="1.5"/></svg><div class="label">Enroll</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="#2f8cff" stroke-width="1.5"/><path d="M20 20l-3-3" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Lookup</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="#2f8cff" stroke-width="1.5"/><path d="M7 10h10" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Rewards</div></a>
    <a href="#" class="tile"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#2f8cff" stroke-width="1.5"/><path d="M7 12h10M7 16h7" stroke="#2f8cff" stroke-width="1.5" stroke-linecap="round"/></svg><div class="label">Campaigns</div></a>
  </main>
</body></html>
