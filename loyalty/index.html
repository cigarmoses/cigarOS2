<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Loyalty • CigarOS2</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #8e8e93;
      --seg-bg: #e4e4ea;
      --seg-border: #c7c7cc;

      --tint-locker: #e5f0ff;
      --tint-regular: #fff3e6;
      --hairline: rgba(60,60,67,.18);
      --ios-blue: #007aff;
      --ios-green: #34c759;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 12px 24px;
      position: relative;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-link {
      font-size: 15px;
      color: var(--ios-blue);
      text-decoration: none;
      white-space: nowrap;
    }

    .topbar-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 44px;
      justify-content: flex-end;
    }

    /* Filters button (pill) */
    .filters-btn{
      border: 1px solid rgba(0,0,0,.12);
      background: #fff;
      color: #111;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 0 rgba(0,0,0,.08);
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .filters-btn .dot{
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(0,0,0,.25);
      display:none;
    }
    .filters-btn.active .dot{
      display:block;
      background: var(--ios-blue);
    }

    /* Green + add button */
    .add-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--ios-green);
      font-size: 42px;
      line-height: 0;
      padding: 0;
      cursor: pointer;
      display: none; /* shown only on All tab via JS */
      align-items: center;
      justify-content: center;
    }
    .add-btn span {
      display: block;
      transform: translateY(-2px);
      font-weight: 700;
    }

    h1.page-title {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 800;
      margin: 6px 0 4px;
    }

    /* Segmented control */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      border-radius: 999px;
      background: var(--seg-bg);
      border: 1px solid var(--seg-border);
      margin-top: 0;
      flex: 0 0 auto;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
      min-width: 84px;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 1px 1px rgba(0,0,0,.12);
    }

    /* Tabs row + Filters button */
    .loy-header-row{
      display:flex;
      align-items:center;
      gap: 12px;
      margin-top: 12px;
    }
    .loy-header-row .filters-btn{
      margin-left: auto;
    }

    /* Search */
    .search-wrap { margin-top: 12px; }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 .5px rgba(0,0,0,.12);
    }

    .summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      padding-left: 4px;
      user-select: none;
    }

    /* Applied filter chips */
    .chips{
      margin-top: 10px;
      display:none;
      flex-wrap:wrap;
      gap: 8px;
      padding-left: 2px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.14);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: #111;
      line-height: 1;
    }
    .chip button{
      border:none;
      background: transparent;
      padding: 0;
      cursor:pointer;
      font-weight: 900;
      color: rgba(0,0,0,.45);
      font-size: 14px;
      line-height: 1;
    }

    /* List */
    .list {
      margin-top: 10px;
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,.12);
      position: relative;
    }

    .row {
      min-height: 44px;
      padding: 10px 14px;
      padding-right: 22px; /* reserve for AZ index breathing room */
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--hairline);
      cursor: pointer;
      background: #fff;
      position: relative; /* needed because row-right is absolute */
    }
    .row:last-child { border-bottom: none; }

    .row.locker { background: var(--tint-locker); }
    .row.regular { background: var(--tint-regular); }

    .row-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .row-name {
      font-family: var(--font-text);
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 86px; /* room so text doesn't sit under icons */
    }

    .name-last{ font-weight: 800; }
    .name-first{ font-weight: 500; }

    .locker-num{
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      display: inline-block;
      min-width: 22px;
      margin-right: 12px;
      color: rgba(17,17,17,.9);
    }

    /* ICON cluster (RIGHT SIDE) */
    .row-right{
      position: absolute;
      right: 28px; /* leaves room for AZ index */
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .loy-ico{
      width: 18px;
      height: 18px;
      display: block;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 16px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }

    /* A–Z index */
    .az-index {
      position: fixed;
      right: 6px;
      top: 170px;
      bottom: 80px;
      width: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      z-index: 50;
    }

    .az-letter {
      font-size: 11px;
      line-height: 11px;
      color: rgba(60,60,67,.55);
      font-weight: 600;
      width: 16px;
      text-align: center;
      padding: 1px 0;
      border-radius: 6px;
    }

    .az-letter.active {
      color: var(--ios-blue);
      background: rgba(0,122,255,.12);
    }

    /* Tony FAB */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 40;
    }
    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: inherit;
    }

    /* =========================
       Filters Bottom Sheet
    ========================== */
    .sheet-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display:none;
      z-index: 200;
    }
    .sheet{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -20px 60px rgba(0,0,0,.25);
      transform: translateY(110%);
      transition: transform .22s ease;
      z-index: 201;
      max-height: 82vh;
      overflow: hidden;
      display:flex;
      flex-direction: column;
    }
    .sheet.open{ transform: translateY(0); }
    .sheet-backdrop.open{ display:block; }

    .sheet-grab{
      height: 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: #fff;
    }
    .sheet-grab:before{
      content:"";
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: rgba(0,0,0,.18);
    }

    .sheet-head{
      padding: 10px 14px 8px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    .sheet-title{
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.2px;
    }
    .sheet-actions{
      display:flex;
      gap: 8px;
      align-items:center;
    }
    .sheet-btn{
      border:none;
      background: transparent;
      color: var(--ios-blue);
      font-weight: 800;
      font-size: 14px;
      padding: 8px 8px;
      cursor:pointer;
    }
    .sheet-btn.reset{
      color: rgba(0,0,0,.45);
      font-weight: 800;
    }

    .sheet-body{
      padding: 12px 14px 14px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .sheet-section{ margin-top: 12px; }
    .sheet-section:first-child{ margin-top: 0; }

    .sheet-label{
      font-size: 12px;
      font-weight: 800;
      color: rgba(0,0,0,.55);
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 0 2px 8px;
    }

    .pill-row{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* ✅ Role pill icons */
    .pill-toggle{
      border: 1px solid rgba(0,0,0,.14);
      background: #fff;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap: 10px;
      line-height: 1;
    }
    .pill-toggle.on{
      border-color: rgba(0,122,255,.35);
      background: rgba(0,122,255,.08);
      color: #111;
    }
    .pill-toggle .mini{
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      flex: 0 0 auto;
    }
    .pill-toggle.on .mini{
      background: var(--ios-blue);
    }
    .pill-ico{
      width: 18px;
      height: 18px;
      display:block;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .sheet-search{
      width:100%;
      border:none;
      outline:none;
      background: #f2f2f7;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    /* Brand list */
    .brand-list{
      margin-top: 10px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.06);
      overflow:hidden;
    }
    .brand-row{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(0,0,0,.08);
      cursor:pointer;
    }
    .brand-row:last-child{ border-bottom:none; }

    /* ✅ Brand icon LEFT of name */
    .brand-left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .brand-ico{
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display:block;
      object-fit: contain;
      flex: 0 0 auto;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.06);
      padding: 4px;
    }

    .brand-name{
      font-size: 15px;
      font-weight: 700;
      color: #111;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .brand-check{
      width: 22px;
      height: 22px;
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
      background:#fff;
    }
    .brand-row.on .brand-check{
      box-shadow: inset 0 0 0 2px rgba(0,122,255,.45);
      background: rgba(0,122,255,.10);
    }
    .brand-check svg{
      width: 14px;
      height: 14px;
      display:none;
    }
    .brand-row.on .brand-check svg{
      display:block;
    }

    .sheet-foot{
      padding: 12px 14px 14px;
      border-top: 1px solid rgba(0,0,0,.08);
      background: #fff;
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content: flex-end;
    }
    .apply-btn{
      border:none;
      background: var(--ios-blue);
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor:pointer;
      min-width: 110px;
      box-shadow: 0 6px 20px rgba(0,122,255,.25);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a href="javascript:history.back()" class="back-link">← Back</a>

      <div class="topbar-right">
        <button id="addCustomerBtn" class="add-btn" type="button" aria-label="Add customer">
          <span>+</span>
        </button>
      </div>
    </div>

    <h1 class="page-title">Loyalty</h1>

    <div class="loy-header-row">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="all">All</button>
        <button class="mode-btn" data-mode="regular">Regulars</button>
        <button class="mode-btn" data-mode="lockers">Lockers</button>
      </div>

      <button id="filtersBtn" class="filters-btn" type="button" aria-label="Filters">
        <span class="dot" aria-hidden="true"></span>
        Filters
      </button>
    </div>

    <div class="search-wrap">
      <input id="search" class="search-input" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <div id="summary" class="summary"></div>
    <div id="chips" class="chips" aria-label="Applied filters"></div>
    <div id="list" class="list"></div>

    <footer>CigarOS2 • Loyalty</footer>
  </div>

  <div id="azIndex" class="az-index" aria-hidden="true"></div>

  <!-- Filters Sheet -->
  <div id="filterBackdrop" class="sheet-backdrop" aria-hidden="true"></div>

  <section id="filterSheet" class="sheet" role="dialog" aria-modal="true" aria-label="Loyalty Filters">
    <div class="sheet-grab" aria-hidden="true"></div>

    <div class="sheet-head">
      <div class="sheet-title">Filters</div>
      <div class="sheet-actions">
        <button id="filtersReset" class="sheet-btn reset" type="button">Reset</button>
        <button id="filtersClose" class="sheet-btn" type="button">Done</button>
      </div>
    </div>

    <div class="sheet-body">
      <div class="sheet-section">
        <div class="sheet-label">Roles</div>
        <div class="pill-row">
          <button class="pill-toggle" type="button" data-role="Military">
            <span class="mini"></span>
            <img class="pill-ico" src="/img/icons/loyalty/military.svg" alt="" aria-hidden="true"
              onerror="this.style.display='none';" />
            Military
          </button>

          <button class="pill-toggle" type="button" data-role="Police">
            <span class="mini"></span>
            <img class="pill-ico" src="/img/icons/loyalty/police.svg" alt="" aria-hidden="true"
              onerror="this.style.display='none';" />
            Police
          </button>

          <button class="pill-toggle" type="button" data-role="Firefighter">
            <span class="mini"></span>
            <img class="pill-ico" src="/img/icons/loyalty/firefighter.svg" alt="" aria-hidden="true"
              onerror="this.style.display='none';" />
            Firefighter
          </button>

          <button class="pill-toggle" type="button" data-role="Paramedic">
            <span class="mini"></span>
            <img class="pill-ico" src="/img/icons/loyalty/paramedic.svg" alt="" aria-hidden="true"
              onerror="this.style.display='none';" />
            Paramedic
          </button>
        </div>
      </div>

      <div class="sheet-section">
        <div class="sheet-label">Fav Brands</div>
        <input id="brandSearch" class="sheet-search" type="search" placeholder="Search brands" autocomplete="off" />
        <div id="brandList" class="brand-list"></div>
      </div>
    </div>

    <div class="sheet-foot">
      <button id="filtersApply" class="apply-btn" type="button">Apply</button>
    </div>
  </section>

  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script src="/loyalty/loyalty.js" defer></script>
</body>
</html>
