<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Loyalty • CigarOS2</title>

  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #8e8e93;
      --seg-bg: #e4e4ea;
      --seg-border: #c7c7cc;

      --tint-locker: #e5f0ff;
      --tint-regular: #fff3e6;
      --hairline: rgba(60,60,67,.18);
      --ios-blue: #007aff;
      --ios-green: #34c759;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 12px 24px;
      position: relative;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-link {
      font-size: 15px;
      color: var(--ios-blue);
      text-decoration: none;
      white-space: nowrap;
    }

    .topbar-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 44px;
      justify-content: flex-end;
    }

    /* Green + add button */
    .add-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--ios-green);
      font-size: 34px;
      line-height: 0;
      padding: 0;
      cursor: pointer;
      display: none; /* shown only on All tab via JS */
      align-items: center;
      justify-content: center;
    }
    .add-btn span {
      display: block;
      transform: translateY(-2px);
      font-weight: 700;
    }

    h1.page-title {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 800;
      margin: 6px 0 4px;
    }

    /* Segmented control */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      border-radius: 999px;
      background: var(--seg-bg);
      border: 1px solid var(--seg-border);
      margin-top: 12px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
      min-width: 84px;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 1px 1px rgba(0,0,0,.12);
    }

    /* Search */
    .search-wrap { margin-top: 12px; }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 .5px rgba(0,0,0,.12);
    }

    .summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      padding-left: 4px;
      user-select: none;
    }

    /* List */
    .list {
      margin-top: 10px;
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,.12);
      position: relative;
    }

    /* iOS Contacts-ish row sizing */
    .row {
      min-height: 44px;
      padding: 10px 14px;
      padding-right: 34px; /* reserve space for AZ index + breathing room */
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--hairline);
      cursor: pointer;
      background: #fff;
      position: relative;
    }
    .row:last-child { border-bottom: none; }

    .row.locker { background: var(--tint-locker); }
    .row.regular { background: var(--tint-regular); }

    .row-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .row-name {
      font-family: var(--font-text);
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Name weights */
    .name-last{ font-weight: 800; }
    .name-first{ font-weight: 500; }

    /* Locker number styling: NOT bold + nice indent */
    .locker-num{
      font-weight: 500;            /* not bold */
      font-variant-numeric: tabular-nums;
      display: inline-block;
      min-width: 22px;
      margin-right: 10px;          /* indent between # and last name */
      color: rgba(17,17,17,.9);
    }

    /* Icon cluster — spacing aligned to your purple reference */
    .row-right {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-left: 8px;
      margin-right: 34px;
    }

    .row-right img {
      width: 18px !important;
      height: 18px !important;
      max-width: 18px !important;
      max-height: 18px !important;
      object-fit: contain;
      display: block;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 16px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }

    /* A–Z index (right side) */
    .az-index {
      position: fixed;
      right: 6px;
      top: 170px;
      bottom: 80px;
      width: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      z-index: 50;
    }

    .az-letter {
      font-size: 11px;
      line-height: 11px;
      color: rgba(60,60,67,.55);
      font-weight: 600;
      width: 16px;
      text-align: center;
      padding: 1px 0;
      border-radius: 6px;
    }

    .az-letter.active {
      color: var(--ios-blue);
      background: rgba(0,122,255,.12);
    }

    /* Add Customer dialog */
    dialog#addCustomerDialog{
      border: none;
      border-radius: 18px;
      padding: 0;
      width: 92vw;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      overflow: hidden;
    }
    .dlg-wrap{
      padding: 14px 14px 12px;
      background: #fff;
      font-family: var(--font-text);
    }
    .dlg-title{
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      line-height: 1.2;
    }
    .dlg-sub{
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .dlg-form{
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }
    .dlg-input{
      width: 100%;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
    }
    .dlg-actions{
      margin-top: 14px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,.08);
    }
    .btn{
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-cancel{
      background: rgba(0,0,0,.06);
      color: #111;
    }
    .btn-save{
      background: var(--ios-green);
      color: #fff;
    }

    /* =========================
       PROFILE POPUP (YOUR TARGET)
       ========================= */
    dialog#profileDialog{
      border: none;
      border-radius: 22px;
      padding: 0;
      width: 92vw;
      max-width: 560px;
      box-shadow: 0 22px 70px rgba(0,0,0,.28);
      overflow: hidden;
      background: #fff;
    }
    dialog#profileDialog::backdrop{
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(2px);
    }
    .profile-wrap{
      padding: 18px 18px 14px;
      background: #fff;
      font-family: var(--font-text);
    }
    .profile-top{
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .profile-name{
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 40px;
      line-height: 1.02;
      letter-spacing: -0.6px;
      margin: 0;
    }
    .profile-points{
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--ios-green);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      min-width: 54px;
      line-height: 1;
    }
    .profile-meta{
      margin-top: 6px;
      color: rgba(17,17,17,.72);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.25;
    }
    .profile-meta .aka{
      display: block;
      color: rgba(17,17,17,.62);
      font-weight: 600;
    }
    .profile-meta .tier{
      display: block;
      color: rgba(17,17,17,.62);
      font-weight: 700;
    }

    .profile-details{
      margin-top: 18px;
      color: rgba(17,17,17,.55);
      font-size: 16px;
      line-height: 1.25;
      white-space: pre-line;
    }
    .profile-divider{
      margin-top: 18px;
      height: 1px;
      background: rgba(0,0,0,.08);
    }
    .profile-footer{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 16px;
      background: #fff;
    }
    .profile-x{
      border: none;
      background: transparent;
      color: #ff3b30;
      font-size: 22px;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .profile-done{
      border: none;
      background: var(--ios-blue);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      min-width: 92px;
    }

    /* Tony FAB */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 40;
    }

    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: inherit;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a href="javascript:history.back()" class="back-link">← Back</a>

      <div class="topbar-right">
        <button id="addCustomerBtn" class="add-btn" type="button" aria-label="Add customer">
          <span>+</span>
        </button>
      </div>
    </div>

    <h1 class="page-title">Loyalty</h1>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="all">All</button>
      <button class="mode-btn" data-mode="regular">Regulars</button>
      <button class="mode-btn" data-mode="lockers">Lockers</button>
    </div>

    <div class="search-wrap">
      <input id="search" class="search-input" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <div id="summary" class="summary"></div>
    <div id="list" class="list"></div>

    <footer>CigarOS2 • Loyalty</footer>
  </div>

  <div id="azIndex" class="az-index" aria-hidden="true"></div>

  <!-- PROFILE POPUP -->
  <dialog id="profileDialog">
    <div class="profile-wrap">
      <div class="profile-top">
        <div>
          <h2 id="pName" class="profile-name">—</h2>
          <div class="profile-meta">
            <span id="pAka" class="aka" style="display:none;">aka —</span>
            <span id="pTier" class="tier">—</span>
          </div>
        </div>
        <div id="pPointsPill" class="profile-points">0</div>
      </div>

      <div id="pDetails" class="profile-details">—</div>

      <div class="profile-divider"></div>
    </div>

    <div class="profile-footer">
      <button id="pCloseX" class="profile-x" type="button" aria-label="Close">X</button>
      <button id="pDone" class="profile-done" type="button">Done</button>
    </div>
  </dialog>

  <!-- Add Customer Dialog -->
  <dialog id="addCustomerDialog">
    <div class="dlg-wrap">
      <div class="dlg-title">Add Customer</div>
      <div class="dlg-sub">First, last, cell, email (for now)</div>

      <div class="dlg-form">
        <input id="acFirst" class="dlg-input" placeholder="First name" autocomplete="off" />
        <input id="acLast" class="dlg-input" placeholder="Last name" autocomplete="off" />
        <input id="acPhone" class="dlg-input" placeholder="Cell" inputmode="tel" autocomplete="off" />
        <input id="acEmail" class="dlg-input" placeholder="Email" inputmode="email" autocomplete="off" />
      </div>

      <div class="dlg-actions">
        <button id="acCancel" class="btn btn-cancel" type="button">Cancel</button>
        <button id="acSave" class="btn btn-save" type="button">Save</button>
      </div>
    </div>
  </dialog>

  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script src="/loyalty/loyalty.js" defer></script>
</body>
</html>
