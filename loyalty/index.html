<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loyalty • CigarOS2</title>

  <style>
    :root {
      --bg: #edf3f9;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #6e7b8f;
      --blue-pill: #cfeeff;
      --peach-pill: #ffe0d7;
      --locker-row: #d6ecff;
      --regular-row: #ffe9e1;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 12px 24px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .back-link {
      font-size: 15px;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.03);
    }

    .back-link:hover {
      background: rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Mode toggle */
    .mode-toggle {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 6px 16px rgba(15,26,44,0.12);
      margin-top: 12px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 7px 14px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
    }

    .mode-btn.active {
      background: var(--blue-pill);
      color: var(--ink);
    }

    .mode-btn[data-mode="regular"].active {
      background: var(--peach-pill);
    }

    /* Search bar */
    .search-wrap {
      margin-top: 14px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid #d1d8e2;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #96b7ff;
      box-shadow: 0 0 0 1px #c4d7ff;
    }

    /* Summary */
    .summary {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    /* List */
    .list {
      margin-top: 12px;
      padding-bottom: 40px;
    }

    .row {
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(15,26,44,0.06);
    }

    .row.locker {
      background: linear-gradient(120deg, var(--locker-row), #f8fbff);
    }

    .row.regular {
      background: linear-gradient(120deg, var(--regular-row), #fff8f4);
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .name {
      font-weight: 600;
      font-size: 15px;
    }

    .nickname {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .points-pill {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,0.06);
    }

    .meta-line {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-pill {
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0,0,0,0.05);
    }

    .contact-line {
      margin-top: 6px;
      font-size: 12px;
    }

    .empty-state {
      margin-top: 40px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 16px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="javascript:history.back()" class="back-link">← Back</a>
      <div></div>
    </div>

    <h1>Loyalty</h1>
    <div class="subtitle">Lockers, regulars & rewards contacts</div>

    <div class="mode-toggle" aria-label="Contact type toggle">
      <button class="mode-btn active" data-mode="lockers">Lockers</button>
      <button class="mode-btn" data-mode="regular">Regulars</button>
    </div>

    <div class="search-wrap">
      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="Search by name, locker, phone, email..."
        autocomplete="off"
      />
    </div>

    <div id="summary" class="summary"></div>

    <div id="list" class="list"></div>

    <footer>
      CigarOS2 • Loyalty
    </footer>
  </div>

  <script src="/loyalty/loyalty.js" defer></script>
</body>
</html>
