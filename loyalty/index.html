<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Loyalty • CigarOS2</title>

  <!-- Global SF Pro type system -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #8e8e93;
      --seg-bg: #e4e4ea;
      --seg-border: #c7c7cc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 12px 24px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-link {
      font-size: 15px;
      color: #007aff;
      text-decoration: none;
    }

    h1.page-title {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 800;
      margin: 6px 0 4px;
    }

    /* Segmented control */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      border-radius: 999px;
      background: var(--seg-bg);
      border: 1px solid var(--seg-border);
      margin-top: 12px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
      min-width: 84px;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 1px 1px rgba(0,0,0,.12);
    }

    /* Search */
    .search-wrap { margin-top: 12px; }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 .5px rgba(0,0,0,.12);
    }

    .summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      padding-left: 4px;
    }

    /* List */
    .list {
      margin-top: 10px;
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,.12);
    }

    .row {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: .5px solid #d1d1d6;
      cursor: pointer;
    }

    .row:last-child { border-bottom: none; }

    .row.locker { background: #e5f0ff; }
    .row.regular { background: #fff3e6; }

    .row-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .row-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ✅ Add this CSS (small + safe) */
    .name-last{
      font-weight: 800; /* SF Pro Display Heavy */
    }

    .name-first{
      font-weight: 500; /* SF Pro Display Medium */
      margin-left: 4px;
    }

    .row-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-right {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .row-right img {
      width: 18px !important;
      height: 18px !important;
      max-width: 18px !important;
      max-height: 18px !important;
      object-fit: contain;
      display: block;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 16px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }

    /* Tony FAB */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 40;
    }

    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: inherit;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a href="javascript:history.back()" class="back-link">← Back</a>
      <div></div>
    </div>

    <h1 class="page-title">Loyalty</h1>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="all">All</button>
      <button class="mode-btn" data-mode="regular">Regulars</button>
      <button class="mode-btn" data-mode="lockers">Lockers</button>
    </div>

    <div class="search-wrap">
      <input id="search" class="search-input" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <div id="summary" class="summary"></div>
    <div id="list" class="list"></div>

    <footer>CigarOS2 • Loyalty</footer>
  </div>

  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script src="/loyalty/loyalty.js" defer></script>
</body>
</html>
