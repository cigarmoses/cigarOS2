<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Disable iOS auto-detected links so emails/phones are not underlined -->
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>Loyalty • CigarOS2</title>

  <!-- Global SF Pro type system -->
  <link rel="stylesheet" href="/css/type.css" />

  <style>
    :root {
      --bg: #f2f2f7;        /* iOS background */
      --surface: #ffffff;   /* white cards / list */
      --ink: #111111;
      --muted: #8e8e93;
      --seg-bg: #e4e4ea;
      --seg-border: #c7c7cc;
      --all-active: #e5fbe7;
      --all-active-text: #034d1b;
      --reg-active: #fff2e5;
      --reg-active-text: #8a3a00;
      --lock-active: #e5f0ff;
      --lock-active-text: #003e9f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-text); /* use global SF Pro Text */
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 12px 24px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .back-link {
      font-size: 15px;
      color: #007aff;
      text-decoration: none;
      padding: 4px 0;
    }

    h1.page-title {
      font-size: 30px;
      font-weight: 700;
      margin: 4px 0 0;
    }

    /* Mode toggle – iOS segmented control style */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      border-radius: 999px;
      background: var(--seg-bg);
      border: 1px solid var(--seg-border);
      margin-top: 12px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 500;
      min-width: 80px;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 1px rgba(0,0,0,0.12);
    }

    .mode-btn[data-mode="all"].active {
      background: #e5fbe7;
      color: #034d1b;
    }

    .mode-btn[data-mode="regular"].active {
      background: #fff2e5;
      color: #8a3a00;
    }

    .mode-btn[data-mode="lockers"].active {
      background: #e5f0ff;
      color: #003e9f;
    }

    /* Search bar */
    .search-wrap {
      margin-top: 12px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12);
    }

    .search-input:focus {
      box-shadow: 0 0 0 1px #0a84ff;
    }

    /* Summary */
    .summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      padding-left: 4px;
    }

    /* List container */
    .list {
      margin-top: 10px;
      background: var(--surface);
      border-radius: 14px;
      padding: 0; /* so row highlight spans full width of card */
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
      overflow: hidden; /* keep rounded corners clean with full-width rows */
    }

    .row {
      padding: 8px 16px; /* moved padding from .list to each row */
      margin: 0;
      display: flex;
      flex-direction: column;
      border-bottom: 0.5px solid #d1d1d6;
      cursor: pointer;
      background: #ffffff;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row.locker {
      background: #e5f0ff; /* blue tint across full row */
    }

    .row.regular {
      background: #fff3e6; /* orange tint across full row */
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .name.customer-name {
      font-weight: 600;
      font-size: 16px;
    }

    .nickname {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .points-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f2f2f7;
      color: var(--muted);
      white-space: nowrap;
    }

    .meta-line {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .meta-pill {
      padding: 1px 6px;
      border-radius: 999px;
      background: #f2f2f7;
    }

    .contact-line {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .empty-state {
      padding: 16px 0;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 16px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }

    /* Profile dialog */
    dialog#profileDialog {
      border: none;
      padding: 0;
      border-radius: 16px;
      max-width: 520px;
      width: calc(100% - 32px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.35);
    }

    .profile-card {
      padding: 16px 18px 18px;
      background: #f2f2f7;
      border-radius: 16px;
      position: relative;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
    }

    .profile-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .profile-points {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #0a84ff1a;
      color: #0a84ff;
      white-space: nowrap;
    }

    .profile-close {
      position: absolute;
      top: 6px;
      right: 10px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
    }

    .profile-sections {
      margin-top: 6px;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .profile-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 4px 0 6px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      padding: 4px 0;
      border-bottom: 0.5px solid #e5e5ea;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: var(--muted);
    }

    .profile-value {
      text-align: right;
      max-width: 60%;
      word-wrap: break-word;
    }

    .profile-multi-line {
      font-size: 13px;
      padding: 2px 0 4px;
    }

    .profile-multi-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .chip {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #f2f2f7;
    }

    .visit-list {
      font-size: 13px;
      margin-top: 4px;
    }

    .visit-item {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .visit-date {
      color: var(--muted);
    }

    .visit-amount {
      font-weight: 500;
    }

    .visit-actions {
      margin-top: 4px;
      text-align: right;
    }

    .profile-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      gap: 8px;
    }

    .btn-ghost {
      border-radius: 999px;
      padding: 6px 14px;
      border: 1px solid #c7c7cc;
      background: #ffffff;
      font-size: 13px;
      cursor: pointer;
    }

    .profile-card.editing .profile-editable {
      outline: 1px solid #0a84ff;
      background: #ffffff;
    }

    /* Tony floating icon bottom-left */
    .tony-fab {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 40;
    }
    .tony-fab img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="javascript:history.back()" class="back-link">← Back</a>
      <div></div>
    </div>

    <h1 class="page-title">Loyalty</h1>

    <div class="mode-toggle" aria-label="Contact type toggle">
      <button class="mode-btn active" data-mode="all">All</button>
      <button class="mode-btn" data-mode="regular">Regulars</button>
      <button class="mode-btn" data-mode="lockers">Lockers</button>
    </div>

    <div class="search-wrap">
      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="Search"
        autocomplete="off"
      />
    </div>

    <div id="summary" class="summary"></div>

    <div id="list" class="list"></div>

    <footer>
      CigarOS2 • Loyalty
    </footer>
  </div>

  <!-- Profile dialog (unchanged) -->
  <dialog id="profileDialog">
    <div class="profile-card" id="profileCard">
      <button class="profile-close" type="button" aria-label="Close">&times;</button>

      <div class="profile-header">
        <div>
          <div class="profile-name" id="pName">Customer Name</div>
          <div class="profile-sub" id="pSub">Locker • Contact</div>
        </div>
        <div class="profile-points" id="pPoints">0 pts</div>
      </div>

      <!-- Purchase history -->
      <div class="profile-sections">
        <div class="profile-section-title">Purchase History</div>
        <div class="profile-row">
          <div class="profile-label">Last purchase</div>
          <div class="profile-value profile-editable" data-field="Last Purchase" id="pLastPurchase">—</div>
        </div>
        <div class="visit-list" id="pVisitList"></div>
        <div class="visit-actions">
          <button class="btn-ghost" type="button" id="viewAllVisitsBtn">View all</button>
        </div>
      </div>

      <!-- Contact -->
      <div class="profile-sections">
        <div class="profile-section-title">Contact</div>
        <div class="profile-row">
          <div class="profile-label">Phone</div>
          <div class="profile-value profile-editable" data-field="Phone" id="pPhone">—</div>
        </div>
        <div class="profile-row">
          <div class="profile-label">Email</div>
          <div class="profile-value profile-editable" data-field="Email" id="pEmail">—</div>
        </div>
        <div class="profile-row">
          <div class="profile-label">Birthday</div>
          <div class="profile-value profile-editable" data-field="Birthday" id="pBirthday">—</div>
        </div>
      </div>

      <!-- Favorites -->
      <div class="profile-sections">
        <div class="profile-section-title">Favorites</div>
        <div class="profile-multi-line">
          <div class="profile-multi-label">Brands</div>
          <div class="chip-list" id="pFavBrands"></div>
        </div>
        <div class="profile-multi-line">
          <div class="profile-multi-label">Cigars</div>
          <div class="chip-list" id="pFavCigars"></div>
        </div>
        <div class="profile-row">
          <div class="profile-label">Ring preference</div>
          <div class="profile-value profile-editable" data-field="Ring Pref" id="pRingPref">—</div>
        </div>
      </div>

      <!-- Wishlist -->
      <div class="profile-sections">
        <div class="profile-section-title">Wishlist</div>
        <div class="profile-multi-line">
          <div class="profile-multi-label">Items</div>
          <div class="chip-list profile-editable" data-field="Wishlist" id="pWishlist"></div>
        </div>
      </div>

      <!-- Loyalty stats pills -->
      <div class="profile-sections">
        <div class="profile-section-title">Loyalty Stats</div>
        <div class="chip-list">
          <span class="chip profile-editable" data-field="YTD spend" id="pStatYtd">—</span>
          <span class="chip profile-editable" data-field="90-day visits" id="pStatVisits90">—</span>
          <span class="chip profile-editable" data-field="Gift card balance" id="pStatGift">—</span>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn-ghost" id="editProfileBtn" type="button">Edit</button>
      </div>
    </div>
  </dialog>

  <!-- Tony floating icon (bottom-left, same on all pages) -->
  <button class="tony-fab" id="tonyFab">
    <img src="/uxui/pop-up-ask-tony-grey-border.svg" alt="Ask Tony" />
  </button>

  <script src="/loyalty/loyalty.js" defer></script>
</body>
</html>
