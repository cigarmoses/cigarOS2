<!doctype html>
<html lang="en" data-theme="light">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no,email=no,address=no"/>

<title>Loyalty • CigarOS2</title>

<link rel="stylesheet" href="/css/type.css"/>

<style>
:root{
  --bg:#eff2f7;
  --ink:#101828;
}

html[data-theme="dark"]{
  --bg:#0b1323;
  --ink:#ffffff;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-text);
}

/* ===== TOPBAR ===== */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
}

/* BACK BUTTON */

.tb-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.08);
  background:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
}

/* ===== TOGGLE ===== */

.theme-toggle{
  position:relative;
  width:46px;
  height:22px;
  border:0;
  background:transparent;
  cursor:pointer;
}

.theme-toggle img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.theme-toggle .dark{
  display:none;
}

html[data-theme="dark"] .theme-toggle .light{
  display:none;
}

html[data-theme="dark"] .theme-toggle .dark{
  display:block;
}

/* ===== CONTENT ===== */

.wrap{
  padding:18px;
}

.page-title{
  font-size:48px;
  font-weight:800;
  margin:10px 0 20px;
}
</style>

</head>

<body>

<header class="topbar">

<button class="tb-btn" id="backBtn">
  ‹
</button>

<button class="theme-toggle" id="themeToggle">
  <img class="light" src="/uxui/topbar/lightmode/lightmodesuntoggle.svg">
  <img class="dark" src="/uxui/topbar/darkmode/darkmodemoontoggle.svg">
</button>

</header>

<div class="wrap">
  <h1 class="page-title">Loyalty</h1>
</div>

<script>
const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
const backBtn = document.getElementById("backBtn");

function systemTheme(){
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function getTheme(){
  return localStorage.getItem("theme") || systemTheme();
}

function setTheme(t){
  root.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
}

setTheme(getTheme());

toggle.addEventListener("click", () => {
  setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
});

backBtn.addEventListener("click", () => {
  if (history.length > 1) history.back();
  else window.location.href = "/";
});
</script>

</body>
</html>
