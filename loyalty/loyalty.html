<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loyalty • CigarOS 2</title>
  <style>
    :root {
      --bg: #edf3f9;
      --surface: #ffffff;
      --ink: #0f1a2c;
      --muted: #6e7b8f;
      --blue-pill: #cfeeff;
      --peach-pill: #ffe0d7;
      --locker-row: #d6ecff;
      --regular-row: #ffe9e1;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    .page {
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* top search */
    .search-box {
      background: var(--surface);
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      box-shadow: 0 10px 26px rgba(15,26,44,.03);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .search-box input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      font-size: .75rem;
    }

    /* pills */
    .segmented {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .seg-btn {
      background: var(--surface);
      border-radius: 999px;
      padding: 7px 16px;
      border: 1px solid transparent;
      font-size: .7rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .seg-btn.lockers.active {
      background: #cfeeff;
      border-color: rgba(102, 173, 221, .15);
      color: #12486c;
    }
    .seg-btn.regulars.active {
      background: #ffe0d7;
      border-color: rgba(234, 143, 105, .15);
      color: #7c2f1b;
    }

    /* list */
    .list-wrap {
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(15,26,44,.03);
    }

    .list-header {
      display: grid;
      grid-template-columns: 0.3fr 1fr 0.3fr 0.5fr;
      padding: 10px 14px;
      background: #f3f7fb;
      font-size: .7rem;
      font-weight: 600;
    }

    .row {
      display: grid;
      grid-template-columns: 0.3fr 1fr 0.3fr 0.5fr;
      padding: 10px 14px;
      gap: 6px;
      align-items: center;
      font-size: .7rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(0,0,0,.02);
    }
    .row:last-child { border-bottom: 0; }

    .row.locker { background: var(--locker-row); }
    .row.regular { background: #fff; } /* base, container is peach behind */

    .locker-badge {
      width: 34px;
      height: 28px;
      border-radius: 12px;
      background: rgba(169, 211, 255, 0.6);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: .65rem;
      color: #0f1a2c;
    }

    .regular-bg {
      background: var(--regular-row);
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 26, 44, 0.25);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 998;
    }

    .modal {
      background: #fff;
      border-radius: 26px;
      width: min(92vw, 460px);
      box-shadow: 0 18px 38px rgba(15,26,44,.18);
      padding: 16px 16px 10px;
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .cust-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .nickname {
      font-size: .7rem;
      color: var(--muted);
    }

    .icon-stack {
      display: flex;
      gap: 6px;
    }
    .small-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #445232;
    }
    .small-icon:nth-child(2) {
      background: #a77549;
    }

    .divider {
      height: 1px;
      background: rgba(227, 231, 236, 1);
      margin: 10px -16px 10px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      gap: 10px;
    }

    .field-label {
      font-weight: 600;
      font-size: .70rem;
    }

    .field-value {
      font-size: .70rem;
      color: var(--muted);
      text-align: right;
    }

    .full-link {
      color: #0f63d1;
      font-size: .7rem;
      text-decoration: underline;
      display: inline-block;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    .close-btn {
      border: 0;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #f1f4f7;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    @media (max-width: 540px) {
      .list-header,
      .row {
        grid-template-columns: 0.4fr 1fr 0.4fr 0.6fr;
      }
      .modal {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- search -->
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="5" stroke="#6e7b8f" stroke-width="1.4"></circle>
        <path d="m15 15 3.5 3.5" stroke="#6e7b8f" stroke-width="1.4" stroke-linecap="round"></path>
      </svg>
      <input id="searchInput" type="text" placeholder="Search" oninput="filterRows()" />
    </div>

    <!-- pills -->
    <div class="segmented">
      <button class="seg-btn lockers active" onclick="switchMode('lockers')">Lockers ▾</button>
      <button class="seg-btn regulars" onclick="switchMode('regulars')">Regulars ▾</button>
    </div>

    <!-- list -->
    <div class="list-wrap" id="listWrap">
      <div class="list-header">
        <div></div>
        <div>Name</div>
        <div>Pts</div>
        <div>Last Visit</div>
      </div>
      <!-- rows injected -->
    </div>
  </div>

  <!-- modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-top">
        <div>
          <div class="cust-name" id="mName">—</div>
          <div class="nickname" id="mNickname">—</div>
        </div>
        <div class="icon-stack">
          <!-- placeholder icons -->
          <div class="small-icon" title="Regular"></div>
          <div class="small-icon" title="Locker"></div>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field-row">
        <div class="field-label">Phone</div>
        <div class="field-value" id="mPhone">—</div>
      </div>
      <div class="field-row">
        <div class="field-label">Email</div>
        <div class="field-value" id="mEmail">—</div>
      </div>
      <div class="field-row">
        <div class="field-label">Birthday</div>
        <div class="field-value" id="mBirthday">—</div>
      </div>
      <div class="field-row">
        <div class="field-label">Points</div>
        <div class="field-value" id="mPoints">0</div>
      </div>
      <div class="field-row">
        <div class="field-label">Favorite Brands /or Cigars</div>
        <div class="field-value" id="mFav">—</div>
      </div>
      <div class="field-row">
        <div class="field-label">Wishlist</div>
        <div class="field-value" id="mWishlist">—</div>
      </div>
      <div class="field-row">
        <div class="field-label">Connections</div>
        <div class="field-value" id="mConnections">—</div>
      </div>
      <div class="field-row">
        <div class="field-label">Last Purchase</div>
        <div class="field-value" id="mLastPurchase">—</div>
      </div>

      <a href="#" class="full-link">Click for full purchase history here</a>
    </div>
  </div>

  <script>
    // sample data based on your screenshots
    const lockerData = [
      { lockerNo: 2, name: "Kennedy Doug", pts: 0, last: "—" },
      { lockerNo: 2, name: "Schneider Glenn", pts: 0, last: "—" },
      { lockerNo: 4, name: "Johnson DJ", pts: 0, last: "—", nickname: "DJ" },
      { lockerNo: 4, name: "Skittle Matt", pts: 0, last: "—", nickname: "Skittle" },
      { lockerNo: 5, name: "Proctor Tom", pts: 0, last: "—" },
      { lockerNo: 6, name: "Foltz Ken", pts: 0, last: "—" },
      { lockerNo: 7, name: "Davis Gil", pts: 0, last: "—" },
      { lockerNo: 8, name: "Cellini Chuck", pts: 0, last: "—" },
      { lockerNo: 8, name: "Fahd Anthony", pts: 0, last: "—" },
      { lockerNo: 9, name: "Woodyard Tom", pts: 0, last: "—", nickname: "Woody" },
      { lockerNo: 10, name: "Ciganik Max", pts: 0, last: "—" }
    ];

    const regularData = [
      { name: "Cottrill Jimmy", nickname: "Sweats", pts: 0, last: "—" },
      { name: "Fleisner Jim", pts: 0, last: "—" },
      { name: "Flukas Bob", pts: 0, last: "—" },
      { name: "Foster Brad", pts: 0, last: "—" },
      { name: "Hobbs David", pts: 0, last: "—" },
      { name: "Moses Tony", nickname: "Michael's dad", pts: 0, last: "—" },
      { name: "Stiffey Timothy", pts: 0, last: "—" },
      { name: "Takos Dimitrios", pts: 0, last: "—" },
      { name: "Votta Adam", pts: 0, last: "—" },
      { name: "Watson David", pts: 0, last: "—" },
      { name: "Welding Alan", pts: 0, last: "—" },
    ];

    let currentMode = "lockers";
    let currentData = lockerData.slice();

    function renderList() {
      const wrap = document.getElementById("listWrap");
      // remove old rows
      wrap.querySelectorAll(".row").forEach(r => r.remove());

      currentData.forEach((item, i) => {
        const row = document.createElement("div");
        if (currentMode === "lockers") {
          row.className = "row locker";
          row.innerHTML = `
            <div><div class="locker-badge">${item.lockerNo ?? ""}</div></div>
            <div>${item.name}</div>
            <div>${item.pts ?? 0}</div>
            <div>${item.last ?? "—"}</div>
          `;
        } else {
          // regulars
          row.className = "row regular regular-bg";
          row.innerHTML = `
            <div></div>
            <div>${item.name}${item.nickname ? `<div style="font-size:.6rem;color:rgba(15,26,44,.45);">"${item.nickname}"</div>` : ""}</div>
            <div>${item.pts ?? 0}</div>
            <div>${item.last ?? "—"}</div>
          `;
        }
        row.addEventListener("click", () => openModal(item));
        wrap.appendChild(row);
      });
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelector(".seg-btn.lockers").classList.toggle("active", mode === "lockers");
      document.querySelector(".seg-btn.regulars").classList.toggle("active", mode === "regulars");
      currentData = mode === "lockers" ? lockerData.slice() : regularData.slice();
      document.getElementById("searchInput").value = "";
      renderList();
    }

    function filterRows() {
      const val = document.getElementById("searchInput").value.toLowerCase();
      const base = currentMode === "lockers" ? lockerData : regularData;
      currentData = base.filter(r => r.name.toLowerCase().includes(val));
      renderList();
    }

    function openModal(item) {
      document.getElementById("mName").textContent = item.name || "—";
      document.getElementById("mNickname").textContent = item.nickname || "—";
      document.getElementById("mPhone").textContent = item.phone || "—";
      document.getElementById("mEmail").textContent = item.email || "—";
      document.getElementById("mBirthday").textContent = item.birthday || "—";
      document.getElementById("mPoints").textContent = item.pts ?? 0;
      document.getElementById("mFav").textContent = item.fav || "—";
      document.getElementById("mWishlist").textContent = item.wishlist || "—";
      document.getElementById("mConnections").textContent = item.connections || "—";
      document.getElementById("mLastPurchase").textContent = item.lastPurchase || "—";
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    // initial
    renderList();
  </script>
</body>
</html>
